*{box-sizing:border-box}

<script>
const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "¿Cuál es el objetivo principal de un ataque de ransomware según se define en el tema?", "o": ["Interrumpir el acceso legítimo a un servicio mediante saturación de tráfico", "Impedir el acceso a sistemas o a la información mediante bloqueo o cifrado, exigiendo un pago económico para su recuperación", "Obtener información sensible haciéndose pasar por una entidad de confianza", "Aprovechar una debilidad de un sistema para ejecutar código no autorizado"], "c": [1], "e": "El ransomware busca impedir el acceso a sistemas o información mediante bloqueo o cifrado, exigiendo un pago para recuperarla.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "Según la secuencia típica de un ataque de ransomware, ¿qué suele ocurrir inmediatamente antes del cifrado en los incidentes actuales?", "o": ["La generación de una nota de rescate", "La exfiltración de datos, para poder ejercer una doble presión sobre la víctima", "El acceso inicial mediante RDP expuesto", "El movimiento lateral dentro de la red"], "c": [1], "e": "En los incidentes actuales, justo antes del cifrado suele producirse la exfiltración de datos, para ejercer una doble presión sobre la víctima.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "¿Qué característica distingue especialmente a una filtración de datos (data breach) de otros ciberataques?", "o": ["Su efecto es siempre inmediatamente perceptible", "Solo puede tener origen en un ataque informático externo", "Puede permanecer sin detectarse durante periodos prolongados, sin que el descubrimiento coincida con el momento del compromiso inicial", "Nunca afecta a información policial o judicial"], "c": [2], "e": "Una filtración de datos puede permanecer sin detectarse durante periodos prolongados: el descubrimiento no coincide necesariamente con el momento del compromiso.", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "¿Cuál de las siguientes NO es necesariamente una causa de una filtración de datos según el tema?", "o": ["Una configuración incorrecta de un servicio", "El envío de documentación al destinatario equivocado", "La pérdida de un dispositivo", "La existencia de una puntuación CVSS elevada"], "c": [3], "e": "Una puntuación CVSS elevada mide la severidad de una vulnerabilidad, pero no es necesariamente causa de una filtración; sí lo son una mala configuración, un envío erróneo o la pérdida de un dispositivo.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "¿Qué elemento diferencia a un ataque DDoS de un ataque DoS convencional?", "o": ["El DDoS siempre afecta a servicios bancarios", "El DDoS procede de un único origen concentrado", "En el DDoS el tráfico malicioso procede de numerosos sistemas o dispositivos que actúan simultáneamente", "El DoS requiere necesariamente una botnet"], "c": [2], "e": "En el DDoS el tráfico malicioso procede de numerosos sistemas que actúan a la vez; en el DoS, de un único origen.", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "¿Qué es una botnet en el contexto de los ataques DDoS?", "o": ["Un protocolo de red vulnerable a la amplificación", "Una red de dispositivos previamente comprometidos mediante malware y controlados de forma remota", "Un sistema de puntuación de severidad de vulnerabilidades", "Una técnica de suplantación de la dirección IP de origen"], "c": [1], "e": "Una botnet es una red de dispositivos comprometidos por malware y controlados remotamente.", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "¿En qué consiste la técnica de reflexión y amplificación en un ataque DDoS?", "o": ["En enviar directamente todo el tráfico malicioso desde el equipo del atacante", "En suplantar la IP de la víctima para que servidores intermediarios envíen sus respuestas hacia ella, multiplicando el tráfico recibido", "En cifrar los archivos de la víctima antes de exigir el rescate", "En explotar una vulnerabilidad de día cero para acceder al sistema"], "c": [1], "e": "En la reflexión y amplificación se suplanta la IP de la víctima para que servidores intermediarios envíen sus respuestas (mayores que la petición) hacia ella.", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "¿Qué red hacktivista se cita como caso de estudio de DDoS vinculado al apoyo a Ucrania y qué resultado obtuvo la operación policial internacional Eastwood?", "o": ["Mirai; provocó la caída total de Internet en Europa", "NoName057(16); provocó, entre otros resultados, 2 detenciones, 7 órdenes de detención y la desactivación de una parte sustancial de su infraestructura", "APT29; provocó el compromiso de la cadena de suministro de SolarWinds", "Exploit.in; provocó el cierre definitivo del foro"], "c": [1], "e": "NoName057(16) es la red hacktivista de DDoS vinculada al apoyo a Ucrania; la operación policial logró detenciones, órdenes de detención y la desactivación de parte de su infraestructura.", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "¿En qué se diferencia principalmente el phishing de otros ciberataques estudiados en el tema?", "o": ["Depende necesariamente de vulnerabilidades técnicas complejas en el sistema objetivo", "Explota fundamentalmente el factor humano mediante principios psicológicos como la urgencia, la autoridad o el miedo", "Solo puede realizarse mediante llamadas de voz", "Nunca se utiliza como mecanismo para iniciar otro ataque"], "c": [1], "e": "El phishing explota sobre todo el factor humano mediante principios psicológicos como la urgencia, la autoridad o el miedo.", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "¿Qué modalidad de phishing se dirige específicamente contra directivos u otras personas con acceso privilegiado dentro de una organización?", "o": ["Spear-phishing", "Smishing", "Whaling", "Vishing"], "c": [2], "e": "El whaling se dirige específicamente a directivos u otras personas con acceso privilegiado; el spear-phishing se dirige a un objetivo concreto en general.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "¿Por qué debe evitarse transmitir la idea de que todas las campañas de phishing contienen errores gramaticales evidentes?", "o": ["Porque los errores gramaticales nunca han sido un indicador útil", "Porque las campañas actuales, apoyadas en inteligencia artificial generativa, pueden alcanzar una redacción correcta y personalizada", "Porque el phishing no depende de la calidad de la redacción sino exclusivamente del dominio utilizado", "Porque los indicadores lingüísticos son competencia exclusiva de los proveedores de correo"], "c": [1], "e": "Con IA generativa, las campañas actuales pueden tener redacción correcta y persuasiva, así que no hay que enseñar que el phishing siempre tiene faltas.", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "¿Cuál es la diferencia esencial entre una vulnerabilidad y su explotación?", "o": ["No existe diferencia, ambos términos son sinónimos", "Una vulnerabilidad puede existir durante meses o años sin evidencia de haber sido aprovechada, mientras que la explotación es la acción efectiva de aprovecharla", "La vulnerabilidad siempre requiere un exploit publicado para existir", "La explotación es anterior cronológicamente a la existencia de la vulnerabilidad"], "c": [1], "e": "Una vulnerabilidad puede existir meses o años sin ser aprovechada; la explotación es el momento en que se usa realmente.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "¿Qué mide el sistema CVSS respecto a una vulnerabilidad?", "o": ["El identificador único que permite referirse inequívocamente a ella", "Una puntuación de severidad que considera factores como la posibilidad de explotación remota, la complejidad y los efectos sobre confidencialidad, integridad y disponibilidad", "El número de sistemas en el mundo que la contienen", "El nombre del fabricante responsable de corregirla"], "c": [1], "e": "CVSS ofrece una puntuación de severidad que considera factores como la explotabilidad remota, la complejidad y los efectos.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "¿Qué es una vulnerabilidad de día cero (zero-day)?", "o": ["Una vulnerabilidad que ha sido corregida el mismo día de su descubrimiento", "Una vulnerabilidad desconocida para quienes deberían corregirla o para la que todavía no existe solución disponible", "Una vulnerabilidad exclusiva de sistemas IoT", "Una vulnerabilidad que solo puede explotarse con acceso físico al dispositivo"], "c": [1], "e": "Un zero-day es una vulnerabilidad desconocida para quienes deberían corregirla o para la que aún no hay solución.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "¿Qué vulnerabilidad y técnica se vinculan a la propagación de WannaCry en 2017?", "o": ["CVE-2021-44228 mediante Log4Shell", "La explotación del protocolo SMB mediante la técnica EternalBlue (CVE-2017-0144)", "Una vulnerabilidad de día cero en un proveedor de correo electrónico", "El compromiso de la cadena de suministro de un proveedor de software"], "c": [1], "e": "WannaCry (2017) se propagó explotando SMB con la técnica EternalBlue (CVE-2017-0144).", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Qué caracteriza fundamentalmente a una Amenaza Persistente Avanzada (APT) frente a un ataque oportunista?", "o": ["El uso exclusivo de malware desarrollado a medida y nunca de herramientas legítimas", "La selección deliberada del objetivo, una fase previa de reconocimiento y la adaptación continua de las técnicas a las defensas encontradas", "La ausencia total de motivación económica en cualquier caso", "La imposibilidad de que el ataque dure más de 24 horas"], "c": [1], "e": "Una APT se distingue de un ataque oportunista por la selección deliberada del objetivo, el reconocimiento previo y la adaptación continua de las técnicas.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "¿Qué significa que una APT sea «persistente»?", "o": ["Que el ataque se repite exactamente de la misma forma cada vez", "Que el adversario trata de mantener su actividad y capacidad de operar sobre la organización objetivo durante un periodo prolongado, aunque pierda un punto de acceso", "Que el malware empleado no puede eliminarse nunca", "Que la víctima persiste en no aplicar parches de seguridad"], "c": [1], "e": "«Persistente» significa que el adversario intenta mantener su actividad y capacidad de operar sobre la organización durante un periodo prolongado.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "¿En qué consiste un ataque a la cadena de suministro (supply chain attack), ilustrado con el caso de SolarWinds?", "o": ["En atacar simultáneamente a todas las víctimas finales sin pasar por ningún intermediario", "En comprometer un producto, actualización o servicio de un proveedor tecnológico para obtener acceso indirecto a sus numerosos clientes", "En generar tráfico masivo contra los servidores de un proveedor de Internet", "En suplantar la identidad de un directivo mediante spear-phishing"], "c": [1], "e": "En un ataque a la cadena de suministro (SolarWinds) se compromete un producto, actualización o servicio de un proveedor para acceder indirectamente a sus clientes.", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "Según las conclusiones del tema, ¿por qué debe analizarse un ciberataque como una cadena de acciones y no únicamente a partir de su efecto más visible?", "o": ["Porque los ciberataques rara vez combinan distintas técnicas y suelen ser fenómenos aislados", "Porque un mismo incidente puede combinar secuencialmente phishing, robo de credenciales, escalada de privilegios, exfiltración y ransomware, y el síntoma visible no revela por sí solo el alcance real", "Porque la ley exige tipificar cada técnica empleada como un delito independiente", "Porque el CVSS asigna una puntuación distinta a cada fase del ataque"], "c": [1], "e": "Un incidente combina secuencialmente fases (phishing, robo de credenciales, escalada, exfiltración, cifrado…), por eso hay que analizarlo como cadena de acciones.", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "¿Por qué señala el tema que un indicador técnico como una IP, un dominio o una muestra de malware no identifica automáticamente al responsable de un ciberataque?", "o": ["Porque estos indicadores nunca resultan útiles en una investigación", "Porque la atribución debe construirse mediante la correlación de múltiples evidencias y, con frecuencia, cooperación con proveedores y autoridades de otros Estados", "Porque las direcciones IP cambian cada segundo y no pueden registrarse", "Porque solo los organismos internacionales pueden analizar muestras de malware"], "c": [1], "e": "Un indicador (IP, dominio, muestra) no identifica por sí solo al autor: la atribución exige correlacionar múltiples evidencias y, a menudo, cooperación internacional.", "nota": ""}, {"id": "2.1", "t": 2, "n": 1, "q": "Según el tema, ¿cuál es la principal transición metodológica que se introduce respecto al Tema 8.1?", "o": ["Dejar de estudiar el ransomware para centrarse exclusivamente en el phishing", "Pasar de reconocer qué clase de ataque se ha producido a reconstruir cómo se desarrolló, qué alcance tuvo y qué conclusiones pueden sostenerse con la evidencia disponible", "Sustituir el análisis forense por la exclusiva confianza en la nota de rescate", "Limitar la investigación a identificar únicamente la familia de malware utilizada"], "c": [1], "e": "Se pasa de reconocer qué clase de ataque se produjo a reconstruir cómo se desarrolló, qué alcance tuvo y qué conclusiones pueden sostenerse.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Por qué señala el tema que la detección de archivos cifrados o una nota de rescate no determina por sí sola el origen, la cronología ni la extensión del compromiso?", "o": ["Porque el cifrado puede constituir la fase final de una intrusión iniciada días o semanas antes, pudiendo perseguir además el ocultamiento de actividades anteriores", "Porque las notas de rescate siempre contienen información falsa", "Porque el cifrado nunca se relaciona con otras fases del ataque", "Porque la cronología solo puede determinarse mediante la negociación con el atacante"], "c": [0], "e": "El cifrado puede ser la fase final de una intrusión iniciada días o semanas antes, así que no determina por sí solo origen, cronología ni alcance.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Cuál es la diferencia entre hecho observado, inferencia e hipótesis según el ejemplo del inicio de sesión desde una IP concreta?", "o": ["Los tres términos son sinónimos y no requieren distinción metodológica", "El inicio de sesión desde una IP es un hecho registrado; que el acceso fuese no autorizado es una inferencia que exige contexto; que la IP identifique al autor sería una hipótesis mucho más exigente", "La hipótesis siempre precede al hecho observado", "La inferencia solo puede formularse tras confirmar judicialmente la autoría"], "c": [1], "e": "El inicio de sesión desde una IP es un hecho registrado; que fuese no autorizado es una inferencia que exige contraste; la hipótesis es una explicación a comprobar.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Qué aporta la doble extorsión respecto al modelo de ransomware más antiguo, basado en el bloqueo o cifrado local?", "o": ["Elimina por completo la necesidad de cifrar los sistemas", "Añade una amenaza contra la confidencialidad a la presión derivada de la indisponibilidad, recopilando y extrayendo información antes del cifrado para amenazar con su publicación", "Sustituye la exigencia de pago por la simple destrucción de los datos", "Limita la interacción con la víctima a instrucciones estandarizadas sin negociación"], "c": [1], "e": "La doble extorsión añade la amenaza contra la confidencialidad (publicar datos exfiltrados) a la presión por la indisponibilidad.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Por qué la existencia de copias de seguridad no neutraliza por completo la presión ejercida mediante doble extorsión?", "o": ["Porque las copias de seguridad nunca funcionan correctamente", "Porque aunque la organización pueda restaurar sus servicios, todavía afronta el riesgo asociado a la divulgación de la información sustraída", "Porque el atacante siempre destruye también las copias de seguridad antes de exfiltrar", "Porque la ley obliga a pagar el rescate aunque existan copias"], "c": [1], "e": "Aunque las copias permitan restaurar servicios, la organización sigue expuesta al riesgo de divulgación de la información exfiltrada.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Qué caracteriza al modelo Ransomware-as-a-Service (RaaS)?", "o": ["Que desarrolladores u operadores de una plataforma proporcionan herramientas, paneles e infraestructura a afiliados que ejecutan las intrusiones, a cambio de reparto del rescate, suscripción o prestación puntual", "Que un único grupo criminal controla siempre toda la cadena del ataque sin colaboradores externos", "Que el ransomware solo puede desplegarse mediante código desarrollado internamente por cada afiliado", "Que la remuneración de los afiliados es siempre fija e independiente del rescate obtenido"], "c": [0], "e": "En el RaaS, desarrolladores u operadores ofrecen herramientas, paneles e infraestructura a afiliados que ejecutan los ataques, y se reparten los beneficios.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "Según el tema, ¿qué revela la fragmentación y el cambio de marca de las plataformas RaaS tras operaciones policiales o conflictos internos?", "o": ["Que las plataformas desaparecen definitivamente sin posibilidad de reconstitución", "Que el modelo RaaS no implica necesariamente una estructura jerárquica estable, pudiendo un afiliado utilizar varias marcas y una plataforma reconstituirse o cambiar de nombre", "Que la identificación de una variante de malware basta para atribuir la operación completa", "Que los initial access brokers dejan de operar tras cualquier actuación policial"], "c": [1], "e": "La fragmentación y los cambios de marca muestran que el RaaS no implica una estructura jerárquica estable: un afiliado puede usar varias marcas.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "Según el ENISA Threat Landscape 2025, ¿qué porcentaje de la actividad de ciberdelincuencia monitorizada contra organizaciones de los Estados miembros representó el ransomware entre julio de 2024 y junio de 2025?", "o": ["El 15,2 %", "El 81,1 %", "El 4.875 %", "El 82 %"], "c": [1], "e": "Según el ENISA Threat Landscape 2025, el 81,1 % de la actividad de ciberdelincuencia monitorizada contra organizaciones de la UE fue del tipo indicado en el tema.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Por qué advierte el tema que la marca mostrada en la nota de rescate es una pista y no una garantía sobre quién ejecutó cada fase del ataque?", "o": ["Porque la investigación debe correlacionar el comportamiento observado con identidades, tiempos, infraestructura, comunicaciones y flujos económicos, ya que los roles funcionales pueden acumularse o prestarse como servicio a múltiples grupos", "Porque las notas de rescate nunca contienen ningún dato verificable", "Porque la marca identifica siempre e inequívocamente al desarrollador del cifrador", "Porque la atribución solo puede basarse en el análisis lingüístico de la nota"], "c": [0], "e": "La marca de la nota de rescate es una pista, no una garantía de quién ejecutó cada fase: hay que correlacionar comportamiento, identidades, tiempos e infraestructura.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "Según el tema, ¿por qué no debe interpretarse la anatomía de una operación de ransomware como una receta rígida?", "o": ["Porque sus fases pueden solaparse, repetirse, omitirse o ejecutarse por actores diferentes, sirviendo el modelo como matriz de preguntas y evidencias", "Porque las fases siempre ocurren en un orden estrictamente diferente en cada incidente", "Porque no existe ninguna fase de acceso inicial en los ataques modernos", "Porque MITRE ATT&CK prohíbe expresamente su uso como marco de referencia"], "c": [0], "e": "Las fases pueden solaparse, repetirse, omitirse o ser ejecutadas por actores distintos; el modelo es un marco de análisis, no una receta rígida.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Qué recuerda MITRE ATT&CK sobre las cuentas válidas (T1078) en relación con el acceso inicial?", "o": ["Que las cuentas válidas solo pueden emplearse para el acceso inicial y nunca para otras fases", "Que las cuentas válidas pueden servir no solo para el acceso inicial, sino también para persistencia, escalada y evasión", "Que las cuentas válidas quedan automáticamente invalidadas tras el primer uso malicioso", "Que solo las cuentas de administrador pueden considerarse cuentas válidas a efectos de T1078"], "c": [1], "e": "Las cuentas válidas (T1078) sirven no solo para el acceso inicial, sino también para persistencia, escalada y evasión.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Por qué señala el tema que la persistencia puede residir en identidades y configuraciones, no únicamente en malware?", "o": ["Porque el malware es siempre el único mecanismo de persistencia posible", "Porque restaurar archivos sin eliminar la vía persistente permite un nuevo compromiso, siendo esencial comparar cuentas, privilegios y registros de administración durante la reconstrucción", "Porque las identidades no pueden verse comprometidas en un ataque de ransomware", "Porque las configuraciones del sistema no dejan ningún rastro investigable"], "c": [1], "e": "La persistencia puede residir en identidades y configuraciones: restaurar archivos sin eliminar esa vía permite un nuevo compromiso.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿En qué se diferencian, según el tema, el intento, el acceso a material de credenciales y el uso acreditado de una identidad durante la escalada de privilegios?", "o": ["Son conceptos equivalentes que no requieren distinción en la conclusión investigadora", "La conclusión debe graduar el nivel de certeza, diferenciando estos tres niveles según la evidencia disponible en memoria, registros de autenticación y accesos a almacenes de credenciales", "El uso acreditado de una identidad es siempre el primer evento cronológico de la operación", "El intento nunca deja ninguna huella técnica registrable"], "c": [1], "e": "La conclusión debe graduar la certeza distinguiendo intento, acceso a material de credenciales y uso acreditado de una identidad, según la evidencia.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Qué técnica de MITRE ATT&CK agrupa el sabotaje de mecanismos de recuperación (borrado de copias de sombra, eliminación de catálogos, acceso a plataformas de respaldo)?", "o": ["T1078 (Valid Accounts)", "T1486 (Data Encrypted for Impact)", "T1490 (Inhibit System Recovery)", "T1490 (Data Encrypted for Impact)"], "c": [2], "e": "T1490 (Inhibit System Recovery) agrupa el sabotaje de los mecanismos de recuperación, como borrar copias de sombra o catálogos de backup.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "¿Por qué deben priorizarse la obtención de registros centralizados, copias externas y telemetría de EDR ante acciones de neutralización de controles?", "o": ["Porque estas acciones, aunque demuestran preparación para el impacto, también reducen la evidencia disponible en los sistemas locales afectados", "Porque los registros centralizados nunca pueden ser alterados por el adversario", "Porque la neutralización de controles ocurre siempre antes del acceso inicial", "Porque el EDR sustituye completamente la necesidad de copias de seguridad"], "c": [0], "e": "Estas acciones demuestran preparación para el impacto, pero reducen la evidencia en los sistemas; por eso se priorizan registros centralizados, copias externas y telemetría EDR.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué son los indicadores de compromiso (IOC) y qué exige el tema para que se conviertan en evidencia útil?", "o": ["Son pruebas periciales definitivas que no requieren ningún contexto adicional", "Son elementos que pueden señalar actividad maliciosa (hash, dominio, IP, archivo o ruta), exigiendo su conversión en evidencia útil preservarlos con contexto: origen, fecha, sistema, método de adquisición, integridad y relación con otros hechos", "Son exclusivamente direcciones de criptoactivos vinculadas a la negociación", "Son datos que pierden todo valor si no proceden de una fuente institucional"], "c": [1], "e": "Los IOC (hash, dominio, IP, archivo, ruta) pueden señalar actividad maliciosa, pero deben convertirse en evidencia útil mediante contexto y contraste.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "¿Qué distingue la investigación técnico-forense de la ciberinteligencia según el tema?", "o": ["Son disciplinas idénticas que se sustituyen mutuamente sin ninguna diferencia metodológica", "La ciberinteligencia aporta contexto a los observables (relaciones históricas, campañas, técnicas) sin sustituir el análisis forense ni convertir automáticamente información de terceros en prueba", "La ciberinteligencia siempre tiene mayor valor probatorio que el análisis forense", "El análisis forense no requiere en ningún caso conservar la fuente ni la fecha de consulta"], "c": [1], "e": "La ciberinteligencia aporta contexto a los observables (relaciones históricas, campañas, técnicas) sin sustituir el análisis técnico-forense.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Qué precaución señala el tema antes de subir una muestra, URL o indicador a un servicio público de enriquecimiento como VirusTotal?", "o": ["Ninguna, pues estos servicios garantizan siempre la confidencialidad absoluta de lo consultado", "Debe comprobarse su política de visibilidad, ya que subir un documento confidencial o una URL con tokens puede revelar información del caso a terceros y alertar al adversario", "Solo debe evitarse si la muestra procede de un sistema ya cifrado", "Es obligatorio subir siempre la muestra completa sin excepción antes de cualquier análisis"], "c": [1], "e": "Antes de subir una muestra, URL o indicador a un servicio público como VirusTotal hay que revisar su política de visibilidad: podría revelar información sensible.", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Cómo debe clasificarse razonadamente el alcance de un sistema del que existen múltiples indicios coherentes con una laguna concreta, según la tabla de clasificación del alcance?", "o": ["Como «confirmado»", "Como «probable»", "Como «sin indicios»", "Como «posible o expuesto»"], "c": [1], "e": "Con múltiples indicios coherentes pero sin confirmación directa, el alcance debe clasificarse como «probable».", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Cuáles son los seis pasos del proceso de elaboración y contraste de hipótesis descrito en el tema?", "o": ["Formular, enumerar, predecir, buscar, revisar y comunicar", "Preservar, reproducir, corroborar, contextualizar, proteger y separar", "Delimitar, triar, analizar, construir, examinar y correlacionar", "Detectar, contener, erradicar, recuperar, documentar y cerrar"], "c": [0], "e": "Los seis pasos son formular, enumerar, predecir, buscar, revisar y comunicar.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "Según el tema, ¿cuál es la idea central que orienta el estudio de las medidas preventivas y de respuesta?", "o": ["Conocer cómo funciona un ciberataque solo es útil si permite decidir qué control aplicar, qué rastro buscar y qué acción técnica ejecutar", "Basta con instalar el mayor número posible de herramientas de seguridad para prevenir cualquier ataque", "La respuesta a un incidente debe centrarse exclusivamente en la coordinación organizativa, no en medidas técnicas", "Los ataques estudiados anteriormente no guardan relación con las medidas de prevención y detección"], "c": [0], "e": "Conocer cómo funciona un ataque solo sirve si permite decidir qué control aplicar, qué rastro buscar y qué acción adoptar.", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿En qué consiste la defensa en profundidad?", "o": ["En instalar la mayor cantidad posible de herramientas sin relacionarlas entre sí", "En situar controles complementarios en distintos puntos del sistema, para evitar que el fracaso de una sola medida deje el camino libre al atacante", "En sustituir todos los controles técnicos por la formación del personal", "En confiar en una única tecnología que garantice por sí sola la seguridad del sistema"], "c": [1], "e": "La defensa en profundidad sitúa controles complementarios en distintos puntos para que el fallo de uno solo no deje el sistema expuesto.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "¿Qué aporta el principio de Zero Trust respecto a la defensa en profundidad?", "o": ["La sustituye por completo, haciendo innecesarios los controles en capas", "La complementa: no confiar de forma permanente en una identidad, equipo o ubicación, verificar explícitamente y conceder el menor privilegio necesario", "Elimina la necesidad de segmentar la red", "Solo es aplicable a la protección de aplicaciones web"], "c": [1], "e": "Zero Trust complementa la defensa en profundidad: no confiar de forma permanente en una identidad, equipo o ubicación; verificar explícitamente y conceder mínimo privilegio.", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "¿Qué es la superficie de ataque y qué persigue reducirla?", "o": ["Es el conjunto de servicios, cuentas, interfaces, aplicaciones y configuraciones que un adversario puede intentar aprovechar; reducirla busca eliminar lo innecesario, corregir debilidades y limitar la exposición", "Es exclusivamente el número de servidores físicos de una organización", "Es un indicador que solo se aplica a los ataques de denegación de servicio", "Reducirla implica eliminar todos los servicios, incluidos los necesarios para la actividad de la organización"], "c": [0], "e": "La superficie de ataque es el conjunto de servicios, cuentas, interfaces y configuraciones que un adversario puede intentar aprovechar; se busca reducirla.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Qué indica una referencia CVE respecto a una vulnerabilidad?", "o": ["Que existe un ataque en curso explotando esa vulnerabilidad", "Identifica públicamente una vulnerabilidad concreta, informando de un riesgo que debe evaluarse, sin demostrar que exista un ataque en curso", "Que la vulnerabilidad ha sido ya corregida en todos los sistemas afectados", "Que la vulnerabilidad solo afecta a sistemas Linux"], "c": [1], "e": "Un CVE identifica públicamente una vulnerabilidad concreta e informa de un riesgo a evaluar, sin demostrar que exista un ataque ni que afecte a mi sistema.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Cuál es la secuencia correcta del ciclo de gestión de vulnerabilidades descrito en el tema?", "o": ["Corrección, escaneo, hallazgo, priorización, activo inventariado y verificación", "Activo inventariado, escaneo, hallazgo, priorización, corrección y verificación", "Escaneo, corrección, activo inventariado, verificación, priorización y hallazgo", "Priorización, hallazgo, corrección, escaneo, verificación y activo inventariado"], "c": [1], "e": "El ciclo es: activo inventariado, escaneo, hallazgo, priorización, corrección y verificación.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Qué es el hardening o endurecimiento de un sistema?", "o": ["Instalar el mayor número de agentes de seguridad posible sin documentar los cambios", "Ajustar el sistema para que ofrezca únicamente las funciones necesarias con una configuración segura, debiendo documentarse y probarse", "Sustituir el sistema operativo por una versión más reciente sin cambiar su configuración", "Aumentar los privilegios de todas las cuentas para facilitar la administración"], "c": [1], "e": "El hardening ajusta el sistema para que ofrezca solo las funciones necesarias con configuración segura, y debe documentarse.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "Frente al credential stuffing, ¿qué control preventivo señala el tema junto al MFA?", "o": ["El rate limiting exclusivamente contra una única cuenta", "La no reutilización de contraseñas y la detección de anomalías, con accesos desde orígenes o dispositivos atípicos como evidencia observable", "El bloqueo progresivo exclusivamente contra password spraying", "La eliminación completa de cualquier sistema de autenticación"], "c": [1], "e": "Frente al credential stuffing, junto al MFA se señala la no reutilización de contraseñas y la detección de anomalías (accesos desde orígenes o dispositivos atípicos).", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿Cuál es el valor de la segmentación de red según el tema?", "o": ["Impide cualquier posibilidad de que un equipo resulte comprometido", "Permite que, si un equipo resulta comprometido, el atacante pueda controlar ese equipo pero no obtenga automáticamente acceso a servidores, copias de seguridad o sistemas de administración", "Sustituye la necesidad de un firewall perimetral", "Solo es aplicable en entornos que no disponen de VPN"], "c": [1], "e": "La segmentación limita el daño: si un equipo cae, el atacante no obtiene automáticamente acceso al resto de la red.", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Cuál es la diferencia principal entre Suricata y Zeek según el tema?", "o": ["Suricata pregunta principalmente si el tráfico coincide con una condición de detección; Zeek registra qué ha ocurrido para facilitar el análisis, ofreciendo juntos alerta y contexto", "Suricata solo puede funcionar en modo pasivo, mientras que Zeek siempre actúa como IPS", "Ambas herramientas son idénticas y cumplen exactamente la misma función", "Zeek únicamente puede analizar tráfico DNS, mientras que Suricata analiza todos los protocolos"], "c": [0], "e": "Suricata pregunta si el tráfico coincide con una condición de detección; Zeek registra qué ha ocurrido para poder analizarlo después.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿Qué archivo de registro de Zeek permite responder si aparecen conexiones periódicas compatibles con beaconing?", "o": ["http.log", "conn.log", "ssl.log", "files.log"], "c": [1], "e": "conn.log de Zeek recoge las conexiones y permite detectar patrones periódicos compatibles con beaconing.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "¿Por qué señala el tema que un WAF añade protección pero no reemplaza la corrección del código vulnerable?", "o": ["Porque el WAF solo puede detectar ataques de denegación de servicio", "Porque las capas de desarrollo seguro, configuración y protección perimetral son complementarias, y el WAF actúa en el perímetro sin corregir la causa del fallo en el código", "Porque el WAF sustituye completamente la necesidad de validar entradas en el servidor", "Porque el WAF únicamente puede aplicarse a aplicaciones que no reciben tráfico HTTP"], "c": [1], "e": "Desarrollo seguro, configuración y protección perimetral son capas complementarias; el WAF protege, pero no sustituye corregir el código vulnerable.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "¿Qué es la monitorización de integridad de archivos (FIM) y qué precaución exige?", "o": ["Detecta y bloquea automáticamente cualquier cambio en un archivo, sin necesidad de contexto adicional", "Compara el estado de archivos relevantes y alerta cuando cambian, exigiendo proteger y actualizar de forma controlada la línea base, pues si el atacante puede modificar también la referencia, la comprobación pierde valor", "Solo puede aplicarse a archivos ejecutables, nunca a documentos", "Sustituye la necesidad de un SIEM en cualquier organización"], "c": [1], "e": "FIM compara el estado de archivos relevantes y alerta de cambios; exige proteger y actualizar de forma controlada la línea base.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Qué función cumple un SIEM según el tema?", "o": ["Sustituye la necesidad de firewalls, EDR y servidores web", "Reúne y correlaciona las señales dispersas —conexión de firewall, autenticación del sistema, proceso del endpoint, petición del servidor web— para construir una secuencia con significado", "Genera automáticamente parches de seguridad para las vulnerabilidades detectadas", "Solo puede almacenar registros sin permitir ninguna correlación entre ellos"], "c": [1], "e": "Un SIEM reúne y correlaciona señales dispersas (firewall, autenticación, proceso en endpoint, petición web…) para detectar lo que cada fuente por separado no muestra.", "nota": ""}, {"id": "3.15", "t": 3, "n": 15, "q": "¿Qué diferencia a los niveles estratégico, operacional, táctico y técnico de la ciberinteligencia?", "o": ["Son sinónimos y no existe ninguna diferencia real entre ellos", "Responden a preguntas distintas: qué amenazas afectan al sector, qué campañas y actores están activos, qué técnicas y procedimientos emplean, y qué indicadores concretos se observan", "Solo el nivel técnico resulta útil para la prevención de ciberataques", "El nivel estratégico se ocupa exclusivamente de indicadores de compromiso concretos"], "c": [1], "e": "Los niveles estratégico, operacional, táctico y técnico responden a preguntas distintas (sector, campañas y actores, técnicas y procedimientos, indicadores concretos).", "nota": ""}, {"id": "3.16", "t": 3, "n": 16, "q": "¿Por qué advierte el tema que «un indicador sin contexto envejece rápidamente»?", "o": ["Porque los indicadores de compromiso nunca caducan y mantienen su validez indefinidamente", "Porque antes de incorporar un indicador a una detección es necesario conocer su procedencia, confianza, fecha, alcance y posibles usos legítimos", "Porque el contexto de un indicador solo importa para el análisis forense, no para la prevención", "Porque MISP y OpenCTI no permiten enriquecer indicadores con contexto adicional"], "c": [1], "e": "Antes de usar un indicador hay que conocer su procedencia, confianza, fecha, alcance y vigencia; sin contexto pierde valor rápidamente.", "nota": ""}, {"id": "3.17", "t": 3, "n": 17, "q": "Según los componentes de una detección descritos en el tema, ¿qué pregunta responde el componente «contexto»?", "o": ["Qué comportamiento se quiere reconocer", "Qué evento contiene la evidencia necesaria", "Qué excepciones legítimas existen", "Qué cambio puede degradar la detección"], "c": [2], "e": "En una detección, el componente «contexto» responde qué excepciones legítimas existen.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "¿Por qué puede una regla Sigma sintácticamente correcta no detectar nada en la práctica?", "o": ["Porque Sigma es un formato exclusivo para archivos, incompatible con eventos de sistema", "Porque el campo que consulta la regla puede no recopilarse, llegar vacío o haber sido normalizado con otro nombre en el esquema real de eventos", "Porque las reglas Sigma no pueden transformarse al lenguaje de consulta de ningún SIEM", "Porque Sigma solo permite describir detecciones para tráfico de red, nunca para registros de sistema"], "c": [1], "e": "Una regla Sigma puede ser correcta sintácticamente y no detectar nada si el campo no se recopila, llega vacío o está normalizado con otro nombre.", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Qué diferencia al threat hunting de la detección automática mediante alertas?", "o": ["El threat hunting es una búsqueda proactiva y estructurada de comportamientos sospechosos que pueden no haber generado una alerta, partiendo de una hipótesis razonable", "El threat hunting solo puede realizarse después de que se haya producido una alerta automática", "El threat hunting sustituye por completo la necesidad de disponer de telemetría", "El threat hunting consiste en una búsqueda abierta de cualquier anomalía sin necesidad de formular una hipótesis"], "c": [0], "e": "El threat hunting es una búsqueda proactiva y estructurada de comportamientos sospechosos que pueden no haber generado alerta.", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "¿Por qué señala el tema que una matriz MITRE ATT&CK coloreada muestra «cobertura declarada, no eficacia demostrada»?", "o": ["Porque la cobertura adquiere valor real cuando cada afirmación está respaldada por datos, una detección y una prueba repetible, no por la mera existencia de una herramienta instalada", "Porque MITRE ATT&CK es un marco exclusivamente teórico sin ninguna aplicación práctica", "Porque las matrices coloreadas nunca pueden utilizarse para priorizar controles", "Porque la validación continua con Atomic Red Team o MITRE Caldera es innecesaria una vez completada la matriz"], "c": [0], "e": "Una matriz coloreada muestra cobertura declarada, no eficacia demostrada: solo vale si cada afirmación se respalda con datos, una detección y una prueba reproducible.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿Qué establece el artículo 11 del Esquema Nacional de Seguridad (ENS, RD 311/2022) en relación con la gestión de incidentes?", "o": ["Que las entidades públicas deben contratar obligatoriamente un SOC externo", "La obligación de disponer de una Política de Seguridad de la Información que incluya, entre sus requisitos mínimos, un Protocolo de Gestión de Incidentes que establezca un sistema de detección y reacción y el registro de los incidentes y las acciones adoptadas", "La obligación de notificar cualquier incidente a la Unión Europea en un plazo de una hora", "Que únicamente los organismos privados deben disponer de un protocolo de gestión de incidentes"], "c": [1], "e": "El art. 11 del ENS (RD 311/2022) obliga a tener una Política de Seguridad de la Información cuyos requisitos mínimos incluyen un procedimiento de gestión de incidentes.", "nota": ""}, {"id": "4.2", "t": 4, "n": 2, "q": "Según el tema, ¿cuál es la diferencia habitual entre CERT y CSIRT?", "o": ["Son términos completamente distintos sin ninguna relación entre sí", "El CERT solo existe en Estados Unidos, mientras que el CSIRT es exclusivo de la Unión Europea", "Los equipos encargados de la respuesta directa a los incidentes se consideran CSIRT, mientras que los CERT se encargan más bien de la prevención y gestión de las amenazas", "El CSIRT nunca coordina la respuesta a nivel público estatal"], "c": [2], "e": "Habitualmente, los equipos de respuesta directa a incidentes se consideran CSIRT; los CERT tienen un papel más de coordinación y referencia.", "nota": ""}, {"id": "4.3", "t": 4, "n": 3, "q": "¿Qué organismo tiene encomendada por el ENS la coordinación público estatal de los equipos de respuesta a incidentes de seguridad informática?", "o": ["El CCN-CERT", "El SOC S21sec", "El Foro CSIRT.es en exclusiva", "La Subdirección General de Logística e Innovación"], "c": [0], "e": "El ENS encomienda al CCN-CERT la coordinación pública estatal de los equipos de respuesta a incidentes.", "nota": ""}, {"id": "4.4", "t": 4, "n": 4, "q": "¿Qué es un SOC (Security Operations Center) según el tema?", "o": ["Un tratado internacional de cooperación policial", "Un equipo especializado en ciberseguridad que proporciona protección a la organización mediante la monitorización, detección, análisis e investigación de ciberataques", "Una herramienta de cifrado de comunicaciones exclusivamente militar", "Un procedimiento judicial para la investigación de ciberdelitos"], "c": [1], "e": "Un SOC es un equipo especializado en ciberseguridad que protege a la organización mediante monitorización, detección y respuesta.", "nota": ""}, {"id": "4.5", "t": 4, "n": 5, "q": "¿Cuáles son las cuatro fases del procedimiento de gestión de incidentes descrito en el tema?", "o": ["Detección, negociación, pago y recuperación", "Preparación; detección, análisis e identificación; contención, mitigación y recuperación; y actividad post-incidente", "Planificación, obtención, procesamiento y difusión", "Reconocimiento, acceso inicial, persistencia y exfiltración"], "c": [1], "e": "Las cuatro fases son preparación; detección, análisis e identificación; contención, mitigación y recuperación; y actividad post-incidente.", "nota": ""}, {"id": "4.6", "t": 4, "n": 6, "q": "¿Qué plazo establece el tema para la primera notificación al organismo de supervisión cuando un incidente afecta a un servicio de confianza sometido al Reglamento eIDAS?", "o": ["Un plazo no superior a 24 horas", "Un plazo no superior a 72 horas", "Un plazo de una semana", "No existe plazo alguno, la notificación es potestativa"], "c": [0], "e": "La primera notificación al organismo de supervisión debe hacerse en un plazo no superior a 24 horas.", "nota": ""}, {"id": "4.7", "t": 4, "n": 7, "q": "¿Qué normativa resulta de aplicación cuando un incidente de ciberseguridad afecta a sistemas de información que contienen datos de carácter personal?", "o": ["Exclusivamente la Directiva NIS2", "El Reglamento General de Protección de Datos (Reglamento UE 2016/679) y la correspondiente Instrucción de Gestión de Incidentes de Seguridad con Datos de Carácter Personal", "Únicamente el Reglamento eIDAS", "El Convenio de Budapest exclusivamente"], "c": [1], "e": "Si hay datos personales se aplica el RGPD (Reglamento UE 2016/679) y la instrucción de gestión de incidentes correspondiente.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "En el flujo de trabajo de un incidente, ¿qué hito corresponde a la fase de «clasificación»?", "o": ["Apertura del caso mediante herramienta de ticketing", "Triaje del incidente, asignando su criticidad y priorización", "Investigación, troubleshooting y valoración del posible impacto", "Bloqueo, mitigación y garantía de continuidad del servicio"], "c": [1], "e": "La fase de «clasificación» corresponde al triaje del incidente: asignar criticidad y prioridad.", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿Qué diferencia a un EDR de un IDS según su ubicación y capacidad, conforme al tema?", "o": ["El EDR es una evolución del antivirus situada en el endpoint; el IDS, ejemplificado en Snort o Suricata, carece de capacidad de respuesta propia", "El IDS siempre tiene capacidad de bloqueo automático, mientras que el EDR nunca la tiene", "Ambos términos son sinónimos y se refieren exactamente a la misma tecnología", "El EDR solo puede desplegarse en dispositivos de red, nunca en endpoints"], "c": [0], "e": "El EDR es una evolución del antivirus situada en el endpoint; el IDS (Snort, Suricata) detecta, pero carece de capacidad de respuesta propia en el equipo.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "¿Qué distingue a un SIEM de un SOAR según el tema?", "o": ["El SIEM centraliza y correlaciona eventos; el SOAR aporta capacidad de orquestación, automatización y respuesta", "El SOAR únicamente almacena registros sin ninguna capacidad de correlación", "El SIEM y el SOAR son exactamente la misma herramienta bajo dos nombres distintos", "El SIEM solo puede utilizarse en entornos de nube, nunca on-premise"], "c": [0], "e": "El SIEM centraliza y correlaciona eventos; el SOAR aporta orquestación, automatización y respuesta.", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "¿Qué normas genéricas obligatorias señala el tema para el registro de un incidente?", "o": ["Únicamente asignar una referencia única, sin necesidad de más comprobaciones", "Comprobar que el incidente no haya sido registrado con anterioridad, asignar una referencia única, introducir información técnica inicial y de apoyo suficiente, y asignar tipicidad y criticidad", "Registrar el incidente solo si ha sido confirmado judicialmente", "Esperar a que finalice la fase de recuperación antes de registrar el incidente"], "c": [1], "e": "Al registrar un incidente hay que comprobar que no esté ya registrado, asignar una referencia única e introducir la información disponible.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "¿Qué organismo proporciona la taxonomía de referencia empleada para clasificar la tipicidad de un ciberincidente según el tema?", "o": ["MITRE", "ENISA", "El Foro CSIRT.es", "eIDAS"], "c": [1], "e": "ENISA proporciona la taxonomía de referencia para clasificar la tipicidad de un ciberincidente.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "Según la clasificación por potencial peligrosidad descrita en el tema, ¿en qué nivel se incluyen las Amenazas Persistentes Avanzadas (APT), el ciberterrorismo y los ataques contra infraestructuras críticas?", "o": ["Bajo", "Alto", "Muy alto", "Crítico"], "c": [3], "e": "Las APT se clasifican con el nivel de peligrosidad «crítico».", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Qué recopila y organiza fundamentalmente el marco MITRE ATT&CK?", "o": ["Exclusivamente listados de direcciones IP maliciosas", "Información sobre cómo los adversarios comprometen redes y sistemas, se mueven lateralmente, escalan privilegios y evaden defensas, clasificada en tácticas y técnicas específicas (TTP)", "Únicamente la normativa europea de protección de datos", "Un catálogo exclusivo de herramientas de cifrado"], "c": [1], "e": "MITRE ATT&CK recopila cómo los adversarios comprometen redes, se mueven lateralmente, escalan privilegios y evaden defensas.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué significa la sigla TTP en el contexto de MITRE ATT&CK?", "o": ["Tácticas, técnicas y procedimientos", "Tiempo total de propagación", "Taxonomía y tipificación penal", "Trazabilidad técnica y probatoria"], "c": [0], "e": "TTP significa tácticas, técnicas y procedimientos.", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "¿Por qué señala el tema que el bloqueo no siempre es la medida más oportuna ante un incidente?", "o": ["Porque el bloqueo está prohibido por la normativa europea", "Porque en ocasiones no es posible al haberse ya materializado la explotación de una vulnerabilidad", "Porque el bloqueo siempre requiere una orden judicial previa", "Porque el bloqueo solo puede aplicarse a ataques de tipo DDoS"], "c": [1], "e": "El bloqueo no siempre es lo más oportuno porque a veces ya no es posible, al haberse materializado la explotación.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "¿Cuál es el principal objetivo de la fase de contención o mitigación cuando el bloqueo no es posible?", "o": ["Aumentar la superficie de exposición del sistema afectado", "Reducir el impacto del incidente evitando el movimiento lateral", "Eliminar de forma permanente todos los registros del incidente", "Notificar exclusivamente a la prensa sobre el incidente"], "c": [1], "e": "Cuando no se puede bloquear, la contención busca reducir el impacto evitando el movimiento lateral.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Por qué advierte el tema que la fase de recuperación no debe precipitarse?", "o": ["Porque exponer de nuevo los sistemas al riesgo puede suponer una nueva explotación de la vulnerabilidad", "Porque la recuperación siempre debe retrasarse un mínimo de un año", "Porque la recuperación es responsabilidad exclusiva de terceros proveedores", "Porque no es necesario garantizar la continuidad del servicio"], "c": [0], "e": "La recuperación no debe precipitarse: reexponer los sistemas puede suponer una nueva explotación de la vulnerabilidad.", "nota": ""}, {"id": "4.19", "t": 4, "n": 19, "q": "¿Qué distingue a una acción de tipo preventivo de una acción de tipo reactivo según la tabla de acciones técnicas del tema?", "o": ["No existe ninguna diferencia, todas las acciones tienen el mismo carácter", "Las preventivas se anticipan al incidente (por ejemplo, copias de respaldo o validación de entrada del servidor), mientras que las reactivas se aplican tras detectarse el incidente (por ejemplo, bloqueo de procesos maliciosos o aislamiento del sistema)", "Las acciones reactivas solo pueden aplicarse antes de que ocurra el incidente", "Las acciones preventivas solo son aplicables a ataques de phishing"], "c": [1], "e": "Las acciones preventivas se anticipan al incidente (copias de respaldo, validación de entrada); las reactivas responden cuando ya se ha producido.", "nota": ""}, {"id": "4.20", "t": 4, "n": 20, "q": "¿Cuál es la finalidad del informe final elaborado en la fase de cierre del incidente?", "o": ["Servir como registro histórico y legal, incluyendo cronológica y detalladamente todas las acciones emprendidas desde el conocimiento del presunto incidente hasta su clasificación, análisis y respuesta", "Sustituir la necesidad de haber registrado el incidente en la herramienta ITSM", "Ser un documento exclusivamente interno sin ningún valor probatorio", "Anular retroactivamente la clasificación de peligrosidad inicialmente asignada"], "c": [0], "e": "El informe final es el registro histórico y legal del incidente, con cronología detallada de todas las acciones emprendidas.", "nota": ""}, {"id": "5.1", "t": 5, "n": 1, "q": "Según el tema, ¿cómo se clasifica el malware, y no por qué otro criterio?", "o": ["Por su sofisticación técnica", "Por su finalidad, ya que cada familia persigue algo distinto y deja un rastro distinto", "Exclusivamente por su lenguaje de programación", "Por el número de víctimas que alcanza en su primera semana"], "c": [1], "e": "El malware se clasifica por su finalidad, porque cada familia persigue algo distinto y deja un rastro distinto.", "nota": ""}, {"id": "5.2", "t": 5, "n": 2, "q": "¿Qué distingue al ransomware del resto de familias en cuanto a su huella?", "o": ["Es ruidoso por diseño: la víctima se entera en minutos porque de ello depende el cobro", "Es completamente silencioso y nunca se detecta", "No genera ningún tráfico de red", "Su finalidad es exclusivamente disruptiva, sin ánimo económico"], "c": [0], "e": "El ransomware es ruidoso por diseño: la víctima se entera en minutos porque de ello depende el cobro.", "nota": ""}, {"id": "5.3", "t": 5, "n": 3, "q": "¿Cuál es el rasgo definitorio del spyware según el tema?", "o": ["El cifrado de archivos para exigir rescate", "La exfiltración silenciosa, que se antepone a cualquier otra acción sobre el equipo", "La propagación automática sin intervención humana", "La destrucción irreversible de la información"], "c": [1], "e": "El rasgo definitorio del spyware es la exfiltración silenciosa, antepuesta a cualquier otra acción.", "nota": ""}, {"id": "5.4", "t": 5, "n": 4, "q": "¿Qué artículo del Código Penal alcanza a quien fabrica o facilita una herramienta de espionaje?", "o": ["El artículo 197 ter", "El artículo 264", "El artículo 248", "El artículo 570 bis"], "c": [0], "e": "El artículo 197 ter CP castiga a quien fabrica o facilita herramientas de espionaje.", "nota": ""}, {"id": "5.5", "t": 5, "n": 5, "q": "¿Cuáles son las cuatro familias clásicas del spyware según Anson, Bunting, Johnson y Pearson (2020)?", "o": ["Ransomware, gusano, RAT y wiper", "Keyloggers, adware/trackware, troyanos bancarios e infostealers", "MaaS, C2, loader y dropper", "Comercial, stalkerware, mercenario y criminal de masas"], "c": [1], "e": "Las cuatro familias clásicas de spyware son keyloggers, adware/trackware, troyanos bancarios e infostealers.", "nota": ""}, {"id": "5.6", "t": 5, "n": 6, "q": "¿Qué caracteriza al stalkerware frente a otras categorías de spyware no estrictamente criminal?", "o": ["Se vende exclusivamente a Estados y cuerpos policiales", "Se instala con acceso físico al dispositivo de la víctima, en un contexto habitual de violencia de género", "Persigue únicamente fines publicitarios", "No guarda relación con ningún delito contra la intimidad"], "c": [1], "e": "El stalkerware se instala con acceso físico al dispositivo de la víctima, en un contexto habitual de violencia de género.", "nota": ""}, {"id": "5.7", "t": 5, "n": 7, "q": "¿Qué NO hace un infostealer, a diferencia de otras familias de malware, según su definición en el tema?", "o": ["No persiste, no cifra, no destruye", "No exfiltra ningún tipo de credencial", "No puede distribuirse mediante phishing", "No afecta nunca a navegadores web"], "c": [0], "e": "Un infostealer no persiste, no cifra y no destruye: roba y se va.", "nota": ""}, {"id": "5.8", "t": 5, "n": 8, "q": "¿Cuál es el objetivo operativo de un infostealer?", "o": ["Mantener el control remoto del equipo de forma indefinida", "Maximizar la cantidad de credenciales, cookies, tokens y datos financieros exfiltrados en una única ejecución, antes de ser detectado", "Cifrar la información para exigir un rescate económico", "Propagarse lateralmente sin ayuda del usuario"], "c": [1], "e": "Su objetivo es maximizar credenciales, cookies, tokens y datos financieros exfiltrados en una única ejecución, antes de desaparecer.", "nota": ""}, {"id": "5.9", "t": 5, "n": 9, "q": "Según el tema, ¿por qué las cookies de sesión son hoy el activo más codiciado?", "o": ["Porque no tienen ningún valor en el mercado de logs", "Porque permiten el bypass de MFA mediante session hijacking, y una sesión válida en M365 o Google Workspace puede valer cientos de euros", "Porque caducan inmediatamente tras su robo", "Porque solo afectan a cuentas personales sin valor corporativo"], "c": [1], "e": "Las cookies de sesión permiten saltarse el MFA mediante session hijacking; una sesión válida en M365 o Google Workspace vale mucho.", "nota": ""}, {"id": "5.10", "t": 5, "n": 10, "q": "En la cadena de valor del Malware-as-a-Service, ¿qué papel desempeña el «afiliado»?", "o": ["Vende el stealer como suscripción mensual", "Compra acceso al stealer y monta las campañas de distribución", "Revende los logs individuales en el mercado", "Es quien sufre la infección inicial"], "c": [1], "e": "En la cadena del Malware-as-a-Service, el afiliado compra acceso al stealer y monta las campañas de distribución.", "nota": ""}, {"id": "5.11", "t": 5, "n": 11, "q": "¿Qué brecha de seguridad citada en el tema tuvo su origen en credenciales robadas por Raccoon Stealer?", "o": ["CircleCI (enero 2023)", "Orange España (enero 2024)", "Snowflake (mayo 2024)", "Compilation of Many Breaches"], "c": [1], "e": "La brecha de Orange España (enero 2024) tuvo su origen en credenciales robadas por Raccoon Stealer.", "nota": ""}, {"id": "5.12", "t": 5, "n": 12, "q": "¿En qué lenguaje está desarrollado RedLine Stealer y qué tecnología usa para su C2?", "o": [".NET (C#), usando WCF", "Python, usando sockets RAW", "C++, usando gRPC", "JavaScript, usando WebSockets"], "c": [0], "e": "RedLine Stealer está desarrollado en .NET (C#) y usa WCF para su C2.", "nota": ""}, {"id": "5.13", "t": 5, "n": 13, "q": "¿Qué nivel de persistencia presenta habitualmente RedLine Stealer?", "o": ["Persistencia muy alta mediante tareas programadas", "Habitualmente ninguna, al estar diseñado para exfiltración rápida y borrado", "Persistencia exclusivamente en el registro de Windows", "Persistencia garantizada mediante rootkit"], "c": [1], "e": "RedLine suele no tener persistencia: está diseñado para exfiltrar rápido y borrarse.", "nota": ""}, {"id": "5.14", "t": 5, "n": 14, "q": "¿Cuál es la secuencia correcta de la cadena de infección típica de RedLine?", "o": ["Cebo → Loader → Descarga del payload → Ejecución → Inventario y exfiltración → Envío al C2 y autoborrado", "Ejecución → Cebo → Envío al C2 → Loader → Exfiltración → Autoborrado", "Descarga del payload → Cebo → Autoborrado → Loader → Ejecución → Exfiltración", "Inventario → Cebo → Loader → Autoborrado → Ejecución → Envío al C2"], "c": [0], "e": "La cadena típica es cebo → loader → descarga del payload → ejecución → inventario y exfiltración → envío al C2 y autoborrado.", "nota": ""}, {"id": "5.15", "t": 5, "n": 15, "q": "¿Qué indicador de red es característico de la comunicación C2 de RedLine?", "o": ["Tráfico HTTP estándar por el puerto 80 exclusivamente", "TCP sobre puerto efímero, con datos serializados usando namespaces tempuri.org", "Comunicación exclusiva por DNS sobre HTTPS", "Uso exclusivo de protocolos de correo electrónico"], "c": [1], "e": "El C2 de RedLine usa TCP sobre puerto efímero, con datos serializados con namespaces tempuri.org.", "nota": ""}, {"id": "5.16", "t": 5, "n": 16, "q": "¿A qué tipo penal puede dar lugar el uso de credenciales o cookies robadas para defraudar?", "o": ["Artículo 197 bis CP", "Artículos 248 y 249 CP (estafa informática)", "Artículo 570 bis CP exclusivamente", "Artículo 264 CP exclusivamente"], "c": [1], "e": "Usar credenciales o cookies robadas para defraudar puede constituir estafa informática (arts. 248 y 249 CP).", "nota": ""}, {"id": "5.17", "t": 5, "n": 17, "q": "¿Qué agravante suele aplicarse cuando existe una estructura de operador y afiliados con jerarquía y reparto de tareas?", "o": ["El artículo 197 ter, siempre en su forma básica", "El artículo 570 bis CP, por organización o grupo criminal", "No existe ninguna agravante aplicable a estas estructuras", "El artículo 264 CP en su modalidad imprudente"], "c": [1], "e": "Una estructura de operador y afiliados con jerarquía y reparto de tareas puede agravar por organización o grupo criminal (art. 570 bis CP).", "nota": ""}, {"id": "5.18", "t": 5, "n": 18, "q": "¿Qué medida de higiene básica «mata el robo de contraseña» según el tema?", "o": ["El filtrado DNS corporativo", "El MFA resistente a phishing (FIDO2/passkeys)", "El Endpoint Privilege Management", "La vida útil de cookie corta"], "c": [1], "e": "El MFA resistente a phishing (FIDO2/passkeys) «mata el robo de contraseña», porque la credencial robada no sirve sin el factor.", "nota": ""}, {"id": "5.19", "t": 5, "n": 19, "q": "Antes de comenzar el análisis con Wireshark, ¿qué configuración recomienda expresamente el tema?", "o": ["Configurar la columna de tiempo en UTC", "Desactivar todos los disectores de protocolo", "Instalar un antivirus adicional en el equipo de análisis", "Conectar el equipo de análisis a la red de producción"], "c": [0], "e": "Antes de analizar con Wireshark se recomienda configurar la columna de tiempo en UTC para correlacionar sin ambigüedad.", "nota": ""}, {"id": "5.20", "t": 5, "n": 20, "q": "¿Cuál es la primera regla del laboratorio respecto a la captura de tráfico entregada?", "o": ["Ejecutar los binarios encontrados para comprobar su comportamiento", "No ejecutar nada de lo que aparece en la captura; analizarla con Wireshark es seguro, todo lo demás no", "Visitar los dominios observados para confirmar que están activos", "Subir el fichero a un servicio público de análisis para obtener una segunda opinión"], "c": [1], "e": "Primera regla: no ejecutar nada de lo que aparece en la captura; analizarla con Wireshark es seguro, todo lo demás no.", "nota": ""}, {"id": "6.1", "t": 6, "n": 1, "q": "Según el tema, ¿cuál es el criterio que distingue un incidente de ciberseguridad de un ciberdelito para las Fuerzas y Cuerpos de Seguridad?", "o": ["La cantidad económica de las pérdidas ocasionadas", "El límite es puramente jurídico: lo que para una entidad es una crisis de disponibilidad, confidencialidad o integridad, para las FCS constituye la noticia criminis de un hecho delictivo tipificado penalmente", "El número de sistemas afectados por el ataque", "La nacionalidad del atacante identificado"], "c": [1], "e": "El límite entre incidente y ciberdelito es puramente jurídico: lo que para una entidad es una crisis de disponibilidad, confidencialidad o integridad, para la policía puede ser un delito.", "nota": ""}, {"id": "6.2", "t": 6, "n": 2, "q": "¿Por qué se afirma que la escena del crimen digital es diferente de la de un delito tradicional?", "o": ["Porque es estática y siempre se localiza en un único país", "Porque es volátil, intangible y frecuentemente deslocalizada a través de múltiples jurisdicciones internacionales", "Porque nunca requiere cadena de custodia", "Porque solo puede investigarse mediante Comisión Rogatoria Internacional"], "c": [1], "e": "La escena digital es volátil, intangible y con frecuencia deslocalizada entre varias jurisdicciones.", "nota": ""}, {"id": "6.3", "t": 6, "n": 3, "q": "¿Qué diferencia la respuesta ante incidentes corporativa de la investigación policial según el tema?", "o": ["Son términos sinónimos con idéntico objetivo", "La corporativa busca la resiliencia, mitigar el daño y restaurar el negocio; la policial busca la persecución del delito, la obtención de pruebas válidas y la detención de los autores", "La corporativa siempre precede y sustituye a la investigación policial", "La investigación policial solo puede iniciarse mediante denuncia de la entidad afectada"], "c": [1], "e": "La respuesta corporativa busca resiliencia, mitigar el daño y restaurar el negocio; la policial busca perseguir el delito.", "nota": ""}, {"id": "6.4", "t": 6, "n": 4, "q": "¿Qué órgano actúa como nodo de enlace del Ministerio del Interior entre las Fuerzas y Cuerpos de Seguridad y los operadores de servicios esenciales?", "o": ["El CCN-CERT", "El INCIBE-CERT", "La Oficina de Coordinación de Ciberseguridad (OCC)", "Europol (EC3)"], "c": [2], "e": "La Oficina de Coordinación de Ciberseguridad (OCC) es el nodo de enlace del Ministerio del Interior entre las Fuerzas y Cuerpos y los operadores de servicios esenciales.", "nota": ""}, {"id": "6.5", "t": 6, "n": 5, "q": "¿Cuál es la diferencia principal entre el CCN-CERT y el INCIBE-CERT?", "o": ["El CCN-CERT coordina la respuesta en el sector público y en infraestructuras críticas; el INCIBE-CERT es de referencia para ciudadanos, pymes y operadores privados", "El INCIBE-CERT es exclusivo para organismos militares", "El CCN-CERT no tiene competencias en ciberseguridad", "Ambos son el mismo organismo con nombres distintos"], "c": [0], "e": "El CCN-CERT coordina la respuesta en el sector público y en infraestructuras críticas; el INCIBE-CERT es de referencia para el sector privado y la ciudadanía.", "nota": ""}, {"id": "6.6", "t": 6, "n": 6, "q": "¿Cuál es la principal aportación del Convenio de Budapest a la investigación de ciberdelitos?", "o": ["Elimina la necesidad de cooperación judicial internacional", "Homogeneiza los tipos penales entre países firmantes y establece mecanismos ágiles como la red de puntos de contacto 24/7 para la conservación inmediata de datos", "Sustituye a Europol e Interpol en todas sus funciones", "Obliga a las multinacionales tecnológicas a entregar directamente el contenido de las comunicaciones sin mandato judicial"], "c": [1], "e": "El Convenio de Budapest homogeneiza los tipos penales entre países firmantes y establece mecanismos ágiles, como la red de puntos de contacto 24/7.", "nota": ""}, {"id": "6.7", "t": 6, "n": 7, "q": "¿Cuál es la función principal de Europol (EC3) en la investigación de ciberdelitos?", "o": ["Detener directamente a los sospechosos en cualquier país europeo", "Coordinar Operational Task Forces, centralizar inteligencia sobre cibercrimen y proporcionar apoyo técnico, sin disponer de competencias ejecutivas directas", "Sustituir a los jueces nacionales en la autorización de pruebas digitales", "Gestionar exclusivamente la cooperación con América Latina y Asia"], "c": [1], "e": "Europol (EC3) coordina Operational Task Forces, centraliza inteligencia y ofrece apoyo técnico, pero no dispone de poder ejecutivo propio.", "nota": ""}, {"id": "6.8", "t": 6, "n": 8, "q": "¿Qué permite la Orden Europea de Investigación (OEI)?", "o": ["Que un juez español solicite la obtención de una prueba digital directamente a la autoridad judicial de otro Estado miembro de la UE en plazos estrictos", "Que la policía española detenga directamente a sospechosos en otros países de la UE", "Que las empresas tecnológicas ignoren las leyes de protección de datos europeas", "Que se elimine la necesidad de cualquier cooperación judicial en la UE"], "c": [0], "e": "La OEI permite que un juez español solicite una prueba digital directamente a la autoridad judicial de otro Estado miembro.", "nota": ""}, {"id": "6.9", "t": 6, "n": 9, "q": "¿Por qué resulta importante haber utilizado previamente los canales policiales de conservación urgente de datos frente a una Comisión Rogatoria Internacional (CRI)?", "o": ["Porque la CRI es un proceso tradicionalmente más lento y la prueba podría borrarse antes de que llegue la autorización judicial", "Porque la CRI está reservada exclusivamente a delitos económicos", "Porque la CRI no puede utilizarse fuera de la Unión Europea", "Porque la conservación urgente sustituye por completo a la autorización judicial"], "c": [0], "e": "La CRI es un proceso tradicionalmente lento y la prueba podría borrarse antes de la autorización; por eso se usa antes la conservación urgente por canales policiales.", "nota": ""}, {"id": "6.10", "t": 6, "n": 10, "q": "¿Qué son los Law Enforcement Request Systems que disponen las grandes tecnológicas?", "o": ["Sistemas de cifrado utilizados por los ciberdelincuentes", "Portales específicos para que las Fuerzas y Cuerpos de Seguridad soliciten preservación o datos, dada la agilidad que exige el laberinto jurisdiccional", "Un tratado internacional alternativo al Convenio de Budapest", "Un estándar técnico de cifrado de extremo a extremo"], "c": [1], "e": "Los Law Enforcement Request Systems son portales de las tecnológicas para que las Fuerzas y Cuerpos soliciten preservación o datos con agilidad.", "nota": ""}, {"id": "6.11", "t": 6, "n": 11, "q": "¿En qué se diferencian, según el tema, la preservación inmediata de datos y la entrega del contenido de las comunicaciones frente a una tecnológica?", "o": ["Ambas requieren siempre mandato judicial previo", "La preservación puede solicitarse directamente en situaciones de urgencia, mientras que la entrega del contenido sigue requiriendo mandato judicial formal", "La entrega del contenido nunca requiere autorización alguna", "No existe diferencia jurídica entre ambas figuras"], "c": [1], "e": "La preservación puede pedirse directamente en urgencia; la entrega del contenido de las comunicaciones sigue requiriendo autorización judicial.", "nota": ""}, {"id": "6.12", "t": 6, "n": 12, "q": "¿En qué se fundamenta principalmente una simulación de gestión de incidentes según el tema?", "o": ["Es un juego improvisado sin base metodológica", "Es una herramienta de capacitación basada en la andragogía y la gestión de crisis, orientada a entrenar la heurística del investigador bajo estrés e incertidumbre", "Se basa exclusivamente en la memorización de artículos del Código Penal", "Solo puede aplicarse a alumnos sin experiencia policial previa"], "c": [1], "e": "La simulación es una herramienta de capacitación basada en la andragogía y la gestión de crisis, para entrenar la toma de decisiones bajo presión.", "nota": ""}, {"id": "6.13", "t": 6, "n": 13, "q": "¿Qué marco normativo internacional define las fases de planificación, detección, evaluación, respuesta y lecciones aprendidas para una simulación?", "o": ["La norma ISO/IEC 27035", "El Convenio de Budapest", "El RGPD", "La ECPA estadounidense"], "c": [0], "e": "La norma ISO/IEC 27035 define las fases de planificación, detección, evaluación, respuesta y lecciones aprendidas.", "nota": ""}, {"id": "6.14", "t": 6, "n": 14, "q": "¿Qué caracteriza a un ejercicio de mesa (Tabletop Exercise, TTX)?", "o": ["Requiere el despliegue de una infraestructura de red real (Cyber Range)", "Es una simulación teórica basada en la discusión de una narrativa de crisis, sin requerir infraestructura tecnológica real", "Implica que un Red Team ejecute un ransomware controlado sobre servidores reales", "Solo evalúa la fase de adquisición forense en tiempo real"], "c": [1], "e": "Un ejercicio de mesa (TTX) es una simulación teórica basada en la discusión de una narrativa de crisis, sin infraestructura tecnológica real.", "nota": ""}, {"id": "6.15", "t": 6, "n": 15, "q": "¿Qué distingue a los ejercicios funcionales (Functional Exercises) de los ejercicios de mesa?", "o": ["Los funcionales introducen la variable del tiempo real y evalúan capacidades específicas mediante comunicaciones simuladas", "Los funcionales no requieren ningún tipo de interacción entre los participantes", "Los funcionales sustituyen completamente a los simulacros completos", "Los funcionales solo pueden realizarse con la Célula Roja inactiva"], "c": [0], "e": "Los ejercicios funcionales introducen el tiempo real y evalúan capacidades específicas mediante comunicaciones simuladas.", "nota": ""}, {"id": "6.16", "t": 6, "n": 16, "q": "En la estructura organizativa de una simulación, ¿qué función desempeña la White Team (Célula Blanca)?", "o": ["Actúa como los investigadores policiales que responden al incidente", "Dirige el ejercicio, controla el reloj, introduce inyecciones de información y evalúa las reacciones de los alumnos", "Representa siempre y exclusivamente a la amenaza en los simulacros completos", "Ejecuta el ransomware real contra los servidores de la empresa"], "c": [1], "e": "La White Team (Célula Blanca) dirige el ejercicio, controla el reloj, introduce inyecciones de información y evalúa las reacciones.", "nota": ""}, {"id": "6.17", "t": 6, "n": 17, "q": "Según el ciclo de vida del ransomware moderno (Human-Operated Ransomware) descrito en el tema, ¿en qué fase se produce la «primera extorsión»?", "o": ["En la fase de compromiso inicial", "En la fase de movimiento lateral y escalada de privilegios", "En la fase de exfiltración, cuando el atacante roba información confidencial antes de cifrar", "En la fase de despliegue y cifrado"], "c": [2], "e": "En el ransomware operado por humanos, la primera extorsión ocurre en la fase de exfiltración, cuando se roba información antes de cifrar.", "nota": ""}, {"id": "6.18", "t": 6, "n": 18, "q": "¿Qué ocurre durante la fase de despliegue y cifrado (segunda extorsión) del ransomware?", "o": ["Se produce el acceso inicial mediante credenciales robadas o phishing", "Se ejecutan los binarios del ransomware en toda la red, se destruyen las copias de seguridad locales y aparece la nota de rescate", "El atacante compromete el controlador de dominio sin causar ningún efecto visible", "Se genera únicamente la exfiltración de datos sin cifrado posterior"], "c": [1], "e": "En despliegue y cifrado (segunda extorsión) se ejecutan los binarios en toda la red, se destruyen copias locales y aparece la nota de rescate.", "nota": ""}, {"id": "6.19", "t": 6, "n": 19, "q": "¿Qué mide el KPI policial denominado MTTD (Mean Time to Detect) en una simulación?", "o": ["El tiempo que tarda el ransomware en cifrar toda la red", "Cuánto tardan los investigadores en identificar la gravedad real del incidente tras recibir la primera alerta", "El número de servidores comprometidos durante el ejercicio", "El coste económico total del incidente simulado"], "c": [1], "e": "El MTTD mide cuánto tardan los investigadores en identificar la gravedad real del incidente tras la primera alerta.", "nota": ""}, {"id": "6.20", "t": 6, "n": 20, "q": "¿Por qué la norma general en la primera actuación policial es «aislar, no apagar» los equipos afectados por un incidente?", "o": ["Porque apagar el equipo mejora la velocidad de la investigación forense", "Porque apagar el equipo implica la pérdida instantánea de la información volátil de la memoria RAM, donde se alojan claves de cifrado, conexiones activas y trazas del malware", "Porque la ley prohíbe expresamente apagar cualquier dispositivo electrónico intervenido", "Porque los equipos apagados no pueden aislarse de la red mediante firewall"], "c": [1], "e": "«Aislar, no apagar»: apagar pierde al instante la información volátil de la RAM, donde hay claves y evidencias.", "nota": ""}];

    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
</body>
</html>
