<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso Máster · Test por asignaturas</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1f24;--mute:#5d6570;--line:#dcd9d0;--acc:#1f4e79;--accbg:#e6eef6;--ok:#17703a}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#e8eaed;--mute:#9aa3ad;--line:#333a42;--acc:#7fb3e6;--accbg:#22364a;--ok:#6fd09a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:960px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0;font-size:.95rem}
main{max-width:960px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--acc);transform:translateY(-2px);outline:none}
.code{align-self:flex-start;font-size:.75rem;font-weight:700;background:var(--accbg);color:var(--acc);border-radius:6px;padding:2px 9px}
.name{font-weight:700;font-size:1.05rem;margin-top:2px}
.desc{color:var(--mute);font-size:.88rem;flex:1}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
footer{max-width:960px;margin:0 auto;padding:8px 16px 40px;color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<header>
  <h1>Repaso del máster</h1>
  <p class="sub">Test de repaso por asignatura, más test global. Elige una, responde y comprueba al momento con su explicación.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>Tu progreso se guarda solo en este dispositivo y navegador. Material de estudio elaborado a partir de los apuntes de cada asignatura.</footer>
<script>
const SUBJECTS=[
 {k:'01',file:'asig01.html',name:'Ciberinteligencia',desc:'Ciberdelincuencia y Ciberinteligencia',n:156},
 {k:'02',file:'asig02.html',name:'Criptografía',desc:'Criptografía aplicada y seguridad de la información',n:80},
 {k:'03',file:'asig03.html',name:'Psicología',desc:'Psicología del ciberdelincuente y sociología digital',n:120},
 {k:'05',file:'asig05.html',name:'OSINT',desc:'Recopilación y análisis de información en fuentes abiertas',n:80},
 {k:'06',file:'asig06.html',name:'Inteligencia estratégica',desc:'Inteligencia estratégica en ciberseguridad',n:80},
 {k:'07',file:'asig07.html',name:'Forense',desc:'Análisis forense digital y cadena de custodia',n:160},
 {k:'08',file:'asig08.html',name:'Ciberataques',desc:'Ciberataques y gestión de incidentes de seguridad',n:120},
 {k:'09',file:'asig09.html',name:'Criptoactivos',desc:'Criptoactivos, blockchain y fraudes cibernéticos',n:140},
 {k:'10',file:'asig10.html',name:'Hacking ético',desc:'Hacking ético y auditorías de seguridad',n:160},
  {k:'10',file:'test_ciberdelincuencia_ASIG08_240_ASIG09_340_EXPLICADO.html',name:'Test 1,8 y 9',desc:'Test del último tirón',n:400}
];
const grid=document.getElementById('grid');
SUBJECTS.forEach(s=>{
  let done=0;
  try{const st=JSON.parse(localStorage.getItem('asig'+s.k+'_testresumen_v1')||'{}');done=Object.keys(st).filter(x=>x[0]!=='_').length;}catch(e){}
  const a=document.createElement('a');a.className='card';a.href=s.file;
  a.innerHTML=`<span class="code">ASIG${s.k}</span><span class="name">${s.name}</span><span class="desc">${s.desc}</span>
  <div class="bar"><i style="width:${Math.min(100,done/s.n*100)}%"></i></div>
  <div class="meta"><span>${s.n} preguntas</span><span>${done?done+' respondidas':'Sin empezar'}</span></div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
