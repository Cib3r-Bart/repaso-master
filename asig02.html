<script>
const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "En el modelo de cifrado simétrico, uno de los factores de seguridad fundamentales es que:", "o": ["El algoritmo debe mantenerse en secreto.", "La clave debe ser secreta, pero no necesariamente el algoritmo.", "La clave puede intercambiarse por cualquier canal sin precauciones.", "Es imposible recuperar el texto cifrado a partir del texto claro."], "c": [1], "e": "Según el principio de Kerckhoffs, la seguridad descansa en la clave, que es secreta; el algoritmo puede ser público. Si hubiera que ocultar el algoritmo, el sistema sería frágil.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "En la sustitución monoalfabética múltiple, a diferencia de la simple:", "o": ["Cada símbolo se sustituye siempre por el mismo símbolo.", "Un símbolo puede tener varios homófonos según su frecuencia, aunque los patrones de múltiples letras sobreviven.", "Se eliminan por completo los patrones de frecuencia.", "Solo puede aplicarse a alfabetos binarios."], "c": [1], "e": "Con homófonos, un mismo símbolo claro puede cifrarse de varias formas según su frecuencia, lo que dificulta el análisis de frecuencias; pero los patrones de varias letras (dígrafos, trígrafos) sobreviven.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "El cifrado Playfair es un ejemplo de sustitución:", "o": ["Polialfabética.", "Monoalfabética poligráfica (di-grafémica).", "De trasposición columnar.", "De clave de un solo uso."], "c": [1], "e": "Playfair cifra por parejas de letras (digramas, matriz 5×5), por eso es monoalfabética poligráfica (digrámica), no polialfabética.", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "En el cifrado de Vigenère, la clave:", "o": ["Es siempre de un único carácter.", "Determina, para cada posición, cuál de los 26 cifrados del César se aplica, usándose de forma cíclica.", "Solo puede usarse una vez y debe ser tan larga como el texto.", "No influye en el resultado del cifrado."], "c": [1], "e": "En Vigenère cada letra de la clave elige uno de los 26 cifrados del César para esa posición, y la clave se repite de forma cíclica.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "El cifrado de Vernam (clave de un solo uso) se basa en:", "o": ["La operación O-exclusivo (XOR) entre texto claro y clave, con clave independiente del texto y de igual longitud.", "La sustitución monoalfabética poligráfica.", "La permutación de columnas según una palabra clave.", "El uso de máquinas rotoras de tres cilindros."], "c": [0], "e": "Vernam opera bit a bit con XOR entre texto claro y clave; la clave debe ser independiente del texto y tan larga como él (cᵢ = pᵢ ⊕ kᵢ).", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "La trasposición, como técnica clásica de cifrado, se caracteriza por:", "o": ["Sustituir cada símbolo del texto claro por otro símbolo.", "Permutar (reordenar) los símbolos del texto claro, sin sustituirlos.", "Requerir necesariamente una máquina rotora.", "Ser un caso particular del cifrado de Vigenère."], "c": [1], "e": "La trasposición no cambia los símbolos: solo los reordena (permutación por bloques, filas/columnas).", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "Con un conjunto de 3 cilindros, la máquina Enigma genera, antes de repetirse, un número de alfabetos de sustitución igual a:", "o": ["26.", "676.", "17.576.", "11.881.376."], "c": [2], "e": "Con 3 cilindros de 26 posiciones hay 26×26×26 = 17.576 alfabetos antes de repetirse. (11.881.376 corresponde a 5 cilindros.)", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "DES (Data Encryption Standard) se caracteriza por:", "o": ["Cifrar bloques de 128 bits con claves de 256 bits.", "Cifrar bloques de 64 bits usando claves de 56 bits, en 16 iteraciones.", "Ser el sucesor directo y vigente de AES.", "No tener relación con el proyecto LUCIFER de IBM."], "c": [1], "e": "DES cifra bloques de 64 bits con clave de 56 bits, en 16 iteraciones. Está obsoleto y sustituido por AES.", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "El criptoanálisis de “encuentro a la mitad” es relevante porque demuestra que:", "o": ["AES es vulnerable a fuerza bruta.", "El doble cifrado DES (dos etapas) no incrementa la seguridad tanto como se esperaría frente a ataques que conocen pares (P, C).", "RSA puede romperse con ordenadores clásicos.", "El cifrado de Vernam es inseguro."], "c": [1], "e": "Con un par (P, C) conocido se ataca cada etapa por separado (X = Eₖ₁(P) = Dₖ₂(C)), así que el doble DES no duplica la seguridad esperada.", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "El algoritmo IDEA se caracteriza por:", "o": ["Bloques de 128 bits y clave de 64 bits.", "Bloques de 64 bits y clave de 128 bits, siendo usado por PGP.", "Ser un algoritmo de clave pública.", "Estar basado en curvas elípticas."], "c": [1], "e": "IDEA usa bloques de 64 bits y clave de 128 bits, y se hizo conocido por su uso en PGP.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "El algoritmo Rijndael, ganador del concurso AES del NIST (1997):", "o": ["Solo admite bloques y claves de 64 bits.", "Es un caso particular de AES.", "Permite distintos tamaños de datos y de claves; AES es un caso particular de Rijndael.", "Fue desarrollado por IBM."], "c": [2], "e": "Rijndael admite distintos tamaños de bloque y de clave; AES es el caso particular que el NIST estandarizó (bloque de 128 bits).", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "En una ronda principal del algoritmo AES, ¿cuál es el orden correcto de las transformaciones?", "o": ["AddRoundKey, MixColumns, ShiftRows, SubBytes.", "SubBytes, ShiftRows, MixColumns, AddRoundKey.", "ShiftRows, SubBytes, AddRoundKey, MixColumns.", "MixColumns, SubBytes, ShiftRows, AddRoundKey."], "c": [1], "e": "El orden en una ronda principal de AES es SubBytes → ShiftRows → MixColumns → AddRoundKey.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "La ronda final del algoritmo AES se diferencia de las rondas principales en que:", "o": ["Añade una transformación MixColumns adicional.", "No incluye la transformación MixColumns.", "No incluye AddRoundKey.", "Es idéntica a la ronda inicial."], "c": [1], "e": "La ronda final de AES omite MixColumns; el resto de transformaciones se mantienen.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "La multiplicación en el cuerpo finito usado por AES (GF(2⁸)) se realiza:", "o": ["Como multiplicación entera estándar, sin módulo.", "Como multiplicación de polinomios módulo un polinomio irreducible de grado 8.", "Mediante suma XOR exclusivamente.", "Solo es aplicable a claves de 256 bits."], "c": [1], "e": "En GF(2⁸) los bytes se tratan como polinomios; se multiplican y el resultado se reduce módulo un polinomio irreducible de grado 8.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "El modo de operación ECB (Electronic CodeBook) se caracteriza por:", "o": ["Encadenar cada bloque cifrado con el anterior mediante XOR.", "Cifrar cada bloque de forma independiente con el mismo algoritmo y clave.", "Requerir obligatoriamente un vector de inicialización distinto para cada bloque.", "Ser el modo más seguro y recomendado actualmente."], "c": [1], "e": "En ECB cada bloque se cifra de forma independiente con el mismo algoritmo y clave; por eso bloques iguales dan cifrados iguales.", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Cuál de los siguientes modos de operación es el más utilizado actualmente, al combinar el modo Counter con un código de autenticación de mensajes?", "o": ["ECB.", "CBC.", "OFB.", "GCM (Galois Counter Mode)."], "c": [3], "e": "GCM combina el modo Counter (CTR) con autenticación de mensajes (Galois), dando cifrado autenticado; es el más usado hoy.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "En el modelo de cifrado asimétrico, las claves se asocian a:", "o": ["Enlaces o pares de entidades, igual que en el cifrado simétrico.", "Entidades individuales (cada sistema genera su propio par de claves).", "Sesiones temporales únicamente.", "Algoritmos concretos de cifrado."], "c": [1], "e": "En criptografía asimétrica cada entidad genera su propio par de claves (pública y privada), a diferencia de la simétrica, donde se comparte una sola.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "En el algoritmo RSA, la clave pública se representa como KU = {e, n} y la clave privada como KR = {d, n}, donde la relación entre e y d viene dada por:", "o": ["e + d = n.", "e·d ≡ 1 mod φ(n), siendo φ(n) = (p−1)·(q−1).", "e = d.", "e·d = n."], "c": [1], "e": "En RSA, d es el inverso de e módulo φ(n): e·d ≡ 1 mod φ(n), con φ(n) = (p−1)(q−1).", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "El protocolo de Diffie-Hellman para fijación de clave descentralizada basa su seguridad en la dificultad de:", "o": ["Factorizar números grandes en sus factores primos.", "Calcular el logaritmo discreto: dado g^x mod n = y, encontrar x.", "Invertir una función XOR.", "Generar números primos grandes."], "c": [1], "e": "Diffie-Hellman se basa en el logaritmo discreto: dado gˣ mod n = y, es inviable obtener x. (La factorización es la base de RSA.)", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "El principal motivo por el que las curvas elípticas resultan atractivas en criptografía es que:", "o": ["Eliminan por completo la necesidad de claves.", "Permiten un nivel de seguridad equivalente con claves de longitud más corta que RSA.", "No requieren ningún cuerpo finito."], "c": [1], "e": "Las curvas elípticas dan un nivel de seguridad equivalente al de RSA con claves bastante más cortas.", "nota": "En el PDF original esta pregunta solo muestra tres opciones (A–C)."}, {"id": "2.1", "t": 2, "n": 1, "q": "¿Qué establece el Principio de Kerckhoffs (1883)?", "o": ["El algoritmo debe mantenerse en secreto absoluto.", "La clave debe integrarse en el hardware.", "La seguridad debe residir exclusivamente en la clave, no en el secreto del algoritmo.", "Se necesitan al menos dos claves para que un sistema sea seguro."], "c": [2], "e": "Kerckhoffs (1883): la seguridad debe residir exclusivamente en la clave, no en mantener secreto el algoritmo.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Cuál es la diferencia fundamental entre criptografía simétrica y asimétrica?", "o": ["La simétrica usa algoritmos más complejos.", "La simétrica usa la misma clave para cifrar y descifrar; la asimétrica usa un par de claves diferentes.", "La asimétrica es más rápida que la simétrica.", "La simétrica no puede usarse en redes."], "c": [1], "e": "La simétrica usa una única clave compartida; la asimétrica, un par de claves distintas (pública y privada). La diferencia de fondo es el número y rol de las claves, no la complejidad.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Cuántos bits tiene la clave efectiva del algoritmo DES?", "o": ["64 bits.", "56 bits.", "128 bits.", "112 bits."], "c": [1], "e": "DES tiene claves de 64 bits, de los cuales 8 son de paridad, con lo que la clave efectiva es de 56 bits.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Cuál es el tamaño de bloque y las posibles longitudes de clave del estándar AES?", "o": ["Bloque de 64 bits; claves de 56, 112 o 168 bits.", "Bloque de 128 bits; claves de 128, 192 o 256 bits.", "Bloque de 128 bits; clave fija de 256 bits.", "Bloque de 256 bits; claves de 128 o 256 bits."], "c": [1], "e": "AES usa bloques de 128 bits y claves de 128, 192 o 256 bits (10, 12 o 14 rondas).", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Por qué el modo ECB (Electronic Codebook) es considerado INSEGURO?", "o": ["Porque no usa IV (Vector de Inicialización).", "Porque cifra los bloques de forma dependiente entre sí.", "Porque bloques idénticos de plaintext producen bloques idénticos de ciphertext, revelando patrones.", "Porque solo funciona con claves de 56 bits."], "c": [2], "e": "En ECB, bloques de texto claro idénticos producen bloques cifrados idénticos, revelando patrones (el clásico caso de la imagen cifrada que aún se reconoce).", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Qué modo de operación combina cifrado de bloque con autenticación (AEAD) y es estándar en TLS 1.3?", "o": ["CBC.", "ECB.", "OFB.", "GCM."], "c": [3], "e": "GCM es un modo AEAD (cifrado autenticado con datos asociados) y es el estándar en TLS 1.3.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Cuál es el principal problema del cifrado simétrico?", "o": ["Su velocidad de procesamiento excesivamente baja.", "La dificultad para distribuir de forma segura la clave compartida entre emisor y receptor.", "La imposibilidad de cifrar bloques de datos grandes.", "Que no puede garantizar la integridad de los datos."], "c": [1], "e": "El gran problema del cifrado simétrico es distribuir de forma segura la clave compartida; además, N usuarios necesitan N(N−1)/2 claves.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "¿Qué diferencia al cifrado de flujo (stream cipher) del cifrado de bloque (block cipher)?", "o": ["El cifrado de flujo no usa claves.", "El cifrado de bloque cifra bit a bit combinando con un flujo de clave pseudoaleatorio; el de flujo divide en bloques fijos.", "El cifrado de flujo cifra bit a bit con un flujo de clave pseudoaleatorio; el de bloque divide el mensaje en bloques de tamaño fijo.", "El cifrado de flujo solo puede usarse offline."], "c": [2], "e": "El cifrado de flujo cifra bit a bit (o byte a byte) con un keystream pseudoaleatorio; el de bloque trabaja con bloques de tamaño fijo.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Cuál de los siguientes algoritmos de cifrado de flujo se considera INSEGURO y está desaconsejado?", "o": ["ChaCha20.", "Salsa20.", "RC4.", "AES en modo CTR."], "c": [2], "e": "RC4 presenta sesgos y vulnerabilidades conocidas, por lo que está desaconsejado.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "¿Qué solución resuelve el problema de distribución de claves simétricas permitiendo establecer una clave compartida sobre un canal inseguro?", "o": ["DES.", "ECB.", "Protocolo Diffie-Hellman.", "SHA-256."], "c": [2], "e": "Diffie-Hellman permite acordar una clave compartida sobre un canal inseguro, resolviendo el problema de distribución de claves.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Qué significa que un algoritmo criptográfico sea “AEAD”?", "o": ["Advanced Encryption Algorithm with Digital signatures.", "Authenticated Encryption with Associated Data: proporciona confidencialidad e integridad simultáneamente.", "Asymmetric Encryption and Authentication Data.", "Automatic Encryption with Associated Decryption."], "c": [1], "e": "AEAD = Authenticated Encryption with Associated Data: aporta confidencialidad e integridad a la vez, y autentica también datos asociados no cifrados.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "Para que el Cifrado de Vernam (One-Time Pad) garantice Seguridad Perfecta según Shannon, ¿cuál de las siguientes condiciones es FALSA?", "o": ["La clave debe ser tan larga como el mensaje.", "La clave nunca puede reutilizarse.", "Un generador LFSR es una fuente válida de aleatoriedad para la clave OTP.", "La clave debe ser conocida únicamente por emisor y receptor."], "c": [2], "e": "La clave del OTP debe ser verdaderamente aleatoria; un LFSR es un generador pseudoaleatorio predecible y no sirve, por eso esa afirmación es la falsa.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿Cuál es la “paradoja logística” del Cifrado de Vernam que impide su uso masivo en Internet?", "o": ["El XOR no puede aplicarse a datos de más de 64 bits.", "Necesita ser ejecutado en hardware específico no disponible comercialmente.", "Si se dispone de un canal seguro para transmitir la clave (del mismo tamaño que el mensaje), ese canal podría usarse para enviar directamente el mensaje en claro.", "El algoritmo de Berlekamp-Massey lo rompe en tiempo polinomial."], "c": [2], "e": "Para usar un OTP hay que transmitir una clave tan larga como el mensaje por un canal seguro; ese mismo canal podría llevar directamente el mensaje.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Cuál es la VULNERABILIDAD CRÍTICA de un cifrado en flujo si se reutiliza la clave (keystream)?", "o": ["El padding se corrompe y el receptor no puede descifrar.", "Un atacante puede hacer XOR de dos criptogramas cifrados con el mismo keystream y obtener información sobre los plaintexts.", "Se produce una colisión en el LFSR que detiene el generador.", "El modo ECB pasa a ser el modo operativo por defecto."], "c": [1], "e": "Si se reutiliza el keystream, al hacer XOR de dos criptogramas se anula la clave (C₁⊕C₂ = P₁⊕P₂) y se filtra información de los textos claros.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "La Red de Feistel garantiza que el descifrado sea idéntico al cifrado. ¿Qué propiedad matemática hace esto posible?", "o": ["La función interna f debe ser biyectiva e invertible en todos los casos.", "El operador XOR es su propia inversa, por lo que aplicar la misma función con las subclaves en orden inverso revierte el proceso sin necesidad de que f sea invertible.", "Las S-Boxes del DES están diseñadas para ser simétricas respecto al punto de media iteración.", "El padding PKCS#7 garantiza la reversibilidad del bloque final."], "c": [1], "e": "El XOR es su propia inversa: aplicando la misma estructura con las subclaves en orden inverso se descifra, sin que la función f tenga que ser invertible.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué operación del AES es responsable principalmente de la CONFUSIÓN no lineal, basándose en la inversa multiplicativa en GF(2^8)?", "o": ["ShiftRows.", "AddRoundKey.", "MixColumns.", "SubBytes."], "c": [3], "e": "SubBytes (S-Box, basada en la inversa multiplicativa en GF(2⁸)) es la única operación no lineal de AES y aporta la confusión.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "En el modo CBC, si el bloque cifrado C_i llega corrupto al receptor, ¿qué bloques del plaintext resultan afectados al descifrar?", "o": ["Solo el bloque P_i queda ilegible; los demás se descifran correctamente.", "El bloque P_i queda completamente ilegible Y se invierte un bit concreto en P_{i+1}; a partir de P_{i+2} el error desaparece.", "Se corrompen todos los bloques desde P_i hasta el final del mensaje.", "Solo se invierte un bit en P_i sin afectar al resto del mensaje."], "c": [1], "e": "En CBC, P_i = D(C_i) ⊕ C_{i−1}: un C_i corrupto destroza P_i y cambia solo un bit predecible en P_{i+1}; después el error desaparece.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Cuál es la VULNERABILIDAD específica del modo OFB (Output Feedback)?", "o": ["Los bloques iguales de plaintext producen ciphertext idéntico.", "Un atacante puede invertir un bit del ciphertext e invertir predeciblemente el mismo bit del plaintext descifrado (ataque bit-flipping pasivo), sin causar efecto avalancha.", "Requiere que la función interna sea invertible, lo que lo hace incompatible con AES.", "No puede usar IV, haciendo el primer bloque completamente previsible."], "c": [1], "e": "En OFB el keystream no depende del texto cifrado, así que invertir un bit del criptograma invierte el mismo bit del texto claro, sin efecto avalancha.", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Por qué en la arquitectura SPN del AES TODAS las operaciones internas deben ser matemáticamente invertibles (biyectivas), mientras que en Feistel NO?", "o": ["Porque AES usa claves más largas que requieren operaciones invertibles para el Key Schedule.", "Porque en SPN las operaciones se aplican al bloque completo; en Feistel el XOR permite desandar el proceso sin invertir f.", "Porque el campo de Galois GF(2^8) solo admite operaciones reversibles.", "Porque la permutación IP del DES ya garantiza la reversibilidad del resto del algoritmo."], "c": [1], "e": "En SPN las operaciones se aplican al bloque completo y deben ser biyectivas para poder descifrar; en Feistel el XOR permite deshacer el proceso sin invertir f.", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Cómo funciona un sistema criptográfico HÍBRIDO (Envolvente Digital)?", "o": ["Aplica AES dos veces: una con la clave pública del receptor y otra con su clave privada.", "El emisor genera una clave AES de sesión aleatoria, la cifra con la clave pública asimétrica del receptor, y usa esa clave AES para cifrar todo el volumen de datos.", "Combina DES y 3DES aplicados secuencialmente para duplicar la longitud efectiva de clave.", "Usa un LFSR para generar la clave de sesión y RSA para verificar la integridad mediante hash."], "c": [1], "e": "En el sistema híbrido (envolvente digital) se cifran los datos con una clave simétrica de sesión (rápida) y esa clave se protege con la clave pública del receptor.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "¿Cuál es el objetivo principal de la criptografía?", "o": ["Aumentar la velocidad de transmisión de datos.", "Proteger la información frente a accesos no autorizados mediante transformaciones matemáticas.", "Comprimir archivos para almacenamiento eficiente.", "Facilitar el intercambio de claves en redes abiertas."], "c": [1], "e": "La criptografía protege la información frente a accesos no autorizados mediante transformaciones matemáticas (confidencialidad, integridad, autenticidad…).", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿En qué se basa la seguridad del algoritmo RSA?", "o": ["En la dificultad de encontrar vectores cortos en retículos.", "En la dificultad de factorizar números grandes.", "En el problema del logaritmo discreto en curvas elípticas.", "En funciones hash criptográficas."], "c": [1], "e": "RSA se apoya en la dificultad de factorizar n = p·q cuando p y q son primos grandes.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "¿Qué algoritmo cuántico amenaza directamente a RSA y ECC?", "o": ["Algoritmo de Grover.", "Algoritmo de Deutsch-Jozsa.", "Algoritmo de Shor.", "Algoritmo de Simon."], "c": [2], "e": "El algoritmo de Shor factoriza y calcula logaritmos discretos en tiempo polinómico en un ordenador cuántico, rompiendo RSA y ECC.", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "¿Qué efecto tiene el algoritmo de Grover sobre AES-128?", "o": ["Lo rompe completamente en tiempo polinómico.", "Reduce su seguridad efectiva a 64 bits.", "No tiene ningún efecto sobre algoritmos simétricos.", "Duplica el tamaño de clave necesario a 256 bits."], "c": [1], "e": "Grover da una aceleración cuadrática en la búsqueda por fuerza bruta: AES-128 pasa a ofrecer una seguridad efectiva de unos 64 bits.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Qué describe el concepto 'Harvest Now, Decrypt Later'?", "o": ["Descifrar mensajes en tiempo real con ordenadores cuánticos.", "Almacenar comunicaciones cifradas hoy para descifrarlas en el futuro con capacidad cuántica.", "Una técnica de compresión para almacenar grandes volúmenes de datos cifrados.", "El proceso de actualización gradual de sistemas criptográficos."], "c": [1], "e": "«Harvest Now, Decrypt Later»: se captura y almacena hoy tráfico cifrado para descifrarlo cuando exista capacidad cuántica suficiente.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Cómo se define formalmente la Criptografía Postcuántica (PQC)?", "o": ["Criptografía que utiliza hardware cuántico para cifrar datos.", "Criptografía basada en distribución cuántica de claves (QKD).", "Estudio y diseño de sistemas criptográficos seguros incluso con adversarios con ordenador cuántico.", "Algoritmos que solo funcionan en ordenadores cuánticos."], "c": [2], "e": "La PQC diseña sistemas criptográficos (que se ejecutan en ordenadores clásicos) seguros incluso frente a adversarios con ordenador cuántico.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Cuál es la diferencia principal entre PQC y QKD?", "o": ["La PQC usa física cuántica; la cuántica usa matemáticas.", "La PQC usa algoritmos clásicos resistentes a ataques cuánticos; la cuántica usa fenómenos físicos cuánticos.", "No hay diferencia relevante entre ambas.", "La PQC es más cara de implementar que la cuántica."], "c": [1], "e": "PQC = algoritmos matemáticos clásicos resistentes a ataques cuánticos; QKD = distribución de claves apoyada en fenómenos físicos cuánticos.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Cuál de los siguientes es el estándar postcuántico FIPS 203 para KEM?", "o": ["SPHINCS+.", "Dilithium.", "ML-KEM (Kyber).", "McEliece."], "c": [2], "e": "FIPS 203 estandariza ML-KEM (derivado de CRYSTALS-Kyber) como mecanismo de encapsulación de claves.", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿En qué tipo de problema matemático se basan Kyber y Dilithium?", "o": ["Factorización de enteros.", "Logaritmo discreto en curvas elípticas.", "Decodificación de códigos correctores de errores.", "Retículos (problemas de tipo LWE/MLWE)."], "c": [3], "e": "Kyber y Dilithium se basan en problemas de retículos, en concreto LWE/MLWE (Module Learning With Errors).", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Qué alternativa conservadora basada en funciones hash estándar fue aprobada como FIPS 205?", "o": ["Kyber.", "Dilithium.", "SLH-DSA (SPHINCS+).", "McEliece."], "c": [2], "e": "FIPS 205 es SLH-DSA (SPHINCS+), una firma basada únicamente en funciones hash estándar; es una alternativa conservadora.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿En qué consiste el problema Learning With Errors (LWE)?", "o": ["Factorizar un número entero muy grande.", "Encontrar el vector más corto en un retículo de alta dimensión.", "Resolver un sistema de ecuaciones lineales al que se ha añadido ruido aleatorio.", "Calcular el logaritmo discreto en un campo finito."], "c": [2], "e": "LWE consiste en resolver un sistema de ecuaciones lineales al que se ha añadido ruido aleatorio; ese ruido es lo que lo hace difícil.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "¿Qué es el paradigma KEM en criptografía postcuántica?", "o": ["Key Encryption Mode: modo de cifrado de claves privadas.", "Key Encapsulation Mechanism: mecanismo de encapsulación de claves para intercambio seguro.", "Known Error Method: método basado en el problema LWE.", "Kyber Encryption Model: modelo exclusivo del algoritmo Kyber."], "c": [1], "e": "KEM (Key Encapsulation Mechanism) encapsula una clave simétrica para intercambiarla de forma segura; es el paradigma de ML-KEM/Kyber.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "¿Qué familia PQC presenta claves públicas de varios megabytes pero extrema seguridad histórica?", "o": ["Basada en retículos (Kyber).", "Basada en funciones hash (SPHINCS+).", "Basada en códigos correctores de errores (McEliece).", "Basada en sistemas multivariantes."], "c": [2], "e": "Los sistemas tipo McEliece, basados en códigos correctores de errores, tienen claves públicas de megabytes pero décadas de resistencia al criptoanálisis.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Qué son los 'ataques de canal lateral' (side-channel attacks)?", "o": ["Ataques que explotan vulnerabilidades en protocolos de red.", "Ataques que revelan información sensible midiendo tiempo de ejecución, consumo energético o radiación.", "Ataques basados en fuerza bruta sobre la longitud de clave.", "Ataques que interceptan comunicaciones en tránsito en la red."], "c": [1], "e": "Los ataques de canal lateral obtienen información sensible midiendo la implementación (tiempo, consumo eléctrico, radiación…), no rompiendo la matemática.", "nota": ""}, {"id": "3.15", "t": 3, "n": 15, "q": "¿Qué es la Cripto-Agilidad?", "o": ["La capacidad de un algoritmo para adaptarse automáticamente a distintos tamaños de clave.", "La capacidad de un sistema para cambiar de algoritmo criptográfico de forma rápida y segura sin rediseñar toda la infraestructura.", "El proceso de actualización de certificados digitales en sistemas TLS.", "Una propiedad de los algoritmos postcuánticos que los hace más rápidos que los clásicos."], "c": [1], "e": "La cripto-agilidad es poder cambiar de algoritmo rápido y con seguridad sin rediseñar toda la infraestructura.", "nota": ""}, {"id": "3.16", "t": 3, "n": 16, "q": "¿Qué son las soluciones híbridas en la transición PQC?", "o": ["Algoritmos que combinan hardware cuántico y clásico.", "Sistemas que combinan algoritmos clásicos y postcuánticos para garantizar seguridad durante la transición.", "Protocolos que mezclan cifrado simétrico y asimétrico postcuántico.", "Implementaciones de PQC en entornos cloud y on-premise simultáneamente."], "c": [1], "e": "Las soluciones híbridas combinan algoritmos clásicos y postcuánticos: si uno falla, el otro mantiene la seguridad durante la transición.", "nota": ""}, {"id": "3.17", "t": 3, "n": 17, "q": "¿Por qué la transición a PQC debe iniciarse de forma inmediata?", "o": ["Porque los estándares NIST expiran en 2030.", "Porque infraestructuras críticas como redes eléctricas o sistemas gubernamentales no pueden actualizarse rápidamente.", "Porque los algoritmos postcuánticos actuales caducan pasados 10 años.", "Porque la amenaza cuántica ya es inmediata en algunos sectores."], "c": [1], "e": "Hay que empezar ya porque las infraestructuras críticas (redes eléctricas, sistemas gubernamentales) tardan mucho en actualizarse, y existe el riesgo Harvest Now, Decrypt Later.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "¿Qué problema base usaban candidatos fallidos como SIKE y RAINBOW?", "o": ["Factorización de enteros en campos finitos grandes.", "Isogenias de curvas elípticas y sistemas multivariantes (ambos rotos en 2022).", "Decodificación de códigos lineales de Goppa.", "Retículos de dimensión moderada."], "c": [1], "e": "SIKE se basaba en isogenias de curvas elípticas y Rainbow en sistemas multivariantes; ambos fueron rotos en 2022.", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Qué ventaja ofrece Kyber respecto a otros sistemas?", "o": ["Tiene el menor tamaño de firma de todas las familias.", "Es el único algoritmo formalmente demostrado seguro.", "Ofrece buen rendimiento y seguridad, siendo eficiente y versátil.", "No requiere generación de claves previas al cifrado."], "c": [2], "e": "Kyber destaca por su buen equilibrio entre rendimiento y seguridad, siendo eficiente y versátil. (No tiene la firma más pequeña ni es «el único demostrado seguro».)", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "La seguridad en PQC se concibe como:", "o": ["Un estado final que se alcanza una vez adoptados los estándares NIST.", "Un proceso continuo y dinámico de adaptación y mejora, no un estado final absoluto.", "Garantizada totalmente mientras se use Kyber o Dilithium.", "Definitiva en 2030 cuando los estándares sean obligatorios."], "c": [1], "e": "La seguridad en PQC es un proceso continuo de adaptación y mejora, no un estado final definitivo.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿En qué principios de la mecánica cuántica se basa el modelo computacional cuántico?", "o": ["Determinismo y causalidad estricta.", "Superposición y entrelazamiento.", "Efecto fotoeléctrico y difracción.", "Relatividad especial."], "c": [1], "e": "La computación cuántica se basa en la superposición (un qubit combina 0 y 1) y el entrelazamiento (correlación entre qubits).", "nota": ""}, {"id": "4.2", "t": 4, "n": 2, "q": "¿Qué establece el teorema de no clonación?", "o": ["Que no es posible copiar un estado cuántico desconocido.", "Que los qubits siempre pierden su estado por decoherencia.", "Que un ordenador cuántico no puede factorizar números.", "Que BQP es equivalente a la clase P."], "c": [0], "e": "El teorema de no clonación dice que no se puede copiar un estado cuántico desconocido; es la base de la seguridad de QKD.", "nota": ""}, {"id": "4.3", "t": 4, "n": 3, "q": "¿Qué representa la clase de complejidad BQP?", "o": ["Los problemas que solo puede resolver un ordenador clásico.", "Los problemas de decisión que un ordenador cuántico puede resolver eficientemente.", "Los problemas NP-completos.", "Los algoritmos de cifrado simétrico."], "c": [1], "e": "BQP son los problemas de decisión que un ordenador cuántico resuelve eficientemente (en tiempo polinómico con error acotado).", "nota": ""}, {"id": "4.4", "t": 4, "n": 4, "q": "¿Qué permite hacer el algoritmo de Shor y en qué tiempo?", "o": ["Buscar en bases de datos no estructuradas en tiempo O(√N).", "Factorizar números enteros grandes en tiempo polinómico O((log N)³).", "Generar números primos aleatorios.", "Romper funciones hash mediante fuerza bruta."], "c": [1], "e": "Shor factoriza enteros grandes en tiempo polinómico, O((log N)³), frente al coste subexponencial de los métodos clásicos.", "nota": ""}, {"id": "4.5", "t": 4, "n": 5, "q": "En el algoritmo de Shor, ¿qué papel desempeña la Transformada Cuántica de Fourier (QFT)?", "o": ["Genera la clave pública RSA.", "Permite encontrar el periodo r de la función f(x) = aˣ (mod N).", "Cifra el mensaje mediante AES.", "Calcula directamente los factores primos de N sin más pasos."], "c": [1], "e": "La QFT permite hallar el periodo r de f(x) = aˣ mod N, de donde se deducen los factores de N.", "nota": ""}, {"id": "4.6", "t": 4, "n": 6, "q": "¿Qué efecto produce el algoritmo de Grover sobre la criptografía simétrica?", "o": ["La rompe por completo, igual que Shor rompe RSA.", "Degrada su seguridad efectiva, siendo adaptable aumentando la longitud de la clave.", "No tiene ningún efecto sobre AES.", "Solo afecta a los certificados digitales."], "c": [1], "e": "Grover degrada la seguridad simétrica (cuadráticamente), pero se compensa aumentando la longitud de clave (p. ej. AES-256).", "nota": ""}, {"id": "4.7", "t": 4, "n": 7, "q": "¿Por qué se dice que existe una 'dualidad entre ruptura y degradación' ante la amenaza cuántica?", "o": ["Porque tanto RSA como AES quedan igual de comprometidos.", "Porque la criptografía asimétrica (RSA/ECC) requiere sustitución completa, mientras la simétrica (AES) puede adaptarse aumentando la clave.", "Porque solo los sistemas TO se ven afectados.", "Porque el algoritmo de Grover rompe completamente RSA."], "c": [1], "e": "Asimétrica (RSA/ECC): se rompe y hay que sustituirla por completo. Simétrica (AES): solo se degrada y se adapta alargando la clave.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "¿Qué algoritmos ha identificado el NIST (2022) como candidatos para la estandarización postcuántica?", "o": ["AES y SHA-256.", "CRYSTALS-Kyber y CRYSTALS-Dilithium.", "RSA-4096 y ECC-521.", "MD5 y DES."], "c": [1], "e": "En 2022 el NIST seleccionó CRYSTALS-Kyber (KEM) y CRYSTALS-Dilithium (firma) como candidatos de estandarización postcuántica.", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿En qué se diferencian la criptografía basada en retículos y el problema LWE?", "o": ["Son sinónimos exactos, sin diferencia alguna.", "Los retículos son el campo general y LWE es uno de los problemas específicos más usados para implementarlo.", "LWE es un algoritmo simétrico, no postcuántico.", "Los retículos solo sirven para firma digital, nunca para cifrado."], "c": [1], "e": "Los retículos son el campo matemático general; LWE es uno de los problemas concretos más usados para construir criptosistemas sobre ellos.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "¿Cuál es el primer paso recomendado para implementar la cripto-agilidad en una organización?", "o": ["Adoptar directamente CRYSTALS-Kyber sin más análisis.", "Realizar un inventario criptográfico de certificados, claves y algoritmos existentes.", "Despedir al personal con conocimientos obsoletos.", "Cambiar todos los protocolos TLS por HTTP."], "c": [1], "e": "El primer paso de la cripto-agilidad es el inventario criptográfico: saber qué certificados, claves y algoritmos se usan y dónde.", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "¿Qué caracteriza a los sistemas TO (Tecnologías de la Operación) frente a los sistemas TI?", "o": ["Priorizan la disponibilidad y usan con frecuencia tecnología heredada, lo que los hace más vulnerables.", "Se actualizan con mayor frecuencia que los sistemas TI.", "No están nunca conectados a infraestructuras críticas.", "Son inmunes a los ataques cuánticos por diseño."], "c": [0], "e": "En TO se prioriza la disponibilidad y abunda la tecnología heredada, lo que los hace más vulnerables que los sistemas TI.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "¿Qué riesgo introduce la convergencia IT/OT?", "o": ["Reduce la superficie de ataque al unificar sistemas.", "Incrementa la superficie de ataque al interconectar redes operativas con sistemas corporativos.", "Elimina la necesidad de infraestructuras PKI.", "Solo afecta a la criptografía simétrica."], "c": [1], "e": "La convergencia IT/OT interconecta redes operativas con sistemas corporativos y amplía la superficie de ataque.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Qué es una PKI (Infraestructura de Clave Pública)?", "o": ["Un algoritmo de cifrado simétrico.", "Un marco de seguridad que usa claves criptográficas y certificados digitales para autenticar identidades y proteger comunicaciones.", "Una base de datos de contraseñas de usuarios.", "Un protocolo exclusivo de blockchain."], "c": [1], "e": "Una PKI es el marco que, mediante claves y certificados digitales, autentica identidades y protege las comunicaciones.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Por qué es vulnerable blockchain frente a la computación cuántica?", "o": ["Porque no usa ningún tipo de criptografía.", "Porque las firmas criptográficas que protegen sus transacciones son vulnerables al algoritmo de Shor.", "Porque depende exclusivamente de contraseñas estáticas.", "Porque no permite transacciones sin intermediarios."], "c": [1], "e": "Blockchain firma sus transacciones con criptografía de curva elíptica, vulnerable al algoritmo de Shor.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué es el S.I.C.A. de la Policía Nacional?", "o": ["Un servicio de investigación de delitos informáticos.", "El Servicio de Infraestructuras Criptográficas Avanzadas, único proveedor nacional de identidad digital soberana del Estado.", "Una unidad de análisis de inteligencia artificial.", "Un laboratorio de informática forense."], "c": [1], "e": "El S.I.C.A. (Servicio de Infraestructuras Criptográficas Avanzadas) es el único proveedor nacional de identidad digital soberana; gestiona la PKI del DNIe.", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "Según el tema, ¿cuál es uno de los principales riesgos operativos del S.I.C.A. señalados en el plan de acción?", "o": ["El exceso de personal especializado.", "La insuficiencia de personal especializado (únicamente seis efectivos), incompatible con la criticidad de los servicios.", "La falta de normativa europea aplicable.", "La ausencia total de infraestructuras críticas dependientes."], "c": [1], "e": "El plan de acción señala como riesgo operativo crítico contar con solo seis especialistas, algo incompatible con la criticidad de los servicios.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "¿Qué describe el escenario 'Harvest Now, Decrypt Later'?", "o": ["Un algoritmo de firma digital postcuántico.", "La interceptación y almacenamiento de información cifrada hoy para descifrarla cuando exista capacidad cuántica suficiente.", "Un protocolo de recuperación de claves perdidas.", "Una técnica de destrucción segura de datos."], "c": [1], "e": "Es el escenario de interceptar y almacenar hoy información cifrada para descifrarla cuando haya capacidad cuántica suficiente.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Qué tecnología incorpora el chip del DNIe 4.0 (expedición desde 2026)?", "o": ["Certificados RSA de 2048 bits exclusivamente.", "Certificados en curva elíptica (ECC) de 384 bits, con chip Dual Interface (lector y NFC).", "Un algoritmo de cifrado simétrico DES.", "Ningún tipo de certificado digital."], "c": [1], "e": "El DNIe 4.0 incorpora certificados ECC de 384 bits y chip Dual Interface (contacto y NFC).", "nota": ""}, {"id": "4.19", "t": 4, "n": 19, "q": "¿Cómo se determina la letra final del NIF/DNI español?", "o": ["Es aleatoria y no sigue ningún cálculo.", "Mediante el resto de dividir el número del DNI entre 23, consultado en una tabla de correspondencias.", "Mediante un dígito de paridad simple.", "Se asigna por orden alfabético del apellido."], "c": [1], "e": "La letra del NIF se obtiene del resto de dividir el número del DNI entre 23, consultándolo en una tabla de correspondencias.", "nota": ""}, {"id": "4.20", "t": 4, "n": 20, "q": "¿Cuál de las siguientes estrategias de migración postcuántica combina algoritmos clásicos y postcuánticos durante el periodo de transición?", "o": ["Criptografía híbrida.", "Criptografía simétrica pura.", "Firma electrónica avanzada.", "Autenticación biométrica exclusiva."], "c": [0], "e": "La criptografía híbrida combina algoritmos clásicos y postcuánticos durante la transición, manteniendo seguridad si uno falla.", "nota": ""}];
const KEY='asig02_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
