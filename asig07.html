<script>
const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "¿Cuál es la función de la forense digital según el tema?", "o": ["Proteger los sistemas frente a intrusiones futuras", "Localizar, obtener, preservar, analizar y presentar datos digitales con fines judiciales, manteniendo su validez legal mediante la cadena de custodia", "Realizar tests de intrusión internos y externos", "Desarrollar software de cifrado para dispositivos móviles"], "c": [1], "e": "La forense digital localiza, obtiene, preserva, analiza y presenta datos digitales con fines judiciales, manteniendo su validez legal mediante la cadena de custodia. No es seguridad defensiva ni pentesting.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "¿Qué rama de la forense digital se encarga de analizar el tráfico o paquetes que circulan por una red?", "o": ["Computer Forensics", "Network Forensics", "Database Forensics", "Email Forensics"], "c": [1], "e": "Network Forensics analiza el tráfico y los paquetes que circulan por una red.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "¿Cuáles son los requisitos que debe cumplir una evidencia digital para ser válida en juicio?", "o": ["Ser únicamente auténtica y admisible", "Ser creíble, admisible, auténtica, completa y segura", "Ser voluminosa, cifrada y redundante", "Bastar con que esté firmada por un perito colegiado"], "c": [1], "e": "Para ser válida en juicio, la evidencia debe ser creíble, admisible, auténtica, completa y segura.", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "¿Qué criterio determina la prioridad de actuación en la recogida de evidencias?", "o": ["El tamaño del dispositivo", "La persistencia de los datos: los sistemas volátiles (RAM) pierden la información al cortar la energía", "El precio del dispositivo intervenido", "El número de usuarios registrados en el equipo"], "c": [1], "e": "Se prioriza por persistencia: los datos volátiles (RAM) se pierden al cortar la energía, así que se recogen primero.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "¿Cuál es la diferencia principal entre imagen forense y clonado?", "o": ["No existe diferencia, son sinónimos", "La imagen genera un archivo; el clonado replica el contenido directamente en otro dispositivo físico", "El clonado no es una copia bit a bit", "La imagen forense no requiere verificación por hash"], "c": [1], "e": "La imagen forense genera un archivo (contenedor); el clonado replica el contenido directamente en otro dispositivo físico.", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "¿Qué función hash se considera el estándar más seguro actualmente en el ámbito forense?", "o": ["MD5", "SHA-1", "SHA-256", "CRC32"], "c": [2], "e": "SHA-256 es el estándar más seguro hoy; MD5 y SHA-1 tienen colisiones conocidas y CRC32 no es criptográfico.", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "¿En qué consiste el borrado seguro o «wipear»?", "o": ["Enviar los archivos a la papelera de reciclaje", "Sobrescribir los datos varias veces para impedir su recuperación", "Cifrar el disco con una contraseña robusta", "Cambiar la extensión de los archivos para ocultarlos"], "c": [1], "e": "El borrado seguro («wipear») sobrescribe los datos varias veces para impedir su recuperación.", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "¿Para qué se utiliza principalmente un editor hexadecimal en forense digital?", "o": ["Para acelerar el rendimiento del disco duro", "Para analizar información a bajo nivel: archivos sospechosos, formatos desconocidos, metadatos ocultos y cabeceras", "Para generar informes periciales automáticamente", "Para cifrar volúmenes completos"], "c": [1], "e": "El editor hexadecimal analiza a bajo nivel: archivos sospechosos, formatos desconocidos, metadatos ocultos y cabeceras.", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "¿Qué diferencia una pérdida de datos física de una lógica?", "o": ["La física se debe a daños en el hardware; la lógica ocurre cuando los datos siguen presentes pero no son accesibles por errores del sistema o borrados accidentales", "La lógica siempre requiere cámaras limpias para su recuperación", "La física se recupera siempre mediante software forense", "No existe distinción entre ambas"], "c": [0], "e": "La pérdida física se debe a daños en el hardware; en la lógica los datos siguen presentes pero no son accesibles (errores de sistema, borrados accidentales).", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "¿Qué es el «file carving»?", "o": ["Un método de cifrado de particiones", "Una técnica de recuperación de archivos a partir de sus cabeceras hexadecimales", "Un procedimiento para precintar evidencias físicas", "Un formato de imagen forense"], "c": [1], "e": "El file carving recupera archivos a partir de sus cabeceras hexadecimales, sin depender del sistema de archivos.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "¿En cuántas fases se divide la inspección ocular digital (triage en registros)?", "o": ["Dos: previa y posterior", "Tres: gestiones previas, ejecución y gestiones posteriores", "Cuatro: identificación, adquisición, análisis e informe", "Cinco: una por cada tipo de dispositivo"], "c": [1], "e": "La inspección ocular digital se divide en tres fases: gestiones previas, ejecución y gestiones posteriores.", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "¿Cuál es el objetivo principal del triage o análisis en caliente?", "o": ["Apagar el dispositivo cuanto antes para preservar el disco", "Identificar y capturar rápidamente la información más relevante con el sistema encendido, evitando perder datos volátiles", "Realizar exclusivamente el precintado de las evidencias", "Elaborar el informe pericial definitivo en el lugar del registro"], "c": [1], "e": "El triage o análisis en caliente captura rápidamente lo más relevante con el sistema encendido, evitando perder datos volátiles.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "¿Qué tipo de evidencia especialmente relevante puede obtenerse mediante el análisis en caliente?", "o": ["El número de serie grabado en la carcasa", "Las claves de recuperación como las de BitLocker", "El color del dispositivo", "La fecha de fabricación del equipo"], "c": [1], "e": "El análisis en caliente puede obtener claves de recuperación como las de BitLocker, que se perderían al apagar.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "¿Qué permite hacer FTK Imager?", "o": ["Únicamente generar informes periciales", "Crear imágenes bit a bit, cargar evidencias sin modificarlas, montar imágenes forenses y capturar memoria RAM", "Reparar físicamente discos duros dañados", "Descifrar cualquier volumen protegido con contraseña"], "c": [1], "e": "FTK Imager crea imágenes bit a bit, carga evidencias sin modificarlas, monta imágenes forenses y captura la RAM.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "¿Qué son los artefactos digitales?", "o": ["Únicamente los archivos borrados de un disco", "Cualquier elemento creado o almacenado en un entorno tecnológico que permite reconstruir la actividad de un sistema", "Los componentes físicos internos de un ordenador", "Los precintos empleados en la cadena de custodia"], "c": [1], "e": "Los artefactos digitales son elementos creados o almacenados en un entorno tecnológico que permiten reconstruir la actividad de un sistema.", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Cuál de los siguientes NO es un artefacto típico de sistemas Windows citado en el tema?", "o": ["Prefetch", "Amcache", "Jump Lists", "Bootloader GRUB"], "c": [3], "e": "Prefetch, Amcache y Jump Lists son artefactos de Windows; el bootloader GRUB es de Linux.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "¿Qué estándar se cita como referencia en el proceso forense de dispositivos móviles?", "o": ["ISO/IEC 27001", "ISO/IEC 27037", "UNECE WP.29", "RFC 3227"], "c": [1], "e": "ISO/IEC 27037 es la referencia para identificación, recogida, adquisición y preservación de evidencias digitales.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "¿Qué función cumple el «jailbreak» en iOS respecto al análisis forense?", "o": ["Bloquea permanentemente el acceso al dispositivo", "Condiciona el nivel de acceso a los datos al otorgar permisos de superusuario, cumpliendo función similar al rooteo en Android", "Elimina automáticamente todos los datos del terminal", "Sustituye la necesidad de autorización judicial"], "c": [1], "e": "El jailbreak en iOS otorga permisos de superusuario y condiciona el nivel de acceso a los datos, de forma similar al rooteo en Android.", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "En forense de vehículos, ¿qué unidad puede contener el EDR, equivalente a la «caja negra»?", "o": ["La TCU (Telematic Control Unit)", "La ACU (Airbag Control Unit)", "El sistema IVI de infoentretenimiento", "El módulo Bluetooth"], "c": [1], "e": "En vehículos, la ACU (Airbag Control Unit) puede contener el EDR, equivalente a la «caja negra».", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "¿Cuáles son las principales fuentes de información en el análisis forense de drones?", "o": ["Exclusivamente la memoria interna del dron", "La memoria interna, la tarjeta microSD, el dispositivo móvil de control y los servicios en la nube asociados", "Únicamente las imágenes captadas por la cámara", "Solo los registros del fabricante"], "c": [1], "e": "En drones las fuentes son la memoria interna, la microSD, el móvil de control y los servicios en la nube asociados.", "nota": ""}, {"id": "2.1", "t": 2, "n": 1, "q": "Según los datos citados en el tema, ¿qué proporción representa la criminalidad digital en España?", "o": ["Uno de cada veinte delitos registrados", "Uno de cada cinco delitos registrados", "La mitad de los delitos registrados", "Menos del 1 % de los delitos registrados"], "c": [1], "e": "Según los datos del tema, uno de cada cinco delitos registrados en España es de criminalidad digital.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Cuál de las siguientes NO se cita entre las posibilidades que las TIC ofrecen a la delincuencia?", "o": ["Anonimato en internet y Dark Web", "Comunicaciones cifradas y criptodivisas", "Deepfakes y uso de agentes IA", "Reducción automática de la trazabilidad judicial de los delitos tradicionales"], "c": [3], "e": "Las TIC ofrecen anonimato, Dark Web, cifrado, deepfakes e ingeniería social a la delincuencia; no reducen automáticamente la trazabilidad judicial.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Cuál de los siguientes tipos delictivos ha surgido o se ha modificado por el uso de dispositivos electrónicos?", "o": ["Sexting, grooming, stalking y phishing", "Únicamente el hurto y el robo con fuerza", "Exclusivamente los delitos contra la seguridad vial", "Solo los delitos societarios"], "c": [0], "e": "Sexting, grooming, stalking y phishing son delitos surgidos o modificados por el uso de dispositivos electrónicos.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Qué diferencia fundamental existe entre la forense digital y la seguridad informática?", "o": ["Son exactamente la misma disciplina con distinto nombre", "La forense digital se orienta a la evidencia y al proceso judicial; la seguridad informática se orienta a la protección de los sistemas", "La seguridad informática se ocupa del informe pericial", "La forense digital realiza tests de intrusión"], "c": [1], "e": "La forense digital se orienta a la evidencia y al proceso judicial; la seguridad informática, a proteger los sistemas.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Cuál de las siguientes es una actividad propia de la seguridad informática (Red/Purple/Blue Team)?", "o": ["Elaborar el informe pericial para el juzgado", "Realizar tests de intrusión internos y externos", "Mantener la cadena de custodia de las evidencias", "Ratificar conclusiones en juicio"], "c": [1], "e": "Los tests de intrusión internos y externos son propios de la seguridad informática (Red/Purple/Blue Team); informe pericial, custodia y ratificación son forenses.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Por qué se dice que las evidencias digitales son «duplicables sin pérdida»?", "o": ["Porque se degradan levemente en cada copia", "Porque una copia bit a bit resulta idéntica al original", "Porque solo pueden copiarse una vez", "Porque requieren siempre compresión con pérdida"], "c": [1], "e": "Una copia bit a bit es idéntica al original, así que la evidencia es duplicable sin pérdida.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Qué implica que las evidencias digitales sean «deslocalizadas»?", "o": ["Que siempre están en el mismo dispositivo intervenido", "Que pueden residir en la nube o incluso en otra jurisdicción", "Que carecen de metadatos", "Que no pueden ser analizadas en laboratorio"], "c": [1], "e": "«Deslocalizadas»: pueden residir en la nube o incluso en otra jurisdicción.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "¿Qué exige el carácter volátil y fácilmente alterable de la evidencia digital?", "o": ["Copia bit a bit, verificación por hash, documentación exhaustiva y cadena de custodia ininterrumpida", "Únicamente una fotografía del dispositivo", "Almacenar el original en un equipo conectado a internet", "Prescindir de la documentación para agilizar el proceso"], "c": [0], "e": "Al ser volátil y alterable, exige copia bit a bit, verificación por hash, documentación exhaustiva y cadena de custodia ininterrumpida.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Con qué fase comienza el proceso forense sobre un dispositivo concreto?", "o": ["Con la elaboración del informe pericial", "Con la identificación", "Con la ratificación en juicio", "Con el borrado seguro del soporte"], "c": [1], "e": "El proceso forense sobre un dispositivo comienza por la identificación.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "¿Qué estándar se cita como referencia para la identificación, recogida, adquisición y preservación de evidencias?", "o": ["ISO/IEC 27037", "ISO/IEC 27001", "RFC 3227", "UNE 71505"], "c": [0], "e": "ISO/IEC 27037 es la referencia para identificar, recoger, adquirir y preservar evidencias.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Qué elementos asociados deben recogerse junto al dispositivo principal?", "o": ["Únicamente el cargador", "Tarjetas SIM, memorias externas y códigos de acceso", "Solo la funda protectora", "Exclusivamente la caja original"], "c": [1], "e": "Junto al dispositivo hay que recoger tarjetas SIM, memorias externas y códigos de acceso.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Por qué requiere especial cuidado un terminal intervenido que se encuentra encendido?", "o": ["Porque consume batería innecesariamente", "Porque debe evitarse su modificación o la pérdida de datos volátiles", "Porque no puede fotografiarse mientras esté activo", "Porque la ley prohíbe manipular dispositivos encendidos"], "c": [1], "e": "Un terminal encendido debe tratarse con cuidado para evitar su modificación o la pérdida de datos volátiles.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿Qué caso real se cita en el tema como ejemplo de investigación resuelta mediante análisis forense?", "o": ["El caso de la Operación Pangea", "La investigación de la muerte de Isak Andic, mediante tres móviles y un todoterreno", "El compromiso de SolarWinds", "El ataque de WannaCry"], "c": [1], "e": "El tema cita la investigación de la muerte de Isak Andic, resuelta con tres móviles y un todoterreno.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Qué sostiene el valor probatorio de la prueba digital ante el tribunal, según el caso citado?", "o": ["La antigüedad del dispositivo analizado", "La cadena de custodia y la trazabilidad completa", "El número de peritos que intervienen", "La marca comercial del software empleado"], "c": [1], "e": "Lo que sostiene el valor probatorio es la cadena de custodia y la trazabilidad completa.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "¿Qué significa que las evidencias digitales sean «dependientes de metadatos»?", "o": ["Que los metadatos son irrelevantes para el análisis", "Que los metadatos resultan necesarios para acreditar su contexto", "Que solo los metadatos tienen valor probatorio", "Que los metadatos deben eliminarse antes del análisis"], "c": [1], "e": "Dependientes de metadatos: estos son necesarios para acreditar su contexto.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué papel juega la ingeniería social entre las posibilidades que las TIC ofrecen a la delincuencia?", "o": ["Es una técnica en desuso sin relevancia actual", "Es una de las vías citadas, junto al anonimato, la Dark Web y los deepfakes", "Solo afecta a la delincuencia organizada internacional", "Es exclusiva de los ataques a infraestructuras críticas"], "c": [1], "e": "La ingeniería social es una de las vías que las TIC ofrecen a la delincuencia, junto al anonimato, la Dark Web y los deepfakes.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "¿Qué debe garantizarse «en todo momento» durante el proceso forense sobre un dispositivo?", "o": ["La cadena de custodia", "La conexión a internet del dispositivo", "El acceso público a los resultados", "La presencia del fabricante"], "c": [0], "e": "La cadena de custodia debe garantizarse en todo momento del proceso forense.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Qué caracteriza a la auditoría de entornos virtuales y aplicaciones móviles?", "o": ["Es una actividad propia de la forense digital orientada al proceso judicial", "Es una actividad propia de la seguridad informática", "Es una fase de la cadena de custodia", "Es un requisito del informe pericial"], "c": [1], "e": "La auditoría de entornos virtuales y aplicaciones móviles es una actividad propia de la seguridad informática.", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Por qué la diversidad de sistemas operativos y aplicaciones complica el análisis forense de dispositivos?", "o": ["Porque obliga a usar un único software universal", "Porque genera un ecosistema tecnológico muy heterogéneo que exige herramientas y métodos específicos", "Porque impide por completo cualquier extracción de datos", "Porque elimina la necesidad de cadena de custodia"], "c": [1], "e": "La diversidad de sistemas y aplicaciones crea un ecosistema heterogéneo que exige herramientas y métodos específicos.", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Qué finalidad última persigue el análisis forense en dispositivos?", "o": ["Reconstruir la actividad del usuario y permitir su interpretación en contextos legales y de investigación", "Optimizar el rendimiento del dispositivo analizado", "Reparar el hardware dañado", "Actualizar el sistema operativo del terminal"], "c": [0], "e": "El análisis forense de dispositivos busca reconstruir la actividad del usuario y permitir su interpretación en contextos legales y de investigación.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "¿Qué garantiza exactamente un valor hash coincidente?", "o": ["La procedencia y autoría del archivo", "Que la secuencia exacta de bytes analizada es idéntica a la que generó la firma en un instante dado", "Que el archivo formaba parte de un conjunto documental completo", "Que el archivo no contiene malware"], "c": [1], "e": "Un hash coincidente garantiza solo que la secuencia exacta de bytes es idéntica a la que generó la firma en un instante dado; no prueba autoría ni procedencia.", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿Por qué un hash no acredita la completitud de la evidencia?", "o": ["Porque el cálculo se limita al contenedor o bloque procesado, ignorando el espacio no asignado y las áreas ocultas del disco", "Porque los hashes caducan a los seis meses", "Porque solo funciona en sistemas de archivos NTFS", "Porque requiere siempre una segunda firma notarial"], "c": [0], "e": "El hash se limita al contenedor o bloque procesado e ignora el espacio no asignado y las áreas ocultas, por lo que no acredita completitud.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "En la matriz de correlación, ¿cuál es el identificador principal del disco como soporte de origen?", "o": ["La MAC de la interfaz principal", "El número de serie por firmware (ATA/NVMe)", "La ruta en el almacenamiento de procesado", "El SHA-256 de la imagen generada"], "c": [1], "e": "El identificador principal del disco es el número de serie por firmware (ATA/NVMe).", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "De las tres capas de identificadores, ¿cuál presenta la fiabilidad técnica más baja?", "o": ["El serial visible", "El serial comunicado por firmware", "El identificador lógico", "Todos ofrecen idéntica fiabilidad"], "c": [0], "e": "De las tres capas, el serial visible (etiqueta) es el de menor fiabilidad técnica, porque puede alterarse o sustituirse.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Mediante qué comandos reporta un dispositivo su serial comunicado por firmware?", "o": ["Comandos SQL de consulta", "ATA Identify Device o SCSI Inquiry", "Peticiones HTTP GET", "Consultas DNS inversas"], "c": [1], "e": "El dispositivo reporta su serial por firmware mediante comandos ATA Identify Device o SCSI Inquiry.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Qué caracteriza al identificador lógico (UUID, Volume Serial Number)?", "o": ["Está grabado físicamente en el chasis del dispositivo", "Carece de vinculación física directa: se regenera al formatear, se clona al volcar una imagen y es modificable por software", "Es inalterable y el más fiable de los tres", "Solo existe en sistemas Linux"], "c": [1], "e": "El identificador lógico (UUID, Volume Serial) no está ligado al hardware: se regenera al formatear, se clona con la imagen y es modificable por software.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "Antes de extraer una microSD de un teléfono, ¿qué debe fijarse en primer lugar?", "o": ["El precio de mercado del terminal", "El estado operativo del teléfono (encendido, bloqueado por PIN/patrón, apagado o en estado BFU/AFU)", "El nombre del titular de la línea", "La compañía operadora contratada"], "c": [1], "e": "Antes de extraer una microSD hay que fijar el estado operativo del teléfono (encendido, bloqueado, apagado, BFU/AFU).", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Qué medida de aislamiento electromagnético se cita en el tema?", "o": ["Apagar el dispositivo inmediatamente", "Modo avión o bolsa Faraday", "Retirar la batería siempre", "Envolver el terminal en papel de aluminio doméstico"], "c": [1], "e": "Para aislar electromagnéticamente se usa el modo avión o una bolsa Faraday.", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "Al reseñar una producción cloud sin manifest, ¿qué debe hacerse antes de cualquier descompresión?", "o": ["Extraer todos los archivos para inventariarlos", "Calcular y fijar el SHA-256 de cada fichero individualmente, estableciendo el lote original como evidencia máster inmutable", "Renombrar los ficheros con la fecha de recepción", "Convertir todos los archivos a un formato único"], "c": [1], "e": "Sin manifest, antes de descomprimir se calcula y fija el SHA-256 de cada fichero, estableciendo el lote original como evidencia máster inmutable.", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Qué debe documentarse al recibir una producción cloud?", "o": ["Únicamente el nombre del proveedor", "El protocolo de descarga, la cuenta o bucket, la marca de tiempo de recepción y la ruta de destino", "Solo el tamaño total en gigabytes", "Exclusivamente el número de archivos recibidos"], "c": [1], "e": "Hay que documentar el protocolo de descarga, la cuenta o bucket, la marca de tiempo de recepción y la ruta de destino.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿En qué momento actúa un filtro de captura (BPF) en una adquisición de red?", "o": ["Después de consolidar la captura, en post-procesamiento", "Antes de que los datos se escriban en memoria o disco, descartando irreversiblemente los paquetes que no cumplen la condición", "Durante la generación del informe pericial", "Solo al exportar el PCAP a otro formato"], "c": [1], "e": "El filtro de captura (BPF) actúa antes de escribir en memoria o disco y descarta de forma irreversible los paquetes que no cumplen la condición.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "¿Qué ventaja ofrece el filtro de visualización frente al de captura?", "o": ["Reduce el consumo de almacenamiento durante la captura", "No modifica ni elimina los bytes del volcado PCAP, permitiendo regresar siempre a la muestra original", "Impide que se registren paquetes irrelevantes", "Acelera la velocidad de la interfaz de red"], "c": [1], "e": "El filtro de visualización no modifica ni elimina bytes del PCAP, por lo que siempre se puede volver a la muestra original.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "Al redactar la observación sobre una bolsa de custodia con un corte, ¿qué debe evitarse?", "o": ["Indicar las dimensiones exactas de la abertura", "Inferir mecánicas lesivas, accidentes de transporte o manipulaciones intencionadas", "Señalar el número de registro de la bolsa", "Describir el estado de los precintos originales"], "c": [1], "e": "En la observación hay que describir el corte sin inferir mecánicas lesivas, accidentes ni manipulaciones intencionadas.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Cuál es el primero de los cuatro elementos de una transformación reproducible?", "o": ["El dato de salida verificable", "El dato de entrada inequívoco, identificado con su hash previo y delimitación exacta de origen", "El procedimiento determinista", "La herramienta y el entorno controlados"], "c": [1], "e": "El primer elemento es el dato de entrada inequívoco, identificado con su hash previo y delimitación exacta de origen.", "nota": ""}, {"id": "3.15", "t": 3, "n": 15, "q": "¿Qué debe documentarse respecto a la herramienta empleada en una transformación reproducible?", "o": ["Únicamente su nombre comercial", "Nombre del software, versión exacta compilada, dependencias de librerías y configuración de parámetros", "Solo el precio de la licencia", "Exclusivamente el sistema operativo del analista"], "c": [1], "e": "Se documenta el nombre del software, la versión exacta, las dependencias de librerías y la configuración de parámetros.", "nota": ""}, {"id": "3.16", "t": 3, "n": 16, "q": "En la matriz de correlación, ¿qué relación debe existir entre la copia de trabajo y la imagen forense?", "o": ["La copia de trabajo debe presentar un SHA-256 idéntico al de la imagen forense", "La copia de trabajo sustituye a la imagen máster una vez montada", "La copia de trabajo no requiere verificación por hash", "La copia de trabajo debe alterar la imagen máster para registrar el análisis"], "c": [0], "e": "La copia de trabajo debe tener un SHA-256 idéntico al de la imagen forense.", "nota": ""}, {"id": "3.17", "t": 3, "n": 17, "q": "¿Por qué una pantalla negra no demuestra que un portátil esté apagado?", "o": ["Porque los portátiles no tienen pantalla integrada", "Porque existen estados de bajo consumo (ACPI S3, Modern Standby) en los que la RAM permanece energizada reteniendo artefactos volátiles y claves de cifrado", "Porque la pantalla siempre permanece encendida en equipos modernos", "Porque el brillo se ajusta automáticamente"], "c": [1], "e": "Una pantalla negra puede deberse a estados de bajo consumo (ACPI S3, Modern Standby) en los que la RAM sigue energizada con artefactos volátiles y claves.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "¿Qué riesgo conlleva asumir que un equipo está apagado por no emitir imagen?", "o": ["Ninguno, es una comprobación fiable", "Desconectar la alimentación de forma abrupta, provocando la pérdida de la RAM o corrupciones del sistema de archivos", "Que se agote la batería antes del análisis", "Que se pierda la garantía del fabricante"], "c": [1], "e": "Asumir que está apagado y cortar la alimentación pierde la RAM o puede corromper el sistema de archivos.", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Cuál de los siguientes datos NO debe difundirse innecesariamente en el acta?", "o": ["La marca y modelo del dispositivo intervenido", "Códigos IBAN completos, numeraciones de tarjetas y códigos CVV/CVC", "El número de registro de la evidencia", "La fecha y hora de la intervención"], "c": [1], "e": "En el acta no deben difundirse innecesariamente datos sensibles como IBAN completos, numeración de tarjetas y CVV/CVC.", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "¿Qué ocurre con los datos de salud, ideología o esferas íntimas hallados incidentalmente?", "o": ["Deben incluirse íntegramente en el acta por exigencia legal", "No deben difundirse innecesariamente si no están vinculados a los hechos, incluidos los de terceros", "Deben publicarse en el informe pericial", "Deben remitirse siempre a la autoridad sanitaria"], "c": [1], "e": "Los datos de salud, ideología o esferas íntimas hallados incidentalmente no deben difundirse si no se vinculan a los hechos, ni siquiera los de terceros.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿Qué documenta la cadena de custodia?", "o": ["Únicamente el nombre del perito designado", "Todo el recorrido de la evidencia desde la recogida hasta su entrega final: quién ha tenido acceso, dónde ha estado y en qué estado se encuentra", "Solo el resultado final del análisis", "Exclusivamente la fecha de entrada en el laboratorio"], "c": [1], "e": "La cadena de custodia documenta todo el recorrido de la evidencia: quién accedió, dónde estuvo y en qué estado.", "nota": ""}, {"id": "4.2", "t": 4, "n": 2, "q": "Además del recorrido de la evidencia, ¿qué debe incluir la cadena de custodia?", "o": ["El registro de todas las actuaciones realizadas, herramientas utilizadas y cálculos de valores hash", "El presupuesto económico de la investigación", "La declaración del investigado", "El organigrama de la unidad policial"], "c": [0], "e": "Además del recorrido, incluye el registro de las actuaciones realizadas, las herramientas utilizadas y los cálculos de hash.", "nota": ""}, {"id": "4.3", "t": 4, "n": 3, "q": "¿Cuáles son las cuatro fases del tratamiento de evidencias en el laboratorio forense?", "o": ["Identificación, precintado, traslado y archivo", "Adquisición, preservación, análisis e informe pericial", "Denuncia, instrucción, juicio y sentencia", "Detección, contención, erradicación y recuperación"], "c": [1], "e": "Las cuatro fases en laboratorio son adquisición, preservación, análisis e informe pericial.", "nota": ""}, {"id": "4.4", "t": 4, "n": 4, "q": "¿Qué requisito debe cumplir todo el proceso de análisis en el laboratorio forense?", "o": ["Estar autorizado por la autoridad judicial y limitado al objeto de la investigación", "Ser realizado exclusivamente por ingenieros colegiados", "Completarse en un plazo máximo de 24 horas", "Ser accesible públicamente durante su desarrollo"], "c": [0], "e": "Todo el análisis debe estar autorizado por la autoridad judicial y limitado al objeto de la investigación.", "nota": ""}, {"id": "4.5", "t": 4, "n": 5, "q": "¿Qué criterio resulta especialmente estricto en casos sensibles como los que involucran a menores?", "o": ["La rapidez del análisis", "La proporcionalidad", "El coste económico del peritaje", "El número de peritos intervinientes"], "c": [1], "e": "En casos sensibles, como los de menores, la proporcionalidad es especialmente estricta.", "nota": ""}, {"id": "4.6", "t": 4, "n": 6, "q": "¿Qué herramientas se emplean en la adquisición para trabajar sobre copias sin alterar el original?", "o": ["Bloqueadores de escritura (hardware) y herramientas software", "Únicamente cámaras fotográficas", "Exclusivamente precintos numerados", "Software de cifrado de volúmenes"], "c": [0], "e": "Se usan bloqueadores de escritura (hardware) y herramientas software para trabajar sobre copias sin alterar el original.", "nota": ""}, {"id": "4.7", "t": 4, "n": 7, "q": "¿Qué tipo de adquisición suele emplearse en dispositivos móviles y por qué?", "o": ["Siempre física, por ser la más rápida", "Lógica o basada en el sistema de archivos, debido a limitaciones técnicas como el cifrado", "Manual exclusivamente, por exigencia legal", "No se realiza adquisición en dispositivos móviles"], "c": [1], "e": "En móviles suele usarse adquisición lógica o del sistema de archivos por limitaciones técnicas como el cifrado.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "¿En qué se apoya la fase de preservación de la evidencia?", "o": ["En el uso de funciones hash, que generan una huella digital única del contenido", "En el almacenamiento en la nube del original", "En la destrucción de las copias intermedias", "En la firma manuscrita del investigado"], "c": [0], "e": "La preservación se apoya en funciones hash, que generan una huella digital única del contenido.", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿Por qué es crucial trabajar siempre sobre la primera extracción en smartphones o drones?", "o": ["Porque las extracciones posteriores son ilegales", "Porque los datos pueden cambiar entre adquisiciones", "Porque la primera extracción es más rápida", "Porque el fabricante solo autoriza una extracción"], "c": [1], "e": "Hay que trabajar siempre sobre la primera extracción en smartphones o drones porque los datos pueden cambiar entre adquisiciones.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "¿Cómo debe ir el material intervenido?", "o": ["Precintado, etiquetado y documentado", "Únicamente introducido en una bolsa opaca", "Sin identificación externa para preservar el secreto", "Etiquetado solo con la fecha de intervención"], "c": [0], "e": "El material intervenido debe ir precintado, etiquetado y documentado.", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "¿Cuál de los siguientes datos figura en un listado de evidencias intervenidas?", "o": ["Caso, fecha, diligencias, juzgado, marca y modelo, IMEI/ICC, tipo de extracción y PIN", "Únicamente la marca del dispositivo", "Solo el nombre del agente actuante", "Exclusivamente el número de expediente judicial"], "c": [0], "e": "El listado incluye caso, fecha, diligencias, juzgado, marca y modelo, IMEI/ICC, tipo de extracción y PIN.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "¿Qué garantiza el correcto precintado, etiquetado y documentación del material?", "o": ["Que la evidencia digital pueda ser analizada posteriormente y presentada con validez en un procedimiento judicial", "Que el dispositivo mantenga su valor de mercado", "Que no sea necesaria la intervención de un perito", "Que se acelere el procedimiento judicial"], "c": [0], "e": "El correcto precintado, etiquetado y documentación permite analizar la evidencia después y presentarla con validez judicial.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Qué busca identificar el análisis forense en esta fase?", "o": ["Artefactos digitales relevantes para reconstruir los hechos investigados", "Únicamente el sistema operativo instalado", "El valor económico de los datos almacenados", "El número de usuarios del dispositivo"], "c": [0], "e": "En esta fase se buscan artefactos digitales relevantes para reconstruir los hechos investigados.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Cómo debe adaptarse el análisis forense?", "o": ["Al tipo de delito investigado (fraude, falsedad documental, delitos contra menores, etc.)", "Siempre del mismo modo, con independencia del delito", "Únicamente al presupuesto disponible", "Al criterio exclusivo del fabricante del software"], "c": [0], "e": "El análisis se adapta al tipo de delito investigado (fraude, falsedad documental, delitos contra menores…).", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué características debe reunir el informe pericial resultante?", "o": ["Estructurado, claro y objetivo, comprensible para el ámbito judicial y que permita reproducir el análisis", "Extenso y con lenguaje estrictamente técnico sin adaptación", "Breve y sin detalle metodológico", "Confidencial y no accesible a las partes"], " "q": "¿Qué contiene el fichero HomeApp.json?", "o": ["La configuración principal: dirección de correo electrónico y coordenadas GPS del dispositivo", "Las grabaciones de audio en formato MP3", "El historial completo de navegación web", "Las credenciales de acceso a la red WiFi"], "c": [0], "e": "HomeApp.json contiene la configuración principal: correo electrónico y coordenadas GPS del dispositivo.", "nota": ""}, {"id": "6.12", "t": 6, "n": 12, "q": "¿Qué otra información relevante almacena el Google Home sobre el entorno doméstico?", "o": ["Un listado con el resto de dispositivos IoT conectados a la misma red doméstica", "El plano arquitectónico de la vivienda", "El consumo eléctrico total del domicilio", "La identidad de todas las personas que habitan la vivienda"], "c": [0], "e": "Google Home guarda un listado con el resto de dispositivos IoT conectados a la misma red doméstica.", "nota": ""}, {"id": "6.13", "t": 6, "n": 13, "q": "¿Qué registra el fichero MiActividad.html?", "o": ["Los errores del sistema operativo del dispositivo", "Un listado transcrito con todos los comandos de voz ejecutados correctamente", "Únicamente las actualizaciones de firmware", "El inventario de canciones reproducidas exclusivamente"], "c": [1], "e": "MiActividad.html es un listado transcrito de todos los comandos de voz ejecutados correctamente.", "nota": ""}, {"id": "6.14", "t": 6, "n": 14, "q": "¿Qué datos se registran por cada comando de voz?", "o": ["Solo la transcripción del comando", "La transcripción, lo que hizo el dispositivo, la fecha y hora, y las coordenadas GPS de su posición", "Únicamente la fecha y la hora", "Solo la duración del comando en segundos"], "c": [1], "e": "Por cada comando se registran la transcripción, la acción del dispositivo, fecha y hora, y coordenadas GPS.", "nota": ""}, {"id": "6.15", "t": 6, "n": 15, "q": "¿Sobre qué aspecto advierte especialmente el autor al analizar las marcas temporales?", "o": ["Sobre el formato de fecha americano", "Sobre los husos horarios", "Sobre la duración máxima de los registros", "Sobre el idioma de la transcripción"], "c": [1], "e": "Al analizar las marcas temporales el autor advierte sobre los husos horarios.", "nota": ""}, {"id": "6.16", "t": 6, "n": 16, "q": "¿En qué formato y calidad se almacenan los comandos de voz en los servidores de Google?", "o": ["WAV sin comprimir a 320 kbps", "MP3 a 48 kbps, etiquetados con fecha y hora", "FLAC sin pérdida", "No se almacenan en ningún formato"], "c": [1], "e": "Los comandos de voz se almacenan en los servidores de Google en MP3 a 48 kbps, con fecha y hora.", "nota": ""}, {"id": "6.17", "t": 6, "n": 17, "q": "¿Qué demuestra el hecho de que el audio incluya la propia frase «OK Google»?", "o": ["Que el usuario grabó manualmente el comando", "Que el dispositivo está escuchando y grabando permanentemente el sonido ambiente en un búfer", "Que el audio fue manipulado posteriormente", "Que Google transcribe los comandos con retraso"], "c": [1], "e": "Que el audio incluya «OK Google» indica que el dispositivo escucha y graba el ambiente permanentemente en un búfer.", "nota": ""}, {"id": "6.18", "t": 6, "n": 18, "q": "¿Qué matiz técnico aporta el autor sobre esa grabación permanente?", "o": ["Que el dispositivo almacena semanas enteras de audio localmente", "Que con solo 256 Mb no puede almacenar más de unas 2 horas de audio, por lo que se trata de un búfer reducido", "Que la grabación se envía íntegra a Google en tiempo real", "Que el búfer se elimina al desconectar el dispositivo"], "c": [1], "e": "Con solo 256 Mb no puede guardar más de unas 2 horas de audio, así que es un búfer reducido, no una grabación permanente.", "nota": ""}, {"id": "6.19", "t": 6, "n": 19, "q": "¿Qué método empleó el autor para comprobar si el dispositivo subía continuamente el sonido ambiente?", "o": ["Desmontar de nuevo el dispositivo", "Cuantificar el tráfico de red del dispositivo y valorar su compatibilidad con un flujo continuo de audio", "Consultar directamente a Google", "Analizar el consumo eléctrico del aparato"], "c": [1], "e": "El autor cuantificó el tráfico de red del dispositivo y valoró si era compatible con un flujo continuo de audio.", "nota": ""}, {"id": "6.20", "t": 6, "n": 20, "q": "¿Qué información se obtiene del directorio «Servicio de configuración de dispositivo Android»?", "o": ["Datos técnicos y de identificación del smartphone vinculado a la cuenta", "El listado de canciones reproducidas", "Las coordenadas GPS históricas del usuario", "Las contraseñas almacenadas en el navegador"], "c": [0], "e": "Ese directorio contiene datos técnicos y de identificación del smartphone vinculado a la cuenta.", "nota": ""}, {"id": "7.1", "t": 7, "n": 1, "q": "¿Cuál es la pregunta clave que plantea el tema?", "o": ["Cómo cifrar correctamente un dispositivo intervenido", "Qué ocurre cuando sabemos que la información está en el dispositivo, pero no podemos obtenerla", "Cómo reducir el coste de las pericias informáticas", "Qué herramienta forense es más rápida"], "c": [1], "e": "La pregunta clave es qué ocurre cuando sabemos que la información está en el dispositivo, pero no podemos obtenerla.", "nota": ""}, {"id": "7.2", "t": 7, "n": 2, "q": "Según la doctrina de la STS 777/2022, ¿es obligatoria la pericial informática para acreditar la autenticidad de una conversación digital?", "o": ["Sí, siempre es obligatoria", "No es obligatoria y no existe presunción de falsedad", "Solo es obligatoria en el ámbito civil", "Únicamente cuando el investigado lo solicita"], "c": [1], "e": "Según la STS 777/2022, la pericial no es obligatoria para acreditar un chat y no existe presunción de falsedad.", "nota": ""}, {"id": "7.3", "t": 7, "n": 3, "q": "¿Cuál de los siguientes NO se cita como elemento que puede acreditar la autenticidad de un chat?", "o": ["Declaraciones persistentes y coherentes de la víctima", "Testigos en juicio con conocimiento directo o indirecto", "El informe de la operadora telefónica sobre el consumo de datos", "Declaraciones de los agentes investigadores"], "c": [2], "e": "El informe de la operadora sobre el consumo de datos no es un elemento citado para acreditar la autenticidad de un chat.", "nota": ""}, {"id": "7.4", "t": 7, "n": 4, "q": "¿Qué aporta el «interrogatorio contradictorio» como elemento de acreditación?", "o": ["El debate efectivo entre acusación y defensa sobre el contenido de los mensajes", "La declaración exclusiva del perito de parte", "La renuncia de la defensa a impugnar la prueba", "La ratificación notarial del contenido"], "c": [0], "e": "El interrogatorio contradictorio aporta el debate efectivo entre acusación y defensa sobre el contenido de los mensajes.", "nota": ""}, {"id": "7.5", "t": 7, "n": 5, "q": "¿Qué es la «corroboración externa»?", "o": ["La coincidencia del chat con otros elementos objetivos que refuercen su veracidad", "La confirmación del contenido por parte del proveedor de mensajería", "La declaración de un segundo perito informático", "El cotejo con la copia de seguridad en la nube"], "c": [0], "e": "La corroboración externa es la coincidencia del chat con otros elementos objetivos que refuerzan su veracidad.", "nota": ""}, {"id": "7.6", "t": 7, "n": 6, "q": "¿Qué establece la conclusión doctrinal del Tribunal Supremo citada en el tema?", "o": ["Que todo chat requiere pericial informática para ser valorado", "Que la ausencia de pericial forense no impide por sí sola la consideración del chat como prueba válida", "Que los chats carecen de valor probatorio autónomo", "Que solo son válidos los chats aportados por la acusación"], "c": [1], "e": "El Supremo concluye que la ausencia de pericial forense no impide por sí sola considerar el chat como prueba válida.", "nota": ""}, {"id": "7.7", "t": 7, "n": 7, "q": "¿Qué sentencias se citan junto a la STS 777/2022?", "o": ["La STS 3318/2022", "La STS 1234/2020", "La STC 114/1984", "La STJUE Digital Rights Ireland"], "c": [0], "e": "Junto a la STS 777/2022 se cita la STS 3318/2022.", "nota": ""}, {"id": "7.8", "t": 7, "n": 8, "q": "¿Qué debe documentarse para reforzar la validez probatoria de un chat?", "o": ["Conservar íntegramente la conversación desde su obtención, obtener el soporte original, declaraciones coherentes y ausencia de indicios de manipulación", "Únicamente una captura de pantalla del mensaje más relevante", "Solo el número de teléfono del remitente", "Exclusivamente el informe de la operadora"], "c": [0], "e": "Para reforzar la validez hay que conservar íntegra la conversación, obtener el soporte original, aportar declaraciones coherentes y no tener indicios de manipulación.", "nota": ""}, {"id": "7.9", "t": 7, "n": 9, "q": "¿Qué escenario real describe el tema en una Entrada y Registro?", "o": ["El dispositivo está apagado y sin autorización judicial", "El dispositivo está encendido, intervenido legalmente, se conoce el código de desbloqueo y existe autorización judicial, y aun así el acceso puede resultar imposible", "No se localiza ningún dispositivo electrónico", "El titular colabora siempre voluntariamente"], "c": [1], "e": "El escenario: dispositivo encendido, legalmente intervenido, con código conocido y autorización judicial, y aun así el acceso falla.", "nota": ""}, {"id": "7.10", "t": 7, "n": 10, "q": "¿Cuál es la idea clave respecto a la autorización judicial y el acceso técnico?", "o": ["La autorización judicial garantiza siempre el acceso técnico", "La disponibilidad legal de la evidencia no garantiza su accesibilidad técnica", "El acceso técnico hace innecesaria la autorización judicial", "Ambos conceptos son jurídicamente equivalentes"], "c": [1], "e": "La disponibilidad legal de la evidencia no garantiza su accesibilidad técnica.", "nota": ""}, {"id": "7.11", "t": 7, "n": 11, "q": "¿Qué suele habilitar el mandamiento judicial respecto a los dispositivos electrónicos?", "o": ["Únicamente la incautación física del soporte", "El registro de dispositivos y el acceso a su contenido, tanto en memoria física como en almacenamiento remoto o en la nube", "Solo el acceso a las llamadas telefónicas", "Exclusivamente el volcado de la tarjeta SIM"], "c": [1], "e": "El mandamiento suele habilitar el registro de los dispositivos y el acceso a su contenido, tanto en memoria física como en almacenamiento remoto o nube.", "nota": ""}, {"id": "7.12", "t": 7, "n": 12, "q": "¿A qué se extiende la autorización según la conclusión del tema?", "o": ["Solo al soporte físico intervenido", "Al contenido accesible desde el dispositivo, no solo al soporte físico", "Únicamente a los datos almacenados localmente", "Exclusivamente a las aplicaciones instaladas"], "c": [1], "e": "La autorización se extiende al contenido accesible desde el dispositivo, no solo al soporte físico.", "nota": ""}, {"id": "7.13", "t": 7, "n": 13, "q": "¿Por qué son determinantes las primeras actuaciones sobre el terminal?", "o": ["Porque condicionan el coste de la pericia", "Porque un error durante la intervención puede dificultar gravemente el acceso posterior a la información", "Porque determinan la competencia del juzgado", "Porque fijan el plazo de instrucción"], "c": [1], "e": "Las primeras actuaciones son determinantes porque un error puede dificultar gravemente el acceso posterior a la información.", "nota": ""}, {"id": "7.14", "t": 7, "n": 14, "q": "¿Cuál es la secuencia correcta del protocolo de actuación descrito?", "o": ["Análisis forense → Traslado → Aseguramiento → Localización", "Localización → Aseguramiento → Traslado → Análisis forense", "Aseguramiento → Localización → Análisis forense → Traslado", "Traslado → Localización → Aseguramiento → Análisis forense"], "c": [1], "e": "La secuencia del protocolo es localización, aseguramiento, traslado y análisis forense.", "nota": ""}, {"id": "7.15", "t": 7, "n": 15, "q": "¿Qué debe evitarse durante la fase de traslado?", "o": ["Fotografiar el dispositivo", "Reinicios, descargas o activaciones de seguridad", "Precintar el dispositivo", "Documentar el estado del terminal"], "c": [1], "e": "Durante el traslado hay que evitar reinicios, descargas o activaciones de seguridad.", "nota": ""}, {"id": "7.16", "t": 7, "n": 16, "q": "¿Cuál de los siguientes NO es un nuevo desafío citado en dispositivos Apple?", "o": ["Restricciones por ubicación en lugares no seguros", "Autenticación biométrica obligatoria para ciertas acciones", "Limitaciones al acceso forense incluso físicamente", "Eliminación automática del sistema operativo al intervenir el terminal"], "c": [3], "e": "La eliminación automática del sistema operativo al intervenir el terminal no es un desafío citado en dispositivos Apple.", "nota": ""}, {"id": "7.17", "t": 7, "n": 17, "q": "¿Qué consecuencia tiene que ciertas acciones requieran Face ID y no solo el PIN?", "o": ["Que conocer el código de desbloqueo ya no garantiza el acceso completo al dispositivo", "Que el dispositivo queda inutilizado permanentemente", "Que la autorización judicial deja de ser necesaria", "Que se puede acceder a todo el contenido con mayor facilidad"], "c": [0], "e": "Si ciertas acciones exigen Face ID y no solo el PIN, conocer el código ya no garantiza el acceso completo.", "nota": ""}, {"id": "7.18", "t": 7, "n": 18, "q": "¿Qué prevé la autorización respecto a los sistemas de bloqueo del dispositivo?", "o": ["Su deshabilitación por medios técnicos propios o externos, y requerir al titular que facilite el desbloqueo con medidas proporcionales", "La destrucción del dispositivo si no puede accederse", "La prohibición de solicitar colaboración al titular", "El acceso exclusivamente mediante orden del fabricante"], "c": [0], "e": "La autorización prevé deshabilitar los bloqueos por medios técnicos propios o externos y requerir al titular que desbloquee, con medidas proporcionales.", "nota": ""}, {"id": "7.19", "t": 7, "n": 19, "q": "¿Qué criterio debe regir la adopción de medidas para asegurar la colaboración del titular?", "o": ["La proporcionalidad", "La urgencia exclusivamente", "El criterio discrecional del agente actuante", "La gravedad de la pena prevista únicamente"], "c": [0], "e": "Las medidas para asegurar la colaboración del titular se rigen por la proporcionalidad.", "nota": ""}, {"id": "7.20", "t": 7, "n": 20, "q": "¿Cuáles son los tres pilares del «triángulo de referencia» del caso práctico?", "o": ["Legalidad, Técnica y Evidencia", "Rapidez, Coste y Eficacia", "Acusación, Defensa y Tribunal", "Hardware, Software y Red"], "c": [0], "e": "Los tres pilares del triángulo de referencia son legalidad, técnica y evidencia.", "nota": ""}, {"id": "8.1", "t": 8, "n": 1, "q": "¿Cuál es la finalidad primordial de la cadena de custodia en el tratamiento de evidencias digitales?", "o": ["Evitar que los dispositivos electrónicos se queden sin batería.", "Documentar de forma exhaustiva la trazabilidad, estado y transferencias de la evidencia para garantizar su validez e integridad procesal.", "Determinar el valor de mercado del material intervenido.", "Cifrar los discos duros antes de su entrega en el juzgado."], "c": [1], "e": "La cadena de custodia documenta de forma exhaustiva la trazabilidad, estado y transferencias de la evidencia para garantizar su validez e integridad procesal.", "nota": ""}, {"id": "8.2", "t": 8, "n": 2, "q": "Según la doctrina fijada en la STS 777/2022, ¿es obligatoria la pericial informática para atribuir valor probatorio a una conversación digital aportada al proceso?", "o": ["Sí, siempre es requisito sine qua non para su admisión.", "No, su autenticidad puede acreditarse mediante un cuadro de indicios concordantes y no existe presunción de falsedad.", "Solo si la conversación procede de redes sociales extranjeras.", "Únicamente en los litigios de naturaleza estrictamente mercantil."], "c": [1], "e": "Según la STS 777/2022, la pericial no es obligatoria: la autenticidad puede acreditarse mediante indicios concordantes y no hay presunción de falsedad.", "nota": ""}, {"id": "8.3", "t": 8, "n": 3, "q": "¿Qué garantiza estrictamente la coincidencia de un valor hash (SHA-256) entre la imagen forense y el soporte original?", "o": ["La autoría del usuario sobre los archivos creados.", "La integridad matemática exacta de la secuencia de bytes procesada entre dos momentos temporales.", "La licitud de la obtención policial durante la entrada y registro.", "La inexistencia de información oculta en el espacio no asignado."], "c": [1], "e": "Un hash SHA-256 coincidente garantiza la integridad matemática de la secuencia de bytes entre dos momentos; no prueba autoría ni licitud.", "nota": ""}, {"id": "8.4", "t": 8, "n": 4, "q": "¿Por qué se afirma que la disponibilidad legal de la evidencia no equivale a su accesibilidad técnica?", "o": ["Porque los jueces no autorizan el análisis de dispositivos móviles.", "Porque pueden concurrir mandamiento judicial y posesión física del dispositivo, pero las medidas de seguridad y cifrado pueden impedir el acceso efectivo a los datos.", "Porque los volcados forenses degradan siempre los componentes físicos del terminal.", "Porque el estándar ISO/IEC 27037 prohíbe analizar dispositivos bloqueados."], "c": [1], "e": "Puede haber mandamiento judicial y posesión del dispositivo, pero el cifrado y las medidas de seguridad pueden impedir el acceso técnico.", "nota": ""}, {"id": "8.5", "t": 8, "n": 5, "q": "¿Qué alcance material otorga un mandamiento judicial habilitante que autoriza el registro de dispositivos y repositorios vinculados?", "o": ["Se limita exclusivamente a las carpetas visibles en el escritorio del ordenador.", "Permite acceder al soporte físico, unidades extraíbles, sesiones activas y a los datos en repositorios remotos o nube accesibles mediante credenciales del terminal.", "Impide analizar las tarjetas SIM y memorias microSD asociadas.", "Exige emitir un mandamiento independiente por cada archivo alojado en la nube."], "c": [1], "e": "Un mandamiento habilitante permite acceder al soporte físico, unidades extraíbles, sesiones activas y datos remotos o en la nube accesibles con las credenciales del dispositivo.", "nota": ""}, {"id": "8.6", "t": 8, "n": 6, "q": "¿Qué función cumple un bloqueador de escritura (write-blocker) en la fase de adquisición forense?", "o": ["Modificar los registros del sistema operativo para saltar contraseñas.", "Impedir cualquier alteración física o lógica sobre el soporte original mientras se realiza la lectura para generar la imagen bit a bit.", "Formatear el disco de destino antes del clonado.", "Optimizar la velocidad de la memoria RAM del equipo del analista."], "c": [1], "e": "El bloqueador de escritura impide cualquier alteración del soporte original mientras se lee para generar la imagen bit a bit.", "nota": ""}, {"id": "8.7", "t": 8, "n": 7, "q": "¿Qué medida inicial de preservación debe adoptarse ante un teléfono móvil encendido intervenido en un registro?", "o": ["Apagarlo de inmediato pulsando el botón de encendido repetidamente.", "Aislarlo electromagnéticamente mediante modo avión o bolsa de Faraday y evitar la pérdida de datos volátiles.", "Conectarlo a una red Wi-Fi pública para actualizar el sistema.", "Extraer de forma forzada la tarjeta SIM sin documentar el estado de la pantalla."], "c": [1], "e": "Ante un móvil encendido se aísla electromagnéticamente (modo avión o bolsa Faraday) para evitar la pérdida de datos volátiles.", "nota": ""}, {"id": "8.8", "t": 8, "n": 8, "q": "De los siguientes elementos, ¿cuál NO es un medio idóneo para corroborar la autenticidad de un chat digital sin pericial informática según el Tribunal Supremo?", "o": ["La declaración coherente y reiterada de la víctima sometida a contradicción.", "La corroboración externa con hechos objetivos coincidentes.", "La mera captura de pantalla impresa sin posibilidad de cotejo ni soporte indiciario alguno.", "El testimonio de los agentes investigadores que intervinieron el terminal."], "c": [2], "e": "Una mera captura impresa, sin cotejo ni soporte indiciario, no es medio idóneo; declaraciones, corroboración externa y testigos sí lo son.", "nota": ""}, {"id": "8.9", "t": 8, "n": 9, "q": "¿Qué riesgo entraña presuponer que un equipo informático está apagado únicamente porque su pantalla permanezca en negro?", "o": ["Ninguno, ya que la ausencia de imagen acredita el cese de energía.", "Interrumpir abruptamente la alimentación en estados de bajo consumo (S3/Modern Standby), perdiendo el contenido de la memoria RAM y claves criptográficas activas.", "Provocar el formateo automático de las particiones GPT.", "Modificar irreversiblemente el número de serie de fábrica grabado en el firmware."], "c": [1], "e": "Una pantalla negra puede ser un estado de bajo consumo (S3/Modern Standby); cortar la alimentación pierde la RAM y las claves criptográficas.", "nota": ""}, {"id": "8.10", "t": 8, "n": 10, "q": "¿Cuál es la diferencia fundamental entre una imagen forense y un clonado de disco?", "o": ["La imagen genera uno o varios archivos contenedores; el clonado replica los datos directamente en otro dispositivo físico.", "El clonado nunca copia bit a bit.", "La imagen forense se realiza sin verificar el valor hash.", "El clonado solo es aplicable a memorias volátiles de tipo RAM."], "c": [0], "e": "La imagen genera uno o varios archivos contenedores; el clonado replica los datos directamente en otro dispositivo físico.", "nota": ""}, {"id": "8.11", "t": 8, "n": 11, "q": "En una adquisición de tráfico de red, ¿qué diferencia al filtro de captura del filtro de visualización?", "o": ["El de captura se aplica en post-procesamiento; el de visualización descarta paquetes antes de escribirlos en disco.", "El de captura descarta tráfico irreversiblemente antes de volcarlo a disco; el de visualización opera sobre el archivo PCAP consolidado sin alterar los bytes originales.", "No existe diferencia técnica alguna entre ambos.", "El de visualización elimina los paquetes no coincidentes del almacenamiento local."], "c": [1], "e": "El filtro de captura descarta tráfico de forma irreversible antes de volcarlo; el de visualización actúa sobre el PCAP consolidado sin alterarlo.", "nota": ""}, {"id": "8.12", "t": 8, "n": 12, "q": "En la individualización de un soporte de almacenamiento, ¿cuál de los identificadores presenta menor fiabilidad probatoria?", "o": ["El número de serie obtenido por comandos de firmware (ATA/SCSI).", "El número de serie visible en etiquetas o serigrafías exteriores.", "El identificador único de volumen asignado por el sistema de archivos.", "La capacidad nativa LBA reportada por el controlador."], "c": [1], "e": "El número de serie visible en etiquetas o serigrafías es el menos fiable, porque es fácilmente manipulable.", "nota": ""}, {"id": "8.13", "t": 8, "n": 13, "q": "¿Qué artefacto forense de entornos Windows permite acreditar la ejecución previa de un programa mediante archivos generados para optimizar el arranque?", "o": ["Tablas de particiones MBR.", "Archivos Prefetch.", "Sectores ocultos DCO.", "Inodos del sistema ext4."], "c": [1], "e": "Los archivos Prefetch acreditan la ejecución previa de un programa, ya que se generan para optimizar el arranque.", "nota": ""}, {"id": "8.14", "t": 8, "n": 14, "q": "¿Por qué en dispositivos móviles de última generación la adquisición suele ser lógica o de sistema de archivos en lugar de física bit a bit?", "o": ["Porque la normativa internacional prohíbe las adquisiciones físicas.", "Debido a las limitaciones impuestas por el cifrado por hardware, el arranque seguro y la falta de acceso root/superusuario.", "Porque las extracciones lógicas tardan más tiempo en ejecutarse.", "Porque los terminales móviles carecen de memoria no volátil."], "c": [1], "e": "En móviles modernos el cifrado por hardware, el arranque seguro y la falta de acceso root limitan la adquisición a lógica o de sistema de archivos.", "nota": ""}, {"id": "8.15", "t": 8, "n": 15, "q": "¿Qué principio rige la solicitud judicial de medidas coercitivas o de colaboración para vencer las barreras de desbloqueo de un terminal?", "o": ["Principio de oportunidad discrecional.", "Principio de proporcionalidad, necesidad e idoneidad.", "Principio de celeridad absoluta sin motivación.", "Principio de no contradicción procesal."], "c": [1], "e": "La solicitud judicial de medidas coercitivas o de colaboración se rige por el principio de proporcionalidad, necesidad e idoneidad.", "nota": "En el PDF original la opción correcta figura en negrita (sin el resaltado amarillo habitual)."}, {"id": "8.16", "t": 8, "n": 16, "q": "¿Qué dato NO debe incluirse de manera innecesaria o desproporcionada en un acta pericial por razones de protección de datos?", "o": ["El número de serie del disco duro analizado.", "Datos de salud, ideología o numeraciones bancarias completas de terceros no relacionados con el objeto de la causa.", "El valor hash del archivo de imagen forense.", "La marca y modelo del chasis del equipo anfitrión."], "c": [1], "e": "No deben incluirse innecesariamente datos de salud, ideología o numeraciones bancarias completas de terceros ajenos a la causa.", "nota": ""}, {"id": "8.17", "t": 8, "n": 17, "q": "Para que un proceso de transformación forense sobre una evidencia sea reproducible, ¿qué cuatro elementos deben concurrir?", "o": ["Denuncia, atestado, auto judicial y sentencia firme.", "Dato de entrada unívoco con hash, herramienta/versión controladas, procedimiento determinista y dato de salida verificable con hash.", "Maletín forense, precinto plástico, acta notarial y cámara de fotos.", "Conexión a internet, usuario administrador, software privativo y testigo pericial."], "c": [1], "e": "Una transformación reproducible requiere dato de entrada con hash, herramienta y versión controladas, procedimiento determinista y dato de salida verificable con hash.", "nota": ""}, {"id": "8.18", "t": 8, "n": 18, "q": "En el peritaje judicial, ¿qué figura procesal faculta a las partes para solicitar la separación de un perito cuando concurre causa de imparcialidad y este no se ha abstenido voluntariamente?", "o": ["La tacha de testigos.", "La recusación.", "La prescripción.", "El allanamiento."], "c": [1], "e": "La recusación permite a las partes solicitar la separación de un perito cuando concurre causa de imparcialidad.", "nota": ""}, {"id": "8.19", "t": 8, "n": 19, "q": "¿Qué circunstancia técnica explica que en dispositivos móviles y drones las extracciones sucesivas arrojen valores hash distintos?", "o": ["Que las herramientas forenses introducen errores de lectura de forma aleatoria.", "Que son sistemas vivos que ejecutan procesos, escrituras automáticas y modificaciones de logs en segundo plano de manera continua.", "Que las tarjetas flash pierden magnetismo durante el escaneo.", "Que el cálculo del algoritmo SHA-256 varía en función de la temperatura del procesador."], "c": [1], "e": "Móviles y drones son sistemas «vivos»: ejecutan procesos y modifican logs en segundo plano, por lo que extracciones sucesivas dan hashes distintos.", "nota": ""}, {"id": "8.20", "t": 8, "n": 20, "q": "Al consignar observaciones sobre el estado físico de un precinto de custodia roto, ¿cómo debe proceder el perito?", "o": ["Atribuir intencionalidad dolosa a los encargados del traslado.", "Describir objetivamente la ubicación, orientación y dimensiones del desperfecto, evitando conjeturar sobre su causa o mecánica de producción.", "Omitir el hallazgo en el informe para evitar la nulidad de las actuaciones.", "Sustituir el precinto sin dejar constancia documental de la alteración previa."], "c": [1], "e": "Ante un precinto roto hay que describir objetivamente ubicación, orientación y dimensiones, sin conjeturar sobre su causa.", "nota": ""}];
const KEY='asig07_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
</body>
