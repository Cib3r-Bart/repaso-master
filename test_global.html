"o":["El diseño informático de edificios y puentes mediante software CAD.","La manipulación psicológica de las personas para que adopten medidas irreflexivas o revelen información confidencial.","La reparación física de un ordenador mediante herramientas de soldadura.","La programación de aplicaciones informáticas en lenguaje Java."],"a":1,"e":"Ataca el eslabón humano aprovechando la confianza, urgencia o autoridad percibida para eludir las barreras técnicas."},{"n":123,"m":8,"q":"Un “Ransomware” es un programa informático malicioso concebido para:","o":["Aumentar la velocidad de descarga del navegador web.","Cifrar o bloquear el acceso a los datos del dispositivo infectado solicitando el pago de una suma para su liberación.","Encender de forma remota la cámara del ordenador sin permiso.","Formatear de inmediato el disco duro sin dar opción a recuperar nada."],"a":1,"e":"Convierte la disponibilidad de la información en objeto de extorsión económica para exigir un rescate."},{"n":124,"m":8,"q":"En las investigaciones en fuentes abiertas (OSINT), los operadores booleanos “AND”, “OR” y “NOT” sirven para:","o":["Formatear el texto de los informes periciales en formato negrita.","Refinar, filtrar y delimitar con mayor precisión los términos en las consultas de búsqueda.","Cifrar las conexiones entre el navegador y el servidor de Google.","Aumentar la memoria RAM del ordenador de análisis."],"a":1,"e":"Permiten combinar o excluir expresiones específicas dentro de los algoritmos de filtrado de las fuentes de información."},{"n":125,"m":8,"q":"¿Qué es la “Memoria RAM” en un equipo desde el punto de vista del análisis forense?","o":["Un dispositivo magnético permanente que almacena información sin necesidad de corriente eléctrica.","Una fuente de información extremadamente volátil que pierde todos sus datos al apagar el sistema informático.","Un tipo de conector externo para cables de red de alta velocidad.","Una carpeta del sistema operativo donde se guardan las descargas de internet."],"a":1,"e":"Al tratarse de almacenamiento volátil, su volcado (RAM dump) debe primarse antes de cortar el flujo eléctrico de la máquina bajo inspección."},{"n":126,"m":8,"q":"¿Qué es un “Adware”?","o":["Un programa malicioso concebido para borrar de forma definitiva la partición del sistema.","Software diseñado para mostrar o descargar publicidad de manera automática e incesante en la pantalla del usuario.","Un cable especial de alta fidelidad para la transmisión de sonido digital.","Un sistema informático señuelo para cazar cibercriminales."],"a":1,"e":"Busca generar beneficios publicitarios no deseados saturando la experiencia del usuario con anuncios intrusivos."},{"n":127,"m":8,"q":"La técnica conocida como “Man-in-the-Middle” (MitM) atenta directamente contra:","o":["El precio de los componentes informáticos en el mercado internacional.","La confidencialidad e integridad de las comunicaciones entre dos interlocutores.","La capacidad física del disco duro de un ordenador.","La duración de la batería de las estaciones de trabajo de los administradores."],"a":1,"e":"El agresor se inserta en el flujo de comunicación permitiéndole leer, espiar o alterar el tráfico transmitido."},{"n":128,"m":8,"q":"En la ciencia de la criptografía, una “Función Hash” se caracteriza por ser:","o":["Una operación matemática bidireccional que permite recuperar fácilmente el texto original.","Una función unidireccional que transforma cualquier bloque de datos en una cadena de longitud fija e irreversible.","Un programa para comprimir vídeos en formato MP4.","Un antivirus que bloquea el tráfico web malicioso."],"a":1,"e":"Las funciones hash son unívocas e irreversibles; no permiten reconstruir la entrada original pero verifican la autenticidad del contenido."},{"n":129,"m":8,"q":"Un “Keylogger” es un software o hardware malicioso utilizado para:","o":["Medir el tamaño del monitor del ordenador.","Registrar de forma oculta todas las pulsaciones de teclas realizadas por el usuario en el teclado.","Aumentar la velocidad del procesamiento gráfico de los juegos.","Limpiar el polvo acumulado dentro del gabinete del equipo."],"a":1,"e":"Captura pasivamente las teclas presionadas permitiendo el robo de credenciales, mensajes privados e información sensible."},{"n":130,"m":8,"q":"El concepto de “Superficie de Ataque” de una organización abarca:","o":["El número de metros cuadrados del edificio donde se ubican las oficinas.","La suma total de los puntos de entrada, activos, servicios y sistemas vulnerables expuestos a un posible cibervulnerador.","El número total de empleados que trabajan en el departamento financiero.","La cantidad de monitores de televisión instalados en las salas de reuniones."],"a":1,"e":"Representa el conjunto consolidado de vectores expuestos que un atacante podría intentar explotar dentro de una infraestructura."},{"n":131,"m":8,"q":"¿Qué es la “Firma Digital”?","o":["Un dibujo escaneado de la firma manuscrita insertado dentro de un documento PDF.","Un mecanismo criptográfico que se adhiere a un mensaje o documento garantizando su autenticidad, integridad y el no repudio por el emisor.","El nombre completo del autor escrito en la parte inferior de un correo electrónico.","Un sello estampado con tinta indeleble sobre un disco compacto."],"a":1,"e":"Se apoya en un certificado digital y claves criptográficas asimétricas para vincular formal e inalterablemente al firmante con el documento."},{"n":132,"m":8,"q":"La vulnerabilidad de “SQL Injection” se presenta principalmente en:","o":["Aplicaciones web con deficiente validación de datos de entrada que interactúan con bases de datos relacionales.","Servidores de archivos sin conexión a internet.","Impresoras láser conectadas mediante cables USB directos.","Sistemas operativos que no han actualizado el fondo de pantalla."],"a":0,"e":"La falta de filtrado en campos de entrada permite inyectar instrucciones SQL que son ejecutadas directamente por el motor de la base de datos."},{"n":133,"m":8,"q":"El protocolo “SSH” (Secure Shell) se utiliza de forma habitual para:","o":["Escuchar música en alta fidelidad a través de internet.","Acceder y administrar de forma remota y cifrada la consola de comandos de un servidor.","Imprimir documentos en red sin usar papel.","Crear animaciones interactivas para páginas web."],"a":1,"e":"SSH sustituye a protocolos no seguros como Telnet, cifrando la sesión de control y administración remota de máquinas."},{"n":134,"m":8,"q":"Un ataqué de “Spoofing” implica siempre:","o":["El borrado físico de los sectores de un disco duro mecánico.","La falsificación o suplantación de identidades, direcciones IP, cabeceras o nombres de dominio para engañar a un sistema o usuario.","La compra legal de licencias de software en tiendas oficiales.","La instalación de un cortafuegos en la red corporativa."],"a":1,"e":"“Spoofing” abarca todas las técnicas de falsificación de identificadores técnicos para hacerse pasar por una fuente autorizada."},{"n":135,"m":8,"q":"¿Qué rol tiene el “CISO” (Chief Information Security Officer) en una empresa?","o":["Reparar las impresoras dañadas de la oficina.","Dirigir, establecer e implementar la estrategia global de seguridad de la información y ciberseguridad en la entidad.","Atender el conmutador telefónico de atención al cliente.","Instalar las actualizaciones de software en las computadoras de los empleados."],"a":1,"e":"Es el máximo ejecutivo responsable de alinear la ciberseguridad con los objetivos corporativos, la gestión del riesgo y el cumplimiento."},{"n":136,"m":8,"q":"El malware de tipo “Backdoor” (Puerta Trasera) se caracteriza por:","o":["Emitir sonidos molestos a través de los altavoces del ordenador.","Crear un punto de acceso no documentado y secreto que permite al atacante ingresar al sistema omitiendo los controles habituales de autenticación.","Formatear la unidad flash USB tan pronto como se conecta.","Cambiar la hora de la computadora a la de otra zona horaria."],"a":1,"e":"Ofrece una vía de entrada oculta para mantener persistencia e ingresar al entorno víctima a voluntad."},{"n":137,"m":8,"q":"¿Qué es un “Escáner de Vulnerabilidades” (ej. Nessus, OpenVAS)?","o":["Una herramienta para hacer fotos en alta definición de componentes electrónicos.","Una aplicación automatizada que inspecciona sistemas y redes en busca de fallos de configuración, parches faltantes o fallos de seguridad conocidos.","Un dispositivo informático que bloquea las llamadas telefónicas spam.","Un programa informático para crear contraseñas seguras de forma aleatoria."],"a":1,"e":"Analiza los sistemas frente a bases de datos de vulnerabilidades conocidas (CVE) para emitir un informe sobre la postura de seguridad."},{"n":138,"m":8,"q":"¿Qué es el “Patch Tuesday” en la industria de la ciberseguridad?","o":["El día del año en que está prohibido encender los ordenadores.","La fecha habitual (segundo martes de cada mes) en la que empresas como Microsoft publican de forma periódica sus parches y actualizaciones de seguridad.","Una técnica de hacking para descompilar ejecutables.","El día de fiesta oficial para los peritos informáticos en Europa."],"a":1,"e":"Representa el ciclo estandarizado de lanzamiento de actualizaciones de seguridad utilizado por la industria para corregir vulnerabilidades."},{"n":139,"m":8,"q":"El término “Zero Trust Architecture” exige:","o":["No usar contraseñas para acceder a ningún sistema corporativo.","Asumir la presencia potencial de amenazas en la red y validar rigurosamente cada solicitud de acceso, dispositivo y usuario de forma continua.","Confiar ciegamente en todos los dispositivos conectados mediante cable físico.","Utilizar únicamente ordenadores portátiles sin conexión Wi-Fi."],"a":1,"e":"Modifica el modelo de perímetro tradicional imponiendo verificación continua bajo el principio de menor privilegio."},{"n":140,"m":8,"q":"La técnica “Cross-Site Request Forgery” (CSRF) obliga al navegador del usuario a:","o":["Formatear el disco duro en segundo plano sin mostrar alertas.","Ejecutar acciones no deseadas e involuntarias en una aplicación web en la que el usuario se encuentra previamente autenticado.","Aumentar la velocidad de descarga de sus archivos de red.","Apagar el router de la oficina de manera remota."],"a":1,"e":"Induce a la víctima a enviar peticiones no autorizadas a una aplicación legítima aprovechando que su sesión sigue activa."},{"n":141,"m":8,"q":"En ciberinteligencia, la recolección “FININT” se refiere a:","o":["La inteligencia obtenida mediante el análisis de imágenes de satélite.","La obtención y análisis de transacciones financieras para rastrear actividades ilícitas, lavados de dinero o la financiación del cibercrimen.","El análisis del código fuente de programas escritos en lenguajes antiguos.","La captura de conversaciones telefónicas entre particulares."],"a":1,"e":"Examina flujos monetarios y de criptoactivos para identificar las redes financieras asociadas a organizaciones delictivas."},{"n":142,"m":8,"q":"¿Qué es un “CERT” o “CSIRT”?","o":["Un certificado de garantía concedido a los monitores de ordenador.","Un equipo especializado de respuesta a incidentes de ciberseguridad responsable de prevenir, procesar y reaccionar ante eventos de seguridad.","Un lenguaje de programación diseñado para bases de datos relacionales.","Una ley internacional que prohíbe el uso de correos electrónicos no cifrados."],"a":1,"e":"Computer Emergency Response Team / Computer Security Incident Response Team son las entidades operativas encargadas de gestionar emergencias digitales."},{"n":143,"m":8,"q":"La vulnerabilidad de “Directory Traversal” permite a un atacante:","o":["Romper físicamente las puertas de un centro de datos.","Acceder a archivos y directorios restringidos fuera del directorio raíz web mediante secuencias de comandos del tipo../.","Aumentar la resolución gráfica de la pantalla de un usuario.","Borrar las cuentas de correo electrónico de los administradores de sistemas."],"a":1,"e":"Explota un fallo de saneamiento para escalar en el árbol del sistema de archivos del servidor y consultar datos privados."},{"n":144,"m":8,"q":"En una prueba de penetración (Pen Test), el enfoque de “Caja Negra” (Black Box) consiste en:","o":["Probar los sistemas teniendo acceso completo al código fuente e infraestructura.","Realizar la prueba sin ningún conocimiento previo de la estructura interna del sistema objetivo, simulando el punto de vista de un atacante externo.","Apagar todas las luces de la sala de servidores durante la auditoría.","Probar únicamente los equipos informáticos que estén fuera de servicio."],"a":1,"e":"Modela la perspectiva de una amenaza externa real que no dispone de credenciales ni documentación sobre el objetivo."},{"n":145,"m":8,"q":"¿Qué es un “Exploit Kit”?","o":["Un maletín de herramientas físicas para abrir la caja de los ordenadores.","Un paquete de software alojado en la web que automatiza la detección de vulnerabilidades en el navegador del cliente para infectarlo con malware.","Un manual imprimible sobre la ley de protección de datos.","Un programa de diseño para crear logotipos de empresas."],"a":1,"e":"Automatiza la fase de explotación lanzando baterías de ataques adaptadas a las fallas detectadas en la máquina visitante."},{"n":146,"m":8,"q":"La “Ingeniería Inversa” de malware se utiliza para:","o":["Borrar el historial de páginas visitadas en el navegador del ordenador.","Descompilar y analizar el código binario para comprender su funcionamiento, origen, objetivos y formas de mitigación.","Vender el virus en plataformas de subastas por internet.","Traducir el menú de un programa de un idioma a otro."],"a":1,"e":"Desmonta la lógica interna del programa malicioso para desarrollar firmas, vacunas o mecanismos de detección."},{"n":147,"m":8,"q":"Un ataque “Smishing” es una variante de phishing que utiliza como canal de transmisión:","o":["Mensajes de texto SMS en teléfonos móviles.","Cartas escritas a mano y enviadas por correo postal.","Llamadas de televisión por cable.","Mensajes de voz grabados en la contestadora fija."],"a":0,"e":"Smishing combina SMS y Phishing para dirigir a la víctima a enlaces fraudulentos o descargar software malicioso en su smartphone."},{"n":148,"m":8,"q":"¿Qué es el “Hardening” (Endurecimiento) de un sistema informático?","o":["Recubrir la caja del ordenador con una placa de acero.","El proceso de asegurar un sistema reduciendo su superficie de ataque mediante la eliminación de servicios innecesarios, cambio de claves por defecto y aplicación de parches.","Aumentar la velocidad del procesador por encima de los límites del fabricante.","Formatear el disco duro instalando un sistema operativo antiguo."],"a":1,"e":"Consiste en fortificar los parámetros operativos por defecto para elevar las barreras defensivas de una plataforma."},{"n":149,"m":8,"q":"Un “Scam” en entornos digitales es:","o":["Un fallo de fabricación en el procesador informático.","Un término genérico utilizado para referirse a estafas o fraudes económicos perpetrados a través de medios electrónicos.","Un cable para conectar varios monitores a la vez.","Un programa para medir la temperatura del equipo informático."],"a":1,"e":"Abarca engaños y ofertas fraudulentas en línea encaminados a la expoliación económica directa de las víctimas."},{"n":150,"m":8,"q":"¿Qué se entiende por “Ciberpatrullaje” en las unidades policiales?","o":["El desplazamiento físico de coches patrulla por las zonas comerciales.","La monitorización y rastreo proactivo y continuado de entornos digitales públicos (redes, foros, Dark Web) para prevenir e investigar la comisión de delitos.","La reparación de las computadoras de las comisarías de policía.","La revisión de los pasaportes en los controles de aduanas de los aeropuertos."],"a":1,"e":"Es la actividad investigadora en fuentes abiertas y redes para la detección precoz e investigación de ilícitos penales cibernéticos."},{"n":151,"m":8,"q":"¿Qué es un “Ataque de Retransmisión” (Replay Attack)?","o":["Romper la pantalla del monitor mediante un golpe físico repetido.","La captura de un flujo de datos válido y su retransmisión maliciosa posterior para simular la sesión de un usuario legítimo.","La reproducción ininterrumpida de vídeos en una red social.","El envío de faxes corporativos a números desconocidos."],"a":1,"e":"Intercepta un mensaje cifrado autenticado legítimo y lo reenvía más tarde para engañar al receptor sin necesidad de descifrar la clave."},{"n":152,"m":8,"q":"La “Autenticación de Doble Factor” (2FA) mejora la seguridad porque exige:","o":["Escribir dos veces la misma contraseña en el formulario de acceso.","Dos elementos independientes de verificación basados en algo que sabes, algo que tienes o algo que eres.","Iniciar sesión usando simultáneamente dos ordenadores portátiles diferentes.","Pagar una cuota adicional a la empresa que presta el servicio web."],"a":1,"e":"Dificulta la intrusión, puesto que comprometer la clave no basta si el atacante carece del segundo factor físico o biométrico."},{"n":153,"m":8,"q":"¿Qué función tiene un sistema “SIEM” (Security Information and Event Management)?","o":["Enviar correos automáticos a todos los usuarios en Navidad.","Centralizar, correlacionar y analizar en tiempo real los registros y eventos de seguridad producidos en toda la infraestructura informatica.","Aumentar el tamaño del disco duro de las estaciones de trabajo.","Apagar las luces de la oficina cuando no se detecta movimiento."],"a":1,"e":"Unifica logs de múltiples orígenes agregando inteligencia de correlación para detectar amenazas complejas y anomalías."},{"n":154,"m":8,"q":"Un ataque de “Hijacking” de sesión consiste en:","o":["El secuestro físico de un administrador dentro de las oficinas.","Tomar el control no autorizado de una sesión de usuario válida en una aplicación web robando o duplicando su token de acceso.","Formatear los discos duros remotos de un servidor de almacenamiento.","Cambiar la marca comercial de la computadora que utiliza el cliente."],"a":1,"e":"Al apoderarse de la cookie/token de autenticación, el atacante usurpa la personalidad del usuario autenticado sin conocer su contraseña."},{"n":155,"m":8,"q":"En la investigación forense de teléfonos móviles, el volcado “Físico” se diferencia del “Lógico” en que:","o":["El físico extrae solo la libreta de contactos y el lógico borra los datos.","El físico obtiene una copia completa bit a bit de la memoria flash (incluyendo espacio no asignado y borrados), mientras que el lógico obtiene solo la estructura de archivos visible según la API del sistema.","El físico requiere romper la pantalla del teléfono con herramientas manuales.","No existe diferencia sustancial en los resultados obtenidos."],"a":1,"e":"La adquisición física accede a los bloques de la memoria flash permitiendo la recuperación de información borrada o inaccesible por métodos lógicos."},{"n":156,"m":8,"q":"¿Qué es la “Cadena de Custodia” en el procesamiento de la evidencia digital?","o":["Un dispositivo de seguridad de acero para encadenar las computadoras a la mesa.","El documento y registro continuado que garantiza la trazabilidad, identidad, inalterabilidad y control sobre las pruebas digitales.","Un protocolo de red para evitar la duplicación de correos electrónicos.","Un contrato de trabajo entre el perito informático y la empresa auditada."],"a":1,"e":"Acredita que la prueba presentada ante el tribunal es exactamente la misma que se recogió durante la inspección técnica o diligencia."},{"n":157,"m":8,"q":"¿Qué es un “Zero-Day Exploit”?","o":["Un parche de seguridad que corrige todos los problemas del sistema operativo.","Un exploit que ataca una vulnerabilidad sobre la que el fabricante aún no ha distribuido una solución técnica.","Un antivirus informático de uso libre comercializado por internet.","Una técnica para acelerar el procesamiento de datos en bases de datos."],"a":1,"e":"Se vale de fallas no publicadas o desconocidas para los desarrolladores, imposibilitando su bloqueo por métodos de firmas tradicionales."},{"n":158,"m":8,"q":"La vulnerabilidad llamada “Cross-Site Scripting” (XSS) afecta principalmente a:","o":["Los cables de red de alta velocidad de los servidores públicos.","La ejecución de código cliente (JavaScript) malicioso dentro del navegador del usuario que visita una página web vulnerable.","Los ventiladores de refrigeración del microprocesador principal.","El formato de impresión de las facturas comerciales en formato PDF."],"a":1,"e":"Inyecta código arbitrario en las respuestas web para que se ejecute en el cliente, comprometiendo sus cookies o credenciales."},{"n":159,"m":8,"q":"Un ataque “Pharming” redirige al usuario a una página web falsa mediante:","o":["La alteración ilegítima del proceso de resolución de nombres de dominio (DNS/hosts).","Un engaño telefónico solicitando la contraseña bancaria.","El envío masivo de folletos impresos por correo ordinario.","El apagado voluntario del equipo por parte de la víctima."],"a":0,"e":"Secuestra la resolución legítima de nombres de dominio para dirigir el tráfico hacia un servidor clonado sin manipular la dirección URL visible."},{"n":160,"m":8,"q":"¿Qué se entiende por “Ciberinteligencia de Amenazas” (Cyber Threat Intelligence - CTI)?","o":["La venta legal de software informático para redactar documentos corporativos.","La recolección, procesamiento y análisis de información sobre amenazas y actores maliciosos para anticipar, prevenir y mitigar ciberataques.","El uso de robots para ensamblar componentes de ordenadores en fábricas.","Un programa informático para medir la velocidad de la conexión a internet."],"a":1,"e":"CTI proporciona conocimiento contextualizado sobre amenazas para transformar datos de ciberseguridad en decisiones estratégicas y tácticas."},{"n":161,"m":8,"q":"Un ataque de “Fuerza Bruta” en el contexto del cracking de contraseñas consiste en:","o":["El uso de un martillo magnético sobre el circuito del procesador.","La prueba metódica y exhaustiva de todas las combinaciones posibles de caracteres hasta obtener el hash o clave correcta.","La llamada por teléfono solicitando la clave al usuario de la cuenta.","La destrucción física de las tarjetas de memoria del servidor."],"a":1,"e":"Se funda en la capacidad de cómputo para recorrer sistemáticamente todo el espacio de combinaciones posibles."},{"n":162,"m":8,"q":"¿Qué función cumple el protocolo “HTTPS”?","o":["Aumentar la resolución gráfica de las imágenes publicadas en internet.","Garantizar la confidencialidad, autenticidad e integridad en la navegación web mediante el uso de cifrado SSL/TLS.","Permitir la impresión de textos desde teléfonos móviles a impresoras remotas.","Borrar los virus de la memoria del ordenador de forma automática."],"a":1,"e":"Añade una capa de cifrado sobre el protocolo HTTP mediante certificados de seguridad evitando el espionaje de la sesión."},{"n":163,"m":8,"q":"El “Phishing” es una técnica caracterizada por:","o":["Un error físico de fabricación en el procesador gráfico del equipo.","La suplantación de la identidad de una entidad de confianza mediante engaño para robar credenciales o datos sensibles a los usuarios.","El reemplazo de los cables de red por conexiones de fibra óptica.","El formato de disco duro utilizado en servidores con sistema operativo Linux."],"a":1,"e":"Se orienta al engaño de la víctima para que entregue voluntariamente sus credenciales bajo un contexto simulado de veracidad."},{"n":164,"m":8,"q":"¿Qué es un “Gusano” informático?","o":["Un dispositivo físico con forma de cable que se inserta en los puertos USB.","Malware capaz de autoreplicarse y distribuirse autónomamente por las redes informáticas sin necesidad de interacción humana o archivo huésped.","Una herramienta corporativa diseñada para cifrar correos electrónicos.","Un error leve de programación que no causa ningún daño al sistema."],"a":1,"e":"Destaca por su autonomía de propagación a través de las vulnerabilidades del entorno de red."},{"n":165,"m":8,"q":"¿Qué es el “DNIe” en el marco legal y tecnológico español?","o":["Una página web del gobierno utilizada exclusivamente para consultar multas.","El documento nacional de identidad electrónico que incorpora un chip criptográfico para la acreditación legal de la identidad y firma digital.","Un programa antivirus gratuito financiado con fondos públicos europeos.","Una contraseña obligatoria para encender los ordenadores personales."],"a":1,"e":"Otorga equivalencia jurídica a la firma manuscrita mediante un certificado digital emitido por una entidad pública oficial."},{"n":166,"m":8,"q":"La red de anonimato “Tor” utiliza el principio de:","o":["Cifrar los mensajes en un único servidor público centralizado.","Enrutamiento cebolla (Onion Routing) cifrando el tráfico en varias capas a través de múltiples nodos intermedios.","Borrar todos los archivos de imágenes guardados en la computadora.","Desconectar la tarjeta Wi-Fi del ordenador mientras se navega por internet."],"a":1,"e":"Oculta la correlación IP mediante un esquema de cifrado por capas sobre nodos distribuidos de entrada, paso y salida."},{"n":167,"m":8,"q":"En una prueba pericial informática, el cálculo del código “HASH” garantiza legalmente:","o":["La marca y modelo comercial del ordenador donde se hizo la inspección.","La inalterabilidad e integridad absoluta de la copia forense respecto del soporte original analizado.","El precio exacto en euros del dictamen técnico elaborado por el perito.","Que el perito forense posee la titulación académica necesaria para declarar."],"a":1,"e":"Demuestra que la imagen o prueba digital no ha sido modificada, preservando el principio de autenticidad en el proceso penal."},{"n":168,"m":8,"q":"Un ataque de “Denegación de Servicio Distribuido” (DDoS) busca principalmente comprometer la siguiente propiedad de la seguridad de la información:","o":["La Confidencialidad de los correos almacenados.","La Disponibilidad del sistema, servicio o red objetivo.","La Autenticidad del certificado digital del servidor.","El No Repudio en el envío de transacciones."],"a":1,"e":"Su único propósito es la interrupción del servicio mediante el agotamiento masivo de los recursos de cómputo o ancho de banda."}]},L='ABCD',$=s=>document.querySelector(s);

ue la cita de la STSJ de Baleares nº 6/23 explica por qué el uso de un nick por parte del AEV NO constituye engaño: es la regla general de comportamiento en la red, no una artimaña excepcional del agente.","u":1},{"n":1027,"m":3,"q":"Para el AEV, la autorización de la actuación corresponde exclusivamente a:","o":["El Fiscal","El Juez","El Director General de la Policía","El propio agente, mediante autorización interna"],"a":1,"e":"En los apuntes: Autorización de la autoridad competente (para el AEV exclusivamente el Juez). Adapta el alcance de su actuación al entorno virtual","u":1},{"n":1028,"m":3,"q":"Según la doctrina del Tribunal Supremo sobre el ciberpatrullaje (p. ej. STS 236/2008), la realización de esta actividad en foros abiertos:","o":["Requiere siempre autorización judicial previa","Es lícita sin necesidad de autorización judicial, dentro de las funciones del agente","Está prohibida por afectar al secreto de las comunicaciones","Solo puede realizarse en investigaciones de delitos graves"],"a":1,"e":"En los apuntes: La labor de ciberpatrullaje es una actividad legítima y regular que atrae la validez de las pruebas obtenidas en su desarrollo. La validez de estas actuaciones ha sido sostenida por la Sala Segunda del Tribunal Supremo, afirmando su licitud sin necesidad de una autorización judicial que habilite al agente para realizar","u":1},{"n":1029,"m":3,"q":"Conforme a la doctrina del TS sobre ciberpatrullaje, sí se precisa autorización judicial para:","o":["Acceder a información pública introducida por el propio usuario","Desvelar la identidad de la terminal, teléfono o titular de un IP","Registrar la huella de entrada a una página pública","Realizar rastreos en redes sociales abiertas"],"a":1,"e":"En los apuntes: Se hace preciso, sin embargo, acudir a la autorización del juez instructor para desvelar la identidad de la terminal, teléfono o titular del contrato de un determinado IP, en salvaguarda del derecho a la intimidad personal (habeas data).","u":1 er restringido y para cuyo acceso es necesario un registro previo, así como la obtención","u":1},{"n":1037,"m":4,"q":"El Convenio contra la Ciberdelincuencia se firmó en Budapest en:","o":["Noviembre de 2001","Octubre de 2015","Enero de 1995","Septiembre de 2023"],"a":0,"e":"En los apuntes: Convenio contra la Ciberdelincuencia: origen, proyección territorial y estructura Origen: Consejo de Europa — Budapest, noviembre de 2001.","u":1},{"n":1038,"m":4,"q":"Conforme al art. 16 de la Convención de Budapest, el periodo de conservación de datos informáticos es de:","o":["30 días, no renovables","90 días, renovables","180 días, no renovables","60 días, renovables"],"a":1,"e":"En los apuntes: Sujeto pasivo: cualquier persona y/o entidad que tenga a su disposición datos informáticos almacenados en un sistema informático. Conservación por un periodo de 90 días renovables.","u":1},{"n":1039,"m":4,"q":"El art. 23 de la Convención de Budapest, relativo a los principios generales de cooperación internacional, establece como presupuesto la primacía de:","o":["La legislación penal del Estado requirente exclusivamente","Convenios y Tratados internacionales, normas de asistencia mutua reciproca y legislación interna","Las resoluciones de organismos internacionales no vinculantes","Exclusivamente la legislación del Estado requerido"],"a":1,"e":"En los apuntes: A) Principios de carácter general — Art. Presupuesto: primacía de Convenios y Tratados internacionales suscritos por los Estados, de las normas de asistencia mutua recíproca y de la legislación interna.","u":1},{"n":1040,"m":4,"q":"La Red internacional de puntos de contacto 24/7 se regula en el Convenio de Budapest en el:","o":["Art. 29","Art. 31","Art. 35","Art. 25"],"a":0,"e":"En los apuntes: Red internacional de puntos de contacto 24/7 — Art. Para EXAMEN: la correlación de artículos en cooperación internacional reproduce, en clave transfronteriza, la misma lógica que las medidas internas: 29=preservación (paralelo al art.","u":1},{"n":1041,"m":4,"q":"El objetivo del Segundo Protocolo Adicional al Convenio de Budapest es:","o":["Mejorar la cooperación internacional para la obtención de evidencias electrónicas en jurisdicciones extranjeras","Crear un tribunal penal internacional especializado en ciberdelitos","Sustituir íntegramente al Convenio de Budapest de 2001","Regular exclusivamente la protección de menores en internet"],"a":0,"e":"En los apuntes: Segundo Protocolo Adicional Mejorar la cooperación internacional para la obtención de evidencias electrónicas en jurisdicciones extranjeras con fines de investigación criminal.","u":1},{"n":1042,"m":4,"q":"En el Capítulo II del Segundo Protocolo Adicional, la Sección 2ª regula:","o":["Principios generales","Cooperación directa con proveedores y entidades ubicadas en otros países","Asistencia mutua de emergencia","Equipos conjuntos de investigación"],"a":0,"e":"En los apuntes: Capítulo II del Segundo Protocolo Adicional, por secciones Sección 1ª — Principios Generales.","u":1},{"n":1043,"m":4,"q":"El art. 9 del Segundo Protocolo Adicional, relativo a la obtención de datos almacenados en situaciones de emergencia, permite obtener dichos datos:","o":["Únicamente mediante el procedimiento ordinario de asistencia judicial mutua (MLA)","A través de la red 24/7 y sin tramitar MLA","Solo respecto de datos de contenido","Exclusivamente con autorización previa de la Comisión Europea"],"a":1,"e":"En los apuntes: 9 SPA — Obtención de datos almacenados en situaciones de emergencia Objetivo: obtención en emergencia de todo tipo de datos a través de la red 24/7 y sin tramitar MLA (Mutual Legal Assistance).","u":1},{"n":1044,"m":4,"q":"Las causas de oposición a la entrega de información en el marco del art. 7 del Segundo Protocolo Adicional se regulan en los artículos:","o":["16 y 17 de la Convención de Budapest","25.4 y 27.4 de la Convención de Budapest","6 y 7 del propio Segundo Protocolo Adicional","29 y 30 de la Convención de Budapest"],"a":1,"e":"En los apuntes: Causas de oposición a la entrega: artículos 25.4 y 27.4 de la Convención de Budapest.","u":1},{"n":1045,"m":4,"q":"A diferencia del Reglamento (UE) 2023/1543, el mecanismo de cooperación directa con el sector privado del Segundo Protocolo Adicional se limita a:","o":["Datos de tráfico y de contenido","Conservación de datos y entrega de información sobre dominios y datos de abonado, con carácter facultativo","Exclusivamente datos de contenido en investigaciones de terrorismo","Datos biométricos de los usuarios"],"a":0,"e":"En los apuntes: Para EXAMEN/DESARROLLO: la diferencia clave entre ambos marcos es de alcance. El Reglamento (UE) 2023/1543 (e-evidence) permite, mediante orden europea de producción, obtener también datos de tráfico y de contenido (aunque restringido a delitos determinados), mientras que el Segundo Protocolo Adicional de Budapest, en","u":1},{"n":1046,"m":5,"q":"Según el material de estudio, la ciberdelincuencia contemporánea se caracteriza fundamentalmente por:","o":["Actuación predominante de hackers individuales aislados","Una elevada especialización funcional dentro de ecosistemas criminales","La ausencia de cooperación entre actores criminales","Su carácter exclusivamente ideológico"],"a":1,"e":"En los apuntes: La ciberdelincuencia contemporánea se caracteriza por una elevada especialización funcional: la mayoría de los ataques relevantes no son ejecutados por individuos aislados, sino por ecosistemas criminales formados por múltiples actores que cooperan entre sí, cada uno desempeñando una función específica dentro de una ca","u":1},{"n":1047,"m":5,"q":"¿Cuáles son los cuatro criterios fundamentales para clasificar a los actores de la ciberdelincuencia?","o":["Edad, nacionalidad, idioma y formación académica","Motivación, capacidad técnica, nivel de organización y relación con el Estado","Tipo de malware, sistema operativo, navegador y proveedor de internet","Sector económico, tamaño de la víctima, país y moneda de pago"],"a":1,"e":"En los apuntes: Los actores se clasifican según motivación, capacidad, organización y relación con el Estado. Las APT representan el nivel más elevado de sofisticación.","u":1},{"n":1048,"m":5,"q":"La cadena de valor del cibercrimen se estructura, según el material de estudio, en las siguientes cuatro fases:","o":["Planificación, ejecución, evaluación y archivo","Acceso, explotación, monetización y blanqueo","Detección, atribución, sanción y reparación","Reclutamiento, formación, despliegue y retirada"],"a":1,"e":"En los apuntes: Para EXAMEN: esta secuencia de cuatro fases (Acceso → Explotación → Monetización → Blanqueo) estructura todo el Bloque 2 y es la columna vertebral del tema de la cadena de valor;","u":1},{"n":1049,"m":5,"q":"Según el material de estudio, ¿qué porcentaje de los incidentes de seguridad implica un actor interno (insider), conforme al informe Verizon DBIR citado?","o":["5%","15%","34%","60%"],"a":2,"e":"En los apuntes: Dato estadístico clave (refuerzo, fuente Verizon DBIR): el 34% de los incidentes de seguridad implica un actor interno.","u":1},{"n":1050,"m":5,"q":"El concepto de «zona gris» en el hacktivismo hace referencia a:","o":["Grupos aparentemente independientes que desarrollan actividades alineadas con intereses estatales sin vinculación oficial reconocida","Actores que únicamente atacan infraestructuras de su propio país","Una categoría exclusiva de delitos sexuales en línea","Un mecanismo de cifrado utilizado por organizaciones terroristas"],"a":0,"e":"En los apuntes: Aunque inicialmente se asociaba a movimientos sociales descentralizados, durante los últimos años ha adquirido especial relevancia el concepto de zona gris: describe escenarios en los que grupos aparentemente independientes desarrollan actividades alineadas con los intereses de determinados Estados sin que exista una v","u":1},{"n":1051,"m":5,"q":"El framework que resulta fundamental para estandarizar la descripción de tácticas, técnicas y procedimientos (TTPs) en los procesos de atribución técnica es:","o":["MITRE ATT&CK","ISO 27001","NIST FIPS 203","OWASP Top 10"],"a":0,"e":"En los apuntes: El framework MITRE ATT&CK es fundamental para estandarizar la descripción de TTPs, permitiendo a los analistas correlacionar IoCs con acciones específicas de los atacantes y, eventualmente, atribuir el ataque a un actor conocido.","u":1},{"n":1052,"m":5,"q":"El Centro Europeo de Ciberdelincuencia (EC3), dependiente de Europol, tiene su sede en:","o":["Lyon","Bruselas","La Haya","Washington"],"a":2,"e":"En los apuntes: Europol: a través del Centro Europeo de Ciberdelincuencia (EC3), con sede en La Haya, facilita coordinación operativa, intercambio de inteligencia, apoyo técnico y operaciones conjuntas.","u":1},{"n":1053,"m":5,"q":"La Operación EASTWOOD (julio de 2025) tuvo como objetivo desmantelar la infraestructura del grupo:","o":["LockBit","Conti","NoName057(16)","DarkSide"],"a":2,"e":"En los apuntes: La Operación Eastwood fue una operación internacional contra la red de ciberdelincuencia prorrusa NoName057(16), coordinada por Europol y Eurojust entre el 14 y el 17 de julio de 2025. Su objetivo fue desmantelar la infraestructura utilizada para lanzar ataques de denegación de servicio (DDoS) contra países e instituci","u":1},{"n":1054,"m":5,"q":"¿Cuántos países coordinaron, como mínimo, sus fuerzas policiales y judiciales en la Operación EASTWOOD?","o":["5","8","12","20"],"a":2,"e":"En los apuntes: La operación implicó una coordinación simultánea de fuerzas policiales y judiciales de al menos 12 países, entre ellos España, Alemania, Francia, Italia, Polonia, Suecia, Suiza, Países Bajos, Finlandia, Lituania, República Checa y Estados Unidos.","u":1},{"n":1055,"m":5,"q":"El ataque de ransomware DarkSide contra Colonial Pipeline en 2021 se considera relevante porque:","o":["Fue el primer ataque de phishing documentado","Constituyó el primer caso de impacto de un ciberataque en la seguridad nacional de un país, con un rescate de 4,4 millones de dólares","No tuvo ningún impacto económico","Fue atribuido a un actor estatal chino"],"a":1,"e":"En los apuntes: Para EXAMEN: memorizar el emparejamiento caso-año-dato: SolarWinds (2020, APT29, supply-chain), Colonial Pipeline (2021, DarkSide, rescate 4,4M$), Costa Rica/Conti (2022, primer estado de emergencia nacional por ciberataque), Operación Cronos (2023-24, contra LockBit, 200+ servidores recuperados), Operación Eastwood (j","u":1},{"n":1056,"m":5,"q":"Respecto al impacto de la inteligencia artificial en la evolución de las amenazas, el material de estudio sostiene que:","o":["La IA ha creado categorías completamente nuevas de actores criminales","El principal efecto de la IA consiste en aumentar las capacidades de actores ya existentes","La IA ha eliminado por completo el phishing como técnica de ataque","La IA solo afecta a las APT, no a otros actores"],"a":1,"e":"En los apuntes: La inteligencia artificial constituye uno de los factores con mayor capacidad de transformación dentro del panorama actual. Sin embargo, resulta importante comprender que la IA no ha creado nuevos actores: su principal efecto consiste en aumentar las capacidades de actores ya existentes.","u":1},{"n":1057,"m":6,"q":"¿A qué se refiere el concepto de “superficie de ataque”?","o":["Al número de empleados de una organización","Al conjunto de puntos por los que un atacante podría intentar acceder a un sistema","A la velocidad de conexión a internet","Al presupuesto anual de ciberseguridad"],"a":1,"e":"En los apuntes: Superficie de ataque: conjunto de puntos (dispositivos, aplicaciones, cuentas, servicios) por los que un atacante podría intentar acceder a un sistema."},{"n":1058,"m":6,"q":"¿Qué caracteriza a una vulnerabilidad “Zero Day”?","o":["Es conocida por el fabricante desde hace años","Es un fallo de seguridad desconocido por el fabricante y sin parche disponible en el momento de su descubrimiento o explotación","Solo afecta a sistemas obsoletos sin conexión a internet","Es sinónimo de “malware polimórfico”"],"a":1,"e":"En los apuntes: Vulnerabilidad “Zero Day”: fallo de seguridad desconocido por el fabricante y sin parche disponible en el momento en que se descubre o explota."},{"n":1059,"m":6,"q":"¿Qué principio resume el modelo de seguridad Zero Trust?","o":["Confiar por defecto en cualquier dispositivo dentro de la red corporativa","“Nunca confíes, verifica siempre”, sin confianza implícita por ubicación de red","Eliminar la autenticación multifactor para agilizar el acceso","Permitir el acceso libre desde cualquier dispositivo personal"],"a":1,"e":"En los apuntes: Zero Trust: modelo de seguridad que parte de la premisa “nunca confíes, verifica siempre”: ningún usuario o dispositivo se considera de confianza por defecto, dentro o fuera de la red corporativa."},{"n":1060,"m":6,"q":"¿Qué es el “Shadow IT”?","o":["El departamento de TI encargado de la ciberseguridad","El uso de aplicaciones o dispositivos dentro de una organización sin conocimiento ni control del departamento de TI","Un tipo de ataque DDoS","Una técnica de cifrado avanzado"],"a":1,"e":"En los apuntes: Shadow IT: uso de aplicaciones, dispositivos o servicios tecnológicos dentro de una organización sin conocimiento ni control del departamento de TI, lo que genera riesgos no gestionados."},{"n":1061,"m":6,"q":"¿Qué describe mejor el “cambio de paradigma” en el cibercrimen actual?","o":["Una reducción del número de ataques a nivel mundial","La evolución de hackers aislados hacia estructuras tipo multinacional, especializadas y con modelos Crime-as-a-Service","La desaparición de la ingeniería social como técnica de ataque","La vuelta a modelos de seguridad perimetral cerrada"],"a":1,"e":"En los apuntes: Nuevo modelo de cibercrimen: el cibercrimen ha evolucionado de actores individuales (hackers aislados) a auténticas estructuras de tipo multinacional, con especialización de roles (desarrolladores de malware, operadores, blanqueadores de capital, “mulas”) y una creciente democratización del cibercrimen a través del mod"},{"n":1062,"m":6,"q":"¿Qué factor explica la “asimetría en la defensa” frente a ataques automatizados?","o":["El atacante debe acertar siempre, mientras el defensor solo una vez","El defensor debe acertar siempre, mientras el atacante solo necesita acertar una vez","Ambos necesitan el mismo nivel de esfuerzo","La defensa siempre dispone de más recursos que el ataque"],"a":1,"e":"En los apuntes: Automatización e hipervelocidad: los ataques se producen hoy de forma masiva y automatizada, generando una asimetría en la defensa (el atacante solo necesita acertar una vez; el defensor debe acertar siempre)."},{"n":1063,"m":6,"q":"¿Qué elementos conviene revisar para detectar un correo de phishing, según el tema?","o":["Únicamente el tamaño del archivo adjunto","El dominio del remitente, la cabecera técnica, el asunto, el saludo y el lenguaje empleado","El color del logotipo de la empresa suplantada","La hora exacta de envío del correo"],"a":1,"e":"En los apuntes: Phishing: correo electrónico fraudulento que suplanta a una entidad legítima para obtener datos o instalar malware. sus señales de alarma típicas incluyen el dominio del remitente, la cabecera técnica del correo, el asunto, el saludo genérico y el lenguaje (errores, urgencia)."},{"n":1064,"m":6,"q":"¿Qué es el “smishing”?","o":["Phishing realizado mediante llamadas de voz","Phishing realizado mediante mensajes SMS, frecuente en campañas de temporada","Phishing mediante códigos QR","Un tipo de ataque DDoS volumétrico"],"a":1,"e":"En los apuntes: Smishing: variante mediante SMS, muy asociada a campañas de temporada (p."},{"n":1065,"m":6,"q":"¿En qué consiste el “SIM swapping”?","o":["El robo físico del teléfono móvil de la víctima","El duplicado fraudulento de la tarjeta SIM de la víctima para interceptar SMS y códigos de verificación","La suplantación de una dirección IP","Un tipo de ransomware que cifra el almacenamiento del móvil"],"a":1,"e":"En los apuntes: Otras formas de suplantación de identidad relevantes son el SIM swapping (duplicado fraudulento de la tarjeta SIM de la víctima para interceptar SMS y códigos de verificación), el spoofing (suplantación tecnológica de identidad: de dirección IP, de remitente de correo, de número de teléfono, etc.), el session hijacking"},{"n":1066,"m":6,"q":"¿Qué caracteriza al modelo de “triple extorsión” en el ransomware actual?","o":["Bloqueo, cifrado y exfiltración de datos","Bloqueo, phishing y vishing","Cifrado, spoofing y tabnabbing","Exfiltración, DDoS y smishing"],"a":0,"e":"En los apuntes: Exfiltración y cifrado de los datos, seguidos de la extorsión a la víctima. Medidas preventivas frente al ransomware"},{"n":1067,"m":6,"q":"Según los datos recogidos en el tema, ¿qué posición ocupa España en el ranking mundial de países más afectados por ransomware?","o":["Primer país más afectado","Sexto país más afectado, con un crecimiento mundial del ransomware del 51,5%","No aparece entre los diez primeros países","Segundo país más afectado"],"a":1,"e":"En los apuntes: Datos relevantes: el ransomware ha crecido un 51,5% a nivel mundial, situando a España como el sexto país más afectado;"},{"n":1068,"m":6,"q":"¿Cuál es el orden correcto de las fases típicas de un ataque de ransomware?","o":["Exfiltración y cifrado; infección; movimiento lateral; extorsión","Infección y acceso inicial; ejecución y establecimiento; movimiento lateral y reconocimiento; exfiltración y cifrado","Extorsión; infección; reconocimiento; cifrado","Cifrado; infección; extorsión; reconocimiento"],"a":1,"e":"En los apuntes: Ejecución y establecimiento (persistencia en el sistema comprometido). Movimiento lateral y reconocimiento (exploración de la red para ampliar el alcance)."},{"n":1069,"m":6,"q":"¿Qué distingue al fraude BEC (Business Email Compromise)?","o":["Requiere siempre acceso real a los sistemas informáticos de la víctima","Suplanta la identidad corporativa (mediante phishing o spoofing) para cometer estafas financieras sin necesidad de acceso real a los sistemas","Es una técnica exclusiva de ataques DDoS","Solo afecta a cuentas personales, nunca corporativas"],"a":1,"e":"En los apuntes: Entre las modalidades destacan el fraude al CEO, el ataque man-in-the-middle (interceptación de las comunicaciones entre dos partes) y, como “tres pilares” del fraude digital actual: BEC (Business Email Compromise): suplantación de la identidad corporativa (mediante phishing o spoofing) para cometer estafas financieras"},{"n":1070,"m":6,"q":"¿Qué elementos caracterizan un ataque de tipo ATO/EAC (Account Take Over / Email Account Compromise)?","o":["Acceso a la cuenta, observación, reglas de bandeja de entrada y persistencia","Cifrado masivo de archivos y petición de rescate","Envío de tráfico volumétrico para saturar un servidor","Duplicado de la tarjeta SIM de la víctima"],"a":0,"e":"En los apuntes: ATO / EAC (Account Take Over / Email Account Compromise): toma de control efectiva de una cuenta de correo o de un servicio, mediante acceso a la cuenta, observación del comportamiento habitual de la víctima, creación de reglas de bandeja de entrada (para ocultar avisos) y persistencia en el acceso."},{"n":1071,"m":6,"q":"¿Cuáles son los cuatro ejes de la Estrategia Europea contra el fraude online?","o":["Prevención, colaboración, investigación y persecución, e innovación","Cifrado, anonimato, evasión y persistencia","Phishing, smishing, vishing y quishing","Zero Trust, MFA, VPN y firewall"],"a":0,"e":"En los apuntes: La Estrategia Europea contra el fraude online se articula en cuatro ejes: prevención (promoción de la concienciación pública sobre las amenazas online), colaboración (cooperación entre agencias de la UE, empresas y usuarios), investigación y persecución (fortalecimiento de la investigación y el enjuiciamiento de los de"},{"n":1072,"m":6,"q":"¿Qué protocolos de autenticación de correo ayudan a dificultar la suplantación del dominio remitente?","o":["HTTP, FTP y SSH","SPF, DKIM y DMARC","TCP, UDP e ICMP","RSA, AES y SHA-256"],"a":1,"e":"En los apuntes: Protocolos de autenticación de correo: SPF, DKIM y DMARC, que dificultan la suplantación del dominio remitente."},{"n":1073,"m":6,"q":"¿En qué consiste un ataque DDoS (denegación de servicio distribuida)?","o":["El robo silencioso de credenciales sin afectar a la disponibilidad del servicio","La saturación de un sistema mediante un volumen masivo de tráfico falso, generado habitualmente por una botnet, para afectar a su disponibilidad","El cifrado de archivos a cambio de un rescate","La suplantación de la identidad de un directivo mediante correo electrónico"],"a":1,"e":"En los apuntes: Un ataque de denegación de servicio (DoS) o denegación de servicio distribuida (DDoS) busca saturar un sistema o servicio mediante malware y un volumen masivo de tráfico falso, atacando así la disponibilidad del servicio, habitualmente mediante el uso de una botnet."},{"n":1074,"m":6,"q":"¿Cómo afecta la inteligencia artificial al phishing, según el tema?","o":["Lo hace desaparecer al detectarlo automáticamente","Da lugar al “speed spear phishing”: campañas hiperpersonalizadas, generadas con PLN, scraping automatizado y contenido sintético (deepfakes)","Reduce el volumen de correos de phishing enviados diariamente","Solo afecta a los ataques DDoS, no al phishing"],"a":1,"e":"En los apuntes: IA + Phishing = Speed Spear Phishing La combinación de IA y phishing da lugar a campañas de “spear phishing” (phishing dirigido) hiperpersonalizadas y generadas a gran velocidad, apoyadas en:"},{"n":1075,"m":6,"q":"¿Qué efecto tiene la IA sobre los ataques DDoS?","o":["Los hace más predecibles y fáciles de detectar","Los hace más adaptables (tiempo real), capaces de mimetizarse con tráfico legítimo y de realizar ataques “low and slow”","Elimina por completo la necesidad de botnets","Solo afecta a la fase de reconocimiento del ataque"],"a":1,"e":"En los apuntes: Mimetización con el tráfico legítimo, dificultando su detección. Ataques “low and slow” (de bajo volumen y larga duración), en lugar de picos fácilmente detectables."},{"n":1076,"m":6,"q":"¿Qué es un TEE (Trusted Execution Environment) como medida de defensa?","o":["Un tipo de ataque de ingeniería social","Un entorno de ejecución confiable que aísla datos y código en un enclave seguro del procesador (computación confidencial)","Un protocolo de autenticación de correo electrónico","Una técnica de ataque DDoS de nueva generación"],"a":1,"e":"En los apuntes: TEE (Trusted Execution Environment): entorno de ejecución confiable que proporciona computación confidencial mediante un enclave seguro dentro del propio procesador, en el que los datos y el código se procesan de forma aislada y protegida incluso frente al propio sistema operativo, reduciendo la superficie de ataque so"},{"n":1077,"m":7,"q":"¿Qué distingue, según el tema, la “indemnidad sexual” de la “libertad sexual” del menor?","o":["Son sinónimos exactos sin ninguna diferencia","La indemnidad sexual es el derecho del menor a un desarrollo sexual libre de interferencias, instrumentalizaciones o experiencias prematuras","La indemnidad sexual solo se aplica a mayores de edad","La libertad sexual es un concepto exclusivamente civil, no penal"],"a":1,"e":"En los apuntes: libertad sexual: el sistema penal protege no solo la libertad sexual del menor, sino especialmente su indemnidad sexual, entendida como el derecho a un desarrollo sexual libre de interferencias, instrumentalizaciones o experiencias prematuras. El legislador distingue nítidamente los delitos de agresión sexual (acto sex"},{"n":1078,"m":7,"q":"¿Qué cambio introdujo la Ley Orgánica 10/2022 en el sistema de delitos sexuales contra menores?","o":["Redujo la edad de consentimiento sexual a 14 años","Abandonó la distinción entre abuso sexual y agresión sexual, configurando un modelo unitario con agravación progresiva","Eliminó el delito de grooming del Código Penal","Derogó los artículos 188 y 189 CP"],"a":1,"e":"En los apuntes: Posteriormente, la Ley Orgánica 10/2022 abandona la tradicional distinción entre abuso sexual y agresión sexual, configurando un modelo unitario centrado en la existencia de un acto de contenido sexual no consentido jurídicamente cuando la víctima es menor de 16 años, con un sistema de agravación progresiva según la in"},{"n":1079,"m":7,"q":"¿Qué elevó a los dieciséis años la Ley Orgánica 1/2015?","o":["La mayoría de edad penal","La edad de consentimiento sexual","La edad mínima para el uso de redes sociales","La edad de imputabilidad penal"],"a":1,"e":"En los apuntes: En España, la Ley Orgánica 1/2015, de 30 de marzo, elevó la edad de consentimiento sexual a los dieciséis años, tipificó el delito de provocación sexual y el child-grooming, y estableció mecanismos para la retirada de contenidos de pornografía infantil de la Red."},{"n":1080,"m":7,"q":"Según el art. 189.1 CP, ¿cuál de las siguientes NO es una de las categorías que definen el MASI/CSAM?","o":["Material que represente de manera visual a un menor en una conducta sexualmente explícita, real o simulada","Representación de los órganos sexuales de un menor con fines principalmente sexuales","Imágenes realistas de un menor en conducta sexualmente explícita, con fines principalmente sexuales","Cualquier fotografía de un menor, con independencia de su contenido o finalidad"],"a":3,"e":"En los apuntes: basta con que el material reproduzca o simule situaciones sexualmente explícitas con apariencia inequívoca de menor edad. Elemento decisivo: la finalidad sexual explícita del material, lo que permite diferenciar contenido artístico, educativo o científico de aquel con finalidad sexualizadora."},{"n":1081,"m":7,"q":"Según los criterios de la Fiscalía General del Estado, ¿qué elemento resulta decisivo para calificar un material como pornografía infantil?","o":["Que exista siempre un menor real plenamente identificado","La finalidad sexual explícita del material, más allá de la mera existencia de contenido sexual","El formato técnico del archivo (imagen o vídeo)","El número de personas que hayan tenido acceso al archivo"],"a":1,"e":"En los apuntes: Elemento decisivo: la finalidad sexual explícita del material, lo que permite diferenciar contenido artístico, educativo o científico de aquel con finalidad sexualizadora."},{"n":1082,"m":7,"q":"Respecto al material generado mediante IA, ¿en qué supuesto es más claro el encaje típico en el art. 189 CP?","o":["Cuando se generan imágenes de menores completamente inexistentes","Cuando se trata de un “deepfake” sexual de un menor real e identificable","Cuando el material se genera exclusivamente con fines artísticos declarados","Nunca existe encaje típico si el material ha sido generado por IA"],"a":1,"e":"En los apuntes: 189 CP resulta más problemático cuando no existe menor real ni persona identificable, aunque puede tener relevancia penal si la norma extiende expresamente el concepto a representaciones artificiales; desde la política criminal, se considera que contribuye a la normalización de la explotación sexual infantil."},{"n":1083,"m":7,"q":"¿Cuál es el tipo básico de agresión sexual a menores de 16 años (art. 181.1 CP)?","o":["Únicamente los actos sexuales con penetración","La realización de actos de carácter sexual con un menor de 16 años, con independencia de que medie o no consentimiento","Solo las conductas realizadas mediante violencia o intimidación","Exclusivamente la corrupción de menores"],"a":1,"e":"En los apuntes: Agresión sexual a menores de 16 años (arts. 181.1 CP) consiste en la realización de actos de carácter sexual con un menor de 16 años, con independencia de que medie o no consentimiento (jurídicamente irrelevante por razón de la edad)."},{"n":1084,"m":7,"q":"¿Qué modalidad se equipara jurídicamente a la penetración en el art. 181.3 CP?","o":["Los tocamientos sin contacto corporal directo","La introducción de objetos","Las conversaciones sexualmente explícitas sin contacto físico","La mera exhibición obscena"],"a":1,"e":"En los apuntes: introducción de objetos (equiparada jurídicamente a la penetración)."},{"n":1085,"m":7,"q":"¿Cuál de las siguientes NO es una agravante específica del art. 189.2 CP?","o":["Utilización de menores de dieciséis años","Pertenencia a una organización dedicada a tales actividades","Que el material haya sido descargado más de diez veces","Que el responsable sea ascendiente, tutor o persona encargada del menor"],"a":2,"e":"En los apuntes: 189 CP es directo, aunque el contenido no se haya producido mediante contacto físico. c) Hibridación (cuerpo sintético + rostro real, o manipulación parcial de imágenes preexistentes): el elemento decisivo es la identificabilidad del menor y la aptitud del material para sexualizarlo de forma reconocible."},{"n":1086,"m":7,"q":"¿Qué novedad legislativa introduce el art. 189 bis CP?","o":["Tipifica la distribución o difusión pública de contenidos destinados a promover, fomentar o incitar a los delitos de explotación sexual y pornografía de menores","Elimina la posibilidad de bloquear contenidos alojados en el extranjero","Deroga el delito de child-grooming","Reduce la pena de los delitos de pornografía infantil"],"a":0,"e":"En los apuntes: 189 bis CP) — novedad legislativa El artículo 189 bis CP tipifica la distribución o difusión pública, a través de internet, teléfono o cualquier otra TIC, de contenidos destinados a promover, fomentar o incitar a los delitos de prostitución, explotación sexual y pornografía de menores, así como a las agresiones a menor"},{"n":1087,"m":7,"q":"¿Qué dos modalidades de conducta tipifica el art. 183 CP (child-grooming)?","o":["Proponer concertar un encuentro con finalidad sexual con un menor de 16 años, y embaucarle para que facilite material pornográfico o MASI","Difundir contenidos promotores y poseer MASI","Captar menores para prostitución y agredirlos sexualmente","Producir y distribuir pornografía infantil"],"a":0,"e":"En los apuntes: El artículo 183 CP tipifica el child-grooming, regulando dos modalidades de contacto con menores de dieciséis años a través de las TIC, internet o el teléfono: Proponer concertar un encuentro con un menor con la finalidad de cometer los delitos de los arts."},{"n":1088,"m":7,"q":"En un supuesto de grooming en el que el autor busca obtener una relación sexual mediante el ofrecimiento de dinero, ¿cómo se resuelve el concurso entre el art. 183 y el art. 188.4 CP, según la STS 97/2015?","o":["Concurso real, sancionando ambos delitos de forma acumulada","Concurso de normas (art. 8.4 CP) a favor del art. 188.4 CP (inducción a la prostitución)","Se aplica siempre el art. 183 CP en exclusiva","Ninguno de los dos tipos resulta aplicable"],"a":1,"e":"En los apuntes: 8.4 CP, principio de alternatividad) a favor del art. 188.4 CP —inducción a la prostitución— (STS 97/2015, de 24 de febrero)."},{"n":1089,"m":7,"q":"Cuando la finalidad acreditada del acercamiento es obtener MASI (no una relación sexual) a cambio de dinero, ¿qué precepto resulta aplicable según el tema?","o":["El art. 188.4 CP en exclusiva","El art. 183 CP (child-grooming), ya que el art. 188.4 CP exige la propuesta específica de una relación sexual","Ningún precepto resulta de aplicación","El art. 189 bis CP en exclusiva"],"a":1,"e":"En los apuntes: 188.4 CP exige la propuesta específica de una recompensa para obtener una relación sexual, mientras que el art. 183.2 CP está previsto para el acercamiento dirigido a obtener este tipo de material;"},{"n":1090,"m":7,"q":"¿Qué tipo de concurso aprecia la jurisprudencia, con carácter general, entre la explotación prostitucional de un menor y la agresión sexual directa cometida por el mismo autor?","o":["Concurso de normas a favor del delito más leve","Concurso de delitos (habitualmente concurso ideal), al lesionarse bienes jurídicos diferenciados","Absorción automática del delito de agresión sexual","Atipicidad de la agresión sexual"],"a":1,"e":"En los apuntes: ej., quien capta a una menor para la prostitución y, aprovechando su vulnerabilidad, mantiene después relaciones sexuales con ella), no existe una mera progresión delictiva, sino una lesión diferenciada de bienes jurídicos: la promoción o favorecimiento de la prostitución protege la indemnidad sexual frente a la explot"},{"n":1091,"m":7,"q":"¿Qué organismo internacional constituye la entidad de referencia mundial en la recepción de informes sobre MASI?","o":["La OMS (Organización Mundial de la Salud)","El NCMEC (National Center for Missing and Exploited Children)","La OCDE","El Banco Mundial"],"a":1,"e":"En los apuntes: NCMEC (National Center for Missing and Exploited Children, EE.UU.): entidad referente mundial en la recepción de informes sobre MASI;"},{"n":1092,"m":7,"q":"¿Qué se entiende por “investigación proactiva” en este ámbito?","o":["La actuación policial limitada exclusivamente a la denuncia previa de la víctima","La capacidad de la institución policial de captar información suficiente para acreditar la comisión de estos delitos, sin depender exclusivamente de la denuncia","Un procedimiento judicial posterior a la sentencia firme","Una técnica exclusiva de cooperación internacional"],"a":1,"e":"En los apuntes: La Policía Nacional apuesta por la proactividad frente a estos delitos, entendida como la capacidad de la institución de captar información suficiente para acreditar la comisión de este tipo de delitos, sin depender exclusivamente de la denuncia previa. La proactividad y la reactividad policial se complementan como est"},{"n":1093,"m":7,"q":"¿Cuáles son, según el tema, las principales dificultades investigadoras de las modalidades comisivas mediante streaming o videollamadas?","o":["La abundancia de soporte físico permanente y la ausencia de cifrado","La volatilidad de la evidencia digital, la ausencia de soporte físico permanente, la concurrencia de múltiples jurisdicciones y el uso de servicios cifrados","La imposibilidad total de identificar a la víctima en cualquier caso","La inexistencia de normativa aplicable a estos supuestos"],"a":1,"e":"En los apuntes: Volatilidad de la evidencia digital. Ausencia de soporte físico permanente."},{"n":1094,"m":7,"q":"Según la Directiva 2011/93/UE, ¿qué obligación tienen los Estados miembros respecto a las páginas web con pornografía infantil alojadas en su territorio?","o":["Ninguna obligación específica","Garantizar la rápida retirada de dichas páginas, y procurar la retirada de las alojadas fuera de su territorio","Bloquear únicamente el acceso sin intentar la retirada","Delegar la responsabilidad exclusivamente en la ICANN"],"a":1,"e":"En los apuntes: Directiva 2011/93/UE, de 13 de diciembre de 2011: su art. 25 obliga a los Estados miembros a garantizar la rápida retirada de páginas web con pornografía infantil alojadas en su territorio, y a procurar la retirada de las alojadas fuera;"},{"n":1095,"m":7,"q":"¿Qué diferencia principal existe entre la “retirada” y el “bloqueo” de contenidos ilícitos?","o":["Son términos equivalentes sin diferencia práctica","La retirada elimina el contenido de la red; el bloqueo solo impide el acceso desde España al dominio, sin eliminar el contenido, que sigue disponible desde otros países","El bloqueo es siempre más eficaz que la retirada","La retirada solo puede solicitarla un particular, nunca la autoridad judicial"],"a":1,"e":"En los apuntes: bloquea el acceso al dominio desde España (no la dirección IP), sin eliminar el contenido, que sigue disponible desde otros países;"},{"n":1096,"m":7,"q":"¿Qué entidad gestiona en España el dominio de nivel superior geográfico “.es”?","o":["La ICANN directamente","Red.es, como Registry o NIC del ccTLD .es","GoDaddy, como registrador exclusivo","El NCMEC"],"a":1,"e":"En los apuntes: ccTLD (Country Code Top Level Domain): dominios geográficos de dos caracteres correspondientes a un país (.es, .uk, .fr), conforme al estándar ISO 3166-1. sTLD (Sponsored Top Level Domain): dominios de nivel superior patrocinado, propuestos por agencias o fundaciones independientes."},{"n":1097,"m":8,"q":"Según la tesis del nexo de UNODC (2025), la corrupción y la ciberdelincuencia son amenazas que:","o":["Actúan de forma totalmente independiente.","Son mutuamente reforzantes para la gobernanza y las instituciones.","Solo se relacionan en países en desarrollo.","Han sido erradicadas por la UNCC."],"a":1,"e":"En los apuntes: 1.1 La tesis del nexo (UNODC) Definición: la corrupción y la ciberdelincuencia son amenazas mutuamente reforzantes para la gobernanza y las instituciones.","u":1},{"n":1098,"m":8,"q":"El informe de UNODC sobre el nexo (2025) se publicó coincidiendo con:","o":["La disolución de la UNTOC.","La apertura a firma de la UNCC y el 20.º aniversario de la UNCAC.","La creación de INTERPOL.","El primer caso de pig butchering documentado."],"a":1,"e":"En los apuntes: Contexto: informe “Sobre el Nexo” (UNODC, 2025), publicado junto a la apertura a firma de la UNCC y el 20.º aniversario de la UNCAC.","u":1},{"n":1099,"m":8,"q":"Un delito “ciberdependiente” (basado en la cibernética) se caracteriza porque:","o":["Es facilitado por la tecnología pero podría cometerse sin ella.","Solo puede cometerse con TIC; el sistema es a la vez instrumento y objetivo.","Se refiere exclusivamente a delitos contra la propiedad intelectual.","No requiere ningún sistema informático."],"a":1,"e":"En los apuntes: Ciberdependiente (basado en la cibernética): solo puede cometerse con TIC; el sistema es a la vez instrumento y objetivo (acceso ilícito, malware).","u":1},{"n":1100,"m":8,"q":"Un delito “ciberhabilitado” (facilitado por la cibernética) es:","o":["Un delito que solo existe en el ciberespacio.","Un delito tradicional en el que las TIC son clave en el modus operandi (fraude, estafas, blanqueo).","Sinónimo de ciberdependiente.","Exclusivo de organizaciones estatales."],"a":1,"e":"En los apuntes: Ciberhabilitado (facilitado por la cibernética): delito tradicional en el que las TIC son clave en el modus operandi (fraude, estafas, blanqueo).","u":1},{"n":1101,"m":8,"q":"Según el tema, el principal límite operativo en la lucha contra el cibercrimen es que:","o":["No existen convenciones internacionales aplicables.","La respuesta se detiene en el escalón más bajo, fácilmente reemplazable, siendo decisivo el componente internacional.","Las fuerzas policiales carecen de presupuesto.","Los delitos cibernéticos no son perseguibles penalmente."],"a":1,"e":"En los apuntes: Límite operativo: se detiene al escalón más bajo, fácilmente reemplazable; el componente internacional es decisivo.","u":1},{"n":1102,"m":8,"q":"En el caso práctico “The Beekeeper” expuesto en el tema, la estructura del fraude se caracteriza por:","o":["Ser un timador aislado sin conexión con el poder.","Una operación industrial con conexiones a inteligencia y poder político.","Afectar exclusivamente a empresas multinacionales.","No usar ninguna técnica de phishing."],"a":1,"e":"En los apuntes: Estructura: no es un timador aislado, sino una operación industrial. Nexo: conexiones con inteligencia y poder político;","u":1},{"n":1103,"m":8,"q":"La Convención de Palermo (UNTOC, 2000) obliga a los Estados a tipificar, entre otras conductas:","o":["Únicamente el tráfico de migrantes.","La participación en grupo organizado, el blanqueo, la corrupción y la obstrucción a la justicia.","Solo delitos informáticos.","Exclusivamente el soborno a funcionarios extranjeros."],"a":1,"e":"En los apuntes: UNTOC (2000) – Convención de Palermo: crimen organizado transnacional; obliga a tipificar participación en grupo, blanqueo, corrupción y obstrucción.","u":1},{"n":1104,"m":8,"q":"Entre las medidas procesales que incorpora la UNCC (2024) se encuentra:","o":["La abolición de la supervisión judicial en investigaciones digitales.","La conservación acelerada de datos almacenados para evitar su borrado o alteración.","La prohibición total de la interceptación de comunicaciones.","La eliminación de las órdenes de producción de datos."],"a":1,"e":"En los apuntes: 2.4 UNCC: medidas procesales Conservación acelerada: de datos almacenados (evita su borrado o alteración).","u":1},{"n":1105,"m":8,"q":"El término “pig butchering” se refiere a:","o":["Un tipo de ransomware que cifra archivos agrícolas.","Una estafa de inversión en criptomonedas, a veces bajo apariencia de relación sentimental.","Un protocolo de blanqueo de capitales en casinos.","Una técnica de phishing dirigida a directivos."],"a":1,"e":"En los apuntes: Pig butchering: estafa de inversión en cripto, a veces bajo apariencia de relación sentimental.","u":1},{"n":1106,"m":8,"q":"El blanqueo de capitales se estructura clásicamente en tres fases:","o":["Captación, explotación e impunidad.","Colocación, dispersión e integración.","Phishing, malware y exfiltración.","Reclutamiento, transporte y entrega."],"a":1,"e":"En los apuntes: Tres fases: colocación (introducción en el sistema), dispersión (alejamiento del origen) e integración (reincorporación como activo lícito).","u":1},{"n":1107,"m":8,"q":"Los “scam centres” (centros de estafa) descritos en el tema se originan principalmente en:","o":["Europa del Este.","El Sudeste Asiático (Camboya, Laos, Myanmar, Filipinas).","América Latina.","Oriente Medio."],"a":1,"e":"En los apuntes: Localización: origen en el Sudeste Asiático (Camboya, Laos, Myanmar, Filipinas);","u":1},{"n":1108,"m":8,"q":"En el caso real de KK Park (Myanmar), las víctimas captadas para trabajar en el centro de estafa son:","o":["Voluntarios remunerados que pueden abandonar el centro libremente.","Reclutadas mediante falsas ofertas de empleo y sometidas a reclusión y vigilancia armada.","Exclusivamente ciudadanos de Myanmar.","Empleados de empresas tecnológicas legítimas."],"a":1,"e":"En los apuntes: Captación: falsas ofertas de empleo atraen a las víctimas a los complejos. Explotación: reclusión y vigilancia armada;","u":1},{"n":1109,"m":8,"q":"Según los datos del tema sobre KK Park, la redada de octubre de 2025 resultó en:","o":["La detención de 50 personas y ningún equipo confiscado.","2.198 detenidos y 30 terminales Starlink confiscados.","El cierre definitivo de todos los centros de estafa de la región.","La extradición inmediata de todos los líderes."],"a":1,"e":"En los apuntes: 2025: 2.198 detenidos y 30 terminales Starlink confiscados.","u":1},{"n":1110,"m":8,"q":"En el caso de insider corrupto en Rusia (Infraud) citado en el tema, el soborno consistió en:","o":["Un pago en efectivo de 1.000 euros.","1.000 BTC (~24 M$) a un investigador superior del Comité de Instrucción para no incautar activos.","La entrega de información clasificada militar.","Un puesto directivo en una empresa tecnológica."],"a":1,"e":"En los apuntes: Rusia (Infraud): investigador superior del Comité de Instrucción sobornado con 1.000 BTC (~24 M$) por no incautar activos — corrupción policial/judicial.","u":1},{"n":1111,"m":8,"q":"El esquema del “círculo vicioso” expuesto en las conclusiones del tema se resume como:","o":["Cibercrimen → corrupción → fin del ciclo.","Corrupción → trata → cibercrimen → más fondos → más corrupción.","Trata → blanqueo → desaparición del fraude.","Phishing → ransomware → detención policial inmediata."],"a":1,"e":"En los apuntes: Esquema central del tema (muy preguntable en examen): corrupción → trata → cibercrimen → más fondos → más corrupción","u":1},{"n":1112,"m":9,"q":"¿Qué pregunta es propia de la ciberseguridad, frente a la investigación de la ciberdelincuencia?","o":["¿Quién lo ha hecho?","¿Cómo evitamos que ocurra un incidente?","¿Qué evidencias existen?","¿Qué relevancia penal tiene?"],"a":1,"e":"En los apuntes: Ciberseguridad: ¿cómo evitamos que ocurra un incidente? ¿Cómo detectamos una amenaza? ¿Cómo minimizamos el impacto? Investigación de ciberdelincuencia: ¿qué ha ocurrido? ¿Quién lo ha hecho? ¿Cómo lo ha hecho? ¿Qué evidencias existen? ¿Qué relevancia penal tiene?"},{"n":1113,"m":9,"q":"Según la idea clave del tema, ¿cuál es la diferencia esencial entre ciberseguridad e investigación de ciberdelincuencia?","o":["Son términos sinónimos sin diferencia práctica","La ciberseguridad intenta evitar el incidente; la investigación de ciberdelincuencia averigua qué ocurrió una vez producido","La ciberseguridad solo se aplica en el ámbito privado","La investigación de ciberdelincuencia siempre precede a la ciberseguridad"],"a":1,"e":"En los apuntes: Idea clave: la ciberseguridad intenta evitar que ocurra el incidente; la investigación de ciberdelincuencia intenta averiguar qué ocurrió cuando el incidente ya se ha producido."},{"n":1114,"m":9,"q":"¿Qué tres principios integran la tríada CID de la seguridad de la información?","o":["Confidencialidad, integridad y disponibilidad","Autenticación, no repudio y trazabilidad","Confidencialidad, autenticación y riesgo","Integridad, amenaza y vulnerabilidad"],"a":0,"e":"En los apuntes: Idea clave: todo incidente de seguridad supone una afectación a uno o varios de los principios de confidencialidad, integridad o disponibilidad, y, complementariamente, a la autenticación y al no repudio."},{"n":1115,"m":9,"q":"¿Qué principio de la seguridad de la información se refiere a que la información no debe ser alterada de forma no autorizada?","o":["Confidencialidad","Integridad","Disponibilidad","No repudio"],"a":1,"e":"En los apuntes: Integridad: la información no debe ser alterada de forma no autorizada."},{"n":1116,"m":9,"q":"¿Qué principio complementario permite demostrar posteriormente quién realizó una determinada acción?","o":["Autenticación","No repudio","Disponibilidad","Confidencialidad"],"a":1,"e":"En los apuntes: No repudio: poder demostrar posteriormente quién realizó una determinada acción."},{"n":1117,"m":9,"q":"Según la ecuación básica de gestión del riesgo del tema, ¿cómo se define el riesgo?","o":["Activo + Amenaza","Amenaza + Vulnerabilidad","Vulnerabilidad + Activo","Confidencialidad + Integridad"],"a":1,"e":"En los apuntes: La ecuación básica de la gestión del riesgo en seguridad de la información pued re) puede integrar múltiples delitos?","o":["Porque siempre se aplica un único artículo del Código Penal, sin excepciones","Porque puede incluir sucesivamente acceso ilícito, escalada de privilegios, exfiltración de datos y daños informáticos, cada uno con su propio encaje penal","Porque el ransomware nunca tiene relevancia penal","Porque solo afecta a la disponibilidad de los sistemas"],"a":1,"e":"En los apuntes: Cuarta: un mismo incidente puede integrar múltiples delitos El mejor ejemplo es el ransomware: lo que técnicamente se observa como un único ataque puede incluir, de forma sucesiva, acceso ilícito, escalada de privilegios, exfiltración de datos y daños informáticos."},{"n":1132,"m":10,"q":"¿Qué representan las filas y las columnas en la analítica forense de una hoja de cálculo?","o":["Las filas son atributos y las columnas son registros","Las filas representan registros unívocos o eventos, y las columnas actúan como atributos o campos taxonómicos","Ambas representan siempre lo mismo, sin distinción funcional","Las columnas solo pueden contener texto y las filas solo números"],"a":1,"e":"En los apuntes: En la analítica forense: las filas representan registros unívocos (un acceso IP, una llamada, un movimiento bancario) y las columnas actúan como atributos o campos taxonómicos (fecha/hora, IP de origen, importe, etc.)."},{"n":1133,"m":10,"q":"¿Qué ocurre si Excel interpreta automáticamente (formato “General”) un IMEI de 14-15 dígitos?","o":["Se muestra siempre correctamente sin ningún riesgo","Puede truncar ceros a la izquierda o convertirlo a notación científica, corrompiendo la visualización de la prueba","Se convierte automáticamente en una fórmula","Excel rechaza la entrada del dato"],"a":1,"e":"En los apuntes: Truncamiento de ceros a la izquierda: identificadores como códigos postales, prefijos telefónicos o cuentas bancarias que comiencen por cero pierden ese dígito automáticamente. Conversión a notación científica: Excel tiene un límite de precisión de
