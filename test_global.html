const cfg={mode:'study',src:'cycle',rep:'fail',mods:new Set(MODS.map((_,i)=>i)),n:20,sq:true,so:false,timer:true,pen:false};
const sv=()=>{const k=B[bank].k;st.set('cib_fail'+k,[...failed]);st.set('cib_seen'+k,[...seen]);st.set('cib_hist'+k,hist)};
function loadBank(b){bank=b;Q=b==='base'?D.q:XQ;MODS=b==='base'?D.mods:XM;const k=B[b].k;failed=new Set(st.get('cib_fail'+k,[]));seen=new Set(st.get('cib_seen'+k,[]));hist=st.get('cib_hist'+k,[]);failed.forEach(n=>seen.add(n));cfg.mods=new Set(MODS.map((_,i)=>i));rs=rc=false}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const sb=(ok,ko,t)=>`<div class="sb" role="img" aria-label="${ok} aciertos y ${ko} fallos de ${t}"><span class="g">${ok}</span><div class="sbt"><i class="sg" style="width:${ok/t*100}%"></i><i class="sr" style="width:${ko/t*100}%"></i></div><span class="r">${ko}</span></div><div class="sbl"><span>Aciertos</span><span>Fallos</span></div>`;
const pool=()=>{const g=a=>cfg.sq?shuf(a):a;if(cfg.src==='failed')return Q.filter(q=>failed.has(q.n));if(cfg.src==='mods')return Q.filter(q=>cfg.mods.has(q.m));if(cfg.src==='cycle')return g(Q.filter(q=>!seen.has(q.n))).concat(cfg.rep==='none'?[]:g(Q.filter(q=>seen.has(q.n)&&(cfg.rep==='any'||failed.has(q.n)))));return Q};
function home(){
 clearInterval(tm);S=null;if(!failed.size&&cfg.src==='failed')cfg.src='all';
 const p=pool(),n=Math.min(cfg.n||p.length,p.length),pend=Q.length-seen.size;
 const avg=hist.length?Math.round(hist.reduce((a,h)=>a+h.pct,0)/hist.length)+'%':'–';
 const rad=(k,v,t,s,d)=>`<label class="ch"><input type="radio" name="${k}" data-k="${k}" value="${v}"${cfg[k]===v?' checked':''}${d?' disabled':''}><span><b>${t}</b><br><small class="mu">${s}</small></span></label>`;
 const chk=(k,t,s)=>`<label class="ch"><input type="checkbox" data-k="${k}"${cfg[k]?' checked':''}><span>${t}<br><small class="mu">${s}</small></span></label>`;
 $('#app').innerHTML=`<h1>Test de práctica</h1><p class="mu">MUCD-ASIG01 · Ciberdelincuencia y Ciberinteligencia · ${bank==='base'?'':'banco extra · '}${Q.length} preguntas</p>
 <div class="stats"><div class="stat"><b>${seen.size}/${Q.length}</b>preguntas hechas</div><div class="stat"><b>${hist.length}</b>tests hechos</div><div class="stat"><b>${avg}</b>acierto medio</div><div class="stat"><b>${failed.size}</b>falladas guardadas</div></div>${sb(seen.size-failed.size,failed.size,Q.length)}
 <section class="card"><h2>Modo</h2><div class="row">${rad('mode','study','Estudio','Corrección inmediata y explicación tras cada pregunta')}${rad('mode','exam','Examen','Corrige al final, con nota y cronómetro opcional')}</div>
 ${cfg.mode==='exam'?`<div class="row">${chk('timer','Cronómetro','1 minuto por pregunta')}${chk('pen','Los errores restan','Cada error resta 1/3 de acierto')}</div>`:''}</section>
 <section class="card"><h2>Preguntas</h2><div class="row">${rad('src','cycle','Ciclo','Completa las '+Q.length+' preguntas por tandas')}${rad('src','all','Todas','Las '+Q.length+' del banco')}${rad('src','mods','Por módulos','Elige uno o varios')}${rad('src','failed','Solo falladas','Repaso de tus errores ('+failed.size+')',!failed.size)}</div>${cfg.src==='cycle'?`<h2 style="margin-top:16px">Repetición</h2><div class="row">${rad('rep','none','No repetir','Solo preguntas que aún no has hecho')}${rad('rep','fail','Repetir las falladas','Nuevas y, si hacen falta, las que fallaste')}${rad('rep','any','Repetir cualquiera','Nuevas y, si hacen falta, cualquiera ya hecha')}</div><p class="mu small">${pend?'Te quedan '+pend+' de '+Q.length+' sin hacer.':'Has completado las '+Q.length+'. Reinicia el ciclo para empezar otro.'} <button class="btn sec" data-act="rcycle">${rc?'¿Seguro? Reiniciar':'Reiniciar ciclo'}</button></p>`:''}
 ${cfg.src==='mods'?`<div class="row">${MODS.map((m,i)=>!Q.some(q=>q.m===i)?'':`<label class="ch"><input type="checkbox" data-k="mod" value="${i}"${cfg.mods.has(i)?' checked':''}><span>${esc(m)} <small class="mu">(${Q.filter(q=>q.m===i).length})</small></span></label>`).join('')}</div>`:''}
 <div class="row"><label><b>Preguntas por test</b><br><select data-k="n">${[10,20,40,60,100,0].map(v=>`<option value="${v}"${cfg.n===v?' selected':''}>${v?v+' preguntas':'Todas'}</option>`).join('')}</select></label></div>
 <div class="row">${chk('sq','Orden aleatorio','Mezcla las preguntas')}${chk('so','Mezclar opciones','Cambia de sitio las respuestas A, B, C y D en cada pregunta (la que era A puede pasar a ser C o D). Así aprendes el contenido y no la letra.')}</div></section>
 ${bank==='base'&&seen.size>=Q.length?`<section class="card"><h2>¡Has completado las ${Q.length}!</h2><p>Tienes un banco extra con ${XQ.length} preguntas nuevas de todo el temario.</p><button class="btn" data-act="xbank">Hacer las ${XQ.length} preguntas nuevas</button></section>`:''}${bank==='extra'?`<p><button class="btn sec" data-act="bbank">Volver al banco principal</button></p>`:''}<button class="btn" data-act="start"${p.length?'':' disabled'}>Empezar test (${n} preguntas)</button>
 <p><button class="btn sec" data-act="reset">${rs?'¿Seguro? Borrar todo el progreso':'Borrar progreso'}</button></p>`}
function start(list,n,pre){
 list=pre?list.slice(0,Math.min(n,list.length)):(cfg.sq?shuf(list):list.slice()).slice(0,Math.min(n,list.length));if(pre&&cfg.sq)list=shuf(list);
 S={mode:cfg.mode,pen:cfg.mode==='exam'&&cfg.pen,i:0,done:false,lv:false,cf:false,f:'all',items:list.map(q=>({q,ord:cfg.so?shuf([0,1,2,3]):[0,1,2,3],a:null}))};
 if(S.mode==='exam'&&cfg.timer){S.end=Date.now()+list.length*60000;tm=setInterval(tick,1000)}
 quiz()}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$('#tm');if(el)el.textContent=fmt(r);if(r<=0)finish()}
function quiz(ns){
 const it=S.items[S.i],q=it.q,n=S.items.length,ex=S.mode==='exam',an=it.a!==null,rv=!ex&&an,ok=it.a===q.a,bl=S.items.filter(x=>x.a===null).length,dn=ex?new Set([...seen,...S.items.filter(x=>x.a!==null).map(x=>x.q.n)]).size:seen.size;
 const opts=it.ord.map((oi,p)=>{let c='opt';if(rv){if(oi===q.a)c+=' ok';else if(oi===it.a)c+=' ko'}else if(ex&&it.a===oi)c+=' sel';return `<button class="${c}" data-act="pick" data-oi="${oi}"${rv?' disabled':''}><b>${L[p]}</b><span>${esc(q.o[oi])}</span></button>`}).join('');
 const fb=rv?`<div class="fb ${ok?'good':'bad'}"><strong>${ok?'Correcto.':'Incorrecto.'}</strong> La respuesta correcta es la ${L[it.ord.indexOf(q.a)]}.<br>${esc(q.e)}${q.u?'<br><small>Respuesta deducida de los apuntes (el documento no traía la solución): compruébala.</small>':''}</div>`:'';
 const nav=ex?`<div class="nav">${S.items.map((x,i)=>`<button class="nv${x.a!==null?' an':''}${i===S.i?' cur':''}" data-act="go" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join('')}</div>`:'';
 const pr=((ex?n-bl:S.i+(rv?1:0))/n*100).toFixed(1);
 $('#app').innerHTML=`<div class="top"><span class="mu">Pregunta <b>${S.i+1}</b> de ${n} · nº ${q.n}</span><span class="mu">Hechas <b>${dn}</b> de ${Q.length}</span>${ex&&S.end?`<b id="tm">${fmt(Math.max(0,Math.round((S.end-Date.now())/1000)))}</b>`:''}<button class="btn sec" data-act="home">${S.lv?'¿Seguro? Salir':'Salir'}</button></div>
 <div class="bar" role="progressbar" aria-valuenow="${pr}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pr}%"></i></div>
 ${ex?'':sb(S.items.filter(x=>x.a!==null&&x.a===x.q.a).length,S.items.filter(x=>x.a!==null&&x.a!==x.q.a).length,n)}<p class="mu small">${esc(MODS[q.m])}</p><h2 class="q">${esc(q.q)}</h2>${opts}${fb}
 <div class="row">${ex?`<button class="btn sec" data-act="prev"${S.i?'':' disabled'}>Anterior</button><button class="btn sec" data-act="next"${S.i<n-1?'':' disabled'}>Siguiente</button><button class="btn" data-act="fin">${S.cf?`Confirmar entrega (${bl} sin responder)`:'Finalizar'}</button>`:`<button class="btn" data-act="next"${an?'':' disabled'}>${S.i<n-1?'Siguiente':'Ver resultado'}</button>`}</div>${nav}`;
 if(!ns)window.scrollTo(0,0)}
function pick(oi){const it=S.items[S.i];S.lv=false;
 if(S.mode==='study'){if(it.a!==null)return;it.a=oi;seen.add(it.q.n);it.a===it.q.a?failed.delete(it.q.n):failed.add(it.q.n);sv()}else it.a=it.a===oi?null:oi;
 quiz(1)}
function next(){S.lv=false;S.cf=false;if(S.i<S.items.length-1){S.i++;quiz()}else if(S.mode==='study')finish();else quiz()}
function finish(){
 clearInterval(tm);S.done=true;let ok=0,ko=0,bl=0;
 S.items.forEach(it=>{if(it.a===null)bl++;else if(it.a===it.q.a)ok++;else ko++;if(S.mode==='exam'&&it.a!==null){seen.add(it.q.n);it.a===it.q.a?failed.delete(it.q.n):failed.add(it.q.n)}});
 const n=S.items.length,sc=Math.max(0,ok-(S.pen?ko/3:0));
 S.res={ok,ko,bl,n,nota:sc/n*10};hist.push({d:Date.now(),mode:S.mode,n,ok,pct:Math.round(ok/n*100)});hist=hist.slice(-50);sv();results()}
function results(){
 const r=S.res,lab={ok:'Correcta',ko:'Incorrecta',bl:'En blanco'};
 const rows=S.items.map((it,i)=>({it,i,s:it.a===null?'bl':it.a===it.q.a?'ok':'ko'})).filter(x=>S.f==='all'||x.s!=='ok');
 const list=rows.map(({it,i,s})=>`<article class="card"><div class="top"><b>Pregunta ${i+1} · nº ${it.q.n}</b><span class="tag ${s}">${lab[s]}</span></div><p>${esc(it.q.q)}</p>${it.ord.map((oi,p)=>`<div class="ro${oi===it.q.a?' ok':oi===it.a?' ko':''}"><b>${L[p]}</b> ${esc(it.q.o[oi])}</div>`).join('')}<p class="mu small"><strong>Explicación:</strong> ${esc(it.q.e)}${it.q.u?' (Respuesta deducida de los apuntes: compruébala.)':''}</p></article>`).join('');
 $('#app').innerHTML=`<section class="card score"><p class="mu">Resultado</p><div class="big">${r.nota.toFixed(2)} / 10</div><p>${r.ok} correctas · ${r.ko} incorrectas · ${r.bl} en blanco de ${r.n}${S.pen?'<br><small class="mu">Los errores restan 1/3</small>':''}</p><p class="mu">Llevas <b>${seen.size}</b> de ${Q.length} preguntas hechas.</p>${sb(r.ok,r.ko,r.n)}
 <div class="row" style="justify-content:center">${cfg.src==='cycle'?`<button class="btn" data-act="again"${pool().length?'':' disabled'}>Siguiente test del ciclo</button>`:''}<button class="btn sec" data-act="retry"${r.ko?'':' disabled'}>Repasar las falladas (${r.ko})</button>${bank==='base'&&seen.size>=Q.length?`<button class="btn" data-act="xbank">Hacer las ${XQ.length} preguntas nuevas</button>`:''}<button class="btn sec" data-act="home">Volver al inicio</button></div></section>
 <div class="row"><button class="btn sec" data-act="filt" data-f="all"${S.f==='all'?' aria-pressed="true"':''}>Ver todas</button><button class="btn sec" data-act="filt" data-f="bad"${S.f==='bad'?' aria-pressed="true"':''}>Solo falladas y en blanco</button></div>${list||'<p class="mu">No hay preguntas que mostrar.</p>'}`;
 window.scrollTo(0,0)}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='start'||a==='again')start(pool(),cfg.n||pool().length,cfg.src==='cycle');
 else if(a==='home'){if(S&&!S.done&&!S.lv){S.lv=true;quiz(1);return}home()}
 else if(a==='pick')pick(+b.dataset.oi);
 else if(a==='next')next();
 else if(a==='prev'){S.i=Math.max(0,S.i-1);S.cf=false;quiz()}
 else if(a==='go'){S.i=+b.dataset.i;S.cf=false;quiz()}
 else if(a==='fin'){const bl=S.items.filter(x=>x.a===null).length;if(bl&&!S.cf){S.cf=true;quiz(1);return}finish()}
 else if(a==='filt'){S.f=b.dataset.f;results()}
 else if(a==='xbank'){loadBank('extra');home()}else if(a==='bbank'){loadBank('base');home()}
 else if(a==='retry')start(S.items.filter(x=>x.a!==null&&x.a!==x.q.a).map(x=>x.q),999);
 else if(a==='reset'){if(!rs){rs=true;home();return}failed=new Set();hist=[];seen=new Set();rs=false;sv();home()}else if(a==='rcycle'){if(!rc){rc=true;home();return}seen=new Set();rc=false;sv();home()}});
$('#app').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
 if(k==='mod'){t.checked?cfg.mods.add(+t.value):cfg.mods.delete(+t.value)}
 else if(k==='n')cfg.n=+t.value;
 else if(t.type==='checkbox')cfg[k]=t.checked;
 else cfg[k]=t.value;rs=rc=false;home()});
document.addEventListener('keydown',e=>{if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),i='abcd1234'.indexOf(k);
 if(k.length===1&&i>-1){pick(S.items[S.i].ord[i%4]);e.preventDefault()}
 else if(k==='arrowright'||(k==='enter'&&document.activeElement.tagName!=='BUTTON')){if(S.mode==='study'&&S.items[S.i].a===null)return;next()}
 else if(k==='arrowleft'&&S.mode==='exam'){S.i=Math.max(0,S.i-1);quiz()}});
home();
</script></body></html>
