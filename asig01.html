const DATA = [{"n": 1, "q": "¿A qué se refiere el modelo de negocio criminal denominado Ransomware-as-a-Service (RaaS)?", "o": ["A un modelo donde los desarrolladores de malware ponen sus herramientas a disposición de terceros a cambio de una comisión sobre los beneficios obtenidos.", "Al uso de ingeniería social para manipular a empleados de empresas tecnológicas.", "Al espionaje industrial realizado mediante técnicas de inteligencia artificial.", "A ataques dirigidos exclusivamente contra administraciones públicas."], "c": [0], "e": "El desarrollador del malware lo cede como servicio a terceros (afiliados), que ejecutan los ataques a cambio de repartirse el beneficio del rescate.", "nota": ""}, {"n": 2, "q": "¿Por qué se considera al Crime-as-a-Service una transformación clave?", "o": ["Porque elimina completamente la necesidad de conocimientos técnicos.", "Porque sustituye totalmente al crimen organizado tradicional.", "Porque permite que distintos actores criminales alquilen capacidades especializadas, reduciendo las barreras de entrada al cibercrimen.", "Porque legaliza la venta de malware en tiendas oficiales de aplicaciones móviles."], "c": [2], "e": "Convierte el cibercrimen en un ecosistema de servicios alquilables (malware, infraestructura, accesos...), democratizando el acceso.", "nota": ""}, {"n": 3, "q": "¿Qué objetivo tiene el Bulletproof Hosting?", "o": ["Mejorar el rendimiento de infraestructuras críticas gubernamentales.", "Proporcionar alojamiento resistente a intervenciones o requerimientos legales, facilitando actividades ilícitas.", "Garantizar el cifrado de extremo a extremo de las comunicaciones.", "Destruir físicamente los discos duros mediante calor en cuanto detecta un intento de acceso no autorizado."], "c": [1], "e": "Proveedores de hosting que ignoran deliberadamente las notificaciones de abuso y dificultan las órdenes judiciales, dando cobertura a infraestructura criminal (C2, phishing, mercados ilícitos, etc.).", "nota": ""}, {"n": 4, "q": "¿Qué es un insider comprometido?", "o": ["Un empleado que sabotea deliberadamente los sistemas por venganza personal.", "Un auditor de ciberseguridad externo contratado para comprobar la resistencia de la red corporativa.", "Un empleado que comete errores involuntarios que abren brechas de seguridad.", "Un empleado captado, coaccionado o chantajeado por un actor externo que actúa desde dentro."], "c": [3], "e": "El rasgo distintivo es que un tercero externo lo capta, coacciona o chantajea para que actúe en su beneficio desde dentro de la organización, a diferencia del insider malicioso autónomo o del error involuntario.", "nota": ""}, {"n": 5, "q": "En el contexto de la automatización y la hipervelocidad de los ataques, combinado con el uso de la IA, ¿qué elemento se utiliza para lanzar ataques masivos de forma coordinada?", "o": ["Ninguna es correcta", "Botnets.", "Chatbots.", "Swarnbots."], "c": [3], "e": "Según la plataforma oficial de la asignatura la respuesta marcada como correcta es \"Swarnbots\" (enjambres de bots coordinados mediante IA de forma autónoma), no \"Botnets\" en sentido tradicional.", "nota": "Ojo con esta: el banco de preguntas inicial la daba como \"Botnets\", pero el examen oficial de tu plataforma la corrige a \"Swarnbots\"."}, {"n": 6, "q": "¿Cuál de las siguientes afirmaciones constituye una causa del aumento de la ciberdelincuencia?", "o": ["La digitalización de la sociedad y la hiperconectividad.", "La disminución del uso de Internet.", "La desaparición del anonimato en la red.", "La reducción del comercio internacional."], "c": [0], "e": "Más actividad digital y dispositivos conectados = mayor superficie de exposición y más oportunidades para el delincuente.", "nota": ""}, {"n": 7, "q": "¿Cómo debe entenderse la inteligencia artificial en el nuevo paradigma de la ciberdelincuencia?", "o": ["Como un multiplicador de capacidades criminales que aumenta escala, personalización y credibilidad.", "Como una herramienta irrelevante para la ingeniería social.", "Como una categoría penal autónoma que sustituye a todos los delitos tradicionales.", "Como una tecnología que solo puede emplearse con fines defensivos."], "c": [0], "e": "La IA actúa como \"force multiplier\" de las técnicas ya existentes, no crea delitos nuevos por sí misma.", "nota": ""}, {"n": 8, "q": "¿Cómo puede definirse la ciberdelincuencia en el contexto del temario?", "o": ["Como la protección técnica de sistemas informáticos frente a vulnerabilidades.", "Como el conjunto de actividades ilícitas en las que sistemas informáticos, redes, dispositivos digitales o datos desempeñan un papel esencial.", "Como cualquier investigación policial en la que se utilicen herramientas digitales.", "Como el conjunto de delitos cometidos exclusivamente por hackers profesionales."], "c": [1], "e": "Definición amplia y funcional: cualquier actividad ilícita en la que la tecnología sea elemento esencial, como objeto o como medio.", "nota": ""}, {"n": 9, "q": "¿Cuál de las siguientes opciones describe mejor un ataque contra la disponibilidad?", "o": ["Acceso no autorizado a datos personales sin alterarlos.", "Uso de una firma digital válida en un trámite administrativo.", "Impedimento, degradación o interrupción del acceso legítimo a sistemas, servicios o datos.", "Plagio de una obra académica."], "c": [2], "e": "Ataca la disponibilidad todo lo que impide, ralentiza o interrumpe el acceso normal de usuarios legítimos.", "nota": ""}, {"n": 10, "q": "¿Cuál es el objetivo principal de técnicas como Evilginx, EvilProxy o Tycoon2FA?", "o": ["Detectar plagio académico mediante comparación textual.", "Crear copias de seguridad inmutables en entornos corporativos.", "Proteger a usuarios frente a páginas falsas.", "Industrializar campañas de phishing avanzado y facilitar el robo de sesión o tokens."], "c": [3], "e": "Kits de phishing-as-a-service (adversary-in-the-middle) que roban credenciales, cookies de sesión y tokens de MFA.", "nota": ""}, {"n": 11, "q": "¿Cuál es la finalidad principal de la confidencialidad dentro de la tríada CID?", "o": ["Garantizar que los sistemas estén siempre disponibles.", "Proteger la información frente a accesos, usos o divulgaciones no autorizadas.", "Evitar exclusivamente ataques de denegación de servicio.", "Asegurar que los datos puedan modificarse libremente por usuarios autorizados y no autorizados."], "c": [1], "e": "La confidencialidad garantiza que la información solo sea accesible o divulgada a quien está autorizado.", "nota": ""}, {"n": 12, "q": "¿Cuál es la función principal de MITRE D3FEND dentro del temario?", "o": ["Describir únicamente tácticas ofensivas utilizadas por adversarios.", "Sustituir la investigación policial por inteligencia artificial.", "Organizar técnicas defensivas y contramedidas de ciberseguridad frente a comportamientos adversarios.", "Clasificar exclusivamente delitos contra la propiedad intelectual."], "c": [2], "e": "Es el \"espejo defensivo\" de MITRE ATT&CK: cataloga contramedidas frente a las tácticas ofensivas.", "nota": ""}, {"n": 13, "q": "En una investigación de phishing bancario, ¿qué evidencia resulta especialmente relevante preservar?", "o": ["El historial de navegación de todos los empleados no afectados.", "Solo una captura de pantalla del mensaje, sin cabeceras ni URL.", "El correo original con cabeceras completas, URL fraudulenta, dominio utilizado y trazabilidad de fondos.", "Únicamente el testimonio verbal de la víctima."], "c": [2], "e": "Cabeceras, dominio/URL y trazabilidad de fondos permiten identificar el origen técnico del ataque y seguir el dinero.", "nota": ""}, {"n": 14, "q": "¿Por qué el software crackeado resulta relevante tanto para propiedad intelectual como para ciberdelincuencia?", "o": ["Porque puede vulnerar derechos de explotación y además actuar como vector de malware o infostealers.", "Porque impide cualquier investigación técnica posterior.", "Porque solo afecta a empresas audiovisuales.", "Porque siempre es software libre y no genera riesgo penal."], "c": [0], "e": "Vulnera la propiedad intelectual y, además, cracks/keygens se distribuyen frecuentemente troyanizados con malware.", "nota": ""}, {"n": 15, "q": "¿Por qué los infostealers son considerados combustible del ecosistema criminal?", "o": ["Porque únicamente afectan a dispositivos móviles sin conexión corporativa.", "Porque se limitan a bloquear páginas web ilegales.", "Porque roban credenciales, cookies, tokens y otros datos que pueden reutilizarse en fraudes, BEC, ransomware o venta de accesos.", "Porque solo cifran archivos locales y piden rescate."], "c": [2], "e": "Los datos robados alimentan todo el ecosistema posterior (venta de accesos, fraude, BEC, ransomware).", "nota": ""}, {"n": 16, "q": "¿Qué caracteriza al BEC o fraude del CEO?", "o": ["La modificación de software para eliminar controles de licencia.", "La suplantación de directivos o proveedores para ordenar transferencias o modificar datos de pago.", "La ejecución automática de copias de seguridad no autorizadas.", "La distribución de películas mediante redes P2P."], "c": [1], "e": "Suplanta a un directivo o proveedor para conseguir que un empleado transfiera fondos o modifique datos bancarios de una factura.", "nota": ""}, {"n": 17, "q": "¿Qué caracteriza al phishing Adversary-in-the-Middle —AiTM—?", "o": ["La clonación de voz para realizar llamadas fraudulentas.", "La interposición de una infraestructura proxy entre víctima y servicio legítimo para capturar credenciales, MFA o tokens.", "El envío de archivos torrent con contenido audiovisual no autorizado.", "El cifrado masivo de servidores virtuales mediante ransomware."], "c": [1], "e": "Un proxy inverso se interpone entre víctima y sitio legítimo, capturando credenciales, código MFA y cookie de sesión.", "nota": ""}, {"n": 18, "q": "¿Qué conducta representa mejor un ataque contra la integridad de la información?", "o": ["La mera lectura autorizada de un documento interno.", "La modificación fraudulenta de datos en una plataforma administrativa.", "La copia de seguridad ordinaria de una base de datos.", "La caída temporal de una página web por saturación de tráfico."], "c": [1], "e": "La integridad garantiza que los datos no sean alterados de forma indebida; modificarlos fraudulentamente es el ataque característico.", "nota": ""}, {"n": 19, "q": "¿Qué describe mejor la técnica Fake CAPTCHA o ClickFix en la distribución de infostealers?", "o": ["Un método de verificación legítima que siempre mejora la seguridad del usuario.", "Una modalidad de IPTV ilegal basada en listas M3U.", "Una técnica que induce a la víctima a copiar y ejecutar comandos bajo apariencia de verificación o solución técnica.", "Una técnica de análisis forense multimedia contra deepfakes."], "c": [2], "e": "Simula una verificación/error técnico para que la propia víctima copie y ejecute un comando malicioso, evadiendo controles automáticos.", "nota": ""}, {"n": 20, "q": "¿Qué diferencia al Threat Hunting de la monitorización tradicional?", "o": ["La monitorización tradicional siempre se basa en hipótesis manuales y nunca en alertas.", "No existe diferencia entre ambos enfoques.", "El Threat Hunting solo se utiliza después de dictar sentencia judicial.", "El Threat Hunting parte de hipótesis proactivas para buscar actividad maliciosa no detectada por alertas automáticas."], "c": [3], "e": "La monitorización tradicional es reactiva (responde a alertas); el Threat Hunting es proactivo, buscando lo que las alertas no detectan.", "nota": ""}, {"n": 21, "q": "¿Qué diferencia principalmente la distribución ilícita de la mera reproducción no autorizada de una obra protegida?", "o": ["La reproducción siempre requiere ánimo de lucro y la distribución no.", "No existe diferencia jurídica ni investigativa entre ambas.", "La distribución solo existe cuando la obra se altera técnicamente.", "La distribución implica poner copias no autorizadas a disposición de terceros."], "c": [3], "e": "La reproducción es copiar la obra; la distribución implica poner esas copias a disposición de terceros, ampliando el alcance de la infracción.", "nota": ""}, {"n": 22, "q": "¿Qué modalidad de propiedad intelectual se asocia especialmente a listas M3U, paneles de usuario, decodificadores y suscripciones periódicas?", "o": ["Device code phishing.", "Descubrimiento de secretos.", "IPTV ilegal.", "Plagio académico."], "c": [2], "e": "Listas M3U, paneles, decodificadores y suscripciones son los elementos característicos del negocio de IPTV ilegal.", "nota": ""}, {"n": 23, "q": "¿Qué riesgo principal plantean los deepfakes en fraudes de identidad?", "o": ["Impiden que exista cualquier tipo de evidencia digital.", "Permiten simular voz, imagen o presencia de una persona para reforzar la suplantación.", "Permiten eliminar automáticamente todos los logs de una organización.", "Solo afectan a obras protegidas por propiedad intelectual."], "c": [1], "e": "Generan contenido audiovisual sintético muy realista que potencia técnicas como el BEC/fraude del CEO.", "nota": ""}, {"n": 24, "q": "¿Qué significa que la tecnología pueda ser el medio comisivo del delito?", "o": ["Que el hecho no tiene relevancia penal si se realiza a través de Internet.", "Que el sistema informático es siempre el bien jurídico directamente atacado.", "Que la tecnología se utiliza para cometer un delito tradicional, como una estafa mediante phishing.", "Que la tecnología solo actúa como fuente de evidencia posterior."], "c": [2], "e": "Distingue delitos \"informáticos puros\" de delitos tradicionales cometidos por medios informáticos, donde la tecnología es solo el instrumento.", "nota": ""}, {"n": 25, "q": "¿Qué tendencia actual caracteriza al ransomware moderno según el temario?", "o": ["Su uso exclusivo contra usuarios domésticos sin impacto empresarial.", "El paso del cifrado como único mecanismo hacia modelos de extorsión múltiple y robo de datos.", "La eliminación completa del papel de los brokers de acceso inicial.", "Su desaparición como amenaza relevante."], "c": [1], "e": "Evolución hacia la doble/triple extorsión: exfiltración de datos además del cifrado, con amenaza de publicación.", "nota": ""}, {"n": 26, "q": "¿Qué tres planos de análisis debe combinar el estudio policial de la ciberdelincuencia?", "o": ["Administrativo, contable y estadístico.", "Preventivo, sancionador y penitenciario.", "Criminológico, mediático y sociológico exclusivamente.", "Jurídico-penal, técnico-operativo y de inteligencia."], "c": [3], "e": "Enfoque multidisciplinar: marco legal, herramientas técnicas de investigación y análisis de inteligencia.", "nota": ""}, {"n": 27, "q": "¿Cómo se define formalmente la ciberinteligencia en el ámbito de las organizaciones?", "o": ["Como el proceso de investigación de ciberdelitos para identificar responsables.", "Como la disciplina que recopila y analiza información para convertirla en conocimiento procesable y útil para la toma de decisiones.", "Como el uso de herramientas tecnológicas para bloquear el acceso no autorizado a redes.", "Como la práctica de defender computadoras y servidores de ataques maliciosos."], "c": [1], "e": "Proceso de inteligencia: recopila, analiza y transforma información en conocimiento útil para decisiones estratégicas u operativas.", "nota": ""}, {"n": 28, "q": "¿Cuál es el objetivo fundamental de las redes de ordenadores?", "o": ["Sustituir la comunicación humana tradicional por medios digitales.", "Garantizar que Internet no tenga un organismo central de gobierno.", "Compartir recursos, tanto hardware como software, entre los integrantes de la red.", "Eliminar la necesidad de utilizar protocolos de comunicación como TCP/IP."], "c": [2], "e": "Compartir recursos (dispositivos, aplicaciones, información) entre los equipos conectados.", "nota": ""}, {"n": 29, "q": "¿Cuál fue un hito relevante en 1988 por ser uno de los primeros gusanos informáticos que se propagó automáticamente y afectó al 10% de los sistemas conectados a Internet?", "o": ["Morris Worm.", "WannaCry.", "El virus ILOVEYOU.", "Stuxnet."], "c": [0], "e": "Infectó cerca del 10% de los equipos entonces conectados a Internet y dio lugar a la primera condena bajo la Computer Fraud and Abuse Act de EEUU.", "nota": ""}, {"n": 30, "q": "Dentro de las disciplinas de inteligencia, ¿qué es OSINT?", "o": ["Inteligencia obtenida a partir de fuentes abiertas y públicamente accesibles.", "Inteligencia obtenida a través de informadores y colaboradores humanos.", "Inteligencia obtenida mediante la interceptación de señales electrónicas.", "Inteligencia basada en el análisis de imágenes satelitales."], "c": [0], "e": "Open Source Intelligence: información de fuentes abiertas (webs, redes sociales, prensa, registros públicos...).", "nota": ""}, {"n": 31, "q": "En la analogía del iceberg para explicar las capas de la red, ¿qué representa la Deep Web?", "o": ["Exclusivamente sitios web utilizados para la venta de productos ilegales.", "Aproximadamente el 90% de todos los sitios web que no están indexados, incluyendo bases de datos privadas.", "La punta inferior del iceberg donde solo se accede con navegadores especializados.", "El contenido visible indexado por motores de búsqueda como Google."], "c": [1], "e": "Contenido no indexado por buscadores (bases de datos privadas, webmail, intranets...), la mayor parte de Internet.", "nota": ""}, {"n": 32, "q": "¿Qué característica singular diferenció a Stuxnet (2010) de los virus tradicionales?", "o": ["Fue diseñado para actuar sobre infraestructuras físicas concretas (instalaciones nucleares) produciendo efectos tangibles.", "Fue el primer ataque de denegación de servicio (DDoS) contra un Estado.", "Fue el primer virus que se propagó masivamente por redes sociales.", "Su única finalidad era el robo masivo de credenciales bancarias."], "c": [0], "e": "Primer malware conocido diseñado para sabotear sistemas SCADA/PLC, provocando daños físicos reales.", "nota": ""}, {"n": 33, "q": "¿Qué categoría de ciberinteligencia emplea indicadores de compromiso (IOC), hashes de archivos y TTP para la detección y respuesta ante amenazas a corto plazo?", "o": ["Operativa.", "Estratégica.", "Táctica.", "Geopolítica."], "c": [2], "e": "La inteligencia táctica trabaja con IOC, hashes y TTP para alimentar la detección y respuesta inmediata.", "nota": ""}, {"n": 34, "q": "¿Qué protocolo se describe como la versión segura para la transferencia de datos de hipertexto, implementando funciones de confidencialidad e integridad mediante cifrado?", "o": ["SMTP.", "HTTP.", "HTTPS.", "FTP."], "c": [2], "e": "HTTPS añade cifrado TLS/SSL a HTTP, garantizando confidencialidad e integridad de la comunicación.", "nota": ""}, {"n": 35, "q": "Según el Centro Nacional de Inteligencia (CNI) de España, ¿de cuántas fases se compone su ciclo de inteligencia simplificado?", "o": ["De 3 fases: recolección, análisis e identificación.", "De 5 fases: planificación, recopilación, procesamiento, análisis y difusión.", "De 6 fases, incluyendo evaluación y retroalimentación.", "De 4 fases: dirección, obtención, elaboración y difusión."], "c": [3], "e": "Así lo describe el propio CNI en su página institucional: dirección, obtención, elaboración y difusión.", "nota": ""}, {"n": 36, "q": "¿Qué función desempeña un Initial Access Broker?", "o": ["Diseñar campañas de desinformación en redes sociales.", "Negociar el pago de rescates con las víctimas.", "Proveer soporte técnico gratuito a las empresas víctimas para restaurar sus copias de seguridad.", "Obtener accesos ilícitos a sistemas y comercializarlos con otros actores criminales."], "c": [3], "e": "Es el eslabón de la cadena de valor criminal especializado en conseguir un primer acceso a una red y venderlo a otros grupos (ej. operadores de ransomware) que lo explotan después.", "nota": ""}, {"n": 37, "q": "¿Cuál es la motivación predominante del crimen organizado digital?", "o": ["Altruista — donar los fondos obtenidos a causas benéficas y sin ánimo de lucro.", "Ideológica — actuar en defensa de una causa política.", "Personal — búsqueda de reconocimiento en comunidades hacker.", "Económica — obtener beneficio financiero directo."], "c": [3], "e": "El ánimo de lucro es el motor principal del crimen organizado, a diferencia del hacktivismo (ideológico) o los script kiddies (reconocimiento).", "nota": ""}, {"n": 38, "q": "¿Cuál es el objetivo de un mixer?", "o": ["Dificultar el rastreo del origen y destino de los fondos mezclando múltiples transacciones.", "Incrementar la velocidad de validación de los bloques.", "Generar claves privadas automáticamente a partir de nombres de usuarios y contraseñas.", "Convertir criptomonedas en moneda fiduciaria."], "c": [0], "e": "Los mixers (o tumblers) mezclan fondos de múltiples usuarios/transacciones para romper la trazabilidad on-chain entre origen y destino, dificultando el seguimiento financiero.", "nota": ""}, {"n": 39, "q": "¿Qué función cumplen los negociadores criminales?", "o": ["Asesorar legalmente a la empresa afectada para que deduzca el importe del rescate de sus impuestos.", "Mantener la comunicación con la víctima para maximizar la probabilidad de cobro del rescate.", "Gestionar las campañas de phishing iniciales.", "Blanquear los beneficios mediante criptomonedas."], "c": [1], "e": "Son el rol especializado de la cadena de valor del ransomware que negocia directamente con la víctima (chat de extorsión) para presionar y maximizar el cobro del rescate.", "nota": ""}, {"n": 40, "q": "La técnica de ingeniería social que se realiza específicamente a través de códigos QR manipulados se conoce como:", "o": ["Vishing.", "Quishing.", "Qr-phishing.", "Phishing."], "c": [1], "e": "\"Quishing\" (QR + phishing): usa códigos QR falsos/manipulados para dirigir a la víctima a webs fraudulentas o malware.", "nota": ""}, {"n": 41, "q": "Para delimitar si una colección de imágenes de menores constituye delito de MASI frente a producciones exentas de relevancia penal, ¿qué elemento resulta decisivo?", "o": ["La finalidad sexual que objetivamente presenta el material representado, diferenciándola de otros contextos legítimos como el artístico, educativo o científico.", "El formato o medio técnico utilizado para su distribución.", "Únicamente la edad aparente que manifieste la víctima.", "La calidad y resolución técnica de la imagen."], "c": [0], "e": "El Código Penal exige que el material represente de forma objetivamente sexual a menores, lo que lo distingue de contenido legítimo (médico, familiar, artístico...).", "nota": ""}, {"n": 42, "q": "Según el artículo 282 bis.6 LECrim, ¿cuándo necesita autorización judicial el agente encubierto informático?", "o": ["Siempre que navegue por Internet.", "Cuando utilice un alias o nickname.", "Cuando acceda a canales cerrados de comunicación.", "Siempre que consulte información publicada en redes sociales."], "c": [2], "e": "La autorización judicial específica se exige al acceder a espacios cerrados con expectativa de privacidad, no en la navegación abierta.", "nota": ""}, {"n": 43, "q": "¿Cuál es la principal justificación jurídica para exigir autorización judicial en los canales cerrados de comunicación?", "o": ["La obligación de obtener autorización judicial para cualquier actividad policial realizada en Internet.", "La obligación de identificar previamente a todos los participantes del foro.", "La protección del derecho al secreto de las comunicaciones y de la expectativa de privacidad de los usuarios.", "La necesidad de controlar el uso de programas informáticos por parte de la policía judicial."], "c": [2], "e": "En canales cerrados existe expectativa de privacidad amparada por el art. 18.3 CE (secreto de las comunicaciones).", "nota": ""}, {"n": 44, "q": "¿Qué se entiende por normativa e-evidence y cuál es su marco territorial de aplicación?", "o": ["Es una ley federal de los Estados Unidos aprobada para regular las evidencias fotográficas presentadas en juicios presenciales de ese país.", "Un desarrollo reglamentario de la Convención de NNUU sobre lucha contra ciberdelincuencia que entrará en vigor al mismo tiempo que dicha Convención y que por tanto será aplicable a cualquier país del mundo.", "Un documento que complementa la Convención de Budapest en los aspectos relativos a cooperación internacional y que puede ser ratificado por cualquier país miembro del Consejo de Europa.", "Se integra por una Directiva y un Reglamento y regula las órdenes europeas de conservación y entrega de datos informáticos almacenados. Es de aplicación únicamente en el ámbito de la Unión Europea."], "c": [3], "e": "Reglamento (UE) 2023/1543 y Directiva (UE) 2023/1544: crean las órdenes europeas de entrega (EPOC) y conservación (EPOC-PR) de prueba electrónica, aplicables en la UE.", "nota": ""}, {"n": 45, "q": "¿A qué nos referimos al hablar de preservación de datos?", "o": ["Es una herramienta procesal que nos permite reclamar la entrega inmediata, con carácter cautelar, de datos de abonado y de tráfico relacionados con un ciberdelito y tenerlos a nuestra disposición por si los necesitamos para la investigación posterior.", "Es el borrado automático e irreversible de todo archivo o registro digital para impedir que sea alterado o infectado por un virus informático.", "Tiene por objeto intervenir en el curso de una comunicación para obtener los datos de tráfico y de contenido a medida que se vayan generando.", "Es una medida cautelar que permite obligar a terceros que tienen a su disposición datos informáticos almacenados a conservarlos y protegerlos bajo su custodia durante un periodo de 90 días renovables, en tanto se obtienen las autorizaciones necesarias para solicitar su entrega a efectos de su incorporación a un proceso."], "c": [3], "e": "Orden cautelar (art. 588 octies LECrim): obliga a conservar los datos 90 días renovables mientras se tramita la autorización para acceder a ellos.", "nota": ""}, {"n": 46, "q": "¿Qué caracteriza la actividad de ciberpatrullaje?", "o": ["La infiltración policial en cualquier comunidad virtual mediante una identidad ficticia.", "La observación y rastreo en espacios abiertos de Internet sin necesidad de autorización judicial.", "El intercambio de archivos ilícitos con autorización judicial.", "La participación del agente en foros privados de la red."], "c": [1], "e": "Vigilancia y rastreo de fuentes abiertas, sin expectativa de privacidad, por lo que no requiere autorización judicial.", "nota": ""}, {"n": 47, "q": "¿Qué caracteriza al modelo Ransomware-as-a-Service?", "o": ["La víctima paga una suscripción mensual para evitar ser atacada en el futuro.", "Cada afiliado desarrolla su propio malware de forma independiente.", "El ransomware únicamente puede ser utilizado por grupos patrocinados por Estados.", "Los desarrolladores proporcionan la infraestructura y los afiliados ejecutan los ataques compartiendo los beneficios."], "c": [3], "e": "El desarrollador crea y mantiene el malware/plataforma; el afiliado ejecuta la intrusión y ambos se reparten el rescate obtenido.", "nota": ""}, {"n": 48, "q": "¿Qué característica define mejor la zona gris?", "o": ["La incapacidad técnica de atribuir un ataque a su autor real.", "El uso exclusivo de cables submarinos sin conexión a satélites para ejecutar ataques de denegación de servicio.", "La ambigüedad deliberada entre actor independiente y proxy estatal, que permite al estado beneficiarse sin asumir responsabilidad.", "La ausencia de legislación aplicable a los ciberdelitos transnacionales."], "c": [2], "e": "Un Estado utiliza o tolera a actores formalmente independientes que actúan a su favor, obteniendo así negación plausible.", "nota": ""}, {"n": 49, "q": "¿Qué significan las siglas CVE en el ámbito de la identificación de fallos de seguridad?", "o": ["Cyber Victim Evaluation.", "Common Vulnerabilities and Exposures.", "Centralized Vulnerability Engine.", "Critical Virus Entry."], "c": [1], "e": "Sistema estándar (MITRE) que asigna un identificador único a cada vulnerabilidad conocida y públicamente divulgada.", "nota": ""}, {"n": 50, "q": "¿Qué efecto jurídico produce la concurrencia de circunstancias agravantes específicas (como la vulnerabilidad de la víctima o la pertenencia a organización criminal) en los delitos de MASI?", "o": ["La pertenencia a organización criminal absorbe las demás circunstancias concurrentes.", "Las agravantes solo afectan a la fase de ejecución de la pena pero no a su tipificación.", "Solo puede aplicarse una única agravante para evitar la doble sanción.", "La concurrencia de varias circunstancias expresamente previstas por el legislador como agravantes específicas puede determinar una respuesta penal más intensa, al incrementar el desvalor de la conducta y la especial afectación de la víctima."], "c": [3], "e": "Cada agravante responde a un fundamento distinto y pueden operar de forma acumulativa, respetando las reglas generales del concurso.", "nota": ""}, {"n": 51, "q": "Al diseñar la estrategia de interrupción del delito en la red, ¿qué criterio debe regir la elección entre la retirada de contenidos y el bloqueo de acceso?", "o": ["Aplicar la retirada de contenidos únicamente cuando lo solicite el proveedor de servicios.", "Ejecutar siempre el bloqueo por ser una medida técnica de mayor inmediatez.", "La estrategia debe adaptarse al lugar de alojamiento y a la naturaleza del servicio, priorizando la retirada efectiva del contenido cuando resulte posible y reservando el bloqueo para aquellos supuestos en los que la retirada no pueda materializarse.", "Limitar la retirada a los contenidos alojados en servidores nacionales."], "c": [2], "e": "La retirada elimina el contenido en origen; el bloqueo es una medida más limitada (eludible) que se reserva cuando la retirada no es posible.", "nota": ""}, {"n": 52, "q": "¿Qué principios de seguridad se ven afectados por una exfiltración de datos?", "o": ["Integridad y disponibilidad.", "Confidencialidad y autenticación.", "Confidencialidad y disponibilidad.", "Integridad y no repudio."], "c": [2], "e": "Vulnera la confidencialidad (divulgación no autorizada) y, en ataques combinados con extorsión/borrado, también la disponibilidad de esos datos.", "nota": ""}, {"n": 53, "q": "¿Qué protege realmente la ciberseguridad?", "o": ["Los edificios donde se alojan los sistemas.", "Los programas informáticos exclusivamente.", "Los ordenadores y servidores exclusivamente.", "La información contenida en los sistemas."], "c": [3], "e": "Sistemas, programas y hardware son solo el soporte; el activo realmente protegido es la información (confidencialidad, integridad, disponibilidad).", "nota": ""}, {"n": 54, "q": "¿Qué principio se ve afectado principalmente en un ataque de denegación de servicio?", "o": ["Autenticación.", "Integridad.", "Confidencialidad.", "Disponibilidad."], "c": [3], "e": "Un DoS/DDoS satura recursos para impedir el acceso legítimo, sin robar ni alterar información: ataca la disponibilidad.", "nota": ""}, {"n": 55, "q": "Se desea configurar una regla de formato condicional avanzado mediante una fórmula para que Excel \"pinte\" o resalte automáticamente todos los accesos realizados en fin de semana (sábados y domingos). ¿Cuál es la instrucción matemática correcta tomando como referencia la celda cronológica B2?", "o": ["DIASEM(B2;2)", "RESIDUO(B2;10);10.", "6.", "\"Fin de semana\")).", "DIASEM(B2;2)>5.", "SI(Y(B2"], "c": [4], "e": "Con tipo 2, DIASEM numera lunes=1...domingo=7, así que sábado=6 y domingo=7, los únicos valores >5.", "nota": "El documento original muestra las opciones de esta pregunta fragmentadas (parece una fórmula de Excel partida). La opción marcada como correcta es la e): =DIASEM(B2;2)>5."}, {"n": 56, "q": "Al diseñar una Tabla Dinámica para la analítica macroscópica de una red de blanqueo, ¿a qué cuadrante específico se deben arrastrar los campos alfanuméricos de control (como el \"IBAN\" o el \"País\") para obtener un listado unívoco de objetivos en el eje vertical?", "o": ["Al Cuadrante de Filtros.", "Al Cuadrante de Filas.", "Al Cuadrante de Valores.", "Al Cuadrante de Columnas."], "c": [1], "e": "El área de \"Filas\" genera el listado único de cada valor distinto de un campo, en el eje vertical.", "nota": ""}, {"n": 57, "q": "Con el fin de evitar la desorientación al hacer scroll vertical en un log masivo y mantener siempre visible la contextualización de los campos (cabeceras), ¿qué ruta técnica se debe seguir?", "o": ["Pestaña Insertar > Tabla dinámica > Abrir en nueva hoja.", "Pestaña Vista > Inmovilizar > Inmovilizar fila superior.", "Pestaña Inicio > Formato condicional > Nueva regla.", "Pestaña Datos > Filtro > Ordenar de más antiguo a más reciente."], "c": [1], "e": "\"Inmovilizar fila superior\" mantiene siempre visibles las cabeceras mientras se hace scroll por el listado.", "nota": ""}, {"n": 58, "q": "En el contexto de las causas que favorecen la ciberdelincuencia, ¿qué se entiende por «lucha asimétrica»?", "o": ["La dificultad de coordinar actuaciones entre organismos públicos y empresas privadas.", "La desigual distribución de recursos entre las unidades policiales centrales y las unidades territoriales, lo cual contribuye a que algunas organizaciones delictivas actúen con impunidad.", "La existencia de diferencias legislativas entre los distintos Estados en materia de ciberdelincuencia dado que las penas de prisión son distintas en función de la legislación aplicable.", "La situación de desventaja de los operadores de seguridad frente a delincuentes que aprovechan el anonimato, la globalidad de Internet y herramientas tecnológicas accesibles para cometer delitos con escaso riesgo."], "c": [3], "e": "El delincuente actúa con anonimato, sin fronteras y bajo riesgo, mientras el defensor opera con marcos legales y recursos limitados: ese desequilibrio es la asimetría.", "nota": ""}, {"n": 59, "q": "Según las últimas tendencias en el ámbito ciber, ¿qué elemento favorece especialmente la industrialización del fraude mediante inteligencia artificial?", "o": ["La imposibilidad de adaptar contenidos a diferentes idiomas.", "La obligación de utilizar infraestructuras propias para alojar campañas fraudulentas.", "La capacidad de hacer engaños más dirigidos, realistas, escalables y rentables con un menor coste operativo.", "La necesidad de contar con elevados conocimientos de programación para conseguir un entorno más confiable."], "c": [2], "e": "La IA mejora simultáneamente calidad (realismo), escala y rentabilidad del engaño, reduciendo el coste por ataque.", "nota": ""}, {"n": 60, "q": "Ámbito de aplicación de la Convención de Budapest contra la Ciberdelincuencia", "o": ["Es un documento que únicamente vincula a los países miembros de la UE.", "Es un tratado bilateral exclusivo redactado entre España y Estados Unidos para regular únicamente la extradición de piratas informáticos.", "Es un documento aprobado por la Asamblea General de NNUU y de aplicación universal.", "Aunque es un documento elaborado en el seno del Consejo de Europa tiene vocación de universalidad y en la actualidad lo han ratificado más de 80 países de distintas zonas geográficas que son por tanto Estados Parte y se encuentran vinculados al mismo, entre ellos buena parte de los países latinoamericanos."], "c": [3], "e": "Nació en el Consejo de Europa pero con vocación universal: más de 80 Estados Parte de distintas regiones, incluida buena parte de Latinoamérica.", "nota": ""}, {"n": 61, "q": "¿Por qué resulta difícil investigar amenazas internas?", "o": ["Porque los insiders utilizan herramientas de cifrado avanzadas que impiden el rastreo forense.", "Porque la policía requiere una orden judicial firmada por la Interpol para inspeccionar cualquier ordenador dentro de una empresa privada.", "Porque sus acciones son indistinguibles del uso legítimo del sistema y tienen acceso autorizado desde el principio.", "Porque la legislación española no contempla sanciones para empleados que filtran información."], "c": [2], "e": "Es indistinguible del uso legítimo porque el insider ya cuenta con acceso autorizado desde el principio; el reto no es entrar, sino diferenciar un uso normal de uno abusivo.", "nota": ""}, {"n": 62, "q": "¿Por qué las organizaciones criminales cibernéticas son resilientes?", "o": ["Porque se estructuran como cadenas de valor especializadas: desarticular un nodo no destruye el resto de la red.", "Porque sus miembros utilizan identidades falsas imposibles de rastrear.", "Porque utilizan servidores mecánicos inmunes a cualquier tipo de intervención judicial o corte de electricidad.", "Porque operan exclusivamente desde jurisdicciones sin acuerdos de extradición."], "c": [0], "e": "Al estructurarse como cadenas de valor con roles especializados e intercambiables, desarticular un nodo (p. ej. un proveedor de acceso) no destruye el resto de la red.", "nota": ""}, {"n": 63, "q": "¿Por qué es importante la reputación en los mercados clandestinos?", "o": ["Porque sustituye a los mecanismos de autenticación multifactor.", "Porque genera confianza entre delincuentes en ausencia de mecanismos legales de protección contractual.", "Porque la policía otorga inmunidad penal a los vendedores con valoraciones de cinco estrellas.", "Porque permite reducir el consumo de criptomonedas durante las transacciones."], "c": [1], "e": "En mercados sin protección contractual legal, la reputación (valoraciones, historial) sustituye a los mecanismos de confianza del comercio lícito.", "nota": ""}, {"n": 64, "q": "¿Por qué las investigaciones financieras son especialmente eficaces contra organizaciones criminales?", "o": ["Porque congelan de forma inmediata y automática las billeteras digitales sin requerir análisis de cadena de bloques.", "Porque permiten identificar automáticamente a todos los integrantes de una organización.", "Porque dificultan la monetización de los beneficios ilícitos y permiten seguir el rastro económico de la actividad criminal.", "Porque sustituyen completamente a la investigación técnica."], "c": [2], "e": "Atacan el eslabón económico: dificultan monetizar/blanquear el botín y permiten seguir el rastro del dinero hasta los responsables.", "nota": ""}, {"n": 65, "q": "¿Cuál es el principal valor de la cooperación internacional frente al cibercrimen?", "o": ["Coordinar la respuesta operativa y judicial entre jurisdicciones, ya que los actores operan globalmente y ningún país puede actuar solo.", "Unificar los códigos penales de todos los países miembros para sancionar igual los mismos delitos.", "Crear bases de datos compartidas de malware para mejorar la detección automática.", "Asignar a un único país el control y monitoreo exclusivo de todo el tráfico de Internet global."], "c": [0], "e": "Como el cibercrimen opera sin fronteras, ningún país puede perseguirlo solo: hace falta coordinar la respuesta operativa y judicial entre jurisdicciones.", "nota": ""}, {"n": 66, "q": "¿Qué efecto principal produce el Crime-as-a-Service?", "o": ["Aumenta la sofisticación técnica necesaria para ejecutar ataques.", "Reduce el umbral de entrada al cibercrimen al permitir ejecutar ataques sofisticados sin conocimiento técnico propio.", "Limita el cibercrimen a grupos con financiación estatal.", "Erradica el uso de ransomware al obligar a los ciberdelincuentes a operar sin fines lucrativos."], "c": [1], "e": "El CaaS permite ejecutar ataques sofisticados alquilando capacidades ya hechas, sin necesitar conocimiento técnico propio, reduciendo así la barrera de entrada al cibercrimen.", "nota": ""}, {"n": 67, "q": "¿Qué se entiende por «Credential Stuffing» en el contexto de la automatización de ataques?", "o": ["Un método de encriptación de datos.", "La creación de contraseñas aleatorias por parte de la IA.", "Ataques masivos utilizando credenciales previamente robadas para intentar acceder a múltiples servicios.", "El robo físico de contraseñas escritas en papel."], "c": [2], "e": "El credential stuffing prueba de forma automatizada credenciales robadas en un servicio contra otros muchos servicios, aprovechando la reutilización de contraseñas.", "nota": ""}, {"n": 68, "q": "¿Qué tecnología se destaca en las fuentes como un «multiplicador de riesgos» y acelerador del cibercrimen?", "o": ["La realidad aumentada.", "La Inteligencia Artificial.", "El Blockchain.", "La computación cuántica."], "c": [1], "e": "La Inteligencia Artificial se señala como el principal multiplicador de riesgos y acelerador actual del cibercrimen, al automatizar, personalizar y escalar los ataques.", "nota": ""}, {"n": 69, "q": "En el delito de grooming o embaucamiento de menores (art. 183 ter CP), ¿es imprescindible que se haya propuesto o llegado a celebrar un encuentro presencial?", "o": ["Sí, el delito exige la propuesta expresa de encuentro físico entre autor y víctima.", "Solo se sanciona si concurre además empleo de violencia o intimidación.", "La ausencia de propuesta presencial convierte la conducta en un acto preparatorio impune.", "El supuesto ilustra precisamente la finalidad preventiva del delito de grooming, que adelanta la protección penal frente a determinados procesos de captación dirigidos a facilitar la futura explotación sexual del menor, aunque el encuentro finalmente no llegue a celebrarse."], "c": [3], "e": "El grooming es un delito de anticipación de la barrera penal: sanciona ya la captación, sin exigir que el encuentro presencial llegue a materializarse.", "nota": ""}, {"n": 70, "q": "Desde el punto de vista del tipo penal de tenencia o posesión de material de abuso sexual infantil (MASI), ¿cuál es el criterio determinante para apreciar la existencia de «posesión»?", "o": ["Lo determinante no es el soporte material donde se encuentren los archivos, sino la existencia de conocimiento, disponibilidad y control efectivo sobre el contenido ilícito.", "La responsabilidad es del proveedor de servicios de almacenamiento en la nube por albergar los servidores.", "Que el soporte de almacenamiento esté ubicado en el domicilio del sujeto activo.", "Que los archivos se encuentren almacenados físicamente en el disco duro o soporte material del investigado."], "c": [0], "e": "Lo decisivo es el conocimiento, disponibilidad y control efectivo sobre el contenido, no el soporte físico concreto donde esté guardado.", "nota": ""}, {"n": 71, "q": "¿Cuál es la metodología correcta para abordar la calificación jurídica cuando se realizan distintas conductas delictivas en un mismo entorno operativo?", "o": ["Considerar irrelevantes los actos preparatorios una vez consumada la conducta principal.", "Aplicar de forma directa el delito que lleve aparejada la pena de mayor gravedad.", "Antes de determinar la calificación jurídica resulta imprescindible identificar cada conducta típica realizada, el bien jurídico afectado y la relación existente entre ellas, para decidir posteriormente si concurre un concurso de normas o un concurso de delitos.", "Integrar todas las actuaciones en un único delito si existe una motivación económica de fondo."], "c": [2], "e": "Antes de calificar hay que aislar cada conducta típica, el bien jurídico que lesiona y su relación con las demás, para decidir después si hay concurso de normas o de delitos.", "nota": ""}, {"n": 72, "q": "Una funcionaria consulta bases de datos para fines ajenos a sus funciones. ¿Cuál es la principal enseñanza del caso analizado?", "o": ["Todo acceso indebido constituye automáticamente un delito.", "Las credenciales legítimas permiten cualquier consulta.", "No todo incidente de seguridad constituye un delito.", "Toda conducta irregular termina en condena penal."], "c": [2], "e": "El caso enseña que no todo incidente de seguridad (uso irregular de credenciales) alcanza automáticamente relevancia penal: hay que valorar cada elemento del tipo.", "nota": ""}, {"n": 73, "q": "¿Qué delito puede relacionarse habitualmente con un ataque de denegación de servicio?", "o": ["Apropiación indebida.", "Descubrimiento y revelación de secretos.", "Falsedad documental.", "Daños informáticos."], "c": [3], "e": "El art. 264 bis CP (daños informáticos) tipifica precisamente obstaculizar o interrumpir el funcionamiento de un sistema, que es justo lo que produce un DoS.", "nota": ""}, {"n": 74, "q": "¿Cuál de los siguientes factores puede dar lugar a la materialización de un riesgo?", "o": ["Doble factor de autenticación.", "Uso indebido de privilegios.", "Segmentación de red.", "Existencia de copias de seguridad."], "c": [1], "e": "El uso indebido de privilegios por quien ya tiene acceso legítimo es un factor que puede materializar un riesgo, a diferencia de controles defensivos como el MFA o las copias de seguridad.", "nota": ""}, {"n": 75, "q": "Dentro de las reglas de sintaxis analítica en Excel, ¿qué función cumple el operador de inicio (=)?", "o": ["Delimita el ámbito de actuación perimetral de una ecuación.", "Funciona como separador estándar de los argumentos en las versiones en castellano.", "Actúa como una ventana de auditoría para verificar si el dato es en bruto o procesado.", "Indica al software que la celda no contiene un texto plano, sino una instrucción matemática o lógica que debe ejecutarse de manera dinámica."], "c": [3], "e": "El signo “=” indica a Excel que lo que sigue no es texto plano, sino una fórmula/instrucción que debe calcularse dinámicamente.", "nota": ""}, {"n": 76, "q": "En un análisis de ciberseguridad sobre ataques de denegación de servicio (DoS) reflejados en un log de conexiones IP, ¿qué función se debe calibrar explícitamente en la «Configuración de campo de valor» para determinar el volumen exacto de intentos de intrusión lanzados por cada nodo?", "o": ["Función SUMA.", "Función MÁXIMO.", "Función PROMEDIO.", "Función RECUENTO / CUENTA."], "c": [3], "e": "Para saber cuántos intentos (filas) lanzó cada nodo, la función de resumen adecuada es Recuento/Cuenta, no una suma ni un promedio de valores.", "nota": ""}, {"n": 77, "q": "¿Qué función de text parsing es la técnicamente idónea para realizar una segmentación interna y flexible de una celda, permitiendo extraer una longitud de texto determinada (como los octetos intermedios de una IP) desde cualquier coordenada intermedia?", "o": ["DERECHA(texto; número_caracteres).", "SI(Y(rango)).", "IZQUIERDA(texto; número_caracteres).", "EXTRAE(texto; posición_inicial; número_caracteres)."], "c": [3], "e": "EXTRAE() permite tomar un número determinado de caracteres desde cualquier posición intermedia de la cadena, a diferencia de IZQUIERDA/DERECHA que solo cortan desde los extremos.", "nota": ""}, {"n": 78, "q": "El término «defacement» hace referencia a:", "o": ["La difusión de campañas de desinformación.", "La suplantación de identidad en redes sociales.", "El secuestro de servidores en la nube.", "La modificación no autorizada del aspecto visual de un sitio web."], "c": [3], "e": "Defacement es la alteración no autorizada del aspecto visual de una web, típicamente para dejar un mensaje reivindicativo.", "nota": ""}, {"n": 79, "q": "¿Cuál es una de las funciones de la Policía Judicial en materia de ciberdelincuencia?", "o": ["Comercializar herramientas de ciberseguridad.", "Desarrollar sistemas operativos seguros.", "Autorizar registros judiciales.", "Investigar la actividad criminal y obtener pruebas."], "c": [3], "e": "La Policía Judicial investiga la actividad criminal y recaba las pruebas necesarias para el proceso, bajo la dirección del juez o el fiscal.", "nota": ""}, {"n": 80, "q": "Según la jurisprudencia del Tribunal Supremo, los contactos previos entre el agente infiltrado y el investigado:", "o": ["Solo son válidos cuando el investigado desconoce en todo momento la identidad del agente.", "Invalidan automáticamente la posterior autorización como agente encubierto.", "Constituyen siempre provocación delictiva.", "Son admisibles siempre que no impliquen una provocación al delito, ya que permiten constatar la existencia del delito y sirven de base para la autorización del agente encubierto."], "c": [3], "e": "Son admisibles si no constituyen provocación al delito, ya que sirven para constatar que el delito existe y fundamentan la posterior autorización judicial del agente encubierto.", "nota": ""}, {"n": 81, "q": "¿Qué autorización requiere el agente encubierto informático para intercambiar o enviar archivos ilícitos?", "o": ["Requiere una autorización específica y motivada del juez, distinta de la autorización genérica para actuar como AEV.", "La autorización genérica para actuar como AEV lleva implícita esta posibilidad.", "Basta con la autorización del proveedor de servicios de Internet.", "No requiere autorización judicial cuando los archivos ya hayan sido compartidos previamente por el investigado."], "c": [0], "e": "Intercambiar o enviar archivos ilícitos exige una autorización judicial específica y motivada, distinta y adicional a la autorización genérica para actuar como agente encubierto informático.", "nota": ""}, {"n": 82, "q": "¿Cuál es el criterio seguido por el Tribunal Supremo respecto de las pruebas obtenidas por agentes encubiertos de otro país?", "o": ["Solo pueden ser utilizadas si el agente extranjero obtiene previamente autorización de un juez español.", "Son válidas conforme al principio de no indagación, salvo vulneración patente de derechos fundamentales.", "Carecen siempre de valor probatorio.", "Deben repetirse íntegramente en España."], "c": [1], "e": "Rige el principio de no indagación: se presumen válidas salvo que se aprecie una vulneración patente de derechos fundamentales en su obtención.", "nota": ""}, {"n": 83, "q": "¿Será posible pedir y obtener directamente la entrega de datos de contenido de un prestador de servicios a través de la emisión de una orden de producción dictada en el marco del Reglamento e-evidence?", "o": ["Sí, pero únicamente si el investigado da su consentimiento por escrito aceptando voluntariamente la entrega de sus propios archivos.", "No, en ningún caso. Se trata de datos muy sensibles cuya entrega exige la intervención de un órgano jurisdiccional del país en el que se encuentra el prestador de servicio.", "Sí, en todo caso y sin limitación alguna.", "Sí, pero solo en los supuestos en los que el delito investigado tenga prevista una pena máxima de al menos tres años de privación de libertad o se trate de un delito de los definidos en determinadas Directivas UE."], "c": [3], "e": "El Reglamento e-evidence solo permite la orden de entrega de datos de contenido para delitos con pena máxima de al menos tres años, o los expresamente definidos en determinadas Directivas UE.", "nota": ""}, {"n": 84, "q": "¿Qué posibilidades de actuación ofrece la red 24/7 regulada en el art. 35 de la Convención de Budapest?", "o": ["Es un servicio de soporte telefónico gratuito abierto a cualquier ciudadano para denunciar estafas de comercio electrónico y tramitar la devolución de su dinero.", "Es una red de puntos de contacto para la tramitación de extradiciones.", "Es una red de puntos de contacto policiales cuya única función es facilitar información de apoyo sobre la tramitación de medidas de cooperación internacional.", "Además de constituir un excelente canal de asesoramiento técnico, desempeña una función esencial entre los países miembros de la Convención de Budapest a efectos de la preservación de datos informáticos almacenados en otros Estados."], "c": [3], "e": "La red 24/7 del art. 35 de Budapest no es solo un canal de asesoramiento técnico: cumple una función esencial para la preservación urgente de datos informáticos almacenados en otros Estados.", "nota": ""}, {"n": 85, "q": "Objetivos, contenido y alcance de la Convención de Budapest:", "o": ["El Convenio de Budapest no presta atención a las normas procesales y de investigación de los ordenamientos jurídicos de los Estados; únicamente pretende facilitar el entendimiento entre los encargados de la investigación de los distintos países, sean cuales sean los respectivos procedimientos internos.", "Es un Convenio dedicado a facilitar la transmisión entre Estados de procedimientos penales sobre ciberdelitos y por ello se ocupa esencialmente de definir tipos penales.", "Mejorar la capacidad de actuación frente a la ciberdelincuencia a partir de la armonización de las legislaciones internas de los Estados y la mejora de la cooperación internacional. A dicho fin, en la Convención se definen herramientas legales de carácter penal-sustantivo y procesal y mecanismos para impulsar y fomentar la cooperación entre los Estados en esta materia.", "Su principal objetivo es unificar las tarifas de conexión a Internet a nivel mundial y regular comercialmente a las grandes plataformas de redes sociales."], "c": [2], "e": "El Convenio busca armonizar legislaciones y mejorar la cooperación internacional, definiendo herramientas penal-sustantivas y procesales, no solo facilitar el entendimiento informal.", "nota": ""}, {"n": 86, "q": "¿Qué ventaja aporta la especialización criminal?", "o": ["Garantiza que los ataques no dejen huellas en los registros del sistema operativo objetivo.", "Reduce la necesidad de cooperación entre delincuentes.", "Incrementa la eficiencia operativa al distribuir funciones entre actores especializados.", "Elimina el riesgo de identificación policial."], "c": [2], "e": "Especializarse por roles (desarrollador, afiliado, negociador...) incrementa la eficiencia operativa del conjunto de la organización criminal.", "nota": ""}, {"n": 87, "q": "¿Cuál es uno de los cambios de paradigma más significativos del cibercrimen actual?", "o": ["El paso de hackers individuales a organizaciones con estructuras de multinacionales.", "La centralización de todos los ataques en una sola región.", "El fin de la ingeniería social con el uso de la IA.", "La disminución de ataques masivos debido a mejores antivirus."], "c": [0], "e": "El cambio de paradigma más relevante es el paso de hackers individuales a organizaciones estructuradas como auténticas multinacionales del crimen.", "nota": ""}, {"n": 88, "q": "¿Cuál de los siguientes sectores en España se menciona como uno de los que sufrió incidentes importantes en 2025 provocando caídas de servicios y filtraciones?", "o": ["Sector de la construcción.", "Sector sanitario.", "Sector de la moda.", "Sector agrícola."], "c": [1], "e": "El sector sanitario español se cita como uno de los golpeados por incidentes relevantes en 2025 (caídas de servicio y filtraciones de datos).", "nota": ""}, {"n": 89, "q": "En los delitos contra la libertad e indemnidad sexual de menores de edad, ¿qué eficacia jurídica tiene el consentimiento otorgado por el menor?", "o": ["El sistema penal español protege la indemnidad sexual del menor, de manera que el consentimiento carece de eficacia jurídica en los supuestos previstos por la legislación, con independencia de que haya sido exteriorizado.", "Excluye siempre la responsabilidad penal si no ha existido violencia o intimidación.", "Transforma automáticamente el hecho delictivo en una falta administrativa.", "El consentimiento del menor es válido si supera los doce años de edad."], "c": [0], "e": "El sistema penal español protege la indemnidad sexual del menor de forma que su consentimiento, aunque se haya manifestado, carece de eficacia jurídica en los supuestos previstos legalmente.", "nota": ""}, {"n": 90, "q": "¿Cuál de los siguientes principios NO forma parte de la tríada CID?", "o": ["Confidencialidad.", "Disponibilidad.", "Autenticación.", "Integridad."], "c": [2], "e": "La tríada CID es Confidencialidad, Integridad y Disponibilidad; la autenticación es un mecanismo de control de acceso, no uno de sus tres principios.", "nota": ""}, {"n": 91, "q": "¿Cuál de las siguientes afirmaciones refleja mejor una de las conclusiones de la presentación?", "o": ["Todo acceso técnicamente posible constituye un acceso legítimo.", "La existencia de indicios técnicos implica automáticamente una condena penal.", "Un incidente de seguridad puede existir sin que concurran todos los elementos necesarios para apreciar un delito.", "Todo incidente de seguridad constituye necesariamente un delito."], "c": [2], "e": "Puede existir un incidente de seguridad (uso irregular, acceso indebido) sin que concurran todos los elementos típicos necesarios para apreciar un delito.", "nota": ""}, {"n": 92, "q": "¿Cuál es el riesgo de permitir que la aplicación de hoja de cálculo gestione automáticamente el formato de las celdas como \"General\" al usar la herramienta “Texto en columnas” en datos numéricos largos que comiencen por cero?", "o": ["El truncamiento automático de los ceros situados a la izquierda, corrompiendo la literalidad e integridad del identificador delictivo.", "La aparición inmediata del error sintáctico", "La fragmentación aleatoria de la cadena alfanumérica mediante guiones de control.", "El bloqueo del libro de trabajo debido a una sobrecarga en la memoria de procesamiento."], "c": [0], "e": "Al formatear como “General” un número que empieza por cero, Excel trunca esos ceros a la izquierda, corrompiendo identificadores (IMEI, teléfonos, etc.).", "nota": ""}, {"n": 93, "q": "Cuando un analista se enfrenta a ficheros masivos de cientos de miles de filas, ¿qué combinación de teclado permite expandir la selección de manera automática desde la celda activa hasta el último registro con datos de esa columna?", "o": ["Alt + RePág.", "Ctrl + Mayús + Flechas de dirección.", "Ctrl + Clic.", "Mayús + Clic."], "c": [1], "e": "Ctrl + Mayús + Flecha de dirección expande la selección automáticamente hasta la última celda con datos de esa columna/fila.", "nota": ""}, {"n": 94, "q": "Como alternativa de alta eficiencia en entornos operativos, ¿qué atajo analítico de teclado permite activar o desactivar la función de autofiltro de manera instantánea sobre la fila o matriz de datos seleccionada?", "o": ["Ctrl + Alt + A", "Alt + Mayús + F5", "Ctrl + Mayús + L", "Ctrl + F"], "c": [2], "e": "Ctrl + Mayús + L activa o desactiva instantáneamente el autofiltro sobre el rango de datos seleccionado.", "nota": ""}, {"n": 95, "q": "¿Qué técnica de ingeniería social consiste en realizar llamadas telefónicas fraudulentas?", "o": ["Spoofing.", "Smishing.", "Vishing.", "Phishing."], "c": [2], "e": "El vishing es la variante de ingeniería social ejecutada mediante llamadas de voz (o VoIP), a diferencia del smishing (SMS) o el phishing (correo).", "nota": ""}, {"n": 96, "q": "¿Qué puede ser considerado un factor multiplicador de la ciberdelincuencia?", "o": ["La desaparición del cifrado.", "La inteligencia artificial.", "La reducción del almacenamiento en la nube.", "La limitación de las redes sociales."], "c": [1], "e": "La IA actúa como factor multiplicador porque automatiza, personaliza y escala los ataques, incrementando su volumen y eficacia.", "nota": ""}, {"n": 97, "q": "¿Cuál es la secuencia que mejor describe el modus operandi habitual de un ataque de ransomware?", "o": ["Extracción de información acceso al equipo cifrado de datos destrucción de copias de seguridad.", "Acceso al equipo extracción de la información petición de rescate cifrado de datos", "Acceso al equipo petición de rescate cifrado de datos exfiltración de información.", "Acceso al equipo → infección de la red extracción de información cifrado de datos exigencia de pago para su recuperación."], "c": [3], "e": "La secuencia típica es: acceder al equipo, infectar/moverse por la red, exfiltrar información, cifrar los datos y exigir el pago para recuperarlos (doble extorsión).", "nota": ""}, {"n": 98, "q": "¿Qué significa el término APT?", "o": ["Algoritmo Predictivo Terrestre — análisis automatizado para predecir fallos de hardware.", "Advanced Persistent Threat — amenaza avanzada y persistente con objetivos estratégicos.", "Amenaza Puntual Transnacional.", "Ataque Persistente Tecnológico."], "c": [1], "e": "APT (Advanced Persistent Threat) designa una amenaza avanzada y persistente, con objetivos estratégicos y capacidad de permanecer oculta largo tiempo en el sistema.", "nota": ""}, {"n": 99, "q": "¿Qué criterio analiza la finalidad perseguida por un actor?", "o": ["Capacidad técnica.", "Motivación.", "Ancho de banda de red.", "Nivel de organización."], "c": [1], "e": "La motivación (económica, ideológica, personal...) es el criterio que explica la finalidad última que persigue un actor con su ataque.", "nota": ""}, {"n": 100, "q": "En el ordenamiento jurídico penal español, ¿cómo se articula la protección frente a las conductas cibernéticas de captación y manipulación de menores (grooming)?", "o": ["El legislador ha adelantado la barrera de protección penal sancionando determinadas conductas de captación y manipulación del menor antes de la explotación sexual efectiva, siempre que concurran los elementos típicos previstos legalmente.", "Queda impune si la obtención de las imágenes pornográficas se realiza con el consentimiento del menor.", "Se sanciona únicamente como tenencia de material pornográfico, quedando absorbidas las acciones de captación previas.", "Exige necesariamente que se produzca un contacto físico entre el autor y la víctima para que la conducta sea penada."], "c": [0], "e": "El legislador adelanta la barrera de protección penal sancionando ya la propia captación/manipulación del menor, sin esperar a la explotación sexual efectiva.", "nota": ""}, {"n": 101, "q": "Respecto a la posesión de MASI en plataformas de almacenamiento remoto o en la nube, ¿qué requisito jurídico se exige para su tipificación?", "o": ["Exime de responsabilidad al usuario si no se ha guardado copia en un pendrive o disco duro externo.", "Exige que la visualización del archivo se realice sin conexión a Internet.", "La existencia de conocimiento, disponibilidad y control efectivo sobre los archivos permite apreciar una posesión jurídicamente relevante con independencia del soporte físico concreto donde se encuentren almacenados.", "Requiere la descarga física previa del archivo en el dispositivo local."], "c": [2], "e": "Lo relevante es el conocimiento, disponibilidad y control efectivo sobre los archivos, con independencia de que estén en la nube o en un soporte físico local.", "nota": ""}, {"n": 102, "q": "¿Cuál de las siguientes afirmaciones es correcta respecto a un ransomware?", "o": ["No suele implicar acceso previo al sistema.", "Solo afecta a la disponibilidad.", "Siempre constituye un único delito.", "Puede integrar varias conductas delictivas distintas."], "c": [3], "e": "Un ataque de ransomware suele integrar varias conductas delictivas distintas (acceso ilícito, daños informáticos, extorsión...), no un único delito aislado.", "nota": ""}, {"n": 103, "q": "¿Qué principio permite demostrar quién realizó una determinada acción sobre un sistema?", "o": ["Confidencialidad.", "Integridad.", "No repudio.", "Disponibilidad."], "c": [2], "e": "El no repudio es el principio que impide a alguien negar haber realizado una acción, permitiendo demostrar la autoría de un hecho sobre el sistema.", "nota": ""}, {"n": 104, "q": "Durante la fragmentación estructural de un archivo plano (CSV/TXT) mediante el asistente de “Texto en columnas”, ¿en qué momento se debe forzar explícitamente el formato a “Texto” para proteger los IMEIs o registros telefónicos?", "o": ["En el Paso 1, al elegir el tipo de separación por caracteres delimitados.", "En el Paso 3, seleccionando la columna crítica en la vista previa y cambiando su propiedad en “Formato de los datos en columnas”.", "En el Paso 2, al marcar la casilla correspondiente a la coma o tabulación.", "El formato no se puede forzar en el asistente; debe aplicarse una vez importados los datos."], "c": [1], "e": "Es en el paso 3 del asistente, al seleccionar la columna en la vista previa, donde se fuerza el formato “Texto” para proteger identificadores como el IMEI.", "nota": ""}, {"n": 105, "q": "¿Cuál de las siguientes conductas constituye una modalidad de explotación sexual infantil facilitada por las tecnologías de la información y las comunicaciones?", "o": ["La compraventa de software malicioso en foros clandestinos.", "El acceso ilícito a sistemas de almacenamiento en la nube.", "La distribución de propaganda extremista a través de redes sociales.", "La autogeneración de contenidos sexuales por menores inducida mediante engaño o extorsión."], "c": [3], "e": "La autogeneración de contenido sexual por el propio menor, inducida mediante engaño o extorsión, es una modalidad de explotación facilitada por las TIC.", "nota": ""}, {"n": 106, "q": "¿Cuál fue la principal novedad introducida por la Ley Orgánica 13/2015 respecto al agente encubierto informático?", "o": ["Suprimió la figura del agente encubierto tradicional.", "Incorporó el apartado 6.º al artículo 282 bis de la LECrim para regular específicamente al agente encubierto informático.", "Limitó las investigaciones encubiertas exclusivamente a delitos de terrorismo.", "Creó una nueva figura policial independiente de la investigación judicial."], "c": [1], "e": "La LO 13/2015 introdujo el apartado 6.º del art. 282 bis LECrim, regulando específicamente la figura del agente encubierto informático.", "nota": ""}, {"n": 107, "q": "Al margen de las diferencias existentes entre uno y otro, ¿cuáles son las principales semejanzas entre el Segundo Protocolo Adicional a la Convención de Budapest y la normativa e-evidence?", "o": ["En ambos instrumentos se regula, con fines de investigación criminal, la conservación y entrega de datos informáticos almacenados a disposición de proveedores de servicio que se encuentran en otros Estados. Ambos recurren a la cooperación directa con entidades del sector privado para articular todas o algunas de las herramientas de cooperación que regulan.", "Ambos instrumentos son tratados militares de la OTAN cuya única función es interceptar comunicaciones físicas y correspondencia postal ordinaria.", "En ambos instrumentos se pretende facilitar la obtención de cualquier tipo de prueba, sea o no informática, que resulte necesaria en una investigación criminal de cualquier naturaleza.", "Con independencia de las diferencias en el marco de aplicación territorial de uno y otro instrumento, el contenido, alcance y regulación de las medidas de cooperación internacional que se regulan en uno y otro es idéntico."], "c": [0], "e": "Ambos instrumentos regulan la conservación y entrega de datos informáticos almacenados por proveedores situados en otros Estados, recurriendo a la cooperación directa con el sector privado.", "nota": ""}, {"n": 108, "q": "Importancia de la cooperación internacional en la lucha contra la ciberdelincuencia", "o": ["Dadas las características de la ciberdelincuencia como fenómeno criminal que se desarrolla en el ciberespacio y no se encuentra sujeto a límites territoriales, resulta absolutamente esencial establecer herramientas de cooperación internacional seguras y eficaces que faciliten su investigación.", "La cooperación internacional resulta totalmente innecesaria gracias a que la policía local de cualquier país puede acceder legalmente y sin autorización judicial previa a servidores radicados en cualquier otro territorio.", "La cooperación internacional en esta materia se circunscribe únicamente al ámbito de la UE ya que es un espacio común de Justicia, Seguridad y Libertad.", "Es de escasa entidad ya que la soberanía de los Estados limita nuestras capacidades de actuación a la investigación de los ilícitos que se cometan dentro de sus fronteras."], "c": [0], "e": "Al no estar la ciberdelincuencia sujeta a límites territoriales, la cooperación internacional resulta absolutamente esencial para investigarla con eficacia.", "nota": ""}, {"n": 109, "q": "¿Qué caracteriza a un ataque de denegación de servicio distribuido (DDoS)?", "o": ["El cifrado de todos los archivos del usuario con demanda de rescate.", "La saturación de un servidor o red mediante múltiples fuentes de tráfico simultáneas.", "La intercepción de credenciales mediante un proxy malicioso.", "La suplantación de la identidad de un proveedor para desviar pagos."], "c": [1], "e": "Un DDoS satura un servidor o red mediante múltiples fuentes de tráfico simultáneas.", "nota": ""}, {"n": 110, "q": "¿Cuál es el principal objetivo del malware de tipo Ransomware?", "o": ["Cifrar la información del sistema afectado y exigir un rescate económico a cambio de la clave.", "Monitorear las pulsaciones de teclado de forma silenciosa para robar contraseñas.", "Abrir una puerta trasera persistente para el acceso remoto no autorizado.", "Utilizar la potencia de cálculo del equipo para minar criptomonedas."], "c": [0], "e": "El ransomware busca cifrar la información del sistema afectado y exigir un rescate económico a cambio de la clave.", "nota": ""}, {"n": 111, "q": "¿Qué define a los Infostealers o ladrones de información?", "o": ["Programas diseñados específicamente para extraer credenciales, cookies, monederos y datos sensibles de los navegadores y equipos.", "Herramientas de análisis forense utilizadas por las fuerzas de seguridad.", "Dispositivos físicos conectados para capturar tráfico de red.", "Protocolos de comunicación cifrada para la exfiltración de datos corporativos."], "c": [0], "e": "Los infostealers son programas diseñados para extraer credenciales, cookies, monederos y datos sensibles de navegadores y equipos.", "nota": ""}, {"n": 112, "q": "¿Qué es el Carding en el ámbito de la ciberdelincuencia?", "o": ["La clonación de tarjetas SIM para interceptar códigos SMS de doble factor.", "El fraude financiero basado en el uso ilícito de datos de tarjetas de crédito o débito ajenas.", "La creación de perfiles falsos en redes sociales para extorsión sexual.", "El ataque físico a cajeros automáticos mediante dispositivos skimmer."], "c": [1], "e": "El carding es el fraude financiero basado en el uso ilícito de datos de tarjetas de crédito o débito ajenas.", "nota": ""}, {"n": 113, "q": "¿Qué caracteriza al delito de descubrimiento y revelación de secretos informáticos?", "o": ["La destrucción física de soportes informáticos sin autorización.", "El acceso o interceptación sin permiso de datos reservados contenidos en un sistema informático.", "La comercialización de software pirateado sin ánimo de lucro.", "La interrupción temporal de servicios de telecomunicaciones."], "c": [1], "e": "El descubrimiento y revelación de secretos consiste en acceder o interceptar sin permiso datos reservados contenidos en un sistema informático.", "nota": ""}, {"n": 114, "q": "¿Qué es la Dark Web dentro de la estructura de Internet?", "o": ["La parte de Internet indexada por motores de búsqueda tradicionales como Google.", "Una capa de red superpuesta que requiere software específico (como Tor) para garantizar el anonimato de usuarios y servidores.", "El conjunto de bases de datos privadas de grandes corporaciones.", "Las redes sociales de uso exclusivo corporativo."], "c": [1], "e": "La Dark Web es una capa de red superpuesta que requiere software específico (como Tor) para garantizar el anonimato de usuarios y servidores.", "nota": ""}, {"n": 115, "q": "¿Qué papel desempeñan los Initial Access Brokers (IAB) en el cibercrimen actual?", "o": ["Desarrollan herramientas antivirus para proteger infraestructuras críticas.", "Se infiltran en redes corporativas para comercializar los accesos obtenidos a grupos de ransomware u otros ciberdelincuentes.", "Actúan como intermediarios legales en la negociación de rescates.", "Gestionan los servidores de nombres de dominio (DNS) legítimos."], "c": [1], "e": "Los Initial Access Brokers se infiltran en redes corporativas y comercializan esos accesos con grupos de ransomware u otros ciberdelincuentes.", "nota": ""}, {"n": 116, "q": "¿Qué significa el acrónimo TTP en ciberseguridad e inteligencia de amenazas?", "o": ["Tactical Transfer Protocol.", "Taktik, Techniques and Procedures (Tácticas, Técnicas y Procedimientos).", "Total Threat Protection.", "Transmission Terminal Process."], "c": [1], "e": "TTP son las Tácticas, Técnicas y Procedimientos que caracterizan el modus operandi de un actor de amenaza.", "nota": ""}, {"n": 117, "q": "¿Cuál es la principal característica de un ataque de Phishing clásico?", "o": ["El uso de ingeniería social a través de correos electrónicos fraudulentos para engañar a la víctima y robar credenciales o datos personales.", "La infección directa de la BIOS del equipo mediante hardware malicioso.", "El ataque por fuerza bruta contra servidores SSH expuestos.", "La interceptación de ondas Wi-Fi en espacios públicos."], "c": [0], "e": "El phishing clásico usa ingeniería social mediante correos fraudulentos para engañar a la víctima y robarle credenciales o datos personales.", "nota": ""}, {"n": 118, "q": "¿Qué es el SIM Swapping?", "o": ["El intercambio físico de tarjetas de memoria entre dispositivos móviles.", "La usurpación de identidad mediante la duplicación fraudulenta de la tarjeta SIM de la víctima ante el operador de telefonía.", "Una vulnerabilidad en los protocolos de cifrado de llamadas 5G.", "El robo de terminales móviles en la vía pública."], "c": [1], "e": "El SIM swapping es la usurpación de identidad mediante la duplicación fraudulenta de la tarjeta SIM de la víctima ante el operador de telefonía.", "nota": ""}, {"n": 119, "q": "¿Qué establece el Convenio de Budapest sobre ciberdelincuencia?", "o": ["La prohibición absoluta del uso de criptomonedas a nivel internacional.", "El primer tratado internacional diseñado para armonizar las leyes nacionales sobre delitos informáticos y mejorar la cooperación.", "Las normas técnicas para la fabricación de cortafuegos corporativos.", "El marco regulatorio para la inteligencia artificial en la Unión Europea."], "c": [1], "e": "El Convenio de Budapest es el primer tratado internacional diseñado para armonizar las leyes nacionales sobre delitos informáticos y mejorar la cooperación.", "nota": ""}, {"n": 120, "q": "¿Qué se entiende por Ingeniería Social en el contexto delictivo?", "o": ["El estudio sociológico de las bandas juveniles en entornos urbanos.", "La manipulación psicológica de las personas para inducirlas a realizar acciones o revelar información confidencial.", "Las políticas públicas de ciberseguridad ciudadana.", "El desarrollo de software educativo para la prevención del bullying."], "c": [1], "e": "La ingeniería social es la manipulación psicológica de las personas para inducirlas a realizar acciones o revelar información confidencial.", "nota": ""}, {"n": 121, "q": "¿Qué es un troyano de acceso remoto (RAT)?", "o": ["Un programa legítimo de soporte técnico corporativo.", "Un tipo de malware que se disfraza de software útil pero otorga al atacante control total y encubierto sobre el sistema infectado.", "Un protocolo seguro de conexión remota basado en certificados.", "Una herramienta de diagnóstico de redes inalámbricas."], "c": [1], "e": "Un RAT es un malware que se disfraza de software útil pero otorga al atacante control total y encubierto sobre el sistema infectado.", "nota": ""}, {"n": 122, "q": "¿Cuál es la función principal de un sistema SIEM (Security Information and Event Management)?", "o": ["Gestionar la facturación de servicios en la nube.", "Recopilar, normalizar y analizar registros (logs) de seguridad de múltiples fuentes para detectar anomalías y amenazas en tiempo real.", "Bloquear automáticamente todas las conexiones salientes de una red.", "Automatizar el cifrado de discos duros corporativos."], "c": [1], "e": "Un SIEM recopila, normaliza y analiza registros de seguridad de múltiples fuentes para detectar anomalías y amenazas en tiempo real.", "nota": ""}, {"n": 123, "q": "¿Qué caracteriza a una botnet?", "o": ["Una red de dispositivos informáticos infectados y controlados de forma remota por un ciberdelincuente (botmaster).", "Un sistema automatizado de atención al cliente en páginas web.", "Una base de datos distribuida basada en tecnología blockchain.", "Un grupo de investigación en seguridad ofensiva."], "c": [0], "e": "Una botnet es una red de dispositivos infectados y controlados de forma remota por un ciberdelincuente (botmaster).", "nota": ""}, {"n": 124, "q": "¿Qué es la cadena de custodia en una investigación digital?", "o": ["El proceso de almacenamiento físico de llaves criptográficas.", "El procedimiento documentado que garantiza la integridad, autenticidad y trazabilidad de las evidencias digitales desde su recogida hasta su análisis judicial.", "La jerarquía de mandos en una unidad de investigación policial.", "El protocolo de enrutamiento seguro entre comisarías."], "c": [1], "e": "La cadena de custodia es el procedimiento documentado que garantiza integridad, autenticidad y trazabilidad de la evidencia digital hasta su análisis judicial.", "nota": ""}, {"n": 125, "q": "¿Qué tipo de ataque representa el SQL Injection (SQLi)?", "o": ["La inserción de código malicioso en consultas de bases de datos a través de entradas vulnerables de una aplicación web.", "La alteración física de los circuitos de memoria RAM.", "El envío masivo de correos electrónicos con adjuntos infectados.", "La suplantación de certificados SSL corporativos."], "c": [0], "e": "El SQL Injection inserta código malicioso en consultas de bases de datos aprovechando entradas vulnerables de una aplicación web.", "nota": ""}, {"n": 126, "q": "¿Cuáles son algunas de las propiedades o dimensiones clave de la seguridad de la información?", "o": ["Velocidad, almacenamiento y conectividad.", "Rentabilidad, escalabilidad y usabilidad.", "Confidencialidad y disponibilidad.", "Centralización, jerarquía y burocracia."], "c": [2], "e": "Confidencialidad y disponibilidad (junto con la integridad) son dimensiones clave de la seguridad de la información.", "nota": ""}, {"n": 127, "q": "¿Qué diferencia principal existe entre un virus y un gusano informático?", "o": ["El virus requiere la intervención del usuario o la ejecución de un archivo huésped para propagarse, mientras que el gusano se propaga de forma autónoma por la red.", "El gusano solo afecta a dispositivos móviles y el virus a ordenadores.", "No existe ninguna diferencia técnica entre ambos.", "El virus siempre va acompañado de ransomware y el gusano no."], "c": [0], "e": "El virus necesita la intervención del usuario o un archivo huésped para propagarse; el gusano se propaga de forma autónoma por la red.", "nota": ""}, {"n": 128, "q": "¿Qué es un ataque de denegación de servicio (DoS)?", "o": ["La intrusión en una base de datos privada para extraer información confidencial.", "Una acción que impide a los usuarios legítimos acceder a un sistema informático, servicio o recurso de red.", "La interceptación de comunicaciones inalámbricas encriptadas.", "El borrado accidental de archivos del sistema operativo."], "c": [1], "e": "Un DoS es una acción que impide a los usuarios legítimos acceder a un sistema, servicio o recurso de red.", "nota": ""}, {"n": 129, "q": "¿Qué caracteriza al delito de estafa informática según el Código Penal español?", "o": ["El uso de violencia física contra las personas para obtener claves bancarias.", "La manipulación informática u otros artificios semejantes con ánimo de lucro para conseguir una transferencia no consentida en perjuicio ajeno.", "La mera difusión de noticias falsas en redes sociales.", "El impago de servicios contratados a través de Internet."], "c": [1], "e": "La estafa informática exige manipulación informática u otro artificio semejante, con ánimo de lucro, para lograr una transferencia no consentida en perjuicio ajeno.", "nota": ""}, {"n": 130, "q": "¿Qué es la ciberinteligencia táctica?", "o": ["La planificación estratégica a largo plazo de las políticas de defensa nacional.", "La información técnica sobre amenazas específicas y recientes (como hashes, IOCs y TTPs) orientada a la detección y respuesta inmediata.", "El análisis geopolítico de ciberataques entre Estados.", "La gestión administrativa de presupuestos de seguridad."], "c": [1], "e": "La ciberinteligencia táctica trabaja con información técnica reciente (hashes, IOC, TTP) orientada a l
