a detección y respuesta inmediata.", "nota": ""}, {"n": 131, "q": "¿Qué es un ataque de fuerza bruta?", "o": ["La destrucción física de servidores mediante golpes.", "Un método de prueba sistemática de todas las combinaciones posibles de contraseñas o claves hasta dar con la correcta.", "El desbordamiento de memoria por sobrecarga de datos.", "La suplantación de direcciones IP en redes locales."], "c": [1], "e": "Un ataque de fuerza bruta prueba de forma sistemática todas las combinaciones posibles de contraseña hasta dar con la correcta.", "nota": ""}, {"n": 132, "q": "¿Qué son los Indicadores de Compromiso (IoC)?", "o": ["Artefactos forenses o evidencias digitales (como hashes de archivos, IPs maliciosas o dominios) que indican con alta probabilidad que un sistema ha sido comprometido.", "Las multas impuestas por la Agencia Española de Protección de Datos.", "Los indicadores de rendimiento de un servidor web.", "Las credenciales de acceso de los administradores de red."], "c": [0], "e": "Los IoC son artefactos forenses (hashes, IPs maliciosas, dominios...) que indican con alta probabilidad que un sistema ha sido comprometido.", "nota": ""}, {"n": 133, "q": "¿Qué es el Spear Phishing?", "o": ["Una técnica de pesca deportiva en aguas profundas.", "Una variante de phishing altamente dirigida y personalizada hacia un individuo o organización específica.", "Un ataque masivo de spam sin personalización.", "La infección de redes Wi-Fi públicas mediante antenas de largo alcance."], "c": [1], "e": "El spear phishing es una variante de phishing altamente dirigida y personalizada hacia un individuo u organización concretos.", "nota": ""}, {"n": 134, "q": "¿Qué es el Smishing?", "o": ["Phishing realizado a través de mensajes de texto (SMS).", "Un ataque contra sistemas de mensajería instantánea empresarial.", "La suplantación de identidad en redes sociales profesionales.", "El fraude en la contratación de tarifas de telefonía móvil."], "c": [0], "e": "El smishing es phishing realizado a través de mensajes de texto (SMS).", "nota": ""}, {"n": 135, "q": "¿Qué es el Vishing?", "o": ["Phishing realizado mediante llamadas telefónicas o sistemas de voz sobre IP (VoIP), a menudo combinados con técnicas de suplantación de voz.", "La visualización ilegal de contenidos audiovisuales por streaming.", "El análisis de vulnerabilidades en sistemas de video vigilancia.", "Un tipo de malware que bloquea pantallas táctiles."], "c": [0], "e": "El vishing es phishing mediante llamadas telefónicas o VoIP, a menudo combinado con suplantación de voz.", "nota": ""}, {"n": 136, "q": "¿Qué función cumple un certificado digital en la red?", "o": ["Acelerar la velocidad de descarga de archivos pesados.", "Garantizar la autenticidad de la identidad de los usuarios y permitir el cifrado seguro de las comunicaciones.", "Evitar la entrada de virus informáticos en el ordenador.", "Comprimir los datos transmitidos en redes corporativas."], "c": [1], "e": "Un certificado digital garantiza la autenticidad de la identidad de los usuarios y permite el cifrado seguro de las comunicaciones.", "nota": ""}, {"n": 137, "q": "¿Qué es el Spoofing de IP?", "o": ["La ocultación permanente del disco duro mediante cifrado fuerte.", "La suplantación de la dirección IP de origen en paquetes de red para enmascarar la identidad del atacante o simular otra procedencia.", "El registro fraudulento de marcas comerciales en Internet.", "La duplicación de direcciones MAC en redes Wi-Fi."], "c": [1], "e": "El IP spoofing suplanta la dirección IP de origen en los paquetes para enmascarar la identidad del atacante o simular otra procedencia.", "nota": ""}, {"n": 138, "q": "¿Qué es un ataque de Man-in-the-Middle (MitM)?", "o": ["Un ataque en el que el ciberdelincuente intercepta y posiblemente altera las comunicaciones entre dos partes sin que estas se percaten.", "La agresión física a un operador de sistemas en un centro de datos.", "Un tipo de troyano bancario que roba credenciales al iniciar sesión.", "La intrusión en redes corporativas mediante empleados infiltrados."], "c": [0], "e": "En un Man-in-the-Middle el atacante intercepta y puede alterar las comunicaciones entre dos partes sin que estas se percaten.", "nota": ""}, {"n": 139, "q": "¿Qué es el análisis forense digital?", "o": ["La reparación de placas base dañadas por troyanos.", "La ciencia y práctica de adquirir, preservar, analizar y presentar evidencias digitales de manera jurídicamente válida.", "La auditoría preventiva de redes corporativas antes de un ataque.", "La recuperación de contraseñas olvidadas por usuarios legítimos."], "c": [1], "e": "El análisis forense digital es la ciencia de adquirir, preservar, analizar y presentar evidencias digitales de forma jurídicamente válida.", "nota": ""}, {"n": 140, "q": "¿Qué es el malware polimórfico?", "o": ["Un virus que cambia constantemente su código o firma binaria en cada infección para eludir la detección de los antivirus tradicionales.", "Software malicioso que se ejecuta únicamente en sistemas operativos móviles.", "Un programa que se multiplica consumiendo toda la memoria RAM.", "Un archivo cifrado con múltiples capas de contraseñas."], "c": [0], "e": "El malware polimórfico cambia constantemente su código o firma en cada infección para eludir la detección de los antivirus tradicionales.", "nota": ""}, {"n": 141, "q": "¿Qué es una vulnerabilidad de Día Cero (Zero-Day)?", "o": ["Un fallo de seguridad recién descubierto en un software para el cual aún no existe parche o solución oficial publicada.", "Un error cometido por los programadores el primer día de trabajo.", "Un ataque que dura exactamente veinticuatro horas.", "La caducidad de un certificado SSL."], "c": [0], "e": "Una vulnerabilidad de día cero es un fallo recién descubierto para el que aún no existe parche o solución oficial.", "nota": ""}, {"n": 142, "q": "¿Qué es el Honeypot (tarro de miel) en ciberseguridad?", "o": ["Un software señuelo diseñado para atraer, detectar y estudiar las técnicas de los ciberdelincuentes sin comprometer sistemas reales.", "Un método de cifrado basado en claves simétricas múltiples.", "Una técnica de ingeniería social basada en falsas ofertas de empleo.", "Un servidor proxy utilizado para navegar anónimamente."], "c": [0], "e": "Un honeypot es un señuelo diseñado para atraer, detectar y estudiar las técnicas de los atacantes sin comprometer sistemas reales.", "nota": ""}, {"n": 143, "q": "¿Qué es el credential stuffing?", "o": ["El almacenamiento masivo de contraseñas en bases de datos cifradas.", "Una técnica automatizada donde los atacantes utilizan listas de credenciales robadas (usuario/contraseña) para acceder ilimitadamente a múltiples plataformas web.", "La creación de contraseñas robustas mediante generadores automáticos.", "El envío masivo de correos con credenciales corporativas."], "c": [1], "e": "El credential stuffing usa de forma automatizada listas de credenciales robadas para intentar acceder a múltiples plataformas web.", "nota": ""}, {"n": 144, "q": "¿Cuál es el propósito principal de la autenticación multifactor (MFA)?", "o": ["Aumentar la seguridad requiriendo dos o más pruebas de identidad independientes antes de conceder acceso a un sistema.", "Permitir el acceso simultáneo de varios usuarios a una misma cuenta.", "Reducir el tiempo de inicio de sesión en aplicaciones corporativas.", "Eliminar por completo la necesidad de usar contraseñas."], "c": [0], "e": "La autenticación multifactor exige dos o más pruebas de identidad independientes antes de conceder el acceso.", "nota": ""}, {"n": 145, "q": "¿Qué es un ataque de denegación de servicio (DDoS) basado en amplificación?", "o": ["Un ataque que utiliza servidores intermediarios mal configurados para multiplicar el volumen de tráfico enviado a la víctima.", "La amplificación del sonido en los altavoces mediante ondas electromagnéticas.", "El incremento artificial de la señal Wi-Fi en redes corporativas.", "La saturación de líneas telefónicas mediante llamadas automatizadas."], "c": [0], "e": "Un DDoS por amplificación usa servidores intermediarios mal configurados para multiplicar el volumen de tráfico enviado a la víctima.", "nota": ""}, {"n": 146, "q": "¿Qué es el malware tipo Rootkit?", "o": ["Un conjunto de herramientas maliciosas diseñadas para ocultar la presencia de otros programas y mantener privilegios de administrador (root/sistema) en el equipo.", "Una aplicación para la gestión de permisos en Linux.", "Un programa antivirus de arranque en frío.", "Un dispositivo físico para extraer datos de discos duros."], "c": [0], "e": "Un rootkit oculta la presencia de otros programas y mantiene privilegios de administrador (root) en el equipo comprometido.", "nota": ""}, {"n": 147, "q": "¿Qué es la extorsión múltiple en incidentes de ransomware moderno?", "o": ["Exigir el pago en varias criptomonedas diferentes simultáneamente.", "Además de cifrar los archivos, exfiltrar información sensible para amenazar con su publicación pública si no se paga el rescate.", "Atacar al mismo tiempo a varios departamentos de una misma empresa.", "Obligar a la víctima a infectar a otros equipos para recuperar sus datos."], "c": [1], "e": "La extorsión múltiple añade a el cifrado la exfiltración de datos, amenazando con publicarlos si no se paga el rescate.", "nota": ""}, {"n": 148, "q": "¿Qué caracteriza a un ataque de Cross-Site Scripting (XSS)?", "o": ["La inyección de scripts maliciosos en páginas web legítimas para que se ejecuten en el navegador de los usuarios visitantes.", "El intercambio de archivos prohibidos entre servidores web.", "La clonación de sitios web bancarios completos.", "La modificación de registros DNS en servidores raíz."], "c": [0], "e": "El XSS inyecta scripts maliciosos en páginas web legítimas para que se ejecuten en el navegador de los usuarios que las visitan.", "nota": ""}, {"n": 149, "q": "¿Qué diferencia existe entre atribución técnica y política?", "o": ["La técnica la realizan los estados; la política la ejecutan empresas privadas de ciberseguridad.", "La técnica identifica al autor mediante análisis forense; la política requiere consenso diplomático y tiene consecuencias geopolíticas.", "La técnica es siempre pública; la política se mantiene clasificada.", "La técnica analiza la ideología del atacante; la política mide la velocidad en megabytes por segundo de la intrusión."], "c": [1], "e": "La atribución técnica se apoya en evidencias periciales y análisis forense de la infraestructura/malware, mientras que la atribución política es una decisión soberana estatal que exige oportunidad y consenso diplomático, acarreando consecuencias geopolíticas y medidas sancionadoras.", "nota": ""}, {"n": 150, "q": "¿Qué técnica consiste en el secuestro de pestañas del navegador para redirigir al usuario a sitios fraudulentos?", "o": ["Smishing.", "Tabnabbing.", "Session Hijacking.", "Fire-jacking."], "c": [1], "e": "El tabnabbing aprovecha pestañas inactivas que el usuario deja abiertas en segundo plano; mediante scripts manipula silenciosamente su URL, diseño y favicon para simular la página de acceso legítima de un servicio y robar credenciales cuando el usuario regresa a ella.", "nota": ""}, {"n": 151, "q": "¿Contempla la legislación penal la modalidad de grooming en la que la captación se orienta exclusivamente a la obtención de material pornográfico (MASI) sin buscar un encuentro físico?", "o": ["Solo es sancionable si el número de imágenes obtenidas supera un límite fijado por ley.", "El legislador contempla también los supuestos en los que el autor embauca al menor para obtener MASI, configurando una modalidad autónoma de grooming que no requiere necesariamente una propuesta de encuentro presencial.", "La entrega voluntaria de las imágenes por el menor deslegitima la persecución de la captación previa.", "No, el grooming exige siempre la intención de concertar una cita presencial."], "c": [1], "e": "El legislador contempla también los supuestos en los que el autor embauca al menor para obtener MASI, configurando una modalidad autónoma de grooming que no requiere necesariamente una propuesta de encuentro presencial.", "nota": ""}, {"n": 152, "q": "¿Cómo se califica jurídicamente la concurrencia en un mismo sujeto de la explotación sexual mediante prostitución de un menor y la posterior grabación/producción de dicho material?", "o": ["La producción del material pornográfico absorbe el delito de explotación sexual previa.", "Se aplica exclusivamente la pena del delito que la tenga más grave en abstracto.", "Se aprecia un único delito al existir una misma finalidad económica.", "La explotación sexual mediante prostitución y la producción de material pornográfico protegen bienes jurídicos diferenciados y, con carácter general, permiten apreciar un concurso real de delitos cuando concurren ambas conductas."], "c": [3], "e": "La explotación sexual mediante prostitución y la producción de material pornográfico protegen bienes jurídicos diferenciados y, con carácter general, permiten apreciar un concurso real de delitos cuando concurren ambas conductas.", "nota": ""}, {"n": 154, "q": "¿Cuál es el límite de precisión de dígitos que posee Microsoft Excel para campos interpretados como números antes de aplicar una conversión destructiva a notación científica (ej. 3,59E+13)?", "o": ["14 dígitos.", "10 dígitos.", "15 dígitos.", "12 dígitos."], "c": [2], "e": "Microsoft Excel sigue el estándar de coma flotante IEEE 754 y posee un límite estricto de precisión de 15 dígitos para números; si un identificador cuantitativo supera esa longitud bajo formato general, el programa lo transforma a notación científica y reemplaza cualquier dígito posterior por ceros, corrompiendo de manera destructiva identificadores delictivos críticos como números de tarjeta (PAN) o códigos IMEI.", "nota": ""}, {"n": 155, "q": "Para suprimir de forma masiva los espacios en blanco intercalados que corrompen la estructura de una columna de códigos IBAN mediante la herramienta \"Buscar y reemplazar\", ¿cómo se deben configurar los campos?", "o": ["Buscar: (dejar vacío) / Reemplazar con: . (un punto).", "Buscar: (un espacio con la barra espaciadora) / Reemplazar con: (dejar completamente vacío).", "Buscar: IBAN / Reemplazar con: TEXTO.", "Buscar: _ (guion bajo) / Reemplazar con: FALSO."], "c": [1], "e": "Para eliminar anomalías espaciales en cadenas complejas como los códigos IBAN o importes financieros sin alterar el resto de caracteres, se introduce un espacio con la barra espaciadora en el campo \"Buscar\" y se deja el campo \"Reemplazar con\" completamente vacío, pulsando a continuación \"Reemplazar todos\" para compactar el identificador.", "nota": ""}, {"n": 156, "q": "¿Qué característica define al modelo «Crime as a Service»?", "o": ["La eliminación del anonimato en Internet.", "La contratación de servicios delictivos completos.", "La persecución exclusiva de ciberdelincuentes.", "La gratuidad de las herramientas criminales."], "c": [1], "e": "El modelo Crime-as-a-Service (CaaS) reproduce el esquema del software legítimo permitiendo a actores con o sin conocimientos técnicos alquilar o contratar capacidades y servicios criminales empaquetados e integrales (desde kits de phishing y botnets hasta plataformas completas de ransomware o infraestructuras de blanqueo), externalizando fases enteras de la cadena de valor delictiva.", "nota": ""}, {"n": 157, "q": "¿Cuál de las siguientes acciones puede facilitar la inteligencia artificial a los delincuentes?", "o": ["Reducir la capacidad de engaño.", "Generar imágenes sintéticas y deepfakes.", "Eliminar la necesidad de conexión a Internet.", "Impedir la falsificación de contenidos."], "c": [1], "e": "La inteligencia artificial generativa actúa como un potente multiplicador de capacidades que permite a los ciberdelincuentes crear contenidos sintéticos hiperrealistas (deepfakes de audio, imagen y vídeo) para potenciar fraudes de identidad complejos, ingeniería social, desinformación y el fraude del CEO o BEC.", "nota": ""}];
const KEY='asig01_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='';
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.n];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.n;
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.nota?`<div class="nota"><b>Nota:</b> ${esc(q.nota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.n]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.n]={sel:cur,ok};save();replace(q.n);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.n];save();replace(q.n);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+n)||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+n);
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
