Según los apuntes: “248 y 249 CP — estafa informática: uso de las credenciales/cookies robadas para defraudar.”"},{"n":8097,"m":4,"q":"¿Qué agravante suele aplicarse cuando existe una estructura de operador y afiliados con jerarquía y reparto de tareas?","o":["El artículo 197 ter, siempre en su forma básica","El artículo 570 bis CP, por organización o grupo criminal","No existe ninguna agravante aplicable a estas estructuras","El artículo 264 CP en su modalidad imprudente"],"a":1,"e":"Según los apuntes: “570 bis CP — organización o grupo criminal: aplicable a la estructura de operador + afiliados con cierta jerarquía y reparto de tareas.”"},{"n":8098,"m":4,"q":"¿Qué medida de higiene básica «mata el robo de contraseña» según el tema?","o":["El filtrado DNS corporativo","El MFA resistente a phishing (FIDO2/passkeys)","El Endpoint Privilege Management","La vida útil de cookie corta"],"a":1,"e":"Según los apuntes: “MFA resistente a phishing (FIDO2/passkeys): mata el robo de contraseña.”"},{"n":8099,"m":4,"q":"Antes de comenzar el análisis con Wireshark, ¿qué configuración recomienda expresamente el tema?","o":["Configurar la columna de tiempo en UTC","Desactivar todos los disectores de protocolo","Instalar un antivirus adicional en el equipo de análisis","Conectar el equipo de análisis a la red de producción"],"a":0,"e":"Según los apuntes: “Herramientas: Wireshark como herramienta principal (libre y multiplataforma, disectores para prácticamente cualquier protocolo, filtros de visualización y reconstrucción de flujos — configurar la columna de tiempo en UTC antes de empezar).”"},{"n":8100,"m":4,"q":"¿Cuál es la primera regla del laboratorio respecto a la captura de tráfico entregada?","o":["Ejecutar los binarios encontrados para comprobar su comportamiento","No ejecutar nada de lo que aparece en la captura; analizarla con Wireshark es seguro, todo lo demás no","Visitar los dominios observados para confirmar que están activos","Subir el fichero a un servicio público de análisis para obtener una segunda opinión"],"a":1,"e":"Según los apuntes: “Reglas del laboratorio: la captura contiene tráfico generado por malware real; analizarla con Wireshark es seguro, todo lo demás no.”"},{"n":8101,"m":5,"q":"Según el tema, ¿cuál es el criterio que distingue un incidente de ciberseguridad de un ciberdelito para las Fuerzas y Cuerpos de Seguridad?","o":["La cantidad económica de las pérdidas ocasionadas","El límite es puramente jurídico: lo que para una entidad es una crisis de disponibilidad, confidencialidad o integridad, para las FCS constituye la noticia criminis de un hecho delictivo tipificado penalmente","El número de sistemas afectados por el ataque","La nacionalidad del atacante identificado"],"a":1,"e":"Según los apuntes: “El límite entre un incidente de ciberseguridad y un ciberdelito es puramente jurídico: lo que para una empresa es una crisis de disponibilidad/confidencialidad, para las Fuerzas y Cuerpos de Seguridad (FCS) es la noticia criminis de un hecho tipificado penalmente.”"},{"n":8102,"m":5,"q":"¿Por qué se afirma que la escena del crimen digital es diferente de la de un delito tradicional?","o":["Porque es estática y siempre se localiza en un único país","Porque es volátil, intangible y frecuentemente deslocalizada a través de múltiples jurisdicciones internacionales","Porque nunca requiere cadena de custodia","Porque solo puede investigarse mediante Comisión Rogatoria Internacional"],"a":1,"e":"Según los apuntes: “La escena del crimen digital es volátil, intangible y deslocalizada: un ransomware contra un hospital local puede implicar infraestructuras en Asia, servidores C2 en Europa del Este y blanqueo mediante criptoactivos globales.”"},{"n":8103,"m":5,"q":"¿Qué diferencia la respuesta ante incidentes corporativa de la investigación policial según el tema?","o":["Son términos sinónimos con idéntico objetivo","La corporativa busca la resiliencia, mitigar el daño y restaurar el negocio; la policial busca la persecución del delito, la obtención de pruebas válidas y la detención de los autores","La corporativa siempre precede y sustituye a la investigación policial","La investigación policial solo puede iniciarse mediante denuncia de la entidad afectada"],"a":1,"e":"Según los apuntes: “Investigación policial: busca la persecución del delito, pruebas válidas y la detención de los autores. El proceso penal se activa por denuncia, detección de oficio (ciberpatrullaje) o notificación de cooperación técnica.”"},{"n":8104,"m":5,"q":"¿Qué órgano actúa como nodo de enlace del Ministerio del Interior entre las Fuerzas y Cuerpos de Seguridad y los operadores de servicios esenciales?","o":["El CCN-CERT","El INCIBE-CERT","La Oficina de Coordinación de Ciberseguridad (OCC)","Europol (EC3)"],"a":2,"e":"Según los apuntes: “OCC (Oficina de Coordinación de Ciberseguridad): nodo de enlace del Interior con operadores de servicios esenciales.”"},{"n":8105,"m":5,"q":"¿Cuál es la diferencia principal entre el CCN-CERT y el INCIBE-CERT?","o":["El CCN-CERT coordina la respuesta en el sector público y en infraestructuras críticas; el INCIBE-CERT es de referencia para ciudadanos, pymes y operadores privados","El INCIBE-CERT es exclusivo para organismos militares","El CCN-CERT no tiene competencias en ciberseguridad","Ambos son el mismo organismo con nombres distintos"],"a":0,"e":"Según los apuntes: “CCN-CERT: coordina la respuesta en sector público e infraestructuras críticas.”"},{"n":8106,"m":5,"q":"¿Cuál es la principal aportación del Convenio de Budapest a la investigación de ciberdelitos?","o":["Elimina la necesidad de cooperación judicial internacional","Homogeneiza los tipos penales entre países firmantes y establece mecanismos ágiles como la red de puntos de contacto 24/7 para la conservación inmediata de datos","Sustituye a Europol e Interpol en todas sus funciones","Obliga a las multinacionales tecnológicas a entregar directamente el contenido de las comunicaciones sin mandato judicial"],"a":1,"e":"Según los apuntes: “Convenio de Budapest: homogeneiza tipos penales y crea la red de puntos de contacto 24/7 (conservación urgente de datos mientras se tramita la orden judicial).”"},{"n":8107,"m":5,"q":"¿Cuál es la función principal de Europol (EC3) en la investigación de ciberdelitos?","o":["Detener directamente a los sospechosos en cualquier país europeo","Coordinar Operational Task Forces, centralizar inteligencia sobre cibercrimen y proporcionar apoyo técnico, sin disponer de competencias ejecutivas directas","Sustituir a los jueces nacionales en la autorización de pruebas digitales","Gestionar exclusivamente la cooperación con América Latina y Asia"],"a":1,"e":"Según los apuntes: “Cooperación policial: Europol/EC3 (coordina, no detiene) e Interpol/IGCI (intercambio global de información, regiones críticas).”"},{"n":8108,"m":5,"q":"¿Qué permite la Orden Europea de Investigación (OEI)?","o":["Que un juez español solicite la obtención de una prueba digital directamente a la autoridad judicial de otro Estado miembro de la UE en plazos estrictos","Que la policía española detenga directamente a sospechosos en otros países de la UE","Que las empresas tecnológicas ignoren las leyes de protección de datos europeas","Que se elimine la necesidad de cualquier cooperación judicial en la UE"],"a":0,"e":"Según los apuntes: “Cooperación judicial: OEI (Orden Europea de Investigación, dentro de la UE, plazos estrictos) y CRI (Comisión Rogatoria Internacional, fuera de la UE, más lenta).”"},{"n":8109,"m":5,"q":"¿Por qué resulta importante haber utilizado previamente los canales policiales de conservación urgente de datos frente a una Comisión Rogatoria Internacional (CRI)?","o":["Porque la CRI es un proceso tradicionalmente más lento y la prueba podría borrarse antes de que llegue la autorización judicial","Porque la CRI está reservada exclusivamente a delitos económicos","Porque la CRI no puede utilizarse fuera de la Unión Europea","Porque la conservación urgente sustituye por completo a la autorización judicial"],"a":0,"e":"Según los apuntes: “Cooperación judicial: OEI (Orden Europea de Investigación, dentro de la UE, plazos estrictos) y CRI (Comisión Rogatoria Internacional, fuera de la UE, más lenta).”"},{"n":8110,"m":5,"q":"¿Qué son los Law Enforcement Request Systems que disponen las grandes tecnológicas?","o":["Sistemas de cifrado utilizados por los ciberdelincuentes","Portales específicos para que las Fuerzas y Cuerpos de Seguridad soliciten preservación o datos, dada la agilidad que exige el laberinto jurisdiccional","Un tratado internacional alternativo al Convenio de Budapest","Un estándar técnico de cifrado de extremo a extremo"],"a":1,"e":"Según los apuntes: “Disponen de Law Enforcement Request Systems. La preservación urgente puede solicitarse directamente; la entrega de contenido siempre exige mandato judicial.”"},{"n":8111,"m":5,"q":"¿En qué se diferencian, según el tema, la preservación inmediata de datos y la entrega del contenido de las comunicaciones frente a una tecnológica?","o":["Ambas requieren siempre mandato judicial previo","La preservación puede solicitarse directamente en situaciones de urgencia, mientras que la entrega del contenido sigue requiriendo mandato judicial formal","La entrega del contenido nunca requiere autorización alguna","No existe diferencia jurídica entre ambas figuras"],"a":1,"e":"Según los apuntes: “La preservación urgente puede solicitarse directamente; la entrega de contenido siempre exige mandato judicial. Disponen de Law Enforcement Request Systems.”"},{"n":8112,"m":5,"q":"¿En qué se fundamenta principalmente una simulación de gestión de incidentes según el tema?","o":["Es un juego improvisado sin base metodológica","Es una herramienta de capacitación basada en la andragogía y la gestión de crisis, orientada a entrenar la heurística del investigador bajo estrés e incertidumbre","Se basa exclusivamente en la memorización de artículos del Código Penal","Solo puede aplicarse a alumnos sin experiencia policial previa"],"a":1,"e":"Según los apuntes: “Una simulación no es un juego improvisado: es una herramienta de capacitación basada en la andragogía y la gestión de crisis, orientada a entrenar la heurística del investigador bajo estrés e incertidumbre.”"},{"n":8113,"m":5,"q":"¿Qué marco normativo internacional define las fases de planificación, detección, evaluación, respuesta y lecciones aprendidas para una simulación?","o":["La norma ISO/IEC 27035","El Convenio de Budapest","El RGPD","La ECPA estadounidense"],"a":0,"e":"Según los apuntes: “ISO/IEC 27035: fases (planificación, detección, evaluación, respuesta, lecciones aprendidas).”"},{"n":8114,"m":5,"q":"¿Qué caracteriza a un ejercicio de mesa (Tabletop Exercise, TTX)?","o":["Requiere el despliegue de una infraestructura de red real (Cyber Range)","Es una simulación teórica basada en la discusión de una narrativa de crisis, sin requerir infraestructura tecnológica real","Implica que un Red Team ejecute un ransomware controlado sobre servidores reales","Solo evalúa la fase de adquisición forense en tiempo real"],"a":1,"e":"Según los apuntes: “Tipos de ejercicio — Tabletop (TTX): discusión de escenarios, sin infraestructura real. Funcional: introduce el tiempo real, evalúa capacidades concretas.”"},{"n":8115,"m":5,"q":"¿Qué distingue a los ejercicios funcionales (Functional Exercises) de los ejercicios de mesa?","o":["Los funcionales introducen la variable del tiempo real y evalúan capacidades específicas mediante comunicaciones simuladas","Los funcionales no requieren ningún tipo de interacción entre los participantes","Los funcionales sustituyen completamente a los simulacros completos","Los funcionales solo pueden realizarse con la Célula Roja inactiva"],"a":0,"e":"Según los apuntes: “Funcional: introduce el tiempo real, evalúa capacidades concretas. Full-Scale (Red Team vs Blue Team): infraestructura real (Cyber Range), máximo realismo.”"},{"n":8116,"m":5,"q":"En la estructura organizativa de una simulación, ¿qué función desempeña la White Team (Célula Blanca)?","o":["Actúa como los investigadores policiales que responden al incidente","Dirige el ejercicio, controla el reloj, introduce inyecciones de información y evalúa las reacciones de los alumnos","Representa siempre y exclusivamente a la amenaza en los simulacros completos","Ejecuta el ransomware real contra los servidores de la empresa"],"a":1,"e":"Según los apuntes: “Estructura organizativa: White Team (dirección/árbitros) · Blue Team (alumnos/investigadores) · Red Team (la amenaza, a veces asumida por la propia White Team en ejercicios teóricos).”"},{"n":8117,"m":5,"q":"Según el ciclo de vida del ransomware moderno (Human-Operated Ransomware) descrito en el tema, ¿en qué fase se produce la «primera extorsión»?","o":["En la fase de compromiso inicial","En la fase de movimiento lateral y escalada de privilegios","En la fase de exfiltración, cuando el atacante roba información confidencial antes de cifrar","En la fase de despliegue y cifrado"],"a":2,"e":"Según los apuntes: “Ciclo del ransomware moderno (Human-Operated)”"},{"n":8118,"m":5,"q":"¿Qué ocurre durante la fase de despliegue y cifrado (segunda extorsión) del ransomware?","o":["Se produce el acceso inicial mediante credenciales robadas o phishing","Se ejecutan los binarios del ransomware en toda la red, se destruyen las copias de seguridad locales y aparece la nota de rescate","El atacante compromete el controlador de dominio sin causar ningún efecto visible","Se genera únicamente la exfiltración de datos sin cifrado posterior"],"a":1,"e":"Según los apuntes: “Despliegue y cifrado (2.ª extorsión): cifrado masivo, borrado de shadow copies, nota de rescate.”"},{"n":8119,"m":5,"q":"¿Qué mide el KPI policial denominado MTTD (Mean Time to Detect) en una simulación?","o":["El tiempo que tarda el ransomware en cifrar toda la red","Cuánto tardan los investigadores en identificar la gravedad real del incidente tras recibir la primera alerta","El número de servidores comprometidos durante el ejercicio","El coste económico total del incidente simulado"],"a":1,"e":"Según los apuntes: “KPIs policiales de evaluación: MTTD (tiempo de detección) · aseguramiento probatorio (cadena de custodia) · acierto jurídico (requerimiento directo vs. auto judicial) · gestión de la información (secreto frente a filtraciones).”"},{"n":8120,"m":5,"q":"¿Por qué la norma general en la primera actuación policial es «aislar, no apagar» los equipos afectados por un incidente?","o":["Porque apagar el equipo mejora la velocidad de la investigación forense","Porque apagar el equipo implica la pérdida instantánea de la información volátil de la memoria RAM, donde se alojan claves de cifrado, conexiones activas y trazas del malware","Porque la ley prohíbe expresamente apagar cualquier dispositivo electrónico intervenido","Porque los equipos apagados no pueden aislarse de la red mediante firewall"],"a":1,"e":"Según los apuntes: “Aislar, no apagar: apagar destruye la memoria RAM (claves de cifrado, conexiones activas, trazas de malware).”"},{"n":8121,"m":0,"q":"¿Qué mecanismo de acceso inicial al ransomware cita expresamente el tema junto al phishing y la explotación de vulnerabilidades?","o":["El uso de credenciales comprometidas, por ejemplo mediante RDP expuesto","La destrucción física del servidor","La publicación de la nota de rescate antes del acceso","La instalación obligatoria de un honeypot"],"a":0,"e":"Según los apuntes: “Acceso inicial: phishing, explotación de vulnerabilidades o credenciales comprometidas (RDP expuesto).”"},{"n":8122,"m":0,"q":"¿Qué finalidad tiene la persistencia dentro de una operación de ransomware?","o":["Borrar todos los registros antes de entrar","Mantener el acceso incluso tras reinicios","Saturar el ancho de banda de la víctima","Publicar automáticamente los datos robados"],"a":1,"e":"Según los apuntes: “Persistencia: el atacante asegura poder mantener el acceso tras reinicios.”"},{"n":8123,"m":0,"q":"¿Para qué se realiza el movimiento lateral en la secuencia de ransomware descrita?","o":["Para reducir el número de sistemas afectados","Para comprometer más sistemas y maximizar el impacto","Para sustituir el cifrado por phishing","Para evitar cualquier uso de credenciales"],"a":1,"e":"Según los apuntes: “Movimiento lateral: se compromete un mayor número de sistemas para maximizar el impacto.”"},{"n":8124,"m":0,"q":"¿De qué depende especialmente la gravedad de una filtración de datos según el documento?","o":["Del sistema operativo afectado","Del tipo de datos expuestos o sustraídos","De que exista siempre malware","Del número de dominios registrados"],"a":1,"e":"Según los apuntes: “Su gravedad depende del tipo de datos afectados: personales, credenciales, información financiera, documentación policial o judicial, secretos comerciales.”"},{"n":8125,"m":0,"q":"¿Cuál de estas situaciones puede originar un data breach sin que exista un atacante externo?","o":["Una mala configuración","Un ataque DDoS volumétrico exclusivamente","Una explotación de día cero obligatoriamente","Una campaña de whaling necesariamente"],"a":0,"e":"Según los apuntes: “No siempre tiene origen en un ataque externo: puede deberse a una mala configuración, un envío erróneo o una actuación deliberada de un insider.”"},{"n":8126,"m":0,"q":"¿Qué tipo de DDoS busca principalmente saturar el ancho de banda disponible?","o":["Contra protocolos","Volumétrico","Contra la capa de aplicación","Whaling"],"a":1,"e":"Según los apuntes: “Volumétricos: saturan el ancho de banda disponible.”"},{"n":8127,"m":0,"q":"¿Qué caracteriza a los DDoS contra la capa de aplicación según el tema?","o":["Imitan tráfico legítimo y son más difíciles de diferenciar","Solo emplean SMS","Nunca generan solicitudes válidas","Requieren acceso físico al servidor"],"a":0,"e":"Según los apuntes: “Contra la capa de aplicación: imitan tráfico legítimo, más difíciles de diferenciar.”"},{"n":8128,"m":0,"q":"En una reflexión y amplificación DDoS, ¿qué dirección suplanta el atacante?","o":["La IP de la víctima","La IP del analista forense","La MAC del router local exclusivamente","La dirección de correo del proveedor"],"a":0,"e":"Según los apuntes: “Reflexión y amplificación: el atacante suplanta la IP de la víctima (IP spoofing) para que servidores intermediarios envíen sus respuestas hacia ella, multiplicando el tráfico recibido.”"},{"n":8129,"m":0,"q":"¿Qué particularidad de DDoSia destaca el documento respecto de una botnet tradicional?","o":["Solo funciona contra sistemas sin Internet","Permite participación voluntaria de simpatizantes","Exige infectar previamente todos los dispositivos","Se limita a correo electrónico"],"a":1,"e":"Según los apuntes: “Red hacktivista prorrusa que realiza ataques DDoS contra Ucrania y países aliados desde 2022, empleando la herramienta DDoSia, que permite a simpatizantes participar voluntariamente (no requiere una botnet tradicional de dispositivos infectados).”"},{"n":8130,"m":0,"q":"¿Cuántos registros domiciliarios menciona el tema en la operación Eastwood?","o":["7","13","24","2"],"a":2,"e":"Según los apuntes: “Operación policial internacional Eastwood (Europol): 2 detenciones, 7 órdenes de detención, 24 registros domiciliarios, 13 interrogados, y desactivación de una parte sustancial de su infraestructura.”"},{"n":8131,"m":0,"q":"¿Qué principio psicológico del phishing consiste en hacer creer a la víctima que debe actuar inmediatamente?","o":["Urgencia","Redundancia","Persistencia","Segmentación"],"a":0,"e":"Según los apuntes: “Indicadores de sospecha: remitente distinto del esperado, dominios similares pero no idénticos, urgencia artificial, enlaces cuyo destino no coincide con el texto mostrado.”"},{"n":8132,"m":0,"q":"¿Qué modalidad de phishing se realiza mediante SMS?","o":["Vishing","Smishing","Whaling","Spear-phishing"],"a":1,"e":"Según los apuntes: “Smishing / vishing: mediante SMS o llamadas de voz.”"},{"n":8133,"m":0,"q":"¿Por qué la IA generativa reduce la fiabilidad de algunos indicadores clásicos de phishing?","o":["Porque impide registrar dominios","Porque permite mensajes con redacción correcta y personalizada","Porque elimina los enlaces de los correos","Porque bloquea automáticamente el spear-phishing"],"a":1,"e":"Según los apuntes: “Precaución: la IA generativa reduce la fiabilidad de estos indicadores (redacción correcta y personalizada). Indicadores de sospecha: remitente distinto del esperado, dominios similares pero no idénticos, urgencia artificial, enlaces cuyo destino no coincide con el texto mostrado.”"},{"n":8134,"m":0,"q":"¿Qué representa un CVE en el contexto de vulnerabilidades?","o":["Una puntuación de impacto económico","Un identificador público y estandarizado de una vulnerabilidad concreta","Una orden judicial internacional","Una técnica de movimiento lateral"],"a":1,"e":"Según los apuntes: “CVE: identificador público y estandarizado de una vulnerabilidad concreta.”"},{"n":8135,"m":0,"q":"¿Qué afirmación hace el tema sobre una puntuación CVSS alta?","o":["Prueba que la vulnerabilidad ya fue explotada","Implica siempre el máximo riesgo real","No implica automáticamente un mayor riesgo real","Identifica al autor del ataque"],"a":2,"e":"Según los apuntes: “Una puntuación alta no implica automáticamente mayor riesgo real. CVSS: puntuación de severidad (explotabilidad remota, privilegios necesarios, impacto en confidencialidad/integridad/disponibilidad).”"},{"n":8136,"m":0,"q":"¿Cuál de estas consecuencias de explotación aparece expresamente en el tema?","o":["Ejecución remota de código","Reducción automática del ancho de banda","Creación de copias de seguridad","Desindexación de buscadores"],"a":0,"e":"Según los apuntes: “Consecuencias: ejecución remota de código (RCE), escalada de privilegios, elusión de autenticación, acceso o modificación de información.”"},{"n":8137,"m":0,"q":"¿Qué protocolo estaba afectado por EternalBlue en el caso WannaCry descrito?","o":["SMTP","SMB","DNS","FTP"],"a":1,"e":"Según los apuntes: “Caso WannaCry (2017): explotó EternalBlue (CVE-2017-0144) sobre el protocolo SMB — una vulnerabilidad ya conocida y con parche disponible que muchas organizaciones no habían aplicado.”"},{"n":8138,"m":0,"q":"Según el tema, una APT debe entenderse principalmente como:","o":["Un antivirus especializado","Un actor u operación sostenida, no un virus concreto","Un único exploit publicado","Una técnica exclusiva de DDoS"],"a":1,"e":"Según los apuntes: “No es un virus ni una herramienta, sino un actor u operación. Operaciones sostenidas en el tiempo, ejecutadas por actores con alta capacidad técnica y organización, cuyo objetivo suele ser mantener un acceso prolongado y discreto (espionaje, robo de propiedad intelectual, sabotaje).”"},{"n":8139,"m":0,"q":"¿Qué expresa el componente «Persistente» de APT?","o":["Que repite siempre el mismo malware","Que mantiene capacidad de operar aunque pierda un punto de acceso","Que nunca puede ser detectada","Que solo usa vulnerabilidades zero-day"],"a":1,"e":"Según los apuntes: “Persistente: mantiene la capacidad de operar aunque pierda un punto de acceso concreto.”"},{"n":8140,"m":0,"q":"¿Qué exige la atribución de un ciberataque según las conclusiones del tema?","o":["Basta con una única IP","Correlación de múltiples evidencias y cooperación internacional","Solo una muestra de malware","Únicamente el nombre del dominio"],"a":1,"e":"Según los apuntes: “Un indicador técnico (IP, dominio, malware) no identifica automáticamente al responsable; la atribución exige correlación de múltiples evidencias y cooperación internacional.”"},{"n":8141,"m":1,"q":"Al reconstruir un ransomware, ¿qué pregunta corresponde específicamente al acceso inicial?","o":["¿Qué cuenta, servicio o vulnerabilidad permitió la entrada?","¿Qué nota de rescate se imprimió?","¿Qué copia de seguridad se restauró primero?","¿Qué color tenía la interfaz del sistema?"],"a":0,"e":"Según los apuntes: “Acceso inicial: ¿qué cuenta, servicio o vulnerabilidad permitió la entrada?”"},{"n":8142,"m":1,"q":"¿Qué diferencia metodológica establece el documento entre inferencia e hipótesis?","o":["La inferencia requiere contexto; la hipótesis es una explicación provisional más exigente","Son exactamente equivalentes","La hipótesis es siempre un dato registrado","La inferencia identifica automáticamente al autor"],"a":0,"e":"Según los apuntes: “Distinción metodológica clave: hecho observado (dato registrado) ≠ inferencia (requiere contexto) ≠ hipótesis (explicación provisional, más exigente).”"},{"n":8143,"m":1,"q":"¿Qué añade la triple extorsión a la doble extorsión?","o":["Solo un segundo cifrado","Presión adicional mediante DDoS, contacto con terceros o amenazas a proveedores","La eliminación de cualquier negociación","La obligación de usar RDP"],"a":1,"e":"Según los apuntes: “Triple extorsión: se añade presión mediante DDoS, contacto directo con clientes/empleados o amenazas a proveedores.”"},{"n":8144,"m":1,"q":"¿Qué efecto tiene el modelo RaaS sobre las barreras de entrada?","o":["Las incrementa necesariamente","Las reduce al facilitar herramientas e infraestructura a afiliados","Las elimina solo para Estados","No afecta a la participación de afiliados"],"a":1,"e":"Según los apuntes: “RaaS (Ransomware-as-a-Service): desarrolladores ceden herramientas e infraestructura a afiliados a cambio de reparto del rescate. Reduce barreras de entrada y no implica jerarquía estable (un afiliado puede usar varias marcas).”"},{"n":8145,"m":1,"q":"¿Qué rol del ecosistema ransomware se ocupa de vender u obtener accesos previos a sistemas o credenciales?","o":["Initial access broker","Negociador de rescates","Analista forense","Proveedor de copias de seguridad"],"a":0,"e":"Según los apuntes: “Roles del ecosistema (pueden acumularse en una misma persona): desarrollo y mantenimiento, afiliación/operación, initial access broker, infraestructura, negociación y presión, finanzas y blanqueo.”"},{"n":8146,"m":1,"q":"Según ENISA 2025 citado en el tema, ¿cuántas variantes distintas de ransomware se mencionan?","o":["24","82","4.875","81"],"a":1,"e":"Según los apuntes: “Dato de contexto (ENISA 2025): el ransomware representó el 81,1 % de la actividad de ciberdelincuencia monitorizada entre julio 2024 y junio 2025 (4.875 incidentes), con 82 variantes distintas — la fragmentación del ecosistema es mayor que la capacidad de seguirlo por marca.”"},{"n":8147,"m":1,"q":"¿Qué actividades encajan en la fase de reconocimiento y selección de víctima?","o":["Escaneos, consultas DNS e información pública","Borrado de copias de sombra","Cifrado masivo","Negociación del rescate"],"a":0,"e":"Según los apuntes: “Reconocimiento y selección de la víctima: escaneos, consultas DNS, información pública.”"},{"n":8148,"m":1,"q":"¿Qué técnica MITRE ATT&CK se asocia en el documento con las cuentas válidas?","o":["T1490","T1486","T1078","T1059"],"a":2,"e":"Según los apuntes: “MITRE ATT&CK (T1078: cuentas válidas) recuerda que sirven también para persistencia y evasión, no solo acceso. Acceso inicial: credenciales comprometidas, vulnerabilidades, phishing.”"},{"n":8149,"m":1,"q":"¿Dónde puede residir la persistencia además de en malware?","o":["En identidades y configuraciones","Solo en el disco físico","Únicamente en una IP pública","Exclusivamente en el cifrador"],"a":0,"e":"Según los apuntes: “Persistencia: cuentas nuevas, claves de acceso remoto, tareas programadas — puede residir en identidades, no solo en malware.”"},{"n":8150,"m":1,"q":"¿Qué activos críticos menciona el documento como posibles objetivos de escalada de privilegios?","o":["Dominios, hipervisores o copias de seguridad","Solo impresoras locales","Únicamente páginas web públicas","Exclusivamente teléfonos móviles"],"a":0,"e":"Según los apuntes: “Escalada de privilegios: obtención de acceso a dominios, hipervisores o copias de seguridad.”"},{"n":8151,"m":1,"q":"¿De qué depende especialmente detectar movimiento lateral por RDP, SMB o SSH?","o":["De una única firma universal","Del contexto de horario, volumen y secuencia","Solo del hash del ransomware","De la nota de rescate"],"a":1,"e":"Según los apuntes: “Movimiento lateral: RDP, SMB, SSH — su detección depende más del contexto (horario, volumen, secuencia) que de una firma maliciosa.”"},{"n":8152,"m":1,"q":"¿Qué técnica MITRE ATT&CK cita el tema para el sabotaje de mecanismos de recuperación?","o":["T1490","T1078","T1486","T1204"],"a":0,"e":"Según los apuntes: “Neutralización de controles: borrado de copias de sombra, sabotaje de backups (MITRE T1490).”"},{"n":8153,"m":1,"q":"¿Qué técnica MITRE ATT&CK corresponde al cifrado para impacto?","o":["T1078","T1486","T1490","T1566"],"a":1,"e":"Según los apuntes: “Despliegue y cifrado: ejecución masiva del cifrador (MITRE T1486: Data Encrypted for Impact).”"},{"n":8154,"m":1,"q":"¿Qué nueva evidencia puede abrir la fase de extorsión y negociación?","o":["Chats, direcciones de criptoactivos y plazos","Solo registros DNS internos","Únicamente hashes de archivos","Solo la RAM del servidor"],"a":0,"e":"Según los apuntes: “Extorsión y negociación: la nota de rescate abre un nuevo canal de evidencia (chats, direcciones de criptoactivos, plazos).”"},{"n":8155,"m":1,"q":"¿Qué herramienta del tema se usa para analizar reputación y relaciones entre archivos, URL, dominios e IP?","o":["VirusTotal","Guymager","Timesketch","Volatility 3"],"a":0,"e":"Según los apuntes: “VirusTotal: reputación y relaciones entre archivos, URL, dominios e IP.”"},{"n":8156,"m":1,"q":"¿Para qué se citan Shodan y Censys?","o":["Para exposición de servicios desde Internet","Para análisis de memoria RAM","Para crear imágenes forenses","Para cifrar backups"],"a":0,"e":"Según los apuntes: “Shodan / Censys: exposición de servicios desde Internet.”"},{"n":8157,"m":1,"q":"¿Qué combinación se utiliza para reconstrucción histórica de registros y resoluciones?","o":["RDAP/WHOIS y passive DNS","MISP y OpenCTI exclusivamente","Volatility y MemProcFS","KAPE y Velociraptor"],"a":0,"e":"Según los apuntes: “RDAP/WHOIS, passive DNS: reconstrucción histórica de registro y resoluciones.”"},{"n":8158,"m":1,"q":"¿Qué precaución se exige antes de subir una muestra o URL a un servicio público?","o":["Comprobar su política de visibilidad","Desactivar siempre el hash","Convertirla primero en PDF","Publicarla en redes sociales"],"a":0,"e":"Según los apuntes: “Precaución operativa: antes de subir una muestra o URL a un servicio público hay que comprobar su política de visibilidad, pues puede alertar al adversario o revelar información del caso a terceros.”"},{"n":8159,"m":1,"q":"En la línea temporal del incidente, ¿qué dato temporal debe conservarse además de fecha y hora?","o":["La zona horaria","El color del escritorio","La marca del teclado","La resolución de pantalla"],"a":0,"e":"Según los apuntes: “Línea temporal: fecha/hora original, zona horaria, fuente, nivel de confianza — separando siempre eventos confirmados de inferencias.”"},{"n":8160,"m":1,"q":"¿Qué significa clasificar un activo como «sin indicios»?","o":["Que se garantiza que nunca fue comprometido","Que las fuentes revisadas no muestran actividad dentro de sus límites","Que debe considerarse confirmado","Que necesariamente estaba aislado"],"a":1,"e":"Según los apuntes: “Elaboración de hipótesis (proceso en 6 pasos): formular de modo concreto y falsable → enumerar hechos a favor y en contra → predecir qué rastros deberían existir → buscar nuevas fuentes → revisar (confirmar/descartar) → comunicar el nivel de confianza sin convertir posibilidades en certezas.”"},{"n":8161,"m":2,"q":"¿Qué controles sitúa el documento en la capa de usuario e identidad?","o":["MFA, mínimo privilegio y separación de cuentas","WAF, CDN y DNS sinkhole","Solo cifrado de disco","Únicamente copias de seguridad"],"a":0,"e":"Según los apuntes: “Usuario e identidad → MFA, mínimo privilegio, separación de cuentas.”"},{"n":8162,"m":2,"q":"¿Qué controles se asocian a la capa de datos?","o":["Cifrado, permisos, backup e inmutabilidad","IDS, VPN y firewall","EDR, FIM y control de aplicaciones","Solo formación"],"a":0,"e":"Según los apuntes: “Datos → cifrado, permisos, backup, inmutabilidad.”"},{"n":8163,"m":2,"q":"¿Qué afirma el tema sobre Zero Trust y la defensa en profundidad?","o":["Zero Trust la sustituye por completo","Zero Trust la complementa","Son conceptos incompatibles","Zero Trust solo se aplica a backups"],"a":1,"e":"Según los apuntes: “Zero Trust complementa (no sustituye) a la defensa en profundidad: no confiar de forma permanente en una identidad/equipo/ubicación, verificar explícitamente, mínimo privilegio, y asumir que la intrusión puede producirse.”"},{"n":8164,"m":2,"q":"¿Cuál es el primer paso del ciclo de gestión de vulnerabilidades descrito?","o":["Inventariar activos","Parchear sin analizar","Bloquear todas las IP","Eliminar los registros"],"a":0,"e":"Según los apuntes: “Ciclo de gestión de vulnerabilidades: inventariar activos → escanear → priorizar (por exposición, criticidad e impacto, no solo por puntuación) → parchear/mitigar → verificar.”"},{"n":8165,"m":2,"q":"¿Cómo debe priorizarse una vulnerabilidad según el documento?","o":["Solo por puntuación CVSS","Por exposición, criticidad e impacto, no solo por puntuación","Por antigüedad del sistema únicamente","Por número de usuarios del SOC"],"a":1,"e":"Según los apuntes: “Ciclo de gestión de vulnerabilidades: inventariar activos → escanear → priorizar (por exposición, criticidad e impacto, no solo por puntuación) → parchear/mitigar → verificar.”"},{"n":8166,"m":2,"q":"¿Qué herramienta cita el tema para gestión o escaneo de vulnerabilidades?","o":["Greenbone/OpenVAS","Wireshark exclusivamente","Timesketch","Chainalysis"],"a":0,"e":"Según los apuntes: “Herramienta: Greenbone/OpenVAS. Ciclo de gestión de vulnerabilidades: inventariar activos → escanear → priorizar (por exposición, criticidad e impacto, no solo por puntuación) → parchear/mitigar → verificar.”"},{"n":8167,"m":2,"q":"¿Cuál de estas acciones forma parte del hardening?","o":["Eliminar servicios innecesarios y cerrar puertos","Abrir todos los puertos por defecto","Compartir credenciales administrativas","Desactivar el mínimo privilegio"],"a":0,"e":"Según los apuntes: “Hardening: eliminar servicios/cuentas innecesarias, cerrar puertos, cambiar credenciales por defecto, mínimo privilegio, AppArmor/SELinux. Herramientas: Lynis, OpenSCAP, CIS Benchmarks, nftables.”"},{"n":8168,"m":2,"q":"¿Qué control se propone frente al credential stuffing?","o":["MFA, no reutilización de contraseñas y detección de anomalías","Solo aumentar el ancho de banda","Desactivar los logs","Permitir contraseñas repetidas"],"a":0,"e":"Según los apuntes: “Credential stuffing → MFA, no reutilización de contraseñas, detección de anomalías.”"},{"n":8169,"m":2,"q":"¿Cuál es la política base recomendada para un firewall?","o":["Permitir por defecto","Denegar por defecto","Aceptar solo tráfico HTTP","No considerar el estado de conexión"],"a":1,"e":"Según los apuntes: “Firewall: decide sobre IP, puerto, protocolo y estado de la conexión — política base: denegar por defecto. (OPNsense, pfSense, nftables)”"},{"n":8170,"m":2,"q":"¿Qué objetivo tiene la segmentación de red?","o":["Evitar que comprometer un equipo dé acceso automático a servidores o backups","Acelerar todas las conexiones externas","Eliminar la necesidad de MFA","Sustituir el parcheado"],"a":0,"e":"Según los apuntes: “Segmentación: si un equipo se compromete, el atacante no obtiene automáticamente acceso a servidores o backups.”"},{"n":8171,"m":2,"q":"Si un DDoS ya satura el enlace, ¿qué indica el tema que suele ser necesario?","o":["Mitigación aguas arriba, CDN o distribución de carga","Solo un antivirus local","Únicamente FIM","Cambiar las contraseñas del navegador"],"a":0,"e":"Según los apuntes: “DoS/DDoS: el filtrado local ayuda si el cuello de botella está en el servidor, no si el enlace ya está saturado (requiere mitigación aguas arriba, CDN, distribución de carga).”"},{"n":8172,"m":2,"q":"¿Qué diferencia funcional señala el documento entre Suricata y Zeek?","o":["Suricata trabaja con firmas/reglas; Zeek genera registros estructurados de contexto","Zeek cifra tráfico y Suricata restaura backups","Ambos son gestores de contraseñas","Suricata solo sirve para correo"],"a":0,"e":"Según los apuntes: “Zeek (analizador pasivo): genera registros estructurados (conn.log, dns.log, http.log, ssl.log, files.log) → responde qué ha ocurrido, útil para beaconing o protocolos inesperados.”"},{"n":8173,"m":2,"q":"¿Qué limita el virtual patching?","o":["Reduce temporalmente la exposición, pero no elimina la vulnerabilidad","Elimina definitivamente el fallo de código","Sustituye todas las actualizaciones","Impide cualquier ataque futuro"],"a":0,"e":"Según los apuntes: “El virtual patching reduce la exposición temporalmente, sin eliminar la vulnerabilidad. Coraza + OWASP Core Rule Set ejemplifican el flujo: petición → normalización → reglas CRS → registro o bloqueo.”"},{"n":8174,"m":2,"q":"¿Qué monitoriza FIM para detectar cambios?","o":["Hash, permisos y propietario de archivos","Solo direcciones IP externas","Únicamente la velocidad del disco","Exclusivamente sesiones VPN"],"a":0,"e":"Según los apuntes: “FIM (monitorización de integridad): compara hash/permisos/propietario de archivos y alerta ante cambios — un cambio no es necesariamente malicioso, debe interpretarse en contexto.”"},{"n":8175,"m":2,"q":"¿Por qué debe protegerse la línea base de FIM?","o":["Porque si el atacante la modifica, la comprobación pierde valor","Porque ocupa demasiado ancho de banda","Porque sustituye al SIEM","Porque impide el uso de hashes"],"a":0,"e":"Según los apuntes: “La línea base debe protegerse: si el atacante puede modificarla también, la comprobación pierde valor. FIM (monitorización de integridad): compara hash/permisos/propietario de archivos y alerta ante cambios — un cambio no es necesariamente malicioso, debe interpretarse en contexto.”"},{"n":8176,"m":2,"q":"¿Qué función principal cumple un SIEM según el tema?","o":["Correlacionar señales de distintas fuentes para construir una secuencia con significado","Bloquear físicamente el cableado","Sustituir todas las herramientas endpoint","Crear copias forenses de RAM"],"a":0,"e":"Según los apuntes: “El SIEM las correlaciona para construir una secuencia con significado. (Wazuh, OpenSearch, Grafana) Un ataque rara vez deja una sola huella: firewall, sistema operativo, endpoint y servidor web registran señales distintas.”"},{"n":8177,"m":2,"q":"¿Qué nivel de ciberinteligencia responde a qué TTP emplean los adversarios?","o":["Estratégico","Operacional","Táctico","Técnico"],"a":2,"e":"Según los apuntes: “Nivel táctico → ¿qué TTP emplean? (orienta MITRE ATT&CK)”"},{"n":8178,"m":2,"q":"¿Cuál es la primera etapa del ciclo de inteligencia citado?","o":["Necesidad","Difusión","Revisión","Procesamiento"],"a":0,"e":"Según los apuntes: “Ciclo de inteligencia: necesidad → recolección → procesamiento → análisis → difusión → revisión. (MISP, OpenCTI, MITRE ATT&CK). Un indicador sin contexto envejece rápido: hay que conocer su procedencia, confianza y vigencia.”"},{"n":8179,"m":2,"q":"¿Qué distingue al threat hunting según el tema?","o":["Parte de una hipótesis y busca de forma proactiva","Consiste en explorar sin hipótesis cualquier anomalía","Se limita a instalar antivirus","Solo revisa incidentes cerrados"],"a":0,"e":"Según los apuntes: “Threat hunting: búsqueda proactiva a partir de una hipótesis, no una exploración abierta de cualquier anomalía. Sigue: inteligencia/anomalía → hipótesis → consulta → análisis → conclusión → mejora.”"},{"n":8180,"m":2,"q":"¿Qué demuestra realmente una validación continua bien hecha?","o":["Que la telemetría prevista se genera y la detección se activa en pruebas controladas","Que una matriz ATT&CK coloreada basta como prueba","Que todo control instalado es eficaz","Que no hacen falta casos negativos"],"a":0,"e":"Según los apuntes: “La validación continua comprueba, mediante pruebas controladas, si se genera la telemetría prevista y si la detección se activa realmente. (Atomic Red Team, MITRE Caldera — siempre con autorización y alcance definido.)”"},{"n":8181,"m":3,"q":"¿Qué condición atribuye el documento a ISO/IEC 27001?","o":["Es voluntaria y sirve de referencia para SGSI","Es obligatoria para toda persona física","Es una ley penal","Es un protocolo de red"],"a":0,"e":"Según los apuntes: “ISO/IEC 27001: estándar internacional de referencia para los SGSI (voluntario, no obligatorio).”"},{"n":8182,"m":3,"q":"¿A quién obliga también la Política de Seguridad de la Información además del personal propio?","o":["A terceros que presten servicio","Solo a proveedores extranjeros","Únicamente a jueces","A ningún tercero"],"a":0,"e":"Según los apuntes: “La Política de Seguridad de la Información se apoya en gestión de riesgos, cumplimiento normativo, concienciación/formación y continuidad del servicio; es de obligado cumplimiento para el personal propio y para terceros que presten servicio.”"},{"n":8183,"m":3,"q":"¿Qué función diferencia habitualmente a un CSIRT de un CERT?","o":["El CSIRT se asocia más a respuesta directa; el CERT a prevención","El CERT detiene sospechosos","El CSIRT solo redacta leyes","No existe ninguna relación entre ambos"],"a":0,"e":"Según los apuntes: “CERT vs CSIRT: se usan a menudo como sinónimos, pero el CSIRT se asocia a la respuesta directa a incidentes, mientras el CERT se orienta más a la prevención.”"},{"n":8184,"m":3,"q":"¿Qué hace principalmente un SOC?","o":["Monitoriza, detecta y analiza ciberataques","Dicta sentencias","Gestiona únicamente nóminas","Sustituye a los tribunales"],"a":0,"e":"Según los apuntes: “SOC (Security Operations Center): equipo especializado que monitoriza, detecta y analiza ciberataques. Red nacional de más de 300 entidades.”"},{"n":8185,"m":3,"q":"¿Qué fase del procedimiento de incidentes incluye crear y formar al equipo de respuesta?","o":["Preparación","Cierre","Clasificación","Exfiltración"],"a":0,"e":"Según los apuntes: “Preparación: creación y formación del equipo de respuesta, herramientas y recursos.”"},{"n":8186,"m":3,"q":"¿Cuál es la prioridad de la fase de contención, mitigación y recuperación?","o":["Mitigar el impacto antes de restaurar el servicio","Cerrar el ticket sin análisis","Publicar todos los IOC","Eliminar cualquier registro"],"a":0,"e":"Según los apuntes: “Contención, mitigación y recuperación: mitigar el impacto (prioridad) y restaurar el servicio.”"},{"n":8187,"m":3,"q":"¿Qué efecto tiene la fase post-incidente sobre la preparación?","o":["La retroalimenta con informes y medidas preventivas","La elimina del ciclo","Impide documentar lecciones","Solo archiva sin cambios"],"a":0,"e":"Según los apuntes: “Post-incidente: informe y medidas de prevención futura — retroalimenta la fase de preparación.”"},{"n":8188,"m":3,"q":"En servicios de confianza sometidos a eIDAS, ¿qué plazo cita el documento para el detalle completo tras la primera notificación?","o":["1 mes","72 horas","24 horas","6 meses"],"a":0,"e":"Según los apuntes: “Casos especiales de notificación: servicios de confianza (Reglamento eIDAS — DNIe, sede electrónica...) exigen notificación al organismo de supervisión en ≤ 24 horas (primera notificación) y detalle completo en 1 mes.”"},{"n":8189,"m":3,"q":"¿Qué paso sigue al registro en el flujo de trabajo del incidente?","o":["Clasificación","Cierre","Respuesta","Entrada"],"a":0,"e":"Según los apuntes: “Ante cualquier presunto incidente: ¿cómo se tomó conocimiento? → ¿qué hacer primero? → ¿hay acciones tempranas de mitigación? → ¿qué tipo/clasificación según ENISA? → ¿lo confirman las TTP detectadas? → ¿qué acciones adoptar como respuesta? (Aplicable, por ejemplo, a un DDoS o a un session hijacking.)”"},{"n":8190,"m":3,"q":"¿Qué caracteriza al IDS citado frente a un EDR?","o":["Carece de capacidad de respuesta propia","Siempre ejecuta recuperación automática","Solo funciona en endpoints móviles","Es una norma jurídica"],"a":0,"e":"Según los apuntes: “Crowdstrike) vs IDS (sin capacidad de respuesta, ej. Snort/Suricata); por método: basado en firmas o en anomalías.”"},{"n":8191,"m":3,"q":"¿Qué aporta un SOAR frente a la mera centralización de eventos?","o":["Orquestación y respuesta automatizada","Solo almacenamiento de copias","Cifrado de discos físicos","Gestión de dominios WHOIS"],"a":0,"e":"Según los apuntes: “Splunk) vs SOAR (orquestación y respuesta automatizada, ej. Correlación: SIEM (centraliza y correlaciona eventos, ej.”"},{"n":8192,"m":3,"q":"Antes de abrir un nuevo registro de incidente, ¿qué exige el documento comprobar?","o":["Que no esté ya registrado","Que tenga siempre malware","Que exista una denuncia judicial","Que el incidente sea crítico"],"a":0,"e":"Según los apuntes: “Normas obligatorias: comprobar que no esté ya registrado, asignar referencia única, aportar información técnica suficiente, fijar tipicidad y criticidad.”"},{"n":8193,"m":3,"q":"¿En qué categoría ENISA encajaría un problema cuyo efecto principal es impedir el acceso a un servicio?","o":["Disponibilidad","Contenido abusivo","Fraude exclusivamente","Obtención de información exclusivamente"],"a":0,"e":"Según los apuntes: “Taxonomía ENISA: contenido abusivo, código malicioso, obtención de información, intento de intrusión, intrusión, disponibilidad, fraude, seguridad de la información.”"},{"n":8194,"m":3,"q":"¿Qué nivel de peligrosidad asigna el documento a una APT?","o":["Crítico","Bajo","Medio","Alto"],"a":0,"e":"Según los apuntes: “Peligrosidad potencial (5 niveles): Bajo (spam, escaneo) · Medio (ingeniería social, vulnerabilidad conocida) · Alto (C2, sabotaje, DoS, phishing) · Muy alto (malware, ataque desconocido) · Crítico (APT, ciberterrorismo, infraestructuras críticas).”"},{"n":8195,"m":3,"q":"¿Qué representa una táctica en MITRE ATT&CK?","o":["El objetivo técnico perseguido","Un producto comercial concreto","Una dirección IP","Una sentencia judicial"],"a":0,"e":"Según los apuntes: “Táctica: objetivo técnico perseguido (acceso inicial, persistencia, movimiento lateral...).”"},{"n":8196,"m":3,"q":"¿Qué representa una técnica en MITRE ATT&CK?","o":["El método concreto para lograr una táctica","La suma de todas las leyes aplicables","Un nivel de criticidad ENISA","El informe final del incidente"],"a":0,"e":"Según los apuntes: “Técnica: método concreto para lograr esa táctica.”"},{"n":8197,"m":3,"q":"¿Qué significa TTP en el contexto descrito?","o":["Tácticas, técnicas y procedimientos realmente empleados","Ticket, triaje y prioridad","Tiempo, tráfico y protocolo","Telemetría, trazabilidad y parcheado"],"a":0,"e":"Según los apuntes: “TTP: tácticas + técnicas + procedimientos realmente empleados por un actor.”"},{"n":8198,"m":3,"q":"Cuando bloquear ya no es viable porque la vulnerabilidad fue explotada, ¿qué objetivo pasa a ser principal?","o":["Contención y mitigación para evitar movimiento lateral","Cerrar inmediatamente el caso","Desactivar todos los registros","Publicar la vulnerabilidad"],"a":0,"e":"Según los apuntes: “Contención / mitigación: objetivo principal cuando el bloqueo no es viable — evitar el movimiento lateral.”"},{"n":8199,"m":3,"q":"¿Por qué no debe precipitarse la recuperación?","o":["Porque reexponer el sistema puede repetir la explotación","Porque la continuidad no importa","Porque siempre destruye la RAM","Porque impide elaborar tickets"],"a":0,"e":"Según los apuntes: “Recuperación: garantizar la continuidad sin precipitarse (reexponer el sistema puede repetir la explotación).”"},{"n":8200,"m":3,"q":"¿Qué debe contener el cierre del incidente según el documento?","o":["Un informe final cronológico con valor histórico y legal","Solo una lista de contraseñas","Únicamente el nombre del malware","Un borrado total de registros"],"a":0,"e":"Según los apuntes: “El cierre es la última fase: valora la respuesta dada, la persistencia residual y las debilidades descubiertas, y culmina en un informe final con valor de registro histórico y legal, detallando cronológicamente todo el proceso.”"},{"n":8201,"m":4,"q":"¿Cuál es el criterio principal de clasificación del malware en el tema?","o":["Su finalidad","Su precio","Su lenguaje de programación exclusivamente","El país del atacante"],"a":0,"e":"Según los apuntes: “En la práctica las familias se solapan y muchas muestras combinan funciones; aun así, identificar la finalidad principal es lo que orienta la respuesta técnica y la calificación jurídica.”"},{"n":8202,"m":4,"q":"¿Qué huella caracteriza a un gusano?","o":["Tráfico lateral anómalo y saturación de segmentos","Solo una nota de rescate","Ausencia total de propagación","Únicamente cambios en cookies"],"a":0,"e":"Según los apuntes: “Gusano: propagarse sin ayuda — tráfico lateral anómalo y saturación de los segmentos que va infectando.”"},{"n":8203,"m":4,"q":"¿Qué rasgo distingue a un RAT?","o":["Control remoto estable y duradero con persistencia","Cifrado inmediato sin acceso remoto","Solo publicidad","Autoborrado tras una única exfiltración"],"a":0,"e":"Según los apuntes: “Frente al RAT: control remoto continuo; persiste y obedece.”"},{"n":8204,"m":4,"q":"¿Qué finalidad tiene un wiper?","o":["Destruir información de forma disruptiva, sin pedir rescate","Robar cookies para reventa","Mantener una sesión remota estable","Registrar pulsaciones únicamente"],"a":0,"e":"Según los apuntes: “Wiper: destruir la información — daño irreversible y sin petición de rescate; finalidad disruptiva, no económica.”"},{"n":8205,"m":4,"q":"¿Dónde deja especialmente huella el spyware según el documento?","o":["En conexiones salientes de red hacia infraestructura del atacante","Solo en impresiones locales","Únicamente en el BIOS","No deja ninguna huella"],"a":0,"e":"Según los apuntes: “Huella observable: poco en disco y mucho en red — conexiones salientes hacia infraestructura del atacante.”"},{"n":8206,"m":4,"q":"¿Qué artículo cita el tema para quien fabrica o facilita una herramienta de spyware?","o":["197 ter","264","570 bis exclusivamente","248 únicamente"],"a":0,"e":"Según los apuntes: “Encaje penal: artículos 197 y siguientes del Código Penal; el 197 ter alcanza a quien fabrica o facilita la herramienta.”"},{"n":8207,"m":4,"q":"¿Qué familia clásica de spyware registra lo tecleado?","o":["Keylogger","Wiper","RAT","Ransomware"],"a":0,"e":"Según los apuntes: “Keyloggers: registran todo lo tecleado, normalmente como medio para obtener credenciales. Hoy son más un componente dentro de familias mayores que un producto en sí mismo.”"},{"n":8208,"m":4,"q":"¿Qué caracteriza al infostealer frente a un RAT?","o":["Extrae rápidamente y se va, sin buscar control remoto persistente","Mantiene control remoto continuo","Cifra todos los archivos","Solo roba datos bancarios"],"a":0,"e":"Según los apuntes: “Frente al RAT: control remoto continuo; persiste y obedece.”"},{"n":8209,"m":4,"q":"¿Qué permiten las cookies de sesión robadas según el documento?","o":["Bypass de MFA mediante session hijacking","Cifrar backups","Ejecutar un DDoS volumétrico por sí solas","Crear CVE"],"a":0,"e":"Según los apuntes: “Cookies de sesión: permiten bypass de MFA mediante session hijacking.”"},{"n":8210,"m":4,"q":"¿Qué actor del modelo MaaS vende el stealer como suscripción?","o":["Operador","Víctima","Comprador final","SOC"],"a":0,"e":"Según los apuntes: “Operador: vende el stealer como suscripción mensual.”"},{"n":8211,"m":4,"q":"¿Qué hace el afiliado en la cadena MaaS descrita?","o":["Compra acceso y monta campañas de distribución","Solo analiza PCAP","Dicta medidas judiciales","Administra el RIPE NCC"],"a":0,"e":"Según los apuntes: “Afiliado: compra acceso y monta las campañas de distribución.”"},{"n":8212,"m":4,"q":"¿Cuál es el precio medio por log corporativo citado en el documento?","o":["10-15 dólares","100-250 dólares","1.000-2.000 dólares","1 dólar fijo"],"a":0,"e":"Según los apuntes: “La economía en cifras: suscripción típica al stealer, 100-250 $/mes; precio medio por log corporativo, 10-15 $; multiplicador si el log incluye sesión SSO, x10-x100; tiempo medio entre exfiltración y reventa, 24 horas.”"},{"n":8213,"m":4,"q":"¿Qué incremento puede tener un log si incluye sesión SSO?","o":["x10-x100","x2 exclusivamente","x1,5","No cambia"],"a":0,"e":"Según los apuntes: “La economía en cifras: suscripción típica al stealer, 100-250 $/mes; precio medio por log corporativo, 10-15 $; multiplicador si el log incluye sesión SSO, x10-x100; tiempo medio entre exfiltración y reventa, 24 horas.”"},{"n":8214,"m":4,"q":"¿Qué ocurrió en el caso Orange España de enero de 2024 según el tema?","o":["Credenciales RIPE NCC robadas por Raccoon Stealer llevaron al secuestro del ASN durante horas","Un ransomware cifró todos los hospitales","Se perdió una copia física de seguridad","Un DDoS destruyó datos"],"a":0,"e":"Según los apuntes: “Orange España (enero 2024): credenciales del portal RIPE NCC robadas por Raccoon Stealer → secuestro del ASN durante horas.”"},{"n":8215,"m":4,"q":"¿Qué lenguaje se asocia a RedLine Stealer?","o":[".NET (C#)","Java exclusivamente","Rust exclusivamente","PHP"],"a":0,"e":"Según los apuntes: “Lenguaje: .NET (C#) — usa WCF para C2.”"},{"n":8216,"m":4,"q":"¿Qué comportamiento de persistencia se atribuye habitualmente a RedLine?","o":["Ninguna o prácticamente ninguna; prioriza exfiltración rápida y borrado","Persistencia indefinida obligatoria","Solo persiste en routers","Crea siempre un servicio de dominio"],"a":0,"e":"Según los apuntes: “Persistencia: habitualmente NINGUNA — diseñado para exfiltración rápida y borrado.”"},{"n":8217,"m":4,"q":"¿Cómo se comunica RedLine con su C2 según la ficha?","o":["TCP sobre puerto efímero con datos serializados y namespaces tempuri.org","Solo HTTPS por 443","Solo DNS sobre 53","Únicamente correo SMTP"],"a":0,"e":"Según los apuntes: “Comunicación C2: TCP sobre puerto efímero, datos serializados con namespaces tempuri.org.”"},{"n":8218,"m":4,"q":"¿Qué acción corresponde al intervalo 30-90 minutos de las primeras cuatro horas?","o":["Capturar imagen y memoria, resetear credenciales y revocar sesiones","Reportar como última fase","Rotar tokens tras 180 minutos exclusivamente","Solo observar sin aislar"],"a":0,"e":"Según los apuntes: “30-90 min — Contención: capturar imagen y memoria, forzar reset de credenciales, revocar cookies/sesiones.”"},{"n":8219,"m":4,"q":"¿Qué medida limita la utilidad del session hijacking?","o":["Una vida útil corta de las cookies","Mantener sesiones indefinidas","Desactivar MFA","Guardar secretos en el navegador"],"a":0,"e":"Según los apuntes: “Vida útil de cookie corta: limita la utilidad del session hijacking.”"},{"n":8220,"m":4,"q":"¿Sobre qué copia debe realizarse el análisis de un PCAP con valor probatorio?","o":["Sobre una copia de trabajo cuyo hash coincide con el original sellado","Siempre sobre el original","Sobre una versión subida a un servicio público","Sobre una captura recodificada sin hash"],"a":0,"e":"Según los apuntes: “De la captura a la evidencia válida — el valor probatorio de un .pcap no está solo en su contenido, sino en cómo se obtiene, se sella y se custodia: 1) Obtención (captura desde la sonda corporativa, documentando fecha, punto de captura, duración y responsable) → 2) Sellado (hash SHA-256 del fichero y acta de obtención; cualquier alteración posterior sería detectable) → 3) Copia de trabajo (el análisis nunca se realiza sobre el original, sino sobre una copia cuyo hash coincide con el sellado) → 4”"},{"n":8221,"m":5,"q":"¿Qué hace que un incidente pase a ser ciberdelito para las FCS según el tema?","o":["La existencia de un hecho tipificado penalmente","Superar siempre un umbral económico","Afectar a más de diez equipos","Usar criptomonedas"],"a":0,"e":"Según los apuntes: “El límite entre un incidente de ciberseguridad y un ciberdelito es puramente jurídico: lo que para una empresa es una crisis de disponibilidad/confidencialidad, para las Fuerzas y Cuerpos de Seguridad (FCS) es la noticia criminis de un hecho tipificado penalmente.”"},{"n":8222,"m":5,"q":"¿Qué característica de la escena digital obliga a actuar con inmediatez?","o":["La volatilidad de evidencias como RAM y conexiones activas","Su carácter siempre local","La ausencia de datos técnicos","Que nunca cambia con el tiempo"],"a":0,"e":"Según los apuntes: “Inmediatez operativa: asegurar evidencia que puede desaparecer en segundos (RAM, conexiones activas).”"},{"n":8223,"m":5,"q":"¿Qué estándar cita el documento en relación con rigor procesal y evidencia digital?","o":["ISO/IEC 27037","ISO 9001","PCI-DSS","eIDAS únicamente"],"a":0,"e":"Según los apuntes: “Rigor procesal: cadena de custodia y estándares como ISO/IEC 27037 para que la evidencia sea admisible.”"},{"n":8224,"m":5,"q":"¿Cuál es el objetivo principal de la respuesta corporativa frente a la investigación policial?","o":["Resiliencia, mitigación del daño y restauración del negocio","Detención de autores como único objetivo","Dictar sentencia","Emitir órdenes europeas de investigación"],"a":0,"e":"Según los apuntes: “Respuesta corporativa: busca resiliencia, mitigar el daño y restaurar el negocio. Investigación policial: busca la persecución del delito, pruebas válidas y la detención de los autores.”"},{"n":8225,"m":5,"q":"¿Qué ejemplo de «transmutación conceptual» ofrece el documento para una alerta de inyección SQL?","o":["Traducirla a posibles tipos penales como acceso ilícito o daños informáticos","Convertirla en una incidencia de hardware","Clasificarla siempre como DDoS","Ignorarla si el SOC ya la registró"],"a":0,"e":"Según los apuntes: “Transmutación conceptual: un analista SOC ve una «alerta por inyección SQL»; el investigador debe traducirla a un tipo penal (art. 197 bis CP — acceso ilícito; art.”"},{"n":8226,"m":5,"q":"¿Qué ámbito atribuye el tema al INCIBE-CERT?","o":["Ciudadanos, pymes y operadores privados","Solo sector militar","Únicamente jueces y fiscales","Exclusivamente infraestructuras extranjeras"],"a":0,"e":"Según los apuntes: “INCIBE-CERT: referencia para ciud allet¿Qué son?”"},{"n":8840,"m":0,"q":"¿Qué ocurre con una transacción válida antes de que sea incluida en un bloque?","o":["Se añade al mempool","Se convierte en clave privada","Se elimina de la red","Se transforma en un fork"],"a":0,"e":"Según los apuntes: “3 Si es válida, se añade al mempool de cada nodo”"},{"n":9001,"m":1,"q":"Una criptomoneda es…","o":["Dinero físico respaldado por un banco central","Un activo digital que usa cifrado criptográfico para garantizar su titularidad y controlar la creación de unidades","Una acción cotizada","Una tarjeta de pago"],"a":1,"e":"Según los apuntes: “Una criptomoneda es un activo digital que emplea un cifrado criptográfico para garantizar su titularidad, asegurar la integridad de las transacciones y controlar la creación de unidades adicionales, es decir, evitar que alguien pueda copiarlas como se haría con una foto.”"},{"n":9002,"m":1,"q":"Las criptomonedas se almacenan en…","o":["Una cartera digital","Una caja fuerte del emisor","El banco central","Un servidor único de la empresa emisora"],"a":0,"e":"Según los apuntes: “No existen de forma física: se almacenan en una cartera digital. No están respaldadas por un banco central que asegure su valor; su precio varía en función de la oferta y la demanda, no es obligatorio aceptarlas como medio de pago y no son una unidad de cuenta estable, por lo que no compiten con el dinero oficial.”"},{"n":9003,"m":1,"q":"La clave privada de Bitcoin es…","o":["Una clave pública derivada de la dirección","Un hash de 80 bytes","Un código de 12 palabras públicas","Un número aleatorio de 256 bits que debe mantenerse secreto"],"a":3,"e":"Según los apuntes: “La clave privada es un número aleatorio de 256 bits que debe mantenerse en secreto: quien la posee controla los fondos. Existen 2^256 claves posibles (~10^77).”"},{"n":9004,"m":1,"q":"La definición técnica de criptoactivo incluye…","o":["Emisión por un banco central","Intermediación bancaria obligatoria","Red descentralizada, criptografía, transferencia P2P y libro mayor distribuido","Soporte físico"],"a":2,"e":"Según los apuntes: “Un criptoactivo admite una definición técnica: existe en una red descentralizada, utiliza criptografía para su seguridad, se transfiere entre pares (P2P) y se registra en un libro mayor distribuido.”"},{"n":9005,"m":1,"q":"Un token se diferencia de una criptomoneda en que…","o":["Es siempre el activo nativo de su red","Se emite sobre una blockchain ya existente (ej. USDT)","No usa criptografía","No puede transferirse"],"a":1,"e":"Según los apuntes: “Conviene distinguir: criptomoneda es el token nativo de su propia blockchain (por ejemplo BTC o ETH); token es un activo digital emitido sobre una blockchain ya existente (por ejemplo USDT); criptoactivo es el término genérico y jurídico que engloba ambos.”"},{"n":9006,"m":1,"q":"¿En qué año se publicó el whitepaper de Bitcoin?","o":["2008","2009","2011","2015"],"a":0,"e":"Según los apuntes: “Los hitos fundamentales son: 2008, publicación del whitepaper de Bitcoin por Satoshi Nakamoto; 2009, bloque génesis y nacimiento de la red; 2011, Litecoin, primer gran «altcoin»; 2014, colapso de Mt.”"},{"n":9007,"m":1,"q":"Un soft fork es un cambio…","o":["Que crea siempre una nueva moneda","Que elimina la prueba de trabajo","Que reinicia la cadena","Compatible hacia atrás (ej. SegWit, 2017)"],"a":3,"e":"Según los apuntes: “El soft fork es un cambio compatible hacia atrás: los nodos antiguos siguen aceptando bloques nuevos (ejemplo: SegWit, 2017). El hard fork rompe la compatibilidad y puede generar una nueva cadena (ejemplo: Bitcoin Cash, 2017).”"},{"n":9008,"m":1,"q":"Las frases semilla BIP-39 utilizan una lista de…","o":["1.024 palabras","256 palabras","2.048 palabras","4.096 palabras"],"a":2,"e":"Según los apuntes: “Las frases semilla (BIP-39) son secuencias de 12 a 24 palabras tomadas de una lista estandarizada de 2.048 palabras. Representan la clave maestra de la wallet, permiten recuperar todos los fondos y son portables entre wallets.”"},{"n":9009,"m":1,"q":"El mempool es…","o":["El conjunto de bloques ya minados","La memoria de transacciones pendientes de confirmar","El registro de claves privadas","La red de mineros"],"a":1,"e":"Según los apuntes: “El mempool es la «sala de espera» o memoria de transacciones pendientes. Los nodos validan la firma y los fondos disponibles, y si es válida la añaden a su mempool; los mineros seleccionan por comisión (a mayor comisión, más rápida la confirmación).”"},{"n":9010,"m":1,"q":"Se dice que los criptoactivos son pseudoanónimos porque…","o":["Son anónimos pero con un registro público","Son totalmente privados","Requieren identificación bancaria","No dejan rastro"],"a":0,"e":"Según los apuntes: “Los criptoactivos son descentralizados, seguros (gracias a la criptografía asimétrica), pseudoanónimos (anónimos pero con un registro público) y funcionan sin intermediarios ni autoridad de control.”"},{"n":9011,"m":1,"q":"Ejemplos de stablecoins son…","o":["BTC, LTC y BCH","ETH, SOL y ADA","XMR y ZEC","USDT, USDC y DAI"],"a":3,"e":"Según los apuntes: “Conviene distinguir: criptomoneda es el token nativo de su propia blockchain (por ejemplo BTC o ETH); token es un activo digital emitido sobre una blockchain ya existente (por ejemplo USDT); criptoactivo es el término genérico y jurídico que engloba ambos.”"},{"n":9012,"m":1,"q":"Los ART (MiCA) están referenciados a…","o":["Una única moneda fiat","Nada, sin respaldo","Una cesta de activos (divisas, materias primas)","El precio de Bitcoin"],"a":2,"e":"Según los apuntes: “Bajo el Reglamento (UE) 2023/1114 (MiCA) la clasificación legal distingue: ART (Asset-Referenced Tokens, valor estable referenciado a una cesta de activos: divisas, materias primas), EMT (E-Money Tokens, valor estable referenciado a una única moneda fiat) y otros criptoactivos (criptomonedas, tokens de gobernanza y de utilidad).”"},{"n":9013,"m":1,"q":"Los EMT (MiCA) están referenciados a…","o":["Una cesta de activos","Una única moneda fiat","Materias primas","Otros criptoactivos"],"a":1,"e":"Según los apuntes: “Bajo el Reglamento (UE) 2023/1114 (MiCA) la clasificación legal distingue: ART (Asset-Referenced Tokens, valor estable referenciado a una cesta de activos: divisas, materias primas), EMT (E-Money Tokens, valor estable referenciado a una única moneda fiat) y otros criptoactivos (criptomonedas, tokens de gobernanza y de utilidad).”"},{"n":9014,"m":1,"q":"Un nodo podado…","o":["Valida todo pero elimina datos antiguos para ahorrar espacio","Solo verifica cabeceras","No valida transacciones","Almacena dos copias de la cadena"],"a":0,"e":"Según los apuntes: “Sus propiedades son: descentralización (sin servidor central, réplica en múltiples nodos), inmutabilidad (los datos confirmados no pueden modificarse), transparencia (cualquiera puede consultar el registro completo) y verificabilidad (cada participante valida de forma independiente).”"},{"n":9015,"m":1,"q":"El encabezado de un bloque incluye…","o":["Solo las transacciones","La clave privada del minero","La frase semilla","Versión, hash anterior, raíz de Merkle, timestamp, bits y nonce"],"a":3,"e":"Según los apuntes: “El encabezado ocupa 80 bytes e incluye: versión del software, hash del bloque anterior (el enlace que forma la cadena), raíz de Merkle (hash de todas las transacciones), timestamp, bits (objetivo de dificultad) y nonce (valor ajustable por el minero).”"},{"n":9016,"m":1,"q":"La transacción COINBASE…","o":["Es la primera transacción de un usuario","Paga las comisiones al exchange","Crea nuevos BTC y la recompensa del minero, sin entradas","Une dos bloques"],"a":2,"e":"Según los apuntes: “La primera transacción de cada bloque es la COINBASE, que crea nuevos BTC y la recompensa del minero; no tiene entradas y es la única forma de crear nuevos bitcoins.”"},{"n":9017,"m":1,"q":"La salida de SHA-256 es de…","o":["128 bits","256 bits (64 caracteres hexadecimales)","80 bytes","512 bits"],"a":1,"e":"Según los apuntes: “Su salida es de 256 bits (64 caracteres hexadecimales); fue desarrollada por la NSA; Bitcoin usa doble SHA-256 en el encabezado y la emplea en minería, árbol de Merkle, direcciones y prueba de trabajo.”"},{"n":9018,"m":1,"q":"Un nodo ligero (SPV)…","o":["Solo verifica cabeceras y confía en nodos completos","Almacena toda la cadena","Mina bloques","Emite criptoactivos"],"a":0,"e":"Según los apuntes: “En la verificación, el nodo recibe la transacción firmada, calcula el hash, usa la clave pública para verificar la firma y, si es válida, la transacción es auténtica.”"},{"n":9019,"m":1,"q":"El sistema PoW tolera hasta…","o":["Un 10 %","Un 75 %","Un 100 %","Un 49 % de mineros maliciosos"],"a":3,"e":"Según los apuntes: “Una transacción de Bitcoin tiene cuatro elementos: entradas (inputs), que son referencias a operaciones pasadas cuyo resultado no se ha gastado, conocidas como UTXOs (Unspent Transaction Output); salidas (outputs), que indican la dirección destino e incluyen las direcciones de cambio para las vueltas; identificador (Txid), el hash único de la transacción; y comisión (fee), el pequeño pago que reciben los mineros por procesarla.”"},{"n":9020,"m":1,"q":"Para hacer staking en Ethereum se requieren…","o":["10 ETH","1 ETH","32 ETH","100 ETH"],"a":2,"e":"Según los apuntes: “Gox; 2015, Ethereum y los contratos inteligentes; 2016, ataque a The DAO; 2017, boom de las ICO con más de 1.000 criptoactivos; 2021, El Salvador adopta Bitcoin como moneda de curso legal.”"},{"n":9021,"m":2,"q":"La Ley 10/2010 regula principalmente…","o":["El mercado de valores","La prevención del blanqueo de capitales y de la financiación del terrorismo","La fiscalidad de las criptomonedas","La protección de datos"],"a":1,"e":"Según los apuntes: “Los hitos principales son: Ley 10/2010 (28.04.2010, prevención del blanqueo de capitales, base del sistema); RDL 7/2021 (27.04.2021, modifica la Ley 10/2010 e incorpora a los proveedores cripto); Ley 11/2021 (09.07.2021, obligaciones fiscales); Ley 6/2023 (LMVSI) (17.03.2023, mer a UE); y Reglamento AMLR (19.06.2024, nuev”"},{"n":9025,"m":2,"q":"La moneda virtual se define en el…","o":["Art. 14.5 del Reglamento 2023/1113","Art. 1.5 de la Ley 10/2010","Art. 2.1 z de la Ley 10/2010","Art. 10 de MiCA"],"a":1,"e":"Según los apuntes: “El glosario cripto de la ley recoge: moneda virtual (art. 1.5): representación digital de valor no emitida ni garantizada por un banco central, sin estatuto jurídico de moneda, pero aceptada como medio de cambio; cambio o exchange (art.”"},{"n":9026,"m":2,"q":"Los sujetos obligados cripto se designan en el…","o":["Art. 2.1 z de la Ley 10/2010","Art. 1.1","Art. 14.5","Art. 16.2"],"a":0,"e":"Según los apuntes: “Existe una tríada regulatoria europea: MiCA (Reglamento 2023/1114), que define quién es un proveedor de servicios (CASP) y regula su licencia; la Travel Rule o TFR (Reglamento 2023/1113), que define qué información debe viajar adjunta a los fondos y criptoactivos; y la normativa antiblanqueo (AMLR, Ley 10/2010), que define cómo deben organizarse los sujetos obligados.”"},{"n":9027,"m":2,"q":"Los tres pilares del cumplimiento son…","o":["Registro, sanción y formación","KYC, KYT y Travel Rule","Custodia, cambio y minería","Diligencia debida, control interno y comunicación con el SEPBLAC"],"a":3,"e":"Según los apuntes: “3.3 Los tres pilares del cumplimiento”"},{"n":9028,"m":2,"q":"Según la regla del 25 %, es titular real quien…","o":["Tenga un 25 % de comisión","Firme el 25 % de las operaciones","Posea o controle más del 25 % del capital o derechos de voto","Sea auditor externo"],"a":2,"e":"Según los apuntes: “La matriz para definir el titular real incluye la regla del 25 % (persona física que posea o controle, directa o indirectamente, más del 25 % del capital o de los derechos de voto) y los controladores (quien por otros medios ejerza el control real).”"},{"n":9029,"m":2,"q":"El examen externo del control interno es…","o":["Opcional","Anual y obligatorio","Cada cinco años","Solo tras una sanción"],"a":1,"e":"Según los apuntes: “Requiere un manual interno de políticas y procedimientos basado en un análisis previo de riesgos, un órgano de control interno (con nombramiento de un representante ante el SEPBLAC), un examen externo anual obligatorio por experto y programas de formación de empleados.”"},{"n":9030,"m":2,"q":"La prohibición de revelación (tipping off) impide…","o":["Revelar al cliente o a terceros que se ha comunicado información al SEPBLAC","Comunicar operaciones sospechosas","Auditar el sistema","Usar wallets propias"],"a":0,"e":"Según los apuntes: “Incluye el examen especial (analizar cualquier hecho u operación anómala y comunicar por iniciativa propia si hay indicios o certeza de relación con blanqueo o financiación del terrorismo), la comunicación sistemática (reporte automático mensual de operaciones específicas, por ejemplo movimientos físicos superiores a 30.000 euros) y la prohibición de revelación (tipping off): está terminantemente prohibido revelar al cliente o a terceros que se ha comunicado información al SEPBLAC.”"},{"n":9031,"m":2,"q":"La comunicación sistemática incluye, por ejemplo…","o":["Toda operación superior a 1 €","Solo operaciones internacionales","Las tarjetas de crédito","Movimientos físicos superiores a 30.000 €"],"a":3,"e":"Según los apuntes: “Incluye el examen especial (analizar cualquier hecho u operación anómala y comunicar por iniciativa propia si hay indicios o certeza de relación con blanqueo o financiación del terrorismo), la comunicación sistemática (reporte automático mensual de operaciones específicas, por ejemplo movimientos físicos superiores a 30.000 euros) y la prohibición de revelación (tipping off): está terminantemente prohibido revelar al cliente o a terceros que se ha comunicado información al SEPBLAC.”"},{"n":9032,"m":2,"q":"El registro obligatorio de proveedores de cambio y custodia (DA 2ª) era del…","o":["CNMV","SEPBLAC","Banco de España","AEAT"],"a":2,"e":"Según los apuntes: “La Disposición Adicional Segunda establece el registro obligatorio como condición sine qua non para operar: los proveedores de cambio y custodia que operan en España debían inscribirse en el Registro del Banco de España, acreditando honorabilidad comercial y profesional y presentando su procedimiento de prevención (PBC).”"},{"n":9033,"m":2,"q":"El Modelo 172 recoge…","o":["Saldos en el extranjero","Saldos de monedas virtuales en España","Operaciones de compraventa","La declaración de la renta"],"a":1,"e":"Según los apuntes: “La Ley 11/2021 marca el paso de la opacidad (pre-2021) a la trazabilidad: la AEAT dispone de una arquitectura de control en tres capas: sensores (obligaciones informativas: modelos 172, 173 y 721), motor analítico (cruce de datos cripto con el IRPF, Modelo 100, y vigilancia automatizada de conductas operativas y on-chain) y evolución del sistema (integración con DAC8 para el intercambio administrativo transfronterizo).”"},{"n":9034,"m":2,"q":"El Modelo 721 se refiere a saldos en el extranjero superiores a…","o":["50.000 €","1.000 €","30.000 €","100.000 €"],"a":0,"e":"Según los apuntes: “Caso práctico del temario: un residente fiscal español con 60.000 € en Binance (extranjero) y otros fondos en una plataforma nacional, que realiza una permuta de BTC a ETH dentro de la plataforma: el exchange nacional informa por 172/173, el usuario debe presentar el 721 (supera los 50.000 €) y declarar la permuta en el IRPF.”"},{"n":9035,"m":2,"q":"Quedan excluidos del Modelo 721…","o":["Los exchanges extranjeros","Los saldos en Binance","Los residentes fiscales","Las billeteras frías y sistemas de autocustodia"],"a":3,"e":"Según los apuntes: “Existe una exclusión crítica: las billeteras frías y los sistemas de autocustodia quedan expresamente fuera del Modelo 721. La información de los modelos 172/173/721 sirve de insumo para planes de control combinados con analítica blockchain para auditar el comportamiento.”"},{"n":9036,"m":2,"q":"La Travel Rule europea es el Reglamento…","o":["(UE) 2023/1114","(UE) 2024/1620","(UE) 2023/1113","(UE) 2010/10"],"a":2,"e":"Según los apuntes: “Existe una tríada regulatoria europea: MiCA (Reglamento 2023/1114), que define quién es un proveedor de servicios (CASP) y regula su licencia; la Travel Rule o TFR (Reglamento 2023/1113), que define qué información debe viajar adjunta a los fondos y criptoactivos; y la normativa antiblanqueo (AMLR, Ley 10/2010), que define cómo deben organizarse los sujetos obligados.”"},{"n":9037,"m":2,"q":"Para transferencias con direcciones autoalojadas, la verificación técnica es exigible por encima de…","o":["0 €","1.000 €","10.000 €","50.000 €"],"a":1,"e":"Según los apuntes: “A diferencia de la banca tradicional (verificación sistemática solo a partir de 1.000 €) o de las recomendaciones del GAFI, la UE aplica la Travel Rule a TODAS las transferencias de criptoactivos, sin importar el importe: el mandato «zero-threshold» (umbral 0 €), sin exenciones y sin distinción entre operaciones nacionales y transfronterizas.”"},{"n":9038,"m":2,"q":"KYT (Know Your Transaction) consiste en…","o":["Analítica on-chain para rastrear fondos y detectar riesgos","Identificar al titular real","Firmar transacciones","Formar al personal"],"a":0,"e":"Según los apuntes: “El ecosistema modular de cumplimiento (tech stack) se apoya en la neutralidad tecnológica: capa de KYC, capa 2 de KYT (Know Your Transaction), analítica on-chain en tiempo real para rastrear fondos e identificar interacciones con direcciones vinculadas al cibercrimen o a la dark web (rastreo forense y risk scoring), y capa 3 de mensajería off-chain de la Travel Rule mediante protocolos interoperables.”"},{"n":9039,"m":2,"q":"Tras MiCA, la autoridad que autoriza y supervisa los CASP en España es…","o":["El Banco de España","El SEPBLAC","La AEAT","La CNMV"],"a":3,"e":"Según los apuntes: “Institucionalmente, antes de MiCA el Banco de España llevaba el único registro de proveedores de cambio y custodia (solo preventivo); tras MiCA la CNMV es la autoridad central que autoriza y supervisa la solvencia, la ciberresiliencia (DORA) y la conducta de los CASP.”"},{"n":9040,"m":2,"q":"Quedan fuera del ámbito de MiCA…","o":["ART y EMT","Utility tokens","DeFi puramente descentralizada, NFT únicos y CBDC","Stablecoins"],"a":2,"e":"Según los apuntes: “Su perímetro incluye dentro los ART, los EMT y los utility tokens (acceso digital a un bien o servicio, con obligación de publicar un «libro blanco» y notificarlo); quedan fuera la DeFi puramente descentralizada, los NFT únicos (salvo que se conviertan en instrumentos financieros o económicos) y las CBDC (monedas digitales de bancos centrales).”"},{"n":9041,"m":3,"q":"Bitcoin utiliza el modelo contable…","o":["De cuentas","UTXO","De anillos","Híbrido zk"],"a":1,"e":"Según los apuntes: “4.3 Bitcoin: modelo UTXO, direcciones y forks”"},{"n":9042,"m":3,"q":"El tiempo medio de bloque de Bitcoin es…","o":["~10 minutos","~12 segundos","~3 segundos","~400 ms"],"a":0,"e":"Según los apuntes: “Los ejercicios prácticos piden, dado un hash de transacción (Txid), extraer la fecha y hora, el importe y el número de destinatarios; dado un bloque (el 853.549 de Bitcoin), indicar las comisiones generadas, el número total de transacciones y la recompensa del minero; y, dada una dirección receptora y una transferencia (0,0386186 BTC, 23 de julio de 2024), analizar la cuenta de origen: saldo principal, número total de transacciones y qué sugiere el perfil de la wallet.”"},{"n":9043,"m":3,"q":"Ethereum utiliza el modelo contable…","o":["UTXO","UTXO ofuscado","Ninguno","Basado en cuentas"],"a":3,"e":"Según los apuntes: “El mapa táctico del investigador cruza el modelo arquitectónico (UTXO vs. cuentas) con el nivel de trazabilidad. Para el investigador interesa dividirlo por su arquitectura: activos transparentes con modelo UTXO (BTC, LTC), activos programables basados en cuentas (ETH, BNB, TRX, SOL, con contratos inteligentes, dApps y puentes cross-chain) y activos con privacidad (Monero, Zcash).”"},{"n":9
