de uno a cuatro años únicamente en casos agravados"],"a":1,"e":"En los apuntes: 264 CP — Daños informáticos Castiga, con pena de prisión de seis meses a tres años, a quien por cualquier medio, sin autorización y de manera grave, borrase, dañase, deteriorase, alterase, suprimiese o hiciese inaccesibles datos informáticos, programas informáticos o documentos electrónicos ajenos, cuando el resultado"},{"n":1122,"m":9,"q":"¿Qué conductas castiga el art. 264 bis CP (denegación de servicio informático)?","o":["Únicamente el borrado de datos personales","Obstaculizar o interrumpir de manera grave el funcionamiento de un sistema informático ajeno, mediante daños, introducción/transmisión de datos, o destrucción/inutilización del sistema","La revelación de un secreto empresarial","El acceso ilícito sin obstaculización del sistema"],"a":1,"e":"En los apuntes: 264 bis CP — Denegación de servicio informático Castiga, con pena de prisión de seis meses a tres años, a quien, sin estar autorizado y de manera grave, obstaculizara o interrumpiera el funcionamiento de un sistema informático ajeno: (a) realizando alguna de las conductas del artículo anterior (art."},{"n":1123,"m":9,"q":"¿Qué pena prevé el art. 278 CP para la revelación de secreto empresarial?","o":["Prisión de dos a cuatro años y multa de doce a veinticuatro meses","Multa exclusivamente","Prisión de seis meses a dos años","Prisión de seis meses a tres años"],"a":0,"e":"En los apuntes: 278 CP — Revelación de secreto empresarial Castiga, con pena de prisión de dos a cuatro años y multa de doce a veinticuatro meses, a quien, para descubrir un secreto de empresa, se apoderare por cualquier medio de datos, documentos escritos o electrónicos, soportes informáticos u otros objetos que se refieran al mismo,"},{"n":1124,"m":9,"q":"Según el art. 201 CP, ¿qué se requiere generalmente para proceder por los delitos de descubrimiento y revelación de secretos?","o":["Denuncia de oficio del Ministerio Fiscal en todo caso","Denuncia de la persona agraviada o de su representante legal","Que la víctima sea siempre menor de edad","No se requiere ningún requisito de perseguibilidad"],"a":1,"e":"En los apuntes: 201 CP — Condiciones de perseguibilidad Para proceder por los delitos de descubrimiento y revelación de secretos será necesaria denuncia de la persona agraviada o de su representante legal."},{"n":1125,"m":9,"q":"¿En qué supuesto NO será precisa la denuncia previa para proceder por estos delitos, según el art. 201 CP?","o":["Cuando el delito afecte a los intereses generales, a una pluralidad de personas, o la víctima sea menor de edad o persona con discapacidad necesitada de especial protección","Cuando el autor confiese voluntariamente","Cuando el delito se cometa fuera de España","Nunca se exime de la denuncia previa"],"a":0,"e":"En los apuntes: No obstante, no será precisa dicha denuncia para proceder por los hechos del art. 198 CP, ni cuando la comisión del delito afecte a los intereses generales, a una pluralidad de personas, o si la víctima es una persona menor de edad o una persona con discapacidad necesitada de especial protección."},{"n":1126,"m":9,"q":"¿Qué es el ransomware, según el tema?","o":["Un tipo de malware que bloquea el acceso a datos o sistemas mediante cifrado, exigiendo un rescate económico","Una técnica de denegación de servicio distribuida","Un mecanismo legítimo de copia de seguridad","Un protocolo de autenticación multifactor"],"a":0,"e":"En los apuntes: Tipo de malware diseñado para bloquear el acceso a los datos o sistemas de una víctima mediante cifrado, exigiendo un rescate económico para su recuperación. Ransomware: afectación y delitos relativos"},{"n":1127,"m":9,"q":"¿Qué principios de la seguridad de la información afecta típicamente el ransomware?","o":["Únicamente la disponibilidad","Integridad, disponibilidad y confidencialidad","Exclusivamente la autenticación","Ninguno, al tratarse de un ataque puramente económico"],"a":1,"e":"En los apuntes: Ransomware: afectación y delitos relativos Principios afectados: integridad, disponibilidad y confidencialidad."},{"n":1128,"m":9,"q":"¿Qué delitos relativos se asocian típicamente a un ataque de exfiltración de datos?","o":["Daños informáticos y denegación de servicio","Acceso ilícito a sistemas informáticos (art. 197 bis CP) y descubrimiento y revelación de secretos (art. 197 CP)","Revelación de secreto empresarial exclusivamente","Ningún delito, al no existir alteración de los datos"],"a":1,"e":"En los apuntes: Delitos relativos: acceso ilícito a sistemas informáticos (art. 197 bis CP), descubrimiento y revelación de secretos (art."},{"n":1129,"m":9,"q":"En el Caso 1 de jurisprudencia (STS 849/2025, uso de credenciales ajenas), ¿cuál es la enseñanza principal señalada en el tema?","o":["Una contraseña válida siempre convierte el acceso en legítimo","Una contraseña válida no convierte un acceso en legítimo","El acceso con credenciales ajenas nunca es constitutivo de delito","Los logs de acceso carecen de valor probatorio"],"a":1,"e":"En los apuntes: Enseñanza: una contraseña válida no convierte un acceso en legítimo. Caso 2: consultas indebidas a bases de datos (STS 43/2022)"},{"n":1130,"m":9,"q":"En el Caso 2 de jurisprudencia (STS 43/2022, consultas indebidas a bases de datos), ¿qué enseñanza extrae el tema pese a existir acceso, consulta y capacidad técnica?","o":["Que siempre existe delito cuando hay acceso técnico constatado","Que no todo incidente de seguridad constituye un delito, y no toda conducta irregular termina en condena penal","Que las bases de datos públicas nunca pueden ser objeto de este tipo de delitos","Que la funcionaria fue condenada por daños informáticos"],"a":1,"e":"En los apuntes: Enseñanza: no todo incidente de seguridad constituye un delito, y no toda conducta irregular termina en condena penal. Caso 3: daños informáticos (STS 160/2016)"},{"n":1131,"m":9,"q":"¿Por qué se afirma, en las conclusiones del tema, que un mismo incidente (como el ransomware) puede integrar múltiples delitos?","o":["Porque siempre se aplica un único artículo del Código Penal, sin excepciones","Porque puede incluir sucesivamente acceso ilícito, escalada de privilegios, exfiltración de datos y daños informáticos, cada uno con su propio encaje penal","Porque el ransomware nunca tiene relevancia penal","Porque solo afecta a la disponibilidad de los sistemas"],"a":1,"e":"En los apuntes: Cuarta: un mismo incidente puede integrar múltiples delitos El mejor ejemplo es el ransomware: lo que técnicamente se observa como un único ataque puede incluir, de forma sucesiva, acceso ilícito, escalada de privilegios, exfiltración de datos y daños informáticos."},{"n":1132,"m":10,"q":"¿Qué representan las filas y las columnas en la analítica forense de una hoja de cálculo?","o":["Las filas son atributos y las columnas son registros","Las filas representan registros unívocos o eventos, y las columnas actúan como atributos o campos taxonómicos","Ambas representan siempre lo mismo, sin distinción funcional","Las columnas solo pueden contener texto y las filas solo números"],"a":1,"e":"En los apuntes: En la analítica forense: las filas representan registros unívocos (un acceso IP, una llamada, un movimiento bancario) y las columnas actúan como atributos o campos taxonómicos (fecha/hora, IP de origen, importe, etc.)."},{"n":1133,"m":10,"q":"¿Qué ocurre si Excel interpreta automáticamente (formato “General”) un IMEI de 14-15 dígitos?","o":["Se muestra siempre correctamente sin ningún riesgo","Puede truncar ceros a la izquierda o convertirlo a notación científica, corrompiendo la visualización de la prueba","Se convierte automáticamente en una fórmula","Excel rechaza la entrada del dato"],"a":1,"e":"En los apuntes: Truncamiento de ceros a la izquierda: identificadores como códigos postales, prefijos telefónicos o cuentas bancarias que comiencen por cero pierden ese dígito automáticamente. Conversión a notación científica: Excel tiene un límite de precisión de 15 dígitos;"},{"n":1134,"m":10,"q":"¿Cuál es el protocolo de mitigación pericial recomendado antes de importar un dataset de origen dudoso?","o":["Dejar el formato en “General” para mayor flexibilidad","Forzar el rango de celdas de destino al formato Texto","Convertir todos los datos a formato de fecha","Eliminar los identificadores numéricos largos"],"a":1,"e":"En los apuntes: Protocolo de mitigación pericial: antes de importar o manipular cualquier dataset de origen dudoso o archivo plano (CSV/TXT), se debe forzar el rango de celdas de destino al formato Texto, obligando a Excel a respetar la literalidad exacta de cada carácter y blindando la integridad de los identificadores delictivos."},{"n":1135,"m":10,"q":"¿Qué carácter es el separador estándar de argumentos en las versiones en castellano de Excel?","o":["La coma (,)","El punto y coma (;)","El punto (.)","El guion (-)"],"a":1,"e":"En los apuntes: Separador de argumentos (punto y coma ;): carácter delimitador estándar en las versiones en castellano de Excel."},{"n":1136,"m":10,"q":"¿Para qué se emplea la función PROMEDIO en el contexto forense descrito en el tema?","o":["Para calcular el perjuicio patrimonial total de un fraude","Para establecer el perfil transaccional medio de una cuenta “mulera” y detectar transferencias anómalas","Para contar el número de conexiones registradas","Para extraer los primeros dígitos de un IBAN"],"a":1,"e":"En los apuntes: PROMEDIO(rango): media aritmética — p. ej., establecer el perfil transaccional medio de una cuenta “mulera” y detectar transferencias anómalas."},{"n":1137,"m":10,"q":"¿Qué combinación de teclado permite seleccionar celdas o rangos no contiguos?","o":["Mayús + Clic","Ctrl + Clic","Ctrl + Mayús + Flechas","Alt + Clic"],"a":1,"e":"En los apuntes: Selección discontinua (Ctrl + Clic): permite seleccionar celdas o rangos no contiguos — p."},{"n":1138,"m":10,"q":"¿Qué combinación de teclado expande la selección desde la celda activa hasta el último registro con datos de esa fila o columna?","o":["Ctrl + Clic","Mayús + Clic","Ctrl + Mayús + Flechas de dirección","Ctrl + Z"],"a":2,"e":"En los apuntes: Navegación perimetral rápida (Ctrl + Mayús + Flechas): expande la selección desde la celda activa hasta el último registro con datos — permite seleccionar una base de 500.000 filas en décimas de segundo."},{"n":1139,"m":10,"q":"¿Qué diferencia a una referencia absoluta ($A$1) de una referencia relativa (A1) al arrastrar una fórmula?","o":["La referencia absoluta muta automáticamente de posición, la relativa permanece fija","La referencia absoluta permanece fija (anclada) al arrastrar, mientras que la relativa muta según la posición","Ambas se comportan exactamente igual","Las referencias absolutas solo funcionan con texto, nunca con números"],"a":1,"e":"En los apuntes: calcular el dígito de control de un IMEI distinto en cada línea) y referencias absolutas (formato $A$1: estáticas e invariables, ancladas mediante el símbolo del dólar). Es obligatorio fijar con referencias absolutas cualquier celda de referencia única para todo el análisis — por ejemplo, un tipo de cambio o una IP \"ob"},{"n":1140,"m":10,"q":"¿Por qué es obligatorio fijar con referencia absoluta una celda que contiene, por ejemplo, un tipo de cambio único para todo un análisis?","o":["Porque Excel lo exige por defecto en todas las fórmulas","Porque, de no fijarla, al arrastrar la fórmula la celda de referencia se desplazará destructivamente, invalidando el análisis","Porque las referencias relativas no permiten operaciones matemáticas","No es necesario en ningún caso"],"a":1,"e":"En los apuntes: Es obligatorio fijar con referencias absolutas cualquier celda de referencia única para todo el análisis — por ejemplo, un tipo de cambio o una IP “objetivo prioritario” —, ya que de lo contrario la celda de referencia se desplazará destructivamente al arrastrar la fórmula, invalidando las conclusiones de la investigac"},{"n":1141,"m":10,"q":"En el asistente “Texto en columnas”, ¿qué opción debe elegirse en el Paso 1 para no romper variables como direcciones IP?","o":["Ancho fijo","Delimitados","Formato General","Formato Fecha"],"a":1,"e":"En los apuntes: Los tres pasos del asistente de importación Paso 1 — Tipo de separación: elegir “Delimitados” (no ancho fijo, que rompería IPs o nombres de usuario)."},{"n":1142,"m":10,"q":"¿Cuál es la consecuencia de omitir la configuración manual del formato en el Paso 3 del asistente “Texto en columnas” al procesar un IMEI?","o":["Ninguna, Excel lo detecta automáticamente sin errores","Excel puede truncar ceros a la izquierda o convertir el dato a notación científica de forma destructiva e irreversible","El IMEI se convierte automáticamente en una fecha","El asistente se bloquea y no permite continuar"],"a":1,"e":"En los apuntes: Paso 3 — Asignación de formato por columna (el filtro forense esencial): examinar la vista previa y forzar explícitamente a formato Texto aquellas columnas con identificadores numéricos críticos (IMEI, PAN, teléfonos). Alerta metodológica pericial: omitir la configuración manual del formato en el Paso 3 constituye una"},{"n":1143,"m":10,"q":"¿Qué ocurre si se intenta ordenar cronológicamente un rango de fechas que han sido almacenadas como texto plano?","o":["Excel las ordena correctamente por fecha real sin problema","Excel aplica una ordenación alfabética, agrupando por ejemplo todos los días “01” de distintos meses, destruyendo la secuencia cronológica real","Excel elimina automáticamente las fechas mal formateadas","Excel las convierte automáticamente a formato numérico"],"a":1,"e":"En los apuntes: La ordenación cronológica se ejecuta desde Inicio → Ordenar y filtrar → De más antiguo a más reciente. El riesgo de la ordenación nominal: si las fechas han sido importadas o almacenadas como texto plano, Excel aplicará una ordenación alfabética, agrupando por ejemplo todos los días “01” de distintos meses y años, dest"},{"n":1144,"m":10,"q":"¿Cuál es el procedimiento para eliminar espacios en blanco accidentales de forma masiva en Excel?","o":["Inicio → Formato condicional → Nueva regla","Inicio → Buscar y seleccionar → Reemplazar, buscando un espacio y dejando “Reemplazar con” vacío","Datos → Quitar duplicados","Insertar → Tabla dinámica"],"a":1,"e":"En los apuntes: Eliminación de anomalías espaciales: Inicio → Buscar y seleccionar → Reemplazar; buscar un carácter de espacio y dejar el campo “Reemplazar con” vacío, ejecutando “Reemplazar todos”."},{"n":1145,"m":10,"q":"¿Qué función de Excel se emplea para extraer el prefijo geopolítico de un código IBAN (p. ej. “ES”)?","o":["=DERECHA(texto;número_caracteres)","=IZQUIERDA(texto;número_caracteres)","=EXTRAE(texto;posición_inicial;número_caracteres)","=BUSCARV(valor;matriz;columna;orden)"],"a":1,"e":"En los apuntes: =IZQUIERDA(texto;número_caracteres)   →  ej.: =IZQUIERDA(A1;2)"},{"n":1146,"m":10,"q":"¿Qué función de Excel resulta idónea para aislar octetos específicos de una dirección IP situados en una posición intermedia?","o":["=IZQUIERDA","=DERECHA","=EXTRAE","=SUMA"],"a":2,"e":"En los apuntes: =EXTRAE(texto;posición_inicial;número_caracteres)   →  ej.: =EXTRAE(A1;1;5) Segmentación interna y flexible desde cualquier posición intermedia."},{"n":1147,"m":10,"q":"¿Qué procedimiento inmoviliza la fila de cabeceras en la parte superior de la pantalla al desplazarse por un archivo masivo?","o":["Datos → Filtro","Vista → Inmovilizar → Inmovilizar fila superior","Inicio → Formato condicional","Insertar → Tabla dinámica"],"a":1,"e":"En los apuntes: Procedimiento: Vista → Inmovilizar → Inmovilizar fila superior; la fila de cabeceras queda fija como guía permanente."},{"n":1148,"m":10,"q":"¿Qué atajo de teclado activa o desactiva instantáneamente la función de autofiltro?","o":["Ctrl + Z","Ctrl + Mayús + L","Ctrl + C","Alt + F4"],"a":1,"e":"En los apuntes: Procedimiento: seleccionar la fila 1, ir a Datos → Filtro (o atajo Ctrl + Mayús + L)."},{"n":1149,"m":10,"q":"¿Qué fórmula de formato condicional avanzado resalta el fin de semana completo (sábado y domingo) en un histórico de fechas de la columna B?","o":["=DIASEM(B2;2)=6","=DIASEM(B2;2)>5","=DIASEM(B2;2)<5","=DIASEM(B2;1)=1"],"a":1,"e":"En los apuntes: =DIASEM(B2;2)>5   (resalta todo el fin de semana: sábado y domingo)"},{"n":1150,"m":10,"q":"Según el tema, ¿qué debe hacerse antes de aplicar cualquier filtrado agresivo o eliminación de registros sobre un dataset de evidencia?","o":["Trabajar directamente sobre el log original para ahorrar tiempo","Copiar el rango de datos y pegarlo en un archivo o pestaña completamente nuevos, preservando el dataset original","Eliminar directamente las filas no relevantes del archivo original","Convertir el archivo a formato PDF antes de manipularlo"],"a":1,"e":"En los apuntes: Antes de cualquier filtrado agresivo o eliminación de registros, se debe copiar el rango de trabajo y pegarlo en un archivo o pestaña completamente nuevos, sin alterar la información original incorporada a la causa."},{"n":1151,"m":10,"q":"En una tabla dinámica forense, ¿qué campo debe arrastrarse al “Cuadrante de Valores” en una investigación financiera?","o":["El campo “País” o “IBAN” como identificador único","El campo cuantitativo sobre el que se desea operar matemáticamente, como “Importe”","Únicamente campos de texto sin valor numérico","El campo de fecha exclusivamente"],"a":1,"e":"En los apuntes: Cuadrante de Valores — contenedor métrico u operativo: se arrastra el campo cuantitativo o de registro sobre el que operar matemáticamente (p. “Importe” en una investigación financiera, o “ID_Registro” en un análisis de tráfico de red)."}];const AM=["TEMA 1 — INTRODUCCIÓN A LOS CIBERATAQUES","TEMA 2 — ANÁLISIS DE RANSOMWARE Y FILTRACIÓN DE DATOS","TEMA 3 — MEDIDAS PREVENTIVAS Y RESPUESTA A CIBERATAQUES","TEMA 4 — GESTIÓN DE INCIDENTES","TEMA 5 — LABORATORIO TÉCNICO: ANÁLISIS DE TRÁFICO Y TRAZAS DE MALWARE","TEMA 6 — INVESTIGACIÓN POLICIAL DE INCIDENTES DE CIBERSEGURIDAD"],AQ=[{"n":8001,"m":0,"q":"¿Cuál es el objetivo principal de un ataque de ransomware según se define en el tema?","o":["Interrumpir el acceso legítimo a un servicio mediante saturación de tráfico","Impedir el acceso a sistemas o a la información mediante bloqueo o cifrado, exigiendo un pago económico para su recuperación","Obtener información sensible haciéndose pasar por una entidad de confianza","Aprovechar una debilidad de un sistema para ejecutar código no autorizado"],"a":1,"e":"Según los apuntes: “El ransomware es un software malicioso que bloquea o cifra sistemas o información para exigir un rescate económico a cambio de su recuperación, habitualmente en criptomonedas para dificultar la trazabilidad.”"},{"n":8002,"m":0,"q":"Según la secuencia típica de un ataque de ransomware, ¿qué suele ocurrir inmediatamente antes del cifrado en los incidentes actuales?","o":["La generación de una nota de rescate","La exfiltración de datos, para poder ejercer una doble presión sobre la víctima","El acceso inicial mediante RDP expuesto","El movimiento lateral dentro de la red"],"a":1,"e":"Según los apuntes: “Exfiltración previa (doble extorsión): se roban datos antes de cifrar, para amenazar también con su publicación.”"},{"n":8003,"m":0,"q":"¿Qué característica distingue especialmente a una filtración de datos (data breach) de otros ciberataques?","o":["Su efecto es siempre inmediatamente perceptible","Solo puede tener origen en un ataque informático externo","Puede permanecer sin detectarse durante periodos prolongados, sin que el descubrimiento coincida con el momento del compromiso inicial","Nunca afecta a información policial o judicial"],"a":2,"e":"Según los apuntes: “A diferencia de otros ataques, puede permanecer sin detectarse durante mucho tiempo. Incidente en el que información protegida queda expuesta, extraída o divulgada sin autorización.”"},{"n":8004,"m":0,"q":"¿Cuál de las siguientes NO es necesariamente una causa de una filtración de datos según el tema?","o":["Una configuración incorrecta de un servicio","El envío de documentación al destinatario equivocado","La pérdida de un dispositivo","La existencia de una puntuación CVSS elevada"],"a":3,"e":"Según los apuntes: “CVSS: puntuación de severidad (explotabilidad remota, privilegios necesarios, impacto en confidencialidad/integridad/disponibilidad). Una puntuación alta no implica automáticamente mayor riesgo real.”"},{"n":8005,"m":0,"q":"¿Qué elemento diferencia a un ataque DDoS de un ataque DoS convencional?","o":["El DDoS siempre afecta a servicios bancarios","El DDoS procede de un único origen concentrado","En el DDoS el tráfico malicioso procede de numerosos sistemas o dispositivos que actúan simultáneamente","El DoS requiere necesariamente una botnet"],"a":2,"e":"Según los apuntes: “Se diferencia del DoS convencional en que el tráfico procede de múltiples orígenes simultáneos (una botnet). Ataque que busca degradar o impedir el acceso a un servicio mediante un volumen de tráfico superior al que puede procesar.”"},{"n":8006,"m":0,"q":"¿Qué es una botnet en el contexto de los ataques DDoS?","o":["Un protocolo de red vulnerable a la amplificación","Una red de dispositivos previamente comprometidos mediante malware y controlados de forma remota","Un sistema de puntuación de severidad de vulnerabilidades","Una técnica de suplantación de la dirección IP de origen"],"a":1,"e":"Según los apuntes: “Red hacktivista prorrusa que realiza ataques DDoS contra Ucrania y países aliados desde 2022, empleando la herramienta DDoSia, que permite a simpatizantes participar voluntariamente (no requiere una botnet tradicional de dispositivos infectados).”"},{"n":8007,"m":0,"q":"¿En qué consiste la técnica de reflexión y amplificación en un ataque DDoS?","o":["En enviar directamente todo el tráfico malicioso desde el equipo del atacante","En suplantar la IP de la víctima para que servidores intermediarios envíen sus respuestas hacia ella, multiplicando el tráfico recibido","En cifrar los archivos de la víctima antes de exigir el rescate","En explotar una vulnerabilidad de día cero para acceder al sistema"],"a":1,"e":"Según los apuntes: “Reflexión y amplificación: el atacante suplanta la IP de la víctima (IP spoofing) para que servidores intermediarios envíen sus respuestas hacia ella, multiplicando el tráfico recibido.”"},{"n":8008,"m":0,"q":"¿Qué red hacktivista se cita como caso de estudio de DDoS vinculado al apoyo a Ucrania y qué resultado obtuvo la operación policial internacional Eastwood?","o":["Mirai; provocó la caída total de Internet en Europa","NoName057(16); provocó, entre otros resultados, 2 detenciones, 7 órdenes de detención y la desactivación de una parte sustancial de su infraestructura","APT29; provocó el compromiso de la cadena de suministro de SolarWinds","Exploit.in; provocó el cierre definitivo del foro"],"a":1,"e":"Según los apuntes: “Operación policial internacional Eastwood (Europol): 2 detenciones, 7 órdenes de detención, 24 registros domiciliarios, 13 interrogados, y desactivación de una parte sustancial de su infraestructura.”"},{"n":8009,"m":0,"q":"¿En qué se diferencia principalmente el phishing de otros ciberataques estudiados en el tema?","o":["Depende necesariamente de vulnerabilidades técnicas complejas en el sistema objetivo","Explota fundamentalmente el factor humano mediante principios psicológicos como la urgencia, la autoridad o el miedo","Solo puede realizarse mediante llamadas de voz","Nunca se utiliza como mecanismo para iniciar otro ataque"],"a":1,"e":"Según los apuntes: “No depende de vulnerabilidades técnicas, sino de explotar el factor humano (urgencia, autoridad, miedo, recompensa, confianza). Técnica de ingeniería social que busca engañar a la víctima para obtener información o comprometer un sistema.”"},{"n":8010,"m":0,"q":"¿Qué modalidad de phishing se dirige específicamente contra directivos u otras personas con acceso privilegiado dentro de una organización?","o":["Spear-phishing","Smishing","Whaling","Vishing"],"a":2,"e":"Según los apuntes: “Whaling: dirigido específicamente contra directivos o cargos con acceso privilegiado.”"},{"n":8011,"m":0,"q":"¿Por qué debe evitarse transmitir la idea de que todas las campañas de phishing contienen errores gramaticales evidentes?","o":["Porque los errores gramaticales nunca han sido un indicador útil","Porque las campañas actuales, apoyadas en inteligencia artificial generativa, pueden alcanzar una redacción correcta y personalizada","Porque el phishing no depende de la calidad de la redacción sino exclusivamente del dominio utilizado","Porque los indicadores lingüísticos son competencia exclusiva de los proveedores de correo"],"a":1,"e":"Según los apuntes: “Precaución: la IA generativa reduce la fiabilidad de estos indicadores (redacción correcta y personalizada). Indicadores de sospecha: remitente distinto del esperado, dominios similares pero no idénticos, urgencia artificial, enlaces cuyo destino no coincide con el texto mostrado.”"},{"n":8012,"m":0,"q":"¿Cuál es la diferencia esencial entre una vulnerabilidad y su explotación?","o":["No existe diferencia, ambos términos son sinónimos","Una vulnerabilidad puede existir durante meses o años sin evidencia de haber sido aprovechada, mientras que la explotación es la acción efectiva de aprovecharla","La vulnerabilidad siempre requiere un exploit publicado para existir","La explotación es anterior cronológicamente a la existencia de la vulnerabilidad"],"a":1,"e":"Según los apuntes: “Una vulnerabilidad es una debilidad que puede aprovecharse; un exploit es el recurso técnico para hacerlo; la explotación es la acción efectiva de aprovecharla.”"},{"n":8013,"m":0,"q":"¿Qué mide el sistema CVSS respecto a una vulnerabilidad?","o":["El identificador único que permite referirse inequívocamente a ella","Una puntuación de severidad que considera factores como la posibilidad de explotación remota, la complejidad y los efectos sobre confidencialidad, integridad y disponibilidad","El número de sistemas en el mundo que la contienen","El nombre del fabricante responsable de corregirla"],"a":1,"e":"Según los apuntes: “CVSS: puntuación de severidad (explotabilidad remota, privilegios necesarios, impacto en confidencialidad/integridad/disponibilidad). Una puntuación alta no implica automáticamente mayor riesgo real.”"},{"n":8014,"m":0,"q":"¿Qué es una vulnerabilidad de día cero (zero-day)?","o":["Una vulnerabilidad que ha sido corregida el mismo día de su descubrimiento","Una vulnerabilidad desconocida para quienes deberían corregirla o para la que todavía no existe solución disponible","Una vulnerabilidad exclusiva de sistemas IoT","Una vulnerabilidad que solo puede explotarse con acceso físico al dispositivo"],"a":1,"e":"Según los apuntes: “Día cero (0-day): vulnerabilidad desconocida o sin parche disponible. Caso WannaCry (2017): explotó EternalBlue (CVE-2017-0144) sobre el protocolo SMB — una vulnerabilidad ya conocida y con parche disponible que muchas organizaciones no habían aplicado.”"},{"n":8015,"m":0,"q":"¿Qué vulnerabilidad y técnica se vinculan a la propagación de WannaCry en 2017?","o":["CVE-2021-44228 mediante Log4Shell","La explotación del protocolo SMB mediante la técnica EternalBlue (CVE-2017-0144)","Una vulnerabilidad de día cero en un proveedor de correo electrónico","El compromiso de la cadena de suministro de un proveedor de software"],"a":1,"e":"Según los apuntes: “Caso WannaCry (2017): explotó EternalBlue (CVE-2017-0144) sobre el protocolo SMB — una vulnerabilidad ya conocida y con parche disponible que muchas organizaciones no habían aplicado.”"},{"n":8016,"m":0,"q":"¿Qué caracteriza fundamentalmente a una Amenaza Persistente Avanzada (APT) frente a un ataque oportunista?","o":["El uso exclusivo de malware desarrollado a medida y nunca de herramientas legítimas","La selección deliberada del objetivo, una fase previa de reconocimiento y la adaptación continua de las técnicas a las defensas encontradas","La ausencia total de motivación económica en cualquier caso","La imposibilidad de que el ataque dure más de 24 horas"],"a":1,"e":"Según los apuntes: “Avanzada: combina técnicas especializadas y múltiples vectores (no toda acción individual es sofisticada).”"},{"n":8017,"m":0,"q":"¿Qué significa que una APT sea «persistente»?","o":["Que el ataque se repite exactamente de la misma forma cada vez","Que el adversario trata de mantener su actividad y capacidad de operar sobre la organización objetivo durante un periodo prolongado, aunque pierda un punto de acceso","Que el malware empleado no puede eliminarse nunca","Que la víctima persiste en no aplicar parches de seguridad"],"a":1,"e":"Según los apuntes: “Persistente: mantiene la capacidad de operar aunque pierda un punto de acceso concreto.”"},{"n":8018,"m":0,"q":"¿En qué consiste un ataque a la cadena de suministro (supply chain attack), ilustrado con el caso de SolarWinds?","o":["En atacar simultáneamente a todas las víctimas finales sin pasar por ningún intermediario","En comprometer un producto, actualización o servicio de un proveedor tecnológico para obtener acceso indirecto a sus numerosos clientes","En generar tráfico masivo contra los servidores de un proveedor de Internet","En suplantar la identidad de un directivo mediante spear-phishing"],"a":1,"e":"Según los apuntes: “Ataque a la cadena de suministro: en lugar de atacar al objetivo final, se compromete a un proveedor tecnológico para llegar indirectamente a sus clientes.”"},{"n":8019,"m":0,"q":"Según las conclusiones del tema, ¿por qué debe analizarse un ciberataque como una cadena de acciones y no únicamente a partir de su efecto más visible?","o":["Porque los ciberataques rara vez combinan distintas técnicas y suelen ser fenómenos aislados","Porque un mismo incidente puede combinar secuencialmente phishing, robo de credenciales, escalada de privilegios, exfiltración y ransomware, y el síntoma visible no revela por sí solo el alcance real","Porque la ley exige tipificar cada técnica empleada como un delito independiente","Porque el CVSS asigna una puntuación distinta a cada fase del ataque"],"a":1,"e":"Según los apuntes: “Los ciberataques rara vez son fenómenos aislados: un mismo incidente puede combinar phishing → robo de credenciales → escalada de privilegios → exfiltración → ransomware, formando una cadena de acciones.”"},{"n":8020,"m":0,"q":"¿Por qué señala el tema que un indicador técnico como una IP, un dominio o una muestra de malware no identifica automáticamente al responsable de un ciberataque?","o":["Porque estos indicadores nunca resultan útiles en una investigación","Porque la atribución debe construirse mediante la correlación de múltiples evidencias y, con frecuencia, cooperación con proveedores y autoridades de otros Estados","Porque las direcciones IP cambian cada segundo y no pueden registrarse","Porque solo los organismos internacionales pueden analizar muestras de malware"],"a":1,"e":"Según los apuntes: “Un indicador técnico (IP, dominio, malware) no identifica automáticamente al responsable; la atribución exige correlación de múltiples evidencias y cooperación internacional.”"},{"n":8021,"m":1,"q":"Según el tema, ¿cuál es la principal transición metodológica que se introduce respecto al Tema 8.1?","o":["Dejar de estudiar el ransomware para centrarse exclusivamente en el phishing","Pasar de reconocer qué clase de ataque se ha producido a reconstruir cómo se desarrolló, qué alcance tuvo y qué conclusiones pueden sostenerse con la evidencia disponible","Sustituir el análisis forense por la exclusiva confianza en la nota de rescate","Limitar la investigación a identificar únicamente la familia de malware utilizada"],"a":1,"e":"Según los apuntes: “El objetivo ya no es solo reconocer el ataque, sino reconstruir cómo se desarrolló. Detectar archivos cifrados o una nota de rescate aporta un punto de entrada, pero no determina por sí solo el origen, la cronología ni la extensión del compromiso.”"},{"n":8022,"m":1,"q":"¿Por qué señala el tema que la detección de archivos cifrados o una nota de rescate no determina por sí sola el origen, la cronología ni la extensión del compromiso?","o":["Porque el cifrado puede constituir la fase final de una intrusión iniciada días o semanas antes, pudiendo perseguir además el ocultamiento de actividades anteriores","Porque las notas de rescate siempre contienen información falsa","Porque el cifrado nunca se relaciona con otras fases del ataque","Porque la cronología solo puede determinarse mediante la negociación con el atacante"],"a":0,"e":"Según los apuntes: “Detectar archivos cifrados o una nota de rescate aporta un punto de entrada, pero no determina por sí solo el origen, la cronología ni la extensión del compromiso.”"},{"n":8023,"m":1,"q":"¿Cuál es la diferencia entre hecho observado, inferencia e hipótesis según el ejemplo del inicio de sesión desde una IP concreta?","o":["Los tres términos son sinónimos y no requieren distinción metodológica","El inicio de sesión desde una IP es un hecho registrado; que el acceso fuese no autorizado es una inferencia que exige contexto; que la IP identifique al autor sería una hipótesis mucho más exigente","La hipótesis siempre precede al hecho observado","La inferencia solo puede formularse tras confirmar judicialmente la autoría"],"a":1,"e":"Según los apuntes: “Ejemplo: un login desde una IP es un hecho; que ese acceso fuese no autorizado es una inferencia; que la IP identifique al autor es una hipótesis poco sólida por sí sola.”"},{"n":8024,"m":1,"q":"¿Qué aporta la doble extorsión respecto al modelo de ransomware más antiguo, basado en el bloqueo o cifrado local?","o":["Elimina por completo la necesidad de cifrar los sistemas","Añade una amenaza contra la confidencialidad a la presión derivada de la indisponibilidad, recopilando y extrayendo información antes del cifrado para amenazar con su publicación","Sustituye la exigencia de pago por la simple destrucción de los datos","Limita la interacción con la víctima a instrucciones estandarizadas sin negociación"],"a":1,"e":"Según los apuntes: “Doble extorsión: se exfiltran datos antes de cifrar, para amenazar también con su publicación (las copias de seguridad ya no neutralizan toda la presión).”"},{"n":8025,"m":1,"q":"¿Por qué la existencia de copias de seguridad no neutraliza por completo la presión ejercida mediante doble extorsión?","o":["Porque las copias de seguridad nunca funcionan correctamente","Porque aunque la organización pueda restaurar sus servicios, todavía afronta el riesgo asociado a la divulgación de la información sustraída","Porque el atacante siempre destruye también las copias de seguridad antes de exfiltrar","Porque la ley obliga a pagar el rescate aunque existan copias"],"a":1,"e":"Según los apuntes: “Doble extorsión: se exfiltran datos antes de cifrar, para amenazar también con su publicación (las copias de seguridad ya no neutralizan toda la presión).”"},{"n":8026,"m":1,"q":"¿Qué caracteriza al modelo Ransomware-as-a-Service (RaaS)?","o":["Que desarrolladores u operadores de una plataforma proporcionan herramientas, paneles e infraestructura a afiliados que ejecutan las intrusiones, a cambio de reparto del rescate, suscripción o prestación puntual","Que un único grupo criminal controla siempre toda la cadena del ataque sin colaboradores externos","Que el ransomware solo puede desplegarse mediante código desarrollado internamente por cada afiliado","Que la remuneración de los afiliados es siempre fija e independiente del rescate obtenido"],"a":0,"e":"Según los apuntes: “RaaS (Ransomware-as-a-Service): desarrolladores ceden herramientas e infraestructura a afiliados a cambio de reparto del rescate. Reduce barreras de entrada y no implica jerarquía estable (un afiliado puede usar varias marcas).”"},{"n":8027,"m":1,"q":"Según el tema, ¿qué revela la fragmentación y el cambio de marca de las plataformas RaaS tras operaciones policiales o conflictos internos?","o":["Que las plataformas desaparecen definitivamente sin posibilidad de reconstitución","Que el modelo RaaS no implica necesariamente una estructura jerárquica estable, pudiendo un afiliado utilizar varias marcas y una plataforma reconstituirse o cambiar de nombre","Que la identificación de una variante de malware basta para atribuir la operación completa","Que los initial access brokers dejan de operar tras cualquier actuación policial"],"a":1,"e":"Según los apuntes: “Reduce barreras de entrada y no implica jerarquía estable (un afiliado puede usar varias marcas). RaaS (Ransomware-as-a-Service): desarrolladores ceden herramientas e infraestructura a afiliados a cambio de reparto del rescate.”"},{"n":8028,"m":1,"q":"Según el ENISA Threat Landscape 2025, ¿qué porcentaje de la actividad de ciberdelincuencia monitorizada contra organizaciones de los Estados miembros representó el ransomware entre julio de 2024 y junio de 2025?","o":["El 15,2 %","El 81,1 %","El 4.875 %","El 82 %"],"a":1,"e":"Según los apuntes: “Dato de contexto (ENISA 2025): el ransomware representó el 81,1 % de la actividad de ciberdelincuencia monitorizada entre julio 2024 y junio 2025 (4.875 incidentes), con 82 variantes distintas — la fragmentación del ecosistema es mayor que la capacidad de seguirlo por marca.”"},{"n":8029,"m":1,"q":"¿Por qué advierte el tema que la marca mostrada en la nota de rescate es una pista y no una garantía sobre quién ejecutó cada fase del ataque?","o":["Porque la investigación debe correlacionar el comportamiento observado con identidades, tiempos, infraestructura, comunicaciones y flujos económicos, ya que los roles funcionales pueden acumularse o prestarse como servicio a múltiples grupos","Porque las notas de rescate nunca contienen ningún dato verificable","Porque la marca identifica siempre e inequívocamente al desarrollador del cifrador","Porque la atribución solo puede basarse en el análisis lingüístico de la nota"],"a":0,"e":"Según los apuntes: “La marca en la nota de rescate es una pista, no una prueba de quién ejecutó cada fase. Roles del ecosistema (pueden acumularse en una misma persona): desarrollo y mantenimiento, afiliación/operación, initial access broker, infraestructura, negociación y presión, finanzas y blanqueo.”"},{"n":8030,"m":1,"q":"Según el tema, ¿por qué no debe interpretarse la anatomía de una operación de ransomware como una receta rígida?","o":["Porque sus fases pueden solaparse, repetirse, omitirse o ejecutarse por actores diferentes, sirviendo el modelo como matriz de preguntas y evidencias","Porque las fases siempre ocurren en un orden estrictamente diferente en cada incidente","Porque no existe ninguna fase de acceso inicial en los ataques modernos","Porque MITRE ATT&CK prohíbe expresamente su uso como marco de referencia"],"a":0,"e":"Según los apuntes: “Secuencia flexible (las fases pueden solaparse u omitirse), útil como matriz de preguntas y evidencias:”"},{"n":8031,"m":1,"q":"¿Qué recuerda MITRE ATT&CK sobre las cuentas válidas (T1078) en relación con el acceso inicial?","o":["Que las cuentas válidas solo pueden emplearse para el acceso inicial y nunca para otras fases","Que las cuentas válidas pueden servir no solo para el acceso inicial, sino también para persistencia, escalada y evasión","Que las cuentas válidas quedan automáticamente invalidadas tras el primer uso malicioso","Que solo las cuentas de administrador pueden considerarse cuentas válidas a efectos de T1078"],"a":1,"e":"Según los apuntes: “MITRE ATT&CK (T1078: cuentas válidas) recuerda que sirven también para persistencia y evasión, no solo acceso. Acceso inicial: credenciales comprometidas, vulnerabilidades, phishing.”"},{"n":8032,"m":1,"q":"¿Por qué señala el tema que la persistencia puede residir en identidades y configuraciones, no únicamente en malware?","o":["Porque el malware es siempre el único mecanismo de persistencia posible","Porque restaurar archivos sin eliminar la vía persistente permite un nuevo compromiso, siendo esencial comparar cuentas, privilegios y registros de administración durante la reconstrucción","Porque las identidades no pueden verse comprometidas en un ataque de ransomware","Porque las configuraciones del sistema no dejan ningún rastro investigable"],"a":1,"e":"Según los apuntes: “Persistencia: cuentas nuevas, claves de acceso remoto, tareas programadas — puede residir en identidades, no solo en malware.”"},{"n":8033,"m":1,"q":"¿En qué se diferencian, según el tema, el intento, el acceso a material de credenciales y el uso acreditado de una identidad durante la escalada de privilegios?","o":["Son conceptos equivalentes que no requieren distinción en la conclusión investigadora","La conclusión debe graduar el nivel de certeza, diferenciando estos tres niveles según la evidencia disponible en memoria, registros de autenticación y accesos a almacenes de credenciales","El uso acreditado de una identidad es siempre el primer evento cronológico de la operación","El intento nunca deja ninguna huella técnica registrable"],"a":1,"e":"Según los apuntes: “Escalada de privilegios: obtención de acceso a dominios, hipervisores o copias de seguridad.”"},{"n":8034,"m":1,"q":"¿Qué técnica de MITRE ATT&CK agrupa el sabotaje de mecanismos de recuperación (borrado de copias de sombra, eliminación de catálogos, acceso a plataformas de respaldo)?","o":["T1078 (Valid Accounts)","T1486 (Data Encrypted for Impact)","T1490 (Inhibit System Recovery)","T1490 (Data Encrypted for Impact)"],"a":2,"e":"Según los apuntes: “Neutralización de controles: borrado de copias de sombra, sabotaje de backups (MITRE T1490).”"},{"n":8035,"m":1,"q":"¿Por qué deben priorizarse la obtención de registros centralizados, copias externas y telemetría de EDR ante acciones de neutralización de controles?","o":["Porque estas acciones, aunque demuestran preparación para el impacto, también reducen la evidencia disponible en los sistemas locales afectados","Porque los registros centralizados nunca pueden ser alterados por el adversario","Porque la neutralización de controles ocurre siempre antes del acceso inicial","Porque el EDR sustituye completamente la necesidad de copias de seguridad"],"a":0,"e":"Según los apuntes: “Neutralización de controles: borrado de copias de sombra, sabotaje de backups (MITRE T1490).”"},{"n":8036,"m":1,"q":"¿Qué son los indicadores de compromiso (IOC) y qué exige el tema para que se conviertan en evidencia útil?","o":["Son pruebas periciales definitivas que no requieren ningún contexto adicional","Son elementos que pueden señalar actividad maliciosa (hash, dominio, IP, archivo o ruta), exigiendo su conversión en evidencia útil preservarlos con contexto: origen, fecha, sistema, método de adquisición, integridad y relación con otros hechos","Son exclusivamente direcciones de criptoactivos vinculadas a la negociación","Son datos que pierden todo valor si no proceden de una fuente institucional"],"a":1,"e":"Según los apuntes: “Un IOC (indicador de compromiso: hash, dominio, IP...) debe preservarse con contexto (origen, fecha, integridad) para tener valor como evidencia; una coincidencia técnica no equivale a una explicación completa.”"},{"n":8037,"m":1,"q":"¿Qué distingue la investigación técnico-forense de la ciberinteligencia según el tema?","o":["Son disciplinas idénticas que se sustituyen mutuamente sin ninguna diferencia metodológica","La ciberinteligencia aporta contexto a los observables (relaciones históricas, campañas, técnicas) sin sustituir el análisis forense ni convertir automáticamente información de terceros en prueba","La ciberinteligencia siempre tiene mayor valor probatorio que el análisis forense","El análisis forense no requiere en ningún caso conservar la fuente ni la fecha de consulta"],"a":1,"e":"Según los apuntes: “TEMA 2 — ANÁLISIS DE RANSOMWARE Y FILTRACIÓN DE DATOS”"},{"n":8038,"m":1,"q":"¿Qué precaución señala el tema antes de subir una muestra, URL o indicador a un servicio público de enriquecimiento como VirusTotal?","o":["Ninguna, pues estos servicios garantizan siempre la confidencialidad absoluta de lo consultado","Debe comprobarse su política de visibilidad, ya que subir un documento confidencial o una URL con tokens puede revelar información del caso a terceros y alertar al adversario","Solo debe evitarse si la muestra procede de un sistema ya cifrado","Es obligatorio subir siempre la muestra completa sin excepción antes de cualquier análisis"],"a":1,"e":"Según los apuntes: “Precaución operativa: antes de subir una muestra o URL a un servicio público hay que comprobar su política de visibilidad, pues puede alertar al adversario o revelar información del caso a terceros.”"},{"n":8039,"m":1,"q":"¿Cómo debe clasificarse razonadamente el alcance de un sistema del que existen múltiples indicios coherentes con una laguna concreta, según la tabla de clasificación del alcance?","o":["Como «confirmado»","Como «probable»","Como «sin indicios»","Como «posible o expuesto»"],"a":1,"e":"Según los apuntes: “Escala recomendada: confirmado (evidencia directa) · probable (indicios coherentes con una laguna) · posible/expuesto (indicio aislado) · sin indicios (no implica ausencia real).”"},{"n":8040,"m":1,"q":"¿Cuáles son los seis pasos del proceso de elaboración y contraste de hipótesis descrito en el tema?","o":["Formular, enumerar, predecir, buscar, revisar y comunicar","Preservar, reproducir, corroborar, contextualizar, proteger y separar","Delimitar, triar, analizar, construir, examinar y correlacionar","Detectar, contener, erradicar, recuperar, documentar y cerrar"],"a":0,"e":"Según los apuntes: “Elaboración de hipótesis (proceso en 6 pasos): formular de modo concreto y falsable → enumerar hechos a favor y en contra → predecir qué rastros deberían existir → buscar nuevas fuentes → revisar (confirmar/descartar) → comunicar el nivel de confianza sin convertir posibilidades en certezas.”"},{"n":8041,"m":2,"q":"Según el tema, ¿cuál es la idea central que orienta el estudio de las medidas preventivas y de respuesta?","o":["Conocer cómo funciona un ciberataque solo es útil si permite decidir qué control aplicar, qué rastro buscar y qué acción técnica ejecutar","Basta con instalar el mayor número posible de herramientas de seguridad para prevenir cualquier ataque","La respuesta a un incidente debe centrarse exclusivamente en la coordinación organizativa, no en medidas técnicas","Los ataques estudiados anteriormente no guardan relación con las medidas de prevención y detección"],"a":0,"e":"Según los apuntes: “Conocer un ciberataque solo es útil si permite decidir qué control aplicar. La defensa en profundidad sitúa controles complementarios en distintos puntos del sistema, para que el fallo de una sola medida no deje el camino libre al atacante: ninguna tecnología garantiza por sí sola la seguridad.”"},{"n":8042,"m":2,"q":"¿En qué consiste la defensa en profundidad?","o":["En instalar la mayor cantidad posible de herramientas sin relacionarlas entre sí","En situar controles complementarios en distintos puntos del sistema, para evitar que el fracaso de una sola medida deje el camino libre al atacante","En sustituir todos los controles técnicos por la formación del personal","En confiar en una única tecnología que garantice por sí sola la seguridad del sistema"],"a":1,"e":"Según los apuntes: “La defensa en profundidad sitúa controles complementarios en distintos puntos del sistema, para que el fallo de una sola medida no deje el camino libre al atacante: ninguna tecnología garantiza por sí sola la seguridad.”"},{"n":8043,"m":2,"q":"¿Qué aporta el principio de Zero Trust respecto a la defensa en profundidad?","o":["La sustituye por completo, haciendo innecesarios los controles en capas","La complementa: no confiar de forma permanente en una identidad, equipo o ubicación, verificar explícitamente y conceder el menor privilegio necesario","Elimina la necesidad de segmentar la red","Solo es aplicable a la protección de aplicaciones web"],"a":1,"e":"Según los apuntes: “Zero Trust complementa (no sustituye) a la defensa en profundidad: no confiar de forma permanente en una identidad/equipo/ubicación, verificar explícitamente, mínimo privilegio, y asumir que la intrusión puede producirse.”"},{"n":8044,"m":2,"q":"¿Qué es la superficie de ataque y qué persigue reducirla?","o":["Es el conjunto de servicios, cuentas, interfaces, aplicaciones y configuraciones que un adversario puede intentar aprovechar; reducirla busca eliminar lo innecesario, corregir debilidades y limitar la exposición","Es exclusivamente el número de servidores físicos de una organización","Es un indicador que solo se aplica a los ataques de denegación de servicio","Reducirla implica eliminar todos los servicios, incluidos los necesarios para la actividad de la organización"],"a":0,"e":"Según los apuntes: “La superficie de ataque son los servicios, cuentas, interfaces y configuraciones que un adversario podría aprovechar. Una vulnerabilidad (CVE) informa de un riesgo a evaluar, no de que exista un ataque en curso.”"},{"n":8045,"m":2,"q":"¿Qué indica una referencia CVE respecto a una vulnerabilidad?","o":["Que existe un ataque en curso explotando esa vulnerabilidad","Identifica públicamente una vulnerabilidad concreta, informando de un riesgo que debe evaluarse, sin demostrar que exista un ataque en curso","Que la vulnerabilidad ha sido ya corregida en todos los sistemas afectados","Que la vulnerabilidad solo afecta a sistemas Linux"],"a":1,"e":"Según los apuntes: “Una vulnerabilidad (CVE) informa de un riesgo a evaluar, no de que exista un ataque en curso. La superficie de ataque son los servicios, cuentas, interfaces y configuraciones que un adversario podría aprovechar.”"},{"n":8046,"m":2,"q":"¿Cuál es la secuencia correcta del ciclo de gestión de vulnerabilidades descrito en el tema?","o":["Corrección, escaneo, hallazgo, priorización, activo inventariado y verificación","Activo inventariado, escaneo, hallazgo, priorización, corrección y verificación","Escaneo, corrección, activo inventariado, verificación, priorización y hallazgo","Priorización, hallazgo, corrección, escaneo, verificación y activo inventariado"],"a":1,"e":"Según los apuntes: “Ciclo de gestión de vulnerabilidades: inventariar activos → escanear → priorizar (por exposición, criticidad e impacto, no solo por puntuación) → parchear/mitigar → verificar.”"},{"n":8047,"m":2,"q":"¿Qué es el hardening o endurecimiento de un sistema?","o":["Instalar el mayor número de agentes de seguridad posible sin documentar los cambios","Ajustar el sistema para que ofrezca únicamente las funciones necesarias con una configuración segura, debiendo documentarse y probarse","Sustituir el sistema operativo por una versión más reciente sin cambiar su configuración","Aumentar los privilegios de todas las cuentas para facilitar la administración"],"a":1,"e":"Según los apuntes: “Infraestructura → configuración segura, parcheado, redundancia.”"},{"n":8048,"m":2,"q":"Frente al credential stuffing, ¿qué control preventivo señala el tema junto al MFA?","o":["El rate limiting exclusivamente contra una única cuenta","La no reutilización de contraseñas y la detección de anomalías, con accesos desde orígenes o dispositivos atípicos como evidencia observable","El bloqueo progresivo exclusivamente contra password spraying","La eliminación completa de cualquier sistema de autenticación"],"a":1,"e":"Según los apuntes: “Credential stuffing → MFA, no reutilización de contraseñas, detección de anomalías.”"},{"n":8049,"m":2,"q":"¿Cuál es el valor de la segmentación de red según el tema?","o":["Impide cualquier posibilidad de que un equipo resulte comprometido","Permite que, si un equipo resulta comprometido, el atacante pueda controlar ese equipo pero no obtenga automáticamente acceso a servidores, copias de seguridad o sistemas de administración","Sustituye la necesidad de un firewall perimetral","Solo es aplicable en entornos que no disponen de VPN"],"a":1,"e":"Según los apuntes: “Segmentación: si un equipo se compromete, el atacante no obtiene automáticamente acceso a servidores o backups.”"},{"n":8050,"m":2,"q":"¿Cuál es la diferencia principal entre Suricata y Zeek según el tema?","o":["Suricata pregunta principalmente si el tráfico coincide con una condición de detección; Zeek registra qué ha ocurrido para facilitar el análisis, ofreciendo juntos alerta y contexto","Suricata solo puede funcionar en modo pasivo, mientras que Zeek siempre actúa como IPS","Ambas herramientas son idénticas y cumplen exactamente la misma función","Zeek únicamente puede analizar tráfico DNS, mientras que Suricata analiza todos los protocolos"],"a":0,"e":"Según los apuntes: “Suricata (IDS/IPS): compara tráfico con firmas/reglas conocidas → responde si coincide con una detección. Zeek (analizador pasivo): genera registros estructurados (conn.log, dns.log, http.log, ssl.log, files.log) → responde qué ha ocurrido, útil para beaconing o protocolos inesperados.”"},{"n":8051,"m":2,"q":"¿Qué archivo de registro de Zeek permite responder si aparecen conexiones periódicas compatibles con beaconing?","o":["http.log","conn.log","ssl.log","files.log"],"a":1,"e":"Según los apuntes: “Zeek (analizador pasivo): genera registros estructurados (conn.log, dns.log, http.log, ssl.log, files.log) → responde qué ha ocurrido, útil para beaconing o protocolos inesperados.”"},{"n":8052,"m":2,"q":"¿Por qué señala el tema que un WAF añade protección pero no reemplaza la corrección del código vulnerable?","o":["Porque el WAF solo puede detectar ataques de denegación de servicio","Porque las capas de desarrollo seguro, configuración y protección perimetral son complementarias, y el WAF actúa en el perímetro sin corregir la causa del fallo en el código","Porque el WAF sustituye completamente la necesidad de validar entradas en el servidor","Porque el WAF únicamente puede aplicarse a aplicaciones que no reciben tráfico HTTP"],"a":1,"e":"Según los apuntes: “Frente a SQLi, XSS, path traversal o abuso de API, un WAF añade protección pero no sustituye la corrección del código. Coraza + OWASP Core Rule Set ejemplifican el flujo: petición → normalización → reglas CRS → registro o bloqueo.”"},{"n":8053,"m":2,"q":"¿Qué es la monitorización de integridad de archivos (FIM) y qué precaución exige?","o":["Detecta y bloquea automáticamente cualquier cambio en un archivo, sin necesidad de contexto adicional","Compara el estado de archivos relevantes y alerta cuando cambian, exigiendo proteger y actualizar de forma controlada la línea base, pues si el atacante puede modificar también la referencia, la comprobación pierde valor","Solo puede aplicarse a archivos ejecutables, nunca a documentos","Sustituye la necesidad de un SIEM en cualquier organización"],"a":1,"e":"Según los apuntes: “La línea base debe protegerse: si el atacante puede modificarla también, la comprobación pierde valor. FIM (monitorización de integridad): compara hash/permisos/propietario de archivos y alerta ante cambios — un cambio no es necesariamente malicioso, debe interpretarse en contexto.”"},{"n":8054,"m":2,"q":"¿Qué función cumple un SIEM según el tema?","o":["Sustituye la necesidad de firewalls, EDR y servidores web","Reúne y correlaciona las señales dispersas —conexión de firewall, autenticación del sistema, proceso del endpoint, petición del servidor web— para construir una secuencia con significado","Genera automáticamente parches de seguridad para las vulnerabilidades detectadas","Solo puede almacenar registros sin permitir ninguna correlación entre ellos"],"a":1,"e":"Según los apuntes: “Un ataque rara vez deja una sola huella: firewall, sistema operativo, endpoint y servidor web registran señales distintas. El SIEM las correlaciona para construir una secuencia con significado. (Wazuh, OpenSearch, Grafana)”"},{"n":8055,"m":2,"q":"¿Qué diferencia a los niveles estratégico, operacional, táctico y técnico de la ciberinteligencia?","o":["Son sinónimos y no existe ninguna diferencia real entre ellos","Responden a preguntas distintas: qué amenazas afectan al sector, qué campañas y actores están activos, qué técnicas y procedimientos emplean, y qué indicadores concretos se observan","Solo el nivel técnico resulta útil para la prevención de ciberataques","El nivel estratégico se ocupa exclusivamente de indicadores de compromiso concretos"],"a":1,"e":"Según los apuntes: “Nivel operacional → ¿qué campañas/actores están activos?”"},{"n":8056,"m":2,"q":"¿Por qué advierte el tema que «un indicador sin contexto envejece rápidamente»?","o":["Porque los indicadores de compromiso nunca caducan y mantienen su validez indefinidamente","Porque antes de incorporar un indicador a una detección es necesario conocer su procedencia, confianza, fecha, alcance y posibles usos legítimos","Porque el contexto de un indicador solo importa para el análisis forense, no para la prevención","Porque MISP y OpenCTI no permiten enriquecer indicadores con contexto adicional"],"a":1,"e":"Según los apuntes: “Un indicador sin contexto envejece rápido: hay que conocer su procedencia, confianza y vigencia. Ciclo de inteligencia: necesidad → recolección → procesamiento → análisis → difusión → revisión. (MISP, OpenCTI, MITRE ATT&CK).”"},{"n":8057,"m":2,"q":"Según los componentes de una detección descritos en el tema, ¿qué pregunta responde el componente «contexto»?","o":["Qué comportamiento se quiere reconocer","Qué evento contiene la evidencia necesaria","Qué excepciones legítimas existen","Qué cambio puede degradar la detección"],"a":2,"e":"Según los apuntes: “Componentes de una detección (Sigma como formato abierto): objetivo (¿qué comportamiento?) · datos (¿qué evento lo evidencia?) · lógica (¿qué separa señal de ruido?) · contexto (¿qué excepciones legítimas existen?) · prueba (caso positivo/negativo) · mantenimiento (¿qué puede degradarla?).”"},{"n":8058,"m":2,"q":"¿Por qué puede una regla Sigma sintácticamente correcta no detectar nada en la práctica?","o":["Porque Sigma es un formato exclusivo para archivos, incompatible con eventos de sistema","Porque el campo que consulta la regla puede no recopilarse, llegar vacío o haber sido normalizado con otro nombre en el esquema real de eventos","Porque las reglas Sigma no pueden transformarse al lenguaje de consulta de ningún SIEM","Porque Sigma solo permite describir detecciones para tráfico de red, nunca para registros de sistema"],"a":1,"e":"Según los apuntes: “Sigue: inteligencia/anomalía → hipótesis → consulta → análisis → conclusión → mejora. Threat hunting: búsqueda proactiva a partir de una hipótesis, no una exploración abierta de cualquier anomalía.”"},{"n":8059,"m":2,"q":"¿Qué diferencia al threat hunting de la detección automática mediante alertas?","o":["El threat hunting es una búsqueda proactiva y estructurada de comportamientos sospechosos que pueden no haber generado una alerta, partiendo de una hipótesis razonable","El threat hunting solo puede realizarse después de que se haya producido una alerta automática","El threat hunting sustituye por completo la necesidad de disponer de telemetría","El threat hunting consiste en una búsqueda abierta de cualquier anomalía sin necesidad de formular una hipótesis"],"a":0,"e":"Según los apuntes: “Threat hunting: búsqueda proactiva a partir de una hipótesis, no una exploración abierta de cualquier anomalía. Sigue: inteligencia/anomalía → hipótesis → consulta → análisis → conclusión → mejora.”"},{"n":8060,"m":2,"q":"¿Por qué señala el tema que una matriz MITRE ATT&CK coloreada muestra «cobertura declarada, no eficacia demostrada»?","o":["Porque la cobertura adquiere valor real cuando cada afirmación está respaldada por datos, una detección y una prueba repetible, no por la mera existencia de una herramienta instalada","Porque MITRE ATT&CK es un marco exclusivamente teórico sin ninguna aplicación práctica","Porque las matrices coloreadas nunca pueden utilizarse para priorizar controles","Porque la validación continua con Atomic Red Team o MITRE Caldera es innecesaria una vez completada la matriz"],"a":0,"e":"Según los apuntes: “Idea clave de cierre: una matriz MITRE ATT&CK coloreada muestra cobertura declarada, no eficacia demostrada — solo vale si cada afirmación está respaldada por datos, una detección y una prueba repetible.”"},{"n":8061,"m":3,"q":"¿Qué establece el artículo 11 del Esquema Nacional de Seguridad (ENS, RD 311/2022) en relación con la gestión de incidentes?","o":["Que las entidades públicas deben contratar obligatoriamente un SOC externo","La obligación de disponer de una Política de Seguridad de la Información que incluya, entre sus requisitos mínimos, un Protocolo de Gestión de Incidentes que establezca un sistema de detección y reacción y el registro de los incidentes y las acciones adoptadas","La obligación de notificar cualquier incidente a la Unión Europea en un plazo de una hora","Que únicamente los organismos privados deben disponer de un protocolo de gestión de incidentes"],"a":1,"e":"Según los apuntes: “11: obliga a las entidades públicas a disponer de una Política de Seguridad que incluya un Protocolo de Gestión de Incidentes — sistema de detección/reacción y registro de incidentes.”"},{"n":8062,"m":3,"q":"Según el tema, ¿cuál es la diferencia habitual entre CERT y CSIRT?","o":["Son términos completamente distintos sin ninguna relación entre sí","El CERT solo existe en Estados Unidos, mientras que el CSIRT es exclusivo de la Unión Europea","Los equipos encargados de la respuesta directa a los incidentes se consideran CSIRT, mientras que los CERT se encargan más bien de la prevención y gestión de las amenazas","El CSIRT nunca coordina la respuesta a nivel público estatal"],"a":2,"e":"Según los apuntes: “CERT vs CSIRT: se usan a menudo como sinónimos, pero el CSIRT se asocia a la respuesta directa a incidentes, mientras el CERT se orienta más a la prevención.”"},{"n":8063,"m":3,"q":"¿Qué organismo tiene encomendada por el ENS la coordinación público estatal de los equipos de respuesta a incidentes de seguridad informática?","o":["El CCN-CERT","El SOC S21sec","El Foro CSIRT.es en exclusiva","La Subdirección General de Logística e Innovación"],"a":0,"e":"Según los apuntes: “El CCN-CERT tiene encomendada por el ENS la coordinación público-estatal. CERT vs CSIRT: se usan a menudo como sinónimos, pero el CSIRT se asocia a la respuesta directa a incidentes, mientras el CERT se orienta más a la prevención.”"},{"n":8064,"m":3,"q":"¿Qué es un SOC (Security Operations Center) según el tema?","o":["Un tratado internacional de cooperación policial","Un equipo especializado en ciberseguridad que proporciona protección a la organización mediante la monitorización, detección, análisis e investigación de ciberataques","Una herramienta de cifrado de comunicaciones exclusivamente militar","Un procedimiento judicial para la investigación de ciberdelitos"],"a":1,"e":"Según los apuntes: “SOC (Security Operations Center): equipo especializado que monitoriza, detecta y analiza ciberataques. Red nacional de más de 300 entidades.”"},{"n":8065,"m":3,"q":"¿Cuáles son las cuatro fases del procedimiento de gestión de incidentes descrito en el tema?","o":["Detección, negociación, pago y recuperación","Preparación; detección, análisis e identificación; contención, mitigación y recuperación; y actividad post-incidente","Planificación, obtención, procesamiento y difusión","Reconocimiento, acceso inicial, persistencia y exfiltración"],"a":1,"e":"Según los apuntes: “Procedimiento de gestión de incidentes: 4 fases”"},{"n":8066,"m":3,"q":"¿Qué plazo establece el tema para la primera notificación al organismo de supervisión cuando un incidente afecta a un servicio de confianza sometido al Reglamento eIDAS?","o":["Un plazo no superior a 24 horas","Un plazo no superior a 72 horas","Un plazo de una semana","No existe plazo alguno, la notificación es potestativa"],"a":0,"e":"Según los apuntes: “Casos especiales de notificación: servicios de confianza (Reglamento eIDAS — DNIe, sede electrónica...) exigen notificación al organismo de supervisión en ≤ 24 horas (primera notificación) y detalle completo en 1 mes.”"},{"n":8067,"m":3,"q":"¿Qué normativa resulta de aplicación cuando un incidente de ciberseguridad afecta a sistemas de información que contienen datos de carácter personal?","o":["Exclusivamente la Directiva NIS2","El Reglamento General de Protección de Datos (Reglamento UE 2016/679) y la correspondiente Instrucción de Gestión de Incidentes de Seguridad con Datos de Carácter Personal","Únicamente el Reglamento eIDAS","El Convenio de Budapest exclusivamente"],"a":1,"e":"Según los apuntes: “La Política de Seguridad de la Información se apoya en gestión de riesgos, cumplimiento normativo, concienciación/formación y continuidad del servicio; es de obligado cumplimiento para el personal propio y para terceros que presten servicio.”"},{"n":8068,"m":3,"q":"En el flujo de trabajo de un incidente, ¿qué hito corresponde a la fase de «clasificación»?","o":["Apertura del caso mediante herramienta de ticketing","Triaje del incidente, asignando su criticidad y priorización","Investigación, troubleshooting y valoración del posible impacto","Bloqueo, mitigación y garantía de continuidad del servicio"],"a":1,"e":"Según los apuntes: “Secuencia: Entrada (conocimiento) → Registro (apertura/ticketing) → Clasificación (triaje) → Análisis (investigación/valoración) → Respuesta (bloqueo/mitigación) → Cierre.”"},{"n":8069,"m":3,"q":"¿Qué diferencia a un EDR de un IDS según su ubicación y capacidad, conforme al tema?","o":["El EDR es una evolución del antivirus situada en el endpoint; el IDS, ejemplificado en Snort o Suricata, carece de capacidad de respuesta propia","El IDS siempre tiene capacidad de bloqueo automático, mientras que el EDR nunca la tiene","Ambos términos son sinónimos y se refieren exactamente a la misma tecnología","El EDR solo puede desplegarse en dispositivos de red, nunca en endpoints"],"a":0,"e":"Según los apuntes: “Medios de detección — por ubicación: EDR (evolución del antivirus, ej. Crowdstrike) vs IDS (sin capacidad de respuesta, ej.”"},{"n":8070,"m":3,"q":"¿Qué distingue a un SIEM de un SOAR según el tema?","o":["El SIEM centraliza y correlaciona eventos; el SOAR aporta capacidad de orquestación, automatización y respuesta","El SOAR únicamente almacena registros sin ninguna capacidad de correlación","El SIEM y el SOAR son exactamente la misma herramienta bajo dos nombres distintos","El SIEM solo puede utilizarse en entornos de nube, nunca on-premise"],"a":0,"e":"Según los apuntes: “Correlación: SIEM (centraliza y correlaciona eventos, ej. Splunk) vs SOAR (orquestación y respuesta automatizada, ej.”"},{"n":8071,"m":3,"q":"¿Qué normas genéricas obligatorias señala el tema para el registro de un incidente?","o":["Únicamente asignar una referencia única, sin necesidad de más comprobaciones","Comprobar que el incidente no haya sido registrado con anterioridad, asignar una referencia única, introducir información técnica inicial y de apoyo suficiente, y asignar tipicidad y criticidad","Registrar el incidente solo si ha sido confirmado judicialmente","Esperar a que finalice la fase de recuperación antes de registrar el incidente"],"a":1,"e":"Según los apuntes: “Normas obligatorias: comprobar que no esté ya registrado, asignar referencia única, aportar información técnica suficiente, fijar tipicidad y criticidad.”"},{"n":8072,"m":3,"q":"¿Qué organismo proporciona la taxonomía de referencia empleada para clasificar la tipicidad de un ciberincidente según el tema?","o":["MITRE","ENISA","El Foro CSIRT.es","eIDAS"],"a":1,"e":"Según los apuntes: “Taxonomía ENISA: contenido abusivo, código malicioso, obtención de información, intento de intrusión, intrusión, disponibilidad, fraude, seguridad de la información.”"},{"n":8073,"m":3,"q":"Según la clasificación por potencial peligrosidad descrita en el tema, ¿en qué nivel se incluyen las Amenazas Persistentes Avanzadas (APT), el ciberterrorismo y los ataques contra infraestructuras críticas?","o":["Bajo","Alto","Muy alto","Crítico"],"a":3,"e":"Según los apuntes: “Peligrosidad potencial (5 niveles): Bajo (spam, escaneo) · Medio (ingeniería social, vulnerabilidad conocida) · Alto (C2, sabotaje, DoS, phishing) · Muy alto (malware, ataque desconocido) · Crítico (APT, ciberterrorismo, infraestructuras críticas).”"},{"n":8074,"m":3,"q":"¿Qué recopila y organiza fundamentalmente el marco MITRE ATT&CK?","o":["Exclusivamente listados de direcciones IP maliciosas","Información sobre cómo los adversarios comprometen redes y sistemas, se mueven lateralmente, escalan privilegios y evaden defensas, clasificada en tácticas y técnicas específicas (TTP)","Únicamente la normativa europea de protección de datos","Un catálogo exclusivo de herramientas de cifrado"],"a":1,"e":"Según los apuntes: “MITRE ATT&CK responde a qué hacen, cómo lo hacen y cómo se mueven, desde la perspectiva del propio atacante. Ante un compromiso, los adversarios suelen pasar desapercibidos durante meses.”"},{"n":8075,"m":3,"q":"¿Qué significa la sigla TTP en el contexto de MITRE ATT&CK?","o":["Tácticas, técnicas y procedimientos","Tiempo total de propagación","Taxonomía y tipificación penal","Trazabilidad técnica y probatoria"],"a":0,"e":"Según los apuntes: “TTP: tácticas + técnicas + procedimientos realmente empleados por un actor.”"},{"n":8076,"m":3,"q":"¿Por qué señala el tema que el bloqueo no siempre es la medida más oportuna ante un incidente?","o":["Porque el bloqueo está prohibido por la normativa europea","Porque en ocasiones no es posible al haberse ya materializado la explotación de una vulnerabilidad","Porque el bloqueo siempre requiere una orden judicial previa","Porque el bloqueo solo puede aplicarse a ataques de tipo DDoS"],"a":1,"e":"Según los apuntes: “Bloqueo: la medida más oportuna, aunque no siempre posible (si la vulnerabilidad ya se explotó).”"},{"n":8077,"m":3,"q":"¿Cuál es el principal objetivo de la fase de contención o mitigación cuando el bloqueo no es posible?","o":["Aumentar la superficie de exposición del sistema afectado","Reducir el impacto del incidente evitando el movimiento lateral","Eliminar de forma permanente todos los registros del incidente","Notificar exclusivamente a la prensa sobre el incidente"],"a":1,"e":"Según los apuntes: “Contención / mitigación: objetivo principal cuando el bloqueo no es viable — evitar el movimiento lateral.”"},{"n":8078,"m":3,"q":"¿Por qué advierte el tema que la fase de recuperación no debe precipitarse?","o":["Porque exponer de nuevo los sistemas al riesgo puede suponer una nueva explotación de la vulnerabilidad","Porque la recuperación siempre debe retrasarse un mínimo de un año","Porque la recuperación es responsabilidad exclusiva de terceros proveedores","Porque no es necesario garantizar la continuidad del servicio"],"a":0,"e":"Según los apuntes: “Recuperación: garantizar la continuidad sin precipitarse (reexponer el sistema puede repetir la explotación).”"},{"n":8079,"m":3,"q":"¿Qué distingue a una acción de tipo preventivo de una acción de tipo reactivo según la tabla de acciones técnicas del tema?","o":["No existe ninguna diferencia, todas las acciones tienen el mismo carácter","Las preventivas se anticipan al incidente (por ejemplo, copias de respaldo o validación de entrada del servidor), mientras que las reactivas se aplican tras detectarse el incidente (por ejemplo, bloqueo de procesos maliciosos o aislamiento del sistema)","Las acciones reactivas solo pueden aplicarse antes de que ocurra el incidente","Las acciones preventivas solo son aplicables a ataques de phishing"],"a":1,"e":"Según los apuntes: “Acciones preventivas: reporte de IOC, concienciación, mínimo privilegio, backups, validación de entrada, cookies seguras. Acciones reactivas: bloqueo de IOC, inhabilitar cuentas, aislar el sistema, bloqueo geográfico por IP, hardening adicional.”"},{"n":8080,"m":3,"q":"¿Cuál es la finalidad del informe final elaborado en la fase de cierre del incidente?","o":["Servir como registro histórico y legal, incluyendo cronológica y detalladamente todas las acciones emprendidas desde el conocimiento del presunto incidente hasta su clasificación, análisis y respuesta","Sustituir la necesidad de haber registrado el incidente en la herramienta ITSM","Ser un documento exclusivamente interno sin ningún valor probatorio","Anular retroactivamente la clasificación de peligrosidad inicialmente asignada"],"a":0,"e":"Según los apuntes: “El cierre es la última fase: valora la respuesta dada, la persistencia residual y las debilidades descubiertas, y culmina en un informe final con valor de registro histórico y legal, detallando cronológicamente todo el proceso.”"},{"n":8081,"m":4,"q":"Según el tema, ¿cómo se clasifica el malware, y no por qué otro criterio?","o":["Por su sofisticación técnica","Por su finalidad, ya que cada familia persigue algo distinto y deja un rastro distinto","Exclusivamente por su lenguaje de programación","Por el número de víctimas que alcanza en su primera semana"],"a":1,"e":"Según los apuntes: “Cada familia de malware persigue algo distinto y, precisamente por eso, deja un rastro distinto, lo que orienta tanto la detección como la calificación jurídica del hecho:”"},{"n":8082,"m":4,"q":"¿Qué distingue al ransomware del resto de familias en cuanto a su huella?","o":["Es ruidoso por diseño: la víctima se entera en minutos porque de ello depende el cobro","Es completamente silencioso y nunca se detecta","No genera ningún tráfico de red","Su finalidad es exclusivamente disruptiva, sin ánimo económico"],"a":0,"e":"Según los apuntes: “Ransomware: cifrar y extorsionar — ruidoso por diseño, la víctima se entera en minutos porque de ello depende el cobro.”"},{"n":8083,"m":4,"q":"¿Cuál es el rasgo definitorio del spyware según el tema?","o":["El cifrado de archivos para exigir rescate","La exfiltración silenciosa, que se antepone a cualquier otra acción sobre el equipo","La propagación automática sin intervención humana","La destrucción irreversible de la información"],"a":1,"e":"Según los apuntes: “Rasgo definitorio: la exfiltración silenciosa se antepone a cualquier otra acción sobre el equipo.”"},{"n":8084,"m":4,"q":"¿Qué artículo del Código Penal alcanza a quien fabrica o facilita una herramienta de espionaje?","o":["El artículo 197 ter","El artículo 264","El artículo 248","El artículo 570 bis"],"a":0,"e":"Según los apuntes: “Encaje penal: artículos 197 y siguientes del Código Penal; el 197 ter alcanza a quien fabrica o facilita la herramienta.”"},{"n":8085,"m":4,"q":"¿Cuáles son las cuatro familias clásicas del spyware según Anson, Bunting, Johnson y Pearson (2020)?","o":["Ransomware, gusano, RAT y wiper","Keyloggers, adware/trackware, troyanos bancarios e infostealers","MaaS, C2, loader y dropper","Comercial, stalkerware, mercenario y criminal de masas"],"a":1,"e":"Según los apuntes: “Anson, Bunting, Johnson y Pearson (2020) las ordenan según el tipo de información que persiguen:”"},{"n":8086,"m":4,"q":"¿Qué caracteriza al stalkerware frente a otras categorías de spyware no estrictamente criminal?","o":["Se vende exclusivamente a Estados y cuerpos policiales","Se instala con acceso físico al dispositivo de la víctima, en un contexto habitual de violencia de género","Persigue únicamente fines publicitarios","No guarda relación con ningún delito contra la intimidad"],"a":1,"e":"Según los apuntes: “Stalkerware: aplicaciones de control instaladas con acceso físico al dispositivo de la víctima; contexto habitual de violencia de género; concurre con frecuencia con descubrimiento y revelación de secretos.”"},{"n":8087,"m":4,"q":"¿Qué NO hace un infostealer, a diferencia de otras familias de malware, según su definición en el tema?","o":["No persiste, no cifra, no destruye","No exfiltra ningún tipo de credencial","No puede distribuirse mediante phishing","No afecta nunca a navegadores web"],"a":0,"e":"Según los apuntes: “No persiste, no cifra, no destruye. Definición: malware diseñado para extraer de forma rápida y desatendida toda la información sensible almacenada en un equipo y enviarla a un servidor controlado por el atacante.”"},{"n":8088,"m":4,"q":"¿Cuál es el objetivo operativo de un infostealer?","o":["Mantener el control remoto del equipo de forma indefinida","Maximizar la cantidad de credenciales, cookies, tokens y datos financieros exfiltrados en una única ejecución, antes de ser detectado","Cifrar la información para exigir un rescate económico","Propagarse lateralmente sin ayuda del usuario"],"a":1,"e":"Según los apuntes: “Objetivo operativo: maximizar la cantidad de credenciales, cookies, tokens y datos financieros exfiltrados en una única ejecución, antes de ser detectado.”"},{"n":8089,"m":4,"q":"Según el tema, ¿por qué las cookies de sesión son hoy el activo más codiciado?","o":["Porque no tienen ningún valor en el mercado de logs","Porque permiten el bypass de MFA mediante session hijacking, y una sesión válida en M365 o Google Workspace puede valer cientos de euros","Porque caducan inmediatamente tras su robo","Porque solo afectan a cuentas personales sin valor corporativo"],"a":1,"e":"Según los apuntes: “Las cookies de sesión son hoy el activo más codiciado: una sesión válida en Microsoft 365 o Google Workspace puede valer cientos de euros en el mercado de logs.”"},{"n":8090,"m":4,"q":"En la cadena de valor del Malware-as-a-Service, ¿qué papel desempeña el «afiliado»?","o":["Vende el stealer como suscripción mensual","Compra acceso al stealer y monta las campañas de distribución","Revende los logs individuales en el mercado","Es quien sufre la infección inicial"],"a":1,"e":"Según los apuntes: “Afiliado: compra acceso y monta las campañas de distribución.”"},{"n":8091,"m":4,"q":"¿Qué brecha de seguridad citada en el tema tuvo su origen en credenciales robadas por Raccoon Stealer?","o":["CircleCI (enero 2023)","Orange España (enero 2024)","Snowflake (mayo 2024)","Compilation of Many Breaches"],"a":1,"e":"Según los apuntes: “Orange España (enero 2024): credenciales del portal RIPE NCC robadas por Raccoon Stealer → secuestro del ASN durante horas.”"},{"n":8092,"m":4,"q":"¿En qué lenguaje está desarrollado RedLine Stealer y qué tecnología usa para su C2?","o":[".NET (C#), usando WCF","Python, usando sockets RAW","C++, usando gRPC","JavaScript, usando WebSockets"],"a":0,"e":"Según los apuntes: “Lenguaje: .NET (C#) — usa WCF para C2.”"},{"n":8093,"m":4,"q":"¿Qué nivel de persistencia presenta habitualmente RedLine Stealer?","o":["Persistencia muy alta mediante tareas programadas","Habitualmente ninguna, al estar diseñado para exfiltración rápida y borrado","Persistencia exclusivamente en el registro de Windows","Persistencia garantizada mediante rootkit"],"a":1,"e":"Según los apuntes: “Persistencia: habitualmente NINGUNA — diseñado para exfiltración rápida y borrado.”"},{"n":8094,"m":4,"q":"¿Cuál es la secuencia correcta de la cadena de infección típica de RedLine?","o":["Cebo → Loader → Descarga del payload → Ejecución → Inventario y exfiltración → Envío al C2 y autoborrado","Ejecución → Cebo → Envío al C2 → Loader → Exfiltración → Autoborrado","Descarga del payload → Cebo → Autoborrado → Loader → Ejecución → Exfiltración","Inventario → Cebo → Loader → Autoborrado → Ejecución → Envío al C2"],"a":0,"e":"Según los apuntes: “Cadena de infección típica de RedLine”"},{"n":8095,"m":4,"q":"¿Qué indicador de red es característico de la comunicación C2 de RedLine?","o":["Tráfico HTTP estándar por el puerto 80 exclusivamente","TCP sobre puerto efímero, con datos serializados usando namespaces tempuri.org","Comunicación exclusiva por DNS sobre HTTPS","Uso exclusivo de protocolos de correo electrónico"],"a":1,"e":"Según los apuntes: “Comunicación C2: TCP sobre puerto efímero, datos serializados con namespaces tempuri.org.”"},{"n":8096,"m":4,"q":"¿A qué tipo penal puede dar lugar el uso de credenciales o cookies robadas para defraudar?","o":["Artículo 197 bis CP","Artículos 248 y 249 CP (estafa informática)","Artículo 570 bis CP exclusivamente","Artículo 264 CP exclusivamente"],"a":1,"e":"
