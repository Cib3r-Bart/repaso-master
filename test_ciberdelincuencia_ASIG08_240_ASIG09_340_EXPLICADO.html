e precisión: en la práctica bc1p corresponde a las direcciones Taproot (P2TR), y P2WSH también comienza por bc1q pero es más larga; conviene conocer la clasificación del temario pero saber esta matización.”"},{"n":9057,"m":3,"q":"Las direcciones Bitcoin P2SH empiezan por…","o":["1","3","bc1q","T"],"a":1,"e":"Según los apuntes: “Los tipos de direcciones Bitcoin según los apuntes son P2PKH (empieza por 1), P2SH (empieza por 3), P2WPKH (bc1q) y P2WSH (bc1p). Nota de precisión: en la práctica bc1p corresponde a las direcciones Taproot (P2TR), y P2WSH también comienza por bc1q pero es más larga; conviene conocer la clasificación del temario pero saber esta matización.”"},{"n":9058,"m":3,"q":"SegWit (2017) fue…","o":["Un soft fork","Un hard fork","Una ICO","Un ataque"],"a":0,"e":"Según los apuntes: “Los forks y cambios de protocolo de Bitcoin: 2009, bloque génesis; 2012, P2SH (BIP 16), direcciones multifirma; 2013, fork accidental v0.8, cadena dividida durante 6 horas; agosto 2017, SegWit (soft fork) que separa el testigo, y Bitcoin Cash (hard fork con bloques de 8 MB); octubre 2017, Bitcoin Gold; SegWit2x se cancela en noviembre; 2018, Lightning Network para pagos fuera de cadena.”"},{"n":9059,"m":3,"q":"Mempool.space permite consultar…","o":["Solo precios de NFT","Contratos de Ethereum únicamente","Wallets de hardware","Bloques, mempool y comisiones de Bitcoin"],"a":3,"e":"Según los apuntes: “Los vistos en el temario son Blockchair.com (direcciones, transacciones y bloques de múltiples cadenas), Mempool.space (bloques, mempool y comisiones de Bitcoin), Blockchain.info y Etherscan (explorador de Ethereum).”"},{"n":9060,"m":3,"q":"Los exploradores de blockchain obtienen su información a través de…","o":["Bancos centrales","Exchanges privados","Nodos completos diseminados por la red","Registros mercantiles"],"a":2,"e":"Según los apuntes: “Un explorador de blockchain es una herramienta web (motor de búsqueda) que permite consultar toda la información de la cadena y que obtiene sus datos a través de nodos completos diseminados por la red.”"},{"n":9061,"m":4,"q":"Se incauta porque…","o":["Es un trámite administrativo","Es imprescindible privar a las organizaciones criminales de sus recursos; aflorar no basta","Lo exige el exchange","Solo se hace por volatilidad"],"a":1,"e":"Según los apuntes: “Es necesario privar a las organizaciones criminales de sus recursos patrimoniales y económicos: no es suficiente aflorar, es imprescindible incautar.”"},{"n":9062,"m":4,"q":"La fase inicial de la incautación es…","o":["La petición de autorización judicial","La entrega al Ministerio de Justicia","La realización a euros","La creación de la sede judicial"],"a":0,"e":"Según los apuntes: “Las fases de la incautación son: (1) fase inicial (petición de autorización judicial); (2) creación de wallets (salvo en casos de hardware wallet); (3) actuación operativa en la diligencia de entrada y registro; (4) incautación durante el análisis de evidencias; y (5) incautación en sede judicial.”"},{"n":9063,"m":4,"q":"La creación de wallets se hace en la incautación…","o":["Nunca","Solo con papel","Solo con custodia","Salvo en casos de hardware wallet"],"a":3,"e":"Según los apuntes: “Las fases de la incautación son: (1) fase inicial (petición de autorización judicial); (2) creación de wallets (salvo en casos de hardware wallet); (3) actuación operativa en la diligencia de entrada y registro; (4) incautación durante el análisis de evidencias; y (5) incautación en sede judicial.”"},{"n":9064,"m":4,"q":"Una recomendación operativa es…","o":["Improvisar en el registro","Evitar contactar con el juez","Planificación previa siempre que sea posible","No documentar"],"a":2,"e":"Según los apuntes: “Las recomendaciones operativas son: planificación previa siempre que sea posible (wallets generadas, logística material, listado de URLs blockchain); abordar previamente con el órgano judicial la posible incautación y el procedimiento; incluir detalladamente en la solicitud de mandamiento los detalles de la incautación; y máximo cuidado y organización en la manipulación de la frase semilla y de las claves públicas, por el riesgo de pérdida de activos.”"},{"n":9065,"m":4,"q":"Antes de la petición judicial se recomiendan reuniones con…","o":["El exchange","Órgano judicial, Ministerio Fiscal y LAJ","Los investigados","La prensa"],"a":1,"e":"Según los apuntes: “Se recomiendan reuniones previas con el órgano judicial, el Ministerio Fiscal y el Letrado de la Administración de Justicia (LAJ) para explicar qué se quiere hacer y cómo, y una petición detallada y concreta.”"},{"n":9066,"m":4,"q":"La petición judicial solicita transferir los activos a…","o":["Una wallet controlada por la Unidad","La wallet del investigado","Un banco privado","Una hardware wallet del juez"],"a":0,"e":"Según los apuntes: “Debe solicitarse la incautación in situ de cualquier tipo de criptoactivo, la autorización para transferir todos los activos localizados (cualquier tipo de wallet, incluidos servicios de wallet con custodia de claves) a una wallet controlada por la Unidad, salvo que no corresponda por la custodia, y la facultad para transformar los activos si es necesario.”"},{"n":9067,"m":4,"q":"Una desventaja de las hardware wallets es…","o":["Su vulnerabilidad a ciberataques","Su falta de control de claves","No soportan ningún activo","Su coste y curva de aprendizaje"],"a":3,"e":"Según los apuntes: “Las fases de la incautación son: (1) fase inicial (petición de autorización judicial); (2) creación de wallets (salvo en casos de hardware wallet); (3) actuación operativa en la diligencia de entrada y registro; (4) incautación durante el análisis de evidencias; y (5) incautación en sede judicial.”"},{"n":9068,"m":4,"q":"Una desventaja de las billeteras de papel es…","o":["El coste elevado","Su conexión a Internet","El riesgo físico (pérdida, robo o destrucción)","Soportan pocos activos"],"a":2,"e":"Según los apuntes: “Se citan casos de riesgo: el llamado «robo de guante blanco» en Marbella, donde un secretario judicial se quedó con 17 millones de euros en criptomonedas, y los más de 863.000 euros ingresados por la ORGA procedentes del hacker Alcasec.”"},{"n":9069,"m":4,"q":"El caso del secretario judicial de Marbella ilustra…","o":["Un fraude en un ATM","El problema de la custodia de activos incautados","Un ataque a una hardware wallet","Un fallo de SICRIP"],"a":1,"e":"Según los apuntes: “Se citan casos de riesgo: el llamado «robo de guante blanco» en Marbella, donde un secretario judicial se quedó con 17 millones de euros en criptomonedas, y los más de 863.000 euros ingresados por la ORGA procedentes del hacker Alcasec.”"},{"n":9070,"m":4,"q":"Las software wallets son vulnerables por…","o":["Su conexión a Internet","Su aislamiento","Su coste","Falta de claves"],"a":0,"e":"Según los apuntes: “Las wallets modernas son carteras deterministas jerárquicas (HD). El principio es que la misma semilla genera siempre exactamente el mismo árbol de claves: a partir de la frase semilla (BIP-39), de 512 bits, se deriva mediante HMAC-SHA512 un nodo maestro (BIP-32) formado por una clave privada maestra y un chain code maestro (256 bits).”"},{"n":9071,"m":4,"q":"En servicios con custodia, la clave privada…","o":["La conserva siempre el usuario","No existe","Es pública","Está en poder de un tercero"],"a":3,"e":"Según los apuntes: “Debe solicitarse la incautación in situ de cualquier tipo de criptoactivo, la autorización para transferir todos los activos localizados (cualquier tipo de wallet, incluidos servicios de wallet con custodia de claves) a una wallet controlada por la Unidad, salvo que no corresponda por la custodia, y la facultad para transformar los activos si es necesario.”"},{"n":9072,"m":4,"q":"Las frases semilla deben conservarse…","o":["En cualquier orden","Solo en digital","Con su grafía original y en el mismo orden","Sin plataforma de origen"],"a":2,"e":"Según los apuntes: “Deben conservarse según su grafía original y en el mismo orden en que se generaron, y para recuperar la wallet es importante conocer la plataforma en la que se creó.”"},{"n":9073,"m":4,"q":"En un sistema de claves jerárquico (HD)…","o":["Cada clave es independiente","De una semilla se derivan una clave maestra y claves hijas","No hay semilla","Solo se usa una clave"],"a":1,"e":"Según los apuntes: “Los sistemas de gestión de claves privadas pueden ser no deterministas, deterministas o jerárquicos (HD): estos últimos, los actuales, derivan de una semilla una clave maestra y de ella claves hijas y nietas, permitiendo gestionar muchas claves privadas desde una sola semilla.”"},{"n":9074,"m":4,"q":"Para la wallet policial se usa…","o":["Una software wallet sin custodia (ej. Coinomi)","Una wallet de exchange con custodia","Solo billeteras de papel","Cuentas bancarias"],"a":0,"e":"Según los apuntes: “Se emplea una software wallet sin custodia (Coinomi, Exodus, Trust Wallet, MetaMask, etc.). Debe decidirse cómo se identifican las wallets y cuántas se van a usar, y utilizar sobres separados para la semilla y la contraseña, con entrega idealmente al final de la diligencia.”"},{"n":9075,"m":4,"q":"La semilla y la contraseña se guardan…","o":["En el mismo sobre","En un fichero compartido","En un correo electrónico","En sobres separados"],"a":3,"e":"Según los apuntes: “Debe decidirse cómo se identifican las wallets y cuántas se van a usar, y utilizar sobres separados para la semilla y la contraseña, con entrega idealmente al final de la diligencia.”"},{"n":9076,"m":4,"q":"Si se localizan evidencias durante el análisis de evidencias…","o":["Se espera al juicio","Se ignoran","Se actúa con inmediatez y se comunica al juzgado","Se entregan al investigado"],"a":2,"e":"Según los apuntes: “Durante el análisis de las evidencias incautadas: se localizan evidencias que permiten acceder o reconstruir una wallet; hay que actuar con inmediatez (riesgo de acceso de terceras personas), comunicar al juzgado y incautar de inmediato, amparándose en el mandamiento que ya autorizó la incautación durante la entrada y registro, documentando todos los parámetros.”"},{"n":9077,"m":4,"q":"La incautación en sede judicial requiere presencia de…","o":["Solo la Policía","Juez, LAJ, abogado defensor y encausado","Solo el fiscal","El exchange"],"a":1,"e":"Según los apuntes: “Durante el proceso judicial: ante la negativa inicial del encausado, si cambia su voluntad, se actúa en sede judicial con presencia del juez, el LAJ, el abogado defensor y el encausado, se realiza la reconstrucción de la wallet policial (desprecintado de los sobres) y se documenta la operación en el acta judicial.”"},{"n":9078,"m":4,"q":"La realización anticipada a euros se gestiona a través de…","o":["La ORGA","El SEPBLAC","La AEAT","Prosegur"],"a":0,"e":"Según los apuntes: “El procedimiento: se solicita a la autoridad judicial que encomiende a la ORGA (Oficina de Recuperación y Gestión de Activos) la gestión de los activos, pidiendo la realización anticipada y su transformación a euros; si el juzgado autoriza, oficia a la ORGA, que se pone en contacto con la unidad investigadora para concretar fecha y lugar de la transferencia; los activos se transfieren a una wallet creada para ello en un exchange de referencia (Bit2Me).”"},{"n":9079,"m":4,"q":"El exchange de referencia citado para la realización es…","o":["Binance","Coinbase","Kraken","Bit2Me"],"a":3,"e":"Según los apuntes: “El procedimiento: se solicita a la autoridad judicial que encomiende a la ORGA (Oficina de Recuperación y Gestión de Activos) la gestión de los activos, pidiendo la realización anticipada y su transformación a euros; si el juzgado autoriza, oficia a la ORGA, que se pone en contacto con la unidad investigadora para concretar fecha y lugar de la transferencia; los activos se transfieren a una wallet creada para ello en un exchange de referencia (Bit2Me).”"},{"n":9080,"m":4,"q":"El SICRIP es fruto de un acuerdo entre…","o":["La CNMV y el Banco de España","La AEAT y Binance","El Ministerio del Interior y Prosegur Crypto","Europol y Chainalysis"],"a":2,"e":"Según los apuntes: “El SICRIP (Sistema de Incautación de Criptoactivos) nace de un acuerdo entre el Ministerio del Interior y Prosegur Crypto. Se desarrolla en el seno del CETS, con participación de expertos de Policía Nacional y Guardia Civil.”"},{"n":9081,"m":5,"q":"La función de un mezclador (tumbler) es…","o":["Acelerar la confirmación de bloques","Romper el vínculo determinista entre remitente y destinatario","Aumentar la comisión del minero","Firmar transacciones en nombre del usuario"],"a":1,"e":"Según los apuntes: “La función de un mezclador (tumbler) es romper el vínculo determinista entre remitente y destinatario, combinando fondos de múltiples usuarios para dificultar el rastreo.”"},{"n":9082,"m":5,"q":"Los mezcladores no custodios en los que varios usuarios combinan sus transacciones en una sola se llaman…","o":["CoinJoin","Tornado Cash","Wasabi exchange","Lightning Network"],"a":0,"e":"Según los apuntes: “El blanqueo de capitales con criptoactivos adapta el modelo trifásico clásico del blanqueo de dinero a este ecosistema: (1) colocación, el rastro de entrada de fondos ilícitos en el sistema cripto; (2) estratificación, las técnicas clásicas de ofuscación —fragmentación y consolidación (dividir grandes sumas y reunirlas sucesivamente, con un aumento sensible del uso de mezcladores multisalto en los últimos ejercicios), mezcladores (mixers y CoinJoin), y saltos entre cadenas y DeFi (chain hopping)”"},{"n":9083,"m":5,"q":"Tornado Cash es el caso de estudio destacado de…","o":["Mezcladores custodios centralizados","Exchanges regulados","Darknet markets","Mezcladores basados en contratos inteligentes (100 % on-chain)"],"a":3,"e":"Según los apuntes: “La contramedida preventiva central es revoke.cash, una web legítima que permite revisar y revocar permisos de aprobación otorgados previamente a direcciones o contratos, cortando el acceso del atacante aunque la aprobación llevara tiempo concedida.”"},{"n":9084,"m":5,"q":"En un mezclador custodio, el principal riesgo es…","o":["Que no se pueda usar nunca más de una vez","Que sea obligatoriamente ilegal","Que el operador controle los fondos (punto único de fallo)","Que no admita Bitcoin"],"a":2,"e":"Según los apuntes: “Las estructuras del cibercrimen moderno han pasado de un modelo tradicional centralizado (un único operador asume desarrollo, infraestructura, negociación y despliegue, con alto riesgo técnico y operativo concentrado) al modelo RaaS (Ransomware-as-a-Service), de naturaleza corporativa: el operador desarrolla y mantiene la infraestructura del ransomware, licenciándolo a afiliados, que son quienes ejecutan los ataques y reparten un porcentaje de cada rescate cobrado con el operador.”"},{"n":9085,"m":5,"q":"El uso de un mezclador en la fase pre-delito busca…","o":["Pagar impuestos de forma anticipada","Ocultar la identidad y anonimizar capital antes de cometer el ilícito","Declarar la operación al SEPBLAC","Congelar los fondos de la víctima"],"a":1,"e":"Según los apuntes: “La dimensión temporal de la investigación forense distingue dos momentos: en el pre-delito, el actor oculta su identidad y anonimiza su capital antes de cometer el ilícito (favorece su relación con el Exchange); en el post-delito, el actor busca ocultar el origen y blanquear el producto de un delito previo (robo, estafa) para poder retirarlo con normalidad.”"},{"n":9086,"m":5,"q":"Un mercado de la darknet sostiene la confianza entre usuarios mediante…","o":["Sistemas de reputación y depósito en garantía (escrow)","Contratos notariales","Avales bancarios","Un registro público de la CNMV"],"a":0,"e":"Según los apuntes: “Su funcionamiento se sostiene en tres pilares: el acceso (redes de anonimización como Tor/I2P que ocultan la ubicación e identidad del servidor y del usuario), la economía (criptomonedas como Bitcoin o, con creciente peso, Monero, usadas como medio de pago nativo del ecosistema) y la confianza (sistemas de reputación entre usuarios y mecanismos de depósito en garantía (escrow) que retienen el pago hasta la entrega).”"},{"n":9087,"m":5,"q":"En la estafa de salida (exit scam), la fase final consiste en…","o":["La devolución íntegra a los usuarios","La intervención judicial automática","El reparto de beneficios entre los vendedores","La desaparición de los administradores con los fondos retenidos (día cero)"],"a":3,"e":"Según los apuntes: “Se desarrolla en tres fases: fase 1, consolidación: los administradores acumulan intencionadamente un volumen elevado de fondos en garantía, elevando la confianza de los usuarios; fase 2, finjen interés y siguen operando con normalidad (fingen seguir operando, animando a más usuarios a depositar); fase 3, la desaparición (día cero): en un día determinado desaparecen permanentemente con todos los fondos retenidos, cerrando la plataforma sin previo aviso.”"},{"n":9088,"m":5,"q":"Los vendedores mayoristas, según las tendencias de 2024, se caracterizan por…","o":["Operar solo con carteras personales","Evitar siempre los mezcladores","Impulsar agresivamente el uso de DeFi para fragmentar y blanquear grandes volúmenes","No usar nunca stablecoins"],"a":2,"e":"Según los apuntes: “El comportamiento financiero de 2024 distingue entre vendedores minoristas (bajo volumen: mayor tendencia a mantener ganancias en carteras on-chain propias, con patrones más sencillos de seguir en su propia wallet) y vendedores mayoristas (grandes volúmenes: distribuyen a gran escala narcóticos y armas; son los principales impulsores de la adopción de DeFi, utilizándolos agresivamente para fragmentar, blanquear y mover grandes volúmenes de capital fuera de espacios regulados).”"},{"n":9089,"m":5,"q":"El catalizador de la financiación extremista mediante criptoactivos es…","o":["La obligatoriedad legal de usar cripto","La exclusión bancaria de estos grupos","La ausencia de internet en ciertas zonas","La prohibición de las ONG"],"a":1,"e":"Según los apuntes: “El catalizador común es la exclusión bancaria de estos grupos: al quedar fuera del sistema financiero tradicional por el cierre de cuentas bancarias, recurren a la infraestructura criptográfica (atractivo transferible, rápido y potencialmente privado) como alternativa.”"},{"n":9090,"m":5,"q":"La tendencia operativa hacia las stablecoins en la financiación extremista responde a…","o":["La necesidad de preservar el valor del capital recaudado frente a la volatilidad","La prohibición de usar Bitcoin","Una exigencia del GAFI","El cierre de todos los exchanges"],"a":0,"e":"Según los apuntes: “Dos tendencias operativas relevantes: el giro hacia las stablecoins (preferidas frente a monedas volátiles por preservar el valor del capital recaudado) y el reto analítico de Monero, cuya opacidad criptográfica obliga a la inteligencia a recurrir a métodos complementarios (infiltración de datos, análisis de patrones de comportamiento, explotación de vulnerabilidades técnicas en la seguridad operativa de los propios actores), ya que el análisis on-chain tradicional resulta directamente inútil.”"},{"n":9091,"m":5,"q":"La ecuación del ransomware es…","o":["Phishing + banca + SEPBLAC","Minería + PoS + Ethereum","Mixer + exchange + KYC","Malware + extorsión + criptoactivos"],"a":3,"e":"Según los apuntes: “El ransomware es la ecuación: malware + extorsión + criptoactivos.”"},{"n":9092,"m":5,"q":"El modelo RaaS (Ransomware-as-a-Service) se caracteriza por…","o":["Un único atacante que lo hace todo él mismo","La ausencia total de reparto de beneficios","Un operador que desarrolla el software y licencia su uso a afiliados que ejecutan los ataques","Requerir autorización judicial previa"],"a":2,"e":"Según los apuntes: “Las estructuras del cibercrimen moderno han pasado de un modelo tradicional centralizado (un único operador asume desarrollo, infraestructura, negociación y despliegue, con alto riesgo técnico y operativo concentrado) al modelo RaaS (Ransomware-as-a-Service), de naturaleza corporativa: el operador desarrolla y mantiene la infraestructura del ransomware, licenciándolo a afiliados, que son quienes ejecutan los ataques y reparten un porcentaje de cada rescate cobrado con el operador.”"},{"n":9093,"m":5,"q":"Según el temario, el volumen de pagos de rescates de ransomware en cadena durante 2024…","o":["Se duplicó","Cayó un 35 % interanual","Se mantuvo exactamente igual","Desapareció por completo"],"a":1,"e":"Según los apuntes: “El panorama 2024-2025 registra una caída interanual del 35 % en el volumen total de pagos de rescates en cadena, atribuible en parte a una mayor negativa de las víctimas a pagar y a la mejora de las capacidades de rastreo policial.”"},{"n":9094,"m":5,"q":"En el Ice Phishing, el atacante consigue…","o":["Que la víctima apruebe (approve) un contrato malicioso que autoriza el gasto de sus fondos","Robar directamente la clave privada de la víctima","Minar un bloque falso","Hackear el servidor de un exchange"],"a":0,"e":"Según los apuntes: “El atacante engaña al usuario para que apruebe un contrato malicioso que parece legítimo: la víctima firma una transacción que concede permiso a un contrato inteligente para gastar sus fondos (función approve), creyendo que legitima una operación cotidiana (conectar su wallet a una web, por ejemplo).”"},{"n":9095,"m":5,"q":"La herramienta citada para revisar y revocar permisos de aprobación concedidos a contratos es…","o":["Etherscan","Wasabi Wallet","SICRIP","revoke.cash"],"a":3,"e":"Según los apuntes: “La contramedida preventiva central es revoke.cash, una web legítima que permite revisar y revocar permisos de aprobación otorgados previamente a direcciones o contratos, cortando el acceso del atacante aunque la aprobación llevara tiempo concedida.”"},{"n":9096,"m":5,"q":"El Address Poisoning consiste en…","o":["Enviar malware por correo electrónico","Modificar el código fuente de un contrato ya desplegado","Enviar transacciones desde una dirección visualmente similar para «envenenar» el historial de la víctima","Duplicar la clave privada de la víctima"],"a":2,"e":"Según los apuntes: “El Address Poisoning (envenenamiento de direcciones) consiste en infectar el historial transaccional de la víctima: los atacantes estudian la actividad de una dirección de alto valor y crean una dirección visualmente similar (primeros y últimos caracteres idénticos) a una con la que la víctima opera con frecuencia, y le envían transacciones de valor irrisorio para que esa dirección fraudulenta («envenenada») quede registrada en su historial reciente de transacciones.”"},{"n":9097,"m":5,"q":"En el caso real de Address Poisoning citado, el atacante trasladó los fondos robados…","o":["A una cuenta bancaria directamente","A la red TRON mediante un bridge","De vuelta a la víctima","A un cajero ATM de bitcoin"],"a":1,"e":"Según los apuntes: “Un caso real citado en el temario es la operación de la UDEF contra una red de blanqueo para el narcotráfico (2026), con cifras de 53 millones de euros (aproximadamente 30 millones de dólares), 400 kilogramos de sustancia estupefaciente intervenida y 14 detenidos, que ilustra cómo las tres fases del blanqueo (colocación, estratificación, integración) se aplican de forma coordinada para disimular el origen ilícito de fondos procedentes del narcotráfico mediante criptoactivos.”"},{"n":9098,"m":5,"q":"El Pig Butchering (Sha Zhu Pan) se caracteriza por…","o":["Una ingeniería social prolongada que genera una relación de confianza antes de robar el capital","Un ataque instantáneo sin contacto previo","El uso exclusivo de ransomware","La explotación de una vulnerabilidad de un contrato inteligente"],"a":0,"e":"Según los apuntes: “El Pig Butchering (Sha Zhu Pan, literalmente «matanza del cerdo») es un fraude financiero a largo plazo basado en una ingeniería social prolongada, que persigue el objetivo de generar una confianza profunda en la víctima («engordarla») antes de esquilmar su capital («sacrificarla»).”"},{"n":9099,"m":5,"q":"El Grupo Lazarus está vinculado a…","o":["Una organización narcotraficante sudamericana","Un grupo de hacktivistas europeos","Una empresa de ciberseguridad privada","Corea del Norte"],"a":3,"e":"Según los apuntes: “Lazarus es un grupo de amenaza persistente avanzada (APT) vinculado al régimen de Corea del Norte, especializado en el robo masivo de criptoactivos como vía de financiación estatal.”"},{"n":9100,"m":5,"q":"El vector de acceso inicial más habitual de Lazarus explota…","o":["Una vulnerabilidad de hardware","Un fallo de SHA-256","La ingeniería social dirigida a empleados o proveedores de exchanges (reclutador falso)","El robo físico de servidores"],"a":2,"e":"Según los apuntes: “El vector de acceso inicial explota de forma preferente el factor humano: ingeniería social dirigida a proveedores de custodia o exchanges, mediante un reclutador falso que ofrece una oportunidad laboral ficticia a un empleado o trabajador de TI, y que durante el «proceso de selección» introduce malware (el llamado «caballo de Troya»).”"},{"n":9101,"m":6,"q":"Ethereum es, ante todo…","o":["Un banco central digital","Una red pública sobre la que se pueden registrar operaciones y ejecutar programas","Un mezclador de criptoactivos","Un explorador de Bitcoin"],"a":1,"e":"Según los apuntes: “Ethereum es una red informática pública y una plataforma sobre la que se pueden registrar operaciones y, sobre todo, ejecutar programas. La idea fue impulsada por Vitalik Buterin a finales de 2013, que redactó la propuesta inicial conocida como whitepaper.”"},{"n":9102,"m":6,"q":"La idea de Ethereum fue impulsada por…","o":["Vitalik Buterin, a finales de 2013","Satoshi Nakamoto, en 2009","Adam Back, en 2002","Charlie Lee, en 2011"],"a":0,"e":"Según los apuntes: “La idea fue impulsada por Vitalik Buterin a finales de 2013, que redactó la propuesta inicial conocida como whitepaper. Durante 2014 se incorporaron otros cofundadores, desarrolladores y colaboradores, entre ellos Gavin Wood y Joseph Lubin, y en ese año se realizó una venta inicial de ETH para financiar el desarrollo.”"},{"n":9103,"m":6,"q":"La red principal de Ethereum (Frontier) se lanzó el…","o":["3 de enero de 2009","28 de septiembre de 2026","Octubre de 2022","30 de julio de 2015"],"a":3,"e":"Según los apuntes: “La primera versión operativa de la red principal, llamada Frontier, se lanzó el 30 de julio de 2015, con su bloque génesis. Durante 2014 se incorporaron otros cofundadores, desarrolladores y colaboradores, entre ellos Gavin Wood y Joseph Lubin, y en ese año se realizó una venta inicial de ETH para financiar el desarrollo.”"},{"n":9104,"m":6,"q":"El motivo de la creación de Ethereum, frente a Bitcoin, fue…","o":["Sustituir completamente a Bitcoin como moneda de pago","Evitar el uso de criptografía","Usar una cadena de bloques para ejecutar y construir aplicaciones de muchos tipos, no solo lanzar una moneda","Centralizar el control en una autoridad"],"a":2,"e":"Según los apuntes: “El motivo de su nacimiento es que Bitcoin ya era un sistema descentralizado con su propia moneda digital y había demostrado que era posible mantener un registro de la contabilidad de forma descentralizada; Ethereum fue más allá: su idea fue utilizar una cadena de bloques para ejecutar y construir aplicaciones de muchos tipos, no limitarse a lanzar otra moneda digital, sino ofrecer una plataforma programable.”"},{"n":9105,"m":6,"q":"Ethereum emplea actualmente el mecanismo de consenso…","o":["Proof of Work exclusivamente","Proof of Stake","Prueba de autoridad delegada únicamente","Ninguno, es centralizado"],"a":1,"e":"Según los apuntes: “Ethereum emplea actualmente un mecanismo de consenso basado en Prueba de Participación (Proof of Stake): determinados participantes, llamados validadores, contribuyen a proponer y confirmar bloques bajo unas reglas que incluyen incentivos y penalizaciones.”"},{"n":9106,"m":6,"q":"La transición de Ethereum de minería a Proof of Stake («The Merge») se produjo en…","o":["Septiembre de 2022","Julio de 2015","Enero de 2009","Marzo de 2023"],"a":0,"e":"Según los apuntes: “Hasta septiembre de 2022, la red principal funcionaba mediante minería (Proof of Work); la transición a Prueba de Participación se produjo en esa fecha (el llamado «The Merge»).”"},{"n":9107,"m":6,"q":"Ether (ETH) es…","o":["Un sinónimo exacto de «Ethereum» sin matices","Un tipo de nodo","Un explorador de bloques","El criptoactivo nativo de la red Ethereum"],"a":3,"e":"Según los apuntes: “Ether, o ETH, no son lo mismo que «Ethereum»: Ether es el criptoactivo nativo de la red, igual que Bitcoin lo es de la red Bitcoin. Permite, entre otras cosas, enviar valor de una dirección a otra o pagar las comisiones necesarias para interactuar con la red.”"},{"n":9108,"m":6,"q":"Las comisiones para interactuar con la red Ethereum se pagan en…","o":["Dólares únicamente","Bitcoin","ETH («gas»)","Tokens ERC-20 de cualquier tipo"],"a":2,"e":"Según los apuntes: “Para enviar una operación o interactuar con un contrato se pagan comisiones en ETH, habitualmente llamadas «gas»: el «gas» es la unidad en la que se mide el trabajo computacional requerido por una operación; el importe final de la comisión depende del gas consumido y del precio del gas.”"},{"n":9109,"m":6,"q":"Las direcciones de Ethereum…","o":["Empiezan por «1», «3» o «bc1»","Empiezan todas por «0x…»","No tienen ningún prefijo común","Dependen del tipo de wallet usada"],"a":1,"e":"Según los apuntes: “Todas las direcciones de la red de Ethereum empiezan por «0x…». En realidad existen dos tipos de cuentas, aunque ambas tienen una dirección que empieza por «0x…» y pueden mantener ETH y tokens: la diferencia está en su origen.”"},{"n":9110,"m":6,"q":"Una cuenta de propiedad externa (EOA) se controla mediante…","o":["Una clave privada","El código de un contrato inteligente","Un nodo validador","Un certificado notarial"],"a":0,"e":"Según los apuntes: “Las cuentas de propiedad externa (External Owned Accounts, EOA) se controlan con una clave privada: quien puede utilizar esa clave puede firmar operaciones desde esa cuenta.”"},{"n":9111,"m":6,"q":"Una cuenta de contrato…","o":["Se controla igual que una EOA, con clave privada","Solo puede recibir ETH, nunca tokens","Es siempre anónima e imposible de analizar","No tiene clave privada propia; actúa como consecuencia de una transacción externa"],"a":3,"e":"Según los apuntes: “Una cuenta de contrato no tiene clave privada propia con la que firmar una transacción de la misma forma que lo hace una EOA, sino que se ejecuta como consecuencia de una transacción iniciada desde fuera, y puede llegar a invocar a otros contratos y activar movimientos de tokens o interacciones con otros contratos.”"},{"n":9112,"m":6,"q":"Para diferenciar una EOA de una cuenta de contrato, lo más sencillo es…","o":["Mirar el número de caracteres de la dirección","Comprobar el color de la dirección en la wallet","Consultar la dirección en un explorador como Etherscan.io","Preguntar al propietario"],"a":2,"e":"Según los apuntes: “La comprobación básica consiste en consultar el código asociado a esa dirección, la cadena y el bloque que se está estudiando; la forma más sencilla es consultar la dirección en el explorador de bloques de la red Ethereum, Etherscan.io: una dirección de contrato muestra una pestaña específica con su código (a menudo verificado), mientras que una EOA no la tiene.”"},{"n":9113,"m":6,"q":"Un contrato inteligente puede modificarse tras su despliegue…","o":["Siempre, como cualquier archivo de texto","Solo si se programó deliberadamente un patrón de actualización (proxy)","Nunca, bajo ninguna circunstancia","Solo si lo autoriza el banco central"],"a":1,"e":"Según los apuntes: “Pero si un contrato está previsto para que permita cierta actualización («upgrade»), algunas partes del comportamiento futuro podrían reasignarse mediante un patrón de contrato administrado como «proxy», pero esto debe haber sido previsto y programado explícitamente; el que se pueda o no modificar es una decisión de diseño que hay que examinar caso por caso, investigando quién controla esa capacidad de actualización y cómo está restringida.”"},{"n":9114,"m":6,"q":"¿Puede ser hackeado un contrato inteligente?","o":["Sí, por errores de programación, lógica de permisos equivocada o interacción no verificada con otros contratos","No, al estar en blockchain es matemáticamente invulnerable","Solo si usa Proof of Work","No, solo pueden ser hackeadas las EOA"],"a":0,"e":"Según los apuntes: “Que una operación se ejecute registrada en una blockchain no significa que el programa sea seguro: un contrato inteligente puede contener errores, puede: contener un error en su programación, aplicar una lógica de permisos equivocada, o responder de una forma inesperada ante la interacción con otros contratos.”"},{"n":9115,"m":6,"q":"Quién puede interactuar con un contrato inteligente depende de…","o":["La cantidad de ETH que tenga el usuario","El país de residencia del usuario","El explorador que se utilice","Las funciones y permisos programados por su creador"],"a":3,"e":"Según los apuntes: “Para un investigador, saber quién es el creador y qué funciones ofrece el contrato es tan relevante como saber de quién es una dirección EOA.”"},{"n":9116,"m":6,"q":"Un token ERC-20 es un ejemplo de…","o":["Un tipo de nodo de Bitcoin","Un mezclador no custodio","Token fungible que corre sobre Ethereum","Un contrato inteligente no modificable"],"a":2,"e":"Según los apuntes: “Entre ellos hay, por ejemplo, tokens fungibles (como los del estándar ERC-20) y no fungibles (NFT); «fungible» significa que cada unidad del token es intercambiable por cualquier otra unidad equivalente.”"},{"n":9117,"m":6,"q":"En Etherscan, el apartado que resume en lenguaje natural una operación (p. ej. un swap) es…","o":["«Gap limit»","«Transaction Action»","«Coinbase»","«SICRIP»"],"a":1,"e":"Según los apuntes: “Para identificarlo se revisan dos bloques de información del explorador: el apartado «Transaction Action», que resume en lenguaje natural la operación ejecutada (por ejemplo «Swap 27.075,02 USDC For 27.069,51 USDT On Uniswap V3»), y el apartado «ERC-20 Tokens Transferred» o «Token Transfers (ERC-20)», que detalla los movimientos concretos de tokens asociados a esa transacción y debe cuadrar con lo indicado en la acción de la transacción.”"},{"n":9118,"m":6,"q":"El campo «Interacted With (To)» de una transacción indica…","o":["El contrato o dirección con el que interactúa la transacción","La comisión pagada por el minero","El número de confirmaciones del bloque","La frase semilla del emisor"],"a":0,"e":"Según los apuntes: “Dos campos resultan especialmente importantes para la investigación: «From», la dirección que origina la transacción, y «Interacted With (To)», el contrato o dirección con el que esa transacción interactúa (por ejemplo, un puente o bridge entre cadenas).”"},{"n":9119,"m":6,"q":"«Decode Input Data» en Etherscan permite…","o":["Calcular el hash SHA-256 de la transacción","Generar una nueva dirección EOA","Revocar automáticamente un permiso de aprobación","Descomponer los parámetros exactos de la función del contrato invocada"],"a":3,"e":"Según los apuntes: “Por último, la pestaña «More Details» → «Decode Input Data» descompone los parámetros exactos de la función del contrato que se ha invocado (nombre de la función y argumentos codificados), lo que permite, por ejemplo, distinguir una simple aprobación de gasto (approve) de una transferencia real de fondos, una comprobación especialmente relevante al investigar casos de ice phishing (Tema 6), en los que la transacción sospechosa suele ser precisamente una aprobación oculta tras una interfaz engaño”"},{"n":9120,"m":6,"q":"Distinguir una aprobación (approve) de una transferencia real mediante «Decode Input Data» es especialmente relevante para investigar…","o":["La minería de Bitcoin","El registro del Banco de España","Casos de ice phishing","El whitepaper de Nakamoto"],"a":2,"e":"Según los apuntes: “Por último, la pestaña «More Details» → «Decode Input Data» descompone los parámetros exactos de la función del contrato que se ha invocado (nombre de la función y argumentos codificados), lo que permite, por ejemplo, distinguir una simple aprobación de gasto (approve) de una transferencia real de fondos, una comprobación especialmente relevante al investigar casos de ice phishing (Tema 6), en los que la transacción sospechosa suele ser precisamente una aprobación oculta tras una interfaz engaño”"},{"n":9121,"m":7,"q":"El proyecto TRON fue dado a conocer en 2017 por…","o":["Vitalik Buterin","Justin Sun","Satoshi Nakamoto","Charlie Lee"],"a":1,"e":"Según los apuntes: “Conviene distinguir dos fechas: el proyecto TRON se dio a conocer en 2017 por Justin Sun, con la Fundación TRON constituida en Singapur ese mismo año; la red blockchain de TRON propiamente dicha se desarrolló en 2018, con el lanzamiento de Odyssey 2.0 como red principal el 31/05/2018, al que siguió un periodo de pruebas, y el «TRON Independence Day» el 25/06/2018, fecha del bloque génesis y de la migración de TRX desde Ethereum a la nueva red propia.”"},{"n":9122,"m":7,"q":"La red blockchain de TRON (bloque génesis y migración de TRX desde Ethereum) se lanzó el…","o":["25/06/2018","31/05/2018","2017, junto con el proyecto","2009, igual que Bitcoin"],"a":0,"e":"Según los apuntes: “Conviene distinguir dos fechas: el proyecto TRON se dio a conocer en 2017 por Justin Sun, con la Fundación TRON constituida en Singapur ese mismo año; la red blockchain de TRON propiamente dicha se desarrolló en 2018, con el lanzamiento de Odyssey 2.0 como red principal el 31/05/2018, al que siguió un periodo de pruebas, y el «TRON Independence Day» el 25/06/2018, fecha del bloque génesis y de la migración de TRX desde Ethereum a la nueva red propia.”"},{"n":9123,"m":7,"q":"La motivación técnica principal de TRON fue…","o":["Eliminar por completo los contratos inteligentes","Centralizar la custodia de todos los criptoactivos","Sustituir al dólar como moneda de reserva","Facilitar aplicaciones a gran escala reduciendo limitaciones de capacidad y costes"],"a":3,"e":"Según los apuntes: “La motivación técnica principal fue facilitar aplicaciones a gran escala y de uso masivo, con muchas operaciones, reduciendo las limitaciones de capacidad y reduciendo costes, al considerar que la congestión y las comisiones de otras redes (fundamentalmente Ethereum) dificultaban su utilización masiva.”"},{"n":9124,"m":7,"q":"TRON adoptó como mecanismo de consenso…","o":["La prueba de trabajo (PoW)","Un sistema de autoridad única","La prueba de participación delegada (DPoS)","Ninguno, es un sistema centralizado"],"a":2,"e":"Según los apuntes: “Para lograrlo, TRON adoptó un mecanismo denominado «prueba de participación delegada» o Delegated Proof-of-Stake (DPoS) y un modelo de recursos propio para costear las operaciones.”"},{"n":9125,"m":7,"q":"La incorporación de Tether (USDT) a TRON se produjo en…","o":["2015","2019","2009","2024"],"a":1,"e":"Según los apuntes: “Con el tiempo, sus aplicaciones se ampliaron al intercambio de activos, servicios financieros y servicios de pago, siendo especialmente relevante en este sentido la incorporación de Tether (USDT) en 2019, que hizo que esta red adquiriera su principal e importante función actual como infraestructura de transferencia de valor.”"},{"n":9126,"m":7,"q":"En TRON, quienes se turnan para producir los bloques son…","o":["Los 27 superrepresentantes activos","Todos los nodos completos por igual","Un único servidor central","Los titulares de USDT"],"a":0,"e":"Según los apuntes: “Sin embargo, los «27 superrepresentantes activos», elegidos mediante votos, se turnan para producir los bloques (producción concentrada, aunque no «centralizada», en un grupo reducido de 27 representantes elegidos).”"},{"n":9127,"m":7,"q":"La TRON Virtual Machine (TVM)…","o":["Es exactamente igual que la EVM de Ethereum","No permite ejecutar contratos inteligentes","Solo existe en Bitcoin","Es compatible con la EVM en numerosos aspectos, pero no es idéntica"],"a":3,"e":"Según los apuntes: “Es compatible con la EVM de Ethereum en numerosos aspectos, pero no es idéntica: existen diferencias técnicas que pueden exigir adaptar a TRON un contrato desarrollado originalmente para Ethereum.”"},{"n":9128,"m":7,"q":"En DPoS, los superrepresentantes se eligen mediante…","o":["Un sorteo aleatorio diario","Designación directa de Justin Sun","El voto de quienes hacen staking de TRX","Subasta pública en dólares"],"a":2,"e":"Según los apuntes: “TRON utiliza, en cambio, la prueba de participación delegada (Delegated Proof-of-Stake, DPoS): los participantes con derechos de voto —obtenido mediante staking de TRX— votan para elegir a los 27 «superrepresentantes» o «productores de bloques» (los 27 más votados), que forman el grupo activo que produce los bloques por turnos, actualmente cada 6 horas.”"},{"n":9129,"m":7,"q":"Actualmente, el grupo de superrepresentantes en TRON se actualiza…","o":["Cada 32 bloques de Ethereum","Cada 6 horas","Una vez al año","Nunca, es fijo desde 2018"],"a":1,"e":"Según los apuntes: “TRON utiliza, en cambio, la prueba de participación delegada (Delegated Proof-of-Stake, DPoS): los participantes con derechos de voto —obtenido mediante staking de TRX— votan para elegir a los 27 «superrepresentantes» o «productores de bloques» (los 27 más votados), que forman el grupo activo que produce los bloques por turnos, actualmente cada 6 horas.”"},{"n":9130,"m":7,"q":"El tiempo de bloque aproximado de TRON es de…","o":["~3 segundos","~12 segundos","~10 minutos","~75 segundos"],"a":0,"e":"Según los apuntes: “TRON programa bloques aproximadamente cada 3 segundos; Ethereum organiza el tiempo en intervalos de 12 segundos, en los que puede proponerse un bloque.”"},{"n":9131,"m":7,"q":"Según el temario, comparar solo los segundos por bloque entre TRON y Ethereum…","o":["Es el único criterio relevante","Demuestra que TRON es siempre superior","Demuestra que Ethereum es siempre superior","No basta para decidir cuál red es «mejor»: importan también capacidad, coste, seguridad y servicio"],"a":3,"e":"Según los apuntes: “Tampoco basta con comparar los segundos por bloque para decidir cuál red es «mejor»: importan también la capacidad disponible, el coste, la seguridad y el servicio que se quiera utilizar en cada caso.”"},{"n":9132,"m":7,"q":"En sus inicios, TRX se emitió como…","o":["La moneda nativa de Bitcoin","Un NFT en TRON","Un token ERC-20 sobre la blockchain de Ethereum","Una stablecoin referenciada al euro"],"a":2,"e":"Según los apuntes: “Como curiosidad histórica, en sus comienzos TRX se emitió como un token sobre Ethereum, utilizando el estándar ERC-20: existía un activo llamado TRX, pero sus operaciones se registraban inicialmente en la blockchain de Ethereum, cuya infraestructura se utilizaba.”"},{"n":9133,"m":7,"q":"El estándar más conocido para tokens fungibles en la red TRON es…","o":["ERC-20","TRC-20","BIP-39","SLIP-44"],"a":1,"e":"Según los apuntes: “El estándar más conocido para tokens fungibles en TRON es el TRC-20. Que un token tenga el mismo nombre no significa que sus transferencias se registren en la misma cadena: antes de enviar o investigar fondos hay que identificar el criptoactivo y la red concreta (y la dirección del contrato oficial del token).”"},{"n":9134,"m":7,"q":"Sobre USDT, es cierto que…","o":["USDT en Ethereum y USDT en TRON tienen contratos y registros de transacciones separados","Es exactamente el mismo registro en ambas redes","Solo existe en TRON","No puede enviarse mediante un contrato inteligente"],"a":0,"e":"Según los apuntes: “De forma comparable a Ethereum, la red TRON distingue también entre cuentas de propiedad externa (External Owned Accounts, EOA), cuyas operaciones se autorizan mediante firmas de claves habilitadas —actúa enviando transacciones firmadas conforme a sus permisos, y se genera inicialmente a partir de una clave, aunque después pueden cambiarse sus firmantes autorizados— y cuentas de contrato, asociadas a un programa desplegado en TRON, que ejecuta código cuando recibe una llamada durante una transac”"},{"n":9135,"m":7,"q":"Circle anunció el cese de la emisión de USDC en TRON en…","o":["Febrero de 2025","2018","2017","Febrero de 2024"],"a":3,"e":"Según los apuntes: “Una precisión importante sobre USDC: históricamente esta stablecoin estuvo en ambas redes, pero su emisor, Circle, anunció en febrero de 2024 el cese de su emisión en TRON, manteniendo de forma temporal los servicios de transferencia y reembolso hasta febrero de 2025.”"},{"n":9136,"m":7,"q":"En TRON, el recurso «Bandwidth» está relacionado con…","o":["La ejecución de instrucciones de un contrato","El número de superrepresentantes","El tamaño de la transacción en bytes","El precio del dólar"],"a":2,"e":"Según los apuntes: “Para enviar una operación o interactuar con un contrato se pagan comisiones en TRX, calculadas a partir de dos recursos principales: (1) Bandwidth, relacionado con el tamaño de la transacción en bytes; una transferencia sencilla de TRX solo consume Bandwidth, no Energy, porque no ejecuta ningún contrato de usuario. (2) Energy, relacionado con la ejecución de contratos: depende principalmente del trabajo realizado al ejecutar el contrato (cantidad de instrucciones, variaciones de estado o datos q”"},{"n":9137,"m":7,"q":"El recurso «Energy» en TRON se consume principalmente al…","o":["Enviar una simple transferencia de TRX","Ejecutar un contrato inteligente (p. ej., una transferencia de un token TRC-20)","Consultar el saldo de una dirección","Generar una nueva dirección"],"a":1,"e":"Según los apuntes: “Para enviar una operación o interactuar con un contrato se pagan comisiones en TRX, calculadas a partir de dos recursos principales: (1) Bandwidth, relacionado con el tamaño de la transacción en bytes; una transferencia sencilla de TRX solo consume Bandwidth, no Energy, porque no ejecuta ningún contrato de usuario. (2) Energy, relacionado con la ejecución de contratos: depende principalmente del trabajo realizado al ejecutar el contrato (cantidad de instrucciones, variaciones de estado o datos q”"},{"n":9138,"m":7,"q":"Las direcciones de TRON en formato Base58Check…","o":["Tienen 34 caracteres y comienzan por «T»","Tienen 42 caracteres y comienzan por «0x»","Comienzan siempre por «1» o «3»","Varían según el tipo de activo que contienen"],"a":0,"e":"Según los apuntes: “En wallets y exploradores, las direcciones de la red TRON suelen aparecer en formato Base58Check: 34 caracteres, y comienzan por «T» (tanto para EOA como para contratos).”"},{"n":9139,"m":7,"q":"Para distinguir una EOA de un contrato en Tronscan.org hay que…","o":["Contar el número de caracteres de la dirección","Mirar el color de la dirección","Preguntar directamente a Justin Sun","Comprobar la clasificación de la dirección (Account/Contract) y si presenta información de contrato"],"a":3,"e":"Según los apuntes: “Para distinguir una EOA de un contrato, en un explorador como TRONSCAN.ORG debe comprobarse la clasificación de la dirección (si aparece etiquetada como «Account» o como «Contract») y si presenta información de contrato.”"},{"n":9140,"m":7,"q":"El contrato «Bridgers» (bridgers.xyz) citado en el temario sirve para…","o":["Minar bloques de TRON","Generar frases semilla","Puentear criptoactivos entre distintas blockchains, como Ethereum y TRON","Calcular comisiones de Bitcoin"],"a":2,"e":"Según los apuntes: “El temario desarrolla un caso práctico de interoperabilidad entre TRON y Ethereum usando el contrato llamado «Bridgers», accesible en bridgers.xyz, cuya dirección de contrato puede consultarse tanto en Etherscan.io (en la red Ethereum) como en Tronscan.org (en la red TRON), y que en ambos exploradores redirige a la misma web oficial del servicio.”"},{"n":9141,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Una criptomoneda es», ¿qué opción coincide con el contenido del temario?","o":["Dinero físico respaldado por un banco central","Un activo digital que usa cifrado criptográfico para garantizar su titularidad y controlar la creación de unidades","Una acción cotizada","Una tarjeta de pago"],"a":1,"e":"Según los apuntes: “Una criptomoneda es un activo digital que emplea un cifrado criptográfico para garantizar su titularidad, asegurar la integridad de las transacciones y controlar la creación de unidades adicionales, es decir, evitar que alguien pueda copiarlas como se haría con una foto.”"},{"n":9142,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Las criptomonedas se almacenan en», ¿qué opción coincide con el contenido del temario?","o":["Una cartera digital","Una caja fuerte del emisor","El banco central","Un servidor único de la empresa emisora"],"a":0,"e":"Según los apuntes: “No existen de forma física: se almacenan en una cartera digital. No están respaldadas por un banco central que asegure su valor; su precio varía en función de la oferta y la demanda, no es obligatorio aceptarlas como medio de pago y no son una unidad de cuenta estable, por lo que no compiten con el dinero oficial.”"},{"n":9143,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «La clave privada de Bitcoin es», ¿qué opción coincide con el contenido del temario?","o":["Una clave pública derivada de la dirección","Un hash de 80 bytes","Un código de 12 palabras públicas","Un número aleatorio de 256 bits que debe mantenerse secreto"],"a":3,"e":"Según los apuntes: “La clave privada es un número aleatorio de 256 bits que debe mantenerse en secreto: quien la posee controla los fondos. Existen 2^256 claves posibles (~10^77).”"},{"n":9144,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «La definición técnica de criptoactivo incluye», ¿qué opción coincide con el contenido del temario?","o":["Emisión por un banco central","Intermediación bancaria obligatoria","Red descentralizada, criptografía, transferencia P2P y libro mayor distribuido","Soporte físico"],"a":2,"e":"Según los apuntes: “Un criptoactivo admite una definición técnica: existe en una red descentralizada, utiliza criptografía para su seguridad, se transfiere entre pares (P2P) y se registra en un libro mayor distribuido.”"},{"n":9145,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Un token se diferencia de una criptomoneda en que», ¿qué opción coincide con el contenido del temario?","o":["Es siempre el activo nativo de su red","Se emite sobre una blockchain ya existente (ej. USDT)","No usa criptografía","No puede transferirse"],"a":1,"e":"Según los apuntes: “Conviene distinguir: criptomoneda es el token nativo de su propia blockchain (por ejemplo BTC o ETH); token es un activo digital emitido sobre una blockchain ya existente (por ejemplo USDT); criptoactivo es el término genérico y jurídico que engloba ambos.”"},{"n":9146,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «¿En qué año se publicó el whitepaper de Bitcoin», ¿qué opción coincide con el contenido del temario?","o":["2008","2009","2011","2015"],"a":0,"e":"Según los apuntes: “Los hitos fundamentales son: 2008, publicación del whitepaper de Bitcoin por Satoshi Nakamoto; 2009, bloque génesis y nacimiento de la red; 2011, Litecoin, primer gran «altcoin»; 2014, colapso de Mt.”"},{"n":9147,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Un soft fork es un cambio», ¿qué opción coincide con el contenido del temario?","o":["Que crea siempre una nueva moneda","Que elimina la prueba de trabajo","Que reinicia la cadena","Compatible hacia atrás (ej. SegWit, 2017)"],"a":3,"e":"Según los apuntes: “El soft fork es un cambio compatible hacia atrás: los nodos antiguos siguen aceptando bloques nuevos (ejemplo: SegWit, 2017). El hard fork rompe la compatibilidad y puede generar una nueva cadena (ejemplo: Bitcoin Cash, 2017).”"},{"n":9148,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Las frases semilla BIP-39 utilizan una lista de», ¿qué opción coincide con el contenido del temario?","o":["1.024 palabras","256 palabras","2.048 palabras","4.096 palabras"],"a":2,"e":"Según los apuntes: “Las frases semilla (BIP-39) son secuencias de 12 a 24 palabras tomadas de una lista estandarizada de 2.048 palabras. Representan la clave maestra de la wallet, permiten recuperar todos los fondos y son portables entre wallets.”"},{"n":9149,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «El mempool es», ¿qué opción coincide con el contenido del temario?","o":["El conjunto de bloques ya minados","La memoria de transacciones pendientes de confirmar","El registro de claves privadas","La red de mineros"],"a":1,"e":"Según los apuntes: “El mempool es la «sala de espera» o memoria de transacciones pendientes. Los nodos validan la firma y los fondos disponibles, y si es válida la añaden a su mempool; los mineros seleccionan por comisión (a mayor comisión, más rápida la confirmación).”"},{"n":9150,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Se dice que los criptoactivos son pseudoanónimos porque», ¿qué opción coincide con el contenido del temario?","o":["Son anónimos pero con un registro público","Son totalmente privados","Requieren identificación bancaria","No dejan rastro"],"a":0,"e":"Según los apuntes: “Los criptoactivos son descentralizados, seguros (gracias a la criptografía asimétrica), pseudoanónimos (anónimos pero con un registro público) y funcionan sin intermediarios ni autoridad de control.”"},{"n":9151,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Ejemplos de stablecoins son», ¿qué opción coincide con el contenido del temario?","o":["BTC, LTC y BCH","ETH, SOL y ADA","XMR y ZEC","USDT, USDC y DAI"],"a":3,"e":"Según los apuntes: “SHA-256 es la base matemática de Bitcoin. Sus propiedades son: determinista (misma entrada, misma salida), rápida de calcular, resistente a la preimagen, resistente a colisiones y con efecto avalancha (el cambio de 1 bit altera totalmente el resultado).”"},{"n":9152,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Los ART (MiCA) están referenciados a», ¿qué opción coincide con el contenido del temario?","o":["Una única moneda fiat","Nada, sin respaldo","Una cesta de activos (divisas, materias primas)","El precio de Bitcoin"],"a":2,"e":"Según los apuntes: “Bajo el Reglamento (UE) 2023/1114 (MiCA) la clasificación legal distingue: ART (Asset-Referenced Tokens, valor estable referenciado a una cesta de activos: divisas, materias primas), EMT (E-Money Tokens, valor estable referenciado a una única moneda fiat) y otros criptoactivos (criptomonedas, tokens de gobernanza y de utilidad).”"},{"n":9153,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Los EMT (MiCA) están referenciados a», ¿qué opción coincide con el contenido del temario?","o":["Una cesta de activos","Una única moneda fiat","Materias primas","Otros criptoactivos"],"a":1,"e":"Según los apuntes: “Bajo el Reglamento (UE) 2023/1114 (MiCA) la clasificación legal distingue: ART (Asset-Referenced Tokens, valor estable referenciado a una cesta de activos: divisas, materias primas), EMT (E-Money Tokens, valor estable referenciado a una única moneda fiat) y otros criptoactivos (criptomonedas, tokens de gobernanza y de utilidad).”"},{"n":9154,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Un nodo podado», ¿qué opción coincide con el contenido del temario?","o":["Valida todo pero elimina datos antiguos para ahorrar espacio","Solo verifica cabeceras","No valida transacciones","Almacena dos copias de la cadena"],"a":0,"e":"Según los apuntes: “Sus propiedades son: descentralización (sin servidor central, réplica en múltiples nodos), inmutabilidad (los datos confirmados no pueden modificarse), transparencia (cualquiera puede consultar el registro completo) y verificabilidad (cada participante valida de forma independiente).”"},{"n":9155,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «El encabezado de un bloque incluye», ¿qué opción coincide con el contenido del temario?","o":["Solo las transacciones","La clave privada del minero","La frase semilla","Versión, hash anterior, raíz de Merkle, timestamp, bits y nonce"],"a":3,"e":"Según los apuntes: “El encabezado ocupa 80 bytes e incluye: versión del software, hash del bloque anterior (el enlace que forma la cadena), raíz de Merkle (hash de todas las transacciones), timestamp, bits (objetivo de dificultad) y nonce (valor ajustable por el minero).”"},{"n":9156,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «La transacción COINBASE», ¿qué opción coincide con el contenido del temario?","o":["Es la primera transacción de un usuario","Paga las comisiones al exchange","Crea nuevos BTC y la recompensa del minero, sin entradas","Une dos bloques"],"a":2,"e":"Según los apuntes: “La primera transacción de cada bloque es la COINBASE, que crea nuevos BTC y la recompensa del minero; no tiene entradas y es la única forma de crear nuevos bitcoins.”"},{"n":9157,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «La salida de SHA-256 es de», ¿qué opción coincide con el contenido del temario?","o":["128 bits","256 bits (64 caracteres hexadecimales)","80 bytes","512 bits"],"a":1,"e":"Según los apuntes: “Su salida es de 256 bits (64 caracteres hexadecimales); fue desarrollada por la NSA; Bitcoin usa doble SHA-256 en el encabezado y la emplea en minería, árbol de Merkle, direcciones y prueba de trabajo.”"},{"n":9158,"m":1,"q":"Pregunta de refuerzo del documento base: respecto a «Un nodo ligero (SPV)», ¿qué opción coincide con el contenido del temario?","o":["Solo verifica cabeceras y confía en nodos completos","Almacena toda la cadena","Mina bloques","Emite criptoactivos"],"a":0,"e":"Según los apuntes: “SHA-256 es la base matemática de Bitcoin. Sus propiedades son: determinista (misma entrada, misma salida), rápida de calcular, resistente a la preimagen, resistente a colisiones y con efecto avalancha (el cambio de 1 bit altera totalmente el resultado).”"},{"n":9159,"m":1
