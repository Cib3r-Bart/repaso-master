<title>Test de práctica · Ciberdelincuencia y Ciberinteligencia</title>
<style>
:root{
  --bg:#f6f7fb;--sf:#ffffff;--tx:#14182b;--mu:#565d7c;--bd:#d9deee;--ac:#4338ca;--act:#ffffff;--ok:#166534;--okb:#dcfce7;--ko:#991b1b;--kob:#fee2e2;--sel:#e0e7ff;
  --glow-1:rgba(255,255,255,.9);--glow-2:rgba(255,255,255,.85);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1030;--sf:#16204a;--tx:#e8ecff;--mu:#aab4e8;--bd:#2c386b;--ac:#818cf8;--act:#0b1030;--ok:#86efac;--okb:#123a22;--ko:#fca5a5;--kob:#4a1822;--sel:#26316a;
    --glow-1:rgba(30,41,89,.4);--glow-2:rgba(45,26,60,.4);
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0b1030;--sf:#16204a;--tx:#e8ecff;--mu:#aab4e8;--bd:#2c386b;--ac:#818cf8;--act:#0b1030;--ok:#86efac;--okb:#123a22;--ko:#fca5a5;--kob:#4a1822;--sel:#26316a;
  --glow-1:rgba(30,41,89,.4);--glow-2:rgba(45,26,60,.4);
  color-scheme:dark
}

body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(8px);opacity:.48;pointer-events:none}
body::before{width:360px;height:360px;left:-110px;top:-90px;background:radial-gradient(circle at 35% 35%,var(--glow-1),rgba(196,181,253,.35) 46%,transparent 72%)}
body::after{width:440px;height:440px;right:-150px;bottom:-150px;background:radial-gradient(circle at 45% 45%,var(--glow-2),rgba(251,207,232,.30) 48%,transparent 73%)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 4px;line-height:1.2}h2{font-size:18px;margin:0 0 12px}
.mu{color:var(--mu)}.small{font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0 8px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;font-size:14px;color:var(--mu)}
.stat b{display:block;font-size:26px;color:var(--tx)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
label.ch{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;min-height:44px;flex:1 1 230px}
label.ch:has(input:checked){border-color:var(--ac);background:var(--sel)}
input{accent-color:var(--ac);width:18px;height:18px;margin-top:3px;flex:none}
select{font:inherit;font-weight:600;font-size:17px;padding:10px 44px 10px 14px;border-radius:12px;border:2px solid var(--ac);color:var(--tx);min-height:48px;min-width:220px;cursor:pointer;appearance:none;-webkit-appearance:none;background-color:var(--sf);background-image:linear-gradient(45deg,transparent 50%,var(--ac) 50%),linear-gradient(135deg,var(--ac) 50%,transparent 50%);background-position:calc(100% - 24px) 50%,calc(100% - 17px) 50%;background-size:8px 8px,8px 8px;background-repeat:no-repeat;margin-top:6px}
option{background:var(--sf);color:var(--tx)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--act);border:2px solid var(--ac);border-radius:12px;padding:10px 20px;font-weight:600;min-height:44px}
.btn.sec{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{font-size:20px;line-height:1.45;margin:8px 0 16px;font-weight:600}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--sf);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px;min-height:44px}
.opt b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt:disabled{cursor:default}
.opt.sel{border-color:var(--ac);background:var(--sel)}
.opt.ok,.ro.ok{border-color:var(--ok);background:var(--okb)}.opt.ko,.ro.ko{border-color:var(--ko);background:var(--kob)}
.fb{border-radius:14px;padding:14px;margin:6px 0 14px}.fb.good{background:var(--okb)}.fb.bad{background:var(--kob)}
.fb.good strong{color:var(--ok)}.fb.bad strong{color:var(--ko)}
.srcnote{display:block;margin-top:8px;padding-top:7px;border-top:1px solid color-mix(in srgb,var(--bd) 72%,transparent);font-size:13px;line-height:1.45;color:var(--mu);font-weight:400}
.srcnote b{font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--tx)}
.reviewnote{font-size:13px;line-height:1.45;color:var(--mu);margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.nv{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.nv.an{background:var(--sel);border-color:var(--ac)}.nv.cur{outline:3px solid var(--ac)}
.sb{display:flex;align-items:center;gap:10px;margin:12px 0 2px}.sb span{font-size:20px;font-weight:700;min-width:2ch}.sb .g{color:var(--ok)}.sb .r{color:var(--ko);text-align:right}
.sbt{flex:1;height:16px;background:var(--bd);border-radius:99px;overflow:hidden;display:flex;justify-content:space-between}.sbt i{display:block;height:100%}.sg{background:var(--ok)}.sr{background:var(--ko)}
.sbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:8px}
.score{text-align:center}.score .big{font-size:56px;font-weight:700;line-height:1.1}
.ro{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);margin:6px 0}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.ko{background:var(--kob);color:var(--ko)}
.banktabs{display:flex;gap:10px;margin:10px 0 18px;flex-wrap:wrap}.banktab{color:#1f2937;border:0;border-radius:14px;padding:10px 20px;font-weight:800;min-height:46px;box-shadow:0 7px 18px rgba(30,41,59,.12),inset 0 1px 0 rgba(255,255,255,.75);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}.banktab:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(30,41,59,.16),inset 0 1px 0 rgba(255,255,255,.8)}.banktab[data-act="asig01"]{background:linear-gradient(145deg,#dbeafe,#c4b5fd)}.banktab[data-act="asig08"]{background:linear-gradient(145deg,#fde7d7,#fbcfe8)}.banktab[data-act="asig09"]{background:linear-gradient(145deg,#d9f7ec,#c8e9ff)}.banktab.active{outline:3px solid rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(30,41,59,.20),0 0 0 2px var(--ac),inset 0 1px 0 #fff;transform:translateY(-1px)}
body{min-height:100vh;background-attachment:fixed;transition:background .25s ease}
body[data-bank="asig01"]{--ac:#5b5bd6;--sel:#e8e7ff;--bd:#d9daf3;background:linear-gradient(145deg,#f6f8ff 0%,#eef2ff 48%,#f7f3ff 100%)}body[data-bank="asig08"]{--ac:#c76779;--sel:#fdecef;--bd:#efd9df;background:linear-gradient(145deg,#fff8f2 0%,#fdf1f5 52%,#f3f8ff 100%)}
body[data-bank="asig09"]{--ac:#2b8a7e;--sel:#e1f7f2;--bd:#cdebe5;background:linear-gradient(145deg,#f3fffb 0%,#eefbff 50%,#f7f5ff 100%)}.card,.stat{box-shadow:0 10px 30px rgba(40,50,85,.08),inset 0 1px 0 rgba(255,255,255,.75);backdrop-filter:blur(8px)}.btn{box-shadow:0 6px 14px rgba(67,56,202,.18);transition:transform .16s ease,box-shadow .16s ease}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 18px rgba(67,56,202,.22)}
/* Modo Oscuro (Adaptación de degradados y contrastes para data-bank) */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body[data-bank="asig01"]{--ac:#818cf8;--sel:#26316a;--bd:#2c386b;background:linear-gradient(145deg,#0b1030 0%,#151b42 48%,#1e1b4b 100%)}
  :root:not([data-theme="light"]) body[data-bank="asig08"]{--ac:#f472b6;--sel:#4a1828;--bd:#4c2434;background:linear-gradient(145deg,#1f0b16 0%,#281120 52%,#141028 100%)}
  :root:not([data-theme="light"]) body[data-bank="asig09"]{--ac:#2dd4bf;--sel:#134e4a;--bd:#1b4e46;background:linear-gradient(145deg,#051e1a 0%,#092829 50%,#101530 100%)}
}
:root[data-theme="dark"] body[data-bank="asig01"]{--ac:#818cf8;--sel:#26316a;--bd:#2c386b;background:linear-gradient(145deg,#0b1030 0%,#151b42 48%,#1e1b4b 100%)}
:root[data-theme="dark"] body[data-bank="asig08"]{--ac:#f472b6;--sel:#4a1828;--bd:#4c2434;background:linear-gradient(145deg,#1f0b16 0%,#281120 52%,#141028 100%)}
:root[data-theme="dark"] body[data-bank="asig09"]{--ac:#2dd4bf;--sel:#134e4a;--bd:#1b4e46;background:linear-gradient(145deg,#051e1a 0%,#092829 50%,#101530 100%)}
</style></head>
<body><main id="app"></main>
<script>
const D={"mods":["Módulo 1: Fundamentos de Ciberdelincuencia y Derecho Penológico","Módulo 2: Ciberinteligencia, Ciclo de Inteligencia y Fuentes","Módulo 3: Forense Digital, Evidencia Digital y Cadena de Custodia","Módulo 4: Vectores de Ataque, Malware y Ciberoperaciones","Módulo 5: Marco Regulatorio, Normativa y Cooperación Internacional","Módulo 6: Ampliación de Ciberinteligencia y Operaciones Ciber","Módulo 7: Profundización Técnica y Normativa Compliance","Módulo 8: Evaluación Avanzada y Casos Prácticos","Módulo 9: Banco Consolidado y Revisiones de Examen (101-168)"],"q":[{"n":1,"m":0,"q":"En el marco del Convenio de Budapest sobre la Ciberdelincuencia, ¿cuál de las siguientes conductas se tipifica como un delito contra la confidencialidad, la integridad y la disponibilidad de los datos y sistemas informáticos?","o":["La distribución de pornografía infantil a través de redes informáticas.","El acceso ilícito a todo o parte de un sistema informático sin autorización.","La infracción de los derechos de autor mediante redes P2P.","El fraude informático destinado a obtener un beneficio económico."],"a":1,"e":"El Convenio de Budapest clasifica en su primer bloque de delitos funcionales los ataques directos a la confidencialidad, integridad y disponibilidad, situando el acceso ilícito (hacking) como la figura típica fundamental."},{"n":2,"m":0,"q":"¿Qué diferencia sustancial existe entre el concepto jurídico de “ciberdelito en sentido estricto” y “ciberdelito en sentido amplio”?","o":["El sentido estricto abarca cualquier delito donde se use un teléfono inteligente, mientras que el amplio requiere el uso de servidores dedicados.","El sentido estricto se refiere a conductas donde la tecnología es el objeto del ataque; el sentido amplio engloba delitos tradicionales cometidos a través de medios informáticos.","El sentido estricto solo aplica a empresas del sector público y el amplio a entidades privadas.","No existe diferencia conceptual en el marco del Código Penal procesal."],"a":1,"e":"La doctrina penal distingue entre delitos informáticos puros (objeto/fin: el sistema) y delitos informatizados (medio: uso de TIC para cometer fraudes, calumnias o estafas habituales)."},{"n":3,"m":0,"q":"La Directiva (UE) 2013/40 relativa a los ataques contra los sistemas de información armoniza las sanciones y contempla como circunstancia agravante:","o":["El uso de lenguajes de programación de bajo nivel para la compilación del código malicioso.","Que el ataque haya sido cometido en fin de semana o día festivo.","Que el delito haya sido cometido en el marco de una organización criminal o haya afectado a infraestructuras críticas.","La publicación posterior del exploit en foros de acceso público."],"a":2,"e":"La Directiva 2013/40/UE establece tipos cualificados con penas severas cuando la acción delictiva la ejecuta una organización criminal o paraliza servicios esenciales o infraestructuras críticas."},{"n":4,"m":0,"q":"¿Cuál de las siguientes afirmaciones describe con precisión el principio de territorialidad y sus excepciones en la persecución de la ciberdelincuencia internacional?","o":["Los Estados solo pueden investigar delitos cuyos servidores físicos se encuentren estrictamente dentro de sus fronteras terrestres.","La extraterritorialidad permite a un Estado ejercer jurisdicción si el delito produce efectos sustanciales en su territorio o afecta a sus nacionales, según el principio de protección o personalidad.","La cibernética elimina todas las fronteras, por lo que cualquier juez local posee jurisdicción universal automática sobre cualquier servidor global.","La jurisdicción se determina de forma exclusiva por la sede fiscal del Proveedor de Servicios de Internet (ISP)."],"a":1,"e":"Dada la ubicuidad de la red, el principio de territorialidad se amplía mediante los principios de efectos, protección y personalidad pasiva para evitar la impunidad transfronteriza."},{"n":5,"m":0,"q":"En el contexto de la tipificación del malware, la creación y difusión de ransomware se subsume principalmente bajo la figura de:","o":["Violación de secretos empresariales únicamente.","Sabotaje informático y extorsión.","Delito contra la propiedad intelectual sin contenido económico.","Interceptación ilícita pasiva de telecomunicaciones."],"a":1,"e":"El ransomware altera/bloquea el acceso a los datos del sistema (daño/sabotaje informático) y exige un rescate bajo amenaza de pérdida o divulgación (extorsión)."},{"n":6,"m":0,"q":"¿Qué se entiende por “jurisdicción de conveniencia” o “bulletproof hosting” en el ámbito de la ciberdelincuencia?","o":["Proveedores de hosting que aplican estándares de ciberseguridad militares de forma gratuita.","Infraestructuras ubicadas en países con legislación laxa o nula cooperación policial que ignoran deliberadamente las solicitudes de retirada de contenido ilícito.","Servidores dedicados exclusivamente a la administración pública estatal.","Sistemas de almacenamiento en la nube con triple copia de seguridad redundante."],"a":1,"e":"Los servicios de bulletproof hosting operan en marcos normativos permisivos o no cooperativos, garantizando persistencia a los actores maliciosos frente a requerimientos de judiciales."},{"n":7,"m":0,"q":"Según el Código Penal español, la interceptación de transmisiones no públicas de datos informáticos realizada sin autorización mediante instrumentos técnicos se tipifica como:","o":["Descodificación analógica no autorizada.","Delito contra la intimidad y revelación de secretos (art. 197 bis 2).","Hurtos de patrimonio intangible.","Infracción administrativa leve de telecomunicaciones."],"a":1,"e":"La interceptación de datos en tránsito sin derecho forma parte de la protección de la intimidad digital regulada en el tipo del artículo 197 bis del Código Penal."},{"n":8,"m":0,"q":"El delito de “pharming” se diferencia técnicamente del “phishing” convencional en que:","o":["El pharming requiere que la víctima abra manualmente un archivo PDF adjunto.","El pharming redirige el tráfico web mediante la alteración del archivo hosts o el envenenamiento de caché DNS, sin requerir un engaño previo en el enlace.","El phishing utiliza únicamente llamadas telefónicas y el pharming utiliza SMS.","El pharming solo afecta a dispositivos móviles con sistema operativo Android."],"a":1,"e":"Mientras el phishing confía en la manipulación social para que el usuario haga clic en un enlace falso, el pharming manipula la resolución de nombres (DNS/hosts) para desviar la navegación legítima de forma transparente."},{"n":9,"m":0,"q":"La preservación rápida de datos informáticos almacenados (art. 16 del Convenio de Budapest) implica:","o":["La incautación física inmediata de todos los discos duros del proveedor de servicios.","La obligación de requerir a un proveedor la conservación cautelar de datos de tráfico o contenido específicos antes de cursar una solicitud formal de asistencia mutua.","El borrado permanente de los datos para evitar que los delincuentes los utilicen.","La publicación de los registros de conexión en el boletín oficial del Estado interviniente."],"a":1,"e":"La conservación rápida “congela” los datos volátiles en poder de los proveedores para evitar su eliminación durante el tiempo que tarda en tramitarse una orden judicial de entrega o auxilio internacional."},{"n":10,"m":0,"q":"En el Convenio de Budapest, la producción, venta, obtención para el uso, importación o distribución de dispositivos diseñados principalmente para cometer delitos informáticos se denomina:","o":["Abuso de dispositivos (art. 6).","Negligencia de infraestructura crítica.","Tráfico ilegal de hardware obsoleto.","Infracción de patentes de software."],"a":0,"e":"El artículo 6 sanciona los actos preparatorios y el tráfico de “herramientas de hacking” o malware diseñadas con el propósito primario de perpetrar ciberdelitos."},{"n":11,"m":0,"q":"¿Cuál es el papel fundamental de la red de contacto 24/7 establecida por el Convenio de Budapest?","o":["Proveer soporte técnico de microprocesadores a los juzgados de guardia.","Garantizar la asistencia inmediata para la investigación de delitos informáticos o la recolección de pruebas en tiempo real entre los Estados parte.","Monitorizar de forma automatizada las redes sociales de todos los ciudadanos de la Unión Europea.","Asignar direcciones IP públicas a las fuerzas de seguridad."],"a":1,"e":"La red 24/7 asegura la localización e intervención policial internacional instantánea para medidas urgentes de conservación e investigación de evidencias volátiles."},{"n":12,"m":0,"q":"La estafa informática (art. 248.2 del Código Penal español) se diferencia de la estafa tradicional porque:","o":["No requiere engaño a una persona física, sino la manipulación de datos o un artificio informático para conseguir una transferencia no consentida.","Solo se puede sancionar si el importe defraudado supera los 50.000 euros.","Requiere siempre el uso de tarjetas de crédito físicas clonadas en cajeros.","Exige que el autor esté físicamente dentro del domicilio de la víctima."],"a":0,"e":"El elemento sustitutivo del “engaño bastante” sobre una persona es la interferencia o manipulación del procesamiento automatizado de datos del sistema informático."},{"n":13,"m":0,"q":"¿Qué figura jurídica sanciona el acto de facilitar la clave de acceso a un servicio de streaming de pago a terceros sin autorización del prestador?","o":["Alta traición digital.","Delito contra los servicios de radiodifusión e interactivos prestados condicionalmente o de acceso condicional.","Falsificación de documento mercantil.","Infracción exclusiva del código de comercio marítimo."],"a":1,"e":"La elusión no autorizada de sistemas de acceso condicional a servicios de comunicación o televisión de pago está específicamente tipificada como delito contra el mercado y los consumidores."},{"n":14,"m":0,"q":"La suplantación de identidad (identity theft) en entornos digitales adquiere relevancia penal autónoma cuando:","o":["Se crea un perfil con el nombre de un personaje de ficción.","Se usurpa el estado civil de una persona real provocando una alteración continuada en sus derechos y vida cotidiana o cometiendo otros delitos en su nombre.","Se utiliza un avatar no representativo en un videojuego multijugador.","Se envía un correo electrónico utilizando un pseudónimo cómico."],"a":1,"e":"La usurpación de estado civil requiere la sustitución completa de la personalidad jurídica de la víctima para ejercer sus derechos o asumir obligaciones en su perjuicio."},{"n":15,"m":0,"q":"En el contexto penal, el concepto de “Sextorsión” se define como:","o":["La venta de material fotográfico autorizado en plataformas de suscripción.","La chantaje o coerción donde el agresor amenaza con divulgar imágenes o vídeos de contenido íntimo o sexual de la víctima si no cede a sus pretensiones.","La instalación de un troyano bancario en dispositivos de telecomunicación gubernamentales.","El envío masivo de correos no solicitados ofreciendo productos farmacéuticos."],"a":1,"e":"La sextorsión combina el delito de amenazas/extorsión con la vulneración de la intimidad a través de la coacción con material íntimo previamente obtenido."},{"n":16,"m":0,"q":"La figura de la “Grooming” o embaucamiento con fines sexuales de menores a través de las TIC se caracteriza por:","o":["Requerir siempre un contacto físico previo en el entorno escolar.","La realización de actos dirigidos a ganarse la confianza del menor mediante las TIC con la finalidad de solicitar material pornográfico u concertar encuentros sexuales.","Un fallo técnico en los filtros parentales de los navegadores web.","Un delito exclusivo de los administradores de redes sociales."],"a":1,"e":"El tipo penal castiga la conducta previa de acercamiento y embaucamiento del adulto hacia el menor a través de medios digitales para fines de abuso o explotación sexual."},{"n":17,"m":0,"q":"¿Qué implica el derecho al olvido digital reconocido en la jurisprudencia del Tribunal de Justicia de la UE (TJUE)?","o":["La obligación de las bibliotecas físicas de quemar periódicos antiguos.","El derecho de los ciudadanos a solicitar que los buscadores desindexen enlaces con información personal obsoleta, irrelevante o lesiva, bajo ciertas condiciones.","El borrado automático de las deudas bancarias al cabo de cinco años.","La prohibición absoluta de publicar noticias sobre personas públicas."],"a":1,"e":"Sentado en el caso Google Spain, otorga el derecho a restringir la difusión de datos personales en motores de búsqueda cuando prima la privacidad sobre el interés público."},{"n":18,"m":0,"q":"¿Qué diferencia un “Ataque cibernético de Denegación de Servicio Distribuido (DDoS)” de una simple sobrecarga orgánica de red?","o":["No existe diferencia técnica alguna; ambos son accidentes fortuitos.","En el DDoS hay una intencionalidad maliciosa de saturar los recursos del sistema mediante una red coordinada de equipos infectados (botnet).","La sobrecarga orgánica solo ocurre en redes locales y el DDoS en conexiones por satélite.","El DDoS utiliza únicamente protocolos de correo electrónico."],"a":1,"e":"El DDoS es un acto deliberado (tipificado como daño/sabotaje informático) mediante la instrumentación de múltiples orígenes para agotar el ancho de banda o la CPU del objetivo."},{"n":19,"m":0,"q":"El Reglamento eIDAS (UE 910/2014) regula:","o":["El precio máximo del kilo de fibra óptica en el territorio europeo.","La identificación electrónica y los servicios de confianza para las transacciones electrónicas en el mercado interior.","Las penas mínimas de prisión para los delitos de hacking en Europa.","Los protocolos de cifrado de la red de acceso militar NATO."],"a":1,"e":"eIDAS proporciona el marco normativo homogéneo para la firma electrónica, sellos de tiempo y certificados de autenticación de sitios web en la Unión Europea."},{"n":20,"m":0,"q":"¿Qué se entiende penalmente por “daños informáticos” (art. 264 del Código Penal español)?","o":["La rotura física de la pantalla de un ordenador de un golpe.","La alteración, borrado, deterioro, interrupción o supresión grave y no autorizada de datos o sistemas informáticos.","La devaluación en bolsa de una empresa de software.","La pérdida de la garantía de un equipo por la instalación de un sistema operativo alternativo."],"a":1,"e":"El bien jurídico protegido es la integridad de los datos intangibles y la funcionalidad operativa del software y los sistemas de procesamiento de datos."},{"n":21,"m":1,"q":"En el ciclo clásico de inteligencia, la fase donde se transforman los datos brutos recopilados en un formato estructurado y apto para el análisis se denomina:","o":["Dirección y Planificación.","Procesamiento y Procesado (Processing).","Difusión y Explotación.","Decisión Estratégica."],"a":1,"e":"El procesamiento traduce, filtra, clasifica y normaliza los datos brutos heterogéneos para que los analistas puedan evaluar su valor sustantivo en la fase de producción."},{"n":22,"m":1,"q":"¿Cuál es el orden secuencial correcto del Ciclo de Inteligencia tradicional?","o":["Difusión -> Análisis -> Recolección -> Planificación.","Planificación/Dirección -> Obtención/Recolección -> Procesamiento -> Análisis/Producción -> Difusión.","Análisis -> Procesamiento -> Difusión -> Obtención.","Recolección -> Difusión -> Planificación -> Análisis."],"a":1,"e":"El ciclo sigue una secuencia lógica e iterativa que comienza fijando objetivos (dirección) y concluye con la entrega del producto final al decisor (difusión)."},{"n":23,"m":1,"q":"Dentro de la disciplina de fuentes de inteligencia, ¿qué diferencia a OSINT (Open Source Intelligence) de la simple información pública en la web?","o":["OSINT solo utiliza información de redes gubernamentales clasificadas.","OSINT aplica un proceso sistemático de recolección, filtrado, evaluación crítica y análisis sobre datos de fuentes abiertas para responder a una necesidad de inteligencia específica.","OSINT implica siempre la compra ilícita de bases de datos robadas.","No hay diferencia; cualquier búsqueda en Google es formalmente OSINT."],"a":1,"e":"La diferencia radica en la metodología de inteligencia: la búsqueda casual recopila datos, mientras que OSINT transforma datos públicos dispersos en conocimiento accionable mediante el ciclo de inteligencia."},{"n":24,"m":1,"q":"¿Qué es SOCMINT (Social Media Intelligence)?","o":["Un protocolo informático para acelerar la carga de vídeos en plataformas de streaming.","La subdisciplina de inteligencia centrada en la obtención, monitorización y análisis de datos e interacciones en plataformas de redes sociales.","La venta de publicidad dirigida mediante inteligencia artificial.","El análisis exclusivo del tráfico de red en routers de switches Cisco."],"a":1,"e":"SOCMINT es una rama especializada de OSINT que examina perfiles, relaciones, contenidos y comportamientos en redes sociales de manera estructurada."},{"n":25,"m":1,"q":"En el contexto de HUMINT (Human Intelligence) aplicado al ciberespacio, la técnica de “Sociniering” o ingeniería social avanzada busca:","o":["Explotar vulnerabilidades de desbordamiento de búfer en el Kernel de Linux.","Manipular psicológicamente a personas clave para que revelen información confidencial o ejecuten acciones que comprometan la seguridad.","Optimizar la velocidad del bus de datos de un procesador.","Generar certificados SSL válidos mediante la colisión de funciones hash."],"a":1,"e":"HUMINT en ciberinteligencia se apoya en el factor humano, aprovechando sesgos cognitivos y vulnerabilidades psicológicas para acceder a entornos protegidos."},{"n":26,"m":1,"q":"¿Qué tipo de información busca recopilar la disciplina GEOINT (Geospatial Intelligence)?","o":["El código fuente de aplicaciones desarrolladas en lenguaje C++.","Datos visuales y métricos referenciados geográficamente, procedentes de imágenes de satélite, fotografías, sensores y mapas.","Listas de correos electrónicos corporativos filtrados en la Dark Web.","Transcripciones de llamadas de voz sobre IP (VoIP) encriptadas."],"a":1,"e":"GEOINT organiza y analiza información vinculada a la localización espacial y características físicas de la superficie terrestre."},{"n":27,"m":1,"q":"¿En qué consiste la técnica de “Google Dorking” o comandos de búsqueda avanzados?","o":["En alterar el registro del sistema operativo para saltarse la contraseña de administrador.","En utilizar operadores de búsqueda especiales en un motor de búsqueda para indexar información sensible o expuesta involuntariamente en servidores web.","En saturar los servidores de Google mediante peticiones simuladas.","En la instalación de una extensión maliciosa en el navegador del usuario."],"a":1,"e":"El Google Dorking aprovecha los parámetros de filtrado del propio buscador (filetype:, inurl:, site:) para revelar páginas o archivos expuestos sin la protección adecuada."},{"n":28,"m":1,"q":"¿Qué es un “DNIe” o “Certificado Digital” desde el punto de vista de la atribución e identidad en investigaciones digitales?","o":["Un archivo de texto ejecutable que contiene código malicioso.","Una credencial criptográfica emitida por una Autoridad de Certificación que vincula la identidad de una persona o entidad con un par de llaves públicas/privadas.","Un protocolo de enrutamiento para ocultar la dirección IP.","Una herramienta de denegación de servicio distribuido."],"a":1,"e":"Los certificados digitales garantizan el no repudio y la autenticidad plena en el marco de la infraestructura de clave pública (PKI)."},{"n":29,"m":1,"q":"En el análisis de amenazas, la matriz de evaluación de la fuente y la credibilidad de la información (sistema de la OTAN/STANAG) califica:","o":["La marca de la tarjeta gráfica y la velocidad del procesador utilizado.","La fiabilidad de la fuente (de la A a la F) y la verosimilitud de la información (del 1 al 6).","El coste económico de la herramienta OSINT contratada.","La antigüedad del nombre de dominio investigado."],"a":1,"e":"El estándar STANAG 2084 unifica la evaluación cualitativa independizando la confianza histórica en el informante/sensor de la coherencia lógica del dato concreto."},{"n":30,"m":1,"q":"La disciplina SIGINT (Signals Intelligence) se subdivide tradicionalmente en:","o":["OSINT y SOCMINT.","COMINT (Intelligence de Comunicaciones) y ELINT (Inteligencia Electrónica).","FININT y GEOINT.","TECHINT y HUMINT."],"a":1,"e":"SIGINT aborda la interceptación de señales electromagnéticas, dividiéndose en la intercepción de comunicaciones humanas (COMINT) y señales no comunicativas como radares (ELINT)."},{"n":31,"m":1,"q":"¿Qué información crucial puede aportar el análisis de los metadatos EXIF de una fotografía capturada con un dispositivo móvil?","o":["El número de cuenta bancaria del propietario del teléfono.","Coordenadas GPS de la toma, modelo de cámara, fecha, hora y parámetros de apertura/exposición.","La contraseña de la red Wi-Fi a la que estaba conectado el dispositivo.","El historial de navegación del usuario de las últimas 24 horas."],"a":1,"e":"Los datos EXIF incrustados en archivos de imagen conservan la telemetría del sensor físico y la ubicación espacial al momento de la captura."},{"n":32,"m":1,"q":"¿Qué es la “Surface Web” o Web de Superficie?","o":["El conjunto de contenidos indexables por los motores de búsqueda convencionales y accesibles sin configuración especial.","Las bases de datos privadas del Ministerio de Defensa.","Las páginas web a las que solo se accede mediante el navegador Tor.","Los servidores de almacenamiento físico no conectados a la red eléctrica."],"a":0,"e":"Representa la capa pública y rastreable por spiders/crawlers estándar de motores como Google o Bing."},{"n":33,"m":1,"q":"La “Deep Web” o Web Profunda engloba:","o":["Exclusivamente foros de venta de sustancias ilegales.","Páginas y contenidos no indexados por los motores de búsqueda estándar, como bases de datos bajo autenticación, intranets y correos corporativos.","Redes de fibra óptica sumergidas en los océanos.","Dispositivos de almacenamiento extraíbles infectados por malware."],"a":1,"e":"La Deep Web no es intrínsecamente ilegal; incluye todo contenido protegido por paywalls, formularios de acceso, firewalls o configuraciones de noindex."},{"n":34,"m":1,"q":"La “Dark Web” o Web Oscura se caracteriza técnicamente por:","o":["Ser accesible desde cualquier navegador estándar digitando “.dark” al final.","Estar alojada en supercomputadores del gobierno estadounidense.","Requerir software específico y protocolos cifrados de enrutamiento (como Tor o I2P) para superponer redes sobre la red pública (overlay networks) garantizando un alto anonimato.","Estar formada exclusivamente por páginas escritas en lenguaje ensamblador."],"a":2,"e":"La Dark Web utiliza capas de red superpuestas (Darknets) que encriptan el tráfico en múltiples saltos para ocultar las IP de origen y destino."},{"n":35,"m":1,"q":"En la red Tor, el mecanismo de “Enrutamiento Cebolla” (Onion Routing) protege el anonimato mediante:","o":["La duplicación de los datos en miles de discos duros simultáneamente.","El cifrado en capas de la información, descartando una capa en cada nodo intermedio sin que ninguno conozca simultáneamente el origen y el destino final.","El bloqueo absoluto de todas las imágenes y vídeos de la página visitada.","La desconexión del módem del usuario cada tres minutos."],"a":1,"e":"Cada nodo de la cadena Tor solo conoce la IP del salto anterior y del posterior, desvinculando la identidad de la fuente del destinatario final."},{"n":36,"m":1,"q":"¿Qué función cumple Shodan en el ecosistema de ciberinteligencia?","o":["Es un motor de búsqueda de dispositivos y sistemas conectados a Internet (servidores, cámaras, routers, SCADA) mediante el escaneo de sus puertos e intercalación de banners.","Es un cliente de correo electrónico cifrado fuera de línea.","Es una herramienta para eliminar páginas web de la memoria de Internet.","Es un foro exclusivo de compraventa de vulnerabilidades de día cero."],"a":0,"e":"Shodan no busca páginas HTML como Google; escanea activamente rangos de direcciones IP en busca de puertos abiertos y respuestas de servicios (banners)."},{"n":37,"m":1,"q":"¿Qué es la “Atribución” en el ámbito de la Ciberinteligencia de Amenazas (CTI)?","o":["El cálculo exacto del coste en euros de la reparación de un servidor.","El proceso analítico fundado en evidencias para asignar la responsabilidad de un ciberataque a un actor de amenaza, grupo u organización concreta (APT).","La instalación de actualizaciones de software de forma automática.","La compra de licencias antivirus para una corporación."],"a":1,"e":"La atribución relaciona TTPs, artefactos e indicadores de compromiso con grupos conocidos o patrocinados por estados para comprender la motivación y el autor del ataque."},{"n":38,"m":1,"q":"Los Indicadores de Compromiso (IoCs) son:","o":["Las facturas emitidas por una auditoría de ciberseguridad.","Artefactos forenses u observaciones técnicas (hashes de archivos, direcciones IP maliciosas, dominios de C2) que indican con alta probabilidad una intrusión previa en la red.","Manuales de usuario de aplicaciones informáticas.","Certificados de calidad ISO 27001 concedidos a una empresa."],"a":1,"e":"Un IoC es una pista o firma digital consumible por sistemas de defensa para detectar la presencia conocida de un adversario en la infraestructura."},{"n":39,"m":1,"q":"¿Qué define a una APT (Advanced Persistent Threat - Amenaza Persistente Avanzada)?","o":["Un usuario no experimentado que intenta adivinar contraseñas de forma aleatoria.","Un grupo de cibercriminales altamente cualificado, con amplios recursos y financiación (a menudo estatal), que busca mantener el acceso prolongado y no detectado a una red objetivo.","Un virus informático que destruye la BIOS del ordenador inmediatamente tras infectarlo.","Un programa de escaneo masivo de puertos sin objetivo fijo."],"a":1,"e":"Las APT destacan por su alto grado de sofisticación, motivación clara y capacidad de permanecer ocultos durante meses o años (persistencia) dentro del objetivo."},{"n":40,"m":1,"q":"El marco conceptual “MITRE ATT&CK” se utiliza fundamentalmente para:","o":["Clasificar los salarios de los analistas de seguridad en función de su experiencia.","Categorizar y describir las tácticas, técnicas y procedimientos (TTPs) utilizados por los atacantes en las distintas fases de un ciberataque.","Crear páginas web con animaciones tridimensionales.","Sustituir el uso de firewalls en redes corporativas."],"a":1,"e":"MITRE ATT&CK aporta un lenguaje estándar estructurado para mapear las acciones de un cibercriminal a lo largo de la cadena de ataque."},{"n":41,"m":2,"q":"En una investigación forense digital, el concepto de “Volatilidad de la Memoria” dicta que el analista debe recolectar la evidencia según el siguiente orden general:","o":["Discos duros mecánicos -> Memorias USB -> Registros impresos -> Memoria RAM.","Memoria RAM/Caché de CPU -> Registros de red -> Discos de estado sólido/Mecánicos -> Soportes ópticos/Cintas.","Copias de seguridad remotas -> Memoria RAM -> Servidores de DNS.","El orden es absolutamente irrelevante para el rigor forense."],"a":1,"e":"Los datos deben extraerse desde la fuente más efímera (que se pierde al apagar o cortar la alimentación) hacia los medios de almacenamiento persistentes."},{"n":42,"m":2,"q":"¿Qué finalidad tiene el cálculo del valor Hash (SHA-256, MD5) sobre la imagen forense de un disco duro?","o":["Aumentar la velocidad de transferencia de la copia forense.","Garantizar la integridad e inalterabilidad de la prueba digital demostrando que la copia es idéntica al original y no ha sido modificada.","Encriptar el disco para que los abogados defensores no tengan acceso al contenido.","Comprimir el archivo resultante para que ocupe menos espacio."],"a":1,"e":"Si el contenido del archivo fuente cambia un solo bit, la función hash criptográfica produce un resultado totalmente distinto, demostrando la integridad de la prueba."},{"n":43,"m":2,"q":"La “Cadena de Custodia” de un soporte digital es:","o":["El cable de acero que amarra los servidores al bastidor del rack.","El documento y proceso metódico que registra cronológicamente la extracción, custodia, control, transferencia, análisis y disposición final de la evidencia física y digital.","La lista de usuarios que poseen contraseña de administrador en un sistema Linux.","El proceso automático de actualización del sistema operativo."],"a":1,"e":"Garantiza la trazabilidad jurídica de la prueba digital desde su hallazgo hasta su presentación en el juicio, evitando sospechas de manipulación o contaminación."},{"n":44,"m":2,"q":"Durante la fase de adquisición forense de un disco duro en vivo o apagado, la utilización de un dispositivo “Write Blocker” (bloqueador de escritura) sirve para:","o":["Evitar que los virus ataquen el equipo de trabajo del perito.","Impedir físicamente o por software que el sistema operativo de análisis escriba o modifique cualquier dato en el dispositivo de almacenamiento investigado.","Acelerar el proceso de volcado de información a doble velocidad.","Formatear los sectores defectuosos del medio de prueba."],"a":1,"e":"Al conectar un medio a un OS sin bloqueador de escritura, se modifican fechas de acceso y metadatos; el hardware bloqueador garantiza un acceso exclusivamente de lectura."},{"n":45,"m":2,"q":"¿Qué es una “Imagen Forense Bit a Bit” (Raw/DD/E01)?","o":["Una captura de pantalla del escritorio del sistema sospechoso.","Una copia exacta sector por sector del dispositivo de almacenamiento, que incluye el espacio no asignado (unallocated space), áreas borradas y la tabla de particiones.","Un archivo PDF que resume los hallazgos del perito forense.","La exportación de la carpeta “Mis Documentos” mediante la opción copiar y pegar."],"a":1,"e":"La copia bit a bit no omite datos inactivos o borrados; replica la estructura física completa del medio de almacenamiento para permitir el posterior tallado de datos (carving)."},{"n":46,"m":2,"q":"En la ciencia forense digital, la técnica de “File Carving” consiste en:","o":["Destruir físicamente los platos magnéticos de un disco duro averiado.","Reconstruir y recuperar archivos eliminados basándose en sus firmas de cabecera (header) y pie (footer) sin recurrir a la tabla de archivos del sistema.","Cambiar la extensión de los archivos para que el sistema informático no los ejecute.","Ocultar texto dentro de una imagen digital mediante esteganografía."],"a":1,"e":"El carving escanea el espacio no asignado buscando patrones de cabecera/pie reconocibles de tipos de archivo (p. ej., \\xFF\\xD8\\xFF en JPEG) para recuperar datos sin metadatos del sistema de archivos."},{"n":47,"m":2,"q":"El análisis de la memoria RAM (Live Memory Forensics) es fundamental porque permite obtener:","o":["La marca de fabricación de la caja del ordenador.","Claves de cifrado en uso, conexiones de red activas, procesos ocultos, contraseñas en texto claro y código inyectado no guardado en disco.","El historial de impresiones en papel del año anterior.","La velocidad exacta del ventilador del procesador."],"a":1,"e":"Gran cantidad de malware y artefactos volátiles operan únicamente en memoria para eludir detecciones basadas en análisis en disco (fileless malware)."},{"n":48,"m":2,"q":"La norma ISO/IEC 27037 regula:","o":["El diseño ergonómico de los teclados para evitar lesiones laborales.","Las directrices para la identificación, recolección, adquisición y preservación de la evidencia digital.","La instalación de cables de alta tensión en centros de proceso de datos.","La venta de licencias de software comercial en entornos europeos."],"a":1,"e":"La norma ISO/IEC 27037 estandariza internacionalmente los protocolos de manipulación inicial de dispositivos y almacenamiento de evidencias informáticas."},{"n":49,"m":2,"q":"¿Qué es el “Slack Space” o espacio residual en un disco duro?","o":["El espacio libre entre el procesador y la memoria RAM.","El espacio no utilizado que queda dentro de un sector o clúster de disco asignado cuando el archivo guardado es más pequeño que el tamaño del propio clúster.","La memoria virtual gestionada por el navegador de internet.","El área reservada para la instalación del sistema BIOS."],"a":1,"e":"El espacio residual puede contener fragmentos de archivos antiguos o datos deliberadamente ocultos por un atacante, ya que el sistema de archivos no los sobrescribe completamente."},{"n":50,"m":2,"q":"La prueba pericial informática presentada en un procedimiento judicial requiere para su validez legal:","o":["Que haya sido elaborada con herramientas de software con licencias comerciales de más de 10.000 euros.","Claridad, objetividad, idoneidad técnica del perito, trazabilidad mediante cadena de custodia y la capacidad de reprodubilidad de los resultados por la contraparte.","Que el informe tenga una extensión mínima obligatoria de 500 páginas.","Que el perito trabaje de forma exclusiva en el cuerpo de la policía nacional."],"a":1,"e":"Toda prueba técnica se somete al principio de contradicción judicial, por lo que los hallazgos deben ser científicos, verificables y replicables por otros expertos."},{"n":51,"m":3,"q":"Un exploit de tipo “Zero-Day” (Día Cero) se caracteriza por:","o":["Ser un ataque que solo dura cero segundos en ejecutarse.","Aprovechar una vulnerabilidad en el software desconocida para el fabricante y para la cual aún no existe un parche de seguridad oficial.","Un código malicioso escrito el primer día del año natural.","Un programa defensivo que bloquea el 100% de las amenazas de internet."],"a":1,"e":"Al no existir parche defensivo ni firma antivirus previa, las vulnerabilidades de día cero representan un grave riesgo técnico."},{"n":52,"m":3,"q":"La técnica de ataque denominada “Man-in-the-Middle” (MitM) consiste en:","o":["Sobornar al administrador de redes de una gran empresa para obtener contraseñas.","Interceptar, modificar o inspeccionar en secreto las comunicaciones entre dos partes que creen estar comunicándose directamente.","Enviar correos electrónicos con enlaces maliciosos a tres ejecutivos a la vez.","Un fallo de hardware en la memoria caché del procesador."],"a":1,"e":"El atacante se sitúa en la trayectoria de red de las víctimas (mediante spoofing de ARP, DNS o falsificación SSL) vulnerando la confidencialidad e integridad del tráfico."},{"n":53,"m":3,"q":"Un “Rootkit” es un tipo de malware diseñado específicamente para:","o":["Mostrar publicidad emergente de manera abusiva en la pantalla.","Ocultar la presencia de procesos, archivos, conexiones o del propio malware dentro del sistema operativo concediendo acceso persistente con privilegios de nivel raíz o kernel.","Cifrar exclusivamente los documentos de Microsoft Excel.","Formatear la BIOS del sistema de manera irreversible."],"a":1,"e":"Los rootkits modifican las llamadas del propio Kernel o del sistema operativo para invisibilizarse frente a las herramientas tradicionales de auditoría y antivirus."},{"n":54,"m":3,"q":"El protocolo HTTPS protege el tráfico web combinando el protocolo HTTP tradicional con:","o":["El sistema de cortafuegos de Windows.","El cifrado de la capa de transporte mediante SSL/TLS.","La compresión de datos mediante algoritmos ZIP.","La asignación de IP fijas mediante el protocolo DHCP."],"a":1,"e":"SSL/TLS aporta cifrado de extremo a extremo, autenticación del servidor mediante certificados digitales e integridad de la transmisión de datos."},{"n":55,"m":3,"q":"En el contexto de las criptomonedas y la ciberdelincuencia, el “Cryptojacking” consiste en:","o":["El secuestro físico de servidores que procesan transacciones de Bitcoin.","El uso no autorizado de los recursos de procesamiento (CPU/GPU) de la víctima para minar criptomonedas de forma ilegítima.","La alteración del valor de cambio de una moneda digital mediante noticias falsas.","La clonación de tarjetas de crédito físicas en comercios locales."],"a":1,"e":"El cryptojacking utiliza scripts en la web o troyanos en segundo plano para aprovechar la energía y potencia de cómputo del sistema infectado en beneficio del atacante."},{"n":56,"m":3,"q":"Un ataque de “Inyección SQL” (SQLi) se aprovecha de:","o":["La falta de memoria RAM en el servidor de la base de datos.","La deficiente validación o saneamiento de las entradas de datos proporcionadas por el usuario en una aplicación web antes de ser procesadas por la base de datos.","Un fallo físico en los cables de red que conectan el servidor web.","El uso de contraseñas de menos de ocho caracteres por parte de los administradores."],"a":1,"e":"Al introducir código SQL dentro de campos de entrada no filtrados, el atacante altera la lógica de la consulta original para extraer, alterar o destruir registros."},{"n":57,"m":3,"q":"El ataque “Cross-Site Scripting” (XSS) permite a un cibercriminal:","o":["Ejecutar instrucciones directamente en el firmware del router principal.","Inyectar código malicioso (generalmente JavaScript) en una página web legítima para que se ejecute en el navegador de otros usuarios.","Apagar los servidores centrales de un proveedor de servicios en la nube.","Descifrar archivos RAR protegidos con contraseña mediante fuerza bruta."],"a":1,"e":"XSS explota la confianza del navegador del usuario en el sitio web visitado, permitiendo el robo de cookies de sesión, redirecciones maliciosas o robo de credenciales."},{"n":58,"m":3,"q":"Un programa malicioso clasificado como “Gusano” (Worm) se distingue de un “Virus” tradicional en que:","o":["El gusano requiere la acción explícita del usuario para propagarse.","El gusano tiene la capacidad de autoreplicarse y propagarse autónomamente a través de las redes sin necesidad de adjuntarse a un archivo anfitrión o intervención humana.","Los gusanos solo infectan teléfonos móviles y los virus solo ordenadores.","Un gusano es un dispositivo físico que se conecta al puerto USB."],"a":1,"e":"La diferencia operativa clave es la capacidad de propagación autónoma del gusano explotando vulnerabilidades de red, frente a la dependencia del virus de la interacción con archivos huéspedes."},{"n":59,"m":3,"q":"¿En qué consiste un ataque de “Credential Stuffing”?","o":["En enviar correos pidiendo amablemente a los usuarios sus claves de acceso.","En el uso automatizado de listas masivas de pares de usuario/contraseña filtrados previamente en otros sitios web para intentar acceder de forma no autorizada en servicios distintos.","En adivinar contraseñas probando fechas de nacimiento célebres.","En interceptar la señal Wi-Fi mediante una antena direccional."],"a":1,"e":"Explota el hábito extendido de reutilización de contraseñas por parte de los usuarios en múltiples plataformas en internet."},{"n":60,"m":3,"q":"La técnica de “Spear Phishing” es:","o":["El envío de spam masivo a millones de correos sin personalización alguna.","Un ataque de phishing altamente dirigido, personalizado y diseñado específicamente contra un individuo u organización concreta tras una fase previa de reconocimiento.","Un fraude cometido exclusivamente mediante mensajes de texto SMS.","La interceptación de llamadas telefónicas de la red fija."],"a":1,"e":"Utiliza datos recopilados (OSINT/HUMINT) sobre la víctima concreta para redactar un mensaje contextualizado que eleva drásticamente la tasa de éxito."},{"n":61,"m":4,"q":"El Reglamento General de Protección de Datos de la UE (RGPD 2016/679) establece la obligación de notificar las violaciones de seguridad de datos personales a la autoridad de control en un plazo máximo de:","o":["24 horas deseadas, ampliable a un mes.","72 horas desde que se tenga constancia de la incidencia, salvo que sea improbable que constituya un riesgo para los derechos de los interesados.","30 días hábiles exclusivamente.","No existe plazo legal fijado, basta con documentarlo internamente."],"a":1,"e":"El artículo 33 del RGPD exige a los responsables del tratamiento la notificación dentro de un marco estricto de 72 horas para mitigar posibles daños a los titulares de los datos."},{"n":62,"m":4,"q":"¿Qué figura exige el RGPD en ciertas organizaciones para supervisar de manera independiente el cumplimiento de las políticas de protección de datos personales?","o":["El Oficial Principal de Finanzas (CFO).","El Delegado de Protección de Datos (DPD / DPO).","El Administrador de Sistemas de Red.","El Perito Forense Externo."],"a":1,"e":"El DPO vela por la conformidad normativa y sirve de punto de contacto entre la entidad, la autoridad de control y los ciudadanos."},{"n":63,"m":4,"q":"La Directiva NIS2 (UE 2022/2555) amplía el ámbito de aplicación de la ciberseguridad europea con el objetivo de:","o":["Prohibir el uso de la Dark Web en toda la Unión Europea.","Elevar los niveles de ciberresiliencia, establecer requisitos homogéneos de seguridad e imponer sanciones severas a entidades esenciales e importantes en sectores críticos.","Obligar a todos los ciudadanos a utilizar ordenadores con software libre.","Crear una única red Wi-Fi comunitaria para todos los países miembros."],"a":1,"e":"NIS2 refuerza los estándares mínimos de seguridad de la información para la protección de cadenas de suministro, servicios esenciales e infraestructuras críticas."},{"n":64,"m":4,"q":"El Centro Criptológico Nacional (CCN-CERT) en España tiene como competencia principal:","o":["Investigar únicamente los fraudes bancarios en tarjetas de crédito particulares.","La gestión de ciberincidentes que afecten a los sistemas de las Administraciones Públicas y empresas de interés estratégico.","Regular las tarifas de internet de los operadores telefónicos.","Juzgar a los imputados por delitos cometidos en las redes sociales."],"a":1,"e":"El CCN-CERT, dependiente del CNI, es el CERT gubernamental encargado de velar por la seguridad de la información de las instituciones del Estado."},{"n":65,"m":4,"q":"¿Cuál es el papel clave de EUROPOL y su centro especializado EC3 (European Cybercrime Centre)?","o":["Detener físicamente a sospechosos en cualquier país sin mediación de las policías nacionales.","Prestar apoyo operativo, analítico y estratégico a las fuerzas policiales de los Estados miembros en la lucha contra la ciberdelincuencia transfronteriza.","Emitir títulos universitarios sobre peritaje informático.","Fabricar equipos informáticos seguros para la Unión Europea."],"a":1,"e":"El EC3 actúa como centro de inteligencia y coordinación técnica para desmantelar redes de ciberdelincuencia internacional operando de forma coordinada con la policía local."},{"n":66,"m":4,"q":"En el ámbito legal procesal, el principio de “Especialidad, Idoneidad, Excepcionalidad, Necesidad y Proporcionalidad” rige:","o":["La compra de ordenadores por las instituciones públicas.","La adopción de medidas judiciales tecnológicas de investigación (como capturas remota de datos o escuchas).","El tipo de fuente tipográfica a emplear en las demandas contenciosas.","La asignación de presupuestos a los proyectos de investigación académica."],"a":1,"e":"Las injerencias en derechos fundamentales (como la intimidad o el secreto de las comunicaciones) exigen un control estricto de proporcionalidad judicial."},{"n":67,"m":4,"q":"¿Qué es una “Comisión Rogatoria Internacional”?","o":["Una reunión anual entre directores de ciberseguridad corporativa.","Un instrumento formal de solicitud de auxilio judicial entre tribunales de diferentes países para la práctica de diligencias de prueba en un proceso penal.","Un software para escanear redes públicas en busca de virus.","Un acuerdo comercial para eximir de impuestos la venta de productos digitales."],"a":1,"e":"Es la vía del derecho internacional privado/penal para recabar evidencias situadas bajo la soberanía de un tercer país."},{"n":68,"m":4,"q":"El Esquema Nacional de Seguridad (ENS) de España es un marco aplicable a:","o":["Únicamente las empresas de comercio electrónico radicadas fuera de la Unión Europea.","El Sector Público y sus proveedores tecnológicos para garantizar la seguridad de los datos tratos y servicios prestados.","Las páginas web personales creadas por particulares sin fines de lucro.","Las consolas de videojuegos conectadas a la red doméstica."],"a":1,"e":"El ENS crea las condiciones necesarias de confianza en el uso de medios electrónicos regulando los principios básicos y requisitos mínimos del sector público."},{"n":69,"m":4,"q":"La “Prueba Ilícita” o doctrina del “Fruto del Árbol Envenenado” determina que:","o":["Las pruebas recopiladas en parques o zonas forestales no son admisibles en juicio.","Cualquier evidencia obtenida directamente o indirectamente con violación de derechos fundamentales es nula y carece de validez jurídica.","Todas las pruebas forenses deben guardarse en cajas de madera tratada.","Las copias forenses realizadas con programas sin licencia comercial deben ser destruidas."],"a":1,"e":"El ordenamiento procesal invalida las pruebas cuyo origen haya lesionado derechos fundamentales protegidos por la Constitución."},{"n":70,"m":4,"q":"¿Qué se entiende por “Atribución Político-Diplomática” de un ciberataque?","o":["La condena judicial firme redactada por un juez de instrucción penal.","La declaración pública e institucional formulada por un gobierno asignando formalmente la responsabilidad de un ataque a otro Estado o actor respaldado por él.","La sanción económica impuesta por un banco local a sus clientes infectados.","La desconexión preventiva de los cables de fibra óptica internacionales."],"a":1,"e":"A diferencia de la atribución forense pura, la diplomática trasciende lo técnico y se utiliza como herramienta de política exterior y disuasión geopolítica."},{"n":71,"m":5,"q":"En el contexto de OSINT, ¿qué herramienta de software libre se utiliza para realizar grafos de relaciones visuales entre entidades, dominios, IPs y personas?","o":["Microsoft Excel.","Maltego.","Notepad++.","Wireshark."],"a":1,"e":"Maltego es una herramienta orientada a la extracción y representación de enlaces entre entidades en investigaciones de fuentes abiertas."},{"n":72,"m":5,"q":"La técnica de investigación OSINT de “Reverse Image Search” (búsqueda inversa de imágenes) sirve para:","o":["Cambiar los colores de una imagen de RGB a escala de grises.","Identificar el origen de una fotografía, encontrar copias en la web o verificar su contexto de publicación original.","Aumentar automáticamente la resolución gráfica de una captura pixelada.","Convertir un archivo JPG a un documento de texto Word."],"a":1,"e":"Permite contrastar la veracidad de un contenido multimedia rastreando dónde y cuándo ha sido alojada previamente esa misma imagen en internet."},{"n":73,"m":5,"q":"¿Qué representa la red de anonimato “I2P” (Invisible Internet Project) en comparación con Tor?","o":["Una red orientada principalmente a la comunicación segura P2P dentro de su propia red oculta cifrada (eepsites).","Un navegador exclusivo para la compra de componentes de hardware informático.","Una herramienta corporativa de filtrado de datos para empleados en teletrabajo.","Un motor de búsqueda comercial competidor de Google."],"a":0,"e":"Mientras Tor facilita la salida anónima hacia la Surface Web, I2P está concebido como un ecosistema cerrado de servicios internos cifrados."},{"n":74,"m":5,"q":"En la recolección de inteligencia FININT (Financial Intelligence), la trazabilidad de transacciones en la blockchain de Bitcoin se realiza mediante:","o":["La solicitud judicial de apertura de la caja fuerte del minero de criptomonedas.","El análisis del libro mayor público y distribuido mediante técnicas de agrupación de direcciones (clustering) y trazado de grafos de transacciones.","El bloqueo inmediato del enrutador Wi-Fi de la entidad de cambio (exchange).","La interceptación de llamadas de voz telefónica entre los titulares de las billeteras."],"a":1,"e":"Las transacciones en blockchains públicas son pseudónimas pero transparentes, lo que permite reconstruir el flujo de fondos entre nodos o carteras."},{"n":75,"m":5,"q":"¿Qué es un “Honeypot” (tarro de miel) en la arquitectura de ciberseguridad y ciberinteligencia?","o":["Una base de datos que almacena únicamente contraseñas con cifrado débil.","Un sistema informático señuelo intencionadamente vulnerable para atraer, registrar y analizar la actividad de los atacantes.","Un software antivirus diseñado para bloquear correos no solicitados.","Un dispositivo que acelera el procesamiento de peticiones en servidores web."],"a":1,"e":"Los honeypots recopilan datos sobre tácticas, técnicas y vectores de ataque sin poner en riesgo los sistemas de producción reales."},{"n":76,"m":5,"q":"La metodología “Cyber Kill Chain” desarrollada por Lockheed Martin consta de cuántas fases estándar en su modelo clásico?","o":["3 fases.","7 fases.","12 fases.","2 fases."],"a":1,"e":"El modelo describe 7 pasos secuenciales: Reconocimiento, Armamentización, Entrega, Explotación, Instalación, Comando y Control (C2) y Acciones sobre los Objetivos."},{"n":77,"m":5,"q":"¿Qué función cumple el protocolo STIX/TAXII en el intercambio de ciberinteligencia?","o":["La descarga de películas en redes de distribución de pares.","La estandarización en el formato de datos de amenazas (STIX) y el protocolo de transporte seguro para su compartición (TAXII).","La asignación dinámica de nombres de dominio en la red profunda.","El formateo seguro de discos duros de alta capacidad."],"a":1,"e":"Permite el intercambio estructurado y automatizado de datos sobre ciberamenazas entre organizaciones y plataformas de inteligencia."},{"n":78,"m":5,"q":"En un análisis forense de tráfico de red, ¿qué herramienta de captura y análisis de paquetes es el estándar de facto en la industria?","o":["Adobe Reader.","Wireshark.","VLC Media Player.","CCleaner."],"a":1,"e":"Wireshark permite capturar e inspeccionar interactivamente el tráfico transmitido por una red a nivel de protocolo y paquete."},{"n":79,"m":5,"q":"¿Qué es un ataqué de “DNS Poisoning” o envenenamiento de la caché DNS?","o":["Introducir un elemento químico degradante dentro de los cables de datos.","Alterar las entradas en las tablas de resolución de nombres de un servidor DNS para redirigir a los usuarios a sitios web fraudulentos.","Desconectar los servidores de nombres mediante un corte de corriente eléctrica.","Borrar las imágenes guardadas en el disco duro del usuario."],"a":1,"e":"Modifica la dirección IP asociada a un dominio legítimo en la caché de resolución, dirigiendo al usuario a una infraestructura bajo el control del atacante."},{"n":80,"m":5,"q":"El principio de invalidez de la prueba por “Ruptura de la Cadena de Custodia” presupone que:","o":["El perito no entregó su informe pericial en formato papel impreso.","Se ha perdido la trazabilidad, custodia o integridad del objeto de prueba, imposibilitando garantizar que no ha sufrido alteraciones o sustituciones.","El dispositivo examinado tenía instaladas actualizaciones de software recientes.","La evidencia digital fue extraída en día festivo."],"a":1,"e":"Sin la continuidad probatoria documental e inalterable, no se puede certificar la autenticidad procesal del elemento tecnológico analizado."},{"n":81,"m":6,"q":"Un ataque de “Watering Hole” (Abrevadero) se diferencia de otras técnicas de distribución de malware en que:","o":["Se envía un troyano adjunto mediante un fax corporativo.","El atacante compromete un sitio web legítimo visitado frecuentemente por el grupo o sector de víctimas objetivo para infectarlas desde allí.","Consiste en inundar con agua el centro de procesamiento de datos de la víctima.","Infecta únicamente a dispositivos móviles que utilicen redes 3G."],"a":1,"e":"En lugar de perseguir directamente a la víctima, el atacante contamina el entorno web habitualmente frecuentado por el grupo seleccionado."},{"n":82,"m":6,"q":"¿Qué se entiende por “Fuerza Bruta” en el contexto del descifrado de contraseñas?","o":["El uso de un martillo mecánico para romper la unidad de disco duro.","El intento sistemático de todas las combinaciones posibles de caracteres hasta encontrar la clave correcta.","La interceptación de las señales electromagnéticas del monitor.","La compra de credenciales en un sitio web de subastas."],"a":1,"e":"Es un método exhaustivo sin apoyos heurísticos que prueba todo el espacio de claves posible para dar con la cadena exacta."},{"n":83,"m":6,"q":"En la arquitectura de seguridad de Windows, el registro “SAM” (Security Account Manager) almacena:","o":["Las fotos de perfil de los usuarios guardadas en el disco.","Los hashes de las contraseñas de los usuarios locales del sistema.","El historial de páginas visitadas en Microsoft Edge.","Las claves de activación del sistema operativo."],"a":1,"e":"La base de datos SAM guarda en un formato cifrado las credenciales y hashes NTLM/LM de los usuarios locales del equipo."},{"n":84,"m":6,"q":"El concepto de “Zero Trust” (Confianza Cero) en arquitectura de red se resume en la premisa:","o":["Confiar plenamente en cualquier dispositivo que esté dentro del perímetro del firewall.","Nunca confiar, verificar siempre la identidad y autenticar cada petición independientemente del origen de la conexión.","No instalar parches de seguridad en los servidores para evitar fallos.","Permitir el acceso anónimo a todos los recursos informáticos de la empresa."],"a":1,"e":"Elimina el concepto de red interna de confianza; todo usuario y dispositivo debe autenticarse, autorizarse y cifrarse de forma continua."},{"n":85,"m":6,"q":"La vulnerabilidad conocida como “Buffer Overflow” (Desbordamiento de Búfer) se produce cuando:","o":["Se llena la capacidad total del disco duro del servidor.","Un programa escribe más datos en un bloque de memoria de los que este puede contener, sobrescribiendo zonas contiguas y ejecutando potencialmente código arbitrario.","Se conectan demasiados monitores a una sola tarjeta gráfica.","El ancho de banda contratado con el proveedor es insuficiente."],"a":1,"e":"La falta de verificación de límites al escribir datos en la memoria permite alterar los punteros de ejecución del sistema."},{"n":86,"m":6,"q":"En el modelo OSINT, la herramienta “Wayback Machine” (Internet Archive) permite a un investigador:","o":["Predecir la dirección IP que usará un servidor dentro de cinco años.","Consultar versiones históricas archivadas de sitios web para ver contenidos o datos eliminaos o modificados con el tiempo.","Acceder a las carpetas privadas de los administradores de un dominio web.","Inhabilitar la conexión a internet de un objetivo determinado."],"a":1,"e":"Almacena instantáneas temporales de la web, permitiendo reconstruir contenidos borrados o expuestos en el pasado."},{"n":87,"m":6,"q":"¿Qué función tiene un certificado “SSL Wildcard”?","o":["Cifrar únicamente correos electrónicos con anexos pesados.","Proteger un dominio principal y un número ilimitado de sus subdominios de primer nivel (ej. *.ejemplo.com).","Permitir la navegación anónima en la red Tor.","Aumentar la velocidad de transferencia de archivos por FTP."],"a":1,"e":"La especificación comodín (*) expande la validez de la clave pública a cualquier subdominio bajo el mismo espacio de nombres."},{"n":88,"m":6,"q":"Un ataque de “Man-in-the-Browser” (MitB) opera principalmente:","o":["Modificando las antenas de comunicación telefonía móvil de la zona.","Infectando un navegador web mediante un troyano para interceptar y manipular las transacciones financieras antes de que sean cifradas por el navegador.","Rompiendo la pantalla física del ordenador mientras el usuario navega.","Enviando cartas por correo postal a los clientes del banco."],"a":1,"e":"Al residir como una extensión o hook en el proceso del navegador, ve y modifica la información en texto claro antes de su transmisión vía HTTPS."},{"n":89,"m":6,"q":"El estándar de seguridad de datos para la industria de tarjetas de pago se conoce como:","o":["ISO 9001.","PCI-DSS (Payment Card Industry Data Security Standard).","RGPD Art. 5.","SOX Act."],"a":1,"e":"Es el conjunto de normas técnicas obligatorias para entidades que procesan, almacenan o transmiten datos de tarjetas de crédito/débito."},{"n":90,"m":6,"q":"¿Qué se entiende por “Ciberresiliencia”?","o":["La capacidad de un sistema o entidad para prevenir, resistir, adaptarse y recuperarse rápidamente de ciberataques o incidentes tecnológicos.","La compra continuada de hardware informático de última generación.","La prohibición total del uso de dispositivos móviles en el entorno laboral.","La capacidad de programar código en lenguaje ensamblador sin cometer errores."],"a":0,"e":"Acepta la posibilidad del incidente y centra el objetivo en la continuidad del negocio y la capacidad de recuperación operativa."},{"n":91,"m":7,"q":"En un procedimiento de entrada y registro con incautación de material informático, la presencia del Secretario Judicial (Letrado de la Administración de Justicia) es indispensable para:","o":["Programar los parámetros de escaneo del software antivirus.","Dar fe pública de la identidad de los objetos intervenidos y del desarrollo de la diligencia para la validez de la prueba.","Formatear los discos duros antes de llevarlos al laboratorio.","Traducir el código fuente de las aplicaciones informáticas."],"a":1,"e":"Garantiza la autenticidad procesal y el acta pública de los bienes intervenidos en el marco de la diligencia judicial."},{"n":92,"m":7,"q":"¿Qué es la “Esteganografía”?","o":["El arte de escribir textos con letra ilegible.","La disciplina que estudia las técnicas para ocultar un mensaje o archivo dentro de otro contenedor (como una imagen o audio) de forma que pase desapercibido.","La destrucción segura de componentes informáticos mediante ácido.","El cifrado de datos usando algoritmos matemáticos asimétricos."],"a":1,"e":"A diferencia de la criptografía (que oculta el significado), la esteganografía oculta la existencia misma del mensaje en un canal o medio portador."},{"n":93,"m":7,"q":"La técnica de “DNS Tunneling” se utiliza por los atacantes principalmente para:","o":["Borrar de forma remota los registros de eventos de Windows.","Exfiltrar datos o establecer canales de comando y control evadiendo cortafuegos mediante la encapsulación de tráfico dentro del protocolo DNS.","Aumentar la tasa de refresco del monitor del ordenador.","Cargar las páginas web comerciales a doble velocidad."],"a":1,"e":"Como el tráfico de resolución DNS suele permitirse salir sin un filtrado estricto, se abusa de él para tunelizar protocolos no autorizados."},{"n":94,"m":7,"q":"¿Qué es un ataqué “SIM Swapping”?","o":["El robo físico del teléfono móvil en el transporte público.","El engaño a un operador de telefonía para duplicar fraudulentamente la tarjeta SIM de la víctima y recibir sus códigos de autenticación (SMS 2FA).","La rotura de la ranura de memoria SIM mediante un destornillador.","La compra masiva de tarjetas prepago con identidades falsas."],"a":1,"e":"Al tomar control de la línea telefónica, el atacante intercepta los mensajes de verificación de doble factor para acceder a cuentas bancarias o servicios web."},{"n":95,"m":7,"q":"¿Qué diferencia al malware de tipo “Ransomware de Cifrado” del “Ransomware de Bloqueo” (Locker)?","o":["El de cifrado apaga la pantalla y el de bloqueo borra los archivos inmediatamente.","El de cifrado aplica algoritmos criptográficos sobre los archivos haciéndolos inaccesibles, mientras que el locker solo impide el acceso a la interfaz del sistema operativo.","El locker exige el pago en efectivo y el de cifrado en cheques bancarios.","No existe diferencia; ambos términos son completamente equivalentes."],"a":1,"e":"El locker restringe el uso de la interfaz pero mantiene los datos intactos; el crypto-ransomware altera irreversiblemente los datos sin la clave de descifrado."},{"n":96,"m":7,"q":"En el contexto forense, el término “Timestomping” se refiere a:","o":["La sincronización de relojes mediante el protocolo NTP.","La alteración maliciosa de los metadatos de fecha y hora (MACB) de un archivo para dificultar el análisis temporal y engañar al perito.","El desgaste físico de las teclas del teclado por el uso continuado.","La medición de los tiempos de carga de un servidor web."],"a":1,"e":"Modifica deliberadamente las marcas de tiempo (Modificación, Acceso, Creación, Nacimiento) para romper la correlación en la línea de tiempo forense."},{"n":97,"m":7,"q":"La directiva europea relativa a la protección de las personas que informen sobre infracciones del Derecho de la Unión se conoce comúnmente como:","o":["Ley de Cookies.","Directiva Whistleblowing (UE 2019/1937).","Reglamento eIDAS.","Acte Europeo de Ciberseguridad."],"a":1,"e":"Establece los canales seguros de denuncia y la protección jurídica frente a represalias para los informantes de irregularidades dentro de las organizaciones."},{"n":98,"m":7,"q":"¿Qué es un análisis de “Vulnerabilidades de Día Cero” basado en Fuzzing?","o":["La revisión manual del manual de usuario de un programa.","La introducción masiva e automatizada de datos inválidos, inesperados o aleatorios en las entradas de un programa para provocar fallos o desbordamientos.","La llamada telefónica al departamento de soporte técnico para pedir ayuda.","El escaneo de un código QR grabado en una tarjeta física."],"a":1,"e":"El fuzzing busca comportamientos anómalos o cuelgues del programa provocados por entradas no saneadas para descubrir fallos de seguridad no documentados."},{"n":99,"m":7,"q":"¿Qué rol desempeña la organización FIRST (Forum of Incident Response and Security Teams) a nivel global?","o":["La venta de licencias de software comercial antivirus.","La coordinación global, intercambio de prácticas e integración de equipos de respuesta a incidentes de seguridad (CSIRTs/CERTs).","La fijación de los salarios mínimos para los ingenieros informáticos.","El registro de marcas y patentes informáticas europeas."],"a":1,"e":"FIRST reúne a los centros de respuesta a incidentes del mundo para facilitar el intercambio de información técnica sobre amenazas y la cooperación operativa."},{"n":100,"m":7,"q":"El principio “Clean Pipe” (Tubería Limpia) ofrecido por proveedores de telecomunicaciones consiste en:","o":["El limpiado con aire comprimido de las canalizaciones de fibra óptica.","La filtración del tráfico de red en la infraestructura del ISP para mitigar y descartar el tráfico malicioso de ataques DDoS antes de que alcance al cliente.","La sustitución anual de los cables de red de la empresa.","La prohibición de enviar archivos adjuntos de más de 10 MB por correo."],"a":1,"e":"La depuración del tráfico a nivel de carrier detiene ataques de gran volumen impidiendo que colapsen el enlace de última milla de la víctima."},{"n":101,"m":8,"q":"¿Cuál de los siguientes es el organismo oficial español encargados del tratamiento de ciberincidentes para la ciudadanía y empresas privadas?","o":["CCN-CERT.","INCIBE-CERT.","CNI.","MOC-CERT."],"a":1,"e":"INCIBE-CERT es el centro de respuesta a incidentes de seguridad de referencia para los ciudadanos, PYMEs y entidades privadas en España."},{"n":102,"m":8,"q":"Un informe pericial informático que contenga únicamente opiniones subjetivas del analista sin sustento forense ejecutable es susceptible de ser:","o":["Sancionado con multa económica por la Unión Europea.","Impugnado y desestimado en el juicio por falta de validez probatoria y científica.","Convertido automáticamente en una sentencia judicial firme.","Enviado de forma obligatoria a la agencia de protección de datos."],"a":1,"e":"Las pruebas periciales deben basarse en evidencias empíricas replicables y metodología científica; las meras conjeturas carecen de fuerza probatoria."},{"n":103,"m":8,"q":"¿Qué representa la red I2P en el contexto de las Darknets?","o":["Un protocolo de correo sin cifrar.","Una red anónima orientada a la comunicación cifrada punto a punto mediante túneles unidireccionales dentro de su propia infraestructura.","Un servicio público de almacenamiento de archivos en la nube comercial.","Una plataforma de transmisión de vídeo bajo demanda."],"a":1,"e":"I2P utiliza un modelo de enrutamiento ajo (garlic routing) para ofrecer comunicaciones internas cifradas sin salir a la internet convencional."},{"n":104,"m":8,"q":"Un ciberataque ejecutado contra el sistema SCADA de una planta de tratamiento de aguas residuales se clasifica como:","o":["Un delito de revelación de secretos personales.","Un ataque contra una infraestructura crítica y la seguridad nacional.","Un caso leve de infracción de la propiedad industrial.","Una falta administrativa por consumo indebido de electricidad."],"a":1,"e":"Los sistemas SCADA controlan procesos industriales esenciales, por lo que su perturbación atenta contra las infraestructuras estratégicas de un país."},{"n":105,"m":8,"q":"El ataque mediante el cual se modifican los campos de cabecera de un correo para simular que proviene de un dominio de confianza se denomina:","o":["E-mail Spoofing.","SQL Injection.","Buffer Overflow.","Hardening."],"a":0,"e":"El protocolo SMTP clásico no verificaba la identidad del emisor, permitiendo la suplantación directa de la dirección del remitente mediante email spoofing."},{"n":106,"m":8,"q":"¿Qué función tiene la herramienta open-source “Volatilidad” (Volatility Framework)?","o":["Diseñar páginas web accesibles desde teléfonos móviles.","Extraer y analizar artefactos forenses presentes en imágenes de memoria RAM.","Enviar correos masivos para pruebas de penetración.","Formatear dispositivos magnéticos de almacenamiento secundario."],"a":1,"e":"Volatility es la herramienta analítica de referencia para la extracción de procesos, sockets de red y claves presentes en volcados de memoria volátil."},{"n":107,"m":8,"q":"¿Qué es el “Whaling”?","o":["La pesca indiscriminada de especies marinas mediante buques factoría.","Un ataque de Spear Phishing dirigido específicamente a los altos ejecutivos o cargos directivos de una organización (C-level).","La sobrecarga de discos duros mediante archivos gigabyte falsos.","El uso de servidores gubernamentales para juegos en línea."],"a":1,"e":"Su objetivo es la “ballena” (Whale), es decir, personas con acceso privilegiado a información financiera o directiva sensible dentro de la entidad."},{"n":108,"m":8,"q":"La técnica de investigación que busca correlacionar la presencia física de una persona mediante la triangulación de antenas de telefonía móvil se denomina:","o":["Análisis de celdas/repetidores (BTS / Cell Site Analysis).","Esteganografía digital.","Fuzzing de infraestructura.","Escaneo de vulnerabilidades web."],"a":0,"e":"El registro del teléfono en las celdas de red (Call Detail Records - CDR) permite posicionar geográficamente un dispositivo en un espacio temporal."},{"n":109,"m":8,"q":"¿Qué indica el acrónimo “TLP” (Traffic Light Protocol) en la compartición de ciberinteligencia?","o":["El tiempo de encendido de un servidor web comercial.","Un esquema de clasificación por colores (RED, AMBER, GREEN, CLEAR) para indicar con quién se puede compartir una determinada información de seguridad.","La velocidad de transmisión de datos en un cable de cobre.","Un programa de formación obligatorio para peritos forenses."],"a":1,"e":"TLP estandariza las normas de confidencialidad y distribución de la información sobre amenazas entre analistas e instituciones."},{"n":110,"m":8,"q":"Un ataque de “Amplificación NTP/DNS” es una variante de:","o":["Ataque de denegación de servicio distribuido (DDoS) que abusa de servidores con respuestas pesadas para abrumar a una víctima con poco esfuerzo del atacante.","Robo de identidad mediante redes sociales.","Inyección de código en navegadores antiguos.","Infección por troyanos en dispositivos de almacenamiento USB."],"a":0,"e":"El atacante suplanta la IP de la víctima en la petición y logra que los servidores intermedios respondan con paquetes sustancialmente más grandes hacia el objetivo."},{"n":111,"m":8,"q":"El análisis estáctico de un archivo ejecutable malicioso (malware) implica:","o":["Ejecutar el virus en un entorno controlado para ver cómo reacciona el sistema operativo.","Inspeccionar el código fuente, desensamblar el binario y analizar las firmas sin ejecutar el archivo.","Reiniciar el ordenador en modo seguro y borrar el disco.","Enviar el ejecutable a los tribunales por correo ordinario."],"a":1,"e":"El análisis estático estudia las propiedades del binario (cabeceras, secciones, cadenas de texto, desensamblado) sin arriesgar la ejecución de las instrucciones."},{"n":112,"m":8,"q":"¿Qué se entiende por “Sandbox” en la ingeniería de ciberseguridad?","o":["Una herramienta física de limpieza de circuitos impresos.","Un entorno aislado e independiente diseñado para ejecutar y analizar software potencialmente no seguro sin riesgo para la red corporativa.","Un archivo con extensión binaria que guarda únicamente imágenes.","El sistema de refrigeración de un servidor de datos."],"a":1,"e":"Permite observar el comportamiento real del malware de forma contenida y segura."},{"n":113,"m":8,"q":"¿Qué sanción máxima previene el RGPD de la UE para las infracciones más graves cometidas por empresas?","o":["1.000 euros por cada usuario afectado.","Hasta 20 millones de euros o el 4% del volumen de negocio total anual global del ejercicio anterior, optándose por la cuantía de mayor valor.","El cierre inmediato y definitivo de la empresa sin posibilidad de recurso.","Un año de suspensión del suministro de energía eléctrica."],"a":1,"e":"El régimen sancionador del RGPD prevé un impacto disuasorio y proporcional con elevadas multas administrativas."},{"n":114,"m":8,"q":"La recolección de archivos “LOGS” o registros de eventos de un sistema es crítica en forense digital porque:","o":["Permiten liberar espacio de memoria en el disco duro.","Conservan la evidencia de las actividades, accesos, errores y conexiones ocurridas en una ventana temporal concreta.","Cifran automáticamente los documentos de texto del usuario.","Aumentan el anch
