e":"Según los apuntes: “Cuando se plantea cómo, el temario pregunta si existe un protocolo de trabajo para todas las FFCCS y por qué sería importante: unificar criterios y garantizar la cadena de custodia.”"},{"n":9212,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «Las frases semilla deben conservarse», ¿qué opción coincide con el contenido del temario?","o":["En cualquier orden","Solo en digital","Con su grafía original y en el mismo orden","Sin plataforma de origen"],"a":2,"e":"Según los apuntes: “Deben conservarse según su grafía original y en el mismo orden en que se generaron, y para recuperar la wallet es importante conocer la plataforma en la que se creó.”"},{"n":9213,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «En un sistema de claves jerárquico (HD)», ¿qué opción coincide con el contenido del temario?","o":["Cada clave es independiente","De una semilla se derivan una clave maestra y claves hijas","No hay semilla","Solo se usa una clave"],"a":1,"e":"Según los apuntes: “Los sistemas de gestión de claves privadas pueden ser no deterministas, deterministas o jerárquicos (HD): estos últimos, los actuales, derivan de una semilla una clave maestra y de ella claves hijas y nietas, permitiendo gestionar muchas claves privadas desde una sola semilla.”"},{"n":9214,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «Para la wallet policial se usa», ¿qué opción coincide con el contenido del temario?","o":["Una software wallet sin custodia (ej. Coinomi)","Una wallet de exchange con custodia","Solo billeteras de papel","Cuentas bancarias"],"a":0,"e":"Según los apuntes: “Se emplea una software wallet sin custodia (Coinomi, Exodus, Trust Wallet, MetaMask, etc.). Debe decidirse cómo se identifican las wallets y cuántas se van a usar, y utilizar sobres separados para la semilla y la contraseña, con entrega idealmente al final de la diligencia.”"},{"n":9215,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «La semilla y la contraseña se guardan», ¿qué opción coincide con el contenido del temario?","o":["En el mismo sobre","En un fichero compartido","En un correo electrónico","En sobres separados"],"a":3,"e":"Según los apuntes: “Debe decidirse cómo se identifican las wallets y cuántas se van a usar, y utilizar sobres separados para la semilla y la contraseña, con entrega idealmente al final de la diligencia.”"},{"n":9216,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «Si se localizan evidencias durante el análisis de evidencias», ¿qué opción coincide con el contenido del temario?","o":["Se espera al juicio","Se ignoran","Se actúa con inmediatez y se comunica al juzgado","Se entregan al investigado"],"a":2,"e":"Según los apuntes: “Durante el análisis de las evidencias incautadas: se localizan evidencias que permiten acceder o reconstruir una wallet; hay que actuar con inmediatez (riesgo de acceso de terceras personas), comunicar al juzgado y incautar de inmediato, amparándose en el mandamiento que ya autorizó la incautación durante la entrada y registro, documentando todos los parámetros.”"},{"n":9217,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «La incautación en sede judicial requiere presencia de», ¿qué opción coincide con el contenido del temario?","o":["Solo la Policía","Juez, LAJ, abogado defensor y encausado","Solo el fiscal","El exchange"],"a":1,"e":"Según los apuntes: “Durante el proceso judicial: ante la negativa inicial del encausado, si cambia su voluntad, se actúa en sede judicial con presencia del juez, el LAJ, el abogado defensor y el encausado, se realiza la reconstrucción de la wallet policial (desprecintado de los sobres) y se documenta la operación en el acta judicial.”"},{"n":9218,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «La realización anticipada a euros se gestiona a través de», ¿qué opción coincide con el contenido del temario?","o":["La ORGA","El SEPBLAC","La AEAT","Prosegur"],"a":0,"e":"Según los apuntes: “El procedimiento: se solicita a la autoridad judicial que encomiende a la ORGA (Oficina de Recuperación y Gestión de Activos) la gestión de los activos, pidiendo la realización anticipada y su transformación a euros; si el juzgado autoriza, oficia a la ORGA, que se pone en contacto con la unidad investigadora para concretar fecha y lugar de la transferencia; los activos se transfieren a una wallet creada para ello en un exchange de referencia (Bit2Me).”"},{"n":9219,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «El exchange de referencia citado para la realización es», ¿qué opción coincide con el contenido del temario?","o":["Binance","Coinbase","Kraken","Bit2Me"],"a":3,"e":"Según los apuntes: “El procedimiento: se solicita a la autoridad judicial que encomiende a la ORGA (Oficina de Recuperación y Gestión de Activos) la gestión de los activos, pidiendo la realización anticipada y su transformación a euros; si el juzgado autoriza, oficia a la ORGA, que se pone en contacto con la unidad investigadora para concretar fecha y lugar de la transferencia; los activos se transfieren a una wallet creada para ello en un exchange de referencia (Bit2Me).”"},{"n":9220,"m":4,"q":"Pregunta de refuerzo del documento base: respecto a «El SICRIP es fruto de un acuerdo entre», ¿qué opción coincide con el contenido del temario?","o":["La CNMV y el Banco de España","La AEAT y Binance","El Ministerio del Interior y Prosegur Crypto","Europol y Chainalysis"],"a":2,"e":"Según los apuntes: “El SICRIP (Sistema de Incautación de Criptoactivos) nace de un acuerdo entre el Ministerio del Interior y Prosegur Crypto. Se desarrolla en el seno del CETS, con participación de expertos de Policía Nacional y Guardia Civil.”"},{"n":9221,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «La función de un mezclador (tumbler) es», ¿qué opción coincide con el contenido del temario?","o":["Acelerar la confirmación de bloques","Romper el vínculo determinista entre remitente y destinatario","Aumentar la comisión del minero","Firmar transacciones en nombre del usuario"],"a":1,"e":"Según los apuntes: “La función de un mezclador (tumbler) es romper el vínculo determinista entre remitente y destinatario, combinando fondos de múltiples usuarios para dificultar el rastreo.”"},{"n":9222,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «Los mezcladores no custodios en los que varios usuarios combinan sus transacciones en una sola se llaman», ¿qué opción coincide con el contenido del temario?","o":["CoinJoin","Tornado Cash","Wasabi exchange","Lightning Network"],"a":0,"e":"Según los apuntes: “El blanqueo de capitales con criptoactivos adapta el modelo trifásico clásico del blanqueo de dinero a este ecosistema: (1) colocación, el rastro de entrada de fondos ilícitos en el sistema cripto; (2) estratificación, las técnicas clásicas de ofuscación —fragmentación y consolidación (dividir grandes sumas y reunirlas sucesivamente, con un aumento sensible del uso de mezcladores multisalto en los últimos ejercicios), mezcladores (mixers y CoinJoin), y saltos entre cadenas y DeFi (chain hopping)”"},{"n":9223,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «Tornado Cash es el caso de estudio destacado de», ¿qué opción coincide con el contenido del temario?","o":["Mezcladores custodios centralizados","Exchanges regulados","Darknet markets","Mezcladores basados en contratos inteligentes (100 % on-chain)"],"a":3,"e":"Según los apuntes: “La contramedida preventiva central es revoke.cash, una web legítima que permite revisar y revocar permisos de aprobación otorgados previamente a direcciones o contratos, cortando el acceso del atacante aunque la aprobación llevara tiempo concedida.”"},{"n":9224,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «En un mezclador custodio, el principal riesgo es», ¿qué opción coincide con el contenido del temario?","o":["Que no se pueda usar nunca más de una vez","Que sea obligatoriamente ilegal","Que el operador controle los fondos (punto único de fallo)","Que no admita Bitcoin"],"a":2,"e":"Según los apuntes: “Las estructuras del cibercrimen moderno han pasado de un modelo tradicional centralizado (un único operador asume desarrollo, infraestructura, negociación y despliegue, con alto riesgo técnico y operativo concentrado) al modelo RaaS (Ransomware-as-a-Service), de naturaleza corporativa: el operador desarrolla y mantiene la infraestructura del ransomware, licenciándolo a afiliados, que son quienes ejecutan los ataques y reparten un porcentaje de cada rescate cobrado con el operador.”"},{"n":9225,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El uso de un mezclador en la fase pre-delito busca», ¿qué opción coincide con el contenido del temario?","o":["Pagar impuestos de forma anticipada","Ocultar la identidad y anonimizar capital antes de cometer el ilícito","Declarar la operación al SEPBLAC","Congelar los fondos de la víctima"],"a":1,"e":"Según los apuntes: “La dimensión temporal de la investigación forense distingue dos momentos: en el pre-delito, el actor oculta su identidad y anonimiza su capital antes de cometer el ilícito (favorece su relación con el Exchange); en el post-delito, el actor busca ocultar el origen y blanquear el producto de un delito previo (robo, estafa) para poder retirarlo con normalidad.”"},{"n":9226,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «Un mercado de la darknet sostiene la confianza entre usuarios mediante», ¿qué opción coincide con el contenido del temario?","o":["Sistemas de reputación y depósito en garantía (escrow)","Contratos notariales","Avales bancarios","Un registro público de la CNMV"],"a":0,"e":"Según los apuntes: “Su funcionamiento se sostiene en tres pilares: el acceso (redes de anonimización como Tor/I2P que ocultan la ubicación e identidad del servidor y del usuario), la economía (criptomonedas como Bitcoin o, con creciente peso, Monero, usadas como medio de pago nativo del ecosistema) y la confianza (sistemas de reputación entre usuarios y mecanismos de depósito en garantía (escrow) que retienen el pago hasta la entrega).”"},{"n":9227,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «En la estafa de salida (exit scam), la fase final consiste en», ¿qué opción coincide con el contenido del temario?","o":["La devolución íntegra a los usuarios","La intervención judicial automática","El reparto de beneficios entre los vendedores","La desaparición de los administradores con los fondos retenidos (día cero)"],"a":3,"e":"Según los apuntes: “Se desarrolla en tres fases: fase 1, consolidación: los administradores acumulan intencionadamente un volumen elevado de fondos en garantía, elevando la confianza de los usuarios; fase 2, finjen interés y siguen operando con normalidad (fingen seguir operando, animando a más usuarios a depositar); fase 3, la desaparición (día cero): en un día determinado desaparecen permanentemente con todos los fondos retenidos, cerrando la plataforma sin previo aviso.”"},{"n":9228,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «Los vendedores mayoristas, según las tendencias de 2024, se caracterizan por», ¿qué opción coincide con el contenido del temario?","o":["Operar solo con carteras personales","Evitar siempre los mezcladores","Impulsar agresivamente el uso de DeFi para fragmentar y blanquear grandes volúmenes","No usar nunca stablecoins"],"a":2,"e":"Según los apuntes: “El comportamiento financiero de 2024 distingue entre vendedores minoristas (bajo volumen: mayor tendencia a mantener ganancias en carteras on-chain propias, con patrones más sencillos de seguir en su propia wallet) y vendedores mayoristas (grandes volúmenes: distribuyen a gran escala narcóticos y armas; son los principales impulsores de la adopción de DeFi, utilizándolos agresivamente para fragmentar, blanquear y mover grandes volúmenes de capital fuera de espacios regulados).”"},{"n":9229,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El catalizador de la financiación extremista mediante criptoactivos es», ¿qué opción coincide con el contenido del temario?","o":["La obligatoriedad legal de usar cripto","La exclusión bancaria de estos grupos","La ausencia de internet en ciertas zonas","La prohibición de las ONG"],"a":1,"e":"Según los apuntes: “El catalizador común es la exclusión bancaria de estos grupos: al quedar fuera del sistema financiero tradicional por el cierre de cuentas bancarias, recurren a la infraestructura criptográfica (atractivo transferible, rápido y potencialmente privado) como alternativa.”"},{"n":9230,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «La tendencia operativa hacia las stablecoins en la financiación extremista responde a», ¿qué opción coincide con el contenido del temario?","o":["La necesidad de preservar el valor del capital recaudado frente a la volatilidad","La prohibición de usar Bitcoin","Una exigencia del GAFI","El cierre de todos los exchanges"],"a":0,"e":"Según los apuntes: “Dos tendencias operativas relevantes: el giro hacia las stablecoins (preferidas frente a monedas volátiles por preservar el valor del capital recaudado) y el reto analítico de Monero, cuya opacidad criptográfica obliga a la inteligencia a recurrir a métodos complementarios (infiltración de datos, análisis de patrones de comportamiento, explotación de vulnerabilidades técnicas en la seguridad operativa de los propios actores), ya que el análisis on-chain tradicional resulta directamente inútil.”"},{"n":9231,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «La ecuación del ransomware es», ¿qué opción coincide con el contenido del temario?","o":["Phishing + banca + SEPBLAC","Minería + PoS + Ethereum","Mixer + exchange + KYC","Malware + extorsión + criptoactivos"],"a":3,"e":"Según los apuntes: “El ransomware es la ecuación: malware + extorsión + criptoactivos.”"},{"n":9232,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El modelo RaaS (Ransomware-as-a-Service) se caracteriza por», ¿qué opción coincide con el contenido del temario?","o":["Un único atacante que lo hace todo él mismo","La ausencia total de reparto de beneficios","Un operador que desarrolla el software y licencia su uso a afiliados que ejecutan los ataques","Requerir autorización judicial previa"],"a":2,"e":"Según los apuntes: “Las estructuras del cibercrimen moderno han pasado de un modelo tradicional centralizado (un único operador asume desarrollo, infraestructura, negociación y despliegue, con alto riesgo técnico y operativo concentrado) al modelo RaaS (Ransomware-as-a-Service), de naturaleza corporativa: el operador desarrolla y mantiene la infraestructura del ransomware, licenciándolo a afiliados, que son quienes ejecutan los ataques y reparten un porcentaje de cada rescate cobrado con el operador.”"},{"n":9233,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «Según el temario, el volumen de pagos de rescates de ransomware en cadena durante 2024», ¿qué opción coincide con el contenido del temario?","o":["Se duplicó","Cayó un 35 % interanual","Se mantuvo exactamente igual","Desapareció por completo"],"a":1,"e":"Según los apuntes: “El panorama 2024-2025 registra una caída interanual del 35 % en el volumen total de pagos de rescates en cadena, atribuible en parte a una mayor negativa de las víctimas a pagar y a la mejora de las capacidades de rastreo policial.”"},{"n":9234,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «En el Ice Phishing, el atacante consigue», ¿qué opción coincide con el contenido del temario?","o":["Que la víctima apruebe (approve) un contrato malicioso que autoriza el gasto de sus fondos","Robar directamente la clave privada de la víctima","Minar un bloque falso","Hackear el servidor de un exchange"],"a":0,"e":"Según los apuntes: “El atacante engaña al usuario para que apruebe un contrato malicioso que parece legítimo: la víctima firma una transacción que concede permiso a un contrato inteligente para gastar sus fondos (función approve), creyendo que legitima una operación cotidiana (conectar su wallet a una web, por ejemplo).”"},{"n":9235,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «La herramienta citada para revisar y revocar permisos de aprobación concedidos a contratos es», ¿qué opción coincide con el contenido del temario?","o":["Etherscan","Wasabi Wallet","SICRIP","revoke.cash"],"a":3,"e":"Según los apuntes: “La contramedida preventiva central es revoke.cash, una web legítima que permite revisar y revocar permisos de aprobación otorgados previamente a direcciones o contratos, cortando el acceso del atacante aunque la aprobación llevara tiempo concedida.”"},{"n":9236,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El Address Poisoning consiste en», ¿qué opción coincide con el contenido del temario?","o":["Enviar malware por correo electrónico","Modificar el código fuente de un contrato ya desplegado","Enviar transacciones desde una dirección visualmente similar para «envenenar» el historial de la víctima","Duplicar la clave privada de la víctima"],"a":2,"e":"Según los apuntes: “El Address Poisoning (envenenamiento de direcciones) consiste en infectar el historial transaccional de la víctima: los atacantes estudian la actividad de una dirección de alto valor y crean una dirección visualmente similar (primeros y últimos caracteres idénticos) a una con la que la víctima opera con frecuencia, y le envían transacciones de valor irrisorio para que esa dirección fraudulenta («envenenada») quede registrada en su historial reciente de transacciones.”"},{"n":9237,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «En el caso real de Address Poisoning citado, el atacante trasladó los fondos robados», ¿qué opción coincide con el contenido del temario?","o":["A una cuenta bancaria directamente","A la red TRON mediante un bridge","De vuelta a la víctima","A un cajero ATM de bitcoin"],"a":1,"e":"Según los apuntes: “Un caso real citado en el temario es la operación de la UDEF contra una red de blanqueo para el narcotráfico (2026), con cifras de 53 millones de euros (aproximadamente 30 millones de dólares), 400 kilogramos de sustancia estupefaciente intervenida y 14 detenidos, que ilustra cómo las tres fases del blanqueo (colocación, estratificación, integración) se aplican de forma coordinada para disimular el origen ilícito de fondos procedentes del narcotráfico mediante criptoactivos.”"},{"n":9238,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El Pig Butchering (Sha Zhu Pan) se caracteriza por», ¿qué opción coincide con el contenido del temario?","o":["Una ingeniería social prolongada que genera una relación de confianza antes de robar el capital","Un ataque instantáneo sin contacto previo","El uso exclusivo de ransomware","La explotación de una vulnerabilidad de un contrato inteligente"],"a":0,"e":"Según los apuntes: “El Pig Butchering (Sha Zhu Pan, literalmente «matanza del cerdo») es un fraude financiero a largo plazo basado en una ingeniería social prolongada, que persigue el objetivo de generar una confianza profunda en la víctima («engordarla») antes de esquilmar su capital («sacrificarla»).”"},{"n":9239,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El Grupo Lazarus está vinculado a», ¿qué opción coincide con el contenido del temario?","o":["Una organización narcotraficante sudamericana","Un grupo de hacktivistas europeos","Una empresa de ciberseguridad privada","Corea del Norte"],"a":3,"e":"Según los apuntes: “Lazarus es un grupo de amenaza persistente avanzada (APT) vinculado al régimen de Corea del Norte, especializado en el robo masivo de criptoactivos como vía de financiación estatal.”"},{"n":9240,"m":5,"q":"Pregunta de refuerzo del documento base: respecto a «El vector de acceso inicial más habitual de Lazarus explota», ¿qué opción coincide con el contenido del temario?","o":["Una vulnerabilidad de hardware","Un fallo de SHA-256","La ingeniería social dirigida a empleados o proveedores de exchanges (reclutador falso)","El robo físico de servidores"],"a":2,"e":"Según los apuntes: “El vector de acceso inicial explota de forma preferente el factor humano: ingeniería social dirigida a proveedores de custodia o exchanges, mediante un reclutador falso que ofrece una oportunidad laboral ficticia a un empleado o trabajador de TI, y que durante el «proceso de selección» introduce malware (el llamado «caballo de Troya»).”"},{"n":9241,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Ethereum es, ante todo», ¿qué opción coincide con el contenido del temario?","o":["Un banco central digital","Una red pública sobre la que se pueden registrar operaciones y ejecutar programas","Un mezclador de criptoactivos","Un explorador de Bitcoin"],"a":1,"e":"Según los apuntes: “Ethereum es una red informática pública y una plataforma sobre la que se pueden registrar operaciones y, sobre todo, ejecutar programas. La idea fue impulsada por Vitalik Buterin a finales de 2013, que redactó la propuesta inicial conocida como whitepaper.”"},{"n":9242,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «La idea de Ethereum fue impulsada por», ¿qué opción coincide con el contenido del temario?","o":["Vitalik Buterin, a finales de 2013","Satoshi Nakamoto, en 2009","Adam Back, en 2002","Charlie Lee, en 2011"],"a":0,"e":"Según los apuntes: “La idea fue impulsada por Vitalik Buterin a finales de 2013, que redactó la propuesta inicial conocida como whitepaper. Durante 2014 se incorporaron otros cofundadores, desarrolladores y colaboradores, entre ellos Gavin Wood y Joseph Lubin, y en ese año se realizó una venta inicial de ETH para financiar el desarrollo.”"},{"n":9243,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «La red principal de Ethereum (Frontier) se lanzó el», ¿qué opción coincide con el contenido del temario?","o":["3 de enero de 2009","28 de septiembre de 2026","Octubre de 2022","30 de julio de 2015"],"a":3,"e":"Según los apuntes: “La primera versión operativa de la red principal, llamada Frontier, se lanzó el 30 de julio de 2015, con su bloque génesis. Durante 2014 se incorporaron otros cofundadores, desarrolladores y colaboradores, entre ellos Gavin Wood y Joseph Lubin, y en ese año se realizó una venta inicial de ETH para financiar el desarrollo.”"},{"n":9244,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «El motivo de la creación de Ethereum, frente a Bitcoin, fue», ¿qué opción coincide con el contenido del temario?","o":["Sustituir completamente a Bitcoin como moneda de pago","Evitar el uso de criptografía","Usar una cadena de bloques para ejecutar y construir aplicaciones de muchos tipos, no solo lanzar una moneda","Centralizar el control en una autoridad"],"a":2,"e":"Según los apuntes: “El motivo de su nacimiento es que Bitcoin ya era un sistema descentralizado con su propia moneda digital y había demostrado que era posible mantener un registro de la contabilidad de forma descentralizada; Ethereum fue más allá: su idea fue utilizar una cadena de bloques para ejecutar y construir aplicaciones de muchos tipos, no limitarse a lanzar otra moneda digital, sino ofrecer una plataforma programable.”"},{"n":9245,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Ethereum emplea actualmente el mecanismo de consenso», ¿qué opción coincide con el contenido del temario?","o":["Proof of Work exclusivamente","Proof of Stake","Prueba de autoridad delegada únicamente","Ninguno, es centralizado"],"a":1,"e":"Según los apuntes: “Ethereum emplea actualmente un mecanismo de consenso basado en Prueba de Participación (Proof of Stake): determinados participantes, llamados validadores, contribuyen a proponer y confirmar bloques bajo unas reglas que incluyen incentivos y penalizaciones.”"},{"n":9246,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «La transición de Ethereum de minería a Proof of Stake («The Merge») se produjo en», ¿qué opción coincide con el contenido del temario?","o":["Septiembre de 2022","Julio de 2015","Enero de 2009","Marzo de 2023"],"a":0,"e":"Según los apuntes: “Hasta septiembre de 2022, la red principal funcionaba mediante minería (Proof of Work); la transición a Prueba de Participación se produjo en esa fecha (el llamado «The Merge»).”"},{"n":9247,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Ether (ETH) es», ¿qué opción coincide con el contenido del temario?","o":["Un sinónimo exacto de «Ethereum» sin matices","Un tipo de nodo","Un explorador de bloques","El criptoactivo nativo de la red Ethereum"],"a":3,"e":"Según los apuntes: “Ether, o ETH, no son lo mismo que «Ethereum»: Ether es el criptoactivo nativo de la red, igual que Bitcoin lo es de la red Bitcoin. Permite, entre otras cosas, enviar valor de una dirección a otra o pagar las comisiones necesarias para interactuar con la red.”"},{"n":9248,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Las comisiones para interactuar con la red Ethereum se pagan en», ¿qué opción coincide con el contenido del temario?","o":["Dólares únicamente","Bitcoin","ETH («gas»)","Tokens ERC-20 de cualquier tipo"],"a":2,"e":"Según los apuntes: “Para enviar una operación o interactuar con un contrato se pagan comisiones en ETH, habitualmente llamadas «gas»: el «gas» es la unidad en la que se mide el trabajo computacional requerido por una operación; el importe final de la comisión depende del gas consumido y del precio del gas.”"},{"n":9249,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Las direcciones de Ethereum», ¿qué opción coincide con el contenido del temario?","o":["Empiezan por «1», «3» o «bc1»","Empiezan todas por «0x…»","No tienen ningún prefijo común","Dependen del tipo de wallet usada"],"a":1,"e":"Según los apuntes: “Todas las direcciones de la red de Ethereum empiezan por «0x…». En realidad existen dos tipos de cuentas, aunque ambas tienen una dirección que empieza por «0x…» y pueden mantener ETH y tokens: la diferencia está en su origen.”"},{"n":9250,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Una cuenta de propiedad externa (EOA) se controla mediante», ¿qué opción coincide con el contenido del temario?","o":["Una clave privada","El código de un contrato inteligente","Un nodo validador","Un certificado notarial"],"a":0,"e":"Según los apuntes: “Las cuentas de propiedad externa (External Owned Accounts, EOA) se controlan con una clave privada: quien puede utilizar esa clave puede firmar operaciones desde esa cuenta.”"},{"n":9251,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Una cuenta de contrato», ¿qué opción coincide con el contenido del temario?","o":["Se controla igual que una EOA, con clave privada","Solo puede recibir ETH, nunca tokens","Es siempre anónima e imposible de analizar","No tiene clave privada propia; actúa como consecuencia de una transacción externa"],"a":3,"e":"Según los apuntes: “Una cuenta de contrato no tiene clave privada propia con la que firmar una transacción de la misma forma que lo hace una EOA, sino que se ejecuta como consecuencia de una transacción iniciada desde fuera, y puede llegar a invocar a otros contratos y activar movimientos de tokens o interacciones con otros contratos.”"},{"n":9252,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Para diferenciar una EOA de una cuenta de contrato, lo más sencillo es», ¿qué opción coincide con el contenido del temario?","o":["Mirar el número de caracteres de la dirección","Comprobar el color de la dirección en la wallet","Consultar la dirección en un explorador como Etherscan.io","Preguntar al propietario"],"a":2,"e":"Según los apuntes: “La comprobación básica consiste en consultar el código asociado a esa dirección, la cadena y el bloque que se está estudiando; la forma más sencilla es consultar la dirección en el explorador de bloques de la red Ethereum, Etherscan.io: una dirección de contrato muestra una pestaña específica con su código (a menudo verificado), mientras que una EOA no la tiene.”"},{"n":9253,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Un contrato inteligente puede modificarse tras su despliegue», ¿qué opción coincide con el contenido del temario?","o":["Siempre, como cualquier archivo de texto","Solo si se programó deliberadamente un patrón de actualización (proxy)","Nunca, bajo ninguna circunstancia","Solo si lo autoriza el banco central"],"a":1,"e":"Según los apuntes: “Pero si un contrato está previsto para que permita cierta actualización («upgrade»), algunas partes del comportamiento futuro podrían reasignarse mediante un patrón de contrato administrado como «proxy», pero esto debe haber sido previsto y programado explícitamente; el que se pueda o no modificar es una decisión de diseño que hay que examinar caso por caso, investigando quién controla esa capacidad de actualización y cómo está restringida.”"},{"n":9254,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «¿Puede ser hackeado un contrato inteligente», ¿qué opción coincide con el contenido del temario?","o":["Sí, por errores de programación, lógica de permisos equivocada o interacción no verificada con otros contratos","No, al estar en blockchain es matemáticamente invulnerable","Solo si usa Proof of Work","No, solo pueden ser hackeadas las EOA"],"a":0,"e":"Según los apuntes: “Que una operación se ejecute registrada en una blockchain no significa que el programa sea seguro: un contrato inteligente puede contener errores, puede: contener un error en su programación, aplicar una lógica de permisos equivocada, o responder de una forma inesperada ante la interacción con otros contratos.”"},{"n":9255,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Quién puede interactuar con un contrato inteligente depende de», ¿qué opción coincide con el contenido del temario?","o":["La cantidad de ETH que tenga el usuario","El país de residencia del usuario","El explorador que se utilice","Las funciones y permisos programados por su creador"],"a":3,"e":"Según los apuntes: “Para un investigador, saber quién es el creador y qué funciones ofrece el contrato es tan relevante como saber de quién es una dirección EOA.”"},{"n":9256,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Un token ERC-20 es un ejemplo de», ¿qué opción coincide con el contenido del temario?","o":["Un tipo de nodo de Bitcoin","Un mezclador no custodio","Token fungible que corre sobre Ethereum","Un contrato inteligente no modificable"],"a":2,"e":"Según los apuntes: “Entre ellos hay, por ejemplo, tokens fungibles (como los del estándar ERC-20) y no fungibles (NFT); «fungible» significa que cada unidad del token es intercambiable por cualquier otra unidad equivalente.”"},{"n":9257,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «En Etherscan, el apartado que resume en lenguaje natural una operación (p. ej. un swap) es», ¿qué opción coincide con el contenido del temario?","o":["«Gap limit»","«Transaction Action»","«Coinbase»","«SICRIP»"],"a":1,"e":"Según los apuntes: “Para identificarlo se revisan dos bloques de información del explorador: el apartado «Transaction Action», que resume en lenguaje natural la operación ejecutada (por ejemplo «Swap 27.075,02 USDC For 27.069,51 USDT On Uniswap V3»), y el apartado «ERC-20 Tokens Transferred» o «Token Transfers (ERC-20)», que detalla los movimientos concretos de tokens asociados a esa transacción y debe cuadrar con lo indicado en la acción de la transacción.”"},{"n":9258,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «El campo «Interacted With (To)» de una transacción indica», ¿qué opción coincide con el contenido del temario?","o":["El contrato o dirección con el que interactúa la transacción","La comisión pagada por el minero","El número de confirmaciones del bloque","La frase semilla del emisor"],"a":0,"e":"Según los apuntes: “Dos campos resultan especialmente importantes para la investigación: «From», la dirección que origina la transacción, y «Interacted With (To)», el contrato o dirección con el que esa transacción interactúa (por ejemplo, un puente o bridge entre cadenas).”"},{"n":9259,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a ««Decode Input Data» en Etherscan permite», ¿qué opción coincide con el contenido del temario?","o":["Calcular el hash SHA-256 de la transacción","Generar una nueva dirección EOA","Revocar automáticamente un permiso de aprobación","Descomponer los parámetros exactos de la función del contrato invocada"],"a":3,"e":"Según los apuntes: “Por último, la pestaña «More Details» → «Decode Input Data» descompone los parámetros exactos de la función del contrato que se ha invocado (nombre de la función y argumentos codificados), lo que permite, por ejemplo, distinguir una simple aprobación de gasto (approve) de una transferencia real de fondos, una comprobación especialmente relevante al investigar casos de ice phishing (Tema 6), en los que la transacción sospechosa suele ser precisamente una aprobación oculta tras una interfaz engaño”"},{"n":9260,"m":6,"q":"Pregunta de refuerzo del documento base: respecto a «Distinguir una aprobación (approve) de una transferencia real mediante «Decode Input Data» es especialmente relevante para investigar», ¿qué opción coincide con el contenido del temario?","o":["La minería de Bitcoin","El registro del Banco de España","Casos de ice phishing","El whitepaper de Nakamoto"],"a":2,"e":"Según los apuntes: “Por último, la pestaña «More Details» → «Decode Input Data» descompone los parámetros exactos de la función del contrato que se ha invocado (nombre de la función y argumentos codificados), lo que permite, por ejemplo, distinguir una simple aprobación de gasto (approve) de una transferencia real de fondos, una comprobación especialmente relevante al investigar casos de ice phishing (Tema 6), en los que la transacción sospechosa suele ser precisamente una aprobación oculta tras una interfaz engaño”"},{"n":9261,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «El proyecto TRON fue dado a conocer en 2017 por», ¿qué opción coincide con el contenido del temario?","o":["Vitalik Buterin","Justin Sun","Satoshi Nakamoto","Charlie Lee"],"a":1,"e":"Según los apuntes: “Conviene distinguir dos fechas: el proyecto TRON se dio a conocer en 2017 por Justin Sun, con la Fundación TRON constituida en Singapur ese mismo año; la red blockchain de TRON propiamente dicha se desarrolló en 2018, con el lanzamiento de Odyssey 2.0 como red principal el 31/05/2018, al que siguió un periodo de pruebas, y el «TRON Independence Day» el 25/06/2018, fecha del bloque génesis y de la migración de TRX desde Ethereum a la nueva red propia.”"},{"n":9262,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «La red blockchain de TRON (bloque génesis y migración de TRX desde Ethereum) se lanzó el», ¿qué opción coincide con el contenido del temario?","o":["25/06/2018","31/05/2018","2017, junto con el proyecto","2009, igual que Bitcoin"],"a":0,"e":"Según los apuntes: “Conviene distinguir dos fechas: el proyecto TRON se dio a conocer en 2017 por Justin Sun, con la Fundación TRON constituida en Singapur ese mismo año; la red blockchain de TRON propiamente dicha se desarrolló en 2018, con el lanzamiento de Odyssey 2.0 como red principal el 31/05/2018, al que siguió un periodo de pruebas, y el «TRON Independence Day» el 25/06/2018, fecha del bloque génesis y de la migración de TRX desde Ethereum a la nueva red propia.”"},{"n":9263,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «La motivación técnica principal de TRON fue», ¿qué opción coincide con el contenido del temario?","o":["Eliminar por completo los contratos inteligentes","Centralizar la custodia de todos los criptoactivos","Sustituir al dólar como moneda de reserva","Facilitar aplicaciones a gran escala reduciendo limitaciones de capacidad y costes"],"a":3,"e":"Según los apuntes: “La motivación técnica principal fue facilitar aplicaciones a gran escala y de uso masivo, con muchas operaciones, reduciendo las limitaciones de capacidad y reduciendo costes, al considerar que la congestión y las comisiones de otras redes (fundamentalmente Ethereum) dificultaban su utilización masiva.”"},{"n":9264,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «TRON adoptó como mecanismo de consenso», ¿qué opción coincide con el contenido del temario?","o":["La prueba de trabajo (PoW)","Un sistema de autoridad única","La prueba de participación delegada (DPoS)","Ninguno, es un sistema centralizado"],"a":2,"e":"Según los apuntes: “Para lograrlo, TRON adoptó un mecanismo denominado «prueba de participación delegada» o Delegated Proof-of-Stake (DPoS) y un modelo de recursos propio para costear las operaciones.”"},{"n":9265,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «La incorporación de Tether (USDT) a TRON se produjo en», ¿qué opción coincide con el contenido del temario?","o":["2015","2019","2009","2024"],"a":1,"e":"Según los apuntes: “Con el tiempo, sus aplicaciones se ampliaron al intercambio de activos, servicios financieros y servicios de pago, siendo especialmente relevante en este sentido la incorporación de Tether (USDT) en 2019, que hizo que esta red adquiriera su principal e importante función actual como infraestructura de transferencia de valor.”"},{"n":9266,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «En TRON, quienes se turnan para producir los bloques son», ¿qué opción coincide con el contenido del temario?","o":["Los 27 superrepresentantes activos","Todos los nodos completos por igual","Un único servidor central","Los titulares de USDT"],"a":0,"e":"Según los apuntes: “Sin embargo, los «27 superrepresentantes activos», elegidos mediante votos, se turnan para producir los bloques (producción concentrada, aunque no «centralizada», en un grupo reducido de 27 representantes elegidos).”"},{"n":9267,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «La TRON Virtual Machine (TVM)», ¿qué opción coincide con el contenido del temario?","o":["Es exactamente igual que la EVM de Ethereum","No permite ejecutar contratos inteligentes","Solo existe en Bitcoin","Es compatible con la EVM en numerosos aspectos, pero no es idéntica"],"a":3,"e":"Según los apuntes: “Es compatible con la EVM de Ethereum en numerosos aspectos, pero no es idéntica: existen diferencias técnicas que pueden exigir adaptar a TRON un contrato desarrollado originalmente para Ethereum.”"},{"n":9268,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «En DPoS, los superrepresentantes se eligen mediante», ¿qué opción coincide con el contenido del temario?","o":["Un sorteo aleatorio diario","Designación directa de Justin Sun","El voto de quienes hacen staking de TRX","Subasta pública en dólares"],"a":2,"e":"Según los apuntes: “TRON utiliza, en cambio, la prueba de participación delegada (Delegated Proof-of-Stake, DPoS): los participantes con derechos de voto —obtenido mediante staking de TRX— votan para elegir a los 27 «superrepresentantes» o «productores de bloques» (los 27 más votados), que forman el grupo activo que produce los bloques por turnos, actualmente cada 6 horas.”"},{"n":9269,"m":7,"q":"Pregunta de refuerzo del documento base: respecto a «Actualmente, el grupo de superrepresentantes en TRON se actualiza», ¿qué opción coincide con el contenido del temario?","o":["Cada 32 bloques de Ethereum","Cada 6 horas","Una vez al año","Nunca, es fijo desde 2018"],"a":1,"e":"Según los apuntes: “TRON utiliza, en cambio, la prueba de participación delegada (Delegated Proof-of-Stake, DPoS): los participantes con derechos de voto —obtenido mediante staking de TRX— votan para elegir a los 27 «superrepresentantes» o «productores de bloques» (los 27 más votados), que forman el grupo activo que produce los bloques por turnos, actualm  <section class="card"><h2>Modo</h2><div class="row">${rad('mode','study','Estudio','Corrección inmediata y explicación tras cada pregunta')}${rad('mode','exam','Examen','Corrige al final, con nota y cronómetro opcional')}</div>
 ${cfg.mode==='exam'?`<div class="row">${chk('timer','Cronómetro','1 minuto por pregunta')}${chk('pen','Los errores restan','Cada error resta 1/3 de acierto')}</div>`:''}</section>
 <section class="card"><h2>Preguntas</h2><div class="row">${rad('src','cycle','Ciclo','Completa las '+Q.length+' preguntas por tandas')}${rad('src','all','Todas','Las '+Q.length+' del banco')}${rad('src','mods','Por módulos','Elige uno o varios')}${rad('src','failed','Solo falladas','Repaso de tus errores ('+failed.size+')',!failed.size)}</div>${cfg.src==='cycle'?`<h2 style="margin-top:16px">Repetición</h2><div class="row">${rad('rep','none','No repetir','Solo preguntas que aún no has hecho')}${rad('rep','fail','Repetir las falladas','Nuevas y, si hacen falta, las que fallaste')}${rad('rep','any','Repetir cualquiera','Nuevas y, si hacen falta, cualquiera ya hecha')}</div><p class="mu small">${pend?'Te quedan '+pend+' de '+Q.length+' sin hacer.':'Has completado las '+Q.length+'. Reinicia el ciclo para empezar otro.'} <button class="btn sec" data-act="rcycle">${rc?'¿Seguro? Reiniciar':'Reiniciar ciclo'}</button></p>`:''}
 ${cfg.src==='mods'?`<div class="row">${MODS.map((m,i)=>!Q.some(q=>q.m===i)?'':`<label class="ch"><input type="checkbox" data-k="mod" value="${i}"${cfg.mods.has(i)?' checked':''}><span>${esc(m)} <small class="mu">(${Q.filter(q=>q.m===i).length})</small></span></label>`).join('')}</div>`:''}
 <div class="row"><label><b>Preguntas por test</b><br><select data-k="n">${[10,20,40,60,100,0].map(v=>`<option value="${v}"${cfg.n===v?' selected':''}>${v?v+' preguntas':'Todas'}</option>`).join('')}</select></label></div>
 <div class="row">${chk('sq','Orden aleatorio','Mezcla las preguntas')}${chk('so','Mezclar opciones','Cambia de sitio las respuestas A, B, C y D en cada pregunta (la que era A puede pasar a ser C o D). Así aprendes el contenido y no la letra.')}</div></section>
 ${bank==='base'&&seen.size>=Q.length?`<section class="card"><h2>¡Has completado las ${Q.length}!</h2><p>Tienes un banco extra con ${XQ.length} preguntas nuevas de todo el temario.</p><button class="btn" data-act="xbank">Hacer las ${XQ.length} preguntas nuevas</button></section>`:''}${bank==='extra'?`<p><button class="btn sec" data-act="bbank">Volver al banco principal</button></p>`:''}<button class="btn" data-act="start"${p.length?'':' disabled'}>Empezar test (${n} preguntas)</button>
 <p><button class="btn sec" data-act="reset">${rs?'¿Seguro? Borrar todo el progreso':'Borrar progreso'}</button></p>`}
function start(list,n,pre){
 list=pre?list.slice(0,Math.min(n,list.length)):(cfg.sq?shuf(list):list.slice()).slice(0,Math.min(n,list.length));if(pre&&cfg.sq)list=shuf(list);
 S={mode:cfg.mode,pen:cfg.mode==='exam'&&cfg.pen,i:0,done:false,lv:false,cf:false,f:'all',items:list.map(q=>({q,ord:cfg.so?shuf([0,1,2,3]):[0,1,2,3],a:null}))};
 if(S.mode==='exam'&&cfg.timer){S.end=Date.now()+list.length*60000;tm=setInterval(tick,1000)}
 quiz()}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$('#tm');if(el)el.textContent=fmt(r);if(r<=0)finish()}
function quiz(ns){
 const it=S.items[S.i],q=it.q,n=S.items.length,ex=S.mode==='exam',an=it.a!==null,rv=!ex&&an,ok=it.a===q.a,bl=S.items.filter(x=>x.a===null).length,dn=ex?new Set([...seen,...S.items.filter(x=>x.a!==null).map(x=>x.q.n)]).size:seen.size;
 const opts=it.ord.map((oi,p)=>{let c='opt';if(rv){if(oi===q.a)c+=' ok';else if(oi===it.a)c+=' ko'}else if(ex&&it.a===oi)c+=' sel';return `<button class="${c}" data-act="pick" data-oi="${oi}"${rv?' disabled':''}><b>${L[p]}</b><span>${esc(q.o[oi])}</span></button>`}).join('');
 const fb=rv?`<div class="fb ${ok?'good':'bad'}"><strong>${ok?'Correcto.':'Incorrecto.'}</strong> La respuesta correcta es la ${L[it.ord.indexOf(q.a)]}.<span class="srcnote"><b>Según los apuntes</b><br>${esc(q.e).replace(/^Según los apuntes:\s*[“"]?/,'').replace(/[”"]?$/,'')}${q.u?'<br>Respuesta deducida de los apuntes (el documento no traía la solución): compruébala.':''}</span></div>`:'';
 const nav=ex?`<div class="nav">${S.items.map((x,i)=>`<button class="nv${x.a!==null?' an':''}${i===S.i?' cur':''}" data-act="go" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join('')}</div>`:'';
 const pr=((ex?n-bl:S.i+(rv?1:0))/n*100).toFixed(1);
 $('#app').innerHTML=`<div class="top"><span class="mu">Pregunta <b>${S.i+1}</b> de ${n} · nº ${q.n}</span><span class="mu">Hechas <b>${dn}</b> de ${Q.length}</span>${ex&&S.end?`<b id="tm">${fmt(Math.max(0,Math.round((S.end-Date.now())/1000)))}</b>`:''}<button class="btn sec" data-act="home">${S.lv?'¿Seguro? Salir':'Salir'}</button></div>
 <div class="bar" role="progressbar" aria-valuenow="${pr}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pr}%"></i></div>
 ${ex?'':sb(S.items.filter(x=>x.a!==null&&x.a===x.q.a).length,S.items.filter(x=>x.a!==null&&x.a!==x.q.a).length,n)}<p class="mu small">${esc(MODS[q.m])}</p><h2 class="q">${esc(q.q)}</h2>${opts}${fb}
 <div class="row">${ex?`<button class="btn sec" data-act="prev"${S.i?'':' disabled'}>Anterior</button><button class="btn sec" data-act="next"${S.i<n-1?'':' disabled'}>Siguiente</button><button class="btn" data-act="fin">${S.cf?`Confirmar entrega (${bl} sin responder)`:'Finalizar'}</button>`:`<button class="btn" data-act="next"${an?'':' disabled'}>${S.i<n-1?'Siguiente':'Ver resultado'}</button>`}</div>${nav}`;
 if(!ns)window.scrollTo(0,0)}
function pick(oi){const it=S.items[S.i];S.lv=false;
 if(S.mode==='study'){if(it.a!==null)return;it.a=oi;seen.add(it.q.n);it.a===it.q.a?failed.delete(it.q.n):failed.add(it.q.n);sv()}else it.a=it.a===oi?null:oi;
 quiz(1)}
function next(){S.lv=false;S.cf=false;if(S.i<S.items.length-1){S.i++;quiz()}else if(S.mode==='study')finish();else quiz()}
function finish(){
 clearInterval(tm);S.done=true;let ok=0,ko=0,bl=0;
 S.items.forEach(it=>{if(it.a===null)bl++;else if(it.a===it.q.a)ok++;else ko++;if(S.mode==='exam'&&it.a!==null){seen.add(it.q.n);it.a===it.q.a?failed.delete(it.q.n):failed.add(it.q.n)}});
 const n=S.items.length,sc=Math.max(0,ok-(S.pen?ko/3:0));
 S.res={ok,ko,bl,n,nota:sc/n*10};hist.push({d:Date.now(),mode:S.mode,n,ok,pct:Math.round(ok/n*100)});hist=hist.slice(-50);sv();results()}
function results(){
 const r=S.res,lab={ok:'Correcta',ko:'Incorrecta',bl:'En blanco'};
 const rows=S.items.map((it,i)=>({it,i,s:it.a===null?'bl':it.a===it.q.a?'ok':'ko'})).filter(x=>S.f==='all'||x.s!=='ok');
 const list=rows.map(({it,i,s})=>`<article class="card"><div class="top"><b>Pregunta ${i+1} · nº ${it.q.n}</b><span class="tag ${s}">${lab[s]}</span></div><p>${esc(it.q.q)}</p>${it.ord.map((oi,p)=>`<div class="ro${oi===it.q.a?' ok':oi===it.a?' ko':''}"><b>${L[p]}</b> ${esc(it.q.o[oi])}</div>`).join('')}<p class="reviewnote"><strong>Según los apuntes:</strong> ${esc(it.q.e).replace(/^Según los apuntes:\s*[“"]?/,'').replace(/[”"]?$/,'')}${it.q.u?' (Respuesta deducida de los apuntes: compruébala.)':''}</p></article>`).join('');
 $('#app').innerHTML=`<section class="card score"><p class="mu">Resultado</p><div class="big">${r.nota.toFixed(2)} / 10</div><p>${r.ok} correctas · ${r.ko} incorrectas · ${r.bl} en blanco de ${r.n}${S.pen?'<br><small class="mu">Los errores restan 1/3</small>':''}</p><p class="mu">Llevas <b>${seen.size}</b> de ${Q.length} preguntas hechas.</p>${sb(r.ok,r.ko,r.n)}
 <div class="row" style="justify-content:center">${cfg.src==='cycle'?`<button class="btn" data-act="again"${pool().length?'':' disabled'}>Siguiente test del ciclo</button>`:''}<button class="btn sec" data-act="retry"${r.ko?'':' disabled'}>Repasar las falladas (${r.ko})</button>${bank==='base'&&seen.size>=Q.length?`<button class="btn" data-act="xbank">Hacer las ${XQ.length} preguntas nuevas</button>`:''}<button class="btn sec" data-act="home">Volver al inicio</button></div></section>
 <div class="row"><button class="btn sec" data-act="filt" data-f="all"${S.f==='all'?' aria-pressed="true"':''}>Ver todas</button><button class="btn sec" data-act="filt" data-f="bad"${S.f==='bad'?' aria-pressed="true"':''}>Solo falladas y en blanco</button></div>${list||'<p class="mu">No hay preguntas que mostrar.</p>'}`;
 window.scrollTo(0,0)}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='start'||a==='again')start(pool(),cfg.n||pool().length,cfg.src==='cycle');
 else if(a==='home'){if(S&&!S.done&&!S.lv){S.lv=true;quiz(1);return}home()}
 else if(a==='pick')pick(+b.dataset.oi);
 else if(a==='next')next();
 else if(a==='prev'){S.i=Math.max(0,S.i-1);S.cf=false;quiz()}
 else if(a==='go'){S.i=+b.dataset.i;S.cf=false;quiz()}
 else if(a==='fin'){const bl=S.items.filter(x=>x.a===null).length;if(bl&&!S.cf){S.cf=true;quiz(1);return}finish()}
 else if(a==='filt'){S.f=b.dataset.f;results()}
 else if(a==='asig01'){loadBank('base');home()}else if(a==='asig08'){loadBank('asig08');home()}else if(a==='asig09'){loadBank('asig09');home()}
 else if(a==='xbank'){loadBank('extra');home()}else if(a==='bbank'){loadBank('base');home()}
 else if(a==='retry')start(S.items.filter(x=>x.a!==null&&x.a!==x.q.a).map(x=>x.q),999);
 else if(a==='reset'){if(!rs){rs=true;home();return}failed=new Set();hist=[];seen=new Set();rs=false;sv();home()}else if(a==='rcycle'){if(!rc){rc=true;home();return}seen=new Set();rc=false;sv();home()}});
$('#app').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
 if(k==='mod'){t.checked?cfg.mods.add(+t.value):cfg.mods.delete(+t.value)}
 else if(k==='n')cfg.n=+t.value;
 else if(t.type==='checkbox')cfg[k]=t.checked;
 else cfg[k]=t.value;rs=rc=false;home()});
document.addEventListener('keydown',e=>{if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),i='abcd1234'.indexOf(k);
 if(k.length===1&&i>-1){pick(S.items[S.i].ord[i%4]);e.preventDefault()}
 else if(k==='arrowright'||(k==='enter'&&document.activeElement.tagName!=='BUTTON')){if(S.mode==='study'&&S.items[S.i].a===null)return;next()}
 else if(k==='arrowleft'&&S.mode==='exam'){S.i=Math.max(0,S.i-1);quiz()}});
home();
</script></body></html>
