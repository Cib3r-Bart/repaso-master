const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "¿Qué porcentaje crecieron las estafas informáticas conocidas en España entre 2016 y 2023?", "o": ["Un 26,0%", "Un 509,1%", "Un 72,5%", "Un 76,7%"], "c": [1], "e": "Según los datos del temario, las estafas informáticas conocidas crecieron un 509,1% entre 2016 y 2023.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "En las estadísticas de cibercriminalidad de 2023, ¿qué porcentaje aproximado correspondía a fraudes informáticos?", "o": ["El 90,5%", "El 72,5%", "El 3,7%", "El 27,5%"], "c": [0], "e": "En 2023 el 90,5% de la cibercriminalidad correspondió a fraudes informáticos, el tipo delictivo claramente dominante.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "¿Qué porcentaje de las detenciones o investigaciones por cibercriminalidad en 2023 correspondieron a hombres?", "o": ["El 50,9%", "El 76,7%", "El 72,5%", "El 27,5%"], "c": [2], "e": "El 72,5% de los presuntos autores son hombres, frente al 27,5% de mujeres (cuidado: 27,5% es la cifra de mujeres).", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "¿Cuál es el grupo de edad con mayor número de responsables investigados en cibercriminalidad?", "o": ["Menores de 14 años", "De 18 a 25 años", "De 30 a 45 años", "Mayores de 65 años"], "c": [1], "e": "El grupo de edad con más investigados es el de 18 a 25 años, según las estadísticas del temario.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "¿Qué tres comunidades autónomas registraron el mayor volumen de denuncias en el informe citado?", "o": ["Cataluña, Valencia y Galicia", "Andalucía, Madrid y Cataluña", "Madrid, Andalucía y País Vasco", "Andalucía, Cataluña y Comunidad Valenciana"], "c": [1], "e": "Andalucía, Madrid y Cataluña concentran el mayor volumen de denuncias, por población y actividad digital.", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "Según la teoría de las actividades rutinarias, ¿qué elementos deben confluir para que se cometa el delito?", "o": ["Delincuente motivado, objetivo alcanzable y ausencia de guardianes", "Pobreza, anonimato y fallos técnicos", "Arma letal, nocturnidad y premeditación", "Víctima vulnerable, conexión de alta velocidad y cómplice"], "c": [0], "e": "Teoría de las actividades rutinarias (Cohen y Felson): el delito se produce cuando coinciden un delincuente motivado, un objetivo alcanzable y la ausencia de guardianes capaces.", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "¿Cómo se denomina el fenómeno conductual en el ciberespacio donde las personas se vuelven más groseras o violentas?", "o": ["Desinhibición benigna", "Efecto Proteo o desinhibición tóxica", "Efecto Halo", "Disociación instrumental"], "c": [1], "e": "El efecto Proteo o desinhibición tóxica describe cómo el anonimato y la distancia llevan a comportarse de forma más grosera o violenta en la red.", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "¿En qué año se creó la Unidad de Análisis de la Conducta Criminal (USAL)?", "o": ["2010", "2015", "2018", "2020"], "c": [1], "e": "La USAL (Unidad de Análisis de la Conducta Criminal) se creó formalmente en 2015.", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "¿Qué diferencia fundamental existe entre el Modus Operandi (MO) y la firma?", "o": ["El MO es el 'por qué' y la firma el 'cómo'", "El MO es el 'cómo' para consumar el delito y la firma el sello personal y necesidad psicológica", "El MO es estático y la firma variable", "No existe ninguna diferencia conceptual"], "c": [1], "e": "El MO es el «cómo» (método para consumar el delito, puede evolucionar); la firma es el sello personal que responde a una necesidad psicológica y no es necesaria para cometer el delito.", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "¿Qué características presenta la estructura de personalidad paranoide en el ámbito criminal?", "o": ["Crímenes impulsivos, alto consumo de drogas y llanto", "Crímenes muy premeditados, conciencia forense y ejecución rápida/instrumental", "Actuación matutina y quejas respiratorias", "Cercanía familiar y tendencia al suicidio"], "c": [1], "e": "La estructura paranoide se asocia a crímenes muy premeditados, con conciencia forense y ejecución rápida e instrumental.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "¿Qué quejas médicas o somáticas se asocian frecuentemente con la estructura de personalidad depresiva?", "o": ["Digestivas o de presión craneal", "Respiratorias o cardiovasculares", "Osteomusculares graves", "Dermatológicas alérgicas"], "c": [1], "e": "La estructura depresiva se asocia a quejas somáticas respiratorias o cardiovasculares (las digestivas o de presión craneal corresponden a la paranoide).", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "Según Save the Children, ¿qué porcentaje aproximado de niñas sufren abusos antes de los 17 años en España?", "o": ["El 10%", "El 23%", "El 50%", "El 5%"], "c": [1], "e": "Según Save the Children, en torno al 23% de las niñas sufren abusos antes de los 17 años en España.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "¿Qué criterio temporal exige el DSM-5 para el diagnóstico de la pedofilia?", "o": ["Al menos 1 mes", "Al menos 3 meses", "Al menos 6 meses", "Al menos 1 año"], "c": [2], "e": "El DSM-5 exige que las fantasías, impulsos o conductas se mantengan durante al menos 6 meses.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "¿Cómo se denomina al pedófilo que mantiene relaciones tanto con adultos como con menores, presentando mayor peligrosidad?", "o": ["Pederastia primaria", "Pederastia secundaria", "Abusador regresivo", "Voyerista digital"], "c": [1], "e": "La pederastia secundaria (no exclusiva: relaciones con adultos y con menores) es la de mayor peligrosidad; la primaria es exclusiva, calculadora y solitaria.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "¿Cuál es la progresión digital típica del pedófilo tecnológico descrita en el texto?", "o": ["Experto -> Suministrador -> Observador", "Inexperto -> Observador -> Suministrador público -> Suministrador privado -> Experto", "Observador -> Experto -> Creador de malware", "Suministrador privado -> Inexperto -> Hacker ético"], "c": [1], "e": "La progresión descrita es: inexperto → observador → suministrador público → suministrador privado → experto.", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Qué finalidad tienen las distorsiones cognitivas en los agresores sexuales de menores?", "o": ["Mejorar su velocidad de navegación", "Neutralizar la culpa y minimizar el daño causado", "Facilitar la encriptación de archivos", "Aumentar su coeficiente intelectual"], "c": [1], "e": "Las distorsiones cognitivas sirven para neutralizar la culpa y minimizar el daño causado a la víctima.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "¿Cómo se denomina la práctica de los padres de publicar fotos o vídeos de menores en redes sociales?", "o": ["Grooming", "Sharenting", "Cyberstalking", "Phishing parental"], "c": [1], "e": "Sharenting es la práctica de padres y tutores de publicar fotos o vídeos de menores en redes sociales.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "¿En qué fase del proceso de grooming se analizan las rutinas familiares y el nivel de supervisión?", "o": ["Fase 1", "Fase 3", "Fase 5", "Fase 2"], "c": [1], "e": "En la Fase 3 del grooming el agresor analiza las rutinas familiares y el nivel de supervisión del menor.", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "¿Qué perfil de ciberacoso (cyberstalking) según McFarlane y Bocij se caracteriza por ser malévolo, paranoide y trasladable a la realidad?", "o": ["Íntimo", "Compuesto", "Vindicativo", "Colectivo"], "c": [2], "e": "Según McFarlane y Bocij, el cyberstalker vindicativo es malévolo, paranoide y su acoso puede trasladarse a la realidad.", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "¿Qué porcentaje aproximado de los casos de abusos sexuales infantiles revelados se estima que llegan a denunciarse (cifra negra)?", "o": ["El 15%", "El 50%", "El 80%", "El 95%"], "c": [0], "e": "Se estima que solo alrededor del 15% de los abusos sexuales infantiles revelados se denuncian: esa es la cifra negra.", "nota": ""}, {"id": "2.1", "t": 2, "n": 1, "q": "¿Qué sesgo psicológico es muy común entre los usuarios frente a la ciberdelincuencia?", "o": ["Sesgo de confirmación", "Sesgo de percepción del riesgo ('a mí nunca me pasará')", "Efecto Dunning-Kruger", "Sesgo de autoridad"], "c": [1], "e": "El sesgo de percepción del riesgo («a mí nunca me pasará») lleva a muchos usuarios a infravalorar la amenaza y a no protegerse.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Cuáles son los métodos principales para obtener credenciales según el temario?", "o": ["Phishing, fuerza bruta, OSINT y keyloggers", "Cifrado simétrico, AES y hashes", "Ingeniería social inversa y troyanos bancarios", "Firma digital y certificados SSL"], "c": [0], "e": "Los métodos principales para obtener credenciales son phishing, fuerza bruta, OSINT y keyloggers.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Qué sigla corresponde a la inteligencia obtenida a partir de fuentes abiertas en redes sociales?", "o": ["HUMINT", "SOCMINT", "SIGINT", "ELINT"], "c": [1], "e": "SOCMINT es la inteligencia obtenida de fuentes abiertas en redes sociales.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Qué término hace referencia a la inteligencia de fuentes humanas en la investigación?", "o": ["OSINT", "GEOINT", "HUMINT", "IMINT"], "c": [2], "e": "HUMINT es la inteligencia de fuentes humanas.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Qué aspectos permite inferir el análisis de la huella digital en redes sociales?", "o": ["Únicamente la dirección IP", "Orientación sexual, política, religión, personalidad y rutinas", "El número de cuenta bancaria obligatoriamente", "El historial médico completo del usuario"], "c": [1], "e": "La huella digital permite inferir orientación sexual, política, religión, personalidad y rutinas del usuario.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Cuál es la diferencia fundamental entre un hacker y un cracker?", "o": ["El hacker es un delincuente y el cracker trabaja para el Estado", "El hacker investiga y verifica la seguridad y el cracker la vulnera para robar o lucrarse sin autorización", "No hay ninguna diferencia técnica", "El cracker utiliza Linux y el hacker Windows"], "c": [1], "e": "El hacker investiga y verifica la seguridad de los sistemas; el cracker la vulnera sin autorización para robar o lucrarse.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Cómo se denominan los hackers éticos que protegen sistemas y son contratados por corporaciones?", "o": ["Black Hat", "White Hat", "Grey Hat", "Script Kiddie"], "c": [1], "e": "Los White Hat son los hackers éticos: protegen sistemas y suelen ser contratados por empresas.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "¿Qué color de sombrero identifica a los hackers maliciosos equivalentes al cracker que buscan lucro?", "o": ["White Hat", "Red Hat", "Black Hat", "Green Hat"], "c": [2], "e": "Los Black Hat son los hackers maliciosos, equivalentes al cracker, que actúan por lucro.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Cómo se denominan los hackers intermedios que vulneran sistemas sin daño mayor pero exigen compensación económica?", "o": ["Grey Hat", "Blue Hat", "Yellow Hat", "Green Hat"], "c": [0], "e": "Los Grey Hat son el término medio: vulneran sistemas sin causar un daño mayor, pero piden una compensación económica.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "¿Qué grupo de hackers se caracteriza por ser activistas digitales que exponen información (ej. Anonymous)?", "o": ["Script Kiddies", "Red Hat", "White Hat", "Patrocinados por Estados"], "c": [1], "e": "Según la taxonomía del temario, los Red Hat son los activistas digitales que exponen información (tipo Anonymous).", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Cómo se denominan los novatos en aprendizaje que compran herramientas a terceros para atacar?", "o": ["Grey Hat", "Script Kiddies", "Blue Hat", "Hacktivistas"], "c": [1], "e": "Los Script Kiddies son novatos que compran o usan herramientas de terceros sin comprender del todo cómo funcionan.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Qué sombrero identifica a los especialistas en secuestro de cuentas en redes sociales?", "o": ["Yellow Hat", "Green Hat", "Blue Hat", "Red Hat"], "c": [0], "e": "Según el temario, los Yellow Hat son los especialistas en el secuestro de cuentas en redes sociales.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿Qué son los Blue Hat según la taxonomía del temario?", "o": ["Criminales internacionales de alta peligrosidad", "Consultores externos de seguridad o empleados vengativos", "Fuerzas de seguridad del Estado", "Auditores de código fuente"], "c": [1], "e": "Los Blue Hat son consultores externos de seguridad o empleados vengativos.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Qué fuente de inteligencia incluye registros públicos como el BOE o el registro mercantil?", "o": ["HUMINT", "OSINT", "SIGINT", "MASINT"], "c": [1], "e": "OSINT es la inteligencia de fuentes abiertas, que incluye registros públicos como el BOE o el Registro Mercantil.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "¿Qué variable de análisis no se menciona explícitamente en la investigación de conductas delictivas online?", "o": ["Coherencia interpersonal", "Carrera delictiva", "Número de tarjeta de crédito física", "Conciencia forense"], "c": [2], "e": "El número de tarjeta de crédito física no es una variable de análisis de conductas delictivas online; sí lo son la coherencia interpersonal, la carrera delictiva o la conciencia forense.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué caracteriza a los hackers patrocinados por Estados?", "o": ["Venden datos en la Deep Web por dinero", "Protegen infraestructura estatal y realizan espionaje", "Atacan únicamente a entidades bancarias privadas", "Son exclusivamente aficionados sin formación"], "c": [1], "e": "Los hackers patrocinados por Estados protegen infraestructura estatal y realizan espionaje.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "¿Qué combinación de técnicas utilizan habitualmente los ciberdelincuentes para vulnerar organizaciones?", "o": ["Programas informáticos (malware) e ingeniería social", "Únicamente fuerza bruta física", "Llamadas telefónicas anónimas sin soporte informático", "Cartas postales cifradas"], "c": [0], "e": "Habitualmente combinan malware e ingeniería social para vulnerar organizaciones.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Qué implica la geolocalización en fuentes abiertas dentro de OSINT?", "o": ["IMINT / GEOINT", "SOCMINT", "HUMINT", "FININT"], "c": [0], "e": "La geolocalización en fuentes abiertas se encuadra en IMINT/GEOINT (inteligencia de imágenes y geoespacial).", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Cuál es el objetivo principal de los hacktivistas?", "o": ["Obtener beneficio económico directo", "Promover fines políticos o ideológicos a través de acciones en la red", "Destruir internet por completo", "Espionaje industrial corporativo"], "c": [1], "e": "Los hacktivistas buscan promover fines políticos o ideológicos mediante acciones en la red.", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Qué define la conducta del 'Green Hat'?", "o": ["Alta experiencia en criptografía avanzada", "Novatos en aprendizaje, peligrosos por inexperiencia", "Especialistas en ciberseguridad industrial", "Expertos en ingeniería social corporativa"], "c": [1], "e": "Los Green Hat son novatos en aprendizaje, peligrosos por su inexperiencia.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "¿Qué autores clave se mencionan en el marco teórico de la sociología digital?", "o": ["Sigmund Freud y Carl Jung", "Manuel Castells, Sherry Turkle, Zeynep Tufekci, Danah Boyd y Nick Couldry", "Alan Turing y Tim Berners-Lee", "Cesare Lombroso y Enrico Ferri"], "c": [1], "e": "Los autores clave son Manuel Castells, Sherry Turkle, Zeynep Tufekci, Danah Boyd y Nick Couldry.", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿Qué significan las siglas VUCA en el contexto de la Cuarta Revolución Industrial?", "o": ["Velocidad, Urgencia, Complejidad y Amenaza", "Volatilidad, Incertidumbre, Complejidad y Ambigüedad", "Virtualización, Usabilidad, Conectividad y Automatización", "Vulnerabilidad, Inestabilidad, Conflicto y Algoritmo"], "c": [1], "e": "VUCA = Volatilidad, Incertidumbre (Uncertainty), Complejidad y Ambigüedad.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "¿Cuáles son los cinco indicadores base del Decenio Digital de la Unión Europea?", "o": ["PIB, inflación, desempleo, deuda y exportaciones", "Conectividad, capital humano, uso de internet, integración digital empresarial y servicios públicos online", "Ciberseguridad, criptografía, IA, robótica y 5G", "Población, territorio, idioma, moneda y leyes"], "c": [1], "e": "Los cinco indicadores son conectividad, capital humano, uso de internet, integración digital empresarial y servicios públicos online.", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "¿Cuál es la secuencia de cuatro eslabones que conduce del yo digital a la conducta delictiva?", "o": ["Phishing -> Malware -> Extorsión -> Beneficio", "Yo digital -> Despersonalización digital -> Desinhibición online -> Conducta delictiva", "Infoxicación -> Aislamiento -> Depresión -> Delito", "Curiosidad -> Foro oculto -> Compra de herramientas -> Ataque"], "c": [1], "e": "La secuencia es: yo digital → despersonalización digital → desinhibición online → conducta delictiva.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Quién es el autor asociado a la obra 'La Sociedad Red' mencionada en el temario?", "o": ["Sherry Turkle", "Manuel Castells", "Zeynep Tufekci", "Nick Couldry"], "c": [1], "e": "«La Sociedad Red» es la obra fundamental de Manuel Castells.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Qué autora aborda la temática de la soledad digital?", "o": ["Danah boyd", "Sherry Turkle", "Zeynep Tufekci", "Rachel Carson"], "c": [1], "e": "Sherry Turkle ha profundizado en la soledad digital y la pérdida de empatía real.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Qué elemento se señala como debilidad en el diagnóstico DAFO de la sociedad digital?", "o": ["Infraestructuras de fibra óptica", "Brechas digitales y bajo interés juvenil STEM", "Comercio electrónico avanzado", "Uso masivo de Big Data"], "c": [1], "e": "Las brechas digitales y el bajo interés juvenil por las carreras STEM se señalan como debilidades en el DAFO.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Qué porcentaje aproximado del PIB mundial representa el impacto macroeconómico del cibercrimen según el temario?", "o": ["El 0,1%", "El 1,5% (un billón de dólares)", "El 10%", "El 25%"], "c": [1], "e": "El impacto macroeconómico del cibercrimen se sitúa en torno al 1,5% del PIB mundial (aprox. un billón de dólares).", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿Cómo se denomina el modelo de negocio criminal basado en servicios automatizados y escalables?", "o": ["Crime as a Service (CaaS)", "Software as a Service (SaaS)", "Phishing as a Service (PaaS)", "Hacking as a Service (HaaS)"], "c": [0], "e": "Crime as a Service (CaaS) es el modelo criminal de servicios automatizados y escalables que se alquilan o venden.", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Qué tratado internacional establece la taxonomía estándar del cibercrimen?", "o": ["Tratado de Roma", "Convenio de Budapest", "Convenio de Ginebra", "Protocolo de Kioto"], "c": [1], "e": "El Convenio de Budapest establece la taxonomía estándar del cibercrimen.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿Cuál fue el volumen de casos de phishing reportados en la radiografía de la amenaza 2024 citada?", "o": ["1.000 casos", "21.571 casos (43,2%)", "50.000 casos", "500 casos"], "c": [1], "e": "La radiografía de la amenaza 2024 recoge 21.571 casos de phishing, el 43,2% del total.", "nota": , "e": "Uno de los pilares de respuesta ciudadana son las redes sociales de la Policía Nacional, con unos 6 millones de seguidores.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "¿Qué delito no pertenece a la taxonomía básica del Convenio de Budapest?", "o": ["Delitos contra la confidencialidad", "Delitos informáticos patrimoniales", "Delitos de contrabando de armas de fuego física", "Delitos de pornografía infantil"], "c": [2], "e": "El contrabando de armas físicas no es un delito informático; el Convenio de Budapest recoge delitos contra la confidencialidad, informáticos patrimoniales y de pornografía infantil.", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Qué aspecto destaca como oportunidad en el diagnóstico DAFO digital?", "o": ["Eficiencia y Big Data", "Desempleo automatizable", "Brechas digitales", "Ciberataques masivos"], "c": [0], "e": "La eficiencia y el Big Data se destacan como oportunidad en el DAFO digital; las brechas digitales y los ciberataques son debilidad y amenaza.", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "¿Qué representa el cuello de botella jurisdiccional en la represión del cibercrimen?", "o": ["La falta de ordenadores en las comisarías", "La naturaleza transnacional del delito frente a fronteras legales nacionales", "La lentitud del correo postal", "La prohibición de usar internet en los tribunales"], "c": [1], "e": "El cuello de botella jurisdiccional nace de que el delito es transnacional mientras las fronteras legales son nacionales.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿Qué se entiende por 'vector humano' en el contexto de la ciberseguridad?", "o": ["Un virus informático de última generación", "El usuario con acceso legítimo cuya mente es comprometida mediante ingeniería social", "Un cable de fibra óptica submarino", "Un servidor central en la nube"], "c": [1], "e": "El vector humano es el usuario con acceso legítimo cuya mente se compromete mediante ingeniería social.", "nota": ""}, {"id": "4.2", " l blanco principal del phishing?", "o": ["Sistema 2 (lento y analítico)", "Sistema 1 (rápido, intuitivo y emocional)", "Sistema operativo Linux", "Memoria RAM a corto plazo"], "c": [1], "e": "El phishing apunta al Sistema 1 de Kahneman (rápido, intuitivo y emocional), que reacciona sin analizar.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "¿Qué principio de Cialdini utiliza la falsa validación grupal y estadísticas manipuladas?", "o": ["Simpatía", "Prueba social", "Autoridad", "Escasez"], "c": [1], "e": "Prueba social: se usa la falsa validación grupal y estadísticas manipuladas («todos lo hacen»).", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿Qué técnica de defensa cognitiva se recomienda para neutralizar ataques de ingeniería social?", "o": ["Apagar el ordenador permanentemente", "Inyectar fricción (detenerse 5 segundos y cuestionar la urgencia)", "Instalación de un antivirus gratuito", "Cambiar de proveedor de internet"], "c": [1], "e": "Inyectar fricción es detenerse unos segundos y cuestionar la urgencia, para romper la reacción automática.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "¿Qué implica el principio de 'compromiso y coherencia' de Cialdini en ataques online?", "o": ["Obligar a firmar un contrato notarial", "Alineación con decisiones previas inocuas (foot-in-the-door)", "Amenazar con denuncias policiales falsas", "Regalar muestras de software comercial"], "c": [1], "e": "Compromiso y coherencia: se logra alinear a la víctima con decisiones previas inocuas para que acceda a peticiones mayores (foot-in-the-door).", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "¿Qué expone el sesgo del atractivo físico en la valoración judicial según los estudios citados (Efran, Leventhal/Krate)?", "o": ["Que los individuos atractivos reciben penas menores", "Que los atractivos cometen más delitos informáticos", "Que la policía no detiene a personas atractivas", "Que no existe ningún sesgo estético"], "c": [0], "e": "Los estudios citados (Efran, Leventhal/Krate) muestran que los individuos atractivos reciben penas menores.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "¿Qué pilar retórico aristotélico representa la credibilidad o suplantación de identidad?", "o": ["Ethos", "Pathos", "Logos", "Mythos"], "c": [0], "e": "Ethos es el pilar de la credibilidad, por lo que se asocia a la suplantación de identidad.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Qué pilar retórico representa la emoción y el miedo inducido?", "o": ["Ethos", "Pathos", "Logos", "Krisis"], "c": [1], "e": "Pathos es la emoción; en ingeniería social se traduce en miedo inducido.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Qué pilar retórico representa la apariencia lógica y argumental?", "o": ["Pathos", "Ethos", "Logos", "Praxis"], "c": [2], "e": "Logos es la apariencia lógica y argumental del mensaje.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué caracteriza al Sistema 2 de procesamiento mental?", "o": ["Es rápido, intuitivo y automático", "Es lento, analítico, deliberativo y lógico", "Opera exclusivamente durante el sueño", "Es emocional e impulsivo"], "c": [1], "e": "El Sistema 2 es lento, analítico, deliberativo y lógico; el rápido e intuitivo es el Sistema 1.", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "¿Qué sesgo cognitivo se explota al hacer creer a la víctima que todo el mundo está comprando un producto falso?", "o": ["Prueba social", "Aversión a la pérdida", "Efecto halo", "Exceso de confianza"], "c": [0], "e": "Hacer creer que todo el mundo compra el producto explota la prueba social.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "¿Qué objetivo persigue la técnica de inyectar fricción en la defensa cognitiva?", "o": ["Acelerar la velocidad del procesador", "Bloquear la respuesta automática del Sistema 1 y activar el Sistema 2", "Ocultar la dirección IP del usuario", "Cifrar el disco duro"], "c": [1], "e": "La fricción busca bloquear la respuesta automática del Sistema 1 y activar el Sistema 2, más analítico.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Qué principio de Cialdini se basa en la similitud y afinidad personal fingida por el atacante?", "o": ["Autoridad", "Simpatía", "Escasez", "Reciprocidad"], "c": [1], "e": "Simpatía: el atacante finge similitud y afinidad personal con la víctima.", "nota": ""}, {"id": "4.19", "t": 4, "n": 19, "q": "¿Qué sucede con el Sistema 2 cuando el atacante induce extrema urgencia y presión temporal?", "o": ["Se vuelve hipereficiente", "Es bloqueado o marginado, predominando el Sistema 1", "Se apaga el ordenador automáticamente", "No sufre ninguna alteración"], "c": [1], "e": "Bajo urgencia y presión temporal extremas, el Sistema 2 se bloquea o queda marginado y predomina el Sistema 1.", "nota": ""}, {"id": "4.20", "t": 4, "n": 20, "q": "¿Qué sesgo cognitivo lleva a sobreestimar la propia invulnerabilidad frente al fraude?", "o": ["Sesgo de confirmación", "Exceso de confianza (overconfidence bias)", "Efecto Dunning-Kruger", "Aversión a la pérdida"], "c": [1], "e": "El exceso de confianza (overconfidence bias) lleva a sobreestimar la propia invulnerabilidad al fraude.", "nota": ""}, {"id": "5.1", "t": 5, "n": 1, "q": "¿Qué diferencia principal existe entre el Agente Encubierto Virtual (AEV) y el Ciberpatrullaje?", "o": ["El AEV utiliza identidad supuesta en canales cerrados con engaño, mientras el Ciberpatrullaje opera en canales abiertos sin engaño", "El Ciberpatrullaje requiere autorización del Tribunal Supremo", "No existe ninguna diferencia jurídica", "El AEV solo puede investigar a menores de edad"], "c": [0], "e": "El AEV actúa con identidad supuesta y engaño en canales cerrados; el ciberpatrullaje opera en canales abiertos y sin engaño.", "nota": ""}, {"id": "5.2", "t": 5, "n": 2, "q": "¿Qué ocurre legalmente si un agente encubierto actúa como agente provocador (induciendo el delito)?", "o": ["La prueba es plenamente válida si se detiene al autor", "La figura es nula de pleno derecho y la prueba ilegítima", "Requiere una autorización especial del juez de guardia", "Se convierte automáticamente en testigo protegido"], "c": [1], "e": "Si el agente induce a cometer el delito deja de ser agente encubierto y pasa a ser provocador: la figura es nula de pleno derecho y la prueba, ilegítima.", "nota": ""}, {"id": "5.3", "t": 5, "n": 3, "q": "¿Qué artículos de la LECrim regulan específicamente la figura del agente encubierto y su autorización?", "o": ["Arts. 120 y 121", "Arts. 282 bis.4 y 588 ter a LECrim", "Arts. 500 y 501", "Arts. 10 y 15"], "c": [1], "e": "El agente encubierto y su autorización se regulan en los arts. 282 bis.4 y 588 ter a de la LECrim.", "nota": ""}, {"id": "5.4", "t": 5, "n": 4, "q": "¿Qué competencias psicológicas y de alto rendimiento se exigen para el perfil idóneo de AEV?", "o": ["Narcisismo extremo y agresividad verbal", "Estabilidad emocional, escrupulosidad y resistencia cognitiva", "Impulsividad y baja empatía", "Timidez y aislamiento social"], "c": [1], "e": "El perfil idóneo exige estabilidad emocional, escrupulosidad y resistencia cognitiva.", "nota": ""}, {"id": "5.5", "t": 5, "n": 5, "q": "¿Cómo se denomina la fricción cotidiana entre dos identidades operando en el mismo horario ('llevarse el trabajo a casa')?", "o": ["Tensión de rol (Role Strain)", "Disociación psicótica aguda", "Efecto Dunning-Kruger", "Fatiga de materiales"], "c": [0], "e": "La tensión de rol (role strain) es la fricción cotidiana entre dos identidades que operan en el mismo horario.", "nota": ""}, {"id": "5.6", "t": 5, "n": 6, "q": "¿Qué término describe el fenómeno donde el personaje ficticio ('sock puppet') coloniza a la persona real?", "o": ["Síndrome de Estocolmo", "Pérdida del yo y disociación", "Efecto Proteo benigno", "Inteligencia colectiva"], "c": [1], "e": "Cuando el personaje ficticio (sock puppet) coloniza a la persona real se produce una pérdida del yo y disociación.", "nota": ""}, {"id": "5.7", "t": 5, "n": 7, "q": "¿Qué teoría explica los errores humanos derivados de la complacencia en operaciones encubiertas?", "o": ["Flow Theory", "Teoría de Juegos", "Teoría General de la Relatividad", "Teoría del Apego"], "c": [0], "e": "La Flow Theory se aplica para explicar los errores derivados de la complacencia en operaciones encubiertas.", "nota": ""}, {"id": "5.8", "t": 5, "n": 8, "q": "¿Qué autor es citado por su teoría dramatúrgica (cruzar escenarios) aplicada a los riesgos operativos del AEV?", "o": ["Erving Goffman", "Max Weber", "Emile Durkheim", "Michel Foucault"], "c": [0], "e": "Erving Goffman y su teoría dramatúrgica (cruzar escenarios) explican los riesgos operativos del AEV.", "nota": ""}, {"id": "5.9", "t": 5, "n": 9, "q": "¿Qué elementos componen el Triángulo de Inversión Tecnológica Encubierta?", "o": ["Rápido, Barato y Seguro", "Confiable, Creíble y Respaldada", "Cifrado, Oculto y Anónimo", "Legal, Tecnológico y Humano"], "c": [1], "e": "El Triángulo de Inversión Tecnológica Encubierta exige una infraestructura confiable, creíble y respaldada.", "nota": ""}, {"id": "5.10", "t": 5, "n": 10, "q": "¿Cómo se denomina el mecanismo de aislamiento estratégico para proteger al agente encubierto?", "o": ["Búnker digital", "Pasillo estéril y Oficial de Cobertura", "Cortafuegos de red", "Zona desmilitarizada"], "c": [1], "e": "El aislamiento estratégico se logra con el pasillo estéril y el Oficial de Cobertura.", "nota": ""}, {"id": "5.11", "t": 5, "n": 11, "q": "¿Qué requiere la creación de identidades operativas en Virtual HUMINT?", "o": ["Un perfil gris coherente, gestión de selectores y OPSEC rigurosa", "Usar la verdadera identidad del agente en redes abiertas", "Comprar cuentas robadas en la Deep Web sin control", "Publicar fotos personales reales en Instagram"], "c": [0], "e": "Las identidades operativas requieren un perfil gris coherente, gestión de selectores y una OPSEC rigurosa.", "nota": ""}, {"id": "5.12", "t": 5, "n": 12, "q": "¿Cuál es el perfil psicológico y motivacional típico del hacker juvenil analizado en el temario?", "o": ["Crimen organizado transnacional con ánimo de lucro multimillonario", "Adolescentes con alta curiosidad y coeficiente intelectual, motivados por afiliación y reconocimiento", "Terrorismo internacional fundamentalista", "Sicarios digitales profesionales"], "c": [1], "e": "El hacker juvenil es un adolescente con alta curiosidad y coeficiente intelectual, motivado por afiliación y reconocimiento.", "nota": ""}, {"id": "5.13", "t": 5, "n": 13, "q": "¿Qué directrices internacionales se mencionan como referencia para el perfil y formación de agentes encubiertos?", "o": ["Directrices del FBI americano exclusivamente", "Directrices del College of Policing (APP) británico", "Normas ISO de ciberseguridad industrial", "Protocolos de la Interpol para Interpol"], "c": [1], "e": "Como referencia internacional se cita las directrices del College of Policing británico (APP).", "nota": ""}, {"id": "5.14", "t": 5, "n": 14, "q": "¿Qué permite el AEV en relación con el intercambio de archivos e indagaciones?", "o": ["Cualquier actuación ilimitada sin control judicial", "El intercambio controlado de archivos mediante códigos Hash y encuentros físicos autorizados", "Vender drogas en la Dark Web para ganar confianza", "Hackear sistemas críticos sin previo aviso"], "c": [1], "e": "El AEV permite el intercambio controlado de archivos mediante códigos hash y encuentros físicos autorizados.", "nota": ""}, {"id": "5.15", "t": 5, "n": 15, "q": "¿Qué diferencia al AEV respecto al agente encubierto clásico (AEF) en cuanto al tipo de delincuencia?", "o": ["El AEV solo investiga terrorismo", "El AEF solo investiga crimen organizado, mientras el AEV investiga también a delincuentes individuales (numerus apertus)", "El AEV no requiere autorización judicial", "Son exactamente idénticos"], "c": [1], "e": "El agente encubierto clásico (AEF) investiga crimen organizado; el AEV investiga también a delincuentes individuales (numerus apertus).", "nota": ""}, {"id": "5.16", "t": 5, "n": 16, "q": "¿Qué dinámicas operativas se emplean en Virtual HUMINT según el temario?", "o": ["La ley del espejo, la doctrina de la sombra y el dominio preciso del argot criminal", "Fuerza bruta y ataques DDoS", "Llamadas telefónicas amenazantes", "Cartas anónimas impresas"], "c": [0], "e": "Virtual HUMINT emplea la ley del espejo, la doctrina de la sombra y el dominio del argot criminal.", "nota": ""}, {"id": "5.17", "t": 5, "n": 17, "q": "¿Qué riesgo operativo se asocia a la 'normalización de la desviación' en infiltraciones prolongadas?", "o": ["Que el agente olvide cómo encender el ordenador", "Que el agente comience a asumir como normales conductas ilícitas graves de su entorno investigado", "Que se estropee el cifrado de las comunicaciones", "Que el juez revoque la autorización por error administrativo"], "c": [1], "e": "La normalización de la desviación hace que el agente asuma como normales conductas ilícitas graves de su entorno.", "nota": ""}, {"id": "5.18", "t": 5, "n": 18, "q": "¿Qué tipo de canales investiga exclusivamente el Agente Encubierto Virtual?", "o": ["Canales abiertos de redes sociales", "Canales cerrados (chats privados, foros restringidos, Dark Web)", "Televisión por cable", "Emisoras de radio FM"], "c": [1], "e": "El AEV investiga exclusivamente canales cerrados: chats privados, foros restringidos y Dark Web.", "nota": ""}, {"id": "5.19", "t": 5, "n": 19, "q": "¿Qué enfoque se exige para el abordaje del hacker juvenil en lugar del castigo puramente punitivo?", "o": ["Expulsión definitiva del sistema educativo y social", "Prevención educativa, rol familiar y respuestas rehabilitadoras", "Inhabilitación vitalicia para usar tecnología", "Multas económicas confiscatorias a los menores"], "c": [1], "e": "Para el hacker juvenil se exige prevención educativa, rol familiar y respuestas rehabilitadoras, no solo castigo.", "nota": ""}, {"id": "5.20", "t": 5, "n": 20, "q": "¿Qué principio legal rige la autorización judicial de un AEV?", "o": ["Principio de oportunidad y rapidez", "Principio de proporcionalidad (idoneidad, necesidad y proporcionalidad en sentido estricto)", "Principio de secreto sumarial absoluto", "Principio de libre discrecionalidad policial"], "c": [1], "e": "La autorización judicial del AEV se rige por el principio de proporcionalidad: idoneidad, necesidad y proporcionalidad en sentido estricto.", "nota": ""}, {"id": "6.1", "t": 6, "n": 1, "q": "¿Qué propiedades fundamentales garantiza la criptografía en la seguridad de la información?", "o": ["Velocidad, compresión y almacenamiento", "Confidencialidad, integridad, autenticación y no repudio", "Conectividad, ancho de banda y latencia baja", "Virtualización y redundancia"], "c": [1], "e": "La criptografía garantiza confidencialidad, integridad, autenticación y no repudio.", "nota": ""}, {"id": "6.2", "t": 6, "n": 2, "q": "¿Qué establece el paradigma de Auguste Kerckhoffs en el diseño de criptosistemas?", "o": ["Que el algoritmo debe mantenerse en secreto absoluto bajo llave", "Que un criptosistema debe ser seguro aunque todo el sistema sea público a excepción de la clave", "Que solo se deben usar claves de 8 bits", "Que la criptografía simétrica es obsoleta"], "c": [1], "e": "Kerckhoffs: un criptosistema debe ser seguro aunque todo sea público excepto la clave.", "nota": ""}, {"id": "6.3", "t": 6, "n": 3, "q": "¿Cómo se denomina el principio que rechaza categóricamente Kerckhoffs?", "o": ["Seguridad por oscuridad u ocultación", "Cifrado en bloque iterativo", "Seguridad computacional basada en complejidad", "Función hash unidireccional"], "c": [0], "e": "Kerckhoffs rechaza la seguridad por oscuridad u ocultación, es decir, basar la seguridad en el secreto del diseño.", "nota": ""}, {"id": "6.4", "t": 6, "n": 4, "q": "¿Qué criptosistema teórico ofrece 'secreto perfecto' incondicional según Claude Shannon?", "o": ["AES-256", "RSA de 4096 bits", "Cifrado de Vernam (One-Time Pad - OTP)", "DES triple"], "c": [2], "e": "El cifrado de Vernam (One-Time Pad) es el único con secreto perfecto incondicional, según Shannon.", "nota": ""}, {"id": "6.5", "t": 6, "n": 5, "q": "¿Qué función lógica se emplea en el Cifrado de Vernam para combinar el mensaje y la clave?", "o": ["AND lógico", "OR inclusivo", "XOR (O exclusivo)", "NOT bit a bit"], "c": [2], "e": "Vernam combina mensaje y clave con XOR (O exclusivo).", "nota": ""}, {"id": "6.6", "t": 6, "n": 6, "q": "¿Qué requisitos exige el One-Time Pad (OTP) para garantizar secreto perfecto?", "o": ["Clave reutilizable y corta", "Aleatoriedad genuina, longitud equivalente al mensaje, uso único y secretismo absoluto", "Claves públicas distribuidas por internet", "Procesadores cuánticos de alta velocidad"], "c": [1], "e": "Para el secreto perfecto el OTP exige aleatoriedad genuina, clave tan larga como el mensaje, uso único y secreto absoluto.", "nota": ""}, {"id": "6.7", "t": 6, "n": 7, "q": "¿Cómo se divide la criptografía simétrica computacional según su arquitectura de procesamiento?", "o": ["Cifrado en Flujo y Cifrado en Bloque", "Cifrado lineal y Cifrado cuántico", "Cifrado público y Cifrado privado", "Cifrado estático y Cifrado dinámico"], "c": [0], "e": "Según su arquitectura de procesamiento, la criptografía simétrica se divide en cifrado en flujo y cifrado en bloque.", "nota": ""}, {"id": "6.8", "t": 6, "n": 8, "q": "¿Qué característica principal define al Cifrado en Flujo?", "o": ["Procesa bloques fijos de 128 bits simultáneamente", "Procesa el texto claro bit a bit o byte a byte de forma continua", "Requiere obligatoriamente claves de 2048 bits", "Es totalmente invulnerable a cualquier ataque matemático"], "c": [1], "e": "El cifrado en flujo procesa el texto claro bit a bit o byte a byte de forma continua.", "nota": ""}, {"id": "6.9", "t": 6, "n": 9, "q": "¿Qué vulnerabilidad matemática sufren los registros de desplazamiento con retroalimentación lineal (LFSR)?", "o": ["Linealidad matemática, permitiendo el ataque de Berlekamp-Massey", "Incapacidad total para generar ceros", "Consumo excesivo de memoria RAM", "Bloqueo permanente del procesador"], "c": [0], "e": "Los LFSR son lineales, lo que permite reconstruirlos con el ataque de Berlekamp-Massey.", "nota": ""}, {"id": "6.10", "t": 6, "n": 10, "q": "¿Qué arquitectura iterativa divide el bloque en dos mitades (L, R) y garantiza auto reversibilidad matemática?", "o": ["Estructura de Feistel", "Red de Sustitución-Permutación (SPN)", "Algoritmo RSA", "Curva elíptica ECDSA"], "c": [0], "e": "La estructura de Feistel divide el bloque en dos mitades (L, R) y es auto-reversible.", "nota": ""}, {"id": "6.11", "t": 6, "n": 11, "q": "¿Cuál era la longitud efectiva de clave del algoritmo DES original tras descartar los bits de paridad?", "o": ["128 bits", "56 bits", "256 bits", "64 bits"], "c": [1], "e": "DES usa claves de 64 bits, pero 8 son de paridad: la longitud efectiva es de 56 bits.", "nota": ""}, {"id": "6.12", "t": 6, "n": 12, "q": "¿Qué esquema adoptó el 3DES (Triple DES) para superar la obsolescencia de DES?", "o": ["Esquema EDE (Encrypt-Decrypt-Encrypt) con 168 bits de clave efectiva", "Esquema CBC con clave única de 32 bits", "Doble cifrado simétrico en flujo", "Cifrado asimétrico híbrido"], "c": [0], "e": "3DES aplica el esquema EDE (Encrypt-Decrypt-Encrypt) con 168 bits de clave efectiva (3×56).", "nota": ""}, {"id": "6.13", "t": 6, "n": 13, "q": "¿Qué arquitectura emplea el Advanced Encryption Standard (AES) / Rijndael?", "o": ["Estructura de Feistel clásica", "Red de Sustitución-Permutación (SPN)", "Cifrado en flujo basado en LFSR", "Esquema de clave pública RSA"], "c": [1], "e": "AES/Rijndael usa una red de sustitución-permutación (SPN), no una estructura Feistel.", "nota": ""}, {"id": "6.14", "t": 6, "n": 14, "q": "¿Qué tamaños de clave soporta oficialmente el algoritmo AES?", "o": ["Solo 64 bits", "128, 192 o 256 bits", "512 y 1024 bits exclusivamente", "Cualquier número impar de bits"], "c": [1], "e": "AES admite claves de 128, 192 o 256 bits.", "nota": ""}, {"id": "6.15", "t": 6, "n": 15, "q": "¿Cuántas rondas de cifrado ejecuta AES cuando se utiliza una clave de 256 bits?", "o": ["10 rondas", "12 rondas", "14 rondas", "16 rondas"], "c": [2], "e": "AES ejecuta 10, 12 o 14 rondas según la clave sea de 128, 192 o 256 bits; con 256 son 14.", "nota": ""}, {"id": "6.16", "t": 6, "n": 16, "q": "¿Cuáles son las cuatro transformaciones por ronda que realiza el algoritmo AES?", "o": ["AND, OR, XOR, NOT", "SubBytes, ShiftRows, MixColumns y AddRoundKey", "Permutación, Compresión, Hash y Firma", "División, Multiplicación, Suma y Resta"], "c": [1], "e": "Las cuatro transformaciones por ronda son SubBytes, ShiftRows, MixColumns y AddRoundKey.", "nota": ""}, {"id": "6.17", "t": 6, "n": 17, "q": "¿Qué transformación de AES proporciona confusión matemática mediante una caja S-Box no lineal?", "o": ["SubBytes", "ShiftRows", "MixColumns", "AddRoundKey"], "c": [0], "e": "SubBytes, con su S-Box no lineal, aporta la confusión.", "nota": ""}, {"id": "6.18", "t": 6, "n": 18, "q": "¿Por qué el modo de operación ECB (Electronic Codebook) se considera inseguro para cifrar mensajes largos?", "o": ["Porque es demasiado lento", "Porque bloques idénticos de texto claro generan bloques idénticos de texto cifrado, revelando patrones", "Porque requiere claves de un solo uso", "Porque no permite el descifrado"], "c": [1], "e": "En ECB bloques idénticos de texto claro generan bloques idénticos de texto cifrado, revelando patrones.", "nota": ""}, {"id": "6.19", "t": 6, "n": 19, "q": "¿Qué incorpora el modo CBC (Cipher Block Chaining) para evitar los patrones repetitivos de ECB?", "o": ["Un Vector de Inicialización (IV) y encadenamiento XOR con el bloque anterior", "Un sistema de compresión de archivos ZIP", "Claves asimétricas dinámicas", "Un registro LFSR binario"], "c": [0], "e": "CBC incorpora un vector de inicialización (IV) y encadena cada bloque con el anterior mediante XOR.", "nota": ""}, {"id": "6.20", "t": 6, "n": 20, "q": "¿Qué modo de operación convierte un cifrado en bloque en un cifrado en flujo permitiendo procesamiento paralelo masivo?", "o": ["ECB", "CBC", "CTR (Contador)", "PKCS#5"], "c": [2], "e": "CTR (contador) convierte un cifrado en bloque en uno en flujo y permite procesamiento en paralelo.", "nota": ""}];
const KEY='asig03_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
</body>
</html>
