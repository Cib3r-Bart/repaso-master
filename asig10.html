const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "¿Cuáles son los tres elementos que separan el hacking ético del hacking malicioso?", "o": ["Herramientas, objetivo y presupuesto", "Autorización, legalidad e intención", "Nacionalidad, edad y formación", "Velocidad, sigilo y coste"], "c": [1], "e": "Lo que separa el hacking ético del malicioso son tres elementos: autorización, legalidad e intención.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "¿Qué distingue conceptualmente al 'hacker' del 'cracker'?", "o": ["El hacker usa herramientas más modernas", "El cracker busca la excelencia técnica por pasión", "El cracker utiliza sus habilidades con fines destructivos, comerciales o delictivos", "No existe ninguna diferencia real"], "c": [2], "e": "El cracker usa sus habilidades con fines destructivos, comerciales o delictivos; el hacker las usa por excelencia técnica y pasión.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "En la taxonomía de los 'hats', ¿qué perfil tiene autorización sí e intención ética?", "o": ["Black hat", "Grey hat", "White hat", "Blue hat"], "c": [2], "e": "El white hat tiene autorización y actúa con intención ética.", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "¿Qué perfil opera sin autorización pero con intención ética o ambigua?", "o": ["Grey hat", "White hat", "Red hat", "Script kiddie"], "c": [0], "e": "El grey hat opera sin autorización pero con intención ética o ambigua.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "¿A qué perfil corresponden los investigadores curiosos vinculados a programas de recompensas (bug bounty)?", "o": ["Blue hat", "Black hat", "Insider threat", "Orange Team"], "c": [0], "e": "Los blue hat son investigadores curiosos vinculados a programas de recompensas (bug bounty).", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "¿Qué nombre recibe el personal interno o terceros con acceso legítimo que abusan de sus permisos?", "o": ["Hacktivista", "Insider threat", "APT", "Script kiddie"], "c": [1], "e": "Insider threat es el personal interno o tercero con acceso legítimo que abusa de sus permisos.", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "¿Qué caracteriza principalmente a una APT (Advanced Persistent Threat)?", "o": ["Uso exclusivo de herramientas automatizadas de terceros", "Actuar únicamente por motivación ideológica", "Avanzada, persistente y constituir una amenaza, con presencia prolongada y sigilosa", "Ataques de denegación de servicio puntuales"], "c": [2], "e": "APT = Advanced Persistent Threat: avanzada, persistente y una amenaza, con presencia prolongada y sigilosa.", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "¿Qué modelo de negocio describe al 'crimen organizado' en el ámbito del ransomware?", "o": ["Bug bounty", "RaaS (Ransomware as a Service)", "Red team as a Service", "Hacktivismo corporativo"], "c": [1], "e": "El crimen organizado en ransomware opera con el modelo RaaS (Ransomware as a Service).", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "¿Cómo se define la 'vulnerabilidad' en la terminología técnica del tema?", "o": ["La probabilidad de que una amenaza se materialice", "Una debilidad o falta de control de un activo explotable por una amenaza", "El código que aprovecha un fallo concreto", "La parte del exploit que ejecuta la acción maliciosa"], "c": [1], "e": "Una vulnerabilidad es una debilidad o falta de control de un activo que una amenaza puede explotar.", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "¿Cómo se calcula el riesgo según la fórmula básica del tema?", "o": ["Riesgo = Amenaza + Vulnerabilidad", "Riesgo = Probabilidad × Impacto", "Riesgo = Severidad / Confianza", "Riesgo = Exploit × Payload"], "c": [1], "e": "El riesgo básico se calcula como Probabilidad × Impacto.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "¿Qué es el 'payload' en un exploit?", "o": ["El fallo de configuración explotado", "La base de conocimiento de tácticas de ataque", "La parte que ejecuta la acción maliciosa o de control, p. ej. una reverse shell", "El informe final de la auditoría"], "c": [2], "e": "El payload es la parte del exploit que ejecuta la acción maliciosa o de control, por ejemplo una reverse shell.", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "¿Qué marco de referencia europeo rige los ejercicios de simulación de adversarios tipo Red/Blue/Purple Team?", "o": ["TIBER-EU Framework", "OWASP WSTG", "NIST SP 800-30", "ENS"], "c": [0], "e": "TIBER-EU es el marco europeo que rige los ejercicios de simulación de adversarios Red/Blue/Purple Team.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "¿Qué equipo se encarga de la defensa y detección temprana en un ejercicio TIBER-EU?", "o": ["Red Team", "Blue Team", "White Team", "Purple Team"], "c": [1], "e": "El Blue Team se encarga de la defensa y la detección temprana.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "¿Qué equipo hace trabajar juntos a Red y Blue para que las técnicas ofensivas sean detectables?", "o": ["Purple Team", "Yellow Team", "Orange Team", "Green Team"], "c": [0], "e": "El Purple Team hace trabajar juntos a Red y Blue para que las técnicas ofensivas sean detectables.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "¿Qué equipo está formado por desarrolladores orientados a DevSecOps?", "o": ["White Team", "Green Team", "Yellow Team", "Orange Team"], "c": [2], "e": "El Yellow Team está formado por desarrolladores orientados a DevSecOps.", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Qué documento constituye la base de conocimientos de tácticas y técnicas de ataque empleada por el Red Team?", "o": ["PTES", "MITRE ATT&CK", "OWASP Top 10", "ENS"], "c": [1], "e": "MITRE ATT&CK es la base de conocimientos de tácticas y técnicas de ataque que usa el Red Team.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "En la pirámide de Kelsen aplicada al marco jurídico español, ¿qué ocupa la cúspide?", "o": ["Los reales decretos técnicos", "Las leyes orgánicas estatales", "Los derechos fundamentales de la Constitución Española", "La normativa europea"], "c": [2], "e": "En la pirámide de Kelsen, la cúspide la ocupan los derechos fundamentales de la Constitución Española.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "¿Qué artículo de la Constitución Española recoge la misión de las Fuerzas y Cuerpos de Seguridad?", "o": ["Art. 18 CE", "Art. 33 CE", "Art. 104 CE", "Art. 197 CE"], "c": [2], "e": "El art. 104 CE recoge la misión de las Fuerzas y Cuerpos de Seguridad.", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "¿Qué pena establece el art. 197.1 CP para la interceptación de comunicaciones y el apoderamiento de documentos ajenos?", "o": ["Multa administrativa únicamente", "Prisión de uno a cuatro años y multa de doce a veinticuatro meses", "Prisión de seis meses a dos años", "Inhabilitación profesional"], "c": [1], "e": "El art. 197.1 CP castiga con prisión de uno a cuatro años y multa de doce a veinticuatro meses.", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "¿Qué novedad introdujo el art. 197 bis CP respecto al vacío legal existente hasta 2015?", "o": ["Despenalizó el acceso sin daño a un sistema", "Tipificó el mero acceso no autorizado a un sistema, aunque no se cause daño", "Reguló exclusivamente los daños a infraestructuras críticas", "Creó el delito de ciberacoso"], "c": [1], "e": "El art. 197 bis CP tipificó el mero acceso no autorizado a un sistema, aunque no se cause daño, cubriendo el vacío hasta 2015.", "nota": ""}, {"id": "2.1", "t": 2, "n": 1, "q": "¿Qué modelo de seguridad perimetral consideraba todo lo interior de la LAN como de confianza absoluta?", "o": ["Zero Trust Network Access", "Castle and Moat", "SASE", "SD-WAN"], "c": [1], "e": "El modelo Castle and Moat trataba todo lo interior de la LAN como de confianza absoluta.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Qué efecto describe el enrutamiento obligatorio del tráfico de sedes remotas hacia el centro de datos central para su inspección?", "o": ["Trombone Routing", "Double Tagging", "Pivoting", "VLAN Hopping"], "c": [0], "e": "El trombone routing enruta obligatoriamente el tráfico de sedes remotas al centro de datos central para inspeccionarlo.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Qué paradigma de seguridad actual se resume en 'nunca confíes, siempre verifica'?", "o": ["Castle and Moat", "SASE", "Zero Trust Network Access (ZTNA)", "NAC 802.1X"], "c": [2], "e": "Zero Trust Network Access (ZTNA) se resume en «nunca confíes, siempre verifica».", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Qué arquitectura traslada la pila de seguridad (proxies, firewalls, DLP) a la nube para inspeccionar el tráfico con independencia de la ubicación?", "o": ["SASE (Secure Access Service Edge)", "Castle and Moat", "VPN tradicional", "NAC"], "c": [0], "e": "SASE traslada la pila de seguridad (proxies, firewalls, DLP) a la nube para inspeccionar el tráfico cerca del usuario.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Qué técnica de reconocimiento pasivo permite inferir distancias de red analizando TTL y tráfico broadcast?", "o": ["Traceroute activo", "Escaneo con fragmentación", "Escucha de ARP/LLMNR/mDNS", "Domain Fronting"], "c": [2], "e": "La escucha pasiva de ARP/LLMNR/mDNS (con TTL y broadcast) permite inferir distancias y topología sin generar tráfico propio.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Qué técnica permite clonar un dispositivo exento de autenticación fuerte para evadir el control NAC/MAB?", "o": ["MAC Spoofing", "VLAN Hopping", "Pass-the-hash", "Kerberoasting"], "c": [0], "e": "El MAC spoofing clona un dispositivo exento de autenticación fuerte para evadir NAC/MAB.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Qué técnica usa dos etiquetas 802.1Q para saltar de una VLAN de invitados a la red corporativa?", "o": ["Double Tagging (VLAN Hopping)", "MAC Spoofing", "HTTP Request Smuggling", "Domain Fronting"], "c": [0], "e": "El double tagging (VLAN hopping) usa dos etiquetas 802.1Q para saltar de una VLAN de invitados a la corporativa.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "¿Qué nombre recibe el uso de un equipo comprometido en una zona expuesta como puente hacia la red interna?", "o": ["Pivoting", "Fingerprinting", "Spoofing", "Hardening"], "c": [0], "e": "Pivoting es usar un equipo comprometido en una zona expuesta como puente hacia la red interna.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Qué herramientas se citan como ejemplo para crear túneles SOCKS cifrados en el pivoting?", "o": ["Nmap y Wireshark", "chisel y ligolo", "Burp Suite y ffuf", "Shodan y Censys"], "c": [1], "e": "chisel y ligolo crean túneles SOCKS cifrados en el pivoting.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "¿Qué técnica de evasión de WAF/IPS se basa en dividir una petición HTTP de forma ambigua para el servidor?", "o": ["HTTP Request Smuggling", "MAC Spoofing", "Domain Fronting", "Unhooking"], "c": [0], "e": "HTTP Request Smuggling divide una petición HTTP de forma ambigua para evadir WAF/IPS.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Qué nombre reciben las técnicas que abusan de PowerShell, WMI o mshta para evitar escribir malware en disco y evadir EDR?", "o": ["Living off the Land (LotL)", "Fileless unhooking", "Sandbox evasion", "Breadcrumbing"], "c": [0], "e": "Living off the Land (LotL) abusa de herramientas legítimas (PowerShell, WMI, mshta) para evitar escribir malware en disco.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Qué motores se citan como referencia para detectar Shadow IT y servidores olvidados en el análisis OASM?", "o": ["Shodan y Censys", "Burp Suite y ffuf", "Nmap y Wireshark", "chisel y ligolo"], "c": [0], "e": "Shodan y Censys son los motores de referencia para detectar Shadow IT y servidores olvidados en el OASM.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿Qué tipo de redes, características en entornos policiales y críticos, se atacan típicamente con vectores físicos como BadUSB?", "o": ["Redes SASE", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "¿Qué significa realmente que Nmap reporte 'Host is up'?", "o": ["Que el equipo está completamente parcheado", "Que Nmap recibió algún tipo de respuesta a su sondeo", "Que todos los puertos están abiertos", "Que el firewall está desactivado"], "c": [1], "e": "«Host is up» solo indica que Nmap recibió algún tipo de respuesta a su sondeo, no que todo esté abierto.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Qué comprobación puede descubrir activos adicionales que no respondían a un sondeo ICMP previo?", "o": ["Repetir el mismo escaneo ICMP varias veces", "Cambiar la técnica de sondeo, por ejemplo a una sonda TCP SYN (-PS445)", "Aumentar el tiempo de espera sin cambiar de técnica", "Desactivar el escaneo de puertos"], "c": [1], "e": "Cambiar la técnica de sondeo (p. ej. a TCP SYN con -PS445) puede revelar activos que no respondían a ICMP.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Qué técnica de escaneo TCP de Nmap completa el handshake de tres vías?", "o": ["Connect scan (-sT)", "SYN scan (-sS)", "UDP scan (-sU)", "NULL scan"], "c": [0], "e": "El connect scan (-sT) completa el handshake de tres vías; el SYN scan (-sS) no.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Qué estado de puerto corresponde a una respuesta SYN/ACK en un escaneo TCP?", "o": ["closed", "filtered", "open", "open|filtered"], "c": [2], "e": "Una respuesta SYN/ACK indica puerto open.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Qué estado de puerto corresponde a la ausencia de respuesta tras varios reintentos?", "o": ["open", "closed", "filtered", "Ninguno; siempre hay respuesta"], "c": [2], "e": "La ausencia de respuesta tras varios reintentos se reporta como filtered.", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿Cuándo aparece el estado 'open|filtered' en un escaneo?", "o": ["Cuando el puerto responde con RST", "Cuando no hay respuesta tras reintentos y no puede distinguirse entre abierto y filtrado (típico en UDP)", "Cuando el puerto está cerrado con certeza", "Cuando se usa exclusivamente el connect scan"], "c": [1], "e": "open|filtered aparece cuando no hay respuesta y no se distingue entre abierto y filtrado (típico en UDP).", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Qué opción de Nmap sondea el producto y la versión de un servicio?", "o": ["-O", "-sV", "-Pn", "-A únicamente para SO"], "c": [1], "e": "La opción -sV sondea producto y versión del servicio.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿Qué indica el resultado 'JUST GUESSING' al identificar un sistema operativo con Nmap?", "o": ["Una coincidencia exacta y confirmada", "Una estimación sin coincidencia exacta en la base de huellas", "Que el escaneo ha fallado por completo", "Que el puerto está filtrado"], "c": [1], "e": "«JUST GUESSING» indica una estimación sin coincidencia exacta en la base de huellas.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "¿Qué elemento puede distorsionar la fiabilidad del fingerprinting cuando varios sitios comparten una misma IP?", "o": ["La cabecera Host y el SNI, que hay que revisar con atención", "El número de puertos abiertos", "La versión del kernel", "El tamaño del paquete ICMP"], "c": [0], "e": "Cuando varios sitios comparten IP, hay que revisar con atención la cabecera Host y el SNI, que pueden distorsionar el fingerprinting.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "¿Qué motor de scripts de Nmap permite ampliar la enumeración con más de 600 scripts organizados en categorías?", "o": ["NSE (Nmap Scripting Engine)", "OWASP WSTG", "MITRE ATT&CK", "PTES"], "c": [0], "e": "NSE (Nmap Scripting Engine) amplía la enumeración con más de 600 scripts por categorías.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Qué categoría de scripts NSE se asocia típicamente a la detección de vulnerabilidades?", "o": ["safe", "vuln", "broadcast", "external"], "c": [1], "e": "La categoría vuln agrupa los scripts de detección de vulnerabilidades.", "nota" enta es la referencia para interceptar y manipular peticiones HTTP en pruebas de hacking web?", "o": ["Burp Suite", "Wireshark", "Nmap", "Shodan"], "c": [0], "e": "Burp Suite es la referencia para interceptar y manipular peticiones HTTP.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Cuál es el primer antecedente histórico del malware, considerado el primer gusano de la historia (1971)?", "o": ["Morris worm", "Creeper", "ILOVEYOU", "WannaCry"], "c": [1], "e": "Creeper (1971) es el primer antecedente de malware, considerado el primer gusano.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Qué gusano de 2000 se autoenviaba por correo y colapsó servidores en todo el mundo?", "o": ["ILOVEYOU", "Creeper", "Morris worm", "Samy"], "c": [0], "e": "ILOVEYOU (2000) se autoenviaba por correo y colapsó servidores en todo el mundo.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué tipo de malware espía al usuario sin su conocimiento (contraseñas, cámara, micrófono)?", "o": ["Adware", "Spyware", "Botnet", "Gusano"], "c": [1], "e": "El spyware espía al usuario sin su conocimiento (contraseñas, cámara, micrófono).", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "¿Qué software espía desarrollado por el grupo israelí NSO se cita como caso real de spyware?", "o": ["Pegasus", "Carbanak", "WannaCry", "Ryuk"], "c": [0], "e": "Pegasus, del grupo israelí NSO, es el caso de spyware citado.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "¿Qué exploit de la NSA aprovechó el ransomware WannaCry (2017)?", "o": ["EternalBlue", "Log4Shell", "regreSSHion", "Heartbleed"], "c": [0], "e": "WannaCry (2017) aprovechó el exploit de la NSA EternalBlue.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Qué APT real (2014) sustrajo unos 1.000 millones de dólares de unas 100 instituciones financieras en 30 países?", "o": ["Carbanak", "Colonial Pipeline", "SEPE/Ryuk", "Anthropic cyberespionage"], "c": [0], "e": "Carbanak (2014) sustrajo unos 1.000 millones de dólares de unas a controlada y repetible, con permiso y método.", "nota": ""}, {"id": "5.4", "t": 5, "n": 4, "q": "¿Qué tipo de auditoría simula el riesgo desde dentro de la red, con credenciales de un usuario legítimo?", "o": ["Externa", "Interna", "Inalámbrica", "En la nube"], "c": [1], "e": "La auditoría interna simula el riesgo desde dentro de la red con credenciales de un usuario legítimo.", "nota": ""}, {"id": "5.5", "t": 5, "n": 5, "q": "¿Qué tipo de auditoría prueba la inyección de prompt/jailbreak y el abuso de agentes, con referencia al OWASP LLM Top 10?", "o": ["De seguridad de IA", "Red team", "Web y de APIs", "Inalámbrica"], "c": [0], "e": "La auditoría de seguridad de IA prueba inyección de prompt, jailbreak y abuso de agentes (OWASP LLM Top 10).", "nota": ""}, {"id": "5.6", "t": 5, "n": 6, "q": "¿Qué modalidad de caja ofrece solo el nombre o la URL del objetivo, sin credenciales, con máximo realismo?", "o": ["Caja negra", "Caja gris", "Caja blanca", "Caja transparente"], "c": [0], "e": "En caja negra solo se dispone del nombre o URL del objetivo, sin credenciales: máximo realismo.", "nota": ""}, {"id": "5.7", "t": 5, "n": 7, "q": "¿Qué modalidad de caja es la más usada en la práctica por su equilibrio entre realismo y cobertura?", "o": ["Caja negra", "Caja gris", "Caja blanca", "Ninguna; siempre se usa caja negra"], "c": [1], "e": "La caja gris es la más usada por su equilibrio entre realismo y cobertura.", "nota": ""}, {"id": "5.8", "t": 5, "n": 8, "q": "¿Qué modalidad de caja ofrece código fuente, configuraciones y credenciales, con máxima cobertura por hora de trabajo?", "o": ["Caja negra", "Caja gris", "Caja blanca", "Caja mixta"], "c": [2], "e": "La caja blanca ofrece código fuente, configuraciones y credenciales, con máxima cobertura por hora de trabajo.", "nota": ""}, {"id": "5.9", "t": 5, "n": 9, "q": "¿Qué significa, según el tema, que un activo esté 'fuera de alcance'?", "o": ["Que es menos importante para el cliente", "Que es terreno no autorizado, cuya intrusión puede ser ilícita aunque pertenezca al mismo cliente", "Que no requiere documentación", "Que se puede auditar sin restricciones horarias"], "c": [1], "e": "«Fuera de alcance» es terreno no autorizado: intrusionar puede ser ilícito aunque el activo sea del mismo cliente.", "nota": ""}, {"id": "5.10", "t": 5, "n": 10, "q": "¿Qué documento fija qué se puede y no se puede hacer, cuándo, desde qué IP y hasta dónde llegar en una auditoría?", "o": ["El informe ejecutivo", "Las Reglas de Engagement (RoE)", "El plan de remediación", "La matriz de vulnerabilidades"], "c": [1], "e": "Las Reglas de Engagement (RoE) fijan qué se puede y no se puede hacer, cuándo, desde qué IP y hasta dónde llegar.", "nota": ""}, {"id": "5.11", "t": 5, "n": 11, "q": "¿Qué estándar describe el proceso completo de un pentest en siete fases, desde interacciones previas hasta el informe?", "o": ["PTES", "OSSTMM", "NIST SP 800-115", "OWASP WSTG"], "c": [0], "e": "PTES describe el pentest completo en siete fases, de las interacciones previas al informe.", "nota": ""}, {"id": "5.12", "t": 5, "n": 12, "q": "¿Qué metodología mide la seguridad operativa mediante métricas (RAVs) a través de cinco canales interconectados?", "o": ["PTES", "OSSTMM", "OWASP", "NIST SP 800-115"], "c": [1], "e": "OSSTMM mide la seguridad operativa mediante métricas (RAVs) a través de cinco canales.", "nota": ""}, {"id": "5.13", "t": 5, "n": 13, "q": "¿Qué guía es la referencia técnica oficial para auditar sector público e infraestructuras críticas en EE. UU.?", "o": ["NIST SP 800-115", "OSSTMM", "PTES", "OWASP WSTG"], "c": [0], "e": "NIST SP 800-115 es la guía técnica oficial para auditar el sector público y las infraestructuras críticas en EE. UU.", "nota": ""}, {"id": "5.14", "t": 5, "n": 14, "q": "¿Cuántas categorías organiza la OWASP WSTG para sus más de 100 pruebas?", "o": ["Siete", "Once", "Quince", "Cinco"], "c": [1], "e": "OWASP WSTG organiza sus más de 100 pruebas en once categorías.", "nota": ""}, {"id": "5.15", "t": 5, "n": 15, "q": "Según la regla práctica del tema, ¿qué aporta cada metodología?", "o": ["PTES marca el orden; OWASP, el detalle técnico; NIST, el formato institucional; OSSTMM, la medida", "Todas las metodologías son intercambiables y redundantes", "Solo PTES es necesario; el resto son opcionales", "NIST sustituye completamente a PTES"], "c": [0], "e": "PTES marca el orden; OWASP, el detalle técnico; NIST, el formato institucional; y OSSTMM, la medida.", "nota": ""}, {"id": "5.16", "t": 5, "n": 16, "q": "En el caso Sorcery, ¿qué descubrió el fuzzing de la cabecera Host (con ffuf)?", "o": ["Un subdominio no publicado en el DNS (git.sorcery.htb)", "Una contraseña en texto claro", "Un puerto UDP abierto", "Un certificado caducado"], "c": [0], "e": "El fuzzing de la cabecera Host con ffuf descubrió un subdominio no publicado en el DNS (git.sorcery.htb).", "nota": ""}, {"id": "5.17", "t": 5, "n": 17, "q": "¿Qué convirtió la auditoría del caso Sorcery de caja negra a caja blanca?", "o": ["La clonación del repositorio Gitea, que reveló el código fuente del backend", "Un escaneo de puertos adicional", "La obtención de credenciales de administrador por fuerza bruta", "Un ataque de phishing"], "c": [0], "e": "Clonar el repositorio Gitea reveló el código fuente del backend y convirtió la auditoría de caja negra en caja blanca.", "nota": ""}, {"id": "5.18", "t": 5, "n": 18, "q": "¿Qué vulnerabilidad se encontró en la ruta /producto/<id> del backend de Sorcery?", "o": ["Inyección SQL clásica", "Inyección Cypher (CWE-74) en la base de datos Neo4j", "Cross-Site Scripting", "Path Traversal"], "c": [1], "e": "En /producto/<id> se halló una inyección Cypher (CWE-74) en la base de datos Neo4j.", "nota": ""}, {"id": "5.19", "t": 5, "n": 19, "q": "¿Qué vulnerabilidad del panel de depuración de Sorcery se combinó con Kafka para lograr RCE?", "o": ["SSRF (Server-Side Request Forgery, CWE-918)", "CSRF", "IDOR", "XXE"], "c": [0], "e": "Un SSRF (CWE-918) en el panel de depuración, combinado con Kafka, permitió lograr RCE.", "nota": ""}, {"id": "5.20", "t": 5, "n": 20, "q": "¿Para qué sirve la 'matriz de vulnerabilidades' final del caso Sorcery?", "o": ["Es la entrada a la valoración del riesgo (Tema 7) y al informe (Tema 8)", "Sustituye al informe técnico completo", "Es un documento exclusivamente interno sin uso posterior", "Reemplaza las Reglas de Engagement"], "c": [0], "e": "La matriz de vulnerabilidades es la entrada a la valoración del riesgo (Tema 7) y al informe (Tema 8).", "nota": ""}, {"id": "6.1", "t": 6, "n": 1, "q": "¿Qué es, en esencia, la postexplotación?", "o": ["Todo lo que ocurre antes del primer acceso", "Todo lo que ocurre después del primer acceso: convertirlo en control real", "El proceso de elaborar el informe final", "La fase de autorización y alcance"], "c": [1], "e": "La postexplotación es todo lo que ocurre tras el primer acceso: convertirlo en control real.", "nota": ""}, {"id": "6.2", "t": 6, "n": 2, "q": "¿A qué fase del PTES corresponde la postexplotación?", "o": ["Fase 3 (modelado de amenazas)", "Fase 6, entre la explotación y el informe", "Fase 1 (interacciones previas)", "Fase 7 (informe)"], "c": [1], "e": "Corresponde a la fase 6 del PTES, entre la explotación y el informe.", "nota": ""}, {"id": "6.3", "t": 6, "n": 3, "q": "¿Cuál es el matiz clave que distingue al auditor del atacante en la postexplotación?", "o": ["El auditor prueba el impacto, no lo causa; llega hasta la puerta de los datos y lo documenta, no se los lleva", "El auditor siempre exfiltra los datos reales como prueba", "El auditor nunca necesita autorización adicional", "El auditor no debe documentar sus hallazgos"], "c": [0], "e": "El auditor prueba el impacto sin causarlo: llega hasta la puerta de los datos y lo documenta, no se los lleva.", "nota": ""}, {"id": "6.4", "t": 6, "n": 4, "q": "¿Qué táctica de MITRE ATT&CK describe pasar de usuario limitado a administrador o root?", "o": ["Movimiento lateral", "Escalada de privilegios", "Exfiltración", "Persistencia"], "c": [1], "e": "La escalada de privilegios es pasar de usuario limitado a administrador o root.", "nota": ""}, {"id": "6.5", "t": 6, "n": 5, "q": "¿Qué herramienta/técnica permite localizar binarios con permiso SUID mal asignado?", "o": ["find / -perm -4000", "nmap -sV", "chisel", "pspy"], "c": [0], "e": "find / -perm -4000 localiza binarios con permiso SUID.", "nota": ""}, {"id": "6.6", "t": 6, "n": 6, "q": "¿Qué recurso cataloga los binarios abusables mediante sudo mal configurado?", "o": ["GTFOBins", "MITRE ATLAS", "OWASP WSTG", "NIST SP 800-30"], "c": [0], "e": "GTFOBins cataloga los binarios abusables mediante sudo mal configurado.", "nota": ""}, {"id": "6.7", "t": 6, "n": 7, "q": "¿Qué técnica de movimiento lateral consiste en autenticarse con el hash NTLM robado sin necesitar la contraseña en claro?", "o": ["Pass-the-hash", "Kerberoasting", "Pivoting", "MAC Spoofing"], "c": [0], "e": "Pass-the-hash autentica con el hash NTLM robado sin necesitar la contraseña en claro.", "nota": ""}, {"id": "6.8", "t": 6, "n": 8, "q": "¿Qué herramientas se citan como ejemplo para crear túneles en el movimiento lateral mediante pivoting?", "o": ["chisel, túneles SSH o proxychains", "Burp Suite y ffuf", "VirusTotal y ANY.RUN", "Shodan y Censys"], "c": [0], "e": "chisel, túneles SSH o proxychains permiten pivotar creando túneles.", "nota": ""}, {"id": "6.9", "t": 6, "n": 9, "q": "¿Qué canal de exfiltración aprovecha que casi ninguna red bloquea ni inspecciona ese tráfico?", "o": ["Descarga directa por HTTP", "Túnel DNS", "FTP anónimo", "SMTP en claro"], "c": [1], "e": "El túnel DNS aprovecha que casi ninguna red bloquea ni inspecciona ese tráfico.", "nota": ""}, {"id": "6.10", "t": 6, "n": 10, "q": "¿Qué técnica de persistencia consiste en añadir una clave propia a authorized_keys?", "o": ["Persistencia por clave SSH", "Pass-the-hash", "Kerberoasting", "Pivoting"], "c": [0], "e": "Añadir una clave propia a authorized_keys es persistencia por clave SSH.", "nota": ""}, {"id": "6.11", "t": 6, "n": 11, "q": "¿Qué caso real ilustra que el acceso inicial fue trivial (contraseña filtrada sin MFA) y todo el daño se construyó en la postexplotación?", "o": ["Colonial Pipeline", "Citrix ADC", "MOVEit", "Samy worm"], "c": [0], "e": "Colonial Pipeline: el acceso inicial fue trivial (contraseña filtrada sin MFA) y el daño se construyó después.", "nota": ""}, {"id": "6.12", "t": 6, "n": 12, "q": "¿Qué ransomware operado por humanos afectó al SEPE español mediante movimiento lateral tras el acceso inicial?", "o": ["WannaCry", "Ryuk", "Carbanak", "EternalBlue"], "c": [1], "e": "Ryuk, operado por humanos, afectó al SEPE mediante movimiento lateral tras el acceso inicial.", "nota": ""}, {"id": "6.13", "t": 6, "n": 13, "q": "¿Qué patrón describe el 'tiempo dentro' (dwell time) de un incidente grave según el tema?", "o": ["Es siempre instantáneo, sin ventana de detección", "Puede ser de días o semanas, una ventana para detectarlo", "Nunca supera las 24 horas", "Es irrelevante para el impacto final"], "c": [1], "e": "El dwell time puede ser de días o semanas, y esa ventana es la oportunidad para detectar el incidente.", "nota": ""}, {"id": "6.14", "t": 6, "n": 14, "q": "En el caso Sorcery, ¿qué se obtuvo de un servidor FTP anónimo que permitió forjar certificados?", "o": ["La clave privada de una CA raíz (RootCA.key)", "La contraseña de root", "El código fuente completo del backend", "Un listado de usuarios del dominio"], "c": [0], "e": "El FTP anónimo de Sorcery dio la clave privada de una CA raíz (RootCA.key), lo que permitió forjar certificados.", "nota": ""}, {"id": "6.15", "t": 6, "n": 15, "q": "¿Qué técnica se usó para romper la passphrase de la clave privada robada en el caso Sorcery?", "o": ["Fuerza bruta offline con un diccionario (rockyou.txt)", "Kerberoasting", "Pass-the-hash", "SSRF"], "c": [0], "e": "La passphrase de la clave se rompió con fuerza bruta offline usando un diccionario (rockyou.txt).", "nota": ""}, {"id": "6.16", "t": 6, "n": 16, "q": "¿Qué proceso, detectado con Linpeas en el caso Sorcery, guardaba una captura de pantalla con credenciales en claro?", "o": ["Xvfb", "sssd", "chisel", "pspy"], "c": [0], "e": "Linpeas detectó el proceso Xvfb, que guardaba una captura de pantalla con credenciales en claro.", "nota": ""}, {"id": "6.17", "t": 6, "n": 17, "q": "¿Qué comando con privilegios sudo se usó para interceptar en vivo una credencial durante un 'docker login' en el caso Sorcery?", "o": ["strace", "find", "tcpdump", "netstat"], "c": [0], "e": "Con sudo se usó strace para interceptar en vivo una credencial durante un docker login.", "nota": ""}, {"id": "6.18", "t": 6, "n": 18, "q": "¿Qué herramienta permitió detectar una tarea periódica que filtraba una contraseña en el caso Sorcery?", "o": ["pspy", "Wireshark", "Burp Suite", "Shodan"], "c": [0], "e": "pspy permitió detectar la tarea periódica que filtraba una contraseña.", "nota": ""}, {"id": "6.19", "t": 6, "n": 19, "q": "¿A qué grupo se añadió el usuario comprometido en FreeIPA para escalar a root en el caso Sorcery?", "o": ["sysadmins, junto con la regla de sudo allow_sudo", "domain admins", "www-data", "guests"], "c": [0], "e": "El usuario comprometido se añadió al grupo sysadmins en FreeIPA, junto con la regla de sudo allow_sudo, para escalar a root.", "nota": ""}, {"id": "6.20", "t": 6, "n": 20, "q": "¿Cuál es la lección principal del caso Sorcery sobre el tipo de fallos encadenados?", "o": ["Todos fueron exploits de kernel sofisticados", "Todos fueron configuraciones erróneas, secretos mal guardados y permisos excesivos, encadenados", "Todos requirieron vulnerabilidades 0-day", "Todos fueron ataques de fuerza bruta contra SSH"], "c": [1], "e": "La lección de Sorcery: todos los fallos fueron configuraciones erróneas, secretos mal guardados y permisos excesivos, encadenados.", "nota": ""}, {"id": "7.1", "t": 7, "n": 1, "q": "¿Qué sistema autónomo alcanzó en junio de 2025 el primer puesto del ranking de HackerOne por encima de todos los cazadores humanos?", "o": ["XBOW", "ATLANTIS", "Team Atlanta", "Pegasus"], "c": [0], "e": "XBOW, un sistema autónomo, alcanzó en junio de 2025 el primer puesto del ranking de HackerOne.", "nota": ""}, {"id": "7.2", "t": 7, "n": 2, "q": "¿Qué plataforma ganó la final del AI Cyber Challenge de DARPA en agosto de 2025?", "o": ["XBOW", "ATLANTIS (Team Atlanta)", "Evilginx", "Carbanak"], "c": [1], "e": "ATLANTIS (Team Atlanta) ganó la final del AI Cyber Challenge de DARPA en agosto de 2025.", "nota": ""}, {"id": "7.3", "t": 7, "n": 3, "q": "¿Qué término describe los informes falsos generados por IA que inundan los programas de recompensas?", "o": ["AI slop", "Vibe hacking", "Prompt injection", "AI alignment"], "c": [0], "e": "«AI slop» son los informes falsos generados por IA que inundan los programas de recompensas.", "nota": ""}, {"id": "7.4", "t": 7, "n": 4, "q": "¿Qué término describe a personas con escasos conocimientos técnicos que ejecutan ataques sofisticados con ayuda de la IA?", "o": ["Vibe hacking", "AI slop", "Script kiddie 2.0", "Red teaming"], "c": [0], "e": "«Vibe hacking» es ejecutar ataques sofisticados con ayuda de IA con pocos conocimientos técnicos.", "nota": ""}, {"id": "7.5", "t": 7, "n": 5, "q": "¿Qué distingue a la severidad del riesgo, según el Tema 7?", "o": ["Son sinónimos intercambiables", "La severidad es intrínseca a la vulnerabilidad; el riesgo depende de dónde está, quién llega y qué se pierde", "El riesgo siempre es mayor que la severidad", "La severidad solo aplica a sistemas de IA"], "c": [1], "e": "La severidad es intrínseca a la vulnerabilidad; el riesgo depende de dónde está, quién llega y qué se pierde.", "nota": ""}, {"id": "7.6", "t": 7, "n": 6, "q": "¿Qué marco es prácticamente obligatorio para cualquier hallazgo con identificador CVE?", "o": ["CVSS 4.0", "MAGERIT", "OWASP Risk Rating", "NIST SP 800-30"], "c": [0], "e": "CVSS 4.0 es prácticamente obligatorio para cualquier hallazgo con identificador CVE.", "nota": ""}, {"id": "7.7", "t": 7, "n": 7, "q": "¿Qué marco es el idioma de la Administración Pública española para valorar el riesgo sobre disponibilidad, integridad, confidencialidad, autenticidad y trazabilidad?", "o": ["CVSS 4.0", "MAGERIT (en el marco del ENS)", "OWASP Risk Rating", "EPSS"], "c": [1], "e": "MAGERIT (en el marco del ENS) es el idioma de la Administración española para valorar el riesgo.", "nota": ""}, {"id": "7.8", "t": 7, "n": 8, "q": "¿Cuáles son las tres capas del vector CVSS 4.0?", "o": ["Base, Threat y Environmental", "Severidad, Confianza y Prioridad", "Probabilidad, Impacto y Exposición", "Técnica, Contextual y Residual"], "c": [0], "e": "El vector CVSS 4.0 tiene tres capas: Base, Threat y Environmental.", "nota": ""}, {"id": "7.9", "t": 7, "n": 9, "q": "¿Qué advierte FIRST, el organismo que mantiene CVSS, sobre su alcance?", "o": ["Que CVSS mide severidad, no riesgo", "Que CVSS mide riesgo, no severidad", "Que CVSS es obligatorio para todos los hallazgos sin excepción", "Que CVSS sustituye al modelo de tres capas"], "c": [0], "e": "FIRST advierte que CVSS mide severidad, no riesgo.", "nota": ""}, {"id": "7.10", "t": 7, "n": 10, "q": "¿Qué catálogo de CISA recoge vulnerabilidades con explotación real confirmada?", "o": ["EPSS", "KEV (Known Exploited Vulnerabilities)", "CWE", "MAGERIT"], "c": [1], "e": "El catálogo KEV (Known Exploited Vulnerabilities) de CISA recoge vulnerabilidades con explotación real confirmada.", "nota": ""}, {"id": "7.11", "t": 7, "n": 11, "q": "¿Qué estima el sistema EPSS?", "o": ["La severidad técnica de una vulnerabilidad", "La probabilidad de explotación en los próximos treinta días", "El impacto económico de un incidente", "El tiempo medio de corrección"], "c": [1], "e": "EPSS estima la probabilidad de explotación en los próximos treinta días.", "nota": ""}, {"id": "7.12", "t": 7, "n": 12, "q": "¿Cuántas categorías de impacto en clave policial se describen en el tema?", "o": ["Tres", "Cuatro", "Cinco", "Seis"], "c": [2], "e": "El tema describe cinco categorías de impacto en clave policial.", "nota": ""}, {"id": "7.13", "t": 7, "n": 13, "q": "¿Qué ley protege específicamente los datos personales en el ámbito policial, además del RGPD?", "o": ["Ley Orgánica 7/2021", "LOPDGDD 3/2018", "RD 311/2022 (ENS)", "LO 10/1995"], "c": [0], "e": "La Ley Orgánica 7/2021 protege los datos personales en el ámbito policial, además del RGPD.", "nota": ""}, {"id": "7.14", "t": 7, "n": 14, "q": "¿Cuáles son las tres capas del modelo de valoración propuesto en el tema?", "o": ["Severidad técnica, riesgo contextual y confianza", "Base, Threat y Environmental", "Probabilidad, impacto y exposición", "CVSS, OWASP y MAGERIT"], "c": [0], "e": "El modelo propuesto tiene tres capas: severidad técnica, riesgo contextual y confianza.", "nota": ""}, {"id": "7.15", "t": 7, "n": 15, "q": "¿Cuál es la definición de 'priorizar' según el tema?", "o": ["Ordenar los hallazgos de mayor a menor puntuación CVSS", "Decidir qué no se va a arreglar hoy", "Asignar el mismo nivel de prioridad a todos los hallazgos", "Eliminar los hallazgos de baja severidad del informe"], "c": [1], "e": "Priorizar es decidir qué no se va a arreglar hoy.", "nota": ""}, {"id": "7.16", "t": 7, "n": 16, "q": "¿Qué modelo de CISA devuelve una acción concreta (vigilar, atender o actuar) en lugar de un número?", "o": ["Matriz de riesgo 5x5", "SSVC", "CVSS 4.0", "MAGERIT"], "c": [1], "e": "SSVC de CISA devuelve una acción concreta (vigilar, atender o actuar) en lugar de un número.", "nota": ""}, {"id": "7.17", "t": 7, "n": 17, "q": "¿Qué es un 'punto de corte' en una cadena de ataque?", "o": ["El primer eslabón de la cadena, sin importar su impacto", "El eslabón cuya corrección rompe el mayor número de caminos con el menor esfuerzo", "El último eslabón, siempre el más crítico", "Un eslabón que no requiere corrección"], "c": [1], "e": "El punto de corte es el eslabón cuya corrección rompe el mayor número de caminos con el menor esfuerzo.", "nota": ""}, {"id": "7.18", "t": 7, "n": 18, "q": "¿Qué regla rige los desacuerdos con el cliente sobre la gravedad de un hallazgo?", "o": ["Se negocia el criterio técnico según la relación comercial", "Se revisan los hechos, pero no se negocia el criterio", "El cliente decide unilateralmente la severidad final", "El auditor cede siempre ante el cliente"], "c": [1], "e": "Ante desacuerdos con el cliente se revisan los hechos, pero no se negocia el criterio.", "nota": ""}, {"id": "7.19", "t": 7, "n": 19, "q": "¿Cuáles son los tres niveles en los que se ofrece una recomendación?", "o": ["Contención/mitigación inmediata, corrección definitiva y medida de causa raíz", "Alto, medio y bajo", "Técnico, ejecutivo y jurídico", "Preventivo, detectivo y correctivo"], "c": [0], "e": "Las recomendaciones se dan en tres niveles: contención/mitigación inmediata, corrección definitiva y medida de causa raíz.", "nota": ""}, {"id": "7.20", "t": 7, "n": 20, "q": "¿Qué riesgo del OWASP Top 10 para aplicaciones LLM ocupa el primer puesto, por segunda edición consecutiva?", "o": ["Agencia excesiva", "Inyección de instrucciones (prompt injection)", "Fuga de información sensible", "Denegación de servicio"], "c": [1], "e": "La inyección de instrucciones (prompt injection) ocupa el primer puesto del OWASP Top 10 para LLM por segunda edición consecutiva.", "nota": ""}, {"id": "8.1", "t": 8, "n": 1, "q": "¿Qué producto es, según el Tema 8, el único que permanece cuando la auditoría termina?", "o": ["La matriz de vulnerabilidades", "El informe", "El plan de remediación interno", "La autorización firmada"], "c": [1], "e": "El informe es el único producto que permanece cuando la auditoría termina.", "nota": ""}, {"id": "8.2", "t": 8, "n": 2, "q": "¿Qué documento tiene como finalidad documentar hechos para la autoridad judicial, a diferencia del informe de auditoría?", "o": ["El informe pericial", "El atestado", "El resumen ejecutivo", "La ficha de hallazgo"], "c": [1], "e": "El atestado documenta hechos para la autoridad judicial, a diferencia del informe de auditoría.", "nota": ""}, {"id": "8.3", "t": 8, "n": 3, "q": "¿Cuántas secciones comprende la estructura de un informe técnico completo según las guías PTES/NIST SP 800-115?", "o": ["Siete", "Ocho", "Diez", "Doce"], "c": [2], "e": "El informe técnico completo, según PTES y NIST SP 800-115, tiene diez secciones.", "nota": ""}, {"id": "8.4", "t": 8, "n": 4, "q": "¿Qué sección del informe resulta imprescindible porque, sin ella, el resto no puede interpretarse?", "o": ["Fortalezas observadas", "Criterios de valoración (modelo de tres capas)", "Anexos", "Portada"], "c": [1], "e": "Los criterios de valoración (modelo de tres capas) son imprescindibles: sin ellos el resto no se puede interpretar.", "nota": ""}, {"id": "8.5", "t": 8, "n": 5, "q": "¿Cuál es el 'corazón del informe' según el tema?", "o": ["El resumen ejecutivo", "La ficha de hallazgo", "La portada con control documental", "El anexo de artefactos"], "c": [1], "e": "La ficha de hallazgo es el corazón del informe.", "nota": ""}, {"id": "8.6", "t": 8, "n": 6, "q": "¿Qué campo de la ficha de hallazgo describe la receta exacta que permite comprobar el fallo después, en el retest?", "o": ["Pasos de reproducción", "Referencias", "Prioridad y estado", "Activos afectados"], "c": [0], "e": "Los pasos de reproducción son la receta exacta que permite comprobar el fallo después, en el retest.", "nota": ""}, {"id": "8.7", "t": 8, "n": 7, "q": "¿Qué debe hacerse con los secretos (contraseñas, claves) dentro de la evidencia de un informe?", "o": ["Incluirlos completos para dar mayor credibilidad", "Ocultarlos o enmascararlos", "Enviarlos solo por correo electrónico sin cifrar", "Omitir cualquier mención a ellos"], "c": [1], "e": "Los secretos (contraseñas, claves) en la evidencia deben ocultarse o enmascararse.", "nota": ""}, {"id": "8.8", "t": 8, "n": 8, "q": "¿Qué frase nunca debe escribirse en un informe de auditoría, según el tema?", "o": ["'Se confirmó...'", "'No se pudo verificar...'", "'El sistema es seguro'", "'Es probable que...'"], "c": [2], "e": "Nunca debe escribirse «El sistema es seguro»: solo se puede decir lo que se probó y no se encontró.", "nota": ""}, {"id": "8.9", "t": 8, "n": 9, "q": "¿Cuál es la regla sobre el uso de IA generativa para redactar el informe?", "o": ["Puede introducirse cualquier dato del cliente en servicios no autorizados", "Puede pulir la forma, pero nunca introduciendo datos del cliente en servicios no autorizados; la responsabilidad es siempre del auditor", "Está prohibida en cualquier circunstancia", "Sustituye la revisión por pares"], "c": [1], "e": "La IA generativa puede pulir la forma, pero sin introducir datos del cliente en servicios no autorizados; la responsabilidad es del auditor.", "nota": ""}, {"id": "8.10", "t": 8, "n": 10, "q": "¿Qué necesita entender el decisor, según el tema, más que la vulnerabilidad en sí?", "o": ["Los detalles técnicos del exploit", "Qué puede pasar, qué debe decidir, cuánto cuesta y cuánto tarda", "El nombre del CVE concreto", "La versión exacta del software afectado"], "c": [1], "e": "El decisor necesita saber qué puede pasar, qué debe decidir, cuánto cuesta y cuánto tarda, más que el detalle técnico.", "nota": ""}, {"id": "8.11", "t": 8, "n": 11, "q": "¿Qué público recibe típicamente un resumen de una o dos páginas sobre el riesgo para el servicio y la ciudadanía?", "o": ["Equipos técnicos", "Alcaldía o concejalía", "Jurídico y protección de datos", "Responsables del ENS"], "c": [1], "e": "El resumen de una o dos páginas sobre el riesgo para el servicio y la ciudadanía va a la alcaldía o concejalía.", "nota": ""}, {"id": "8.12", "t": 8, "n": 12, "q": "¿Qué principio rige la redacción del resumen ejecutivo, situando la conclusión en la primera frase?", "o": ["STRIDE", "BLUF (Bottom Line Up Front)", "TLP", "PTES"], "c": [1], "e": "BLUF (Bottom Line Up Front) sitúa la conclusión en la primera frase del resumen ejecutivo.", "nota": ""}, {"id": "8.13", "t": 8, "n": 13, "q": "¿Qué no debe hacerse nunca al cuantificar el impacto en el resumen ejecutivo?", "o": ["Cuantificar registros afectados", "Inventar cifras económicas", "Usar lenguaje de misión", "Pedir una decisión concreta"], "c": [1], "e": "Nunca debe inventarse cifras económicas al cuantificar el impacto.", "nota": ""}, {"id": "8.14", "t": 8, "n": 14, "q": "¿Cuándo empieza realmente la comunicación de una auditoría, según el tema?", "o": ["Con la entrega del informe final", "El primer día del compromiso", "En la fase de retest", "Al firmar el acta de cierre"], "c": [1], "e": "La comunicación de una auditoría empieza el primer día del compromiso.", "nota": ""}, {"id": "8.15", "t": 8, "n": 15, "q": "¿Qué dos situaciones exigen comunicación inmediata, fuera del ritmo normal de la auditoría?", "o": ["El hallazgo crítico y los indicios de un compromiso previo o delito ajeno a la auditoría", "Cualquier hallazgo de severidad media", "La finalización de cada fase del PTES", "El cambio de horario de trabajo"], "c": [0], "e": "Exigen comunicación inmediata el hallazgo crítico y los indicios de un compromiso previo o delito ajeno a la auditoría.", "nota": ""}, {"id": "8.16", "t": 8, "n": 16, "q": "¿Qué debe hacer el auditor ante indicios de un compromiso previo de un tercero?", "o": ["Investigar a fondo ese compromiso, aunque esté fuera del alcance", "Detenerse, no investigar fuera del alcance, preservar, notificar por el canal pactado y documentar", "Ignorarlo si no afecta a los activos en alcance", "Comunicarlo directamente a la prensa"], "c": [1], "e": "Ante indicios de compromiso previo de un tercero hay que detenerse, no investigar fuera del alcance, preservar, notificar por el canal pactado y documentar.", "nota": ""}, {"id": "8.17", "t": 8, "n": 17, "q": "¿Cómo se entrega el informe final según las buenas prácticas del tema?", "o": ["Sin cifrar, por comodidad del cliente", "Cifrado, con la contraseña enviada por un canal distinto", "Publicado en abierto en un repositorio", "Únicamente en papel"], "c": [1], "e": "El informe final se entrega cifrado, con la contraseña por un canal distinto.", "nota": ""}, {"id": "8.18", "t": 8, "n": 18, "q": "¿Con quién se sigue el proceso de divulgación coordinada cuando se descubre una vulnerabilidad nueva en un producto de un tercero?", "o": ["Con el fabricante y, en su caso, con INCIBE-CERT", "Únicamente con la prensa especializada", "Con el competidor del fabricante", "No se realiza ninguna divulgación"], "c": [0], "e": "La divulgación coordinada se sigue con el fabricante y, en su caso, con INCIBE-CERT.", "nota": ""}, {"id": "8.19", "t": 8, "n": 19, "q": "¿Qué dos reflexiones integran las 'lecciones aprendidas' al cerrar una auditoría?", "o": ["La del equipo auditor y la del cliente", "La del juez y la del fiscal", "La del proveedor de software y la del integrador", "La del CERT nacional y la europea"], "c": [0], "e": "Las lecciones aprendidas integran la reflexión del equipo auditor y la del cliente.", "nota": ""}, {"id": "8.20", "t": 8, "n": 20, "q": "¿Qué ocurre, según la conclusión del tema, 'solo entonces, y no cuando se entrega el informe'?", "o": ["Se inicia el retest", "La auditoría ha terminado, tras completar el cierre formal", "Comienza la fase de explotación", "Se firma el contrato inicial"], "c": [1], "e": "La auditoría termina solo tras completar el cierre formal, no cuando se entrega el informe.", "nota": ""}];
const KEY='asig10_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
