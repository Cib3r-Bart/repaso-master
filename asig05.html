<script>
const DATA = [{"id": "1.1", "t": 1, "n": 1, "q": "¿Cuál de las siguientes definiciones corresponde con mayor precisión al concepto de OSINT?", "o": ["Cualquier técnica de obtención de información, incluida la intrusión en sistemas informáticos", "El proceso de obtención, recopilación, análisis y transformación de información de fuentes accesibles legalmente para generar inteligencia útil", "Un sinónimo de inteligencia de señales (SIGINT)", "Un conjunto de herramientas exclusivamente gratuitas de análisis de datos"], "c": [1], "e": "OSINT es el proceso de obtener, recopilar, analizar y transformar información de fuentes accesibles legalmente para generar inteligencia útil. No incluye intrusiones ni equivale a SIGINT.", "nota": ""}, {"id": "1.2", "t": 1, "n": 2, "q": "Según la distinción entre dato, información e inteligencia, ¿qué representa el conocimiento verificado que permite apoyar una decisión?", "o": ["El dato", "La información", "La inteligencia", "El indicio"], "c": [2], "e": "El dato es un elemento aislado, la información es el dato contextualizado, y la inteligencia es el conocimiento verificado que apoya una decisión.", "nota": ""}, {"id": "1.3", "t": 1, "n": 3, "q": "¿Qué organismo estadounidense institucionalizó en el periodo predigital (1941-1980) el uso de fuentes abiertas mediante el seguimiento de emisiones extranjeras?", "o": ["La NSA", "El FBIS (Foreign Broadcast Information Service)", "La CIA", "El FBI"], "c": [1], "e": "En el periodo predigital (1941-1980) el FBIS (Foreign Broadcast Information Service) institucionalizó el seguimiento de emisiones extranjeras.", "nota": ""}, {"id": "1.4", "t": 1, "n": 4, "q": "¿Cuál de las siguientes NO forma parte del ciclo de inteligencia aplicado a OSINT?", "o": ["Planificación", "Obtención", "Intrusión no autorizada", "Difusión"], "c": [2], "e": "El ciclo de inteligencia OSINT incluye planificación, obtención, procesamiento, análisis, difusión y retroalimentación; la intrusión no autorizada queda fuera de las fuentes abiertas.", "nota": ""}, {"id": "1.5", "t": 1, "n": 5, "q": "¿En qué fase del ciclo de inteligencia se considera que reside la actividad más importante del investigador?", "o": ["Obtención", "Procesamiento", "Análisis", "Retroalimentación"], "c": [2], "e": "La actividad más importante del investigador reside en el análisis, donde se convierte la información en inteligencia.", "nota": ""}, {"id": "1.6", "t": 1, "n": 6, "q": "Antes de comenzar una investigación OSINT, ¿cuál de las siguientes NO es una de las cuatro preguntas recomendadas?", "o": ["¿Qué quiero averiguar?", "¿Qué informe presentaré a los medios de comunicación?", "¿Dónde puede encontrarse la información?", "¿Cómo comprobaré que es cierta?"], "c": [1], "e": "Las preguntas previas son qué quiero averiguar, dónde puede encontrarse y cómo comprobaré que es cierta (y la que completa el grupo); el informe a medios no es una de ellas.", "nota": ""}, {"id": "1.7", "t": 1, "n": 7, "q": "¿Qué término se emplea para referirse específicamente a las técnicas OSINT aplicadas a redes sociales?", "o": ["HUMINT", "GEOINT", "SOCMINT", "SIGINT"], "c": [2], "e": "SOCMINT designa las técnicas OSINT aplicadas a redes sociales.", "nota": ""}, {"id": "1.8", "t": 1, "n": 8, "q": "¿Cuál de los siguientes buscadores está orientado específicamente a indexar contenido accesible dentro de la red Tor?", "o": ["Yandex", "Ahmia", "DuckDuckGo", "Bing"], "c": [1], "e": "Ahmia es un buscador orientado a indexar contenido de la red Tor.", "nota": ""}, {"id": "1.9", "t": 1, "n": 9, "q": "¿Qué caracteriza a la Surface Web frente a la Deep Web?", "o": ["Que no puede ser indexada por buscadores", "Que requiere autenticación para acceder a ella", "Que es indexable y accesible públicamente mediante buscadores convencionales", "Que solo se accede mediante direcciones .onion"], "c": [2], "e": "La Surface Web es la parte indexable y accesible públicamente mediante buscadores convencionales.", "nota": ""}, {"id": "1.10", "t": 1, "n": 10, "q": "¿Qué proporción aproximada de Internet se estima que corresponde a la Deep Web, incluyendo el correo electrónico, la banca online o los historiales médicos?", "o": ["Una parte minoritaria y anecdótica", "La mayor parte de la información existente en Internet", "Únicamente el contenido cifrado con TLS", "Solo el contenido alojado fuera de Europa"], "c": [1], "e": "Según el temario, la Deep Web (correo, banca online, historiales médicos…) abarca la mayor parte de la información de Internet; no hay que confundirla con la Dark Web.", "nota": ""}, {"id": "1.11", "t": 1, "n": 11, "q": "¿Qué red es la más conocida para acceder a la Dark Web mediante encaminamiento cebolla?", "o": ["I2P", "Freenet", "Tor (The Onion Router)", "VPN"], "c": [2], "e": "Tor (The Onion Router) es la red más conocida para acceder a la Dark Web mediante encaminamiento cebolla.", "nota": ""}, {"id": "1.12", "t": 1, "n": 12, "q": "¿Cuál de las siguientes afirmaciones sobre la Dark Web es correcta?", "o": ["Todo su contenido es ilícito por definición", "Coexisten usos legítimos, como el periodismo en contextos de censura, con usos ilícitos", "Solo puede accederse desde equipos policiales autorizados", "No existen mercados de compraventa en su interior"], "c": [1], "e": "En la Dark Web coexisten usos legítimos (p. ej. periodismo bajo censura) con usos ilícitos; no todo su contenido es ilegal.", "nota": ""}, {"id": "1.13", "t": 1, "n": 13, "q": "¿Qué sistema operativo permite segmentar la navegación, la descarga y el análisis en máquinas virtuales aisladas y desechables?", "o": ["Tails", "Whonix", "Qubes OS", "Kali Linux"], "c": [2], "e": "Qubes OS segmenta navegación, descarga y análisis en máquinas virtuales aisladas y desechables.", "nota": ""}, {"id": "1.14", "t": 1, "n": 14, "q": "Al evaluar la fiabilidad de una fuente, ¿cuál de las siguientes preguntas NO resulta pertinente según los criterios expuestos?", "o": ["¿Quién la publica?", "¿Cuál es su finalidad?", "¿Qué fuente tiene el diseño gráfico más atractivo?", "¿Existen otras fuentes que la confirmen?"], "c": [2], "e": "Al evaluar una fuente importan quién la publica, su finalidad y si otras la confirman; su diseño gráfico es irrelevante.", "nota": ""}, {"id": "1.15", "t": 1, "n": 15, "q": "Según el principio de las dos fuentes, ¿qué debe garantizarse al corroborar información relevante?", "o": ["Que dos fuentes independientes, que no se copien entre sí, confirmen el dato", "Que la información aparezca en al menos dos idiomas distintos", "Que dos investigadores distintos firmen el informe", "Que se utilicen dos herramientas OSINT diferentes"], "c": [0], "e": "El principio de las dos fuentes exige que dos fuentes independientes, que no se copien entre sí, confirmen el dato.", "nota": ""}, {"id": "1.16", "t": 1, "n": 16, "q": "¿Qué diferencia fundamentalmente una hipótesis de un hecho en el marco de una investigación OSINT?", "o": ["La hipótesis siempre procede de fuentes cerradas", "La hipótesis es una explicación provisional pendiente de confirmación, mientras que el hecho es objetivamente verificable", "No existe diferencia relevante entre ambos conceptos", "El hecho requiere siempre autorización judicial y la hipótesis no"], "c": [1], "e": "La hipótesis es una explicación provisional pendiente de confirmar; el hecho es objetivamente verificable.", "nota": ""}, {"id": "1.17", "t": 1, "n": 17, "q": "¿Cuál de las siguientes medidas NO forma parte de la preservación adecuada de una evidencia digital?", "o": ["Registrar la fecha y hora de acceso", "Conservar la URL completa", "Guardar únicamente el enlace sin más documentación", "Calcular el hash del archivo obtenido"], "c": [2], "e": "Guardar solo el enlace es insuficiente: la preservación exige fecha y hora de acceso, URL completa, hash del archivo y documentación.", "nota": ""}, {"id": "1.18", "t": 1, "n": 18, "q": "Respecto al uso de inteligencia artificial en investigaciones OSINT, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["La IA puede sustituir por completo el criterio del investigador", "El principio de «human in the loop» implica que la responsabilidad final recae siempre en la persona", "La IA garantiza que la información generada sea siempre correcta", "El uso de IA exime de verificar las fuentes originales"], "c": [1], "e": "Con el principio «human in the loop», la responsabilidad final recae siempre en la persona; la IA no sustituye al criterio humano ni exime de verificar.", "nota": ""}, {"id": "1.19", "t": 1, "n": 19, "q": "En el caso práctico de la venta ilícita de medicamentos por Internet, ¿qué artículo del Código Penal tipifica esta conducta cuando genera riesgo para la salud?", "o": ["El artículo 197", "El artículo 248", "El artículo 361", "El artículo 400"], "c": [2], "e": "El artículo 361 del Código Penal tipifica la elaboración y venta de medicamentos que generan riesgo para la salud.", "nota": ""}, {"id": "1.20", "t": 1, "n": 20, "q": "En dicho caso práctico, ¿qué tipo de herramienta se emplea para estimar el volumen de tráfico y visitas de una farmacia online antes de proceder a su investigación?", "o": ["Herramientas de análisis de tráfico web como Google Analytics, Alexa o SimilarWeb", "Bases de datos de antecedentes penales", "Aplicaciones de reconocimiento facial", "Software de intervención de comunicaciones"], "c": [0], "e": "El volumen de tráfico y visitas de una web se estima con herramientas de análisis de tráfico web como Google Analytics, Alexa o SimilarWeb.", "nota": ""}, {"id": "2.1", "t": 2, "n": 1, "q": "¿Qué caracteriza fundamentalmente a un buen investigador OSINT según la reflexión sobre la habilidad de buscar?", "o": ["Conocer el máximo número posible de herramientas", "Saber cuál herramienta o fuente utilizar en primer lugar según la necesidad concreta", "Utilizar exclusivamente buscadores de pago", "Memorizar todos los operadores de búsqueda disponibles"], "c": [1], "e": "Un buen investigador sabe qué herramienta o fuente emplear primero según la necesidad concreta, no cuántas conoce.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "¿Qué operador de búsqueda avanzada de Google permite restringir los resultados a un dominio o tipo de sitio concreto?", "o": ["filetype:", "related:", "site:", "in text:"], "c": [2], "e": "El operador site: restringe los resultados a un dominio o tipo de sitio (filetype: filtra por tipo de archivo).", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Para qué tipo de búsqueda se recomienda especialmente el motor Yandex frente a Google?", "o": ["Búsqueda de literatura jurídica", "Búsqueda inversa de imágenes y reconocimiento facial", "Búsqueda de ofertas de empleo", "Búsqueda de jurisprudencia europea"], "c": [1], "e": "Yandex se recomienda especialmente para búsqueda inversa de imágenes y reconocimiento facial.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "¿Qué distingue a las redes sociales «verticales» de las «horizontales»?", "o": ["Las verticales están orientadas a una temática concreta (p. ej. LinkedIn, Strava, Tinder), mientras que las horizontales sirven para la interacción general", "Las verticales solo existen en dispositivos móviles", "Las horizontales requieren siempre verificación de identidad", "No existe distinción reconocida entre ambos tipos"], "c": [0], "e": "Las redes verticales se orientan a una temática concreta (LinkedIn, Strava, Tinder); las horizontales, a la interacción general.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Qué finalidad tiene la herramienta Epieos dentro de una investigación OSINT?", "o": ["Cifrar comunicaciones entre investigadores", "Recuperar información vinculada a un correo electrónico o teléfono sin notificar al usuario", "Generar identidades falsas para investigaciones encubiertas", "Bloquear el acceso a foros de cibercrimen"], "c": [1], "e": "Epieos recupera información vinculada a un correo electrónico o teléfono sin notificar al usuario.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿Qué tipo de información proporciona principalmente DNSlytics?", "o": ["Traducciones automáticas de páginas web", "Informes de IP, dominios asociados y datos WHOIS", "Perfiles psicológicos de usuarios", "Localización de personas desaparecidas"], "c": [1], "e": "DNSlytics proporciona informes de IP, dominios asociados y datos WHOIS.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Qué herramientas permiten comprobar la disponibilidad o el uso de un mismo nombre de usuario en múltiples plataformas y dominios?", "o": ["Namechk y Brandsnag", "TinEye y PicDetective", "Shodan y VirusTotal", "Maltego y SpiderFoot"], "c": [0], "e": "Namechk y Brandsnag comprueban la disponibilidad o uso de un nombre de usuario en múltiples plataformas y dominios.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "Para que una prueba obtenida mediante técnicas OSINT sea admitida judicialmente, ¿qué requisito exige que la información se haya obtenido sin vulnerar ninguna medida de seguridad?", "o": ["Autenticidad e integridad", "Licitud de la obtención", "Informe pericial", "Cadena de custodia"], "c": [1], "e": "La licitud de la obtención exige que la información se obtenga sin vulnerar medidas de seguridad; la autenticidad e integridad son otro requisito.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Por qué una simple captura de pantalla impresa resulta insuficiente como prueba por sí sola?", "o": ["Porque no puede leerse en un juicio oral", "Porque es fácilmente manipulable y destruye los metadatos originales de la publicación", "Porque las capturas de pantalla están prohibidas por la LOPD", "Porque no puede traducirse a otros idiomas"], "c": [1], "e": "Una captura impresa es fácilmente manipulable y pierde los metadatos originales, por lo que no basta como prueba.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "Según los requisitos jurisprudenciales para admitir imágenes o vídeos de redes sociales como prueba (SOCMINT), ¿cuándo se considera lícita la obtención de una fotografía?", "o": ["Siempre, independientemente del perfil del que proceda", "Cuando procede de un perfil público al que el usuario dio acceso voluntario", "Únicamente si el usuario lo autoriza expresamente por escrito", "Nunca, al estar protegida por derechos de imagen"], "c": [1], "e": "La fotografía se obtiene lícitamente cuando procede de un perfil público al que el usuario dio acceso voluntario.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Qué ocurre si para obtener una fotografía se utiliza un perfil falso (sock puppet) para engañar al usuario de una cuenta privada?", "o": ["La prueba se considera ilícita y será descartada", "La prueba es válida si el delito es grave", "La prueba requiere solo autorización policial interna", "La prueba se admite si el investigador la documenta por escrito"], "c": [0], "e": "Usar un perfil falso (sock puppet) para engañar al titular de una cuenta privada hace ilícita la prueba, que será descartada.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Qué papel desempeña habitualmente el informe pericial informático en relación con una evidencia digital extraída de redes sociales?", "o": ["Sustituye a la denuncia inicial", "Certifica los metadatos, la fecha de publicación, la URL y garantiza la cadena de custodia mediante el hash del archivo", "Elimina la necesidad de autorización judicial", "Solo es necesario cuando la evidencia procede de la Dark Web"], "c": [1], "e": "El informe pericial certifica metadatos, fecha de publicación y URL, y garantiza la cadena de custodia mediante el hash del archivo.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿Qué foro de cibercrimen surgió como sucesor directo de RaidForums tras su incautación por el FBI en 2022?", "o": ["XSS.is", "BreachForums", "Exploit.in", "Dread"], "c": [1], "e": "BreachForums surgió como sucesor de RaidForums tras su incautación por el FBI en 2022.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Qué caracteriza a XSS.is dentro del ecosistema del cibercrimen?", "o": ["Es un mercado exclusivo de medicamentos falsificados", "Funciona como capa mayorista de la economía de intrusiones, con exploits, accesos corporativos y reclutamiento de afiliados de ransomware", "Es un foro exclusivamente dedicado a la venta de vehículos robados", "Fue creado en 2022 y cesó su actividad en 2023"], "c": [1], "e": "XSS.is funciona como capa mayorista de la economía de intrusiones: exploits, accesos corporativos y reclutamiento de afiliados de ransomware.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "¿Cuál de los siguientes foros es descrito como el más antiguo aún en funcionamiento dentro del cibercrimen ruso, con acceso muy restringido?", "o": ["Exploit.in", "LeakBase", "BreachForums", "Dread"], "c": [0], "e": "Exploit.in es el foro más antiguo aún activo del cibercrimen ruso, con acceso muy restringido.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué distingue a Dread de otros foros de cibercrimen como BreachForums o XSS.is?", "o": ["Dread es un marketplace directo de datos robados", "Dread es un foro de discusión y reputación alojado en Tor donde no se compra ni se vende directamente", "Dread solo admite usuarios verificados por las fuerzas de seguridad", "Dread ha sido intervenido judicialmente en más ocasiones que ningún otro foro"], "c": [1], "e": "Dread es un foro de discusión y reputación en Tor donde no se compra ni vende directamente.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "¿Para qué sirven plataformas como Ransomlook.io o Ransomware.live?", "o": ["Para cifrar archivos con fines defensivos", "Para monitorizar públicamente los ataques de ransomware reivindicados por distintos grupos", "Para generar certificados digitales", "Para tramitar solicitudes de datos a operadoras de telecomunicaciones"], "c": [1], "e": "Ransomlook.io y Ransomware.live monitorizan públicamente los ataques de ransomware reivindicados por los grupos.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Qué valor aporta a una investigación monitorizar sistemáticamente foros como Dread o Exploit.in?", "o": ["Permite anticipar campañas de ransomware en fase de reclutamiento y detectar migraciones del ecosistema criminal", "Permite acceder directamente a las bases de datos de las Fuerzas y Cuerpos de Seguridad", "Sustituye la necesidad de mandamiento judicial para cualquier actuación", "Elimina el riesgo de exposición del investigador"], "c": [0], "e": "Monitorizar estos foros permite anticipar campañas de ransomware en fase de reclutamiento y detectar migraciones del ecosistema criminal.", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Qué principio metodológico debe primar al elegir entre varias herramientas OSINT disponibles para una misma tarea?", "o": ["Utilizar siempre la herramienta de pago más cara", "Seleccionar la fuente o herramienta más adecuada a la necesidad concreta, contrastando resultados entre ellas", "Emplear una única herramienta para toda la investigación", "Priorizar siempre las herramientas alojadas en servidores extranjeros"], "c": [1], "e": "Debe elegirse la herramienta más adecuada a la necesidad concreta y contrastar resultados entre varias, sin depender de una sola.", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Qué tipo de acceso caracteriza habitualmente a foros de cibercrimen de alto nivel como Exploit.in?", "o": ["Acceso abierto y gratuito para cualquier usuario de Internet", "Acceso muy restringido, que exige recomendación de un miembro existente o el pago de una cuota de entrada", "Acceso exclusivo mediante invitación de organismos gubernamentales", "Acceso automático tras registrarse con un correo electrónico verificado"], "c": [1], "e": "Foros de alto nivel como Exploit.in exigen acceso muy restringido: recomendación de un miembro o pago de cuota de entrada.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "¿Cuál de las siguientes NO es una de las seis preguntas clave que debe plantearse el investigador ante un proceso de identificación de perfiles?", "o": ["¿Qué tengo?", "¿Cómo se solicita?", "¿Qué presupuesto tiene la unidad?", "¿Dónde lo pido?"], "c": [2], "e": "Las seis preguntas clave son del tipo qué tengo, qué necesito, dónde lo pido o cómo se solicita; el presupuesto de la unidad no es una de ellas.", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿Qué instrumento jurídico resulta habitualmente suficiente para solicitar la titularidad de una dirección IP dentro del plazo legal de conservación?", "o": ["El oficio policial", "El mandamiento judicial de intervención de comunicaciones", "La comisión rogatoria internacional", "El requerimiento notarial"], "c": [0], "e": "Dentro del plazo legal de conservación, el oficio policial suele bastar para solicitar la titularidad de una IP.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "¿Qué normativa española establece con carácter general el plazo de conservación de los datos relativos a las comunicaciones electrónicas?", "o": ["La Ley Orgánica de Protección de Datos", "La Ley 25/2007 de conservación de datos", "El Reglamento (UE) 2022/2065 (DSA)", "La Ley de Enjuiciamiento Civil"], "c": [1], "e": "La Ley 25/2007 de conservación de datos regula el plazo de conservación de datos de comunicaciones electrónicas.", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "¿A qué artículo de la LECrim se refieren específicamente las diligencias de identificación mediante datos de IP?", "o": ["Artículo 282 bis", "Artículo 588 ter k", "Artículo 118", "Artículo 520"], "c": [1], "e": "El artículo 588 ter k de la LECrim regula la identificación mediante datos de IP.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Qué instrumentos de cooperación internacional pueden emplearse cuando el proveedor de servicios se encuentra en el extranjero y se requiere el contenido de las comunicaciones?", "o": ["MLAT y CRI (comisión rogatoria internacional)", "Únicamente el oficio policial", "La orden europea de detención", "El pasaporte diplomático"], "c": [0], "e": "Si el proveedor está en el extranjero y se requiere el contenido, se emplean MLAT y comisión rogatoria internacional (CRI).", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Qué plataforma centraliza para miles de organismos gubernamentales la gestión de solicitudes de datos dirigidas a empresas tecnológicas?", "o": ["Kodex", "Shodan", "Maltego", "VirusTotal"], "c": [0], "e": "Kodex centraliza la gestión de solicitudes de datos de miles de organismos a empresas tecnológicas.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Qué cauce de tramitación urgente se emplea cuando existe un riesgo grave para la vida o la integridad física de una persona?", "o": ["La vía ordinaria del Registro Mercantil", "El contacto con SITEL y la grabación en SIGMA", "La publicación de un comunicado de prensa", "La solicitud directa al Defensor del Pueblo"], "c": [1], "e": "Ante riesgo grave para la vida o integridad física se usa el cauce urgente: contacto con SITEL y grabación en SIGMA.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Qué aplicación policial interna se describe como una plataforma de análisis asistido por inteligencia artificial para transformar grandes volúmenes de datos en resultados de investigación?", "o": ["Medusa", "Voyager Analytics", "Kodex", "DomainTools"], "c": [1], "e": "Voyager Analytics es la plataforma policial de análisis asistido por IA que transforma grandes volúmenes de datos en resultados de investigación.", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿Cómo se clasifican las fuentes de información no policiales dentro de las fuentes cerradas?", "o": ["En nacionales e internacionales", "En públicas y privadas", "En digitales y analógicas", "En civiles y militares"], "c": [1], "e": "Las fuentes cerradas no policiales se clasifican en públicas y privadas.", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Cuál es el principal inconveniente atribuido a las fuentes de información abiertas frente a las cerradas?", "o": ["Su elevado coste económico", "El ruido, los errores y la menor garantía formal de la información obtenida", "La imposibilidad de acceder a ellas sin autorización judicial", "Que solo están disponibles en idioma inglés"], "c": [1], "e": "El inconveniente de las fuentes abiertas es el ruido, los errores y la menor garantía formal de la información.", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿Cuál de los siguientes se clasifica como un problema técnico (y no burocrático) de identificación de usuarios?", "o": ["El exceso de requisitos formales", "La lentitud de tramitación de los mandamientos", "El uso de CG-NAT y la navegación oculta", "El coste de las comisiones rogatorias internacionales"], "c": [2], "e": "El uso de CG-NAT y la navegación oculta son problemas técnicos; el resto de opciones son trabas burocráticas o de coste.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "Dentro del protocolo de ocho pasos para la identificación técnica de usuarios, ¿qué paso sigue inmediatamente a la solicitud de mandamientos dirigidos a los ISP?", "o": ["La comprobación inicial del delito", "La respuesta de los ISP", "La ampliación de información mediante fuentes abiertas y cerradas", "La identificación plena"], "c": [1], "e": "En el protocolo de ocho pasos, tras solicitar los mandamientos a los ISP sigue la respuesta de los ISP.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "¿Qué reglamento europeo establece obligaciones de cooperación de las grandes plataformas digitales con las autoridades competentes?", "o": ["El Reglamento General de Protección de Datos (RGPD)", "El Reglamento de Servicios Digitales (DSA, UE 2022/2065)", "El Reglamento eIDAS", "El Convenio de Budapest"], "c": [1], "e": "El Reglamento de Servicios Digitales (DSA, UE 2022/2065) obliga a cooperar a las grandes plataformas con las autoridades.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Qué tipo de dato puede obtenerse habitualmente mediante RIPE NCC o herramientas como DomainTools en el inicio de una identificación?", "o": ["La titularidad y datos técnicos asociados a una dirección IP o dominio", "El historial médico del investigado", "Los movimientos bancarios del investigado", "El censo electoral"], "c": [0], "e": "RIPE NCC y herramientas como DomainTools dan titularidad y datos técnicos de una IP o dominio.", "nota": ""}, {"id": "3.15", "t": 3, "n": 15, "q": "En los ejemplos de identificación avanzada de perfiles en redes sociales, ¿qué técnica consiste en comparar cuentas de distintas plataformas (por ejemplo, Facebook y Twitter/X) para verificar que corresponden a la misma persona?", "o": ["El análisis relacional y comparativo cruzado de perfiles", "La solicitud directa de datos personales al propio investigado", "El uso exclusivo de bases de datos policiales cerradas", "La comisión rogatoria internacional"], "c": [0], "e": "Comparar cuentas de distintas plataformas para verificar que son de la misma persona es análisis relacional y comparativo cruzado.", "nota": ""}, {"id": "3.16", "t": 3, "n": 16, "q": "¿Qué evidencia práctica se emplea en los casos de identificación de vehículos y conductores mostrados como ejemplo?", "o": ["Únicamente declaraciones testificales", "Imágenes captadas en la vía pública que permiten identificar el tramo de vía, el vehículo y sus ocupantes", "Registros de llamadas telefónicas", "Datos bancarios del propietario del vehículo"], "c": [1], "e": "En los casos de vehículos se emplean imágenes captadas en la vía pública que permiten identificar el tramo, el vehículo y sus ocupantes.", "nota": ""}, {"id": "3.17", "t": 3, "n": 17, "q": "¿Qué grupo empresarial resulta de la fusión de Orange y MásMóvil, mencionado entre las operadoras con protocolo de solicitud de datos?", "o": ["Vodafone España", "MASORANGE", "Telefónica", "Digi"], "c": [1], "e": "MASORANGE es el grupo resultante de la fusión de Orange y MásMóvil.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "¿Qué finalidad tiene el formulario específico del portal de Meta dirigido a las fuerzas de seguridad?", "o": ["Tramitar quejas de usuarios sobre contenido publicado", "Canalizar solicitudes formales de datos por parte de las autoridades, detallando el objetivo y la información requerida", "Registrar nuevas cuentas de empresa", "Reportar campañas publicitarias fraudulentas"], "c": [1], "e": "El formulario de Meta para fuerzas de seguridad canaliza solicitudes formales de datos, detallando el objetivo y la información requerida.", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Qué se entiende por «identificación intrínseca» dentro de la clasificación de problemas de identificación de usuarios?", "o": ["Dificultades inherentes a la propia naturaleza y complejidad técnica del entorno investigado, distintas de las meramente burocráticas o técnicas", "Un tipo de identificación reservada a menores de edad", "Un procedimiento exclusivo para vehículos", "Un sinónimo de identificación técnica"], "c": [0], "e": "La identificación intrínseca recoge dificultades inherentes a la naturaleza y complejidad técnica del entorno, distintas de las burocráticas o técnicas.", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "¿Por qué resulta especialmente relevante contrastar los alias o nombres de usuario descifrados (por ejemplo, mediante inversión de sílabas del nombre real) con otras fuentes abiertas?", "o": ["Porque permite confirmar la hipótesis de identidad mediante corroboración independiente antes de darla por probada", "Porque basta con el hallazgo del alias para dictar sentencia", "Porque sustituye a cualquier mandamiento judicial posterior", "Porque invalida automáticamente cualquier otra línea de investigación"], "c": [0], "e": "Contrastar el alias con otras fuentes confirma la hipótesis de identidad mediante corroboración independiente antes de darla por probada.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿Qué elementos debe contener necesariamente la portada de un informe OSINT?", "o": ["Únicamente el título del documento", "Título, código o referencia, organismo o unidad, autor, fecha, clasificación y versión", "Solo la fecha y la firma del autor", "El listado completo de fuentes consultadas"], "c": [1], "e": "La portada incluye título, código o referencia, organismo o unidad, autor, fecha, clasificación y versión.", "nota": ""}, {"id": "4.2", "t": 4, "n": 2, "q": "¿Cuál es la extensión máxima recomendada para el resumen ejecutivo de un informe OSINT?", "o": ["Cinco páginas", "Una página como máximo", "Diez páginas", "No existe límite recomendado"], "c": [1], "e": "El resumen ejecutivo debe ocupar una página como máximo.", "nota": ""}, {"id": "4.3", "t": 4, "n": 3, "q": "¿Qué preguntas debe responder de forma inmediata el resumen ejecutivo?", "o": ["Qué se investigó, qué se encontró, la principal conclusión, el grado de confianza y las acciones recomendadas", "Únicamente el presupuesto empleado en la investigación", "El nombre completo de todos los agentes intervinientes", "La legislación aplicable en materia de protección de datos"], "c": [0], "e": "El resumen ejecutivo responde de inmediato qué se investigó, qué se encontró, la conclusión principal, el grado de confianza y las acciones recomendadas.", "nota": ""}, {"id": "4.4", "t": 4, "n": 4, "q": "¿Qué apartado del informe debe precisar qué incluye y qué no incluye la investigación, así como el periodo analizado?", "o": ["El resumen ejecutivo", "El alcance", "Los hallazgos", "La bibliografía"], "c": [1], "e": "El alcance precisa qué incluye y qué no incluye la investigación y el periodo analizado.", "nota": ""}, {"id": "4.5", "t": 4, "n": 5, "q": "¿Qué tres elementos debe justificar y detallar la sección de metodología?", "o": ["Las fuentes consultadas, las técnicas utilizadas y las herramientas empleadas", "El coste económico, el número de agentes y la duración del turno", "El organigrama de la unidad y sus responsables", "El presupuesto asignado y los plazos administrativos"], "c": [0], "e": "La metodología justifica las fuentes consultadas, las técnicas utilizadas y las herramientas empleadas.", "nota": ""}, {"id": "4.6", "t": 4, "n": 6, "q": "¿Qué característica distingue a la sección de «hallazgos» de la sección de «análisis»?", "o": ["En los hallazgos se describen hechos sin interpretarlos, mientras que en el análisis sí se interpreta la información", "Los hallazgos solo pueden incluir capturas de pantalla", "El análisis se sitúa siempre antes que los hallazgos en la estructura del informe", "No existe diferencia relevante entre ambas secciones"], "c": [0], "e": "Los hallazgos describen hechos sin interpretarlos; el análisis es donde se interpreta la información.", "nota": ""}, {"id": "4.7", "t": 4, "n": 7, "q": "¿Cómo se identifica habitualmente cada evidencia individual dentro de la sección de hallazgos?", "o": ["Mediante un código único, por ejemplo E-001", "Mediante el nombre completo del investigador", "Mediante un número de expediente judicial obligatorio", "Mediante un color asignado aleatoriamente"], "c": [0], "e": "Cada evidencia se identifica con un código único, por ejemplo E-001.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "¿Qué operaciones incluye típicamente la sección de «procesamiento realizado»?", "o": ["Eliminación de duplicados, normalización de fechas, extracción de entidades y correlación entre fuentes", "La redacción íntegra de las conclusiones finales", "La solicitud formal de mandamientos judiciales", "La firma electrónica del documento final"], "c": [0], "e": "El procesamiento incluye eliminar duplicados, normalizar fechas, extraer entidades y correlacionar fuentes.", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿En qué apartados se subdivide habitualmente la sección de análisis de un informe OSINT?", "o": ["Relaciones identificadas, cronología, patrones detectados e hipótesis", "Portada, índice, glosario y anexos", "Fuentes, técnicas, herramientas y presupuesto", "Resumen ejecutivo, alcance y limitaciones"], "c": [0], "e": "El análisis se subdivide en relaciones identificadas, cronología, patrones detectados e hipótesis.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "¿Qué es el Admiralty Code y para qué se utiliza en un informe OSINT?", "o": ["Un sistema de doble entrada (letra A-F y número 1-6) para evaluar la fiabilidad de la fuente y la credibilidad de la información", "Un protocolo de cifrado de comunicaciones navales", "Un formulario exclusivo de la Marina para solicitar datos a operadoras", "Un sistema de numeración de páginas del informe"], "c": [0], "e": "El Admiralty Code es un sistema de doble entrada (letra A-F y número 1-6) que valora la fiabilidad de la fuente y la credibilidad de la información.", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "En el Admiralty Code, ¿qué representa la letra asignada a una evidencia (por ejemplo, la «A» en «A1»)?", "o": ["El nivel de clasificación del documento", "La fiabilidad de la fuente de la que procede la información", "El número de página en el que se cita la evidencia", "El idioma original de la fuente"], "c": [1], "e": "La letra del Admiralty Code (p. ej. la A de «A1») indica la fiabilidad de la fuente.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "En el Admiralty Code, ¿qué representa el número asignado a una evidencia (por ejemplo, el «1» en «A1»)?", "o": ["El número de anexo correspondiente", "La credibilidad o el grado de confirmación de la propia información", "El número de agentes que participaron en la investigación", "La duración en días de la investigación"], "c": [1], "e": "El número del Admiralty Code (p. ej. el 1 de «A1») indica la credibilidad o grado de confirmación de la propia información.", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Qué niveles se emplean habitualmente para expresar el grado de confianza global de una conclusión?", "o": ["Alto, medio y bajo", "Aprobado y denegado", "Urgente y no urgente", "Confidencial y público"], "c": [0], "e": "El grado de confianza global se expresa habitualmente en alto, medio y bajo.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Qué principio debe respetar estrictamente la sección de conclusiones de un informe OSINT?", "o": ["Puede incorporar información nueva no analizada previamente si refuerza la tesis principal", "Debe responder únicamente a los objetivos inicialmente planteados, sin introducir información nueva", "Debe limitarse a citar textualmente las fuentes consultadas", "Debe evitar mencionar el grado de confianza de cada conclusión"], "c": [1], "e": "Las conclusiones deben responder solo a los objetivos planteados al inicio, sin introducir información nueva.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué debe explicitar el apartado de «limitaciones» de un informe OSINT?", "o": ["Qué extremos no pueden afirmarse, qué queda pendiente de comprobar y qué información no estuvo disponible", "El listado de sanciones aplicables al investigado", "Los datos personales completos del investigador", "El coste total de las herramientas empleadas"], "c": [0], "e": "Las limitaciones explicitan qué no puede afirmarse, qué queda pendiente de comprobar y qué información no estuvo disponible.", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "¿Qué tipo de contenido debe incluir el apartado de «recomendaciones» de un informe OSINT?", "o": ["Nuevas líneas de investigación, información a solicitar, fuentes adicionales e indicadores a monitorizar", "Una valoración personal sobre la culpabilidad del investigado", "El texto íntegro de la normativa aplicable", "Una disculpa formal por las limitaciones del informe"], "c": [0], "e": "Las recomendaciones proponen nuevas líneas de investigación, información a solicitar, fuentes adicionales e indicadores a monitorizar.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "¿Qué elementos suelen recogerse en los anexos de un informe OSINT?", "o": ["Cronología detallada, grafo de relaciones y capturas de pantalla", "El currículum del autor del informe", "El listado de contraseñas empleadas durante la investigación", "Copia íntegra de la denuncia inicial"], "c": [0], "e": "Los anexos recogen cronología detallada, grafo de relaciones y capturas de pantalla.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Qué debe recoger de forma ordenada el apartado final de «bibliografía y referencias»?", "o": ["Las fuentes consultadas, la normativa aplicable, las metodologías empleadas y las herramientas utilizadas", "Únicamente el nombre del jefe de unidad que aprueba el informe", "Los datos personales de todas las personas mencionadas en el informe", "El presupuesto detallado de la investigación"], "c": [0], "e": "La bibliografía recoge ordenadamente fuentes, normativa, metodologías y herramientas utilizadas.", "nota": ""}, {"id": "4.19", "t": 4, "n": 19, "q": "¿Por qué se considera esencial que un informe OSINT sea «reproducible»?", "o": ["Porque debe poder imprimirse en varios formatos de papel", "Porque permite que otro investigador, partiendo de la misma información, pueda seguir el proceso y llegar a resultados equivalentes", "Porque así lo exige el Reglamento de Servicios Digitales", "Porque reduce el número de anexos necesarios"], "c": [1], "e": "Un informe reproducible permite que otro investigador, con la misma información, siga el proceso y llegue a resultados equivalentes.", "nota": ""}, {"id": "4.20", "t": 4, "n": 20, "q": "Si una evidencia se califica en el Admiralty Code como C2, ¿qué cabe deducir en comparación con una evidencia calificada como A1?", "o": ["Que ambas evidencias tienen exactamente el mismo grado de fiabilidad y credibilidad", "Que la evidencia C2 procede de una fuente y presenta una credibilidad de la información sensiblemente inferiores a la A1", "Que la evidencia C2 es judicialmente inadmisible en todo caso", "Que la clasificación C2 corresponde a fuentes exclusivamente policiales"], "c": [1], "e": "C2 indica fuente menos fiable y credibilidad menor que A1 (fuente completamente fiable e información confirmada), pero no implica inadmisibilidad judicial.", "nota": ""}];
const KEY='asig05_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
