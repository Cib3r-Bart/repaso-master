<script>
const DATA = [{"id": "2.1", "t": 2, "n": 1, "q": "¿Cuál de las siguientes definiciones corresponde mejor al análisis predictivo en ciberseguridad tal y como se define en el tema?", "o": ["Un algoritmo que garantiza conocer con certeza el próximo ataque", "El conjunto de técnicas que permiten estimar la probabilidad de eventos futuros a partir de datos históricos y actuales, reduciendo la incertidumbre para decidir antes", "Un sinónimo de seguridad puramente reactiva basada en DFIR", "Un sistema que sustituye por completo el criterio del analista humano"], "c": [1], "e": "El análisis predictivo estima la probabilidad de eventos futuros a partir de datos históricos y actuales para reducir la incertidumbre y decidir antes. No garantiza el futuro ni sustituye al analista.", "nota": ""}, {"id": "2.2", "t": 2, "n": 2, "q": "Según la pirámide del dolor de David Bianco, ¿qué tipo de indicador impone mayor coste al adversario si el defensor consigue detectarlo y bloquearlo?", "o": ["Los valores hash de ficheros", "Las direcciones IP", "Las herramientas y, sobre todo, las TTP", "Los nombres de dominio"], "c": [2], "e": "En la pirámide del dolor de Bianco, las herramientas y sobre todo las TTP son lo más costoso de cambiar para el adversario; hashes, IP y dominios son triviales de rotar.", "nota": ""}, {"id": "2.3", "t": 2, "n": 3, "q": "¿Qué diferencia principal existe entre un IoC y un IoA?", "o": ["No existe ninguna diferencia relevante", "El IoC es evidencia de que un ataque ya ha ocurrido; el IoA refleja un comportamiento hostil en curso que aún puede interrumpirse", "El IoA solo se aplica a malware sin fichero", "El IoC siempre tiene mayor valor predictivo que el IoA"], "c": [1], "e": "El IoC es evidencia de que el ataque ya ocurrió; el IoA refleja un comportamiento hostil en curso que aún puede interrumpirse.", "nota": ""}, {"id": "2.4", "t": 2, "n": 4, "q": "En el ciclo de inteligencia aplicado a la predicción, ¿en qué fase se formula la pregunta de inteligencia que orienta todo el trabajo posterior?", "o": ["Obtención", "Dirección", "Elaboración", "Difusión"], "c": [1], "e": "En la fase de Dirección se formula la pregunta de inteligencia que orienta el resto del ciclo.", "nota": ""}, {"id": "2.5", "t": 2, "n": 5, "q": "¿Qué sesgo cognitivo consiste en buscar y sobrevalorar la evidencia que confirma la hipótesis que ya se prefería?", "o": ["El anclaje", "El efecto espejo", "El sesgo de confirmación", "La paradoja de la tasa base"], "c": [2], "e": "El sesgo de confirmación lleva a buscar y sobrevalorar la evidencia que respalda la hipótesis preferida.", "nota": ""}, {"id": "2.6", "t": 2, "n": 6, "q": "¿En qué consiste el análisis de hipótesis en competencia (ACH) de Richards Heuer?", "o": ["En quedarse siempre con la primera explicación disponible", "En enumerar todas las hipótesis plausibles y evaluar cada evidencia contra todas ellas buscando refutar, no confirmar", "En sustituir el lenguaje de probabilidad por afirmaciones categóricas", "En descartar automáticamente cualquier hipótesis minoritaria"], "c": [1], "e": "El ACH de Heuer enumera todas las hipótesis plausibles y evalúa cada evidencia contra todas, buscando refutar y no confirmar.", "nota": ""}, {"id": "2.7", "t": 2, "n": 7, "q": "¿Cuáles son las tres familias de métodos para identificar patrones de comportamiento malicioso?", "o": ["Reglas y firmas; estadística y anomalías; aprendizaje automático", "SIEM, TIP y EDR", "IoC, IoA y TTP", "Kill Chain, Diamante y MITRE ATT&CK"], "c": [0], "e": "Las tres familias son reglas y firmas, estadística y anomalías, y aprendizaje automático.", "nota": ""}, {"id": "2.8", "t": 2, "n": 8, "q": "¿Qué mide específicamente una plataforma UEBA?", "o": ["El cumplimiento normativo de la organización", "Las desviaciones significativas respecto de una línea base de comportamiento normal de usuario, equipo o servicio", "El número de reglas YARA activas", "El tráfico cifrado en la red corporativa"], "c": [1], "e": "UEBA mide las desviaciones significativas respecto de una línea base de comportamiento normal de usuario, equipo o servicio.", "nota": ""}, {"id": "2.9", "t": 2, "n": 9, "q": "¿Qué diferencia principal existe entre el aprendizaje automático supervisado y el no supervisado en detección de patrones?", "o": ["No hay diferencia práctica entre ambos", "El supervisado entrena con ejemplos etiquetados de casos conocidos; el no supervisado agrupa por similitud sin disponer de etiquetas previas", "El no supervisado solo se aplica a firmas YARA", "El supervisado nunca puede usarse contra el phishing"], "c": [1], "e": "El aprendizaje supervisado entrena con ejemplos etiquetados; el no supervisado agrupa por similitud sin etiquetas previas.", "nota": ""}, {"id": "2.10", "t": 2, "n": 10, "q": "¿Qué elemento de la arquitectura práctica centraliza y normaliza la telemetría, ejerciendo de archivo central de eventos?", "o": ["El SOAR", "El SIEM", "El TIP", "El EDR"], "c": [1], "e": "El SIEM centraliza y normaliza la telemetría y actúa como archivo central de eventos.", "nota": ""}, {"id": "2.11", "t": 2, "n": 11, "q": "¿Cuál es la función principal de una plataforma de inteligencia de amenazas (TIP) como MISP u OpenCTI?", "o": ["Cifrar las comunicaciones internas de la organización", "Compartir y enriquecer indicadores de amenazas con contexto entre organizaciones", "Sustituir al SIEM en la correlación de eventos", "Gestionar el inventario de activos físicos"], "c": [1], "e": "Un TIP (MISP, OpenCTI) comparte y enriquece indicadores de amenazas con contexto entre organizaciones.", "nota": ""}, {"id": "2.12", "t": 2, "n": 12, "q": "¿Qué automatiza específicamente un SOAR?", "o": ["La recolección de telemetría de red", "El triaje y las respuestas rutinarias ante incidentes, liberando al analista para decisiones que requieren criterio humano", "El cifrado de los discos de los equipos", "La elaboración de la pirámide del dolor"], "c": [1], "e": "El SOAR automatiza el triaje y las respuestas rutinarias, liberando al analista para las decisiones que requieren criterio humano.", "nota": ""}, {"id": "2.13", "t": 2, "n": 13, "q": "¿En qué consiste la paradoja de la tasa base como limitación de la detección automatizada?", "o": ["En que un detector con alta precisión nunca produce falsas alarmas", "En que, cuando el evento buscado es muy raro, incluso un detector muy preciso produce mayoría de falsas alarmas, generando fatiga de alertas", "En que los IoC tienen siempre mayor tasa de acierto que los IoA", "En que el SOAR sustituye completamente la necesidad de un SIEM"], "c": [1], "e": "Si el evento buscado es muy raro, incluso un detector muy preciso genera mayoría de falsas alarmas, lo que provoca fatiga de alertas.", "nota": ""}, {"id": "2.14", "t": 2, "n": 14, "q": "¿Qué se entiende por «deriva» (drift) como limitación de los modelos de detección?", "o": ["La pérdida física de servidores del SIEM", "El cambio progresivo del comportamiento «normal» de la organización que hace que un modelo entrenado con datos antiguos pierda precisión si no se recalibra", "La reducción del número de reglas YARA disponibles", "El aumento del coste de licencia del EDR"], "c": [1], "e": "La deriva (drift) es el cambio progresivo de lo «normal» en la organización, que hace perder precisión a un modelo si no se recalibra.", "nota": ""}, {"id": "2.15", "t": 2, "n": 15, "q": "Según el tema, ¿qué porcentaje aproximado del phishing observado ya incorpora componentes de IA generativa según ENISA?", "o": ["Menos del 10 %", "Alrededor del 50 %", "Más del 80 %", "El 100 %"], "c": [2], "e": "Según ENISA, más del 80 % del phishing observado ya incorpora componentes de IA generativa.", "nota": ""}, {"id": "2.16", "t": 2, "n": 16, "q": "¿Qué ilustra específicamente el caso Arup (Hong Kong) citado en el tema?", "o": ["Un ataque de ransomware clásico contra infraestructura crítica", "Un fraude mediante videollamada con deepfakes de voz y vídeo que suplantaron a directivos y compañeros reconocibles", "Una campaña de smishing bancario en España", "Un ataque de denegación de servicio distribuido (DDoS)"], "c": [1], "e": "El caso Arup (Hong Kong) ilustra un fraude por videollamada con deepfakes de voz y vídeo que suplantaron a directivos y compañeros.", "nota": ""}, {"id": "2.17", "t": 2, "n": 17, "q": "En el caso operativo de la campaña de smishing bancario, ¿qué se entiende por la fase de «agrupar» (clustering)?", "o": ["Bloquear directamente todos los dominios sospechosos sin analizarlos", "Reunir los dominios que comparten registrador, TLD, esquema de nomenclatura o certificados emitidos en lote, descartando el ruido de dominios legítimos", "Elaborar el informe final para la entidad afectada", "Calcular el hash de cada SMS recibido"], "c": [1], "e": "En «agrupar» se reúnen los dominios que comparten registrador, TLD, nomenclatura o certificados emitidos en lote, descartando el ruido de dominios legítimos.", "nota": ""}, {"id": "2.18", "t": 2, "n": 18, "q": "¿Qué se busca determinar en la fase de «medir» (análisis temporal) del caso de smishing bancario?", "o": ["El número total de víctimas potenciales", "Cuánto tiempo permanecen «dormidos» los dominios entre su registro y el envío del primer SMS, para estimar una ventana de anticipación", "El coste económico total de la campaña", "La ubicación geográfica exacta del atacante"], "c": [1], "e": "En «medir» se analiza cuánto permanecen «dormidos» los dominios entre su registro y el primer SMS, para estimar una ventana de anticipación.", "nota": ""}, {"id": "2.19", "t": 2, "n": 19, "q": "¿Qué término describe genéricamente el conjunto de técnicas —análisis de hipótesis en competencia, lenguaje de probabilidad calibrado— que sistematizan el razonamiento del analista frente a sus sesgos?", "o": ["Técnicas estructuradas de análisis", "Indicadores de ataque", "Arquitectura SIEM/TIP/EDR/SOAR", "Pirámide del dolor"], "c": [0], "e": "Las técnicas estructuradas de análisis (ACH, lenguaje de probabilidad calibrado) sistematizan el razonamiento del analista frente a sus sesgos.", "nota": ""}, {"id": "2.20", "t": 2, "n": 20, "q": "¿Cuál de las siguientes NO es una de las cinco ideas de síntesis del tema sobre análisis predictivo?", "o": ["El valor de un indicador se mide en el dolor que causa al adversario perderlo", "Reglas, anomalías y aprendizaje automático se combinan; ninguna familia basta por separado", "La máquina calcula; el analista interpreta, contextualiza y decide", "El uso de inteligencia artificial elimina por completo la necesidad de analistas humanos"], "c": [3], "e": "La IA no elimina la necesidad de analistas humanos; el tema sostiene que la máquina calcula y el analista interpreta.", "nota": ""}, {"id": "3.1", "t": 3, "n": 1, "q": "¿Cuáles son los cuatro vértices que conecta el Modelo Diamante en cada evento analizado?", "o": ["Dato, información, conocimiento e inteligencia", "Adversario, capacidad, infraestructura y víctima", "Dirección, obtención, elaboración y difusión", "IoC, IoA, TTP y actor"], "c": [1], "e": "Los cuatro vértices del Modelo Diamante son adversario, capacidad, infraestructura y víctima.", "nota": ""}, {"id": "3.2", "t": 3, "n": 2, "q": "¿En qué consiste el «pivotaje» dentro del Modelo Diamante?", "o": ["En cambiar automáticamente de proveedor de inteligencia", "En explorar el resto de vértices partiendo de cualquiera de los cuatro conocidos, por ejemplo una IP o un dominio", "En sustituir el Modelo Diamante por MITRE ATT&CK", "En clasificar un grupo exclusivamente por su nombre comercial"], "c": [1], "e": "El pivotaje consiste en explorar el resto de vértices partiendo de cualquiera de los cuatro conocidos, por ejemplo una IP o un dominio.", "nota": ""}, {"id": "3.3", "t": 3, "n": 3, "q": "¿Qué representa la «táctica» dentro de la matriz MITRE ATT&CK Enterprise?", "o": ["El nombre comercial del grupo atacante", "El «para qué» de cada fase del ataque", "El hash concreto del malware empleado", "El país de origen del adversario"], "c": [1], "e": "En MITRE ATT&CK la táctica es el «para qué» de cada fase; la técnica es el «cómo».", "nota": ""}, {"id": "3.4", "t": 3, "n": 4, "q": "Según la lectura comparada de actores, ¿qué motivación caracteriza principalmente al actor estatal frente al cibercrimen?", "o": ["Monetización rápida y volumen", "Inteligencia, influencia o preposicionamiento, con prioridad en la continuidad y el sigilo", "Visibilidad e impacto simbólico oportunista", "Abuso de un acceso legítimo sin intención definida"], "c": [1], "e": "El actor estatal busca inteligencia, influencia o preposicionamiento, priorizando la continuidad y el sigilo; el cibercrimen busca monetización rápida.", "nota": ""}, {"id": "3.5", "t": 3, "n": 5, "q": "¿Qué caracteriza al playbook del cibercrimen según el tema?", "o": ["Prioriza el sigilo indefinido sin buscar nunca el cobro", "Optimiza el tiempo hasta el cobro mediante acceso, expansión, control y monetización", "Se basa exclusivamente en vulnerabilidades de día cero", "Excluye por completo el uso de ingeniería social"], "c": [1], "e": "El playbook del cibercrimen optimiza el tiempo hasta el cobro: acceso, expansión, control y monetización.", "nota": ""}, {"id": "3.6", "t": 3, "n": 6, "q": "¿Qué caso ilustra específicamente el abuso del servicio de ayuda técnica (help desk) mediante ingeniería social para tomar el control de una cuenta en apenas 24 minutos?", "o": ["Glacial Panda", "Murky Panda", "Scattered Spider", "Famous Chollima"], "c": [2], "e": "Scattered Spider ilustra el abuso del help desk mediante ingeniería social para tomar una cuenta en unos 24 minutos.", "nota": ""}, {"id": "3.7", "t": 3, "n": 7, "q": "¿Qué revela la estadística según la cual el 81 % de las intrusiones detectadas por identidad no emplean malware?", "o": ["Que el malware ha dejado de existir como amenaza", "Que la identidad y el abuso de credenciales válidas se han convertido en el foco principal de defensa, más que la firma de malware", "Que solo los actores estatales evitan el malware", "Que el SIEM ya no resulta necesario"], "c": [1], "e": "Que el 81 % de las intrusiones por identidad no use malware muestra que el abuso de credenciales válidas es el foco principal de defensa, más que la firma de malware.", "nota": ""}, {"id": "3.8", "t": 3, "n": 8, "q": "¿Qué caracteriza específicamente al actor descrito como Famous Chollima?", "o": ["Un grupo hacktivista europeo sin vínculo estatal", "Operativos DPRK-nexus que se infiltran como falsos teletrabajadores de TI usando identidades falsas e IA generativa", "Un actor exclusivamente centrado en ransomware contra hospitales", "Una plataforma de intercambio de inteligencia entre fuerzas de seguridad"], "c": [1], "e": "Famous Chollima agrupa operativos vinculados a Corea del Norte que se infiltran como falsos teletrabajadores de TI con identidades falsas e IA generativa.", "nota": ""}, {"id": "3.9", "t": 3, "n": 9, "q": "¿Cuál de los siguientes NO forma parte del playbook típico de un actor estatal según el tema?", "o": ["Acceso discreto", "Persistencia paciente", "Living-off-the-land", "Monetización inmediata mediante ransomware masivo"], "c": [3], "e": "La monetización inmediata con ransomware masivo es propia del cibercrimen; el actor estatal usa acceso discreto, persistencia paciente y living-off-the-land.", "nota": ""}, {"id": "3.10", "t": 3, "n": 10, "q": "¿Qué ilustra el caso Glacial Panda?", "o": ["Living-off-the-land en telecomunicaciones por un actor China-nexus orientado al «juego largo»", "Un ataque de phishing bancario en España", "La taxonomía CrowdStrike aplicada al hacktivismo", "Una campaña de smishing dirigida a ayuntamientos"], "c": [0], "e": "Glacial Panda ilustra el living-off-the-land en telecomunicaciones por un actor China-nexus orientado al «juego largo».", "nota": ""}, {"id": "3.11", "t": 3, "n": 11, "q": "¿Qué caracteriza al caso Murky Panda?", "o": ["El abuso de relaciones de confianza con proveedores y del propio entorno cloud para alcanzar a la víctima final", "Un ataque DDoS masivo contra infraestructura crítica europea", "El uso exclusivo de ransomware como servicio (RaaS)", "Una campaña de desinformación en redes sociales"], "c": [0], "e": "Murky Panda abusa de relaciones de confianza con proveedores y del entorno cloud para llegar a la víctima final.", "nota": ""}, {"id": "3.12", "t": 3, "n": 12, "q": "¿Por qué se afirma que la frontera entre cibercrimen y Estado es porosa?", "o": ["Porque nunca comparten herramientas ni técnicas", "Porque existen actores de doble propósito como APT41/G0096 y Estados que toleran o subcontratan operaciones de cibercrimen", "Porque los actores estatales jamás usan malware comercial", "Porque el cibercrimen carece por completo de motivación económica"], "c": [1], "e": "La frontera es porosa porque hay actores de doble propósito (APT41/G0096) y Estados que toleran o subcontratan cibercrimen.", "nota": ""}, {"id": "3.13", "t": 3, "n": 13, "q": "Según la definición de referencia del NIST citada en el tema, ¿qué tres atributos deben darse a la vez para hablar de una APT?", "o": ["Anonymous, Persistent, Technical", "Advanced, Persistent, Threat", "Attributed, Public, Traceable", "Active, Proven, Targeted"], "c": [1], "e": "Para el NIST, APT = Advanced, Persistent, Threat: los tres atributos a la vez.", "nota": ""}, {"id": "3.14", "t": 3, "n": 14, "q": "¿Por qué se afirma que una APT se reconoce «por campaña, no por evento»?", "o": ["Porque un incidente aislado es una fotografía, mientras que la campaña —con reentrada y adaptación— es la película que muestra intención y continuidad", "Porque los eventos aislados nunca generan alertas", "Porque el Modelo Diamante prohíbe analizar eventos individuales", "Porque MITRE ATT&CK solo admite campañas de más de un año"], "c": [0], "e": "Un incidente aislado es una fotografía; la campaña, con reentrada y adaptación, es la película que muestra intención y continuidad.", "nota": ""}, {"id": "3.15", "t": 3, "n": 15, "q": "¿Cuál de las siguientes NO es una señal fuerte que eleva razonablemente la hipótesis de una APT?", "o": ["Reentrada tras bloqueos y contención", "Adaptación de infraestructura o técnica tras ser detectado", "Victimología coherente y repetida en el tiempo", "Un único IoC llamativo como una IP o un hash aislado"], "c": [3], "e": "Un único IoC aislado (una IP o un hash) no basta para sospechar una APT; sí lo hacen la reentrada, la adaptación y la victimología coherente.", "nota": ""}, {"id": "3.16", "t": 3, "n": 16, "q": "¿Por qué constituyen los adversarios cross-domain (identidad, endpoint y cloud) un punto ciego especialmente relevante?", "o": ["Porque reparten su actividad entre dominios de forma que cada uno genera pocas alertas por separado, y solo la correlación conjunta revela la intrusión", "Porque únicamente operan fuera de horario laboral", "Porque no pueden ser detectados nunca, ni siquiera correlacionando fuentes", "Porque solo afectan a organizaciones sin SIEM"], "c": [0], "e": "Los adversarios cross-domain reparten su actividad entre identidad, endpoint y cloud, generando pocas alertas por dominio; solo la correlación conjunta los revela.", "nota": ""}, {"id": "3.17", "t": 3, "n": 17, "q": "¿Cuáles son las cuatro lentes que, combinadas, describen a un grupo de amenaza según su metodología de clasificación?", "o": ["IoC, IoA, TTP y actor", "Motivación, victimología, capacidad y trazas/TTP", "Dirección, obtención, elaboración y difusión", "SIEM, TIP, EDR y SOAR"], "c": [1], "e": "Las cuatro lentes son motivación, victimología, capacidad y trazas/TTP.", "nota": ""}, {"id": "3.18", "t": 3, "n": 18, "q": "En la taxonomía de CrowdStrike, ¿qué sufijo animal codifica a un actor de origen ruso?", "o": ["KITTEN", "BEAR", "CHOLLIMA", "SPIDER"], "c": [1], "e": "En la taxonomía de CrowdStrike, BEAR identifica a actores rusos (KITTEN = Irán, CHOLLIMA = Corea del Norte, SPIDER = cibercrimen).", "nota": ""}, {"id": "3.19", "t": 3, "n": 19, "q": "¿Por qué no basta con comparar «etiquetas» de técnicas para medir la similitud de TTP entre dos actores?", "o": ["Porque MITRE ATT&CK prohíbe expresamente esa comparación", "Porque dos actores pueden compartir una técnica sin compartir el mismo procedimiento, secuencia, pretexto, horario o infraestructura", "Porque las técnicas cambian de nombre cada semestre", "Porque solo los actores estatales tienen técnicas comparables"], "c": [1], "e": "Dos actores pueden compartir una técnica sin compartir procedimiento, secuencia, pretexto, horario o infraestructura; por eso no basta comparar etiquetas.", "nota": ""}, {"id": "3.20", "t": 3, "n": 20, "q": "¿Qué actor fue identificado, con confianza alta, como responsable del ataque a MGM Resorts en septiembre de 2023 mediante vishing al help desk y despliegue de ransomware ALPHV/BlackCat?", "o": ["Scattered Spider", "Glacial Panda", "Famous Chollima", "UNC5537"], "c": [0], "e": "Scattered Spider fue identificado con confianza alta como responsable del ataque a MGM Resorts (sept. 2023) mediante vishing al help desk y ransomware ALPHV/BlackCat.", "nota": ""}, {"id": "4.1", "t": 4, "n": 1, "q": "¿Qué elemento constituye, según el tema, la unidad mínima de información, sin que incorpore ningún juicio de valor?", "o": ["La inteligencia", "El conocimiento", "El dato", "La estrategia"], "c": [2], "e": "El dato es la unidad mínima de información, sin ningún juicio de valor.", "nota": ""}, {"id": "4.2", "t": 4, "n": 2, "q": "¿Qué diferencia principal existe entre el conocimiento tácito y el conocimiento explícito?", "o": ["No existe ninguna diferencia relevante entre ambos", "El tácito es intuitivo, personal y difícil de documentar; el explícito está estructurado y es fácilmente documentable", "El explícito solo existe en el ámbito militar", "El tácito siempre es más fiable que el explícito"], "c": [1], "e": "El conocimiento tácito es intuitivo, personal y difícil de documentar; el explícito está estructurado y es fácilmente documentable.", "nota": ""}, {"id": "4.3", "t": 4, "n": 3, "q": "Según la «Trinidad de Kent» formulada por Sherman Kent, ¿cuáles son las tres realidades que engloba el concepto de inteligencia?", "o": ["Dato, información y conocimiento", "Proceso, organización y producto", "HUMINT, OSINT y SIGINT", "Dirección, obtención y difusión"], "c": [1], "e": "La Trinidad de Kent entiende la inteligencia como proceso, organización y producto.", "nota": ""}, {"id": "4.4", "t": 4, "n": 4, "q": "¿Cuáles son los tres elementos que componen el concepto de estrategia según el tema?", "o": ["Finalidad u objetivo, medios y forma o método", "Dato, información e inteligencia", "IoC, IoA y TTP", "Adversario, capacidad y víctima"], "c": [0], "e": "La estrategia se compone de finalidad u objetivo, medios y forma o método.", "nota": ""}, {"id": "4.5", "t": 4, "n": 5, "q": "Según el nivel de decisión, ¿qué tipo de inteligencia ejecutan los ministerios para la aplicación directa de las decisiones marcadas por el órgano central?", "o": ["Inteligencia nacional", "Inteligencia departamental", "Inteligencia operativa", "Inteligencia crítica"], "c": [1], "e": "La inteligencia departamental la ejecutan los ministerios para aplicar directamente las decisiones del órgano central.", "nota": ""}, {"id": "4.6", "t": 4, "n": 6, "q": "Según su finalidad, ¿qué tipo de inteligencia facilita la determinación de objetivos generales a largo plazo y la identificación de tendencias y modus operandi por encima del caso concreto?", "o": ["Inteligencia operativa", "Inteligencia estratégica", "Inteligencia prospectiva o estimativa", "Inteligencia básica"], "c": [1], "e": "La inteligencia estratégica fija objetivos generales a largo plazo e identifica tendencias y modus operandi por encima del caso concreto.", "nota": ""}, {"id": "4.7", "t": 4, "n": 7, "q": "¿Qué disciplina de inteligencia procede específicamente de la detección y descifrado de señales y transmisiones, subdividiéndose en COMINT y ELINT?", "o": ["HUMINT", "OSINT", "SIGINT", "IMINT"], "c": [2], "e": "SIGINT procede de la detección y descifrado de señales y transmisiones, y se subdivide en COMINT y ELINT.", "nota": ""}, {"id": "4.8", "t": 4, "n": 8, "q": "¿En qué consiste específicamente la inteligencia ELINT?", "o": ["El análisis de fuentes humanas confidentes", "La detección de emisiones electromagnéticas de medios ajenos a las telecomunicaciones, como radares", "El análisis exclusivo de imágenes de satélite", "La búsqueda avanzada en fuentes abiertas de Internet"], "c": [1], "e": "ELINT detecta emisiones electromagnéticas de medios ajenos a las telecomunicaciones, como los radares.", "nota": ""}, {"id": "4.9", "t": 4, "n": 9, "q": "¿Cuáles son las cuatro fases del ciclo de inteligencia según el modelo del CNI adoptado en el tema?", "o": ["Recolección, procesamiento, análisis y difusión", "Dirección, obtención, elaboración y difusión", "Planificación, ejecución, evaluación y feedback", "Identificación, obtención, correlación y decisión"], "c": [1], "e": "Las cuatro fases del ciclo del CNI son dirección, obtención, elaboración y difusión.", "nota": ""}, {"id": "4.10", "t": 4, "n": 10, "q": "En el ejemplo práctico del ataque de ransomware a una red hospitalaria, ¿qué se realiza durante la fase de dirección?", "o": ["Se redacta el informe final para el juez de instrucción", "Se identifica el grupo delictivo y se neutraliza el servidor de mando y control para frenar la propagación", "Se calcula el hash del ejecutable del malware", "Se emite la alerta de ciberseguridad al resto de hospitales"], "c": [1], "e": "En la dirección se identifica al grupo delictivo y se neutraliza el servidor de mando y control para frenar la propagación.", "nota": ""}, {"id": "4.11", "t": 4, "n": 11, "q": "¿Cuántas fases contempla el ciclo de inteligencia según el modelo de la CIA estadounidense mencionado en el tema, en comparación con las cuatro del CNI?", "o": ["Tres fases", "Cinco fases", "Diez fases", "Dos fases"], "c": [1], "e": "El modelo de la CIA tiene cinco fases, frente a las cuatro del CNI.", "nota": ""}, {"id": "4.12", "t": 4, "n": 12, "q": "¿Qué máxima de Lowenthal se cita en el tema para ilustrar la diferencia entre información e inteligencia?", "o": ["«Si conoces al enemigo y te conoces a ti mismo, no debes temer el resultado de cien batallas»", "«Toda inteligencia es información, pero no toda información es inteligencia»", "«Not all info is intelligence» se aplica solo al ámbito militar", "«La inteligencia siempre proviene de fuentes humanas»"], "c": [1], "e": "La máxima de Lowenthal es: «Toda inteligencia es información, pero no toda información es inteligencia».", "nota": ""}, {"id": "4.13", "t": 4, "n": 13, "q": "¿Qué modelo de entrevista de obtención HUMINT compuesto por planificación, explicación, aclaración, cierre y evaluación se menciona en el tema?", "o": ["El modelo PEACE", "La técnica SCHARFF", "El protocolo NIZAM", "El modelo MICE"], "c": [0], "e": "El modelo PEACE (planificación, explicación, aclaración, cierre y evaluación) es el de entrevista de obtención HUMINT citado.", "nota": ""}, {"id": "4.14", "t": 4, "n": 14, "q": "¿Qué caracteriza a la metodología GPE (Geospatial Intelligence Preparation of the Environment) dentro de la disciplina GEOINT?", "o": ["Se limita al análisis de comunicaciones interceptadas", "Integra definición del entorno, análisis de su influencia, evaluación de amenazas y peligros, y conclusiones analíticas", "Sustituye por completo a la inteligencia HUMINT", "Solo se aplica en el ámbito estrictamente militar, sin otros usos"], "c": [1], "e": "GPE integra definición del entorno, análisis de su influencia, evaluación de amenazas y peligros, y conclusiones analíticas.", "nota": ""}, {"id": "4.15", "t": 4, "n": 15, "q": "¿Qué evalúa específicamente el método CBCA (Criteria-Based Content Analysis)?", "o": ["La fiabilidad de una fuente mediante una letra de la A a la F", "La credibilidad de un testimonio mediante análisis de contenido, como detalles lógicos y componentes emocionales", "La ubicación geográfica exacta de una fotografía", "El nivel de cifrado de una comunicación interceptada"], "c": [1], "e": "CBCA evalúa la credibilidad de un testimonio mediante análisis de contenido: detalles lógicos, componentes emocionales, etc.", "nota": ""}, {"id": "4.16", "t": 4, "n": 16, "q": "¿Cómo estructura el sistema STANAG 2022 de la OTAN la evaluación de la información?", "o": ["Mediante un único número del 1 al 10", "Mediante una matriz alfanumérica: una letra (A-F) para la fiabilidad de la fuente y un número (1-6) para la credibilidad de la información", "Mediante colores del semáforo (rojo, ámbar, verde)", "Mediante un porcentaje de confianza calculado automáticamente"], "c": [1], "e": "STANAG 2022 usa una matriz alfanumérica: letra A-F para la fiabilidad de la fuente y número 1-6 para la credibilidad de la información.", "nota": ""}, {"id": "4.17", "t": 4, "n": 17, "q": "En el caso práctico de geolocalización de una fotografía, ¿qué elemento del entorno permitió acotar la ubicación a España, dentro del análisis de pequeños detalles?", "o": ["El tipo de vegetación observada", "Las señales de una rotonda con hitos H-75, estandarizados por la Dirección General de Tráfico", "La marca del vehículo estacionado", "El idioma de un cartel publicitario"], "c": [1], "e": "Las señales de rotonda con hitos H-75, estandarizados por la DGT, permitieron acotar la ubicación a España.", "nota": ""}, {"id": "4.18", "t": 4, "n": 18, "q": "¿Qué herramienta se empleó en el caso práctico para estimar la hora aproximada de la toma de la fotografía a partir de la posición y longitud de una sombra?", "o": ["Google Dorking", "SunCalc", "MISP", "Namechk"], "c": [1], "e": "SunCalc estima la hora aproximada de una toma a partir de la posición y longitud de las sombras.", "nota": ""}, {"id": "4.19", "t": 4, "n": 19, "q": "En el caso práctico de Google Dorking, ¿qué función cumple específicamente el operador site:?", "o": ["Excluye un término de los resultados", "Limita la búsqueda a un dominio o extensión web concretos", "Busca archivos de un formato determinado", "Localiza una palabra dentro de la URL de la página"], "c": [1], "e": "El operador site: limita la búsqueda a un dominio o extensión web concretos.", "nota": ""}, {"id": "4.20", "t": 4, "n": 20, "q": "¿Qué consulta de Google Dorking permitiría obtener únicamente documentos PDF sobre procesos selectivos publicados en el dominio oficial de la Policía Nacional?", "o": ["filetype:pdf site:policia.es “proceso selectivo”", "inurl:login “proceso selectivo”", "site:wikipedia.org “proceso selectivo”", "related:policia.es filetype:doc"], "c": [0], "e": "filetype:pdf restringe a PDF, site:policia.es al dominio oficial y las comillas fijan la expresión exacta «proceso selectivo».", "nota": ""}, {"id": "5.1", "t": 5, "n": 1, "q": "¿A qué se refiere el problema de partida descrito en el tema como «la inteligencia que nadie usó»?", "o": ["A la ausencia total de datos disponibles antes del incidente", "A que los datos que hubieran permitido anticipar el incidente ya existían dispersos, pero nadie los compuso a tiempo en una alerta accionable", "A un fallo exclusivamente técnico del SIEM", "A la imposibilidad legal de compartir información entre organismos"], "c": [1], "e": "«La inteligencia que nadie usó»: los datos para anticipar el incidente existían dispersos, pero nadie los compuso a tiempo en una alerta accionable.", "nota": ""}, {"id": "5.2", "t": 5, "n": 2, "q": "¿Cuál de los siguientes NO es uno de los cinco consumidores habituales de ciberinteligencia descritos en el tema?", "o": ["El SOC de una empresa", "El responsable de seguridad", "El decisor institucional", "El público general sin ninguna función profesional"], "c": [3], "e": "El público general sin función profesional no es uno de los cinco consumidores; sí lo son el SOC, el responsable de seguridad, el decisor institucional, etc.", "nota": ""}, {"id": "5.3", "t": 5, "n": 3, "q": "¿Qué necesita típicamente un investigador policial de un informe de ciberinteligencia, según la lectura del mismo informe con cinco miradas distintas?", "o": ["Solo indicadores listos para desplegar de forma inmediata", "Infraestructura, datos y conexiones con investigaciones previas", "Exclusivamente el riesgo agregado a nivel territorial", "Una valoración puramente política del problema"], "c": [1], "e": "El investigador policial necesita infraestructura, datos y conexiones con investigaciones previas.", "nota": ""}, {"id": "5.4", "t": 5, "n": 4, "q": "¿Qué función cumplen los ISAC (Information Sharing and Analysis Center) en el circuito técnico de la industria?", "o": ["Sustituyen por completo al SIEM en la correlación de eventos", "Agrupan a empresas del mismo sector para compartir indicadores de compromiso con mayor valor contextual y menor ruido", "Ejecutan automáticamente la respuesta ante una alerta", "Cifran las comunicaciones internas de una organización"], "c": [1], "e": "Los ISAC agrupan empresas del mismo sector para compartir IoC con mayor valor contextual y menor ruido.", "nota": ""}, {"id": "5.5", "t": 5, "n": 5, "q": "¿Qué diferencia principal existe entre una plataforma de inteligencia de amenazas como MISP u OpenCTI y un SIEM?", "o": ["No existe diferencia, son sinónimos", "El TIP (MISP/OpenCTI) comparte y enriquece indicadores entre organizaciones; el SIEM centraliza y correlaciona los registros propios de la organización", "El SIEM solo se usa en el ámbito militar", "MISP sustituye completamente la necesidad de un EDR"], "c": [1], "e": "El TIP comparte y enriquece indicadores entre organizaciones; el SIEM centraliza y correlaciona los registros propios.", "nota": ""}, {"id": "5.6", "t": 5, "n": 6, "q": "¿Qué formato de reglas describe patrones de comportamiento sospechoso sobre registros de eventos de forma agnóstica a la plataforma, traducible al lenguaje de cualquier SIEM?", "o": ["YARA", "Sigma", "STIX", "TLP"], "c": [1], "e": "Sigma describe patrones sospechosos sobre registros de eventos de forma agnóstica, traducibles a cualquier SIEM (YARA es para ficheros/malware).", "nota": ""}, {"id": "5.7", "t": 5, "n": 7, "q": "¿Qué instrumento resulta de referencia para identificar ficheros o familias de malware mediante patrones de contenido como cadenas de texto o estructura binaria?", "o": ["Sigma", "SOAR", "YARA", "EDR"], "c": [2], "e": "YARA identifica ficheros o familias de malware mediante patrones de contenido (cadenas, estructura binaria).", "nota": ""}, {"id": "5.8", "t": 5, "n": 8, "q": "¿Qué organismo, dependiente del Centro Criptológico Nacional, es responsable de la ciberseguridad de las administraciones públicas dentro de la vía administrativa española?", "o": ["INCIBE-CERT", "CCN-CERT", "Europol EC3", "J-CAT"], "c": [1], "e": "El CCN-CERT, dependiente del CCN, es responsable de la ciberseguridad de las administraciones públicas.", "nota": ""}, {"id": "5.9", "t": 5, "n": 9, "q": "Dentro de la vía policial europea, ¿qué red permite el intercambio seguro de información entre unidades nacionales especializadas en ciberdelincuencia?", "o": ["EMPACT", "SIENA", "OCC", "MISP"], "c": [1], "e": "SIENA es la red de Europol para el intercambio seguro de información entre unidades nacionales especializadas.", "nota": ""}, {"id": "5.10", "t": 5, "n": 10, "q": "¿Cuál es la principal limitación práctica de la vía privada de intercambio de ciberinteligencia señalada en el tema, más allá de su rapidez?", "o": ["La imposibilidad técnica de generar indicadores de compromiso", "La asimetría del flujo: el sector privado percibe la relación como unidireccional, remitiendo indicadores sin recibir contexto o retroalimentación", "La ausencia total de recursos económicos del sector privado", "La prohibición legal absoluta de compartir cualquier dato con las autoridades"], "c": [1], "e": "La vía privada es rápida, pero su límite es la asimetría: el sector privado remite indicadores sin recibir contexto ni retroalimentación.", "nota": ""}, {"id": "5.11", "t": 5, "n": 11, "q": "¿Cuál es la primera de las cuatro piezas para montar el procedimiento de consumo de ciberinteligencia en una unidad?", "o": ["La rutina de consumo", "Definir los requisitos de inteligencia de la unidad mediante preguntas permanentes por escrito", "Los criterios de priorización", "El triaje de lo que entra"], "c": [1], "e": "La primera pieza es definir los requisitos de inteligencia de la unidad mediante preguntas permanentes por escrito.", "nota": ""}, {"id": "5.12", "t": 5, "n": 12, "q": "Según los criterios de priorización descritos en el tema, ¿qué pregunta se formula bajo el concepto de «ventana de acción»?", "o": ["¿Afecta esto a mi sector o territorio?", "¿Puedo hacer algo antes de que sea tarde?", "¿Cuál es el coste económico total del incidente?", "¿Quién es el proveedor de la información?"], "c": [1], "e": "La «ventana de acción» pregunta: ¿puedo hacer algo antes de que sea tarde?", "nota": ""}, {"id": "5.13", "t": 5, "n": 13, "q": "Ante un indicador que llega a la unidad, ¿cuáles son las tres opciones de triaje explícito descritas en el tema?", "o": ["Aceptar, rechazar y archivar", "Bloquear, monitorizar o descartar", "Cifrar, compartir y eliminar", "Escalar, ignorar y denunciar"], "c": [1], "e": "Las tres opciones de triaje explícito son bloquear, monitorizar o descartar.", "nota": ""}, {"id": "5.14", "t": 5, "n": 14, "q": "¿Qué caracteriza a las operaciones Cronos y Endgame citadas como ejemplo desde la mirada policial?", "o": ["Campañas de smishing bancario en España", "Coordinaciones internacionales de gran escala contra infraestructuras criminales, con servidores dados de baja y colaboración público-privada", "Ejercicios exclusivamente teóricos sin resultados operativos", "Procedimientos internos de un único SOC empresarial"], "c": [1], "e": "Cronos y Endgame son coordinaciones internacionales a gran escala contra infraestructuras criminales, con servidores dados de baja y colaboración público-privada.", "nota": ""}, {"id": "5.15", "t": 5, "n": 15, "q": "¿Qué aporta característicamente el sector privado a un modelo de colaboración público-privada, según el tema, frente a lo que aporta el sector público?", "o": ["Capacidad sancionadora y coordinación internacional", "Velocidad, volumen de telemetría y capacidad técnica de análisis", "Ninguna aportación relevante", "Exclusivamente financiación pública"], "c": [1], "e": "El sector privado aporta velocidad, volumen de telemetría y capacidad técnica de análisis; el público, capacidad sancionadora y coordinación.", "nota": ""}, {"id": "5.16", "t": 5, "n": 16, "q": "¿Qué condición señala el tema como imprescindible para que la colaboración público-privada deje de «chirriar» y resulte sostenible en el tiempo?", "o": ["Que el sector privado renuncie a cualquier contrapartida", "Que ambas partes reciban una contrapartida proporcional a su aportación, como contexto operativo a cambio de indicadores", "Que solo el sector público participe en la toma de decisiones", "Que se elimine cualquier canal de comunicación directa"], "c": [1], "e": "Para que sea sostenible, ambas partes deben recibir una contrapartida proporcional: contexto operativo a cambio de indicadores.", "nota": ""}, {"id": "5.17", "t": 5, "n": 17, "q": "¿Qué elemento arquitectónico ejecuta automáticamente la respuesta ante una alerta ya priorizada, aplicando de forma consistente el mismo protocolo que aplicaría un analista manualmente?", "o": ["El TIP", "El SOAR", "El ISAC", "El EDR"], "c": [1], "e": "El SOAR ejecuta automáticamente la respuesta ante una alerta ya priorizada, con el mismo protocolo que seguiría un analista.", "nota": ""}, {"id": "5.18", "t": 5, "n": 18, "q": "¿Qué perfil consumidor de ciberinteligencia necesita típicamente, según el tema, saber qué recursos exige el problema y qué decisión política o de asignación de medios sostiene?", "o": ["El SOC de una empresa", "El decisor institucional", "El investigador policial", "La unidad de inteligencia criminal"], "c": [1], "e": "El decisor institucional necesita saber qué recursos exige el problema y qué decisión política o de asignación de medios sostiene.", "nota": ""}, {"id": "5.19", "t": 5, "n": 19, "q": "¿Por qué se afirma en el tema que un mismo informe de ciberinteligencia debe adoptar en la práctica varias versiones o niveles de detalle?", "o": ["Porque la ley lo exige en todos los casos sin excepción", "Porque existen al menos cinco perfiles de consumidor con necesidades y horizontes temporales distintos", "Porque cada versión debe redactarse en un idioma distinto", "Porque el SIEM solo admite un formato de informe por trimestre"], "c": [1], "e": "Hay al menos cinco perfiles de consumidor con necesidades y horizontes temporales distintos, así que el informe debe adaptarse.", "nota": ""}, {"id": "5.20", "t": 5, "n": 20, "q": "¿Cuál de las siguientes afirmaciones resume mejor la regla aplicada en la rutina de consumo de ciberinteligencia dentro de una unidad?", "o": ["Cada entrada debe leerse una sola vez y archivarse sin más acción", "Cada entrada convertida en una tarea clara —descartar, monitorizar, escalar o accionar— resulta más operativa que una bandeja sin clasificar", "Toda entrada debe escalarse automáticamente al decisor institucional", "Ninguna entrada debe revisarse salvo que provenga de una fuente policial"], "c": [1], "e": "La regla es que cada entrada se convierta en una tarea clara (descartar, monitorizar, escalar o accionar), no en una bandeja sin clasificar.", "nota": ""}];
const KEY='asig06_testresumen_v1';
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let filter='all',term='',tema=0;
const L='abcdef';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;

function render(){
  const list=$('list');list.innerHTML='';
  let shown=0;
  DATA.forEach(q=>{
    const r=st[q.id];const status=r?(r.ok?'ok':'ko'):'pend';
    if(filter!=='all'&&status!==filter)return;
    if(tema&&q.t!==tema)return;
    if(term&&!norm(q.q+' '+q.o.join(' ')).includes(term))return;
    shown++;
    const card=document.createElement('section');
    card.className='q'+(r?' locked '+status:'');card.id='q'+q.id.replace('.','_');
    const sel=new Set(r?r.sel:[]);
    let h=`<div class="qh"><span class="num">T${q.t} · ${q.n}</span><p class="qt">${esc(q.q)}</p></div>`;
    q.o.forEach((t,i)=>{
      let c='opt';
      if(r){if(q.c.includes(i))c+=' right';else if(sel.has(i))c+=' wrong';}
      else if(sel.has(i))c+=' sel';
      const tag=r?(q.c.includes(i)?'✓ Correcta':(sel.has(i)?'✗ Tu respuesta':'')):'';
      h+=`<label class="${c}"><input type="checkbox" data-i="${i}" ${sel.has(i)?'checked':''} ${r?'disabled':''}><span class="l">${L[i]})</span><span>${esc(t)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    h+=`<div class="act"><button class="check" ${r||!sel.size?'disabled':''}>Comprobar respuesta</button><button class="btn retry" ${r?'style="display:inline-block"':''}>Reintentar</button></div>`;
    if(r){
      const right=q.c.map(i=>L[i]+')').join(', ');
      h+=`<div class="fb ${r.ok?'ok':'ko'}"><strong class="v">${r.ok?'✓ ¡Correcto!':'✗ Incorrecto'} ${r.ok?'':'· La respuesta correcta es la '+right}</strong>${esc(q.e)}${q.idota?`<div class="nota"><b>Nota:</b> ${esc(q.idota)}</div>`:''}</div>`;
    }
    card.innerHTML=h;
    const boxes=[...card.querySelectorAll('input')];
    const btn=card.querySelector('.check');
    boxes.forEach(b=>b.addEventListener('change',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      b.closest('.opt').classList.toggle('sel',b.checked);
      btn.disabled=!cur.length;
      st['_d'+q.id]=cur;
    }));
    btn.addEventListener('click',()=>{
      const cur=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);
      if(!cur.length)return;
      const ok=cur.length===q.c.length&&cur.every(i=>q.c.includes(i));
      st[q.id]={sel:cur,ok};save();replace(q.id);
    });
    card.querySelector('.retry').addEventListener('click',()=>{delete st[q.id];save();replace(q.id);});
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<p class="empty">No hay preguntas que coincidan con el filtro.</p>';
  stats();
}
function replace(n){ // re-render keeping scroll position on the card
  const y=window.scrollY,top=($('q'+String(n).replace('.','_'))||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;
  render();const el=$('q'+String(n).replace('.','_'));
  if(el&&filter==='all'&&!term)window.scrollTo(0,y+el.getBoundingClientRect().top-top);
}
function stats(){
  const v=Object.keys(st).filter(k=>!k.startsWith('_')).map(k=>st[k]);
  const ok=v.filter(x=>x.ok).length,ko=v.length-ok,n=DATA.length;
  $('sAns').textContent=v.length+' / '+n;$('sOk').textContent=ok;$('sKo').textContent=ko;
  $('sPct').textContent=v.length?Math.round(ok/v.length*100)+'%':'–';
  $('bg').style.width=ok/n*100+'%';$('br').style.width=ko/n*100+'%';
}
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  filter=b.dataset.f;[...$('chips').children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();window.scrollTo(0,0);
});
$('tema').addEventListener('change',e=>{tema=+e.target.value;render();window.scrollTo(0,0);});
$('find').addEventListener('input',e=>{term=norm(e.target.value.trim());render();});
$('reset').addEventListener('click',()=>{if(confirm('¿Borrar todas las respuestas y empezar de nuevo?')){st={};save();render();window.scrollTo(0,0);}});
render();
</script>
</body>
